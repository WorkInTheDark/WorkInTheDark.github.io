# PhD Simulator leaderboard: a Cloudflare Worker with a D1 database. Setup: README.md.
name = "phd-sim-board"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The API on your own domain. Deploying creates the DNS record (bingshengyao.com must be in this
# Cloudflare account). Comment this out to use only the *.workers.dev address.
routes = [{ pattern = "api.bingshengyao.com", custom_domain = true }]

# Pages allowed to call the API. ADMIN_TOKEN and HASH_SALT are secrets: set them in the dashboard
# (Settings → Variables and Secrets) or with `npx wrangler secret put ADMIN_TOKEN`.
[vars]
ALLOWED_ORIGINS = "https://www.bingshengyao.com,https://bingshengyao.com"

[[d1_databases]]
binding = "DB"
database_name = "phd-sim-board"
database_id = "fb4e1f66-5b4b-4fa9-8f06-69e02632b519"
