"0":
  title: Foundations
  description: Why research is fundamentally different from coursework, and how the rewarding mechanisms diverge.

"1":
  title: The Mental Models That Matter Most
  description: The standards, persistence, and sense of direction that shape a research career, and why they are worth settling early.

"2":
  title: Day-to-Day Research Skills
  description: Practical, repeatable techniques for the research craft, starting with how to survey the literature.

"3":
  title: The Architecture of a Research Project
  description: How to build a coherent motivation, formulate a research question, and design a study that holds up under scrutiny.

"4":
  title: Your Wellbeing Is Your Research
  description: Why taking care of yourself is not separate from doing good work, and how to sustain yourself through the long stretches of a PhD.

