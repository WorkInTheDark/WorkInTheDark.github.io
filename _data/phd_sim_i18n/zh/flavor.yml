# zh translations for flavor (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "You open final_v3_REAL_final.tex."
  zh: "你打开了 final_v3_REAL_final.tex。"
- en: "The coffee machine breaks. Lab productivity falls by a third."
  zh: "咖啡机坏了，全组战斗力当场掉了三分之一。"
- en: "The building's heating is either off or set to Sahara."
  zh: "楼里的暖气只有两档：冰窖和撒哈拉。"
- en: "Your experiment finishes. It was the wrong config."
  zh: "实验终于跑完了，结果发现配置用错了。"
- en: "The printer jams the morning of your poster session."
  zh: "海报展示当天早上，打印机准时卡纸。"
- en: "An undergrad calls you \"professor\". You don't correct them."
  zh: "有个本科生喊你“教授”。你默默应下了。"
- en: "You accidentally reply-all to the department list."
  zh: "你手滑点了“全部回复”，邮件发给了全系。原地社死。"
- en: "Your virtual background slips during a job interview. Your laundry makes a brief appearance."
  zh: "求职面试时虚拟背景突然失灵，晾着的衣服抢了个镜。"
- en: "The fire alarm goes off during your practice talk."
  zh: "你试讲到一半，火警响了。"
- en: "A \"quick sync\" is booked for 90 minutes."
  zh: "说是“简单碰一下”，会议一约就是 90 分钟。"
- en: "A package update breaks your Python environment."
  zh: "某个包更新了一下，你的 Python 环境原地爆炸。"
- en: "An hour-long bug turns out to be a typo in a config key."
  zh: "查了一小时的 bug，最后发现是配置里一个键名拼错了。"
- en: "You find your own paper on a course reading list, described wrongly."
  zh: "你的论文上了某门课的阅读清单，介绍还写错了。"
- en: "\"Can you hear me?\" Four times, at the start of every meeting."
  zh: "每次开会，都要先来四遍“能听到吗？”"
- en: "Your paper gets cited for the opposite of what it says."
  zh: "有人引用了你的论文，引的观点和你写的正好相反。"
- en: "Orientation week. The new students still believe the GPU queue is a myth."
  zh: "新生入学周。萌新们还以为 GPU 排队只是个传说。"
- en: "Fall semester starts. The lab fridge still holds three yogurts from last spring."
  zh: "秋季学期开学了。实验室冰箱里还躺着去年春天的三盒酸奶。"
- en: "Three people at the department Halloween party come dressed as chatbots."
  zh: "系里的万圣节派对上，有三个人 cos 了聊天机器人。"
- en: "The lab is empty for Thanksgiving week. The GPUs are all yours."
  zh: "感恩节那周，实验室人去楼空。卡全归你了，感恩。"
- en: "Finals week. The library has no free seats and one working outlet."
  zh: "期末周。图书馆一座难求，能用的插座只有一个。"
- en: "You grade the same wrong answer 43 times."
  zh: "同一个错误答案，你批改了 43 遍。"
- en: "Office hours before the midterm. The line reaches the elevator."
  zh: "期中考试前的答疑时间，队伍排到了电梯口。"
- en: "Winter break. The building is quiet, and the heating has gone home too."
  zh: "寒假。楼里静悄悄的，暖气也放假回家了。"
- en: "Your out-of-office reply says you're on break. You answer emails anyway."
  zh: "邮件自动回复写着“休假中”，可你照样秒回。"
- en: "New semester, new to-do list. It looks a lot like the old one."
  zh: "新学期新气象，可待办清单还是老样子。"
- en: "It's dark by 4:30 pm. Your body clock files a complaint."
  zh: "下午 4:30 天就黑了，生物钟连夜写了篇投诉小作文。"
- en: "The lab group chat fills with red envelope emojis."
  zh: "实验室群里刷满了红包表情，真红包一个没有。"
- en: "Spring break. The undergrads leave, and the campus Wi-Fi finally works."
  zh: "春假。本科生都走了，校园 Wi-Fi 终于满血复活。"
- en: "The trees outside the lab bloom. You admire them through the window."
  zh: "实验室窗外的花开了，你隔着玻璃赏了一会儿。"
- en: "Regrade requests arrive, all sent after midnight."
  zh: "求改分的邮件陆续到了，全是凌晨发的。"
- en: "Annual review season. You list your accomplishments, then add some stronger verbs."
  zh: "年度考核季。你列完自己的成果，又把“参与”都改成了“主导”。"
- en: "Summer starts. The campus is quiet and the parking is easy."
  zh: "夏天到了。校园很安静，车位随便挑。"
- en: "Half the lab is on internships. Lab meeting is three people and a laptop."
  zh: "组里一半人去实习了，组会就剩三个人加一台笔记本。"
- en: "The building's AC gives up in the heat wave. The server room is the coolest place on campus."
  zh: "热浪来袭，楼里空调罢工。机房成了全校最凉快的避暑胜地。"
- en: "The new cohort arrives. They all have better laptops than you."
  zh: "新一届学生来了。人均笔记本都比你的好。"
- en: "The lab chat gains eleven new members, and eleven new questions about the cluster."
  zh: "实验室群里进了 11 个新人，外加 11 个“集群怎么用”。"
- en: "Half the lab is coughing. The other half is wearing masks and looking worried."
  zh: "组里一半人在咳嗽，另一半戴着口罩，提心吊胆。"
- en: "Someone microwaves fish in the lab kitchen again."
  zh: "又有人在实验室茶水间用微波炉热鱼。"
- en: "Lab meeting runs 40 minutes over. Nobody knows why."
  zh: "组会超时 40 分钟，没人说得清为什么。"
- en: "The lab fridge has a sign that says \"Please label your food\". The sign is not labeled."
  zh: "实验室冰箱上贴着“食物请写名字”。这张纸条没写名字。"
- en: "A labmate brings homemade cookies. Productivity rises briefly, then falls."
  zh: "同门带来自己烤的饼干。全组效率先升后降，标准的倒 U 型曲线。"
- en: "Someone renames the lab Wi-Fi to \"Reviewer2_Is_Watching\"."
  zh: "有人把实验室 Wi-Fi 改名成了“Reviewer2_Is_Watching”。"
- en: "The most senior student in the lab tells a deadline story with three morals."
  zh: "组里年级最高的博士生又讲起当年赶 DDL 的故事，附赠三条教训。"
- en: "You find a comment in the lab codebase that just says \"sorry\"."
  zh: "你在实验室代码库里发现一行注释，只写着“sorry”。"
- en: "The group chat debates lunch for an hour. Everyone eats at their desk."
  zh: "群里讨论了一小时午饭吃啥。最后全员在工位上吃外卖。"
- en: "The GPU queue has 412 jobs ahead of yours. You read a paper instead."
  zh: "GPU 队列里你前面还排着 412 个任务，你只好先去读篇论文。"
- en: "Your loss curve goes down smoothly. You don't trust it."
  zh: "loss 曲线降得太丝滑了，你反而不敢信。"
- en: "You spend an hour making a figure colorblind-friendly. It also prints better now."
  zh: "你花了一小时把图改成色盲友好的配色，没想到打印出来也更好看了。"
- en: "Your random seed is 42, like everyone else's."
  zh: "你的随机种子是 42，和所有人一样。"
- en: "Your experiment log says \"try again tomorrow\". It was written three weeks ago."
  zh: "实验日志上写着“明天再试”。落款是三周前。"
- en: "A bug in your evaluation script makes your results worse and more honest."
  zh: "你在评测脚本里揪出一个 bug。修完之后，结果变差了，也更真实了。"
- en: "Overleaf reports 37 errors. The PDF looks fine."
  zh: "Overleaf 报了 37 个错误。PDF 看着好好的，那就当没错。"
- en: "You rename a file from results to results_new to results_final to results_final2."
  zh: "你把文件从 results 改名成 results_new，再改成 results_final，再改成 results_final2。"
- en: "Your notes from last month say \"KEY INSIGHT\" with nothing after it."
  zh: "上个月的笔记里写着“重大发现：”，后面什么都没写。"
- en: "The paper you need is behind a paywall. Your university has access, but your VPN doesn't."
  zh: "你要的论文得付费才能看。学校明明买了，可你挂着 VPN 还是打不开。"
- en: "A tokenizer splits your name into five pieces."
  zh: "分词器把你的名字切成了 5 段。"
- en: "Your model answers every question with a confident paragraph about penguins."
  zh: "不管问什么，你的模型都一本正经地讲起企鹅。"
- en: "Your prompt is now longer than your abstract."
  zh: "你的 prompt 已经比论文摘要还长了。"
- en: "Someone at lab meeting says \"just fine-tune it\" as if it's one step."
  zh: "组会上有人说“微调一下就行”。把大象装进冰箱还要三步呢。"
- en: "Your baseline gets better after you fix a bug. Your method doesn't."
  zh: "修完一个 bug，baseline 涨点了，你的方法却纹丝不动。"
- en: "You read a paper that solves your problem. It's from 1998."
  zh: "你读到一篇论文，正好解决了你的问题。一看年份：1998。"
- en: "A related-work search for your topic returns your own paper first."
  zh: "你搜相关工作，排第一的是你自己的论文。"
- en: "Your job crashes at 98%."
  zh: "任务跑到 98% 崩了。当场破防。"
- en: "Your annotation guidelines are now 14 pages long. Nobody agrees on what counts as \"neutral\"."
  zh: "标注指南已经写到 14 页了，可还是没人说得清什么算“中性”。"
- en: "Inter-annotator agreement comes back at 0.41. You learn the word \"moderate\"."
  zh: "标注者间一致性算出来是 0.41，你学会了一个体面的说法：“中等一致”。"
- en: "You compute Cohen's kappa three times and get three different numbers."
  zh: "你算了三遍 Cohen's kappa，得到三个不同的数。"
- en: "A study participant asks whether the chatbot in your study is a real person."
  zh: "有位参与者问你，研究里的聊天机器人是不是真人。"
- en: "Your think-aloud participant thinks very quietly."
  zh: "你让参与者出声思考。参与者只思考，不出声。"
- en: "A participant rates your prototype 7 out of 7, then says they never clicked it."
  zh: "有个参与者给你的原型打了满分 7 分，接着说自己压根没点开过。"
- en: "A pilot participant finds the bug you hunted all week. It takes them four seconds."
  zh: "你找了一周的 bug，预实验的参与者 4 秒就找到了。"
- en: "The anchor on your survey scale says \"Strongly Disagre\". It's been live for a day."
  zh: "量表上的“非常不同意”打成了“非常不同”，可问卷已经上线一天了。"
- en: "Your interview transcript has 40 instances of \"um\". Thirty-eight are yours."
  zh: "访谈转录稿里有 40 个“嗯”。其中 38 个是你说的。"
- en: "The IRB asks you to change \"may\" to \"might\" on page 12."
  zh: "伦理审查 (IRB) 要求你把第 12 页的“可能”改成“或许”。"
- en: "A clinician partner replies to a three-paragraph email with one word: \"Thursday?\""
  zh: "你给合作的临床医生写了三段话，对方只回了两个字：“周四？”"
- en: "A participant stays after the session to tell you how to fix your whole interface. They're right."
  zh: "一位参与者结束后没走，教你整个界面该怎么改。你竟无法反驳。"
- en: "You spend an afternoon choosing between \"utilize\" and \"use\". You choose \"use\"."
  zh: "你花了一下午在“utilize”和“use”之间纠结。最后选了“use”。"
- en: "You now notice orphan words in other people's papers."
  zh: "你开始注意到别人论文里独占一行的单词了。"
- en: "Your abstract is 251 words. The limit is 250."
  zh: "摘要写了 251 个词，上限是 250。"
- en: "Your bibliography has the same paper three times, with three different years."
  zh: "你的参考文献里同一篇论文出现了三次，年份还各不相同。"
- en: "You move a figure up one line. LaTeX moves it two pages down."
  zh: "你把一张图往上挪了一行。LaTeX 反手把它挪到了两页之后。"
- en: "Your paper title has a colon, like every other title on the reading list."
  zh: "你的论文标题里有个冒号，跟阅读清单上的其他标题一个样。"
- en: "You write \"Interestingly,\" and then delete it. Then you write it again."
  zh: "你写下“Interestingly,”，删掉，想了想，又写了回去。"
- en: "Your conference badge spells your name wrong. You answer to it all week."
  zh: "参会胸牌把你的名字拼错了。你将错就错，应了一整周。"
- en: "The line for coffee is longer than the line for the keynote."
  zh: "买咖啡的队，比听主旨报告的队还长。"
- en: "You come home with four tote bags and no memory of picking them up."
  zh: "你带回了四个帆布袋，完全不记得是什么时候拿的。"
- en: "Everyone at your poster asks the same question. You start answering before they finish."
  zh: "来看海报的人都问同一个问题。到后来，对方刚开口你就答完了。"
- en: "You meet someone whose papers you've cited six times. You forget their name instantly."
  zh: "你见到了一位自己引用过六次的作者，转头就忘了人家叫什么。"
- en: "Your advisor replies at 12:40 am: \"Great figure. No need to reply until Monday.\""
  zh: "导师凌晨 0:40 回复：“图做得很好。周一之前不用回。”"
- en: "Your advisor buys bubble tea for everyone who came to lab meeting in person."
  zh: "导师给所有线下来开组会的人点了奶茶。"
- en: "Your advisor spots an orphan word on page 6 of your draft."
  zh: "导师发现你初稿第 6 页有个单词独占一行。"
- en: "Your advisor answers your email from a different airport than last week."
  zh: "导师又在机场回了你的邮件，和上周不是同一个机场。"
- en: "Your advisor schedules a check-in about your check-in."
  zh: "导师约你开个会，聊聊你们开会的事。"
- en: "Your advisor has a new grant and, with it, a new spreadsheet."
  zh: "导师拿到一笔新经费，附赠一张新表格。"
- en: "Your advisor pitches a startup idea over lunch. It's the third one this month."
  zh: "导师午饭时又讲了个创业点子，这个月已经第三个了。"
- en: "Your advisor asks whether your p-value survived the correction."
  zh: "导师问你，p 值做完校正还挺得住吗。"
- en: "Your advisor tells a story from 1994 that turns out to be exactly relevant."
  zh: "导师讲起 1994 年的往事，没想到正好切题。"
- en: "Your advisor sketches a ten-year research vision on a napkin."
  zh: "导师在餐巾纸上画出了未来十年的研究蓝图。"
- en: "Your advisor sends you a paper at 6 am with the subject line \"!!\"."
  zh: "导师早上 6 点给你发了一篇论文，邮件主题只有“！！”。"
- en: "Your advisor apologizes that the travel budget is, once again, mostly hope."
  zh: "导师一脸歉意地说，这次的差旅经费又只能靠爱发电了。"
- en: "Your advisor forwards a message from the company side with one word: \"thoughts?\""
  zh: "导师转发了一条公司那边的消息，只附了一句：“怎么看？”"
- en: "Your cat sits on the exact paragraph you're reading."
  zh: "猫一屁股坐在你正在读的那一段上。"
- en: "Your cat knocks your coffee off the desk, then looks at you."
  zh: "猫把你的咖啡从桌上推了下去，然后静静地看着你。"
- en: "The lab whiteboard still has equations from 2019. Nobody dares erase them."
  zh: "实验室白板上还留着 2019 年的公式。祖传的，没人敢擦。"
- en: "Your citation profile gets merged with someone who has a similar name. You now have three papers on dairy cattle."
  zh: "你的学术主页和一个名字差不多的人合并了，于是你喜提三篇奶牛研究论文。"
- en: "A squirrel outside the window becomes the lab mascot. It now has its own channel in the lab chat."
  zh: "窗外的一只松鼠成了实验室吉祥物，现在还有了自己的专属群聊。"
- en: "The vending machine eats your last dollar. The granola bar hangs there, just out of reach."
  zh: "自动售货机吞了你最后一块钱。燕麦棒卡在半空，近在咫尺，远在天涯。"
- en: "You name your model after a faction from your favorite sci-fi novel. The reviewers don't get the reference."
  zh: "你用最喜欢的科幻小说里的一个派系给模型起名，可惜审稿人没 get 到。"
