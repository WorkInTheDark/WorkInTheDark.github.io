# zh translations for tips (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Classes have answers in the back of the book. Research doesn't, so the sooner you stop looking for them, the better."
  zh: "上课做题，答案印在书的最后几页。做研究没有，你越早别再翻找越好。"
- en: "Ask yourself why you're here, and be more honest than your statement of purpose was."
  zh: "问问自己为什么来读博。这次要比写个人陈述时诚实一点。"
- en: "A harsh review is a free lesson from someone who read your paper closely. It just doesn't feel free."
  zh: "狠的审稿意见，是认真读过你论文的人免费给你上的一课。只是这课上得一点都不像免费的。"
- en: "If citations are the only thing keeping you going, you'll run dry. Find what you'd do even if nobody cited it."
  zh: "如果支撑你的只有引用数，你迟早会被掏空。找到那件就算没人引用，你也愿意做的事。"
- en: "The degree is just the receipt for what you actually bought: the training."
  zh: "学位只是一张收据。你真正买到的，是这几年的训练。"
- en: "Don't aim for borderline. Borderline is a coin flip with extra steps."
  zh: "别只求踩线。踩线就是多了几道手续的抛硬币。"
- en: "Whatever you promised in that rebuttal, do it. People remember who delivers."
  zh: "rebuttal 里答应了什么，就去做到。谁说到做到，大家都记得。"
- en: "Stop counting other people's papers. You aren't running the same race."
  zh: "别再数别人发了几篇了。你们跑的不是同一场比赛。"
- en: "When you get stuck, learn the method behind the fix. You'll be stuck again."
  zh: "卡住的时候，要学会解法背后的方法。你以后还会再卡住的。"
- en: "Everyone starts strong. The middle years are the hard part, so pace yourself to finish."
  zh: "谁刚开始都劲头十足。难的是中间那几年，所以要控制好节奏，跑到终点。"
- en: "At some point it stops being your advisor's agenda. Make sure it becomes yours."
  zh: "总有一天，这不再只是导师的研究方向。要让它变成你自己的。"
- en: "Snowball from one great paper: what it cites, and what cites it. Two hours of that beats a week of keyword searching."
  zh: "从一篇好论文开始滚雪球：看它引了谁，又被谁引了。这样花两小时，胜过搜一周关键词。"
- en: "Not every paper deserves a full read. Learn which ones do."
  zh: "不是每篇论文都值得从头读到尾。要学会分辨哪些值得。"
- en: "To learn a method, pick a paper you admire and work out how they did it."
  zh: "想学一种方法，就挑一篇你佩服的论文，琢磨作者是怎么做出来的。"
- en: "Walk into advisor meetings with answers, and walk out with better ones."
  zh: "带着答案去见导师，带着更好的答案出来。"
- en: "If you can delete a paragraph and nothing breaks, delete it."
  zh: "如果删掉一段什么都不影响，那就删掉。"
- en: "Write for a tired reviewer who is reading your paper fourth today."
  zh: "写的时候，想象一个累坏了的审稿人，你这篇已经是对方今天读的第四篇。"
- en: "Before you start a project, try answering ten hard questions about it. The ones you can't answer show you where to start."
  zh: "开始一个项目前，先试着回答关于它的十个难题。答不上来的那几个，就是你该下手的地方。"
- en: "If you can't state your research question in one sentence, you don't have one yet."
  zh: "如果你没法用一句话说清研究问题，那你其实还没有研究问题。"
- en: "Who cares, and what has already been done? Answer those two and the introduction writes itself."
  zh: "谁在乎这个问题？已经有人做过什么？答好这两个，引言自己就写出来了。"
- en: "Your method should follow from the gap. If it doesn't, one of them is wrong."
  zh: "方法应该从研究空白里自然推出来。如果推不出来，那两者之中有一个错了。"
- en: "Watch what people actually do between the clicks. That's where the design problems are."
  zh: "去看用户在两次点击之间到底在干什么。设计问题就藏在那里。"
- en: "A result is a number. A finding says what the number means, and that's what reviewers want."
  zh: "结果是一个数字。发现是说清这个数字意味着什么，审稿人要的是后者。"
- en: "Pick the venue whose readers will care most, not the one with the nicest logo."
  zh: "选读者最在乎这项工作的会，而不是 logo 最好看的那个。"
- en: "Burnout builds up slowly, one skipped weekend at a time."
  zh: "倦怠是慢慢攒起来的，一个没休的周末接着一个。"
- en: "Your limits change every year of the PhD, so check them again."
  zh: "读博的每一年，你的极限都不一样，所以要时常重新确认。"
- en: "Closing the laptop doesn't count as rest if you're still thinking about work."
  zh: "合上电脑，脑子里还在想工作，那不算休息。"
- en: "You only have a few real hours of deep focus a day. Spend them on the hard part."
  zh: "一天里真正能深度专注的只有几个小时。把它们花在最难的部分上。"
