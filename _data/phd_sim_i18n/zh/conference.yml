# zh translations for conference (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "{city}, Sunday evening. The registration desk hands you a badge, a tote bag and a program as thick as a thesis. The welcome reception started an hour ago."
  zh: "{city}，周日傍晚。注册台递给你一个胸牌、一个帆布袋，还有一本厚得像博士论文的会议手册。欢迎酒会一小时前就开始了。"
- en: "You land in {city} after a day of airports. The hotel lobby is full of people wearing {venue} lanyards and staring at their phones."
  zh: "在机场折腾了一整天，你终于落地{city}。酒店大堂里全是挂着 {venue} 挂绳、低头看手机的人。"
- en: "You check into the hotel in {city}, drop your bag and open the program. Four days, nine parallel tracks, and a welcome reception in an hour."
  zh: "你在{city}的酒店办好入住，放下行李，翻开会议日程：四天，九个分会场同时开讲，欢迎酒会一小时后开始。"
- en: "The convention center hums. Nine parallel sessions, a hall full of posters, and a coffee line that never gets shorter."
  zh: "会展中心里人声嗡嗡。九个分会场同时开讲，一整个大厅的海报，还有一条永远不见变短的咖啡队。"
- en: "Another day at {venue}. The conference app crashed overnight, so everyone is following a printed schedule, and each other."
  zh: "{venue} 的又一天。会议 App 昨晚崩了，大家只好照着纸质日程走，或者干脆跟着别人走。"
- en: "The morning keynote is packed. The hallway outside is just as busy: people who skipped the keynote to talk to each other."
  zh: "早上的主旨演讲座无虚席。外面走廊也一样热闹：都是翘了主旨演讲出来聊天的人。"
- en: "Lunch is a boxed sandwich eaten standing up. The afternoon has three sessions you wanted to see, all at the same time."
  zh: "午饭是站着吃的盒装三明治。下午有三场你想听的报告，全撞在同一个时间。"
- en: "Evening in {city}. Your group chat has four dinner plans, two bar plans and one person asking if anyone has a charger."
  zh: "{city}的夜晚。群里有四个饭局、两个酒局，还有一个人在问谁带了充电器。"
- en: "The sessions are over for the day, and the other conference begins: dinners, bars, and people you've only ever known as names on papers."
  zh: "白天的报告结束了，另一场“会议”才刚开始：饭局、酒吧，还有那些你只在论文署名里见过的人。"
- en: "Your feet hurt. Your phone says you walked 18,000 steps without leaving the building. There's still a whole evening ahead."
  zh: "脚好疼。手机说你今天没出会场就走了 1.8 万步。可晚上还长着呢。"
- en: "You present tomorrow. Everyone around you is heading out to dinner, and you're in the hotel room, staring at your own figures."
  zh: "明天就轮到你了。身边的人都出去吃饭了，你还在酒店房间里，盯着自己的图发呆。"
- en: "Tomorrow is your turn. You've checked the time and the place three times. A labmate asks if you're coming out tonight."
  zh: "明天就是你上场。时间和地点你已经确认了三遍。有个同门问你今晚出不出去。"
- en: "It's done. You presented at {venue}. The adrenaline is wearing off, and you're suddenly starving."
  zh: "讲完了。你在 {venue} 做完了报告。肾上腺素慢慢退去，你突然饿得不行。"
- en: "Your part is over. For the first time this week, you can actually enjoy the conference."
  zh: "你的任务完成了。这周第一次，你可以真正享受这场会议了。"
- en: "Your session starts at 10:30 in a room with three hundred chairs. You're the third speaker. Your laptop is at 64% battery."
  zh: "你那场 10:30 开始，会场有三百把椅子。你是第三个讲的。笔记本电量还剩 64%。"
- en: "You find the room, check in with the session chair and test the projector. Fifteen minutes to go. The room is filling up."
  zh: "你找到会议室，跟主持人报了到，试了试投影。还有十五分钟。人越来越多。"
- en: "The poster hall is the size of an airplane hangar. Your board is number 214. You have pushpins, a water bottle and two hours on your feet."
  zh: "海报大厅大得像飞机库。你的展板是 214 号。你手里有图钉、一瓶水，还有要站满的两个小时。"
- en: "You pin up your poster at 9. By 9:15 the hall is roaring. Three hours to go, every one of them standing."
  zh: "你 9 点贴好海报。到 9:15，大厅里已经人声鼎沸。还有三个小时，全程站着。"
- en: "Wednesday night: the conference party, in what is clearly a converted warehouse. There's a DJ, free drinks, and every professor you've ever cited."
  zh: "周三晚上，会议派对。场地一看就是旧仓库改的。有 DJ，有免费酒水，还有你引用过的每一位教授。"
- en: "The party invitation says the dress code is \"whatever\", the most stressful dress code there is. Every big name in the field will be there."
  zh: "派对邀请函上写着着装要求：“随意”。这是世上最让人焦虑的着装要求。领域里的大佬都会来。"
- en: "The last day. Half the attendees have already left; the ones who stayed look tired and very relaxed. Your flight is this evening."
  zh: "最后一天。一半的人已经走了，留下来的看着都很累，也很放松。你的航班在今晚。"
- en: "Thursday. The final sessions are half empty, the coffee runs out by ten, and your suitcase is waiting at the hotel's front desk."
  zh: "周四。最后几场报告只坐了一半人，咖啡十点就没了，你的行李在酒店前台等着你。"
- en: "Go to the welcome reception"
  zh: "去参加欢迎酒会"
- en: "Name tags, small talk, finger food"
  zh: "胸牌、寒暄、小点心"
- en: "You balance a tiny plate and introduce yourself eleven times. Two of the names stick."
  zh: "你端着一个小碟子，自我介绍了十一遍。记住了两个名字。"
- en: "You find the only other person from your subfield and talk shop for an hour by the dessert table."
  zh: "你找到了全场唯一一个跟你同方向的人，在甜点桌旁聊了一个小时的专业。"
- en: "Walk around {city}"
  zh: "在{city}逛逛"
- en: "Stretch your legs after the flight"
  zh: "坐了一天飞机，活动活动腿脚"
- en: "You walk until {city} stops looking like a picture on your phone. The jet lag can wait."
  zh: "你一直走，直到{city}不再只是手机里的一张照片。时差的事以后再说。"
- en: "Go to bed early"
  zh: "早点睡"
- en: "You'll need it"
  zh: "你会需要的"
- en: "You're asleep by nine. You're also wide awake at four, staring at the ceiling, but that's jet lag's problem."
  zh: "你九点就睡着了。凌晨四点又精神抖擞地盯着天花板，不过那是时差的问题。"
- en: "Rehearse your talk"
  zh: "排练你的报告"
- en: "Smoother delivery, less of {city}"
  zh: "讲得更顺，但少逛逛{city}"
- en: "You give your talk to the hotel mirror four times. On the fourth, you finally stop saying \"um\" on slide 6."
  zh: "你对着酒店的镜子讲了四遍。讲到第四遍，第 6 页终于不再“那个……那个……”了。"
- en: "You time yourself: 14 minutes, 12 minutes, 17 minutes. You cut a slide you loved."
  zh: "你给自己计时：14 分钟、12 分钟、17 分钟。你忍痛删掉了一页最喜欢的幻灯片。"
- en: "You practice answering questions out loud to an empty room. The empty room is tough but fair."
  zh: "你对着空房间大声练习回答问题。空房间是个严格但公正的听众。"
- en: "Practice your poster pitch"
  zh: "练习海报讲解"
- en: "The one-minute and five-minute versions"
  zh: "一分钟版和五分钟版"
- en: "You practice the one-minute version and the five-minute version, then a ten-second version for people who are just walking by."
  zh: "你练了一分钟版和五分钟版，又练了个十秒版，留给只路过不停的人。"
- en: "You explain your poster to the hotel lamp until the explanation fits in one breath."
  zh: "你对着酒店的台灯讲海报，直到能一口气讲完。"
- en: "Go to the keynote"
  zh: "去听主旨演讲"
- en: "A famous name in a very big room"
  zh: "大人物，大会场"
- en: "The keynote speaker says the field is at a crossroads. They said that last year too, but the slides are better this time."
  zh: "主旨演讲嘉宾说，这个领域正站在十字路口。去年也是这么说的，不过今年的幻灯片好看多了。"
- en: "You take notes for the first twenty minutes and photos of slides for the rest."
  zh: "前二十分钟你在记笔记，后面就只顾着拍幻灯片了。"
- en: "Sit through the sessions in your area"
  zh: "坐满你方向的分会场"
- en: "Six talks in a row"
  zh: "连听六个报告"
- en: "Six talks in a row. Two are great, one is basically your next paper, and you lose the thread of the other three."
  zh: "连听六个报告。两个很精彩，一个简直就是你的下一篇论文，剩下三个你没跟上。"
- en: "You find a seat near an outlet and stay there all afternoon. Your notes get shorter with every talk."
  zh: "你找了个靠插座的位置，一下午没挪窝。每听一个报告，笔记就短一截。"
- en: "Ask a question in a session"
  zh: "在分会场提个问题"
- en: "Get up and speak at the mic"
  zh: "站到麦克风前开口"
- en: "Today you're going to ask a question. You pick a session, sit near the aisle and listen harder than you have all week."
  zh: "今天你要提一个问题。你挑了一场，坐在过道边，听得比这周任何时候都认真。"
- en: "Set up a coffee chat"
  zh: "约人喝咖啡聊聊"
- en: "Email someone whose work you admire"
  zh: "给你欣赏的研究者发邮件"
- en: "You send a nervous email to someone whose paper you've read three times. They reply in four minutes: \"Sure, 2:30 by the escalators?\""
  zh: "你给一位论文读过三遍的人发了封忐忑的邮件。四分钟后对方回复：“好啊，2:30 扶梯旁见？”"
- en: "You message a researcher you've only ever cited. They say yes. Now you have to think of something to say."
  zh: "你给一位只在参考文献里见过的研究者发了消息。对方答应了。现在你得想想聊什么。"
- en: "Work the hallway"
  zh: "在走廊里跟人聊天"
- en: "Skip a session and talk to people"
  zh: "翘一场报告，去跟人聊"
- en: "You skip a session to stand near the coffee urns. Within an hour you've talked to five people, one of whom you've cited twice."
  zh: "你翘了一场报告，守在咖啡桶旁边。一个小时里你跟五个人聊过，其中一位你引用过两次。"
- en: "You do laps of the hallway, saying hello to anyone who makes eye contact. It works better than it should."
  zh: "你在走廊里一圈圈地转，跟每个对上眼的人打招呼。效果好得出奇。"
- en: "Walk the poster session"
  zh: "逛海报展区"
- en: "Two hundred posters, two hours"
  zh: "两百张海报，两个小时"
- en: "Two hundred posters in two hours. You find three that matter to you, one that scoops a side project, and a free pen."
  zh: "两个小时看了两百张海报。三张跟你有关，一张抢先做了你的一个副项目，还领到一支免费的笔。"
- en: "You read posters until the words blur, and ask every presenter the same question. Their answers are all different."
  zh: "你看海报看到眼都花了，问每个讲者同一个问题，得到的答案各不相同。"
- en: "Go to the mentoring lunch"
  zh: "去参加午餐交流会"
- en: "Assigned tables, senior people"
  zh: "按桌分配，跟前辈同桌"
- en: "You share a table with a professor, two students and a startup founder. The professor talks about failing their quals. It helps more than you expected."
  zh: "你和一位教授、两个学生、一个创业公司创始人同桌。教授讲起自己当年资格考试没过的事。这比你想的更让人安心。"
- en: "Visit the industry booths"
  zh: "逛企业展台"
- en: "Free swag, recruiters"
  zh: "免费周边，还有招聘的人"
- en: "You collect four T-shirts, eleven stickers and a recruiter's card. One of the T-shirts fits."
  zh: "你领了四件 T 恤、十一张贴纸和一张招聘官的名片。其中一件 T 恤是你的尺码。"
- en: "Skip the afternoon and see {city}"
  zh: "翘掉下午，去逛{city}"
- en: "With whoever else is skipping"
  zh: "跟同样翘了的人一起"
- en: "You and a few people from the lab slip out after lunch. Nobody says the word \"paper\" for four whole hours."
  zh: "午饭后你和组里几个人溜了出去。整整四个小时，谁都没提“论文”两个字。"
- en: "Join the conference excursion"
  zh: "参加会议组织的出游"
- en: "One bus, one guide, forty researchers"
  zh: "一辆大巴，一个导游，四十个研究者"
- en: "The bus is full of researchers pretending not to talk about research. It lasts eleven minutes."
  zh: "大巴上全是假装不聊科研的研究者。这份克制坚持了十一分钟。"
- en: "Catch up on work in a café"
  zh: "找家咖啡馆补补工作"
- en: "The lab didn't stop because you left"
  zh: "你不在，组里也照样转"
- en: "You answer 31 emails, review a labmate's draft and feel almost in control. Outside, the conference goes on without you."
  zh: "你回了 31 封邮件，帮同门改了草稿，感觉一切差不多尽在掌握。窗外，会议照常进行，只是没有你。"
- en: "Go back to the hotel for a nap"
  zh: "回酒店睡个午觉"
- en: "Skip the afternoon sessions"
  zh: "翘掉下午的报告"
- en: "You sleep through two sessions and wake up unsure which country you're in. Worth it."
  zh: "你睡过了两场报告，醒来一时想不起自己在哪个国家。值了。"
- en: "Dinner with your lab"
  zh: "和组里一起吃晚饭"
- en: "{advisor} might pay"
  zh: "说不定{advisor}请客"
- en: "{advisor} takes the lab to a restaurant with a two-hour wait. You spend the wait hearing about conferences in the nineties."
  zh: "{advisor}带全组去了一家要排两小时队的餐厅。排队时你一直在听九十年代开会的故事。"
- en: "The lab finds a noodle place near the hotel and trades plans for the week: who presents when, which talks to see, which parties to crash."
  zh: "组里在酒店附近找了家面馆，顺便对一下这周的安排：谁哪天讲、听哪些报告、蹭哪些派对。"
- en: "Go to a sponsor's dinner"
  zh: "去赞助商的晚宴"
- en: "Free food, and a pitch for their platform"
  zh: "免费的饭，外加他们平台的推销"
- en: "The food is excellent, and the recruiting pitch lasts exactly as long as dessert."
  zh: "菜很好吃，招聘宣讲刚好和甜点一样长。"
- en: "Tag along to dinner with people you just met"
  zh: "跟刚认识的人去吃饭"
- en: "Twelve researchers, one long table"
  zh: "十二个研究者，一张长桌"
- en: "Someone says \"we're getting dinner, want to come?\" and suddenly you're at a table of twelve researchers splitting a bill nobody can figure out."
  zh: "有人说了句“我们去吃饭，一起吗？”，转眼你就坐到了一张长桌旁，周围十二个研究者，谁也算不清这顿饭该怎么分账。"
- en: "Go out with the other students"
  zh: "跟其他学生出去玩"
- en: "It'll be a late one"
  zh: "今晚会很晚"
- en: "You end up in a bar with students from six countries, ranking advisors by how fast they answer email. You get back at 2 am."
  zh: "你最后和来自六个国家的学生坐在一家酒吧里，按回邮件的速度给各自导师排了个名。凌晨 2 点才回去。"
- en: "Explore {city} at night"
  zh: "晚上逛逛{city}"
- en: "Street food, lights, no lanyard"
  zh: "小吃、灯光，不挂胸牌"
- en: "You take off your badge and walk. Street food, a river, a bridge with too many tourists. For two hours you're just visiting."
  zh: "你摘下胸牌出去走走。路边摊、一条河、一座游客挤得动不了的桥。这两个小时，你只是个游客。"
- en: "Call home"
  zh: "给家里打个电话"
- en: "It's morning there"
  zh: "那边是早上"
- en: "You call home from the hotel. It's breakfast there. They want to know whether you've eaten anything that wasn't a conference sandwich."
  zh: "你在酒店给家里打电话。那边正吃早饭。家里人想知道你这几天除了会场的三明治还吃过别的没有。"
- en: "Celebrate with the others from your session"
  zh: "和同场的讲者一起庆祝"
- en: "They're just as relieved"
  zh: "他们也一样松了口气"
- en: "The four speakers from your session end up at the same bar, still a little shaky, toasting the fact that you all survived the questions."
  zh: "你们那场的四位讲者最后都进了同一家酒吧，手还有点抖，举杯庆祝大家都熬过了提问环节。"
- en: "Early night"
  zh: "今晚早点睡"
- en: "Room service and bed"
  zh: "客房送餐，然后上床"
- en: "Room service, a shower with real water pressure, and nine hours of sleep. Your future self is grateful."
  zh: "客房送餐、一个水压够大的热水澡，再加九个小时的睡眠。未来的你会感谢现在的你。"
- en: "Go to the party and dance"
  zh: "去派对跳舞"
- en: "The DJ is surprisingly good"
  zh: "DJ 出乎意料地不错"
- en: "You dance. Your labmates dance. A very famous researcher busts out a move you will think about for years."
  zh: "你在跳。同门也在跳。一位大名鼎鼎的研究者跳了个舞步，你会记好几年。"
- en: "Work the room"
  zh: "满场社交"
- en: "Every big name is here, holding a drink"
  zh: "大佬都在，人手一杯酒"
- en: "You make the rounds holding a drink you never finish. By the end you've pitched your research eleven times, and the pitch is finally good."
  zh: "你端着一杯始终没喝完的酒到处转。到最后，你把自己的研究讲了十一遍，总算讲顺了。"
- en: "Stay for the after-party"
  zh: "去续摊"
- en: "Nobody remembers whose idea it was"
  zh: "没人记得是谁提议的"
- en: "The party ends at midnight. The after-party, at a karaoke bar someone found on their phone, ends at three. Your voice gives out at 2:30."
  zh: "派对午夜结束。续摊在某人用手机搜到的一家 KTV，凌晨三点才散。你的嗓子两点半就哑了。"
- en: "Skip it: room service and bed"
  zh: "不去了：客房送餐，然后睡觉"
- en: "You'll see the photos tomorrow"
  zh: "明天看照片就行"
- en: "You hear the bass through the hotel walls and fall asleep anyway. In the morning the photos look like a great party. You feel great too."
  zh: "低音隔着酒店的墙传进来，你照样睡着了。第二天早上，照片里的派对看起来很棒。你的状态也很棒。"
- en: "Go to the last sessions"
  zh: "去听最后几场报告"
- en: "Half empty, often the best"
  zh: "人少，往往最精彩"
- en: "The last session has eleven people in it, speakers included. The talks are excellent, and the questions turn into a conversation."
  zh: "最后一场算上讲者一共十一个人。报告都很精彩，提问环节变成了一场聊天。"
- en: "Write follow-up emails"
  zh: "写跟进邮件"
- en: "While the names are still fresh"
  zh: "趁名字还记得住"
- en: "You write to everyone whose name you collected, before you forget who said what. Three of them reply before you board."
  zh: "你给每个留了名字的人写邮件，趁还记得谁说过什么。登机前就有三个人回了你。"
- en: "See {city} before your flight"
  zh: "飞之前逛逛{city}"
- en: "Leave your bag at the hotel"
  zh: "行李寄存在酒店"
- en: "You leave your suitcase with the hotel and spend the last hours seeing what you missed. You buy gifts for the lab at the airport anyway."
  zh: "你把行李寄存在酒店，用最后几个小时去看之前错过的地方。给组里的礼物最后还是在机场买的。"
- en: "Head to the airport early"
  zh: "早点去机场"
- en: "Sleep at the gate"
  zh: "在登机口睡一会"
- en: "You get to the airport three hours early, find an outlet and sleep sitting up. Somewhere over the ocean, you start sketching your next paper."
  zh: "你提前三小时到了机场，找了个插座，坐着就睡着了。飞到大洋上空时，你开始构思下一篇论文。"
- en: "A professor in the front row"
  zh: "前排的一位教授"
- en: "A student at the microphone"
  zh: "麦克风前的一个学生"
- en: "Someone from industry"
  zh: "一位业界人士"
- en: "The session chair, filling a silence"
  zh: "分会场主持人，为了不冷场"
- en: "A famous name you only recognize after they've started talking"
  zh: "一位大佬，开口之后你才认出来"
- en: "Someone who was typing on their laptop the whole time"
  zh: "一个全程在敲笔记本的人"
- en: "A visitor with a coffee"
  zh: "一位端着咖啡的参观者"
- en: "A professor who reads every word before speaking"
  zh: "一位把每个字都读完才开口的教授"
- en: "A student who just took a photo of your poster"
  zh: "一个刚给你的海报拍了照的学生"
- en: "Did you compare against {fake_prior}? It seems like the obvious baseline."
  zh: "你们跟 {fake_prior} 比过吗？这看起来是最该比的 baseline。"
- en: "How big is the dataset, and how did you collect it?"
  zh: "数据集有多大？是怎么收集的？"
- en: "Does this still work with a bigger model?"
  zh: "换个更大的模型，这个方法还有效吗？"
- en: "On that plot, what's on the y-axis? I couldn't read it from here."
  zh: "那张图的纵轴是什么？我坐这儿看不清。"
- en: "Your sample is pretty small. How sure are you about the effect?"
  zh: "你的样本挺小的。这个效应你有多大把握？"
- en: "Who were your annotators, and how much did they agree with each other?"
  zh: "标注员都是谁？他们之间的一致性有多高？"
- en: "Isn't this only tested on English?"
  zh: "这是不是只在英语上测过？"
- en: "Were the examples on your slides cherry-picked?"
  zh: "幻灯片上的例子是挑过的吧？"
- en: "Why should anyone outside this subfield care?"
  zh: "这个小方向以外的人，为什么要关心这件事？"
- en: "Say this works perfectly. What changes?"
  zh: "假设它完美奏效，会改变什么？"
- en: "Won't the next frontier model just make this unnecessary?"
  zh: "等下一个前沿模型出来，这个工作不就没必要了吗？"
- en: "This is more of a comment than a question, but I did something very similar in 2009…"
  zh: "与其说是问题，不如说是个评论：我 2009 年做过一个非常类似的工作……"
- en: "Are you aware of my paper on this? You didn't cite it."
  zh: "你知道我在这方面的那篇论文吗？你没有引用。"
- en: "I think your main result is wrong. Convince me otherwise."
  zh: "我觉得你的主要结论是错的。说服我。"
- en: "I have a three-part question. Actually, four parts."
  zh: "我有个问题，分三部分。不对，四部分。"
