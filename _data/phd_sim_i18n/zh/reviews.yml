# zh translations for reviews (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "The Expert"
  zh: "领域专家"
- en: "I have worked on closely related problems, so I read this paper carefully, appendix included."
  zh: "本人做过密切相关的研究，因此仔细阅读了本文，包括附录。"
- en: "This paper tackles a real problem in {topic}, and most of my concerns can be fixed."
  zh: "本文针对的是{topic}中的一个真实问题，我的大部分疑虑都可以通过修改解决。"
- en: "The paper is technically solid. My questions are mostly about scope and framing."
  zh: "本文技术上扎实。我的问题主要在于研究范围和叙述框架。"
- en: "I checked the main results against the released code, and they match."
  zh: "我用作者公开的代码核对了主要结果，二者一致。"
- en: "The Skimmer"
  zh: "走马观花者"
- en: "The paper proposes something about {topic}. I did not have time to read the appendix."
  zh: "本文提出了某种关于{topic}的东西。我没有时间阅读附录。"
- en: "Confidence: 2. This is not my main area, but the idea seems reasonable."
  zh: "置信度：2。这不是我的主要研究方向，但想法似乎合理。"
- en: "Overall the paper is fine, though I may have missed some details."
  zh: "总体而言本文尚可，不过我可能遗漏了一些细节。"
- en: "I read the abstract, the figures and the conclusion carefully."
  zh: "我仔细阅读了摘要、图表和结论。"
- en: "Reviewer 2"
  zh: "2 号审稿人"
- en: "The authors propose yet another approach to {topic}."
  zh: "作者针对{topic}又提出了一种方法。"
- en: "The paper is well written and easy to follow. Unfortunately, I have serious concerns."
  zh: "本文写作清晰，易于理解。遗憾的是，我有一些严重的疑虑。"
- en: "I struggle to see what this paper adds to the literature."
  zh: "我很难看出本文为现有文献增添了什么。"
- en: "I have several major concerns, listed in no particular order, since they are all major."
  zh: "我有若干主要问题，排名不分先后，因为它们都很主要。"
- en: "The Champion"
  zh: "力挺者"
- en: "This is one of the best papers in my batch, and I would like to see it at {venue}."
  zh: "这是我这批稿件中最好的论文之一，希望能在 {venue} 上看到它。"
- en: "I enjoyed reading this paper and learned something from it."
  zh: "读这篇论文很愉快，我从中学到了东西。"
- en: "This paper asks exactly the question the field should be asking about {topic}."
  zh: "关于{topic}，本文提出的正是这个领域应该问的问题。"
- en: "The Citation Seeker"
  zh: "求引用者"
- en: "The paper overlooks an important line of prior work."
  zh: "本文忽略了一条重要的已有研究脉络。"
- en: "The idea is interesting, but it is closely related to {fake_prior}, which is not discussed."
  zh: "想法很有趣，但与 {fake_prior} 密切相关，而文中并未讨论。"
- en: "The related work section is incomplete in ways that matter."
  zh: "相关工作部分存在关键性的遗漏。"
- en: "The Scope Police"
  zh: "范围警察"
- en: "This is a solid paper, but I am not convinced it belongs at {venue}."
  zh: "这是一篇扎实的论文，但我不确定它适合 {venue}。"
- en: "This reads more like an HCI paper than an NLP paper."
  zh: "本文读起来更像 HCI 论文，而非 NLP 论文。"
- en: "This reads more like an NLP paper than an HCI paper."
  zh: "本文读起来更像 NLP 论文，而非 HCI 论文。"
- en: "The work may find a more appreciative audience at a domain-specific venue."
  zh: "这项工作投到领域专门的会议或期刊，或许能遇到更赏识它的读者。"
- en: "The Baseline Hunter"
  zh: "baseline 猎手"
- en: "The idea is interesting, but the experimental comparison is incomplete."
  zh: "想法很有趣，但实验对比不够完整。"
- en: "Why not simply use {model}?"
  zh: "为什么不直接用 {model}？"
- en: "The baselines in the main table are not the strongest available."
  zh: "主表中的 baseline 并非目前最强的。"
- en: "The LLM-Written Review"
  zh: "LLM 代写的审稿意见"
- en: "This paper delves into the intricate landscape of {topic}, offering a comprehensive exploration."
  zh: "本文深入探讨了{topic}这一错综复杂的领域，进行了全面而系统的探索。"
- en: "Strengths: The paper is well-written. Weaknesses: The paper could be improved."
  zh: "优点：本文写作良好。缺点：本文仍有改进空间。"
- en: "In the ever-evolving field of {topic}, this paper presents a novel and timely contribution."
  zh: "在日新月异的{topic}领域，本文做出了新颖且及时的贡献。"
- en: "Overall, this paper makes a valuable contribution, but there are several areas for improvement."
  zh: "总的来说，本文做出了有价值的贡献，但仍有若干方面有待改进。"
- en: "The Methodologist"
  zh: "方法论专家"
- en: "My main concerns are about the statistical analysis."
  zh: "我的主要疑虑在于统计分析。"
- en: "The results are promising, but I am not yet convinced they are significant."
  zh: "结果很有前景，但我还不确信它们是显著的。"
- en: "How many random seeds were used? The paper does not say."
  zh: "用了多少个随机种子？文中没有说明。"
- en: "The Silent One"
  zh: "沉默者"
- en: "Good paper."
  zh: "好论文。"
- en: "The paper is fine. Some parts could be clearer."
  zh: "论文尚可。部分内容可以更清楚。"
- en: "I have no major concerns."
  zh: "我没有重大疑虑。"
- en: "The Qualitative Purist"
  zh: "质性研究纯粹派"
- en: "The study is interesting, but the qualitative method is underspecified."
  zh: "研究很有意思，但质性方法交代得不够清楚。"
- en: "I would like to know much more about the participants and the setting."
  zh: "我希望更多地了解参与者和研究情境。"
- en: "The paper reports what participants said, but not what the authors made of it."
  zh: "本文报告了参与者说了什么，却没有说明作者从中读出了什么。"
- en: "The Practitioner"
  zh: "业界实践者"
- en: "As someone who builds these systems, I wonder whether this would survive a real deployment."
  zh: "作为搭建这类系统的人，我怀疑它能否经受住真实部署的考验。"
- en: "I like the problem. I am less sure the solution would work outside the lab."
  zh: "我喜欢这个问题，但不太确定这个方案出了实验室还能不能用。"
- en: "This could be useful in practice, if the authors address cost and latency."
  zh: "如果作者能解决成本和延迟问题，这项工作在实践中可能会很有用。"
- en: "The First-Time Reviewer"
  zh: "新手审稿人"
- en: "I read this paper very carefully and have 23 comments, listed by line number."
  zh: "我非常仔细地阅读了本文，共有 23 条意见，按行号列出。"
- en: "Line 112 has a typo. Line 113 has another typo."
  zh: "第 112 行有一处笔误。第 113 行还有一处笔误。"
- en: "This is my first time reviewing for {venue}, so I tried to be thorough."
  zh: "这是我第一次为 {venue} 审稿，所以尽量审得细致。"
- en: "The contribution is incremental over {fake_prior}."
  zh: "相较于 {fake_prior}，本文的贡献只是增量式的。"
- en: "The proposed method is a modest extension of existing techniques."
  zh: "所提方法只是对现有技术的小幅扩展。"
- en: "The novelty over prior work on {topic} is limited."
  zh: "相较于已有的{topic}研究，本文的新颖性有限。"
- en: "The work is incremental given {fake_prior}, which was posted two weeks ago."
  zh: "考虑到两周前刚发布的 {fake_prior}，本工作只是增量式的。"
- en: "This has essentially been done already. See {fake_prior}, which appeared last month."
  zh: "这项工作本质上已经有人做过了，见上个月发表的 {fake_prior}。"
- en: "The approach is very similar to {fake_prior}. The paper should explain the difference."
  zh: "该方法与 {fake_prior} 非常相似，文中应说明二者的区别。"
- en: "I do not see a substantive difference between this method and {fake_prior}."
  zh: "我看不出该方法与 {fake_prior} 有何实质性区别。"
- en: "The related work misses several key papers: {fake_prior} and the six follow-up papers by the same authors."
  zh: "相关工作遗漏了几篇关键论文：{fake_prior}，以及同一作者的六篇后续工作。"
- en: "Please cite and discuss {fake_prior}, along with its six sequels, which together define this area."
  zh: "请引用并讨论 {fake_prior} 及其六篇续作，它们共同定义了这一领域。"
- en: "The main finding is already well known in the community."
  zh: "主要发现在业内早已众所周知。"
- en: "It is not surprising that current models struggle with {topic}."
  zh: "现有模型在{topic}上表现不佳，这并不令人意外。"
- en: "The results are not surprising."
  zh: "结果并不出人意料。"
- en: "The findings confirm what practitioners already suspected."
  zh: "这些发现只是印证了业界早有的猜测。"
- en: "This is a solid engineering effort, but the research contribution is unclear."
  zh: "这是一项扎实的工程工作，但研究贡献不明确。"
- en: "The paper describes a system, not a finding."
  zh: "本文描述的是一个系统，而不是一个发现。"
- en: "The method amounts to careful prompt engineering."
  zh: "该方法说到底就是精心设计的提示工程。"
- en: "Once the framing is removed, the contribution is a prompt."
  zh: "去掉包装，贡献就是一条提示词。"
- en: "With {model} now available, it is unclear whether this problem still exists."
  zh: "既然 {model} 已经发布，这个问题是否依然存在尚不清楚。"
- en: "A stronger model would likely solve this task without the proposed method."
  zh: "更强的模型很可能无需所提方法就能解决这一任务。"
- en: "It is unclear why a new dataset is needed when existing benchmarks already cover {topic}."
  zh: "现有基准已经覆盖了{topic}，不清楚为何还需要新的数据集。"
- en: "The paper does not explain what this benchmark measures that others do not."
  zh: "文中没有说明这个基准能衡量哪些其他基准衡量不了的东西。"
- en: "The design implications are generic; most could have been written without running the study."
  zh: "设计启示过于泛泛，大部分不做这项研究也写得出来。"
- en: "\"Designers should consider users' needs\" is not a design implication."
  zh: "“设计者应考虑用户需求”算不上设计启示。"
- en: "The interview findings largely replicate {fake_prior}."
  zh: "访谈发现在很大程度上重复了 {fake_prior}。"
- en: "Several of the themes are already reported in prior HCI work on {topic}."
  zh: "其中若干主题，先前关于{topic}的 HCI 研究已经报道过。"
- en: "The paper ignores decades of HCI research on this question."
  zh: "本文忽视了 HCI 领域针对这一问题数十年的研究。"
- en: "The related work cites recent NLP papers but none of the foundational HCI work on {topic}."
  zh: "相关工作引用了近期的 NLP 论文，却没有引用任何关于{topic}的 HCI 奠基性工作。"
- en: "The related work misses recent NLP work on {topic}."
  zh: "相关工作遗漏了近期关于{topic}的 NLP 研究。"
- en: "Several recent model-based approaches to this problem are not discussed."
  zh: "文中未讨论近期针对该问题的几种基于模型的方法。"
- en: "The paper reports what happens but not why."
  zh: "本文报告了现象，却没有解释原因。"
- en: "I finished the paper without a clear takeaway."
  zh: "读完全文，我没有得到明确的收获。"
- en: "The position is reasonable, but similar arguments have been made before."
  zh: "观点合理，但类似的论点以前就有人提过。"
- en: "I agree with the authors, which is part of the problem: so does everyone."
  zh: "我同意作者的观点，而这正是问题所在：所有人都同意。"
- en: "Current models already score above 90% on this task, so it is unclear what remains to be learned."
  zh: "现有模型在该任务上已超过 90%，不清楚还有什么值得研究的。"
- en: "The novelty of the approach could be further highlighted."
  zh: "该方法的创新性可以进一步凸显。"
- en: "It would be beneficial to further elaborate on how this work differs from existing approaches."
  zh: "建议进一步阐述本工作与现有方法的区别，这将有所裨益。"
- en: "The paper does not compare against strong recent baselines."
  zh: "本文没有与近期的强 baseline 进行比较。"
- en: "A simple retrieval baseline is missing."
  zh: "缺少一个简单的检索 baseline。"
- en: "The comparison omits the most obvious baseline: a larger model with a good prompt."
  zh: "对比中漏掉了最显而易见的 baseline：更大的模型配上好的提示词。"
- en: "The paper does not compare against {model}, which was released last week."
  zh: "本文没有与上周刚发布的 {model} 进行比较。"
- en: "Why not evaluate {model}? It came out a week ago and is clearly the new state of the art."
  zh: "为什么不评测 {model}？它一周前刚发布，显然是新的 SOTA。"
- en: "Results are reported on a single dataset, so it is unclear whether they generalize."
  zh: "结果只在单一数据集上报告，泛化性存疑。"
- en: "One dataset is not enough to support claims about {topic} in general."
  zh: "一个数据集不足以支撑关于{topic}的一般性结论。"
- en: "No significance tests are reported."
  zh: "未报告显著性检验。"
- en: "The improvements are within what I would expect from random variation."
  zh: "在我看来，提升幅度仍在随机波动的范围之内。"
- en: "Results appear to come from a single random seed."
  zh: "结果似乎只来自单个随机种子。"
- en: "Please report the mean and standard deviation over at least five seeds."
  zh: "请报告至少五个随机种子下的均值和标准差。"
- en: "The test set may have appeared in the pretraining data of the evaluated models."
  zh: "测试集可能已出现在被评测模型的预训练数据中。"
- en: "The authors do not check for data contamination."
  zh: "作者没有检查数据污染。"
- en: "Using an LLM as the judge raises concerns about bias toward its own outputs."
  zh: "用 LLM 当评判者，令人担心它会偏向自己的输出。"
- en: "The LLM-based evaluation is not validated against human judgments."
  zh: "基于 LLM 的评测没有经过人工判断的验证。"
- en: "Results may be sensitive to the prompt wording, and only one prompt is reported."
  zh: "结果可能对提示词措辞敏感，而文中只报告了一种提示词。"
- en: "How were the prompts chosen? Were they tuned on the test set?"
  zh: "提示词是如何选定的？是否在测试集上调过？"
- en: "The results rely on a closed API model that may change at any time, which hurts reproducibility."
  zh: "结果依赖一个随时可能变动的闭源 API 模型，影响可复现性。"
- en: "There is no ablation showing which component matters."
  zh: "没有消融实验说明哪个组件起作用。"
- en: "It is unclear how much each part of the method contributes."
  zh: "方法各部分分别贡献多少尚不清楚。"
- en: "The ablation suggests the main component contributes very little."
  zh: "消融实验表明，核心组件的贡献微乎其微。"
- en: "Removing the proposed module barely changes the results, according to the authors' own table."
  zh: "根据作者自己的表格，去掉所提模块后结果几乎不变。"
- en: "The baselines appear under-tuned compared to the proposed method."
  zh: "与所提方法相比，baseline 似乎没有充分调参。"
- en: "The proposed method gets a hyperparameter search. The baselines get the defaults."
  zh: "所提方法做了超参数搜索，baseline 用的是默认值。"
- en: "Automatic overlap metrics may not reflect the quality humans care about."
  zh: "基于重叠的自动指标未必能反映人们真正在意的质量。"
- en: "The chosen metric rewards fluency, not correctness."
  zh: "所选指标奖励的是流畅度，而不是正确性。"
- en: "The human evaluation uses only 50 examples and three annotators."
  zh: "人工评测仅使用了 50 个样例和三名标注员。"
- en: "The human evaluation is too small to support the claims."
  zh: "人工评测规模太小，不足以支撑文中的结论。"
- en: "Inter-annotator agreement is low, which calls the labels into question."
  zh: "标注者间一致性偏低，标签的可靠性存疑。"
- en: "Agreement is not reported for the human evaluation."
  zh: "人工评测未报告一致性。"
- en: "It is unclear whether the annotators had the expertise this task requires."
  zh: "不清楚标注员是否具备该任务所需的专业知识。"
- en: "Crowdworkers may not be qualified to judge clinical text."
  zh: "众包工作者未必有资格评判临床文本。"
- en: "Some test examples appear to be near-duplicates of training examples."
  zh: "部分测试样例似乎与训练样例近乎重复。"
- en: "The data split may leak information from train to test."
  zh: "数据划分可能导致训练集信息泄漏到测试集。"
- en: "There is no error analysis."
  zh: "缺少错误分析。"
- en: "I would like to see examples where the method fails, and why."
  zh: "希望看到方法失败的例子，以及失败的原因。"
- en: "The qualitative examples look cherry-picked."
  zh: "定性示例看起来是精心挑选过的。"
- en: "The examples in the case study seem chosen to flatter the method."
  zh: "案例分析中的例子似乎是专门挑来给方法脸上贴金的。"
- en: "The paper does not report the computational cost."
  zh: "本文未报告计算开销。"
- en: "Is the improvement worth five times the inference cost?"
  zh: "为这点提升付出五倍推理开销，值得吗？"
- en: "All experiments are in English, which the paper should state explicitly."
  zh: "所有实验均基于英文，文中应明确说明。"
- en: "Would the findings hold for languages other than English?"
  zh: "这些发现在英语以外的语言上是否依然成立？"
- en: "It is unclear whether this would work in a real deployment, with real latency and real users."
  zh: "面对真实的延迟和真实的用户，这能否在实际部署中奏效尚不清楚。"
- en: "The setting assumes clean inputs that real systems never see."
  zh: "实验设定假设输入是干净的，而真实系统从来见不到这样的输入。"
- en: "My main concern is that the paper never explains how the evaluation data was collected."
  zh: "我的主要疑虑是，文中从未说明评测数据是如何收集的。"
- en: "It is unclear which model is used as the backbone."
  zh: "不清楚使用了哪个模型作为骨干。"
- en: "The paper does not say how participants were recruited."
  zh: "文中没有说明参与者是如何招募的。"
- en: "The experimental evaluation could be more comprehensive."
  zh: "实验评估可以更加全面。"
- en: "Additional experiments would further strengthen the paper's claims."
  zh: "补充更多实验将进一步增强本文结论的说服力。"
- en: "With 12 participants, the findings may not generalize."
  zh: "仅有 12 名参与者，研究发现未必具有普适性。"
- en: "The sample size is small for the strength of the claims."
  zh: "就结论的力度而言，样本量偏小。"
- en: "The study should be repeated with a much larger sample of clinicians, ideally at several hospitals."
  zh: "应以规模大得多的临床医生样本重复这项研究，最好覆盖多家医院。"
- en: "I would like to see a large-scale deployment before drawing these conclusions."
  zh: "在得出这些结论之前，我希望看到大规模部署。"
- en: "Twelve clinicians is a pilot, not a study. Please recruit more."
  zh: "十二位临床医生只能算预实验，不能算研究。请招募更多参与者。"
- en: "Participants were recruited from the authors' own institution, which may bias the results."
  zh: "参与者来自作者所在机构，可能使结果产生偏差。"
- en: "Most participants appear to be students, not the intended users."
  zh: "大多数参与者似乎是学生，而非目标用户。"
- en: "No power analysis justifies the sample size."
  zh: "缺少功效分析来论证样本量。"
- en: "A lab study cannot show how the tool would be used in a real clinic."
  zh: "实验室研究无法说明医生在真实门诊中会怎样使用这个工具。"
- en: "The tasks are performed outside the participants' real workflow."
  zh: "任务是在参与者真实工作流程之外完成的。"
- en: "The positive ratings may reflect a novelty effect."
  zh: "正面评分可能源于新奇效应。"
- en: "A one-session study cannot tell us whether people would keep using the tool."
  zh: "只有一次实验的研究，无法告诉我们人们是否会持续使用该工具。"
- en: "Likert responses are analyzed with t-tests; non-parametric tests would be more appropriate."
  zh: "李克特量表数据用 t 检验分析，换用非参数检验会更合适。"
- en: "Averaging Likert items as if they were interval data needs justification."
  zh: "把李克特题目当作等距数据取平均，需要给出理由。"
- en: "The qualitative analysis is underspecified. Who coded the data, and how were disagreements resolved?"
  zh: "质性分析交代不清。谁对数据进行了编码？分歧是如何解决的？"
- en: "\"Themes emerged from the data\" is not a description of a method."
  zh: "“主题从数据中浮现”不是对方法的描述。"
- en: "No inter-rater reliability is reported for the qualitative coding."
  zh: "质性编码未报告评分者间信度。"
- en: "Participants knew the authors built the system, which may have inflated their ratings."
  zh: "参与者知道系统是作者开发的，这可能抬高了评分。"
- en: "The experimenter was in the room during sessions, which may have influenced the responses."
  zh: "实验过程中实验者一直在场，可能影响了参与者的回答。"
- en: "The task scenarios do not reflect real clinical workflows."
  zh: "任务场景不能反映真实的临床工作流程。"
- en: "No clinician would encounter this scenario in practice."
  zh: "实际工作中没有哪位临床医生会遇到这种场景。"
- en: "The study has no baseline condition, so it is unclear what the tool is better than."
  zh: "研究没有设置基线条件，因此不清楚这个工具究竟比什么更好。"
- en: "Without a control condition, the positive results are hard to interpret."
  zh: "没有对照条件，正面结果难以解读。"
- en: "All measures are self-reported; actual behavior was not measured."
  zh: "所有指标均为自我报告，未测量实际行为。"
- en: "Perceived usefulness is not the same as usefulness."
  zh: "感知有用性不等于有用性。"
- en: "The order of conditions was not counterbalanced."
  zh: "未对条件顺序进行平衡处理。"
- en: "The online survey has no attention checks, so some responses may come from bots."
  zh: "线上问卷没有注意力检查题，部分回答可能来自机器人。"
- en: "The pilot participants appear to be lab members, who may not represent the target users."
  zh: "预实验参与者似乎是实验室成员，未必能代表目标用户。"
- en: "The paper is hard to follow."
  zh: "本文读起来很吃力。"
- en: "I had to read Section 3 three times to understand the method."
  zh: "我把第 3 节读了三遍才看懂方法。"
- en: "The motivation is unclear. Why does this problem matter, and to whom?"
  zh: "动机不清楚。这个问题为什么重要？对谁重要？"
- en: "It is not clear who would use this, or why."
  zh: "不清楚谁会用它，又为什么要用。"
- en: "The notation changes between Sections 3 and 4."
  zh: "第 3 节和第 4 节的符号不一致。"
- en: "The same quantity has three different names in the paper."
  zh: "同一个量在文中有三个不同的名字。"
- en: "Figure 2 is unreadable when printed."
  zh: "图 2 打印出来根本看不清。"
- en: "The axis labels in Figure 3 are too small to read."
  zh: "图 3 的坐标轴标签太小，无法辨认。"
- en: "The abstract claims more than the results show."
  zh: "摘要的说法超出了结果所能支持的范围。"
- en: "\"Solves\" is a strong word for a two-point gain."
  zh: "提升两个点就说“解决”，用词过重。"
- en: "Too much is pushed to the appendix, so the main paper is not self-contained."
  zh: "太多内容被放进附录，正文无法自成一体。"
- en: "The paper has many typos and needs proofreading."
  zh: "文中笔误较多，需要仔细校对。"
- en: "Line 112 contains a typo. So do lines 140, 141 and 207."
  zh: "第 112 行有笔误。第 140、141 和 207 行也有。"
- en: "Important implementation details are missing, so the work cannot be reproduced."
  zh: "缺少重要的实现细节，工作无法复现。"
- en: "The paper does not give enough detail to replicate the study."
  zh: "文中给出的细节不足以复现这项研究。"
- en: "The paper uses NLP terms without explanation, which will lose HCI readers."
  zh: "文中使用 NLP 术语却不加解释，HCI 读者会看不懂。"
- en: "The paper assumes familiarity with HCI methods that many readers at {venue} will not have."
  zh: "本文默认读者熟悉 HCI 方法，而 {venue} 的很多读者并不熟悉。"
- en: "The contributions are not clearly stated."
  zh: "贡献没有明确阐述。"
- en: "After the introduction, I was still not sure what the paper contributes."
  zh: "读完引言，我仍不确定本文的贡献是什么。"
- en: "The paper tries to make four contributions and makes none of them clearly."
  zh: "本文试图做出四项贡献，却没有一项讲清楚。"
- en: "A dataset, a method, a user study and a benchmark is too much for one paper."
  zh: "一个数据集、一个方法、一项用户研究加一个基准，对一篇论文来说太多了。"
- en: "The study design is spread across four sections and is hard to reconstruct."
  zh: "研究设计散落在四个章节中，很难拼出全貌。"
- en: "I could not tell how many sessions each participant completed, or in what order."
  zh: "我看不出每位参与者完成了几次实验，顺序又是怎样的。"
- en: "The title promises more than the paper delivers."
  zh: "标题许诺的比论文给出的多。"
- en: "The Limitations section is a single generic sentence."
  zh: "Limitations 一节只有一句泛泛而谈的话。"
- en: "The main result appears only on page 7."
  zh: "主要结果直到第 7 页才出现。"
- en: "The key finding is hidden in the middle of Section 5."
  zh: "关键发现藏在第 5 节中间。"
- en: "Table 2 has 14 columns and no clear takeaway."
  zh: "表 2 有 14 列，却看不出明确的结论。"
- en: "Participant roles and experience are not reported."
  zh: "未报告参与者的职位和经验。"
- en: "The participant table should describe the participants in much more detail."
  zh: "参与者信息表应当更详细地描述参与者。"
- en: "The findings section is mostly quotes, with little analysis connecting them."
  zh: "研究发现部分大多是引语，缺少将它们串联起来的分析。"
- en: "Several paragraphs end with a single word on their last line."
  zh: "有好几段的最后一行只剩一个单词。"
- en: "The paper could benefit from further clarification of certain aspects."
  zh: "本文的某些方面若能进一步阐明，将会更加完善。"
- en: "Some sections could be more concise and clearer."
  zh: "部分章节可以更加简洁、清晰。"
- en: "The authors should discuss the limitations of their approach in more detail."
  zh: "作者应更详细地讨论其方法的局限性。"
- en: "A dedicated limitations section would strengthen the paper."
  zh: "增设专门的局限性章节将进一步提升本文质量。"
- en: "This is an HCI paper. I am not sure what the NLP contribution is."
  zh: "这是一篇 HCI 论文。我不确定它在 NLP 上的贡献是什么。"
- en: "There is no new model or method, so it is unclear why this paper is at {venue}."
  zh: "没有新模型，也没有新方法，不清楚这篇论文为什么投 {venue}。"
- en: "The paper is mainly a modeling contribution; the user study feels added on."
  zh: "本文主要是建模方面的贡献，用户研究像是后来加上去的。"
- en: "The human-centered part is too thin for {venue}."
  zh: "对 {venue} 来说，以人为本的部分太单薄了。"
- en: "This would make a good workshop paper."
  zh: "这会是一篇不错的 workshop 论文。"
- en: "The contribution is better suited to a workshop."
  zh: "这一贡献更适合 workshop。"
- en: "The natural audience for this work is clinical informatics, not {venue}."
  zh: "这项工作的天然受众在临床信息学领域，而不是 {venue}。"
- en: "This might be better received at a medical informatics venue."
  zh: "投医学信息学方向的会议或期刊，可能会更受欢迎。"
- en: "The paper may fit better in a different track."
  zh: "本文或许更适合其他 track。"
- en: "The work is too applied for {venue}."
  zh: "对 {venue} 来说，这项工作太偏应用了。"
- en: "This is a nice application, but where is the general lesson?"
  zh: "这是个不错的应用，但普适的启示在哪里？"
- en: "The paper studies a narrow setting of limited interest to the broader community."
  zh: "本文研究的场景过于狭窄，更广泛的学术圈兴趣有限。"
- en: "Results from one hospital in one specialty may not interest most of the {venue} audience."
  zh: "一家医院、一个专科的结果，{venue} 的大多数听众可能不感兴趣。"
- en: "The paper lacks the learning contribution expected at {venue}."
  zh: "本文缺少 {venue} 所期待的机器学习贡献。"
- en: "The ethics statement does not discuss risks to patients."
  zh: "伦理声明没有讨论对患者的风险。"
- en: "The paper should discuss how the system could cause harm when it is wrong."
  zh: "本文应讨论系统出错时可能造成哪些伤害。"
- en: "The responsible research checklist says the code will be released, but the paper does not say where."
  zh: "负责任研究清单上写着会公开代码，但文中没说在哪里公开。"
- en: "The paper was submitted to the special theme but does not engage with it."
  zh: "本文投的是特别主题，却没有真正回应这个主题。"
- en: "The broader impact of this work could be discussed more thoroughly."
  zh: "可以更充分地讨论这项工作的更广泛影响。"
- en: "The authors may wish to consider the broader implications of their work for society."
  zh: "作者不妨考虑一下其工作对社会的更广泛意义。"
- en: "The reviewers agree that the paper makes a clear contribution, and the rebuttal resolved the main concerns. Accept."
  zh: "审稿人一致认为本文贡献明确，rebuttal 也解决了主要疑虑。接收。"
- en: "All reviewers see value in this work. Please make the promised changes in the final version."
  zh: "所有审稿人都认可这项工作的价值。请在终稿中完成承诺的修改。"
- en: "Despite some concerns about scope, this is a solid contribution to {venue}. Accept."
  zh: "尽管在研究范围上存在一些疑虑，这仍是对 {venue} 的扎实贡献。接收。"
- en: "The author response convinced two reviewers, and I agree with them. Accept."
  zh: "作者回复说服了两位审稿人，我也同意他们的看法。接收。"
- en: "A timely study of {topic} with a careful evaluation. Accept, with minor revisions to the presentation."
  zh: "一项关于{topic}的及时研究，评估严谨。接收，表述上需小修。"
- en: "Reviewer 2 raises valid points, but they can be addressed in the camera-ready. Accept."
  zh: "2 号审稿人提出的问题有道理，但可以在终稿中解决。接收。"
- en: "A clear, well-executed paper. I recommend acceptance and encourage the authors to release their code."
  zh: "论文清晰，完成度高。建议接收，并鼓励作者公开代码。"
- en: "The paper is sound, but the contribution is modest for the main conference. Recommended for Findings."
  zh: "论文扎实，但就主会而言贡献偏小。推荐收录至 Findings。"
- en: "Reviewers appreciate the careful experiments but question the novelty. Findings is a good home for this work."
  zh: "审稿人肯定了细致的实验，但质疑其新颖性。Findings 是这项工作不错的归宿。"
- en: "Solid but incremental. Findings."
  zh: "扎实但偏增量。Findings。"
- en: "The rebuttal addressed several concerns, though not enough for the main conference. Findings."
  zh: "rebuttal 解决了若干疑虑，但还不足以进入主会。Findings。"
- en: "A useful resource for the community; the analysis could go deeper. Findings."
  zh: "对社区而言是有用的资源，但分析可以更深入。Findings。"
- en: "The reviewers are split, but the work is sound. Findings is the right venue for it."
  zh: "审稿人意见不一，但工作本身扎实。Findings 是它合适的去处。"
- en: "The reviewers raise concerns about soundness that the rebuttal did not fully resolve. Reject."
  zh: "审稿人对方法的可靠性提出了疑虑，rebuttal 未能完全解决。拒稿。"
- en: "While the topic is important, the contribution is not yet clear. We encourage the authors to resubmit."
  zh: "选题很重要，但贡献尚不明确。鼓励作者修改后重投。"
- en: "Two reviewers find the evaluation insufficient, and I agree. Reject."
  zh: "两位审稿人认为评估不充分，我同意。拒稿。"
- en: "The paper has potential, but the current version is not ready for {venue}."
  zh: "论文有潜力，但当前版本还达不到 {venue} 的要求。"
- en: "Reviewers question whether {venue} is the right venue for this work. Reject."
  zh: "审稿人质疑 {venue} 是否适合这项工作。拒稿。"
- en: "The rebuttal was appreciated but did not change the reviewers' assessment. Reject."
  zh: "感谢作者的 rebuttal，但它没有改变审稿人的评价。拒稿。"
- en: "Reviewer 3's concerns are serious and were not resolved. Reject."
  zh: "3 号审稿人的疑虑很严重，且未得到解决。拒稿。"
- en: "The reviewers see value in this work but request substantial revisions. Revise and resubmit."
  zh: "审稿人认可这项工作的价值，但要求大幅修改。大修重投。"
- en: "The study is promising, but the analysis needs to be rewritten. Revise and resubmit."
  zh: "研究很有前景，但分析部分需要重写。大修重投。"
- en: "Please address every reviewer concern, especially the framing of the contribution, and resubmit."
  zh: "请逐条回应审稿意见，尤其是贡献的定位，然后重投。"
- en: "The committee asks for a revised version with a clearer account of the study design and the participants."
  zh: "程序委员会要求提交修改稿，更清楚地说明研究设计和参与者情况。"
- en: "Major revision: the reviewers ask for a deeper discussion of the design implications."
  zh: "大修：审稿人要求更深入地讨论设计启示。"
- en: "The paper is close. A careful revision that addresses R1 and R3 could make it a strong contribution."
  zh: "论文已经很接近了。若能认真修改、回应 R1 和 R3 的意见，有望成为一篇有分量的工作。"
