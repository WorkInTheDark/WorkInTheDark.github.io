- en: "Answer directly"
  zh: "直接回答"
- en: "Best when they're testing what you know."
  zh: "最适合对方考你知识储备的时候。"
- en: "Acknowledge the limitation"
  zh: "承认局限"
- en: "Best when they've found a real weakness."
  zh: "最适合对方真抓到弱点的时候。"
- en: "Reframe the question"
  zh: "换个角度回答"
- en: "Best when they're asking why it matters."
  zh: "最适合对方问“这有什么意义”的时候。"
- en: "“Great question…”"
  zh: "“好问题……”"
- en: "Buys time. Rarely enough."
  zh: "能拖点时间，但很少够用。"
- en: "They wanted a straight answer."
  zh: "对方想要的是直截了当的回答。"
- en: "They had found a real weakness; owning it would have landed better."
  zh: "对方确实抓到了弱点；大方承认效果会更好。"
- en: "They were asking why it matters; reframing would have helped."
  zh: "对方问的是意义何在；换个角度回答会更好。"
- en: "It was a trap; acknowledging or reframing beats a direct answer."
  zh: "这题是个坑；承认局限或换个角度，都比直接回答强。"
- en: "Qualifying exam"
  zh: "资格考试"
- en: "Thesis proposal"
  zh: "开题"
- en: "Thesis defense"
  zh: "博士答辩"
- en: "Job talk"
  zh: "Job talk"
- en: "{name} ({role})"
  zh: "{name}（{role}）"
- en: "Five people, two hours, one room. Read each question and choose how to answer."
  zh: "五个人，两小时，一间屋。看清每个问题，选好怎么答。"
- en: "The committee takes turns. Read each question and choose how to answer."
  zh: "委员们轮流发问。看清每个问题，选好怎么答。"
- en: "They nod and write something down."
  zh: "对方点点头，记了点什么。"
- en: "That lands."
  zh: "这下答到点子上了。"
- en: "A satisfied “good”."
  zh: "一声满意的“很好”。"
- en: "They move on, convinced."
  zh: "对方被说服了，进入下一题。"
- en: "A long pause. They follow up."
  zh: "一阵长长的沉默。对方追问了一句。"
- en: "They don't look convinced."
  zh: "对方看起来不太信服。"
- en: "You can see them making a note."
  zh: "你看到对方记了一笔。"
- en: "That one will come up again."
  zh: "这个问题之后还会再来。"
- en: "You pass your quals."
  zh: "资格考试，过了。"
- en: "You don't pass on the second try. The program offers you a Master's degree on the way out."
  zh: "第二次还是没过。系里发了个硕士学位，送你体面离场。"
- en: "Not this time. You can retake quals next year."
  zh: "这次没过，明年还能再战。"
- en: "Your proposal passes. You are officially a PhD candidate. The defense can come a year from now."
  zh: "开题过了。你正式成为博士候选人，一年后就能答辩。"
- en: "The committee asks you to revise the plan and present again in a few weeks."
  zh: "委员会让你修改计划，几周后再讲一次。"
- en: "They ask you to step outside. Ten long minutes later: “Congratulations, Doctor.”"
  zh: "他们请你先出去等等。度秒如年的十分钟后：“恭喜你，博士。”"
- en: "You pass, with minor revisions. Two more weeks of fixes and you're done."
  zh: "通过，但要小修。再改两周就搞定了。"
- en: "You pass, with major revisions. Six weeks of work, then a short follow-up meeting."
  zh: "通过，但要大修。还要改六周，然后开个简短的跟进会。"
- en: "Your job talk goes well. People keep asking follow-ups at dinner."
  zh: "你的 job talk 很成功，饭桌上大家还在追着问。"
- en: "The talk is fine. Not your best, not your worst."
  zh: "报告中规中矩。没出高光，也没翻车。"
- en: "Welcome to your PhD, {name}"
  zh: "{name}，欢迎开始读博"
- en: "It's September. You have five years, give or take, to become an expert in something nobody fully understands yet. Each turn is two weeks: choose what to focus on, keep an eye on Energy, Stress and Health, and remember: everyone else is also figuring it out."
  zh: "现在是九月。你大概有五年时间，在一个还没人完全搞懂的方向上成为专家。每轮两周：选好专心做什么，留意精力、压力和健康。还有，别慌：大家都是第一次读博。"
- en: "Ready to propose?"
  zh: "准备好开题了吗？"
- en: "Your committee is formed and you have {n} first-author papers. The thesis proposal turns you from a student into a candidate. You'd present in {weeks} weeks."
  zh: "委员会组好了，你有 {n} 篇一作论文。开题之后，你就从学生变成博士候选人。报告安排在 {weeks} 周后。"
- en: "Schedule the proposal"
  zh: "安排开题"
- en: "Not yet"
  zh: "先不了"
- en: "Ready to defend?"
  zh: "准备好答辩了吗？"
- en: "You have {n} first-author papers accepted and one under review. You could start defense preparation now and hope the third one lands. Prep takes about three months."
  zh: "你有 {n} 篇一作论文中稿，还有一篇在审。现在就可以开始准备答辩，祈祷第三篇也能中。准备大约要三个月。"
- en: "You have {n} first-author papers accepted. Defense preparation takes about three months of thesis writing and slides."
  zh: "你有 {n} 篇一作论文中稿。准备答辩大约要三个月，写博士论文、做幻灯片。"
- en: "Start defense prep"
  zh: "开始准备答辩"
- en: "Summer internships"
  zh: "暑期实习"
- en: "Recruiting season is open. An internship means 12 weeks of industry research, real compute, and a lot of new people."
  zh: "招聘季开始了。实习意味着 12 周的业界研究，卡管够，还有一大群新面孔。"
- en: "Apply broadly"
  zh: "海投"
- en: "Apply to a couple of places"
  zh: "挑几家投"
- en: "Skip this year"
  zh: "今年不投了"
- en: "Internship offer from {company}"
  zh: "{company} 的实习 offer"
- en: "{company} offers you a summer internship: 12 weeks, starting late May."
  zh: "{company} 给了你一个暑期实习：12 周，5 月下旬开始。"
- en: "Accept"
  zh: "接受"
- en: "Decline and stay in the lab"
  zh: "拒绝，留在实验室"
- en: "Fellowship applications"
  zh: "奖学金申请"
- en: "A fellowship would pay your way for a year, with no TA duty. The research statement takes a couple of days."
  zh: "拿到奖学金 (fellowship)，一年的开销就有着落了，还不用当助教。研究陈述要写几天。"
- en: "Apply"
  zh: "申请"
- en: "2 days next turn"
  zh: "下一轮占用 2 天"
- en: "Skip it"
  zh: "跳过"
- en: "The job market"
  zh: "求职季"
- en: "You're close enough to the finish line that people ask what's next. Going on the market takes time, but offers don't arrive on their own."
  zh: "终点在望，开始有人问你“毕业去哪儿”。找工作很花时间，但 offer 不会自己找上门。"
- en: "Apply everywhere"
  zh: "全都投"
- en: "Industry only"
  zh: "只投工业界"
- en: "Academia only"
  zh: "只投学术界"
- en: "Something different"
  zh: "换条路走"
- en: "Startups, policy, writing, clinics"
  zh: "创业、政策、写作、医疗"
- en: "Not this year"
  zh: "今年先不"
- en: "Accept: {name}"
  zh: "接受：{name}"
- en: "Decline them all for now"
  zh: "暂时全都拒绝"
- en: "What's next, Doctor?"
  zh: "博士，下一步去哪儿？"
- en: "Offers"
  zh: "收到的 offer"
- en: "The degree is done. A few doors are open."
  zh: "学位到手，眼前有几条路可选。"
- en: "After months of applications and interviews, here's what came back."
  zh: "几个月的申请和面试过后，结果都在这儿了。"
- en: "Two quiet weeks."
  zh: "岁月静好的两周。"
- en: "What's next?"
  zh: "接下来做什么？"
- en: "In your one-on-one, your advisor asks what you're working on next. Right now, the honest answer is “nothing in particular”."
  zh: "单独会面时，导师问你接下来做什么。老实说，答案是“啥也没在做”。"
- en: "Start a new project"
  zh: "开个新项目"
- en: "Keep reading for now"
  zh: "先继续读论文"
- en: "Quals in two weeks"
  zh: "资格考试倒计时：两周"
- en: "You haven't prepared yet. Pass odds: {now} now, {next} if you choose “Prepare for quals” this turn."
  zh: "你还没开始准备。通过几率：现在{now}，这轮选“准备资格考试”的话{next}。"
- en: "Got it"
  zh: "知道了"
- en: "Quals in {weeks} weeks"
  zh: "资格考试倒计时：{weeks} 周"
- en: "Your qualifying exam is set for {date}. The committee asks four questions, and two good answers pass."
  zh: "资格考试定在 {date}。委员会会问四个问题，答好两个就算过。"
- en: "Choose “Prepare for quals” on the turns before it to raise your odds."
  zh: "考前几轮选“准备资格考试”，能提高通过几率。"
- en: "Pass odds: {now} now, {one} after one turn of preparing, {two} after two."
  zh: "通过几率：现在{now}，准备一轮后{one}，准备两轮后{two}。"
- en: "Pass odds: {now} now, {one} after one turn of preparing."
  zh: "通过几率：现在{now}，准备一轮后{one}。"
- en: "Leave with a Master's"
  zh: "拿个硕士学位走人"
- en: "Open the bubble tea shop"
  zh: "开奶茶店"
- en: "Apply to med school"
  zh: "申请医学院"
- en: "Join the family business"
  zh: "回家继承家业"
- en: "Never mind, keep going"
  zh: "算了，接着读"
- en: "Leave the PhD?"
  zh: "不读了？"
- en: "Leaving isn't losing. Plenty of good lives start here. Where would you go?"
  zh: "离开不等于认输。很多好日子正是从这一步开始的。你想去哪儿？"
- en: "You inherit “{title}”, its code, and its mysteries."
  zh: "你接手了“{title}”，连同它的代码，和代码里的玄学。"
- en: "Your first project: “{title}” ({type})."
  zh: "你的第一个项目：“{title}”（{type}）。"
- en: "You let this one go. Next target: {deadline}."
  zh: "这次先不投了。下一站：{deadline}。"
- en: "to be decided"
  zh: "待定"
- en: "Deadline mode. Everything else can wait two weeks."
  zh: "截稿冲刺模式启动。天大的事也等两周再说。"
- en: "You know what to fix. Now you need the days."
  zh: "你知道该改什么了。现在缺的是时间。"
- en: "You write the question on a sticky note and move on."
  zh: "你把问题写在便利贴上，接着往下做。"
- en: "Not every paper is yours to carry."
  zh: "不是每篇论文都得你来扛。"
- en: "A line on your CV you helped earn."
  zh: "简历上多了一行，也有你的功劳。"
- en: "You tell your family. They ask what it means. You explain for twenty minutes."
  zh: "你把好消息发进家族群。大家问这是啥意思，你解释了二十分钟。"
- en: "Findings it is. A publication is a publication."
  zh: "那就 Findings 吧。蚊子腿也是肉。"
- en: "You withdraw and start revising."
  zh: "你撤了稿，开始修改。"
- en: "Revision mode. Every reviewer comment is now a to-do item."
  zh: "进入改稿模式。每条审稿意见都成了待办事项。"
- en: "You withdraw it and look for another venue."
  zh: "你撤了稿，另找地方投。"
- en: "You shelve it. It still taught you something."
  zh: "你把它搁置了。它还是教会了你一些东西。"
- en: "You go back to the draft and aim for {deadline}."
  zh: "你回到稿子上，瞄准 {deadline}。"
- en: "the next deadline"
  zh: "下一个截稿"
- en: "You present to a camera and a small grid of faces. Two of them ask great questions."
  zh: "你对着摄像头和一屏九宫格头像做报告。其中两位问了很好的问题。"
- en: "The travel grant doesn't come through, so you present remotely."
  zh: "差旅资助没批下来，你只好线上报告。"
- en: "Your committee: {names}. The date is set."
  zh: "你的委员会：{names}。日期定好了。"
- en: "Not yet. Your advisor will ask again."
  zh: "再等等。导师还会再问的。"
- en: "Defense prep begins. Thesis chapters, slides, and a date with your committee in about three months."
  zh: "答辩准备开始了。博士论文的章节、幻灯片，还有大约三个月后和委员会的一场约会。"
- en: "Not yet."
  zh: "再等等。"
- en: "Maybe next year."
  zh: "明年再说吧。"
- en: "Thirty applications, one cover letter, many small edits."
  zh: "海投三十家，一封求职信，改了无数个小细节。"
- en: "Two careful applications."
  zh: "精挑细选，投了两家。"
- en: "You sign. Summer will look different this year."
  zh: "你签了。今年的夏天会很不一样。"
- en: "You stay in the lab for the summer."
  zh: "你暑假留在实验室。"
- en: "Research statement submitted. Results come in the spring."
  zh: "研究陈述交上去了。春天出结果。"
- en: "Not this year."
  zh: "今年就算了。"
- en: "You skip the market this year to focus on the thesis."
  zh: "你今年不找工作，专心写博士论文。"
- en: "You polish your CV, your website and your research statement, in that order, several times."
  zh: "你把简历、个人主页和研究陈述按这个顺序反复打磨了好几遍。"
- en: "You accept: {name}. They'll wait until you defend."
  zh: "你接受了：{name}。对方会等你答辩完。"
- en: "You decline and plan to try again next year."
  zh: "你全都拒了，打算明年再试。"
- en: "You stay."
  zh: "你决定接着读。"
- en: "Your thesis is ready, but you have only {n} first-author papers accepted. The defense happens as soon as the third one lands."
  zh: "博士论文写好了，但你只有 {n} 篇一作论文中稿。第三篇一中，马上答辩。"
- en: "You won the fellowship!"
  zh: "你拿到奖学金了！"
- en: "Next academic year is yours: no TA duty, and a line on your CV that people notice."
  zh: "下一学年归你了：不用当助教，简历上还多了亮眼的一行。"
- en: "Fellowship results: not this time. The feedback is polite and mostly about “broader impacts”."
  zh: "奖学金结果：这次没拿到。反馈很客气，大多在讲“更广泛的影响”。"
- en: "a tech company"
  zh: "一家科技公司"
- en: "Internship season: no offers this year. A few nice rejection emails, and one that called you by someone else's name."
  zh: "实习季：今年 0 offer。几封客气的拒信，其中一封还叫错了你的名字。"
- en: "Your internship at {company} starts. Weekends are still yours."
  zh: "你在 {company} 的实习开始了。周末还是你自己的。"
- en: "They offer you a full-time return offer, whenever you're ready."
  zh: "对方给了你转正 offer，你什么时候准备好都可以来。"
- en: "Your internship project turns into a paper you can submit."
  zh: "你的实习项目变成了一篇可以投的论文。"
- en: "Your internship at {company} ends."
  zh: "你在 {company} 的实习结束了。"
- en: "You leave with new friends and better code."
  zh: "你带着新朋友和更好的代码离开了。"
- en: "Apply for summer internships"
  zh: "申请暑期实习"
- en: "Summer in industry · offers in March"
  zh: "暑期去业界 · 3 月出 offer"
- en: "Apply for a fellowship"
  zh: "申请奖学金"
- en: "A year without TA duty · results in February"
  zh: "一年不用当助教 · 2 月出结果"
- en: "Prepare for quals"
  zh: "准备资格考试"
- en: "Fully prepared · pass odds {odds}"
  zh: "准备充分 · 通过几率{odds}"
- en: "Pass odds {now} → {next}"
  zh: "通过几率{now} → {next}"
- en: "Pass odds {now} → a bit better"
  zh: "通过几率{now} → 再高一点"
- en: "Schedule your thesis proposal"
  zh: "安排开题"
- en: "Present in {weeks} weeks"
  zh: "{weeks} 周后报告"
- en: "Start defense preparation"
  zh: "开始准备答辩"
- en: "About three months · third paper still under review"
  zh: "约三个月 · 第三篇还在审"
- en: "About three months"
  zh: "约三个月"
- en: "Go on the job market"
  zh: "开始找工作"
- en: "Apply now · offers in spring"
  zh: "现在就投 · 春天出 offer"
- en: "You send out internship applications: one CV, many small edits."
  zh: "你投出了实习申请：一份简历，改了无数个小地方。"
- en: "Fellowship application submitted. Results come in February."
  zh: "奖学金申请交上去了。2 月出结果。"
- en: "Proposal scheduled. Your committee: {names}."
  zh: "开题定好了。你的委员会：{names}。"
- en: "Defense preparation begins: thesis chapters, slides, and a date with your committee in about three months."
  zh: "答辩准备开始：博士论文的章节、幻灯片，还有大约三个月后和委员会的一场约会。"
- en: "You go on the job market. You polish your CV, your website and your research statement, in that order, several times."
  zh: "你开始找工作。简历、个人主页、研究陈述，按这个顺序反复打磨了好几遍。"
- en: "Reviews are in for “{title}”: {scores} out of 5."
  zh: "“{title}”的审稿意见出来了：{scores}（满分 5 分）。"
- en: "{name}'s paper, with you as a co-author, is accepted at {venue}."
  zh: "{name} 的论文（你是合作者）中了 {venue}。"
- en: "{name}'s paper, with you as a co-author, is rejected. {name} shrugs and starts revising."
  zh: "{name} 的论文（你是合作者）被拒了。{name} 耸耸肩，开始改稿。"
- en: "Desk rejected at {venue}: “{title}”."
  zh: "{venue} 直接拒稿：“{title}”。"
- en: "Rejected at {venue}: “{title}”."
  zh: "{venue} 拒稿：“{title}”。"
- en: "Major revision for “{title}” at {venue}. Work on it to address the reviews; it goes back when the revision is done."
  zh: "“{title}”在 {venue} 拿到了大修。接着做这个项目来回应审稿意见；改完就会重新提交。"
- en: "Revise and resubmit for “{title}” at {venue}. Work on it to address the reviews; it goes back when the revision is due."
  zh: "“{title}”在 {venue} 拿到了大修重投 (R&R)。接着做这个项目来回应审稿意见；到修改截止时就会重新提交。"
- en: "You fixed the weakest part of “{title}” before submitting."
  zh: "投稿前，你补上了“{title}”最薄弱的地方。"
- en: "You send the revision of “{title}” back to {venue}."
  zh: "你把“{title}”的修改稿交回了 {venue}。"
- en: "Submitted “{title}” to {venue}, with a preprint."
  zh: "“{title}”投到了 {venue}，也挂了预印本。"
- en: "Submitted “{title}” to {venue}."
  zh: "“{title}”投到了 {venue}。"
- en: "“{title}” wasn't ready in time. On to the next deadline."
  zh: "“{title}”没赶上。下一个截稿再见。"
- en: "{name} graduated and joined a big tech lab."
  zh: "{name} 毕业了，去了大厂的研究院。"
- en: "{name}, your old labmate, joined a big tech lab."
  zh: "你以前的同门 {name} 去了大厂的研究院。"
- en: "{name} graduated and started a postdoc."
  zh: "{name} 毕业了，开启了博后生涯。"
- en: "{name}, your old labmate, started a postdoc."
  zh: "你以前的同门 {name} 开启了博后生涯。"
- en: "{name} graduated and founded a startup."
  zh: "{name} 毕业了，出去创业了。"
- en: "{name}, your old labmate, founded a startup."
  zh: "你以前的同门 {name} 出去创业了。"
- en: "{name} graduated and took a faculty job."
  zh: "{name} 毕业了，拿到教职，成了青椒。"
- en: "{name}, your old labmate, took a faculty job."
  zh: "你以前的同门 {name} 拿到教职，成了青椒。"
- en: "{name} graduated and moved home to teach."
  zh: "{name} 毕业了，回老家教书去了。"
- en: "{name}, your old labmate, moved home to teach."
  zh: "你以前的同门 {name} 回老家教书去了。"
- en: "{name} joins the lab as a first-year."
  zh: "一年级新生 {name} 进组了。"
- en: "Empirical NLP"
  zh: "实证 NLP"
- en: "Human-centered study"
  zh: "以人为中心的研究"
- en: "System + evaluation"
  zh: "系统 + 评估"
- en: "Dataset / benchmark"
  zh: "数据集 / 基准"
- en: "Position / survey"
  zh: "立场论文 / 综述"
- en: "HCI"
  zh: "HCI"
- en: "ML"
  zh: "ML"
- en: "Idea"
  zh: "想法"
- en: "Related work"
  zh: "相关工作"
- en: "Pilot"
  zh: "预实验"
- en: "Experiments"
  zh: "实验"
- en: "Consolidation"
  zh: "整合成文"
- en: "Study design"
  zh: "研究设计"
- en: "IRB review"
  zh: "伦理审查"
- en: "Recruiting"
  zh: "招募"
- en: "Study sessions"
  zh: "跑被试"
- en: "Analysis"
  zh: "分析"
- en: "Building"
  zh: "开发"
- en: "User study"
  zh: "用户研究"
- en: "Annotation guidelines"
  zh: "标注规范"
- en: "Annotation"
  zh: "标注"
- en: "Baselines"
  zh: "基线实验"
- en: "Revising"
  zh: "修改"
- en: "very likely"
  zh: "很高"
- en: "likely"
  zh: "较高"
- en: "about even"
  zh: "五五开"
- en: "unlikely"
  zh: "较低"
- en: "a long shot"
  zh: "很低"
- en: "{title}: the revision is done. Ready to submit."
  zh: "{title}：修改完成，可以投稿了。"
- en: "{title}: it all comes together. Ready to submit."
  zh: "{title}：终于成型了，可以投稿了。"
- en: "framing"
  zh: "立意"
- en: "evidence"
  zh: "证据"
- en: "writing"
  zh: "写作"
- en: "{title}: the {part} is stronger now, so it should review better."
  zh: "{title}：{part}这块更扎实了，审稿时应该能多拿点分。"
- en: "waiting, about {weeks} weeks"
  zh: "等待中，大约 {weeks} 周"
- en: "on hold for {weeks} weeks"
  zh: "暂停 {weeks} 周"
- en: "ready to submit"
  zh: "可以投稿了"
- en: "{chance} to finish in a full turn of work"
  zh: "专心做一轮，完成几率{chance}"
- en: "More on {topic} (Part {n})"
  zh: "再谈{topic}（第 {n} 篇）"
- en: "{title}: {done} is done. On to {next} (about {weeks} weeks)."
  zh: "{title}：{done}完成了。接下来是{next}（大约 {weeks} 周）。"
- en: "{title}: {done} is done. On to {next}."
  zh: "{title}：{done}完成了。接下来是{next}。"
- en: "Y{year} {dates}"
  zh: "第 {year} 年 {dates}"
- en: "Clarify"
  zh: "澄清"
- en: "Point to what the paper already says. Works when they misread."
  zh: "指出论文里已经写了的内容。适合对方读错了的时候。"
- en: "Concede and promise fixes"
  zh: "认错并承诺修改"
- en: "Safe for minor points. You must deliver them in the camera-ready."
  zh: "小问题上很稳妥。但终稿里必须兑现。"
- en: "Run new experiments"
  zh: "补实验"
- en: "Strong for soundness concerns. Costs 2 days and Energy; results can disappoint."
  zh: "审稿人质疑可靠性时最有效。要花 2 天和一些精力；结果也可能不如人意。"
- en: "Push back politely"
  zh: "礼貌地反驳"
- en: "Good when they're wrong and open-minded. Risky otherwise."
  zh: "对方错了、又肯听的时候好用。否则有风险。"
- en: "Passive-aggressive reply"
  zh: "阴阳怪气地回复"
- en: "Satisfying to write. Almost never a good idea."
  zh: "写的时候很爽。几乎从来不是好主意。"
- en: "Flag it as LLM-written"
  zh: "举报这是 LLM 写的"
- en: "Ask the area chair to discount this review. Only offered when a review reads that way."
  zh: "请领域主席 (AC) 降低这份审稿意见的权重。只有审稿意见读着像 LLM 写的时候才会出现。"
- en: "The paper studies an interesting problem."
  zh: "本文研究了一个有趣的问题。"
- en: "Author response: {paper}"
  zh: "作者回复：{paper}"
- en: "You'd already fixed this before submitting. The reply writes itself."
  zh: "这个你投稿前就改好了。回复信手拈来。"
- en: "Your clarification lands."
  zh: "你的澄清说服了对方。"
- en: "They skim your clarification."
  zh: "对方扫了一眼你的澄清。"
- en: "Clarifying doesn't fix a real problem."
  zh: "真有问题，澄清也解决不了。"
- en: "They appreciate the honesty."
  zh: "对方欣赏你的坦诚。"
- en: "The new results convince them."
  zh: "新结果说服了对方。"
- en: "Nice results, though not quite what they asked."
  zh: "结果不错，只是不太是对方想要的。"
- en: "The new baseline beats you. You report it honestly."
  zh: "新加的 baseline 比你的方法还强。你如实报告了。"
- en: "The experiment doesn't finish in time."
  zh: "实验没能按时跑完。"
- en: "Your pushback is fair, and they see it."
  zh: "你的反驳有理，对方也认了。"
- en: "They don't enjoy being contradicted on a real issue."
  zh: "在真问题上被顶回去，对方不太高兴。"
- en: "Somehow, it works. Legendary."
  zh: "离谱，居然奏效了。传奇。"
- en: "They noticed the tone."
  zh: "对方读出了你的阴阳怪气。"
- en: "The area chair agrees this review reads as LLM-written and discounts it."
  zh: "领域主席也觉得这份审稿意见像 LLM 写的，降低了它的权重。"
- en: "The area chair notes your concern."
  zh: "领域主席记下了你的意见。"
- en: "No sign this reviewer read the response."
  zh: "这位审稿人连“已读”都没给。"
- en: "After reading the other reviews, they lower their score."
  zh: "看完其他审稿意见，对方反手把分降了。"
