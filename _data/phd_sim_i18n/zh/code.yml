  zh: "练是练过了，大概吧。"
- en: "You haven't practiced as much as you meant to."
  zh: "你练得没有原计划那么多。"
- en: "Put up your poster"
  zh: "去贴海报"
- en: "Walk up to the podium"
  zh: "走上讲台"
- en: "You're running on fumes."
  zh: "你已经快撑不住了。"
- en: "Your poster session is tomorrow."
  zh: "明天就是你的海报展示。"
- en: "Your poster session is in {n} days."
  zh: "{n} 天后是你的海报展示。"
- en: "Your talk is tomorrow."
  zh: "明天就要做报告了。"
- en: "Your talk is in {n} days."
  zh: "{n} 天后做报告。"
- en: "You sleep off the jet lag."
  zh: "一觉睡下来，时差倒过来了。"
- en: "Jet lag: your body thinks it's the middle of the night."
  zh: "时差：你的身体以为现在是半夜。"
- en: "Your poster draws a crowd until they turn the lights off. Two people take pictures of it."
  zh: "你的海报前一直围着人，直到会场关灯。还有两个人拍了照。"
- en: "Afterward, a small line forms to talk to you, and someone asks for your slides."
  zh: "讲完后有几个人排着队来找你聊，还有人问你要幻灯片。"
- en: "A steady trickle of visitors, and a few good conversations."
  zh: "来看的人不多不少，也聊出了几段不错的对话。"
- en: "Polite applause. A couple of people find you at the coffee break."
  zh: "掌声很礼貌。茶歇时有两三个人来找你聊。"
- en: "It's a quiet session. The few people who stop really listen, at least."
  zh: "这场很冷清。好在停下来的那几个人是真的在认真听。"
- en: "It's over. Your hands stop shaking somewhere around the coffee break."
  zh: "终于讲完了。你的手一直抖到茶歇才停。"
- en: "Your talk went really well."
  zh: "你的报告非常成功。"
- en: "Your talk went fine."
  zh: "你的报告还算顺利。"
- en: "Your talk was rough, but you got through it."
  zh: "报告讲得磕磕绊绊，但总算撑下来了。"
- en: "Your poster was a hit."
  zh: "你的海报很受欢迎。"
- en: "Your poster session went fine."
  zh: "你的海报展示还算顺利。"
- en: "Your poster session was quiet, but you got through it."
  zh: "海报前有点冷清，但你总算撑下来了。"
- en: "Flying home from {venue}"
  zh: "从 {venue} 飞回家"
- en: "A week in {city}: talks, coffee, too little sleep and a lot of people. You met {n} people worth remembering."
  zh: "在{city}的一周：报告、咖啡、总也睡不够的觉，还有很多很多人。你认识了 {n} 个值得记住的人。"
- en: "More people in the field know your name now."
  zh: "领域里知道你名字的人更多了。"
- en: "Back to the lab"
  zh: "回实验室"
- en: "A week at {venue} in {city}: you present “{title}” and meet {n} people."
  zh: "在{city}参加 {venue} 的一周：你讲了“{title}”，认识了 {n} 个人。"
- en: "Tech hiring is booming. Recruiters are suddenly very friendly."
  zh: "科技行业招人正火。HR 突然都对你热情得不得了。"
- en: "Industry announces hiring freezes. The job boards go quiet."
  zh: "业界纷纷冻结招聘，求职网站一片冷清。"
- en: "The job market settles back to normal."
  zh: "就业市场恢复正常了。"
