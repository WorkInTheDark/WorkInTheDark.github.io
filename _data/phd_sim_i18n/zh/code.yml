  zh: "你的健康在走下坡路：更容易生病，干活也会慢一点。休息充电有用；有人约健身或爬山时答应下来，也有用。"
- en: "You're running on fumes: with Energy this low, everything gets less done. Two weeks of recharging help."
  zh: "你快没电了：精力这么低，做什么都要打折扣。休息充电两周会好些。"
- en: "Your stress is high. Recharging and the good things that come up (friends, trips, hobbies) bring it down; at 100 you burn out."
  zh: "你压力很大。休息充电和生活里的好事（朋友、旅行、爱好）都能让它降下来；到 100 就会倦怠。"
