# Translations whose English no longer appears (kept to help re-translate edited lines).
- en: "This run couldn’t be checked, most likely because the game was updated while you played."
  zh: "这局没能核对通过，多半是你玩的时候游戏更新了。"
- en: "This run started before the leaderboard existed, so it can’t be checked or ranked."
  zh: "这局是排行榜上线前开始的，没法核对，也就上不了榜。"
- en: "The server replays your choices to check the result, and shows only your nickname and numbers."
  zh: "服务器会按你的每一步选择重放一遍来核对成绩，榜上只显示昵称和数据。"
- en: "Checking your run…"
  zh: "正在核对……"
- en: "Ranked by research record: papers, top venues, h-index, citations and letters. Each board shows a player’s best run, and every run is replayed on the server before it counts. The daily PhD changes at midnight UTC (8 am in Beijing)."
  zh: "按研究成绩排名：论文、顶会、h 指数、引用和推荐信。每个榜只保留一个人的最好成绩，每局都会先在服务器上重放核对。今日挑战在 UTC 零点（北京时间早上 8 点）换新。"
- en: "Ranked by research record: papers, top venues, h-index, citations and letters. Each board shows a player’s best run. The daily PhD changes at midnight UTC (8 am in Beijing)."
  zh: "按研究成绩排名：论文、顶会、h 指数、引用和推荐信。每个榜只保留一个人的最好成绩。今日挑战在 UTC 零点（北京时间早上 8 点）换新。"
- en: "Everyone plays the same game today, with the same start and the same luck, ranked on today’s leaderboard."
  zh: "今天所有人玩同一局，开局和运气都一样，成绩进今日排行榜。"
- en: "Everyone plays the same game today: the same start and the same luck. Only your choices differ."
  zh: "今天所有人玩同一局：开局和运气都一样，只看你怎么选。"
- en: "Everyone who plays today gets the same traits and the same world: topics, model releases and luck, until your choices diverge."
  zh: "今天所有玩家的开局都一样：特质、课题、模型发布和运气全都相同，直到你们做出不同的选择。"
- en: "Everyone gets the same game today; only the choices differ."
  zh: "今天大家玩的是同一局，区别只在选择。"
- en: "Ranked by research record: papers, top venues, h-index, citations and letters. Each board shows a player’s best run. The daily PhD changes at midnight US Eastern Time (noon or 1 pm in Beijing, depending on daylight saving)."
  zh: "按研究成绩排名：论文、顶会、h 指数、引用和推荐信。每个榜只保留一个人的最好成绩。今日挑战在美东时间零点换新（北京时间中午 12 点或下午 1 点，随夏令时变化）。"
- en: "From PhD 101, for how you played"
  zh: "来自 PhD 101，按你的玩法挑选"
- en: "PhD 101 episodes picked for how you played."
  zh: "按你这局的玩法挑的几篇 PhD 101。"
- en: "You catch something nasty. The next two weeks will be slow."
  zh: "你得了场重感冒，接下来两周干啥都慢半拍。"
