# zh translations for flavor_advisor (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Your advisor's out-of-office reply has its own out-of-office reply."
  zh: "导师的自动回复也设置了自动回复。"
- en: "You catch your advisor on a conference livestream. It's the longest you've seen them this month."
  zh: "你在一场会议直播里看到了导师。这是你这个月见导师最久的一次。"
- en: "A calendar invite arrives: \"Sync about the sync.\""
  zh: "收到一个日程邀请：“关于同步会的同步会。”"
- en: "Your advisor leaves a comment on your comment."
  zh: "导师在你的批注上又加了一条批注。"
- en: "Your advisor's whiteboard says \"Papers this year: 9\", and it's only October."
  zh: "导师的白板上写着“今年论文：9 篇”，而现在才十月。"
- en: "The lab's one GPU has a sign-up sheet taped to it. Your advisor always signs up last."
  zh: "实验室唯一的那块 GPU 上贴着一张预约表。导师每次都排在最后。"
- en: "Every slide at lab meeting now has an Aim number in the corner."
  zh: "组会上的每页幻灯片，角落里现在都标着基金的 Aim 编号。"
- en: "Your advisor's new idea arrived at 2 am. By 9 am it had a sequel."
  zh: "导师的新想法凌晨 2 点到了。到早上 9 点，它已经有续集了。"
- en: "Your advisor joins lab meeting from a company building, in front of a ping-pong table."
  zh: "导师在公司大楼里接入组会，背景是一张乒乓球桌。"
- en: "Your advisor starts a sentence with \"Back in 1994\". You take notes."
  zh: "导师开口就是“想当年，1994 年……”。你开始记笔记。"
- en: "Your advisor's email signature lists four companies. One is new this week."
  zh: "导师的邮件签名里列着四家公司，其中一家是这周新加的。"
- en: "Your advisor writes \"n = ?\" in the margin of your vacation request."
  zh: "导师在你的请假申请旁边批注：“n = ?”"
- en: "Your advisor replies at 1:12 am: \"Great figure.\""
  zh: "导师凌晨 1:12 回复：“图很好。”"
- en: "You now notice orphan words in other people's papers."
  zh: "你开始注意到别人论文里独占一行的单词了。"
- en: "Lab meeting bubble tea arrives. Yours is already labeled."
  zh: "组会的奶茶到了。你那杯已经写好了名字。"
- en: "Your advisor fixes the capitalization in your email's subject line."
  zh: "导师改了你邮件标题里的大小写。"
- en: "A comment on your draft asks \"Who cares?\", followed by a small smiley face."
  zh: "你草稿上有一条批注：“谁会关心这个？”后面画了个小笑脸。"
