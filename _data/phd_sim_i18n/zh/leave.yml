# zh translations for leave (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Play music again"
  zh: "重新玩起音乐"
- en: "The guitar has been in its case since your first year."
  zh: "那把吉他从你博一起就没出过琴盒。"
- en: "You relearn three chords and one whole song. Your neighbors learn it too."
  zh: "你重新学会了三个和弦和一整首歌。邻居们也学会了。"
- en: "You play for an hour without checking your phone once."
  zh: "你弹了一个小时，一次手机都没看。"
- en: "Music is part of your week again."
  zh: "音乐又回到了你每周的日常里。"
- en: "Get your body back"
  zh: "把身体练回来"
- en: "Running, climbing, anything that gets you outside."
  zh: "跑步、攀岩，能把你拽出门的都行。"
- en: "You run three times a week. By the end, you take the stairs to your apartment for fun."
  zh: "你一周跑三次。到后来，回家爬楼梯都成了乐趣。"
- en: "The regulars at the climbing gym start saying hi."
  zh: "攀岩馆的老面孔开始跟你打招呼了。"
- en: "Exercise isn't a chore anymore. It's the best hour of your day."
  zh: "运动不再是任务，而是你一天里最好的一小时。"
- en: "Go home for a while"
  zh: "回家住一阵子"
- en: "Your old room, home cooking, and nobody asking about your paper."
  zh: "你的老房间，家里的饭菜，还有没人追问你的论文。"
- en: "Your parents ask about the paper exactly once, then feed you for two weeks."
  zh: "爸妈只问了一次论文的事，然后喂了你整整两周。"
- en: "You sleep in your childhood bed and wake up at noon. Nobody minds."
  zh: "你睡在小时候的床上，一觉睡到中午，也没人说你。"
- en: "Travel somewhere you always meant to go"
  zh: "去一直想去的地方旅行"
- en: "The trip you kept moving to after the next deadline."
  zh: "那趟一拖再拖、总说“等这个截稿完再去”的旅行。"
- en: "Two weeks somewhere with no Wi-Fi in the rooms and great noodles on every corner."
  zh: "两周时间，住的地方没有 Wi-Fi，街角却都是好吃的面馆。"
- en: "On a train you meet a stranger who has never heard of peer review. It's wonderful."
  zh: "你在火车上遇到一个从没听说过同行评审的人。太美好了。"
- en: "Take a part-time job"
  zh: "找份兼职"
- en: "Some money, some structure, and a look at life outside academia."
  zh: "挣点钱，过点有规律的日子，顺便看看学术圈外的生活。"
- en: "You help a small company clean up its data. They pay on time and say thank you."
  zh: "你帮一家小公司清理数据。他们按时付钱，还会说谢谢。"
- en: "Your manager leaves at 5:30 every day. You find this fascinating."
  zh: "你的经理每天五点半准时下班。你觉得这件事非常神奇。"
- en: "See a therapist every week"
  zh: "每周去看心理咨询"
- en: "The counseling center has an opening on Tuesdays."
  zh: "学校心理咨询中心周二还有空位。"
- en: "You talk for fifty minutes and leave lighter than you came in."
  zh: "你聊了五十分钟，走的时候比来的时候轻松。"
- en: "Your therapist asks what you'd do if the PhD didn't exist. You don't have an answer yet, but you like the question."
  zh: "咨询师问你：要是没有读博这回事，你会做什么？你还没想好答案，但你喜欢这个问题。"
- en: "Now you can see the warning signs a few weeks before they arrive."
  zh: "现在你能提前几周看出那些危险信号了。"
- en: "Foster a cat from the shelter"
  zh: "从救助站临时领养一只猫"
- en: "Just for a few weeks. That's what everyone says."
  zh: "就养几周而已。大家一开始都这么说。"
- en: "The cat sleeps on your laptop, which is the most use the laptop gets these days."
  zh: "猫睡在你的笔记本电脑上。这是这台电脑最近唯一的用处。"
- en: "The cat learns its name. You learn its schedule."
  zh: "猫记住了自己的名字，你记住了它的作息。"
- en: "The foster papers turn into adoption papers. It was never going to go any other way."
  zh: "临时寄养协议变成了正式领养协议。从一开始就注定是这个结局。"
