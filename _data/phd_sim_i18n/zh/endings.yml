# zh translations for endings (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Tenure-Track Professor"
  zh: ""
- en: "Academia"
  zh: ""
- en: "An assistant professor job: your own lab, and your own grant rejections."
  zh: ""
- en: "You start your own lab. Your first student arrives in September, nervous and brilliant. You catch yourself saying things your advisor used to say, and you mostly mean them."
  zh: ""
- en: "Professor at a Teaching College"
  zh: ""
- en: "A teaching job with small classes and students who come to office hours."
  zh: ""
- en: "You teach, and you are good at it. Every year a few students find you after class with a question that turns into a project."
  zh: ""
- en: "Postdoc in a Famous Lab"
  zh: ""
- en: "Two years in a lab everyone has heard of."
  zh: ""
- en: "You join a lab whose papers you used to read in reading group. The coffee is better and the deadlines are the same."
  zh: ""
- en: "The Eternal Postdoc"
  zh: ""
- en: "A postdoc, and probably another one after that."
  zh: ""
- en: "Your first postdoc becomes your second. You know every visa form by heart and every reviewer by writing style."
  zh: ""
- en: "Lecturer Across the Pond"
  zh: ""
- en: "A permanent lectureship overseas, with a new vocabulary for everything."
  zh: ""
- en: "You move abroad, learn what \"REF\" means, and find that most collaborations start at the tea break."
  zh: ""
- en: "Faculty Back Home"
  zh: ""
- en: "A faculty job in your home country, near family."
  zh: ""
- en: "You go home with a doctorate and a suitcase of ideas. Your parents finally understand your job: you are a professor now."
  zh: ""
- en: "Research Scientist at a Frontier Lab"
  zh: ""
- en: "Industry"
  zh: ""
- en: "A research job at one of the labs everyone is racing."
  zh: ""
- en: "You join a frontier lab with more compute than you can imagine. Sometimes your name is on a paper the whole field reads."
  zh: ""
- en: "Research Scientist at Big Tech"
  zh: ""
- en: "A research scientist role with a stable team and a nice badge."
  zh: ""
- en: "You become a research scientist at a big company. You still publish, but now there's a budget and nobody asks you to TA."
  zh: ""
- en: "Applied Scientist"
  zh: ""
- en: "Build models that real users touch."
  zh: ""
- en: "Your models ship. Millions of people use something you made, and none of them know your name, which turns out to be fine."
  zh: ""
- en: "ML Engineer (with a PhD, for Fun)"
  zh: ""
- en: "Good pay, and coworkers who call you Doctor as a joke."
  zh: ""
- en: "You write code all day and sleep well at night. Sometimes you miss research. Then someone mentions Reviewer 2, and you stop missing it."
  zh: ""
- en: "Quant Researcher"
  zh: ""
- en: "A trading firm wants your statistics skills."
  zh: ""
- en: "You move into finance. The salary is absurd, and your p-values are finally worth money."
  zh: ""
- en: "UX Researcher"
  zh: ""
- en: "Lead user research for AI products."
  zh: ""
- en: "You spend your days talking to the people who use AI products, which is what your PhD trained you to do best. Product teams start asking for you by name."
  zh: ""
- en: "The Return Offer"
  zh: ""
- en: "Your internship team wants you back, full time."
  zh: ""
- en: "You go back to the team from your internship. Your old desk is still there, and so is the sticky note you left on the monitor."
  zh: ""
- en: "Founder, Acquired"
  zh: ""
- en: "Startup"
  zh: ""
- en: "You start a company from your thesis. Three stressful years later, a big company buys it. You take a long vacation, then start reading papers again."
  zh: ""
- en: "Founder, Pivoted to B2B SaaS"
  zh: ""
- en: "Your startup begins as a research vision and becomes a dashboard for enterprise customers. It pays the bills. You still have the original slide deck."
  zh: ""
- en: "Founder, Then Big Tech"
  zh: ""
- en: "Your startup doesn't make it, and you learn more in eighteen months than in five years of grad school. A big lab hires you the week after you close it."
  zh: ""
- en: "Start Your Own Company"
  zh: ""
- en: "Turn your thesis into a startup. The risk is high and the stories are great."
  zh: ""
- en: "Employee #4 at a Labmate's Startup"
  zh: ""
- en: "Your old labmate's startup wants you, and it's offering equity and chaos."
  zh: ""
- en: "You join your labmate's startup as employee number four. The office is a converted garage and the whiteboard has your old lab's handwriting on it."
  zh: ""
- en: "Policy Fellow"
  zh: ""
- en: "Other"
  zh: ""
- en: "A fellowship advising on AI policy."
  zh: ""
- en: "You explain language models to people who write the rules. Then you explain them again the next week."
  zh: ""
- en: "Science Journalist"
  zh: ""
- en: "Write about AI for people who will never read an arXiv paper."
  zh: ""
- en: "You become the person who explains AI research to the public, carefully, without the hype. Researchers start sending you their preprints."
  zh: ""
- en: "AI YouTuber"
  zh: ""
- en: "Your paper explainer videos have an audience. Make it a job."
  zh: ""
- en: "Your paper explainers find an audience and a sponsor. The comments are full of grad students thanking you."
  zh: ""
- en: "Clinical Informatics at a Hospital"
  zh: ""
- en: "Join a hospital's informatics team and put your work at the bedside."
  zh: ""
- en: "You join the hospital you used to recruit clinicians from. Now you're the one they call when the alerts don't make sense, and you fix them."
  zh: ""
- en: "Master's Out, Happily"
  zh: ""
- en: "Leaving"
  zh: ""
- en: "You leave with a Master's degree and no regrets. The skills come with you, and so do the friends."
  zh: ""
- en: "Bubble Tea Shop Owner"
  zh: ""
- en: "You open a bubble tea shop near campus. Grad students come in at odd hours, and you always know what they need: half sugar, and someone to say the paper will be fine."
  zh: ""
- en: "Switched Fields"
  zh: ""
- en: "You start medical school. Your classmates are amazed that you already know what an EHR is, and that you have opinions about its interface."
  zh: ""
- en: "Back to the Family Business"
  zh: ""
- en: "You go home and join the family business. Within a year you've automated the inventory and your aunt calls you \"the scientist\"."
  zh: ""
- en: "The Eternal Student"
  zh: ""
- en: "Year eight ends and the university gently points out the time limit. You leave with a Master's degree and a drawer of almost-finished papers."
  zh: ""
