# zh translations for events/legion (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Ten Minutes at Gate B12"
  zh: ""
- en: "Your first meeting with {advisor} in months is ten minutes long, on video, at an airport gate. Boarding starts in eight."
  zh: ""
- en: "Ask the one question that matters"
  zh: ""
- en: "Their answer, given while they board, saves you a month."
  zh: ""
- en: "They answer a different question. Then the call drops."
  zh: ""
- en: "Give a three-minute update"
  zh: ""
- en: "They nod a lot and say \"great, keep going\" just before the gate closes."
  zh: ""
- en: "Ask for an intro to someone useful"
  zh: ""
- en: "Between announcements, they forward your email to two famous people, and one of them replies."
  zh: ""
- en: "Doors You Didn't Know Existed"
  zh: ""
- en: "You asked {advisor} for a short letter for a summer program. Since then, three people you've never met have emailed to say they \"heard great things\"."
  zh: ""
- en: "Reply to all three"
  zh: ""
- en: "One becomes a mentor, one a collaborator, and one wants you on their workshop committee."
  zh: ""
- en: "Pick the one closest to your work"
  zh: ""
- en: "One long call with someone in exactly your area is worth ten networking dinners."
  zh: ""
- en: "Thank {advisor} properly"
  zh: ""
- en: "You send a real thank-you note. The reply comes within the hour, from another continent."
  zh: ""
- en: "Daily Stand-Ups"
  zh: ""
- en: "{advisor} announces daily stand-ups: fifteen minutes at 9 am, every day. \"Weekends included. Just a quick check-in.\""
  zh: ""
- en: "Show up every day"
  zh: ""
- en: "You're never stuck for long. You're also never not in a meeting."
  zh: ""
- en: "Negotiate weekdays only"
  zh: ""
- en: "\"Fine. Weekdays.\" Your Saturdays survive."
  zh: ""
- en: "\"Weekends are when real work happens.\" The stand-ups stay."
  zh: ""
- en: "Send a written stand-up each morning"
  zh: ""
- en: "You type three bullet points from bed each morning. {advisor} replies with a thumbs-up every time."
  zh: ""
- en: "Figure, Version Four"
  zh: ""
- en: "{advisor} rewrites your figure captions, again. Overnight, they also rewrite the figure. The colors are now their favorite colors."
  zh: ""
- en: "Accept the changes"
  zh: ""
- en: "It is a slightly better figure. You are slightly annoyed that it's better."
  zh: ""
- en: "Explain your original choices"
  zh: ""
- en: "You keep your layout, and they keep their caption."
  zh: ""
- en: "They listen carefully, then send version five."
  zh: ""
- en: "Let them own the figures"
  zh: ""
- en: "You get a day back and lose a little ownership. The figures are very orange."
  zh: ""
- en: "All Very Doable"
  zh: ""
- en: "{advisor} sends a calendar invite titled \"Submission month!\": three deadlines in four weeks. \"All very doable.\""
  zh: ""
- en: "Go for all three"
  zh: ""
- en: "You push hard on all three, and one of them will probably be good. {advisor} is thrilled."
  zh: ""
- en: "Pick the strongest one"
  zh: ""
- en: "\"Fine. One great paper beats three okay ones.\" They mean it, mostly."
  zh: ""
- en: "They agree, then add a workshop paper \"on the side\"."
  zh: ""
- en: "Take two, give one to {labmate}"
  zh: ""
- en: "{labmate} takes the third deadline and thanks you for it."
  zh: ""
- en: "{labmate} is drowning too. You split the misery evenly."
  zh: ""
- en: "Out of Pocket"
  zh: ""
- en: "The lab's travel budget is empty, so {advisor} pays your conference registration with their own card. \"Don't mention it. Really.\""
  zh: ""
- en: "Accept, and say thank you"
  zh: ""
- en: "You write a thank-you note. It ends up pinned to their office door."
  zh: ""
- en: "Apply for a student travel grant"
  zh: ""
- en: "You win the grant and pay them back. They pretend to be annoyed."
  zh: ""
- en: "You don't get the grant, and {advisor} kindly insists on paying."
  zh: ""
- en: "Volunteer at the conference"
  zh: ""
- en: "Six hours at the badge desk get you free registration, and you meet everyone."
  zh: ""
- en: "TA, Again"
  zh: ""
- en: "You're a TA again this semester. {advisor} apologizes, sincerely, for the third time, and promises to protect the rest of your week."
  zh: ""
- en: "Say it's fine, really"
  zh: ""
- en: "It is mostly fine. The grading is less fine."
  zh: ""
- en: "Ask to TA a course you like"
  zh: ""
- en: "They make two calls. You get the HCI course, which you'd have audited anyway."
  zh: ""
- en: "The only opening is intro programming, with 300 students."
  zh: ""
- en: "Apply for a fellowship together"
  zh: ""
- en: "{advisor} goes through your application line by line. It's the best draft you've written."
  zh: ""
- en: "Progress Toward Aim 2"
  zh: ""
- en: "Annual grant report season. {advisor} assigns you Section 4.2, \"Progress Toward Aim 2\". You are not sure what Aim 2 is."
  zh: ""
- en: "Read the grant, then write it"
  zh: ""
- en: "Aim 2 turns out to be your project. You finally know why you're funded."
  zh: ""
- en: "Recycle your last paper's intro"
  zh: ""
- en: "It fits Aim 2 perfectly, and you're done in an afternoon."
  zh: ""
- en: "{advisor} notices right away: \"This is about Aim 3.\""
  zh: ""
- en: "Ask {senior} how they did theirs"
  zh: ""
- en: "{senior} sends last year's section and a warning about Table 3."
  zh: ""
- en: "The Lab Handbook"
  zh: ""
- en: "A 40-page lab handbook arrives, with a procedure for everything, including how to name your files."
  zh: ""
- en: "Read it cover to cover"
  zh: ""
- en: "Your files now follow the naming rules. Your code feels less fragile already."
  zh: ""
- en: "Suggest a one-page summary"
  zh: ""
- en: "{advisor} loves it. Your summary becomes the first page of the handbook."
  zh: ""
- en: "{advisor} adds your summary as a new three-page section."
  zh: ""
- en: "Skim it and keep working"
  zh: ""
- en: "You skip straight to the file names. Later you learn there's a short quiz."
  zh: ""
- en: "A 2 am Email"
  zh: ""
- en: "A 2:03 am email from {advisor}: \"New idea. Let's pivot the whole project.\" Attached is one blurry photo of a whiteboard."
  zh: ""
- en: "Pivot {project}"
  zh: ""
- en: "You're back at the idea stage, and the whiteboard photo is now your research plan."
  zh: ""
- en: "Ask what it would look like"
  zh: ""
- en: "You find the part of the idea that fits {project}. It adds novelty without throwing anything away."
  zh: ""
- en: "The more they explain, the bigger it gets."
  zh: ""
- en: "Say \"Love it! After the deadline.\""
  zh: ""
- en: "By the deadline there's a newer idea, and nobody mentions this one again."
  zh: ""
- en: "The Field Catches Up"
  zh: ""
- en: "Remember {advisor}'s wild idea from last year, the one everyone politely ignored? A big lab just published it. Now everyone wants to talk about it."
  zh: ""
- en: "Write a quick position paper"
  zh: ""
- en: "You post it within a week. People start citing it as \"the early one\"."
  zh: ""
- en: "Tell the lab \"We called it\""
  zh: ""
- en: "Lab meeting turns into a small party, and {advisor} brings cake."
  zh: ""
- en: "Point to the pivot you already made"
  zh: ""
- en: "Pivoted"
  zh: ""
- en: "Your project has been about this for a year. Suddenly you're early, not weird."
  zh: ""
- en: "The Hallway One-on-One"
  zh: ""
- en: "{advisor} has company meetings back to back, so your one-on-one happens while walking between buildings. You have four minutes and one staircase."
  zh: ""
- en: "Lead with the decision you need"
  zh: ""
- en: "\"Yes, do the second option.\" You have your answer before the bottom of the stairs."
  zh: ""
- en: "You start with background. They reach their meeting before you reach the point."
  zh: ""
- en: "Ask for compute instead of advice"
  zh: ""
- en: "\"Sure, use some company GPUs.\" Your jobs fly through the queue."
  zh: ""
- en: "Walk them to their next meeting"
  zh: ""
- en: "You end up in the meeting, then in a conversation about a summer internship."
  zh: ""
- en: "Two or Three Years"
  zh: ""
- en: "{advisor} mentions retiring \"in two or three years\". You do the math on your own timeline, and it's close."
  zh: ""
- en: "Ask about a co-advisor"
  zh: ""
- en: "{advisor} sets you up with a younger, well-funded co-advisor, just in case."
  zh: ""
- en: "\"Oh, you'll be done long before then!\" You hope so."
  zh: ""
- en: "Tighten your plan"
  zh: ""
- en: "Your five-year plan becomes a four-year plan. The spreadsheet looks brave."
  zh: ""
- en: "Trust it will work out"
  zh: ""
- en: "A labmate mentions {advisor} has said \"two or three years\" for a decade."
  zh: ""
- en: "Back in the 1990s"
  zh: ""
- en: "{advisor} tells another story about how the field did things in the 1990s. Halfway through, you realize it solves your problem."
  zh: ""
- en: "Ask for the old paper"
  zh: ""
- en: "They find it in a filing cabinet. It has no related work section and is exactly right."
  zh: ""
- en: "Try the old method"
  zh: ""
- en: "It works, and it's twenty times cheaper than your current approach."
  zh: ""
- en: "It worked in 1997. It does not work now, but you learn why."
  zh: ""
- en: "Start a lab history hour"
  zh: ""
- en: "{advisor} tells one story a month, and attendance is suspiciously high."
  zh: ""
- en: "Just a Quick Prototype"
  zh: ""
- en: "{advisor} has a new startup idea. \"Could you just build a quick prototype? A weekend, tops.\" It is not a weekend, tops."
  zh: ""
- en: "Build it"
  zh: ""
- en: "It takes two weeks. It's the cleanest code you've written, and now you know how startups work."
  zh: ""
- en: "Build a demo, not a product"
  zh: ""
- en: "You have a slick demo in two days, and {advisor} pitches it on Monday."
  zh: ""
- en: "The demo crashes mid-pitch. {advisor} says investors love authenticity."
  zh: ""
- en: "Point them to {labmate}"
  zh: ""
- en: "{labmate} has wanted exactly this for years and takes it gladly."
  zh: ""
- en: "Item 3 on the Roadmap"
  zh: ""
- en: "A slide from one of {advisor}'s startups shows up in lab meeting. Item 3 on the product roadmap is {project}, your thesis project."
  zh: ""
- en: "Ask for credit, politely"
  zh: ""
- en: "\"Of course! You're on the advisory board.\" You're not sure what that means yet."
  zh: ""
- en: "\"It's just a slide.\" The slide stays."
  zh: ""
- en: "Publish it first"
  zh: ""
- en: "You start writing faster, so the paper with your name on it comes out first."
  zh: ""
- en: "Take it as a compliment"
  zh: ""
- en: "At least somebody thinks your research could be a product."
  zh: ""
- en: "A Power Analysis for the Pilot"
  zh: ""
- en: "{advisor} reads your plan for a five-person pilot study and asks for a power analysis. \"For the pilot.\""
  zh: ""
- en: "Run the power analysis"
  zh: ""
- en: "It says the pilot needs 34 people. You negotiate down to 12."
  zh: ""
- en: "Explain what pilots are for"
  zh: ""
- en: "\"Fair. But write down your expected effect size.\""
  zh: ""
- en: "You receive a twenty-minute lecture on what pilots are for."
  zh: ""
- en: "Borrow {labmate}'s stats script"
  zh: ""
- en: "{labmate}'s script runs the analysis in five minutes."
  zh: ""
- en: "Their script is in a language you don't know, so you learn it."
  zh: ""
- en: "Ten Seeds and a Test"
  zh: ""
- en: "Your new method beats the baseline by 1.2 points. {advisor} won't believe it until you run ten seeds and a significance test."
  zh: ""
- en: "Run ten seeds"
  zh: ""
- en: "Seven seeds agree with you. The claim gets smaller, and the paper gets much stronger."
  zh: ""
- en: "Run three seeds and a bootstrap"
  zh: ""
- en: "{advisor} accepts it with a rare nod."
  zh: ""
- en: "\"Three is not ten.\" You run ten anyway."
  zh: ""
- en: "Report it as a trend, not a win"
  zh: ""
- en: "You write \"suggests\" instead of \"shows\". {advisor} approves of the verb."
  zh: ""
- en: "Show the test you already ran"
  zh: ""
- en: "Stats Nerd"
  zh: ""
- en: "You ran it last week, with ten seeds. {advisor} looks at you like a proud parent."
  zh: ""
- en: "The Ten Questions"
  zh: ""
- en: "Before {project} starts, {advisor} pulls up a list: ten questions every project should answer. \"Let's see which ones you can answer today.\""
  zh: ""
- en: "Answer all ten, right now"
  zh: ""
- en: "Ten for ten. {advisor} is quiet for a moment, then says: \"Okay. This one is ready.\""
  zh: ""
- en: "You give six good answers and stumble on four, so now you know what to read next."
  zh: ""
- en: "Answer the ones you know"
  zh: ""
- en: "You answer seven well, and the other three become your reading list."
  zh: ""
- en: "You manage four answers and a lot of \"it depends\". {advisor} helps you write down the rest."
  zh: ""
- en: "Ask for a week to prepare"
  zh: ""
- en: "You come back with all ten answered, a few of them shakily."
  zh: ""
- en: "87 Comments"
  zh: ""
- en: "Your draft of {project} comes back with 87 comments. All of them are polite and right, and several are about a single comma."
  zh: ""
- en: "Work through all 87"
  zh: ""
- en: "Once all 87 are resolved, it reads like a much better paper."
  zh: ""
- en: "Group them and fix the root causes"
  zh: ""
- en: "Most comments trace back to five problems. You fix those, and 60 comments disappear."
  zh: ""
- en: "You find the patterns but miss one. It brings back 20 comments in round two."
  zh: ""
- en: "Sleep on it before reading"
  zh: ""
- en: "After a night's sleep the comments read like help, and you fix them calmly."
  zh: ""
- en: "Push back on a few"
  zh: ""
- en: "You make your case on three. {advisor} agrees on two, and is glad you argued."
  zh: ""
- en: "Your argument is weaker than the comment. You both know it, and you both smile."
  zh: ""
- en: "Not Borderline"
  zh: ""
- en: "{advisor} reads the draft of {project} and says: \"We could submit this. But it's a borderline paper, and you can do better than borderline.\""
  zh: ""
- en: "Wait for the next cycle"
  zh: ""
- en: "You let this deadline go. The next version has the experiment reviewers would have asked for."
  zh: ""
- en: "Ask what would make it strong"
  zh: ""
- en: "They name one experiment. It takes four days, and it fits before the deadline."
  zh: ""
- en: "The honest answer is a month of work. You plan it for the next cycle."
  zh: ""
- en: "Submit anyway"
  zh: ""
- en: "{advisor} still helps you polish it, and wishes you luck."
  zh: ""
- en: "Close the Laptop"
  zh: ""
- en: "It's Saturday, and {advisor} spots you in the lab again. \"Close the laptop. The paper will still be here on Monday, and so will I.\""
  zh: ""
- en: "Close the laptop"
  zh: ""
- en: "You sleep and spend Sunday outside. On Monday you fix in an hour what took all of Friday."
  zh: ""
- en: "Get bubble tea together first"
  zh: ""
- en: "You share a drink and talk about anything but work. Then you go home."
  zh: ""
- en: "Finish just this one section"
  zh: ""
- en: "One section becomes three, and you get home at 9 pm, a little sheepish."
  zh: ""
- en: "Your Direction, Not Mine"
  zh: ""
- en: "You pitch an idea that competes with {advisor}'s plan for {project}. They think for a long moment. \"Let's do yours. You care about it more, and that matters.\""
  zh: ""
- en: "Go with your idea"
  zh: ""
- en: "You leave the meeting already writing. It feels like your project now."
  zh: ""
- en: "Do theirs, it's safer"
  zh: ""
- en: "Theirs is a fine project. You still think about yours in the shower."
  zh: ""
- en: "Merge the two ideas"
  zh: ""
- en: "The merged idea is better than both. {advisor} says so first."
  zh: ""
- en: "The merged idea has two heads and no body. You go back to yours."
  zh: ""
- en: "Meeting Canceled: Rest"
  zh: ""
- en: "You haven't taken a day off in a month. {advisor} cancels your Monday meeting: \"Nothing is due. Take the day off. That's the whole agenda.\""
  zh: ""
- en: "Take the day off"
  zh: ""
- en: "You sleep in and take a long walk. Tuesday goes noticeably better."
  zh: ""
- en: "Keep it, but make it ten minutes"
  zh: ""
- en: "You ask your one question and head home. {advisor} approves of the compromise."
  zh: ""
- en: "Use the slot to catch up"
  zh: ""
- en: "Your Monday is productive. Your Tuesday is not."
  zh: ""
- en: "Read the Same Day"
  zh: ""
- en: "You send {advisor} your draft at 2 pm, expecting comments next week. At 6 pm it's back, read end to end, with a summary on page 1."
  zh: ""
- en: "Turn the comments around fast"
  zh: ""
- en: "You get through two rounds in one week, and the draft starts to look like a paper."
  zh: ""
- en: "Read them twice before editing"
  zh: ""
- en: "On the second read you see the pattern, and fix the cause instead of the symptoms."
  zh: ""
- en: "Ask to talk through the big ones"
  zh: ""
- en: "Fifteen minutes on a call saves three rounds of email."
  zh: ""
- en: "Who Cares?"
  zh: ""
- en: "{advisor} listens to your pitch for {project}, then asks, kindly: \"Who cares?\" Then they wait, for as long as it takes."
  zh: ""
- en: "Name the people who would use it"
  zh: ""
- en: "You name three groups and what changes for each. {advisor} smiles: \"Write that down first.\""
  zh: ""
- en: "You say \"the community\". {advisor} keeps waiting, kindly."
  zh: ""
- en: "Admit you don't know yet"
  zh: ""
- en: "\"Good. Go find out.\" You spend two days talking to people who might care."
  zh: ""
- en: "Answer with the benchmark gain"
  zh: ""
- en: "\"That's who cares about the number. Who cares about the problem?\""
  zh: ""
- en: "Dinner Is On Me"
  zh: ""
- en: "{paper} is accepted at {venue}. {advisor} books a table for the whole lab: \"Dinner is on me. Order dessert.\""
  zh: ""
- en: "Order dessert, as instructed"
  zh: ""
- en: "Eleven people share three desserts, and nobody leaves early."
  zh: ""
- en: "Give a short toast"
  zh: ""
- en: "You thank everyone who ever read a draft. The lab cheers, a little too loudly."
  zh: ""
- en: "The toast runs long, but the lab claps anyway."
  zh: ""
- en: "Bring {mentee} along"
  zh: ""
- en: "{mentee} has never been to a lab dinner. They talk about it for weeks."
  zh: ""
- en: "One Circled Word"
  zh: ""
- en: "Your draft comes back with a single comment: a circled orphan word at the end of the abstract."
  zh: ""
- en: "Fix the orphan"
  zh: ""
- en: "One word moves up a line. The abstract looks finished."
  zh: ""
- en: "Tighten the whole abstract"
  zh: ""
- en: "To move one word, you rewrite four sentences. The abstract is better for it."
  zh: ""
- en: "Ask if that's the only comment"
  zh: ""
- en: "It is. The rest of the draft is fine. You read that sentence three times."
  zh: ""
- en: "Title Case or Sentence Case"
  zh: ""
- en: "Half your section headings are in Title Case and half are in Sentence case. {advisor} would like them consistent before the meeting."
  zh: ""
- en: "Fix them by hand"
  zh: ""
- en: "Fixing fourteen headings takes longer than it should."
  zh: ""
- en: "Write a macro for it"
  zh: ""
- en: "It fixes every heading in one go, and now lives in the lab template."
  zh: ""
- en: "The macro turns every heading into ALL CAPS. You fix them by hand."
  zh: ""
- en: "Ask which case they prefer"
  zh: ""
- en: "\"Pick one, and use it everywhere.\" You pick sentence case and write it down."
  zh: ""
- en: "Round Four"
  zh: ""
- en: "The axis labels in Figure 2 are 6 pt, so the figure goes back for its fourth round."
  zh: ""
- en: "Remake it at a readable size"
  zh: ""
- en: "Figure 2 is now legible from across the room. {advisor} replies: \"Better.\""
  zh: ""
- en: "Fix every figure while you're there"
  zh: ""
- en: "Every figure now uses the same fonts and colors, and the paper suddenly looks professional."
  zh: ""
- en: "Ask for the font rules in writing"
  zh: ""
- en: "You get a three-line style guide and tape it above your monitor."
  zh: ""
- en: "One Question"
  zh: ""
- en: "At your practice talk, your advisor asks one quiet question from the back, and the whole argument wobbles."
  zh: ""
- en: "Answer it on the spot"
  zh: ""
- en: "You find the answer mid-sentence. {advisor} nods: \"Put that on a slide.\""
  zh: ""
- en: "You don't have an answer yet, but now you know before the real talk."
  zh: ""
- en: "Rebuild the middle of the talk"
  zh: ""
- en: "Two days later the argument holds, and that question has its own slide."
  zh: ""
- en: "Add a backup slide"
  zh: ""
- en: "You add one slide in case anyone asks, and hope nobody does."
  zh: ""
- en: "Saw It Coming"
  zh: ""
- en: "Reviews for {paper} are in. Reviewer 2 asks exactly the question {advisor} asked before you submitted, and you already fixed it."
  zh: ""
- en: "Point to the section, calmly"
  zh: ""
- en: "Your reply is one sentence and a section number. It is deeply satisfying."
  zh: ""
- en: "Forward the review to {advisor}"
  zh: ""
- en: "You write one word: \"Wow.\" The reply: \"Good thing you fixed it. Now write the rebuttal.\""
  zh: ""
- en: "12:07 am"
  zh: ""
- en: "You send a draft at 11:50 pm. At 12:07 am, 30 comments arrive, ending with: \"No need to reply until Monday.\""
  zh: ""
- en: "Believe them and go to bed"
  zh: ""
- en: "On Monday you read all 30 with a clear head. They take one morning."
  zh: ""
- en: "Fix the easy ones now"
  zh: ""
- en: "You fix six before 1 am. The other 24 are still there on Monday, as promised."
  zh: ""
- en: "The Midnight Thread"
  zh: ""
- en: "At 12:30 am you send {advisor} a half-formed idea. They reply in four minutes. By 2 am the thread is 31 messages long, and it's your best idea of the year."
  zh: ""
- en: "Keep the thread going"
  zh: ""
- en: "By 3 am you have a title and a first figure, sketched in an email."
  zh: ""
- en: "Save it and sleep"
  zh: ""
- en: "{advisor}'s last message: \"Sleep. This will still be good on Monday.\" It is."
  zh: ""
- en: "Zoom or Bubble Tea"
  zh: ""
- en: "You're tired, and you could join lab meeting on Zoom from your couch. But there's bubble tea in the room."
  zh: ""
- en: "Go in for the bubble tea"
  zh: ""
- en: "You arrive yawning. A cup with your name on it is already waiting."
  zh: ""
- en: "Join on Zoom, camera off"
  zh: ""
- en: "You hear someone say \"this one's {player}'s\", followed by the sound of a straw."
  zh: ""
- en: "Less Ice, Half Sugar"
  zh: ""
- en: "{advisor} hands you a bubble tea before you can order: \"Less ice, half sugar, right?\""
  zh: ""
- en: "Ask \"How did you remember?\""
  zh: ""
- en: "\"You've ordered it eleven times.\" It turns out they remember everyone's."
  zh: ""
- en: "Admit you switched to no sugar"
  zh: ""
- en: "\"Noted.\" Next week it's no sugar, and it is never wrong again."
  zh: ""
- en: "Order something wild to test them"
  zh: ""
- en: "Taro, extra pudding, 30% sugar. Two weeks later they order it for you without asking."
  zh: ""
- en: "Fourteen Sugar Levels"
  zh: ""
- en: "You're sent to pick up the lab-meeting order: 14 drinks at 14 different sugar levels, plus one person who \"doesn't mind\"."
  zh: ""
- en: "Build a quick order form"
  zh: ""
- en: "Every drink is right. Your form is now official lab infrastructure."
  zh: ""
- en: "The form works perfectly. The shop's printer does not."
  zh: ""
- en: "Write it all on a receipt"
  zh: ""
- en: "Two drinks get swapped. Nobody can taste the difference between 25% and 30% anyway."
  zh: ""
- en: "Bring {labmate} as backup"
  zh: ""
- en: "You carry seven drinks each and chat the whole way back."
  zh: ""
- en: "Zero Orphans"
  zh: ""
- en: "Camera-ready time for {paper}. One last pass for orphan words before {advisor} sees it."
  zh: ""
- en: "Do one last orphan sweep"
  zh: ""
- en: "Zero orphan words. {advisor}'s reply is a single word: \"Beautiful.\""
  zh: ""
- en: "One orphan survives, on page 7. {advisor} circles it, kindly."
  zh: ""
- en: "Rewrite until every line fits"
  zh: ""
- en: "After two days of tiny edits there are zero orphans, and the reply is \"Beautiful.\""
  zh: ""
- en: "Send it as is"
  zh: ""
- en: "{advisor} fixes two orphans without mentioning it. You notice anyway."
  zh: ""
- en: "Easier Than Lab Meeting"
  zh: ""
- en: "Defense day. {advisor} catches you outside the room: \"Nothing they ask today will be harder than lab meeting.\""
  zh: ""
- en: "Remember every lab meeting"
  zh: ""
- en: "Five years of hard questions come back to you at once. Your heart rate drops."
  zh: ""
- en: "Skim your list of hard questions"
  zh: ""
- en: "You kept a list of every tough lab-meeting question. Most of today's are on it."
  zh: ""
- en: "Three Time Zones"
  zh: ""
- en: "This week {advisor} answered your emails from three time zones, one of them over an ocean. Each reply is one line long."
  zh: ""
- en: "Batch everything into one email"
  zh: ""
- en: "You send five yes-or-no questions, and five answers come back from an airport lounge."
  zh: ""
- en: "They answer question 1 in detail. Questions 2 to 5 get \"let's discuss\"."
  zh: ""
- en: "Grab a call in their morning"
  zh: ""
- en: "Their morning is your 5:30 am. You're half asleep, but the call is useful."
  zh: ""
- en: "Ask {senior} instead"
  zh: ""
- en: "{senior} has decoded one-line replies for four years. You get a real answer, plus a translation guide."
  zh: ""
- en: "Thirty Seconds at Your Poster"
  zh: ""
- en: "For the first time this conference, {advisor} appears at your poster for {paper}, with a very famous friend in tow. \"You have thirty seconds. Go.\""
  zh: ""
- en: "Give the 30-second pitch"
  zh: ""
- en: "You finish at second 29. The famous friend asks for your email, then for your paper."
  zh: ""
- en: "You're still on the motivation when they're pulled away to a reception."
  zh: ""
- en: "Ask the friend about their work"
  zh: ""
- en: "They talk for ten minutes while {advisor} waves from across the hall. You learn a lot, and they remember you."
  zh: ""
- en: "Hand them each a printout"
  zh: ""
- en: "Two printouts vanish into two bags. Months later, one of them turns up as a citation."
  zh: ""
- en: "To Understand How You Work"
  zh: ""
- en: "{advisor} asks for the full edit history of your draft of {project}, \"just to understand how you work\". It shows every 2 am session, and every hour of nothing."
  zh: ""
- en: "Share all of it"
  zh: ""
- en: "They study it closely, then suggest you write in the mornings. Annoyingly, it helps."
  zh: ""
- en: "Offer a weekly summary instead"
  zh: ""
- en: "\"Fine. Fridays.\" Your 2 am sessions stay between you and the draft."
  zh: ""
- en: "They'd like the summary and the history. Now you write about your writing every Friday."
  zh: ""
- en: "Draft in a private file first"
  zh: ""
- en: "Your real writing moves to a file called notes_old.tex. {advisor} notices the history has gone very quiet."
  zh: ""
- en: "A Comment on Every Sentence"
  zh: ""
- en: "Your draft of {project} comes back with a comment on every sentence. The references have comments too. Reference 14 has three."
  zh: ""
- en: "Address every single one"
  zh: ""
- en: "Four days and 212 replies later, the draft is much better, and {advisor} is pleased."
  zh: ""
- en: "Fix what matters, resolve the rest"
  zh: ""
- en: "You fix forty comments and resolve the rest. {advisor} reopens only two."
  zh: ""
- en: "{advisor} reopens every resolved comment, each with a new comment attached."
  zh: ""
- en: "Go through them together"
  zh: ""
- en: "You spend three hours in their office. Half the comments turn out to mean \"ok\"."
  zh: ""
- en: "The Paper the Case Needs"
  zh: ""
- en: "{advisor}'s tenure case goes out this year, and they've done the math: {project} is the paper the case needs. \"No pressure. Well. Some pressure.\""
  zh: ""
- en: "Go all in on {project}"
  zh: ""
- en: "You work nights and weekends and make a lot of progress. {advisor} starts bringing you coffee without being asked."
  zh: ""
- en: "Promise strong, not fast"
  zh: ""
- en: "\"You're right. A strong paper helps the case more than a quick one.\""
  zh: ""
- en: "They agree, then check in on {project} every morning at 9."
  zh: ""
- en: "Bring {labmate} onto the project"
  zh: ""
- en: "Two people work twice as fast, and the paper gets a second name. {advisor} likes the plan."
  zh: ""
- en: "Four New Projects"
  zh: ""
- en: "{advisor} kicks off four new projects this semester. You open the planning doc. Your name is on all four, in bold."
  zh: ""
- en: "Stay on all four"
  zh: ""
- en: "You now have four literatures to read and four meetings a week. You learn a lot, very quickly."
  zh: ""
- en: "Pick the one nearest your thesis"
  zh: ""
- en: "\"Smart. Focus.\" Your name comes off three projects, and your week comes back."
  zh: ""
- en: "You negotiate down to two. Negotiating, it turns out, is a skill you're still building."
  zh: ""
- en: "Hand one to {mentee}, with support"
  zh: ""
- en: "{mentee} is thrilled. You spend an hour a week guiding them, and they do the rest."
  zh: ""
- en: "Same Deadline, Two Papers"
  zh: ""
- en: "{advisor} is submitting their own paper to the same deadline as {project}. \"Could you run a few experiments on mine too? You're so fast.\""
  zh: ""
- en: "Help with both papers"
  zh: ""
- en: "Both papers get submitted, and you sleep through most of the following weekend."
  zh: ""
- en: "Trade experiments for writing help"
  zh: ""
- en: "They rewrite your introduction in one evening, and it's much better."
  zh: ""
- en: "You run their experiments. Their notes on your intro arrive an hour after the deadline."
  zh: ""
- en: "Protect your own paper"
  zh: ""
- en: "You say no, kindly, and give your own paper your full attention. {advisor} pulls an all-nighter and is a little cool all week."
  zh: ""
- en: "The Sign-Up Sheet"
  zh: ""
- en: "The lab shares one GPU, booked through a sheet taped to the server room door. Your three-day run for {project} would take every slot until Thursday."
  zh: ""
- en: "Book the whole week"
  zh: ""
- en: "Your run finishes. Next to your name on the sheet, someone has drawn a very small frowning face."
  zh: ""
- en: "Take the night slots nobody wants"
  zh: ""
- en: "Midnight to 6 am, five nights running. The run finishes, and you learn every sound the server makes."
  zh: ""
- en: "Shrink the experiment to fit"
  zh: ""
- en: "With a smaller model and a smarter sample, it runs in one afternoon and still answers your question."
  zh: ""
- en: "The small run tells you nothing, so you add your name to the bottom of the sheet."
  zh: ""
- en: "The Warmest Letter"
  zh: ""
- en: "{advisor} sends you a copy of the recommendation letter they wrote for you. It's two pages long and specific about everything. You read it twice."
  zh: ""
- en: "Thank them in person"
  zh: ""
- en: "They wave it off: \"I only wrote down what's true.\" You both pretend not to be moved."
  zh: ""
- en: "Use it for three more applications"
  zh: ""
- en: "You spend a long evening on three sets of forms. Each one goes out with a great letter behind it."
  zh: ""
- en: "Save it for the hard weeks"
  zh: ""
- en: "You put it in a folder called \"read this\". You'll open it more often than you expect."
  zh: ""
- en: "How Does This Fit Aim 2?"
  zh: ""
- en: "Your meeting opens the way every meeting opens: \"Before we start, how does this fit Aim 2?\" Today, honestly, {project} doesn't."
  zh: ""
- en: "Reframe {project} around Aim 2"
  zh: ""
- en: "Two slides later, your project fits Aim 2 perfectly. It is also slightly less interesting."
  zh: ""
- en: "Pitch it as a future Aim 4"
  zh: ""
- en: "\"Aim 4. For the renewal. I like it.\" Your project is now in next year's grant."
  zh: ""
- en: "There is no Aim 4. There are three aims, and by the end of the meeting you know all of them by heart."
  zh: ""
- en: "Keep going and hope it passes"
  zh: ""
- en: "It doesn't pass. The same question opens next week's meeting, and the one after that."
  zh: ""
- en: "Renewal Week"
  zh: ""
- en: "Grant renewal week. The whole lab pauses research to write progress summaries. The shared document is 61 pages long and has a table of contents for its table of contents."
  zh: ""
- en: "Write your summary carefully"
  zh: ""
- en: "You write two pages on your year. On paper, it was a better year than it felt."
  zh: ""
- en: "Volunteer to edit the whole thing"
  zh: ""
- en: "Sixty-one pages become forty. {advisor} calls it the cleanest renewal in years, and remembers who did it."
  zh: ""
- en: "Write yours in an hour"
  zh: ""
- en: "You write one tight page before lunch and are back to research by 1 pm."
  zh: ""
- en: "It comes back with one note: \"More on Aim 2, please.\" The hour becomes two days."
  zh: ""
- en: "\"thoughts?\""
  zh: ""
- en: "Over the weekend, {advisor} sends you 14 papers, one email each. Every subject line says \"thoughts?\". Your meeting is Monday at 10."
  zh: ""
- en: "Read all 14 by Monday"
  zh: ""
- en: "You arrive with notes on every paper. {advisor} has moved on to a 15th, but is clearly impressed."
  zh: ""
- en: "Skim for the common thread"
  zh: ""
- en: "It's one idea in 14 disguises. You name it in one sentence, and {advisor} lights up."
  zh: ""
- en: "You find a common thread. It isn't the one they meant."
  zh: ""
- en: "Read two properly, ask about the rest"
  zh: ""
- en: "\"Oh, those were just for fun.\" Luckily, your two were the important ones."
  zh: ""
- en: "Best Paper, Other Lab"
  zh: ""
- en: "A best paper award goes to another lab, for the idea {advisor} emailed you at 2 am eight months ago. You still have the email. It was three lines long."
  zh: ""
- en: "Forward the email to {advisor}"
  zh: ""
- en: "\"Ha! Told you.\" They're delighted, and their next idea arrives at 2 am."
  zh: ""
- en: "Build on their result, fast"
  zh: ""
- en: "You spot the follow-up the winners missed. Your short paper is online within two weeks, and people read it."
  zh: ""
- en: "Eleven other labs had the same follow-up idea that week."
  zh: ""
- en: "Start a folder for 2 am ideas"
  zh: ""
- en: "Every late-night idea now gets a real read the next morning. Most are wild, but one might not be."
  zh: ""
- en: "Unlimited Compute, Limited Lawyers"
  zh: ""
- en: "Thanks to {advisor}'s company, your compute for {project} was unlimited. Now every result needs legal review before you can submit. Legal estimates six to eight weeks."
  zh: ""
- en: "Submit it for review and wait"
  zh: ""
- en: "Legal approves, with one change: \"outperforms\" becomes \"compares favorably to\", everywhere."
  zh: ""
- en: "Ask {advisor} to fast-track it"
  zh: ""
- en: "{advisor} sends one email to the right person. Approval arrives in three days."
  zh: ""
- en: "They try. Legal now has two questions instead of one."
  zh: ""
- en: "Rerun the key results on campus"
  zh: ""
- en: "The university cluster is slow, but its results need no lawyer. Your paper is a little smaller now."
  zh: ""
- en: "A Product Manager Joins"
  zh: ""
- en: "{advisor} brings a product manager from the company to your research meeting. Ten minutes in, they ask about the roadmap for {project}, and its \"go-to-market\"."
  zh: ""
- en: "Pitch {project} as a product"
  zh: ""
- en: "They love it and ask for a demo next month. You've never had a customer before."
  zh: ""
- en: "They ask about daily active users. You have twelve participants and a consent form."
  zh: ""
- en: "Ask what their users struggle with"
  zh: ""
- en: "They talk for 40 minutes. It's the best user research you've done all year, and the meeting runs long."
  zh: ""
- en: "Steer back to the research"
  zh: ""
- en: "The product manager checks their phone. Your meeting stays a research meeting, and {advisor} looks a little disappointed."
  zh: ""
- en: "Already Arranged"
  zh: ""
- en: "You've barely sent out your internship applications when {advisor} mentions, between meetings, that they've \"already talked to the team\" at {company}. \"You'll probably start in May.\""
  zh: ""
- en: "Thank them and stop worrying"
  zh: ""
- en: "You cancel two interviews and relax. {advisor} seems pleased that you trust them."
  zh: ""
- en: "Keep your other options going"
  zh: ""
- en: "You keep interviewing anyway, which is more work but keeps your options open."
  zh: ""
- en: "Ask for the research team instead"
  zh: ""
- en: "\"Good call.\" One more email, and you're on the research team."
  zh: ""
- en: "\"Research is full this year. The product team is great, though.\""
  zh: ""
- en: "Old Classmates"
  zh: ""
- en: "Your committee meeting opens with {advisor} and {committee} remembering grad school together, decades ago. Two more committee members were there too. Your slides wait patiently."
  zh: ""
- en: "Let the stories run"
  zh: ""
- en: "Forty minutes of stories leave five minutes for questions, all of them easy. Everyone leaves in a great mood."
  zh: ""
- en: "Ask them to settle an old debate"
  zh: ""
- en: "The old debate turns out to be about your topic. They argue happily, and your thesis comes out sharper."
  zh: ""
- en: "They argue happily for the full hour. Your slides go unshown."
  zh: ""
- en: "Steer them to your slides"
  zh: ""
- en: "You get real, tough feedback. {advisor} looks mildly sorry to miss the end of the story."
  zh: ""
- en: "Back, With a Term Sheet"
  zh: ""
- en: "{advisor} has been unreachable for two weeks. Today they walk into lab meeting, tanned, holding a term sheet. \"Big news! Also, how's everyone's research?\""
  zh: ""
- en: "Ask about the startup"
  zh: ""
- en: "They talk about funding rounds for forty minutes. You follow about a third of it, and it's a fascinating third."
  zh: ""
- en: "Ask for two weeks of feedback, now"
  zh: ""
- en: "They read everything you sent while they were gone, in one sitting. The feedback is excellent."
  zh: ""
- en: "\"Can you resend those? My inbox is a disaster.\" You resend all six."
  zh: ""
- en: "Report the calls you made alone"
  zh: ""
- en: "You made three decisions while they were gone. {advisor} approves two and reverses the third without comment."
  zh: ""
- en: "The CTO Down the Hall"
  zh: ""
- en: "A launch announcement reveals that {labmate} is the CTO of {advisor}'s newest startup. That explains the second laptop, and all the 4 pm \"dentist appointments\"."
  zh: ""
- en: "Ask {labmate} how it all works"
  zh: ""
- en: "Over coffee they explain how equity works, and why they never sleep."
  zh: ""
- en: "Ask if they're hiring"
  zh: ""
- en: "\"After you graduate? Absolutely. Employee number four is yours.\""
  zh: ""
- en: "\"Not yet. Maybe after the next round.\" They say it nicely."
  zh: ""
- en: "Keep your head down"
  zh: ""
- en: "One founder per lab is plenty. You inherit the whiteboard they no longer have time for."
  zh: ""
- en: "Page 13 of the Appendix"
  zh: ""
- en: "The four-page short paper on {project} now has a twelve-page statistics appendix. {advisor} is drafting page 13."
  zh: ""
- en: "Keep every page"
  zh: ""
- en: "No reviewer will read all twelve pages. No reviewer will find anything to complain about, either."
  zh: ""
- en: "Cut it to the two tests that matter"
  zh: ""
- en: "The appendix shrinks to one page, and {advisor} gives a rare nod: \"Fine. These are the right two.\""
  zh: ""
- en: "{advisor} restores the other ten pages, with tracked changes and a reading list."
  zh: ""
- en: "Turn it into a lab stats guide"
  zh: ""
- en: "The appendix becomes the lab's statistics handbook. Everyone uses it, and {advisor} proudly adds page 14."
  zh: ""
- en: "Significant, or Just Exciting?"
  zh: ""
- en: "You show a 2.1-point gain on {project}, and lab meeting cheers. {advisor} waits for the cheering to stop. \"Is it significant, or just exciting?\""
  zh: ""
- en: "Run the test right there"
  zh: ""
- en: "p = 0.003. {advisor} allows themselves a very small smile. The lab cheers again, carefully."
  zh: ""
- en: "p = 0.21. It was only exciting, and now you know what to fix."
  zh: ""
- en: "Say \"Both, I hope\""
  zh: ""
- en: "{advisor} laughs once, which is rare, then asks for the test by Friday."
  zh: ""
- en: "Admit it's just exciting so far"
  zh: ""
- en: "\"Good. Now make it significant.\" Your honesty earns a week of goodwill, and a list of seeds to run."
  zh: ""
- en: "The Folder"
  zh: ""
- en: "A year in, {advisor} opens a folder of ideas they've collected for years and never shared. \"Take one, if any of them speak to you. Or tell me why they're wrong.\""
  zh: ""
- en: "Pick the one that excites you"
  zh: ""
- en: "You pick the fourth one. {advisor} smiles: it was their favorite too, and they never found the time."
  zh: ""
- en: "Find the flaw in one"
  zh: ""
- en: "You find the problem with idea three. {advisor} nods: \"Good. That's why it's still in the folder.\""
  zh: ""
- en: "They show you a note from years ago that answers your \"flaw\". You learn a lot from it."
  zh: ""
- en: "Say you'd rather follow your own"
  zh: ""
- en: "\"Even better.\" They close the folder and ask to hear yours."
  zh: ""
- en: "Arrive With Answers"
  zh: ""
- en: "You bring {advisor} three questions about {project}. They listen, then say kindly: \"Next time, bring your best guess for each. It's easier to improve an answer than to start from a question.\""
  zh: ""
- en: "Guess now, out loud"
  zh: ""
- en: "Two of your three guesses are right. You realize you didn't need the meeting for those two."
  zh: ""
- en: "All three guesses are wrong, but now you both know why."
  zh: ""
- en: "Come back tomorrow with answers"
  zh: ""
- en: "You return with three answers and one better question. The meeting takes ten minutes."
  zh: ""
- en: "Ask how they would find out"
  zh: ""
- en: "They walk you through how they'd look into each one. Halfway through, you see you could have done it yourself."
  zh: ""
- en: "The Regular Visitor"
  zh: ""
- en: "A student from another department has come to the last four lab meetings and always orders taro. Nobody remembers inviting them."
  zh: ""
- en: "Ask what they work on"
  zh: ""
- en: "They study crowds in train stations. Over taro, you find an idea that needs both your fields."
  zh: ""
- en: "Add them to the order sheet"
  zh: ""
- en: "{advisor} adds a fifteenth drink without a word. The visitor looks very grateful."
  zh: ""
- en: "Ask them to present, as the price of tea"
  zh: ""
- en: "Their talk on soil chemistry is the best of the semester. Lab meeting runs 30 minutes over, and nobody minds."
  zh: ""
- en: "Perfect Attendance"
  zh: ""
- en: "{advisor} notes that you haven't missed an in-person lab meeting in months. \"That's real dedication.\" The bubble tea in your hand may be a factor."
  zh: ""
- en: "Credit your dedication"
  zh: ""
- en: "{advisor} nods solemnly. Every labmate in the room looks at your cup."
  zh: ""
- en: "Confess it's the bubble tea"
  zh: ""
- en: "\"I know. That's why I buy it.\" The whole lab laughs, and someone raises a cup."
  zh: ""
- en: "Volunteer to present next week"
  zh: ""
- en: "To earn your perfect record, you present. Your drink that week comes with extra pudding."
  zh: ""
