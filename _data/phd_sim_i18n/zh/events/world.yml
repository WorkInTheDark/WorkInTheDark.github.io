# zh translations for events/world (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Everyone Pivots"
  zh: "风向变了"
- en: "{biglab} releases {model}. Within a week, every reading group and half of arXiv is about it."
  zh: "{biglab} 发布了 {model}。不到一周，所有读书会和半个 arXiv 都在讨论它。"
- en: "{biglab} releases {model}, and the field changes its plans overnight. Three talks at this week's seminar are rewritten the morning of."
  zh: "{biglab} 发布了 {model}，整个领域连夜改计划。这周讨论班上有三个报告是当天早上重写的。"
- en: "Spend the weekend trying it"
  zh: "花一个周末上手试试"
- en: "You find two things it does brilliantly and one it gets hilariously wrong. You keep notes on all three."
  zh: "你发现它有两件事做得惊艳，还有一件翻车翻得离谱。三件你都记了下来。"
- en: "Stay on your own path"
  zh: "继续走自己的路"
- en: "While everyone chases {model}, you have your corner of the field to yourself."
  zh: "大家都去追 {model} 了，你那一亩三分地终于清净了。"
- en: "At lab meeting, three people ask why you're not using {model}. You don't have a great answer yet."
  zh: "组会上，三个人问你为什么不用 {model}。你暂时还没有好的答案。"
- en: "Start a quick evaluation of it"
  zh: "快速评测一下它"
- en: "Your two-day evaluation finds where {model} breaks. People start emailing you about it."
  zh: "你花两天做的评测找到了 {model} 的软肋。开始有人发邮件来问你了。"
- en: "Solved, Apparently"
  zh: "据说已经解决了"
- en: "{biglab}'s announcement for {model} says it \"solves\" {project.topic}. You read the fine print. It was tested on forty easy examples."
  zh: "{biglab} 发布 {model}，宣称已经“解决了”{project.topic}，遥遥领先。你仔细看了小字：只在四十个简单样例上测过。"
- en: "Test {model} on your data"
  zh: "在你的数据上测测 {model}"
- en: "On your data, it gets 61%. Your paper now has a strong new baseline and a sharper story."
  zh: "在你的数据上，它只有 61%。你的论文多了一个强 baseline，故事也更有说服力了。"
- en: "Write a careful thread about it"
  zh: "写个长帖认真分析"
- en: "Your thread is shared widely. Researchers send you their own failure cases."
  zh: "你的长帖被广泛转发。研究者们纷纷发来自己遇到的失败案例。"
- en: "The thread gets four likes, two of them from labmates."
  zh: "长帖收获了四个赞，其中两个来自同门。"
- en: "Ignore it and keep working"
  zh: "不理它，接着干"
- en: "A month later nobody remembers the claim, except maybe your reviewers."
  zh: "一个月后就没人记得这个说法了，可能除了你的审稿人。"
- en: "Suddenly Popular"
  zh: "突然爆火"
- en: "Your topic, {project.topic}, is suddenly the hottest thing in the field: {roll:38-45} new papers this month alone."
  zh: "你做的{project.topic}突然成了顶流：光这个月就有 {roll:38-45} 篇新论文。"
- en: "Rush to get yours out first"
  zh: "抢在别人前面发出去"
- en: "You work three weekends straight. The draft moves fast, and a few corners get cut."
  zh: "你连干了三个周末。草稿推进得飞快，有几处偷了工。"
- en: "Read every one of them"
  zh: "每一篇都读一遍"
- en: "Two overlap with yours. Now you know exactly what makes your work different."
  zh: "有两篇和你的工作撞了。现在你很清楚自己不同在哪了。"
- en: "Find the angle nobody's taking"
  zh: "找一个没人做的角度"
- en: "Everyone is building systems, so you study the users instead."
  zh: "大家都在做系统，你转而去研究用户。"
- en: "Every angle you find is already taken, sometimes twice."
  zh: "你想到的每个角度都已经有人做了，有的还被做了两遍。"
- en: "Is It an Agent?"
  zh: "这算 Agent 吗？"
- en: "Suddenly every paper needs \"agents\", and the word is on every lab meeting slide. {labmate} asks whether {project} is an agent."
  zh: "突然之间万物皆可 Agent，组会上每页幻灯片都有这个词。{labmate} 问你：{project} 算不算 Agent？"
- en: "Rebrand it as an agent"
  zh: "包装成 Agent"
- en: "Your slides say \"agentic\" eleven times. People seem more interested, and somewhat more confused."
  zh: "你的幻灯片里出现了十一次“agentic”。大家好像更感兴趣了，也更糊涂了。"
- en: "Explain that it's a pipeline"
  zh: "解释说这就是个 pipeline"
- en: "\"It's a pipeline.\" A few people nod. One of them is a reviewer, and they appreciate it."
  zh: "“这就是个 pipeline。”几个人点了点头。其中一位是审稿人，很欣赏这份坦诚。"
- en: "Build a real agent version"
  zh: "做个真正的 Agent 版本"
- en: "You spend a week on it. It works, and it's more interesting than the buzzword."
  zh: "你花了一周。它真能用，而且比这个流行词有意思多了。"
- en: "Does It Mean Anything?"
  zh: "这测的是啥？"
- en: "A field-wide online debate breaks out: does the benchmark behind {project} measure anything at all? The top post has {roll:900-3000} replies."
  zh: "网上爆发了一场全领域大讨论：{project} 用的那个基准到底测出了什么？最热的帖子盖了 {roll:900-3000} 层楼。"
- en: "Add a second evaluation"
  zh: "再加一个评估"
- en: "A small human evaluation backs up your numbers. It costs a week and makes the paper much harder to attack."
  zh: "一个小规模人工评估支持了你的数字。花了一周，但论文难挑刺多了。"
- en: "Join the debate"
  zh: "加入讨论"
- en: "You post a careful take and spend two days answering replies. Some of them are useful."
  zh: "你发了一篇认真的看法，然后花两天回复评论。其中一些还挺有用。"
- en: "Write an honest limitations paragraph"
  zh: "老实写一段局限性"
- en: "You write one clear paragraph on what the benchmark can and can't tell you. Reviewers tend to like that."
  zh: "你写了清楚的一段，说明这个基准能说明什么、不能说明什么。审稿人通常喜欢这种。"
- en: "A Famous Post"
  zh: "大佬发帖"
- en: "A famous researcher posts about {paper}: \"This is the kind of work the field needs.\" Your phone does not stop buzzing for an hour."
  zh: "一位大佬发帖提到 {paper}：“这正是这个领域需要的工作。”你的手机震了整整一个小时。"
- en: "Reply with a short thank-you"
  zh: "回一句简短的感谢"
- en: "You keep it short and gracious. A few hundred people read your paper this week."
  zh: "你的回复简短得体。这周有几百人读了你的论文。"
- en: "Post a thread explaining the paper"
  zh: "发个长帖讲解论文"
- en: "The thread takes off. Three labs email you about follow-up work."
  zh: "长帖火了。三个实验室发邮件找你谈后续合作。"
- en: "The replies turn into an argument about your figure's font. Some people read the paper anyway."
  zh: "评论区歪楼了，开始争论你图表用的字体。好在还是有人读了论文。"
- en: "Send a screenshot to your parents"
  zh: "截图发给爸妈"
- en: "Your parents don't fully get it, but they print it out and put it on the fridge."
  zh: "爸妈没太看懂，但截图当天就被转进了家族群。"
- en: "Pioneering Work"
  zh: "开创性工作"
- en: "A new survey paper calls {paper} \"pioneering work\". You read the sentence three times to make sure it's yours."
  zh: "一篇新综述把 {paper} 称为“开创性工作”。你把这句话读了三遍，确认说的是你的论文。"
- en: "Email the authors a thank-you"
  zh: "给作者发邮件道谢"
- en: "They reply warmly and ask whether you'd review their next draft."
  zh: "对方热情回复，还问你愿不愿意帮忙看看他们的下一稿。"
- en: "Add it to your research statement"
  zh: "写进研究陈述"
- en: "\"Described as pioneering by a recent survey.\" It reads well in the statement."
  zh: "“被近期综述评为开创性工作。”写在研究陈述里挺好看。"
- en: "Read how they describe it"
  zh: "看看他们怎么描述的"
- en: "They get it mostly right, which is more than most citations do."
  zh: "大体都说对了，比大多数引了不读的强多了。"
- en: "The Freeze"
  zh: "招聘冻结"
- en: "Three companies on your list announce hiring freezes in the same week. One recruiter writes to \"keep in touch for next year\"."
  zh: "你海投名单上的三家公司在同一周宣布冻结招聘。有个 HR 来信说“明年保持联系”。"
- en: "Widen your search"
  zh: "扩大海投范围"
- en: "You add twelve more places and a few you'd never considered. It's a long weekend of cover letters."
  zh: "你又加了十二个地方，其中几个以前从没考虑过。整个周末都在写求职信。"
- en: "Ask {advisor} about a postdoc"
  zh: "问问 {advisor}有没有博士后机会"
- en: "Your advisor has a few ideas and a few names. Suddenly the year ahead looks less frozen."
  zh: "导师有几个想法，也有几个人选。突然间，明年看起来没那么冰封了。"
- en: "Lean on your network"
  zh: "动用人脉"
- en: "A former labmate's team still has one open position. They forward your CV that afternoon."
  zh: "一位已毕业的同门那边还有一个空缺，当天下午就帮你内推了。"
- en: "Everyone you ask is frozen too. A few promise to let you know when things thaw."
  zh: "你问的每个人那边也都冻着。有几个人答应解冻了就告诉你。"
- en: "Offers, Unasked"
  zh: "机会找上门"
- en: "Hiring is booming. Two recruiters you've never met email you about summer internships, and one even spells your name right."
  zh: "招聘市场火热。两个素未谋面的 HR 发邮件问你暑期实习的事，其中一个甚至把你的名字拼对了。"
- en: "Take both calls"
  zh: "两个电话都接"
- en: "Both recruiters are friendly, and both calls end with a next step."
  zh: "两个 HR 都很友好，两通电话都约好了下一步。"
- en: "Ask {advisor} which one fits"
  zh: "问 {advisor}哪个更合适"
- en: "Your advisor knows someone on one of the teams. Your reply now sounds much better informed."
  zh: "导师在其中一个团队有熟人。现在你的回复听起来内行多了。"
- en: "Archive them, you're busy"
  zh: "归档，没空"
- en: "Your research gets the week. In this market, the recruiters will write again."
  zh: "这一周留给你的研究。行情这么好，HR 还会再来信的。"
- en: "Back in Fashion"
  zh: "文艺复兴"
- en: "A method from the 2010s is suddenly back in fashion. Half of today's new papers cite something older than your undergrad degree."
  zh: "一个 2010 年代的老方法突然翻红了。今天一半的新论文，引用的东西比你的本科学位还老。"
- en: "Read the original paper"
  zh: "读原始论文"
- en: "It's surprisingly good, and it has a section everyone forgot about."
  zh: "写得出奇地好，还有一节被所有人遗忘了。"
- en: "Ask {senior} what it was like"
  zh: "问问 {senior} 当年什么样"
- en: "{senior} talks for an hour. You learn more than the papers taught you."
  zh: "{senior} 讲了一个小时。你学到的比那些论文教的还多。"
- en: "Post \"we had this in 2014\""
  zh: "发帖：“我们 2014 年就玩过了”"
- en: "It gets a lot of likes from people who were there, and a lot of replies from people who weren't."
  zh: "经历过那段时间的人纷纷点赞，没经历过的人纷纷回复。"
- en: "The Daily Listing"
  zh: "今日份 arXiv"
- en: "Today's arXiv listing in your area is {roll:380-460} papers long."
  zh: "今天你方向的 arXiv 列表有 {roll:380-460} 篇论文。"
- en: "You open today's arXiv listing. It is {roll:380-460} papers long, and it's only Tuesday."
  zh: "你打开今天的 arXiv 列表：{roll:380-460} 篇论文，而今天才周二。"
- en: "Skim every title"
  zh: "每个标题都扫一眼"
- en: "An hour later, you have seven open tabs and a mild headache."
  zh: "一小时后，你开着七个标签页，还有点头疼。"
- en: "Search for anything like yours"
  zh: "搜搜有没有撞车的"
- en: "Nothing overlaps with your work, and you relax a little."
  zh: "没有和你撞车的，你稍微松了口气。"
- en: "One paper looks close. After an hour of reading, you decide it probably isn't."
  zh: "有一篇看着很像。读了一个小时，你判断大概不算。"
- en: "Close the tab"
  zh: "关掉标签页"
- en: "If a paper matters, someone in the lab chat will post it."
  zh: "真重要的论文，组群里自然会有人转。"
- en: "Is This Still Relevant?"
  zh: "这还有人关心吗？"
- en: "Your topic, {project.topic}, has gone quiet. After your seminar talk on {project}, someone asks, kindly: \"Is this still relevant?\""
  zh: "你做的{project.topic}已经凉了。你在讨论班上讲完 {project}，有人善意地问：“这个现在还有人关心吗？”"
- en: "Reframe it around today's questions"
  zh: "围绕当下的问题重新包装"
- en: "You connect it to the question everyone is asking now. Suddenly it's the angle nobody else has."
  zh: "你把它和大家现在都在问的问题联系起来。突然间，这成了别人都没有的角度。"
- en: "The new framing confuses everyone, including your own abstract."
  zh: "新的叙事把所有人都绕晕了，包括你自己的摘要。"
- en: "Show who still needs it"
  zh: "找出还有谁需要它"
- en: "You find three real deployments with exactly this problem. Your introduction gets a new first paragraph."
  zh: "你找到了三个真实部署场景，正好都有这个问题。你的引言有了新的第一段。"
- en: "Keep going: less hype, less competition"
  zh: "继续做：热度低，竞争也少"
- en: "With fewer people to race, you make steady progress. A few doubts creep in at night."
  zh: "没人跟你卷，你稳步推进。只是夜里偶尔会冒出几丝怀疑。"
- en: "Twice the Papers"
  zh: "投稿量翻倍"
- en: "The flagship conference got {roll:18000-24000} submissions this cycle, double last year. The reviewer pool did not double. An email asks if you can take \"a few\" extra reviews."
  zh: "旗舰会议这一轮收到了 {roll:18000-24000} 篇投稿，是去年的两倍。审稿人可没翻倍。一封邮件问你能不能多审“几篇”。"
- en: "Volunteer for six extra reviews"
  zh: "主动多审六篇"
- en: "You review six papers in a week. Now you know what everyone else is working on, and you're tired."
  zh: "你一周审了六篇。现在你知道别人都在做什么了，也累坏了。"
- en: "Make {project} readable in five minutes"
  zh: "让 {project} 五分钟就能读懂"
- en: "You rewrite the abstract, Figure 1 and every first sentence for a reviewer who only skims."
  zh: "你为只会扫一眼的审稿人重写了摘要、图 1 和每段的第一句。"
- en: "Decline. It's a lottery anyway"
  zh: "婉拒，反正都是玄学"
- en: "You turn down the extra reviews and keep your week. The deadline still feels like a lottery."
  zh: "你推掉了额外的审稿，保住了这一周。中不中，依然看玄学。"
- en: "A Brand-New Venue"
  zh: "全新的会议"
- en: "A new conference launches. It has no track record yet, but it has a very nice logo. {advisor} calls submitting there \"a gamble, but a fun one\"."
  zh: "一个新会议创办了。还没什么口碑，但 logo 非常好看。{advisor}说投那里“是场赌博，不过挺好玩的”。"
- en: "Volunteer to review for it"
  zh: "主动去当审稿人"
- en: "You review four papers for the first edition. The organizers remember who showed up early."
  zh: "你为第一届审了四篇论文。组委会记住了谁最早来捧场。"
- en: "Put its deadline in your calendar"
  zh: "把它的截稿日期记进日历"
- en: "It goes next to the big ones, in a slightly smaller font. You read the call twice and like it."
  zh: "它排在那些大会旁边，字号稍微小一点。你读了两遍征稿通知，挺喜欢的。"
- en: "Wait and see if it lasts"
  zh: "观望一下能不能办下去"
- en: "Most new venues fade. You'll keep an eye on it from a safe distance."
  zh: "大多数新会议办着办着就没了。你决定先站远点观望。"
- en: "The Gamble Paid Off"
  zh: "赌对了"
- en: "The brand-new conference from two years ago is now where everyone wants to publish. Its acceptance rate is 19%, and people call it \"basically top-tier\" in hushed voices."
  zh: "两年前那个新会议，现在成了大家都想投的地方。录用率 19%，大家压低声音说它“基本算顶会了”。"
- en: "Mention you were there at the start"
  zh: "提一句你从第一届就在"
- en: "Early"
  zh: "元老"
- en: "The first-edition crowd has a group chat now. You're in it, and so are two of this year's program chairs."
  zh: "第一届那批人拉了个元老群。你在群里，今年的两位程序委员会主席也在。"
- en: "Read its best papers"
  zh: "读读它的最佳论文"
- en: "The bar is high and the papers are good. Its deadline goes in your calendar, in full-size font."
  zh: "门槛很高，论文也很好。它的截稿日期进了你的日历，用的是正常字号。"
- en: "Remember everyone calling it a gamble"
  zh: "想起当初大家都说是赌博"
- en: "You keep that memory to yourself, mostly. Prestige, it turns out, takes about two years."
  zh: "这段记忆你基本没跟人提。原来，声望大概需要两年。"
- en: "The New Checklist"
  zh: "新的检查清单"
- en: "Your target venues adopt a new reproducibility checklist: random seeds, compute hours, code links and the exact prompts you used. For {project}, you can answer about half."
  zh: "你要投的会议推出了新的可复现性检查清单：随机种子、算力时长、代码链接，还有你用过的确切提示词。对 {project}，你大概只能答上一半。"
- en: "Answer honestly, gaps and all"
  zh: "如实作答，缺的就写缺"
- en: "Half the answers say \"not recorded\". It stings, but reviewers tend to respect that."
  zh: "一半答案写着“未记录”。有点扎心，但审稿人通常尊重这种诚实。"
- en: "Rerun things until every answer is yes"
  zh: "重跑到每项都能打勾"
- en: "After a week of reruns with every seed logged, every box is a confident yes. You feel slightly less confident in general."
  zh: "你重新炼了一周丹，每个种子都记录在案，每一项都能自信地打勾了。只是你整个人没那么自信了。"
- en: "Write a logging script for the future"
  zh: "写个日志脚本，留给以后"
- en: "Your script records every seed and GPU hour automatically. Half the lab asks for a copy."
  zh: "你的脚本自动记录每个种子和每个 GPU 小时。组里一半人找你要了一份。"
- en: "The script logs everything, including 40 GB of things nobody needs."
  zh: "脚本什么都记，包括 40 GB 没人需要的东西。"
