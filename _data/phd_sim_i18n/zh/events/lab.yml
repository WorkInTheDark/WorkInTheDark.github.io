# zh translations for events/lab (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "The Codebase Inheritance"
  zh: "祖传代码"
- en: "{senior} is graduating and leaves you their entire codebase. There's no README, just 40 scripts called run.py and a folder named DO_NOT_DELETE."
  zh: "{senior} 要毕业了，把整个代码库传给了你。没有 README，只有 40 个叫 run.py 的脚本，外加一个名叫 DO_NOT_DELETE 的文件夹。"
- en: "Document it as you go"
  zh: "边看边写文档"
- en: "By the end you understand every script, and you've written the README they never did."
  zh: "最后你搞懂了每一个脚本，还补上了前任从没写过的 README。"
- en: "Book an hour with {senior} first"
  zh: "先约 {senior} 讲一小时"
- en: "{senior} walks you through all of it and even records the call for you."
  zh: "{senior} 带你从头过了一遍，还把通话录了下来给你。"
- en: "{senior} is already packing. You get a four-minute voice memo."
  zh: "{senior} 已经在打包行李了，只甩给你一条四分钟的语音。"
- en: "Rewrite it from scratch"
  zh: "推倒重写"
- en: "Your version is cleaner and half as long. It also takes a week and a half."
  zh: "你的版本更干净，长度只有一半。代价是花了一周半。"
- en: "Better Than the Reviewers"
  zh: "比审稿人还强"
- en: "You ask {labmate} for a quick read of {project}. Their comments are sharper than any review you've ever received, and much nicer."
  zh: "你请 {labmate} 帮忙快速看一眼 {project}。得到的意见比你收到过的任何审稿意见都犀利，还温柔得多。"
- en: "Fix everything they found"
  zh: "照单全改"
- en: "The paper gets clearer. You owe them a coffee, or several."
  zh: "论文清楚多了。你欠人家一杯奶茶，或者好几杯。"
- en: "Offer to read theirs in return"
  zh: "投桃报李，帮对方看稿"
- en: "You trade drafts. Both papers improve, and you learn how they write."
  zh: "你们交换了草稿。两篇论文都有进步，你也学到了对方的写法。"
- en: "Ask them to join as co-author"
  zh: "邀请对方当合作者"
- en: "\"Sure!\" They join and go over the whole paper again, carefully."
  zh: "“好啊！”对方加入了，又把整篇论文仔仔细细过了一遍。"
- en: "\"It was just comments, really.\" They mean it kindly."
  zh: "“就是提了点意见而已啦。”对方是好意推辞。"
- en: "Lab Retreat"
  zh: "实验室团建"
- en: "At the lab retreat you hike in the morning and fill a whiteboard in the afternoon. By dinner there are {roll:23-41} new project ideas."
  zh: "团建这天，上午爬山，下午写满一整块白板。到晚饭时，已经画出了 {roll:23-41} 个新项目的饼。"
- en: "Pick one and actually start it"
  zh: "挑一个，真的开干"
- en: "You pick one with {labmate}. It survives the drive home, which is rare."
  zh: "你和 {labmate} 挑了一个。这张饼居然撑过了回程，实属难得。"
- en: "Lead the hike, skip the whiteboard"
  zh: "带队爬山，不写白板"
- en: "You find the best view. Half the good ideas happen on the trail anyway."
  zh: "你找到了最好的观景点。反正一半的好想法都是在山路上冒出来的。"
- en: "Photograph the whiteboard"
  zh: "给白板拍张照"
- en: "Every few months you look at the photo, and one more idea makes sense."
  zh: "每隔几个月你翻出照片看看，就又有一个想法能看懂了。"
- en: "Why, Though?"
  zh: "灵魂拷问"
- en: "{mentee}, a new student, asks why the lab uses this metric and why anyone cares about it. You realize you don't actually know."
  zh: "新来的 {mentee} 问：组里为什么用这个指标？为什么有人在乎它？你发现自己其实并不知道。"
- en: "Look it up together"
  zh: "一起查查"
- en: "The answer is in a 2016 paper, and now you both know it."
  zh: "答案在一篇 2016 年的论文里，现在你们俩都知道了。"
- en: "Give a confident answer"
  zh: "一本正经地回答"
- en: "You check later. You were half right, and {mentee} believes the wrong half."
  zh: "你事后查了查。你说对了一半，而 {mentee} 记住的恰好是错的那一半。"
- en: "Send them to {senior}"
  zh: "把问题甩给 {senior}"
- en: "{senior} doesn't know either, so the lab keeps using it out of tradition."
  zh: "{senior} 也不知道。于是组里继续用着，美其名曰“传统”。"
- en: "It Worked on the First Try"
  zh: "一次就跑通了"
- en: "{mentee}'s code runs on the first try, and the numbers look great. You have never been more suspicious in your life."
  zh: "{mentee} 的代码一次就跑通了，结果还特别漂亮。事出反常必有妖，你从没这么警惕过。"
- en: "Check the data split"
  zh: "检查数据划分"
- en: "There's test data in the training set, and you catch it before any reviewer could."
  zh: "训练集里混进了测试数据，你赶在所有审稿人之前抓到了。"
- en: "You find nothing. A week later {mentee} finds the leak and is very proud."
  zh: "你什么也没发现。一周后 {mentee} 自己找到了数据泄漏，非常骄傲。"
- en: "Walk through it line by line"
  zh: "逐行过一遍"
- en: "Line 48 explains everything. {mentee} learns more from this than from any paper."
  zh: "第 48 行解释了一切。{mentee} 从这次学到的，比读任何论文都多。"
- en: "Trust them and celebrate"
  zh: "相信对方，庆祝一下"
- en: "It really did work. {mentee} is very good, and you are a little jealous."
  zh: "真的跑通了。{mentee} 是真的强，你有点酸。"
- en: "#paper-discussion"
  zh: "#论文讨论"
- en: "The lab Slack's paper-discussion channel is now only memes. The last real message is from {roll:3-9} months ago."
  zh: "实验室 Slack 的论文讨论频道现在只剩梗图了。上一条正经消息还是 {roll:3-9} 个月前的。"
- en: "Post a better meme"
  zh: "发张更绝的梗图"
- en: "It gets forty reactions. For one afternoon, you are the most important person in the lab."
  zh: "收到了四十个表情回应。整整一个下午，你是组里最重要的人。"
- en: "After a long silence, {labmate} reacts with a single skull."
  zh: "沉默良久，{labmate} 回了一个骷髅表情。"
- en: "Post an actual paper"
  zh: "发一篇正经论文"
- en: "It gets three meme replies and one thoughtful one, from {senior}."
  zh: "收到三条梗图回复，和一条认真的回复，来自 {senior}。"
- en: "Start a new channel for papers"
  zh: "再开一个论文频道"
- en: "Within a month it's half memes too, but the other half is good."
  zh: "不到一个月，这里也有一半是梗图了。好在另一半还挺有营养。"
- en: "Great Minds"
  zh: "英雄所见略同"
- en: "At lab meeting, {labmate} presents their new project. It's {project}. You started it two weeks ago."
  zh: "组会上，{labmate} 介绍了自己的新项目想法：{project}。巧了，你两周前就开始做了。"
- en: "Merge into one joint project"
  zh: "合二为一，一起做"
- en: "You merge your notes and then argue about the title for a week, happily."
  zh: "你们合并了笔记，然后开开心心地为标题吵了一周。"
- en: "Split it into two angles"
  zh: "拆成两个角度"
- en: "You take the modeling and they take the user study, so the two papers never overlap."
  zh: "你负责建模，对方负责用户研究，两篇论文互不重叠。"
- en: "The angles keep overlapping. Lab meeting gets a little awkward."
  zh: "两个角度总是撞车。组会气氛有点尴尬。"
- en: "Let them have it"
  zh: "拱手相让"
- en: "You hand over your notes. {labmate} thanks you in the acknowledgments, in bold."
  zh: "你把笔记交了出去。{labmate} 在致谢里感谢了你，还加了粗。"
- en: "The Summer Visitor"
  zh: "暑期访问生"
- en: "The visiting summer student finishes in six weeks what the lab planned for the whole summer. They also fixed the printer."
  zh: "暑期访问学生用六周干完了组里整个夏天的计划，顺手还修好了打印机。"
- en: "Ask how they work"
  zh: "请教效率秘诀"
- en: "Their secret is one task at a time and no open tabs. You try it, and annoyingly, it works."
  zh: "秘诀是一次只做一件事，不开多余的标签页。你试了一下，气人的是，真管用。"
- en: "Invite them to collaborate"
  zh: "邀请对方合作"
- en: "They agree to keep working with you after they go home. You now have a collaborator abroad."
  zh: "对方答应回去后继续跟你合作。你现在有了一位海外合作者。"
- en: "Three labmates got there first."
  zh: "已经有三个同门先下手为强了。"
- en: "Take them to lunch instead"
  zh: "改请对方吃午饭"
- en: "They're as nice as they are fast. You trade emails and promise to stay in touch."
  zh: "对方干活快，人也好。你们互留了邮箱，约好保持联系。"
- en: "You're Presenting Today"
  zh: "今天你主讲"
- en: "Reading group starts in ten minutes, and you're presenting. You've read the abstract, probably."
  zh: "读书会十分钟后开始，今天你主讲。摘要你大概是读过的。"
- en: "Read it in ten minutes"
  zh: "十分钟临时抱佛脚"
- en: "You present the key idea clearly, and nobody can tell you read it ten minutes ago."
  zh: "你把核心思想讲得很清楚，没人看得出你十分钟前才读。"
- en: "Someone asks about Table 3. You all learn about Table 3 together."
  zh: "有人问起表 3。于是大家一起认识了表 3。"
- en: "Admit it and lead a discussion"
  zh: "坦白，然后带大家讨论"
- en: "\"Let's read section 3 together.\" It's the best reading group in months."
  zh: "“我们一起读第 3 节吧。”这是几个月来最好的一次读书会。"
- en: "Swap weeks with {labmate}"
  zh: "和 {labmate} 换周"
- en: "{labmate} presents today and you take next week, so now you owe them one."
  zh: "今天 {labmate} 讲，你换到下周，这下欠了人家一次。"
- en: "{labmate} hasn't read theirs either. You bond over it."
  zh: "{labmate} 也没读自己那篇。你们因此惺惺相惜。"
- en: "Now You're the Senior One"
  zh: "你成老艺术家了！"
- en: "{senior}, who gave you all your best advice in Year 1, is graduating. Looking around lab meeting, you realize the senior student is now you."
  zh: "博一时给过你所有最好建议的 {senior} 要毕业了。组会上环顾四周，你发现组里辈分最高的学生，已经是你了。"
- en: "Write down what they taught you"
  zh: "把学到的写下来"
- en: "You fit ten rules on one page, pin it above your desk and send it to the new students."
  zh: "你把十条心得浓缩成一页纸，钉在桌子上方，又发进了新生群。"
- en: "Take the new students to lunch"
  zh: "请新生吃午饭"
- en: "Three new students bring eleven questions to a very long lunch. You answer most of them."
  zh: "三个新生带着十一个问题，吃了一顿很长的午饭。大部分你都答上了。"
- en: "Ask {senior} for one last tip"
  zh: "向 {senior} 讨最后一条建议"
- en: "\"Take your weekends.\" Then they hand you the lab's spare monitor."
  zh: "“周末要休息。”说完，把组里那台备用显示器交给了你。"
- en: "Same Bug, Same Whiteboard"
  zh: "同一个 bug，同一块白板"
- en: "{labmate} stops by with the same bug you've been fighting all week. Two hours later you've fixed both, and the whiteboard has a joint paper on it."
  zh: "{labmate} 来找你，遇到的正是折磨了你一整周的那个 bug。两小时后，两边的 bug 都修好了，白板上还多了一篇合作论文。"
- en: "Start the joint paper"
  zh: "开写合作论文"
- en: "You open a shared doc called \"paper (real)\". {labmate} has already made the figure template."
  zh: "你新建了一个共享文档，叫“论文（这次是真的）”。{labmate} 已经把图表模板做好了。"
- en: "Pair up on {project} instead"
  zh: "改为一起做 {project}"
- en: "{labmate} takes the evaluation off your hands. You work well together, suspiciously well."
  zh: "{labmate} 接手了评测部分。你们配合得很好，好得可疑。"
- en: "{labmate} is swamped this month. \"Next project, for sure.\""
  zh: "{labmate} 这个月忙疯了。“下个项目，下次一定！”"
- en: "Keep it to lunch chats"
  zh: "只当饭搭子"
- en: "You keep the good lunches and the shared bugs, and skip the paper."
  zh: "好吃的午饭和共同的 bug 都留着，论文就算了。"
- en: "Paper One, Together"
  zh: "合作第一篇"
- en: "The joint paper with your favorite co-author is accepted. The shared doc for the next one is already called \"paper 2 (real)\"."
  zh: "你和最佳拍档合作的论文中稿了。下一篇的共享文档已经叫“论文 2（这次是真的）”了。"
- en: "Start paper two right away"
  zh: "马上开写第二篇"
- en: "You celebrate with dumplings and a new outline."
  zh: "你们吃火锅庆祝，顺便列了个新大纲。"
- en: "Swap roles for paper two"
  zh: "第二篇互换分工"
- en: "This time you write and they code. You both get better at the other half."
  zh: "这次你写论文，对方写代码。你们在另一半上都有了长进。"
- en: "Take a break after this one"
  zh: "这篇之后歇一歇"
- en: "You stop at one great paper, stay lunch friends and promise each other \"someday\"."
  zh: "你们在一篇好论文上收手，继续当饭搭子，约好“改天一定”。"
- en: "Paper Two, Together"
  zh: "合作第二篇"
- en: "Paper two with your co-author is accepted. One reviewer notes that the two halves of the paper \"fit unusually well\"."
  zh: "和合作者的第二篇也中了。一位审稿人评价论文的两半“契合得出奇”。"
- en: "Go for the trilogy"
  zh: "冲三部曲"
- en: "Paper three has an outline before the camera-ready is even done."
  zh: "终稿还没交，第三篇的大纲已经有了。"
- en: "Ask them to read your thesis plan"
  zh: "请对方看你的博士论文计划"
- en: "Their notes on your thesis plan are better than your committee's will be. Paper three can wait a little."
  zh: "对方给的意见，比你答辩委员会将来给的还好。第三篇可以稍等。"
- en: "Call it a perfect pair"
  zh: "凑成一对，就此收手"
- en: "Two papers in, you still haven't argued about author order, so you quit while you're ahead."
  zh: "合作了两篇，你们还没为作者顺序吵过架，于是见好就收。"
- en: "That Duo"
  zh: "黄金搭档"
- en: "Your third paper together comes out. At a conference, someone points at the two of you and says \"Oh, that duo.\""
  zh: "你们合作的第三篇论文发表了。开会时，有人指着你们俩说：“哦，就是那对黄金搭档。”"
- en: "Lean into being that duo"
  zh: "坐实搭档名号"
- en: "You give the talk together, finishing each other's slides."
  zh: "你们一起做报告，默契到能接上对方的幻灯片。"
- en: "Make a pact for after graduation"
  zh: "约定毕业以后"
- en: "\"If I ever start a company, you're employee number four.\" They mean it."
  zh: "“要是我哪天开公司，你就是 4 号员工。”对方是认真的。"
- en: "Thank them in your thesis draft"
  zh: "写进博士论文的致谢"
- en: "You write the acknowledgments page years early, just to write this one paragraph."
  zh: "你提前好几年写好了致谢页，只为了写下这一段。"
- en: "Show Them the Ropes"
  zh: "带新人"
- en: "A rotation student joins the lab for six weeks, and {advisor} asks you to get them started on the codebase."
  zh: "一位轮转学生来组里待六周，{advisor}让你带对方熟悉代码库。"
- en: "Pair with them for a few days"
  zh: "手把手带几天"
- en: "They're fast, and they find two bugs you'd stopped seeing."
  zh: "对方上手很快，还找出了两个你早已视而不见的 bug。"
- en: "Write them a setup guide"
  zh: "写一份上手指南"
- en: "The guide takes an afternoon. Every new student uses it for the next three years."
  zh: "指南花了一个下午。之后三年，它都是组里新生的入门圣经。"
- en: "Point them to the README"
  zh: "让对方去看 README"
- en: "The README was last updated in 2021. They figure it out eventually and remember who pointed."
  zh: "README 最后一次更新是 2021 年。对方最后还是自己摸索出来了，也记住了是谁指的路。"
- en: "Helpful Discussions"
  zh: "有益的讨论"
- en: "{labmate} asks to be an author on {project}. In their words, they contributed \"helpful discussions\". You remember one discussion, and it was about lunch."
  zh: "{labmate} 想在 {project} 上挂个名，理由是贡献了“有益的讨论”。你只记得一次讨论，主题是中午吃啥。"
- en: "Add them anyway"
  zh: "还是加上对方"
- en: "Their name goes on near the end. To earn it, they proofread the whole paper, carefully."
  zh: "对方的名字排在了靠后的位置。为了对得起这个署名，对方把整篇论文仔细校对了一遍。"
- en: "Offer an acknowledgment instead"
  zh: "改为写进致谢"
- en: "\"Totally fair.\" They seem relieved, and the acknowledgment is warm and specific."
  zh: "“完全合理。”对方似乎松了口气，致谢也写得具体又真诚。"
- en: "\"Sure. No problem.\" Lab lunch is a little quiet this week."
  zh: "“行，没问题。”这周组里吃午饭时有点安静。"
- en: "Give them a real task to earn it"
  zh: "给对方派个正经活"
- en: "They run the error analysis you'd been avoiding. Now it's a real authorship, and a better paper."
  zh: "对方做完了你一直在逃避的错误分析。现在这个署名名副其实，论文也更好了。"
- en: "Second-Author Standoff"
  zh: "二作之争"
- en: "{labmate} and {labmate2} both worked on {project}, and both expect to be second author. The author line in the draft has changed eleven times today. You haven't touched it once."
  zh: "{labmate} 和 {labmate2} 都参与了 {project}，也都觉得自己该是二作。今天草稿里的作者栏已经改了十一次，你一次都没动过。"
- en: "Ask each for a contribution list"
  zh: "让两人各列贡献清单"
- en: "Two lists are due Friday. By Wednesday, both are color-coded."
  zh: "两份清单周五交。到了周三，两边已经卷到了按颜色分类。"
- en: "Go alphabetical and move on"
  zh: "按字母排序，翻篇"
- en: "Alphabetical it is. Both grumble, equally, which is the point."
  zh: "那就按字母顺序。两人抱怨得一样多，要的就是这个效果。"
- en: "The one who comes second in the alphabet has opinions about the alphabet."
  zh: "字母排在后面的那位，对字母表很有意见。"
- en: "Ask {advisor} to rule on it"
  zh: "请 {advisor}拍板"
- en: "{advisor} settles it in one sentence and thanks both of them in the next."
  zh: "{advisor}一句话就定了下来，下一句就感谢了两个人。"
- en: "{advisor} says it's your paper, so it's your call, which is flattering and no help at all."
  zh: "{advisor}说这是你的论文，你说了算。听着很受用，但毫无帮助。"
- en: "140 Percent"
  zh: "140%"
- en: "Both contribution lists arrive. Added together, your two co-authors did 140% of the work on your paper. Both lists include \"moral support\"."
  zh: "两份贡献清单都交上来了。加起来，两位合作者完成了你这篇论文 140% 的工作量。两份清单里都有“精神支持”。"
- en: "Make them equal, with a footnote"
  zh: "并列二作，加个脚注"
- en: "A day of diplomacy later, both get a small dagger and a footnote. Both CVs say \"co-second author\" by evening."
  zh: "斡旋了一整天，两人名字旁各加了一个 † 和一条脚注。当晚，两份简历上都写上了“共同第二作者”。"
- en: "Go by who ran the experiments"
  zh: "按谁跑了实验来定"
- en: "One of them is thrilled. The other is gracious in public and very quiet at lunch."
  zh: "一个乐开了花。另一个当众很大度，吃午饭时却格外安静。"
- en: "Settle it at board game night"
  zh: "桌游之夜一决胜负"
- en: "Four hours of a strategy game. The winner gets second author; the loser gets to name the next lab snack."
  zh: "一局策略游戏打了四个小时。赢家拿二作，输家负责决定组里下一批零食。"
- en: "The game ends in a dispute about the rules. You go alphabetical, out of sheer exhaustion."
  zh: "游戏以一场规则之争告终。你们精疲力尽，最后还是按字母排了。"
- en: "The Favor Returned"
  zh: "还人情"
- en: "The co-author who ended up third on your paper starts a new project and asks you to join. \"You owe me a second-author slot,\" they say, mostly smiling."
  zh: "在你论文上最终排第三的那位合作者开了个新项目，邀你加入。“你欠我一个二作。”说这话时，对方基本是笑着的。"
- en: "Join and do real work"
  zh: "加入，干实事"
- en: "You run their baselines and fix their plots. By the end, the second-author slot is earned twice over."
  zh: "你帮对方跑 baseline、改图。到最后，这个二作你挣了两倍都不止。"
- en: "Offer a careful proofread instead"
  zh: "改为仔细校对一遍"
- en: "Your comments are sharp and kind. They call it even, and it mostly is."
  zh: "你的意见犀利又友善。对方说这下两清了，基本也确实如此。"
- en: "2,000 Likes"
  zh: "2000 个赞"
- en: "{paper} was rejected from {venue} this morning. By lunch, {labmate}'s acceptance post has 2,000 likes, and the lab chat is nothing but party emojis."
  zh: "今天上午，{paper} 被 {venue} 拒了。到午饭时，{labmate} 晒中稿的帖子已经有 2000 个赞，组群里全是撒花表情。"
- en: "Congratulate them, sincerely"
  zh: "真心祝贺对方"
- en: "You mean it, mostly. Later {labmate} messages you: \"Yours is next. I read it. It's good.\""
  zh: "你九成是真心的。后来 {labmate} 私信你：“下一个就是你。我读过了，写得很好。”"
- en: "Log off for a week"
  zh: "下线一周"
- en: "You spend a week offline and come back to 2,400 likes and a much calmer head."
  zh: "你离线了一周，回来时帖子已经 2400 个赞，你的心态也平和多了。"
- en: "Ask {labmate} to read your reviews"
  zh: "请 {labmate} 看看你的审稿意见"
- en: "They spot the two fixes that matter. It turns out their paper was rejected twice before this."
  zh: "对方一眼看出了最关键的两处修改。原来那篇论文在这之前也被拒过两次。"
- en: "They're too swamped with messages from strangers to look this week."
  zh: "这周对方被陌生人的消息淹没了，抽不出空看。"
- en: "Minute 100"
  zh: "第 100 分钟"
- en: "Lab meeting was booked for an hour. It's now minute 100. The agenda had one item, and nobody can remember what it was."
  zh: "组会原定一小时，现在已经开到第 100 分钟了。议程只有一项，可没人记得是什么。"
- en: "Lab meeting is in its second hour. The discussion has drifted from your results to whether a hot dog is a sandwich, and {advisor} has strong views."
  zh: "组会开进了第二个小时。话题已经从你的结果飘到了粽子该吃甜的还是咸的，{advisor}对此立场鲜明。"
- en: "Stay to the end"
  zh: "坚持到最后"
- en: "It ends with a decision nobody will remember, but everyone was there for it."
  zh: "会议以一个谁都不会记得的决定收场，但大家都在场见证了。"
- en: "Slip out early"
  zh: "提前溜走"
- en: "You get an hour of real work done. Later you learn you were volunteered for something while you were gone."
  zh: "你干了一小时正经活。后来才知道，你不在的时候被“自愿”报名了某件事。"
- en: "Propose a hard stop"
  zh: "提议准时散会"
- en: "Everyone agrees at once. Next week ends on time, and someone brings a kitchen timer."
  zh: "大家立刻同意。下周的组会准时结束，还有人带来了一个厨房计时器。"
- en: "The discussion about having a hard stop runs another 20 minutes."
  zh: "关于要不要准时散会的讨论，又开了 20 分钟。"
- en: "Come With Me?"
  zh: "一起跑路吗？"
- en: "{labmate} is leaving the PhD to join a startup. Their farewell message ends: \"We're hiring, by the way. Come with me?\" Their desk plant also needs a new home."
  zh: "{labmate} 决定不读博了，要去一家创业公司。告别消息的最后一句是：“对了，我们在招人。跟我走吗？”桌上那盆绿植也需要一个新家。"
- en: "Say \"Ask me again after I graduate\""
  zh: "说“等我毕业再问我”"
- en: "\"Deal. I'll hold you to it.\" They actually write it down."
  zh: "“一言为定，我记着了。”对方真的写了下来。"
- en: "Interview for a summer role there"
  zh: "去面个暑期岗位"
- en: "Three hours of interviews and a take-home task. They like you, and you learn what industry interviews feel like."
  zh: "三小时面试，外加一道 take-home 题。对方很喜欢你，你也体验了一把业界面试。"
- en: "Adopt the plant"
  zh: "收养那盆绿植"
- en: "The plant thrives on your desk. {labmate} asks for a photo of it every month."
  zh: "绿植在你桌上长得很旺。{labmate} 每个月都要你拍张照片过去。"
- en: "Just for an Hour"
  zh: "就一小时"
- en: "{labmate} asks to borrow your GPU reservation \"just for an hour\" on Tuesday. It is now Thursday."
  zh: "周二，{labmate} 找你借用预约好的显卡集群，说“就用一小时”。现在已经周四了。"
- en: "Ask for it back, nicely"
  zh: "客气地要回来"
- en: "It's back in ten minutes, with an apology and a cookie."
  zh: "十分钟就还回来了，附带一句道歉和一块饼干。"
- en: "\"Just one more hour?\" Your run starts on Saturday."
  zh: "“再用一小时行吗？”你的实验拖到周六才开跑。"
- en: "Let them finish"
  zh: "让对方用完"
- en: "Their paper makes the deadline. The acknowledgments thank you for \"heroic GPU generosity\"."
  zh: "对方的论文赶上了截稿。致谢里专门感谢你“英勇无私地让卡”。"
- en: "Learn the booking system's secrets"
  zh: "摸透预约系统的门道"
- en: "You find an overflow queue nobody uses. Your run starts tonight, and now everyone asks you about it."
  zh: "你发现了一个没人用的备用队列。今晚实验就开跑了，现在大家都来找你打听奇技淫巧。"
- en: "The Only Empty Dish"
  zh: "唯一的空盘"
- en: "The lab potluck has eleven dishes. By 9 pm, yours is the only one scraped clean, and three people have asked for the recipe."
  zh: "组里搞百家饭聚餐，一共十一道菜。到晚上 9 点，只有你那盘被刮得干干净净，已经有三个人来要菜谱了。"
- en: "Share the recipe with everyone"
  zh: "把菜谱分享给大家"
- en: "At the next potluck there are four versions of your dish. Yours is still the best, though you'd never say so."
  zh: "下次聚餐上出现了四个版本的你的菜。你的还是最好吃的，不过你绝不会说出口。"
- en: "Keep it a family secret"
  zh: "保密，祖传秘方"
- en: "The mystery does wonders for your reputation. Friends start inviting you to dinners, hopefully."
  zh: "神秘感让你名声大振。朋友们开始请你吃饭，眼里满是期待。"
- en: "Volunteer to cook next time too"
  zh: "下次也主动掌勺"
- en: "Next time you cook for fourteen. It takes a whole Saturday, and everyone loves you a little more."
  zh: "下次你给十四个人做饭，花了一整个周六，大家都更爱你了一点。"
- en: "Admit it took two days"
  zh: "坦白做了两天"
- en: "Foodie"
  zh: "吃货"
- en: "You explain the three markets and the secret ingredient, and the lab looks at you with new respect."
  zh: "你讲了跑过的三个市场和那味秘密配料，组里人看你的眼神都多了几分敬意。"
- en: "Nothing Compiles"
  zh: "全都编译不过"
- en: "Someone updated one package in the lab's shared paper template. Now nobody's paper compiles, and three labmates have deadlines next week."
  zh: "有人更新了组里共用论文模板中的一个宏包。现在谁的论文都编译不过了，而三个同门下周就要截稿。"
- en: "Fix it for everyone"
  zh: "帮大家修好"
- en: "You find the one-line culprit in an hour. You are a hero in the lab chat for a whole day."
  zh: "你花一小时揪出了那一行罪魁祸首。整整一天，你都是组群里的英雄。"
- en: "You fix it for yourself. Everyone else now gets a different error."
  zh: "你只修好了自己的。其他人现在换了一种报错。"
- en: "Roll back to last month's copy"
  zh: "回退到上个月的版本"
- en: "Your paper compiles again, minus this month's fixes. Two figures land on the wrong page, and you leave them."
  zh: "论文又能编译了，只是这个月的修改都没了。有两张图跑到了错的页面，你也懒得管了。"
- en: "Wait for {senior} to fix it"
  zh: "等 {senior} 来修"
- en: "{senior} fixes it at 1 am and posts \"DO NOT TOUCH THE TEMPLATE\" in every channel."
  zh: "{senior} 凌晨 1 点修好了，在每个频道都发了一句：“不许再动模板！”"
- en: "Holding the Clicker"
  zh: "手握翻页笔"
- en: "At {senior}'s defense, you're in charge of the clicker and the bag of adapters. {senior} is nervous, so now you are too."
  zh: "{senior} 答辩那天，你负责翻页笔和一袋转接头。{senior} 很紧张，于是你也紧张了。"
- en: "Rehearse the handoff the night before"
  zh: "提前一晚彩排配合"
- en: "Every slide comes up on cue. {senior} thanks you on the acknowledgments slide."
  zh: "每张幻灯片都准时出现。{senior} 在致谢页上感谢了你。"
- en: "Wing it"
  zh: "临场发挥"
- en: "Nobody notices you at all, which is exactly the job."
  zh: "全程没人注意到你。合格的工具人就该这样。"
- en: "You skip slide 31, and {senior} improvises around it. Neither of you will ever mention it."
  zh: "你跳过了第 31 页，{senior} 临场圆了过去。这件事你们俩谁都不会再提。"
- en: "Note every question between clicks"
  zh: "翻页间隙记下每个问题"
- en: "Your notes become {senior}'s revision list, and the start of your own defense prep."
  zh: "你的笔记成了 {senior} 的修改清单，也成了你自己答辩准备的开端。"
