# zh translations for events/health (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "The Cold"
  zh: "重感冒"
- en: "You catch something nasty. Your nose runs, your head is full of wool, and the next two weeks will be slow."
  zh: "你得了场重感冒：鼻涕流个不停，脑子像塞了团棉花，接下来两周干啥都慢半拍。"
- en: "Stay in bed with soup"
  zh: "躺在床上喝汤"
- en: "You sleep fourteen hours and wake up a person again."
  zh: "你一口气睡了 14 个小时，醒来总算又像个人了。"
- en: "Work from the couch under a blanket"
  zh: "裹着毯子在沙发上干活"
- en: "You get a little done. Your typing has a lot of sniffles in it."
  zh: "活干了一点，只是敲出来的字都带着鼻音。"
- en: "Flu Season"
  zh: "流感季"
- en: "Half the department is coughing. By Tuesday, so are you."
  zh: "系里一半的人都在咳嗽。到了周二，你也加入了。"
- en: "Sleep it off, and get the flu shot next year"
  zh: "先睡一觉扛过去，明年记得打流感疫苗"
- en: "You make a note for next fall. For now there's tea, and a lot of sleep."
  zh: "你在备忘录里记下“明年秋天打疫苗”。眼下只有热茶，和很多很多觉。"
- en: "Put on a mask and keep going"
  zh: "戴上口罩接着干"
- en: "You get through it slowly. So do the other six people in the lab."
  zh: "你慢慢熬了过来。实验室另外六个人也一样。"
- en: "The Conference Souvenir"
  zh: "开会伴手礼"
- en: "Three thousand people, one coffee line and a long flight home. You brought back a lanyard, twelve business cards and a fever."
  zh: "三千人、一条排咖啡的长队，外加一趟长途航班。你带回来一根胸牌挂绳、十二张名片，还有一场高烧。"
- en: "Sleep off the jet lag and the fever together"
  zh: "倒时差和退烧一起睡过去"
- en: "Two birds, one very long nap."
  zh: "一觉解决两件事，就是这觉睡得有点长。"
- en: "Write up your conference notes from bed"
  zh: "躺在床上整理开会笔记"
- en: "Half the notes are good ideas. The other half say \"ask about the thing\"."
  zh: "一半笔记是好点子，另一半写着“回头问问那个事”。"
- en: "Migraine"
  zh: "偏头痛"
- en: "A migraine arrives at 2 pm and turns your screen into the sun."
  zh: "下午两点，偏头痛准时到访，屏幕亮得像太阳。"
- en: "Close the curtains, turn off the lights, lie down"
  zh: "拉上窗帘，关灯，躺下"
- en: "The world comes back slowly, and quieter than before."
  zh: "世界慢慢回来了，还比之前安静了些。"
- en: "Dark mode, sunglasses, keep typing"
  zh: "开深色模式，戴上墨镜，接着打字"
- en: "You finish the paragraph. Tomorrow you can't read it."
  zh: "这段总算写完了，只是第二天连你自己都看不懂。"
- en: "Your Back"
  zh: "老腰"
- en: "You bend down to pick up a pen and your back says no. It keeps saying no for two weeks."
  zh: "你弯腰捡支笔，腰说“不行”。接下来两周，它一直说“不行”。"
- en: "See a physical therapist"
  zh: "去做康复理疗"
- en: "She gives you five exercises and a look. You do the exercises, mostly."
  zh: "理疗师给了你五个动作，外加一个眼神。动作你大体都做了。"
- en: "Work standing up, leaning on the bookshelf"
  zh: "靠着书架站着干活"
- en: "The bookshelf is now a standing desk. Your back isn't convinced."
  zh: "书架成了你的升降桌，但你的腰并不买账。"
- en: "The Stomach"
  zh: "胃病"
- en: "Four coffees a day and dinner at 11 pm finally send the bill: your stomach hurts every time you eat."
  zh: "一天四杯咖啡、晚上十一点才吃晚饭，账单终于来了：一吃东西胃就疼。"
- en: "Rice porridge, and no coffee for two weeks"
  zh: "喝白粥，两周不碰咖啡"
- en: "The first three days are hard. Then food stops hurting."
  zh: "头三天很难熬，之后吃饭总算不疼了。"
- en: "Antacids, and one coffee a day. Just one."
  zh: "吃胃药，咖啡一天就一杯，就一杯"
- en: "It's never just one."
  zh: "从来就不可能只有一杯。"
- en: "The Free Pizza"
  zh: "免费披萨"
- en: "The pizza at Friday's talk sat out a little too long. You find out on Saturday."
  zh: "周五讲座剩下的披萨放得有点久了。周六你就知道了。"
- en: "Go to urgent care"
  zh: "去急诊"
- en: "Two hours in the waiting room, then a nurse says \"fluids\". You drink fluids."
  zh: "在候诊室坐了两小时，护士说：“多喝水。”于是你多喝水。"
- en: "Wait it out with crackers"
  zh: "靠苏打饼干硬扛"
- en: "It works, eventually. You can't look at pepperoni for a month."
  zh: "最后还是扛过去了，只是一个月都不想看见意式腊肠。"
- en: "No Voice"
  zh: "失声"
- en: "You wake up with no voice, in the week you're supposed to present at group meeting."
  zh: "你一觉醒来嗓子哑得说不出话，偏偏这周轮到你在组会上讲。"
- en: "Email {advisor} and move your slot"
  zh: "给 {advisor}发邮件，把报告往后挪"
- en: "The reply is short: \"Feel better. Next week, then.\""
  zh: "回复很短：“好好养病，那就下周吧。”"
- en: "Present by typing everything onto the slides"
  zh: "把要讲的话全打在幻灯片上"
- en: "Your slides have never been so complete. People say it's your clearest talk yet."
  zh: "你的幻灯片从没这么完整过。大家都说这是你讲得最清楚的一次。"
- en: "Your Eyes"
  zh: "眼睛"
- en: "Your eyes are red, dry and twitching. The optometrist asks how many hours a day you look at a screen, and you lie."
  zh: "你的眼睛又红又干，还一直跳。验光师问你一天看几个小时屏幕，你撒了谎。"
- en: "Every 20 minutes, look 20 feet away for 20 seconds"
  zh: "每隔 20 分钟远眺 20 秒"
- en: "It's mostly the wall. Your eyes like the wall."
  zh: "所谓远处，基本就是对面那面墙。你的眼睛倒挺喜欢它。"
- en: "Buy eye drops and turn the brightness down"
  zh: "买眼药水，把屏幕调暗"
- en: "Your screen is dim, your eyes are still red, and the draft is a little longer."
  zh: "屏幕暗了，眼睛还是红的，草稿倒是又长了一点。"
- en: "Two Lines"
  zh: "两道杠"
- en: "The test shows two lines. That means five days at home, and a group chat full of people asking whether they sat next to you."
  zh: "测试结果是两道杠。这意味着在家隔离五天，外加一个群里全是人在问自己有没有坐在你旁边。"
- en: "Isolate properly and rest"
  zh: "老老实实隔离休息"
- en: "You watch a whole TV series and feel guilty about none of it."
  zh: "你一口气追完了一整部剧，一点都不内疚。"
- en: "Isolate, and join every meeting with the camera off"
  zh: "隔离，但每个会都关着摄像头参加"
- en: "You attend everything and remember nothing."
  zh: "每个会你都在，每个会你都没记住。"
- en: "Asleep on the Keyboard"
  zh: "趴在键盘上睡着了"
- en: "You wake up at your desk at 3 am. The draft now ends with four pages of the letter k."
  zh: "凌晨三点，你在桌前醒来。草稿末尾多了四页字母 k。"
- en: "Delete the k's and go home to bed"
  zh: "删掉那些 k，回家睡觉"
- en: "You sleep in your own bed for the first time in a week. It's a great bed."
  zh: "一周以来第一次睡在自己床上。这床真好。"
- en: "Delete the k's and keep writing"
  zh: "删掉那些 k，接着写"
- en: "The next paragraph is worse than the k's."
  zh: "接下来那段，还不如那四页 k。"
- en: "Slept Through It"
  zh: "睡过头了"
- en: "You sleep through three alarms and your 9 am meeting with {advisor}."
  zh: "你睡过了三个闹钟，也睡过了早上九点跟 {advisor}的会。"
- en: "Tell the truth: you were running on empty"
  zh: "实话实说：你实在是累垮了"
- en: "\"Take this week slower,\" comes the reply. For once, you do."
  zh: "回复是：“这周慢一点。”难得一次，你真的照做了。"
- en: "Say your calendar didn't sync, and push on"
  zh: "说是日历没同步，然后接着硬撑"
- en: "The meeting moves to Thursday. You're awake for it, barely."
  zh: "会改到了周四。你勉强醒着开完了。"
- en: "Brain Fog"
  zh: "脑雾"
- en: "You read the same paragraph six times. On the seventh, you notice it's from your own paper."
  zh: "同一段话你读了六遍。读到第七遍，你才发现这是你自己写的论文。"
- en: "Close the laptop and go for a walk"
  zh: "合上电脑，出去走走"
- en: "Twenty minutes outside, and words start meaning things again."
  zh: "在外面走了二十分钟，那些字又重新有了意思。"
- en: "Make another coffee"
  zh: "再冲一杯咖啡"
- en: "You read it an eighth time, faster."
  zh: "第八遍读得快多了。"
- en: "Reply All"
  zh: "全员回复"
- en: "Too tired to look, you send a half-written email to the whole lab list. It ends with \"ok but honestly\"."
  zh: "你累得没细看，把一封写了一半的邮件发到了全组的邮件列表。结尾是“行吧，但说实话”。"
- en: "Send a follow-up: please ignore"
  zh: "补发一封：请忽略"
- en: "Three people reply \"ignored!\" One asks what you were honestly about to say."
  zh: "三个人回复“已忽略！”还有一个人问你，“说实话”后面本来要说什么。"
- en: "Pretend it never happened and log off"
  zh: "假装无事发生，下线"
- en: "You log off for the rest of the day, which is what you needed anyway."
  zh: "你那天再也没上线，而这正是你需要的。"
- en: "Cereal for Dinner"
  zh: "麦片当晚饭"
- en: "You stand in the grocery store for ten minutes and can't remember what you came for. You buy cereal. It's dinner for four days."
  zh: "你在超市里站了十分钟，愣是想不起来要买什么。最后买了麦片，当了四天晚饭。"
- en: "Cook a real meal on Sunday"
  zh: "周日好好做顿饭"
- en: "It takes two hours and feeds you for three days. You feel like an adult."
  zh: "做了两个小时，够吃三天。你觉得自己像个大人了。"
- en: "Order takeout, again"
  zh: "再点一次外卖"
- en: "The delivery driver knows your name and your door code."
  zh: "外卖小哥已经知道你的名字和门禁密码了。"
- en: "The Last Stop"
  zh: "坐到终点站"
- en: "You fall asleep on the bus and wake up at the end of the line, in a part of town you've never seen."
  zh: "你在公交车上睡着了，醒来已经到了终点站，周围是从没来过的街区。"
- en: "Walk back and look around"
  zh: "一路走回去，顺便逛逛"
- en: "There's a bakery out here better than anything near campus. You start coming back on weekends."
  zh: "这边有家面包店，比学校附近哪家都好吃。之后你周末常来。"
- en: "Take the next bus back, and nap on it"
  zh: "坐下一班车回去，顺便再睡会儿"
- en: "You wake up at the other end of the line. You give up and take a taxi."
  zh: "你又在另一头的终点站醒来。你放弃了，打了辆车。"
- en: "The Birthday"
  zh: "生日"
- en: "Your phone shows a photo of everyone at a friend's birthday dinner. It was tonight. You were in the lab, and you forgot."
  zh: "手机上弹出一张照片：朋友的生日聚餐，大家都在。就是今晚。你在实验室，忘得一干二净。"
- en: "Call to apologize, and take them to dinner"
  zh: "打电话道歉，再请朋友吃顿饭"
- en: "They forgive you over noodles. Every birthday goes into your calendar, with two alarms."
  zh: "一碗面下肚，朋友原谅了你。你把每个人的生日都记进了日历，还设了两个提醒。"
- en: "Send a long text and go to bed"
  zh: "发一大段消息，然后睡觉"
- en: "\"no worries!!\" comes back. You're not sure it's no worries."
  zh: "对方回了句“没事没事！！”你也说不准是不是真没事。"
- en: "The Third Coffee"
  zh: "第三杯咖啡"
- en: "By the third coffee your hands shake when you type, and the cursor jumps around as if it had coffee too."
  zh: "喝到第三杯，你打字时手都在抖，光标也到处乱跳，好像它也喝了咖啡。"
- en: "Switch to water and go to bed early"
  zh: "改喝白开水，早点睡"
- en: "The shaking stops. The tiredness doesn't, but now it's the honest kind."
  zh: "手不抖了。累还是累，但至少是实打实的累。"
- en: "Fourth coffee"
  zh: "第四杯"
- en: "Your heart plays a short drum solo. You finish the figure."
  zh: "你的心脏来了段小鼓独奏。图倒是画完了。"
