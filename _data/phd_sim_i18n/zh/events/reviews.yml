# zh translations for events/reviews (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Well Written. Score: 2."
  zh: ""
- en: "Reviewer 3: \"The paper is well written, well motivated, and the experiments are thorough.\" Overall score: 2."
  zh: ""
- en: "One review praises your writing for a full paragraph, then gives {paper} a 2."
  zh: ""
- en: "Ask what would change their mind"
  zh: ""
- en: "Your question is short and polite. The reviewer admits they \"expected more\" and raises the score half a point."
  zh: ""
- en: "Your question gets no answer. The 2 stays a 2, mysterious and well written."
  zh: ""
- en: "Flag the mismatch to the area chair"
  zh: ""
- en: "The area chair agrees that the review's text doesn't support its score, and weighs it less."
  zh: ""
- en: "The area chair reads your note as a complaint about a low score, which, to be fair, it is."
  zh: ""
- en: "Spend your effort on the others"
  zh: ""
- en: "You thank Reviewer 3 for the kind words and answer the other two carefully."
  zh: ""
- en: "One Line Over"
  zh: ""
- en: "A week after you submit, the program chairs write: {paper} runs one line onto page 9, past the 8-page limit, so it is desk-rejected."
  zh: ""
- en: "Appeal, politely"
  zh: ""
- en: "On a second look, the stray line is part of the Limitations section, which doesn't count. The chairs reinstate the paper and apologize."
  zh: ""
- en: "The chairs reply, kindly and firmly, that the limit is the limit. You now know exactly how many lines fit on page 8."
  zh: ""
- en: "Tell the lab the whole story"
  zh: ""
- en: "The lab laughs with you, mostly. Two labmates go back to their desks and count their own pages."
  zh: ""
- en: "Fix it and move on"
  zh: ""
- en: "Two lines gone in five minutes, and a sticky note on your monitor: \"COUNT THE PAGES.\" The paper waits for the next cycle."
  zh: ""
- en: "Thanks, Everyone"
  zh: ""
- en: "Rereading the submitted PDF, you reach the last page. The acknowledgments, which you meant to delete, thank your lab by name and list your grant number."
  zh: ""
- en: "Tell the chairs yourself"
  zh: ""
- en: "The chairs thank you for reporting it and let the paper through without the paragraph."
  zh: ""
- en: "The chairs thank you for your honesty and desk-reject the paper, since the policy has no honesty clause."
  zh: ""
- en: "Ask your advisor what to do"
  zh: ""
- en: "Your advisor replies in four minutes: \"Tell the chairs. Now.\" You do, and they let it through."
  zh: ""
- en: "Your advisor is on a long flight. By the time they land, the chairs have found it and desk-rejected the paper."
  zh: ""
- en: "Hope nobody reads acknowledgments"
  zh: ""
- en: "You close the PDF. Surely nobody reads the acknowledgments. You check your email a lot this week."
  zh: ""
- en: "Someone Read the Acknowledgments"
  zh: ""
- en: "An email from the program chairs: they read the acknowledgments. {paper} is desk-rejected for breaking anonymity."
  zh: ""
- en: "Start a pre-submission checklist"
  zh: ""
- en: "Item one: delete the acknowledgments. Item two: check item one."
  zh: ""
- en: "Warn the lab"
  zh: ""
- en: "Three labmates open their own drafts and delete the acknowledgments. You may have saved someone else's paper."
  zh: ""
- en: "[TODO]"
  zh: ""
- en: "Scrolling the submitted PDF, you find it on page 6, in red: \"[TODO: rerun with new seeds - {labmate}]\". That's a real name in an anonymous submission, and the portal closes in nine minutes."
  zh: ""
- en: "Delete it and re-upload, fast"
  zh: ""
- en: "The new PDF lands with 40 seconds to spare. Your heart rate takes longer to recover."
  zh: ""
- en: "The upload finishes at 12:00:07, and the portal keeps the old PDF. A week later, the paper is desk-rejected."
  zh: ""
- en: "Email the chairs and explain"
  zh: ""
- en: "The chairs accept a corrected PDF. They've seen worse, they say, and they list some."
  zh: ""
- en: "The chairs are sympathetic and firm. The name was visible to reviewers, so the paper is desk-rejected."
  zh: ""
- en: "Accepted, Mid-Slide"
  zh: ""
- en: "Halfway through lab meeting, while {labmate} presents, your phone lights up: \"{venue} decision: Accept.\""
  zh: ""
- en: "Wait until {labmate} finishes"
  zh: ""
- en: "You sit on the news for 25 minutes. When you share it at the end, the room cheers, and {labmate} cheers loudest."
  zh: ""
- en: "Announce it right now"
  zh: ""
- en: "The room cheers. {labmate}'s ablation slide never quite recovers."
  zh: ""
- en: "Slide your phone to {advisor}"
  zh: ""
- en: "{advisor} reads it and keeps a straight face for nine more minutes before announcing it to the room."
  zh: ""
- en: "Score Raised"
  zh: ""
- en: "In the final reviews, Reviewer 3 has raised their score from 2.5 to 3.5, enough to tip the decision: \"The new analysis addresses my concern.\""
  zh: ""
- en: "Write down what convinced them"
  zh: ""
- en: "Their concern was right, and fixing it made the paper better. You save the note for next time."
  zh: ""
- en: "Screenshot it for the lab chat"
  zh: ""
- en: "The lab chat fills with celebration emoji. {labmate} asks to see your response, for science."
  zh: ""
- en: "Move the analysis into the main text"
  zh: ""
- en: "The new analysis becomes Figure 4. Readers will find it, and so will citations."
  zh: ""
- en: "Promises, Promises"
  zh: ""
- en: "The camera-ready is due in two weeks. Your rebuttal promised a new baseline, an error analysis, and a clearer Figure 2."
  zh: ""
- en: "Deliver every promise"
  zh: ""
- en: "Everything you promised is in. Reviewer 2 will never check. You did it anyway, and your advisor noticed."
  zh: ""
- en: "Deliver the main ones"
  zh: ""
- en: "The baseline and the figure make it in. The error analysis becomes \"future work\"."
  zh: ""
- en: "Submit it as accepted"
  zh: ""
- en: "Nobody stops you. Your advisor notices the missing error analysis and says nothing, which is worse."
  zh: ""
- en: "Fourth Time"
  zh: ""
- en: "{paper} has been rejected so many times it has its own folder of reviews. This time, all three reviews are positive. One calls it \"timely\"."
  zh: ""
- en: "Frame the acceptance email"
  zh: ""
- en: "It goes on the wall by your desk, above a sticky note that says \"resubmit\"."
  zh: ""
- en: "Reread the first round of reviews"
  zh: ""
- en: "Round one said the paper wasn't ready, and round one was right. It's a much better paper now."
  zh: ""
- en: "Thank everyone who read all four"
  zh: ""
- en: "Your advisor and {labmate} have read every version. You buy the first round, and they make you tell the whole story."
  zh: ""
- en: "Nominated"
  zh: ""
- en: "The acceptance comes with a Best Paper nomination. For two months you rehearse a 30-second thank-you. At the ceremony, another paper wins."
  zh: ""
- en: "Clap, sincerely"
  zh: ""
- en: "The winning paper is very good. You clap, and someone behind you whispers that yours was their favorite."
  zh: ""
- en: "Add \"nominee\" to your CV"
  zh: ""
- en: "\"Best Paper Nominee\" goes on your CV, and you will argue with anyone who says it doesn't count."
  zh: ""
- en: "Read the winner on the flight home"
  zh: ""
- en: "It's excellent. You fill two pages with ideas, and only one of them is \"why not us\"."
  zh: ""
- en: "Outstanding Paper"
  zh: ""
- en: "A second email from the chairs, two weeks after the acceptance: {paper} has been selected for an Outstanding Paper Award at {venue}."
  zh: ""
- en: "Read it five times, then call home"
  zh: ""
- en: "Your family doesn't know what the award is. They are prouder than anyone at the conference will be."
  zh: ""
- en: "Rebuild the talk from scratch"
  zh: ""
- en: "An award paper gets a full room. You rewrite the talk for it, and it's the best one you've ever given."
  zh: ""
- en: "Post the news"
  zh: ""
- en: "Your post is shared by people you've only ever cited. Your inbox fills with invitations and one recruiter."
  zh: ""
- en: "4, 4, and 2"
  zh: ""
- en: "Scores: 4, 4 and 2. The meta-review summarizes the 2, quotes the 2, and recommends rejection."
  zh: ""
- en: "Write to the senior area chair"
  zh: ""
- en: "A thoughtful reply: the meta-review \"could have engaged more with the positive reviews.\" The decision stands, but you feel heard."
  zh: ""
- en: "A template reply thanks you for your feedback on the review process."
  zh: ""
- en: "Reread the 2 for anything real"
  zh: ""
- en: "Under the tone, one point is real. You fix it, and the next version is harder to reject."
  zh: ""
- en: "Resubmit next cycle, same paper"
  zh: ""
- en: "You send the same paper to new reviewers and hope for two 4s and a quiet third."
  zh: ""
- en: "Read by Nobody"
  zh: ""
- en: "You wrote a careful response with two new experiments. Not one reviewer replied, and the meta-review repeats the concerns you answered."
  zh: ""
- en: "Put the new experiments in the paper"
  zh: ""
- en: "The rebuttal experiments go into the next version. This time, someone has to read them."
  zh: ""
- en: "Report it to the chairs"
  zh: ""
- en: "The chairs agree that the reviewers didn't engage and make a note of it. Nothing changes, but you feel better."
  zh: ""
- en: "An auto-reply, then nothing. You have now written two documents nobody read."
  zh: ""
- en: "Close the laptop for the evening"
  zh: ""
- en: "You call a friend over for dinner and don't open the reviews again until Monday."
  zh: ""
- en: "In Light of the Other Reviews"
  zh: ""
- en: "Reviewer 1 had given a 3.5. After reading Reviewer 2, they lowered it to 2.5: \"I agree with R2's concerns.\" You had answered R2's concerns."
  zh: ""
- en: "File a review issue report"
  zh: ""
- en: "The area chair acknowledges the score change was never explained. The decision stands, but the note goes on record."
  zh: ""
- en: "Your report is filed. So, apparently, is everything else."
  zh: ""
- en: "Fix R2's concern anyway"
  zh: ""
- en: "Annoyingly, the fix makes the paper better. R2 was rude, but not entirely wrong."
  zh: ""
- en: "Vent to {labmate}"
  zh: ""
- en: "{labmate} once had a reviewer lower a score twice. You feel better, and slightly worse about science."
  zh: ""
- en: "Shrug it off like a veteran"
  zh: ""
- en: "Three rejections ago, this would have ruined your week. Today it ruins an afternoon, at most."
  zh: ""
- en: "Decision at Dinner"
  zh: ""
- en: "Your phone buzzes halfway through dinner with your family. It's the {venue} decision, and it's a no. Everyone has already seen your face."
  zh: ""
- en: "Tell them what happened"
  zh: ""
- en: "Nobody at the table knows what a meta-review is. They are outraged on your behalf anyway, and it helps."
  zh: ""
- en: "\"Just work stuff.\""
  zh: ""
- en: "Nobody believes you. You skip dessert and reread the reviews under the table."
  zh: ""
- en: "Explain peer review, in full"
  zh: ""
- en: "Twenty minutes later, your uncle has a theory about Reviewer 2, and it's annoyingly plausible."
  zh: ""
- en: "Revise and Resubmit"
  zh: ""
- en: "{venue} says Revise and Resubmit. The reviewers' list of changes would rewrite half of {paper}, and the revision is due right after the holidays."
  zh: ""
- en: "Rewrite half the paper"
  zh: ""
- en: "By the end you have a new framing and a new analysis. It's nearly a new paper, and a better one."
  zh: ""
- en: "Fix only the must-fix list"
  zh: ""
- en: "You make the required changes and politely explain the rest in the response letter."
  zh: ""
- en: "Split the rewrite with {labmate}"
  zh: ""
- en: "{labmate} takes the related work and the discussion, and somehow the paper still reads like one person wrote it."
  zh: ""
- en: "{labmate}'s half is good, but in a completely different voice. The paper now has two personalities."
  zh: ""
- en: "Ten Papers, Two Weeks"
  zh: ""
- en: "An area chair asks you to review ten papers. Reviews are due in two weeks."
  zh: ""
- en: "Reviewing assignments are out: ten papers in two weeks. One of them is 40 pages with appendices."
  zh: ""
- en: "Review all ten, properly"
  zh: ""
- en: "You write ten careful reviews. The area chair remembers your name, and you learn more about why papers get rejected than your own rejections ever taught you."
  zh: ""
- en: "Take three, decline seven"
  zh: ""
- en: "You send three thorough reviews on time, and the area chair thanks you for saying no early."
  zh: ""
- en: "Accept all ten and skim"
  zh: ""
- en: "Your reviews are short, and the area chair notices. Somewhere, you've just become someone's Reviewer 2."
  zh: ""
- en: "Would You Be Willing to Review?"
  zh: ""
- en: "A journal editor writes: \"Would you be willing to review this manuscript? We'd appreciate your comments within 21 days.\" It's 48 pages."
  zh: ""
- en: "Your advisor forwards a review request with one line: \"You'd be great for this.\" It's due in three weeks."
  zh: ""
- en: "Accept and do it properly"
  zh: ""
- en: "It takes three evenings, and you come out of it with a lot of respect for clear figures."
  zh: ""
- en: "Accept, then forget until the reminder"
  zh: ""
- en: "You write it in one panicked night, after the second reminder."
  zh: ""
- en: "Decline politely"
  zh: ""
- en: "You suggest a labmate instead. The editor thanks you for the quick reply."
  zh: ""
- en: "Slight Delay"
  zh: ""
- en: "Reviews for {paper} were due Monday. A banner on the portal says \"slight delay\". By Thursday your lab refreshes it in shifts, and at 1 am they appear."
  zh: ""
- en: "Read them right now"
  zh: ""
- en: "You read every word at 1 am and start the response by 2, with a headache."
  zh: ""
- en: "Sleep first, read with coffee"
  zh: ""
- en: "Seven more hours of not knowing. The reviews are the same in the morning, and you're kinder to them."
  zh: ""
- en: "Let {labmate} read them first"
  zh: ""
- en: "{labmate} sends a summary: \"Two fair, one weird, all fixable.\""
  zh: ""
- en: "{labmate}'s summary is one word long: \"oof\"."
  zh: ""
- en: "Welcome Back, Reviewer"
  zh: ""
- en: "Reviewer 2's review of {paper} opens with the same sentence as last cycle's Reviewer 3, typo included."
  zh: ""
- en: "Show them you fixed what they asked"
  zh: ""
- en: "You go through their old concerns point by point, each one fixed. You can almost hear them nod."
  zh: ""
- en: "They've moved on. This cycle's concerns are all new, and you spent your response on the old ones."
  zh: ""
- en: "Treat it as a fresh review"
  zh: ""
- en: "You answer it like any other. They don't need to know that you know."
  zh: ""
- en: "Tell the AC it's a repeat reviewer"
  zh: ""
- en: "The area chair reads the old and new reviews side by side and notices how much the paper has changed."
  zh: ""
- en: "The area chair replies, correctly, that reviewers are allowed to review a paper twice."
  zh: ""
- en: "Confidence: 5"
  zh: ""
- en: "Reviewer 3's review of {paper} is three sentences long, with a score of 1 and confidence 5. The third sentence is \"Not convincing.\""
  zh: ""
- en: "Ask the AC to weigh it lightly"
  zh: ""
- en: "The area chair agrees that three sentences can't carry a 1, and says so in the meta-review."
  zh: ""
- en: "The area chair replies that confidence 5 means confidence 5."
  zh: ""
- en: "Answer it like a full review"
  zh: ""
- en: "Three sentences get three careful answers. Nobody will ever read that review as closely as you just did."
  zh: ""
- en: "Spend the rebuttal on the other two"
  zh: ""
- en: "You thank Reviewer 3 in one line and give your best work to the reviewers who gave theirs."
  zh: ""
- en: "More, Please. Fewer, Please."
  zh: ""
- en: "Reviewer 1: \"Too many experiments; the main story gets lost.\" Reviewer 3: \"More experiments are needed.\" Both are about Section 5 of {paper}."
  zh: ""
- en: "Side with one of them"
  zh: ""
- en: "You side with the reviewer the area chair seems to agree with. It shows in the meta-review."
  zh: ""
- en: "You side with the reviewer the area chair didn't. The other reviewer notices, too."
  zh: ""
- en: "Find the careful middle"
  zh: ""
- en: "You move some experiments to the appendix, so both reviewers can read it as a win."
  zh: ""
- en: "Your middle ground pleases neither. Both reply \"partially addressed\"."
  zh: ""
- en: "Let the area chair sort it out"
  zh: ""
- en: "One neutral line points out the contradiction. Settling it is the area chair's job, and sometimes they do it."
  zh: ""
- en: "Compare With Yourself"
  zh: ""
- en: "Reviewer 2 asks why {paper} doesn't compare against a paper from last year. That paper is yours. The review is anonymous, so you can't just say \"that's us\"."
  zh: ""
- en: "Compare to it, politely"
  zh: ""
- en: "You run your old method as a baseline, written up in the third person, and it loses gracefully."
  zh: ""
- en: "Flag it confidentially to the AC"
  zh: ""
- en: "The area chair sees the problem at once and tells Reviewer 2 the comparison is already in the paper, in spirit."
  zh: ""
- en: "The area chair writes back: \"Please address the reviewer's concern in your response.\""
  zh: ""
- en: "Add the citation and sigh"
  zh: ""
- en: "Reviewer 2 asked you to cite yourself, so you do. Your citation count goes up by one."
  zh: ""
- en: "The Fourth Review"
  zh: ""
- en: "Two days into the rebuttal period, a fourth review of {paper} appears, marked \"emergency\". It's the shortest of the four, and the harshest."
  zh: ""
- en: "Answer it first"
  zh: ""
- en: "It gets your best paragraph, right at the top. The other three get slightly shorter answers."
  zh: ""
- en: "Note that it came late"
  zh: ""
- en: "You add one neutral sentence about the timing, and the area chair weighs the late review accordingly."
  zh: ""
- en: "The note reads as a complaint. The area chair weighs it accordingly."
  zh: ""
- en: "Treat it like the others"
  zh: ""
- en: "All four reviews get calm answers. The late one doesn't get to set the tone."
  zh: ""
- en: "2,500 Characters"
  zh: ""
- en: "The rebuttal limit is 2,500 characters. Your draft reply to Reviewer 2 alone is 6,000."
  zh: ""
- en: "Cut to your three strongest points"
  zh: ""
- en: "Each point is one claim and one number. It's the best thing you've written all month."
  zh: ""
- en: "You cut the numbers and keep the adjectives."
  zh: ""
- en: "Write it like a telegram"
  zh: ""
- en: "\"Baseline added STOP Table 3 fixed STOP thank you STOP\". It fits. The reviewers may not find it as funny as you do."
  zh: ""
- en: "Answer only Reviewer 2"
  zh: ""
- en: "Reviewer 2 gets 2,500 careful characters. Reviewers 1 and 3 get nothing, and they may notice."
  zh: ""
- en: "Where's the Control?"
  zh: ""
- en: "Reviewer 1 likes {paper} but wants a control condition. Without one, they can't tell whether your tool helped or your participants were just being nice."
  zh: ""
- en: "Defend the design"
  zh: ""
- en: "You explain why a formative study doesn't need a control, with two citations. Reviewer 1 accepts it."
  zh: ""
- en: "Your defense is correct and a little defensive. Reviewer 1 is unmoved."
  zh: ""
- en: "Promise it as future work"
  zh: ""
- en: "You add a paragraph to the limitations and a promise to the response. Reviewers have heard it before, but it helps a little."
  zh: ""
- en: "Run a quick online version in five days"
  zh: ""
- en: "Forty online participants and five short nights later, your tool beats the control. Your body files a complaint."
  zh: ""
- en: "Have You Considered LLMs?"
  zh: ""
- en: "Reviewer 3's main suggestion: \"The authors should consider using large language models.\" {paper} is entirely about large language models. It says so in the title."
  zh: ""
- en: "Point politely to the title"
  zh: ""
- en: "\"As the title suggests, our work uses large language models throughout.\" It's polite and only slightly smug."
  zh: ""
- en: "It reads more pointed than you meant. Reviewer 3 does not reply."
  zh: ""
- en: "List Sections 1 through 6"
  zh: ""
- en: "You list every section that uses one, with page numbers. It feels great, and the area chair can tell."
  zh: ""
- en: "Laugh, then answer it as a real question"
  zh: ""
- en: "Maybe they meant a different kind of model. You add a second model family, and the paper is better for it."
  zh: ""
- en: "A Different Paper"
  zh: ""
- en: "Reviewer 2's summary of {paper} describes a method you didn't propose, tested on a dataset you didn't use. The weaknesses are about that paper, too."
  zh: ""
- en: "Correct the summary gently"
  zh: ""
- en: "One kind paragraph explains what the paper actually does. Whether Reviewer 2 reads it is up to Reviewer 2."
  zh: ""
- en: "Write to the area chair"
  zh: ""
- en: "The area chair compares the summary to your abstract and sets the review aside."
  zh: ""
- en: "The area chair is on vacation. Their backup is also on vacation."
  zh: ""
- en: "Answer it as if they'd read it"
  zh: ""
- en: "You answer the concerns that could apply to your paper and skip the rest, which is oddly relaxing."
  zh: ""
- en: "Could Go Either Way"
  zh: ""
- en: "All three reviews of {paper} give borderline scores, and all three say \"I could go either way.\""
  zh: ""
- en: "Write your strongest rebuttal"
  zh: ""
- en: "You answer every concern with numbers and leave nothing on the table except your sleep."
  zh: ""
- en: "Keep it short and polite"
  zh: ""
- en: "You write five pleasant lines per reviewer. Borderline papers sometimes tip on tone."
  zh: ""
- en: "Write it off and aim higher next cycle"
  zh: ""
- en: "You send a minimal response and start a list for the next version. It's a relief to stop hoping."
  zh: ""
- en: "Rebuttal, Room 1214"
  zh: ""
- en: "The rebuttal window for {paper} opens on the first morning of a conference you're attending, and it closes five days later."
  zh: ""
- en: "Write it in the hotel at night"
  zh: ""
- en: "You go to talks by day and write by night on hotel coffee. The response is good, and you look like the hotel coffee."
  zh: ""
- en: "Skip a day of sessions"
  zh: ""
- en: "You spend a day in your room with the rebuttal and miss the keynote everyone talks about at dinner."
  zh: ""
- en: "Split it with {labmate}"
  zh: ""
- en: "{labmate}, at home and rested, takes two reviewers. You answer the third between sessions."
  zh: ""
- en: "{labmate} is at the same conference. You write it together in the hotel lobby at midnight."
  zh: ""
- en: "The Experiment, a Day Late"
  zh: ""
- en: "At 6 am the morning after you submit {paper}, you wake up knowing the one experiment that would have made it airtight."
  zh: ""
- en: "Run it now, for the rebuttal"
  zh: ""
- en: "By the time reviews arrive, the result is in a table, ready to paste. The post-deadline rest never happens."
  zh: ""
- en: "Save it for the next paper"
  zh: ""
- en: "It goes in a file called next_paper.md. The file is getting long, which is a good sign."
  zh: ""
- en: "Write it down and go back to sleep"
  zh: ""
- en: "You write it on a sticky note and sleep until noon, the best sleep since the deadline."
  zh: ""
- en: "Findings Counts"
  zh: ""
- en: "{paper} is in {venue}, not the main conference. {advisor} and {labmate} both tell you Findings is a real publication, several times each."
  zh: ""
- en: "Call it a win and mean it"
  zh: ""
- en: "You update your CV and sleep well for the first time in a month."
  zh: ""
- en: "Ask whether Findings gets a poster"
  zh: ""
- en: "It does, in a shared session. Three people stop by, and one of them becomes a collaborator."
  zh: ""
- en: "Findings is virtual-only this year. You present to a poster board of avatars."
  zh: ""
- en: "Start the main-track follow-up now"
  zh: ""
- en: "You open a new document called \"main track, for real\"."
  zh: ""
- en: "The Paper You Reviewed"
  zh: ""
- en: "Decisions are out. {paper} is rejected, and the paper you gave a 2 as a reviewer for {venue} is accepted."
  zh: ""
- en: "Read their camera-ready"
  zh: ""
- en: "They fixed everything you asked for. It's a good paper now, partly thanks to you, and you're not sure how to feel about that."
  zh: ""
- en: "Tell {labmate}, without saying which"
  zh: ""
- en: "{labmate} guesses the paper in four seconds. You neither confirm nor deny, and you both feel better."
  zh: ""
- en: "Close the tab and get ice cream"
  zh: ""
- en: "Peer review is a lottery, and this week you bought a ticket for someone else."
  zh: ""
- en: "The One-Line Meta-Review"
  zh: ""
- en: "The meta-review for {paper} is one sentence long: \"The reviewers raised several concerns.\" It does not say which."
  zh: ""
- en: "Reread the reviews for clues"
  zh: ""
- en: "Two concerns show up in more than one review. That's probably the sentence the area chair meant to write."
  zh: ""
- en: "Email the area chair"
  zh: ""
- en: "The area chair replies with a real paragraph and an apology. It's the most useful part of the whole review."
  zh: ""
- en: "The reply is also one sentence long."
  zh: ""
- en: "Print it and pin it to the wall"
  zh: ""
- en: "It goes up next to {labmate}'s \"Thank you for your submission.\""
  zh: ""
- en: "A Great Workshop Paper"
  zh: ""
- en: "The meta-review for {paper}: \"Not ready for {venue}, but this would make a great workshop paper.\" It's meant kindly, and it still stings."
  zh: ""
- en: "Send a short version to a workshop"
  zh: ""
- en: "You send four non-archival pages. A few people hear about the work now, and the full paper stays free for a main venue."
  zh: ""
- en: "Hold out for another main venue"
  zh: ""
- en: "You fix the core concerns and aim high again. They said \"not ready\", not \"not good\"."
  zh: ""
- en: "Split it into two papers"
  zh: ""
- en: "You cut it in two and keep the stronger half for now. It's clearer than the whole was, and a little smaller."
  zh: ""
- en: "Next Deadline: Three Weeks"
  zh: ""
- en: "An hour after the rejection, {advisor} writes: \"Let's turn {paper} around for the next deadline. It's in three weeks.\""
  zh: ""
- en: "Turn it around fast"
  zh: ""
- en: "For three weeks you do nothing else, and most concerns get answered. Sunlight becomes a rumor."
  zh: ""
- en: "Ask for one more cycle to fix it"
  zh: ""
- en: "\"Fair. Better a strong paper later than a tired one now.\" The fixes go deeper than the reviews asked."
  zh: ""
- en: "\"Three weeks is plenty.\" It isn't, but now you know the plan."
  zh: ""
- en: "Fix only the top two concerns"
  zh: ""
- en: "You fix two concerns properly and acknowledge the rest, which fits in three weeks."
  zh: ""
- en: "Mostly Fair"
  zh: ""
- en: "A week later, you reread the reviews of {paper} with fresh eyes. Annoyingly, they're mostly fair."
  zh: ""
- en: "Turn them into a fix list"
  zh: ""
- en: "You end up with eleven items, sorted by effort, which is much easier to look at than a rejection."
  zh: ""
- en: "Stay a little mad"
  zh: ""
- en: "You get a lot done this week, and you type very loudly."
  zh: ""
- en: "Write one thank-you line in your notes"
  zh: ""
- en: "\"Thanks, Reviewer 1, for the error analysis idea.\" Nobody will read it, and you feel better anyway."
  zh: ""
- en: "Was It Wasted?"
  zh: ""
- en: "You have to tell your clinical collaborators that {paper} was rejected. Their first question: \"So was the study wasted?\""
  zh: ""
- en: "Explain peer review honestly"
  zh: ""
- en: "They follow the whole process, luck included. One says it sounds like grant review, only faster."
  zh: ""
- en: "They follow along until \"Reviewer 1 lowered the score after reading Reviewer 2\", then look worried for you."
  zh: ""
- en: "Share the kind parts of the reviews"
  zh: ""
- en: "Every reviewer praised the clinical setting. You read them those lines and keep the rest for the lab."
  zh: ""
- en: "Invite them to plan the resubmission"
  zh: ""
- en: "They bring a better scenario and two ideas you'd never have had. It costs a meeting a week, and the next version is stronger."
  zh: ""
- en: "Cited, Rejected"
  zh: ""
- en: "{paper} is rejected from {venue} on Tuesday. On Thursday, its arXiv version is cited twice. One of the citing papers calls it \"seminal\"."
  zh: ""
- en: "Let it make you feel better"
  zh: ""
- en: "Three reviewers said no, and two papers have cited it since. You decide the papers count more."
  zh: ""
- en: "Update arXiv with the fixes"
  zh: ""
- en: "Version 2 goes up with the reviewers' fixes in it. It's the one people will cite from now on."
  zh: ""
- en: "Screenshot it for {advisor}"
  zh: ""
- en: "{advisor} replies with three exclamation marks, the most you've ever received."
  zh: ""
- en: "It's a Lottery Anyway"
  zh: ""
- en: "{labmate}, your co-author on {paper}, wants to resubmit it unchanged: \"It's a lottery anyway. New reviewers, new numbers.\""
  zh: ""
- en: "Agree and buy another ticket"
  zh: ""
- en: "You resubmit it with very little work. It is also exactly the paper three people just rejected."
  zh: ""
- en: "Insist on fixing the concerns"
  zh: ""
- en: "{labmate} sighs and takes the related work. The new version is better, and you're both a bit tired of each other."
  zh: ""
- en: "Fix the two cheapest things"
  zh: ""
- en: "You fix Figure 2 and add one missing citation. It's slightly better than a lottery ticket."
  zh: ""
- en: "Their First Rejection"
  zh: ""
- en: "{paper} was {mentee}'s first paper; their name is second on it. They haven't seen the decision yet. You have to tell them."
  zh: ""
- en: "Tell them in person, with cookies"
  zh: ""
- en: "{mentee} takes it well, eats three cookies and asks what to fix first."
  zh: ""
- en: "Forward the reviews with a long note"
  zh: ""
- en: "Your note says which comments matter and which are noise. {mentee} saves it in a folder called \"how this works\"."
  zh: ""
- en: "Ask {advisor} to tell them"
  zh: ""
- en: "{advisor} handles it kindly. {mentee} wonders, a little, why it wasn't you."
  zh: ""
- en: "Add It. Now Remove It."
  zh: ""
- en: "The new reviewers want Section 5 removed from {paper}. Last cycle's reviewers asked you to add Section 5. It took three weeks."
  zh: ""
- en: "Remove it"
  zh: ""
- en: "It took three weeks to write and three seconds to delete. The paper is tighter, and a little less convincing."
  zh: ""
- en: "Keep it and explain why"
  zh: ""
- en: "Two sentences at the top of Section 5 say why it's there. Nobody will ask again, from either side."
  zh: ""
- en: "Your explanation ends up longer than the section. You trim both and lose an afternoon."
  zh: ""
- en: "Move it to the appendix"
  zh: ""
- en: "Section 5 lives on in Appendix C, where the people who want it can find it and nobody else has to."
  zh: ""
- en: "Too HCI, Too NLP"
  zh: ""
- en: "Last cycle, reviewers called {paper} \"too HCI for this venue\". This cycle, with nearly the same text, it's \"too NLP for this venue\"."
  zh: ""
- en: "Rewrite it for one community"
  zh: ""
- en: "You pick a side and cut what the other side loved. It hurts, and it reads better."
  zh: ""
- en: "Aim for an interdisciplinary venue"
  zh: ""
- en: "You read a year of papers from a venue built for exactly this. Reviewers there might call it a bridge."
  zh: ""
- en: "Turn it into a position paper"
  zh: ""
- en: "If nobody can tell which field it belongs to, maybe that's the argument. The paper gets bolder and easier to attack."
  zh: ""
- en: "Many Happy Returns"
  zh: ""
- en: "On your birthday, at 9 am and before the cake, {venue} rejects {paper}."
  zh: ""
- en: "Cake first, reviews tomorrow"
  zh: ""
- en: "You leave the laptop closed and have cake with your friends. The reviews will still be there tomorrow."
  zh: ""
- en: "Read them now"
  zh: ""
- en: "You read all three over breakfast. You know exactly what to fix, and exactly how to ruin a birthday."
  zh: ""
- en: "Ask the lab never to mention it"
  zh: ""
- en: "Nobody mentions it. {labmate} brings a cake that says \"Happy Birthday\" and, in very small letters, \"R2 is wrong\"."
  zh: ""
- en: "The New Reviewer"
  zh: ""
- en: "After a whole Revise and Resubmit, {paper} is rejected. The deciding review comes from someone who wasn't in the first round, with concerns nobody raised before."
  zh: ""
- en: "Ask the chairs what happened"
  zh: ""
- en: "The chairs explain that a first-round reviewer dropped out. They sound genuinely sorry, which helps a little."
  zh: ""
- en: "A polite reply says the process was followed. It was, and that's the problem."
  zh: ""
- en: "Take it to a journal"
  zh: ""
- en: "A journal has room for the whole story, and reviewers who stay for every round. The paper gets longer, and calmer."
  zh: ""
- en: "Revise once more for the next cycle"
  zh: ""
- en: "You answer the new concerns. The paper has now satisfied three sets of reviewers, at least on paper."
  zh: ""
- en: "Emergency Reviewer Needed"
  zh: ""
- en: "At 9 pm, an area chair writes: a reviewer dropped out, so could you possibly review one paper by noon tomorrow? \"It's short,\" they add. It's 14 pages."
  zh: ""
- en: "Say yes and do it properly"
  zh: ""
- en: "You finish at 3 am. The area chair thanks you by name, which is the most an area chair can do."
  zh: ""
- en: "Say yes, keep it short"
  zh: ""
- en: "You send a fair, short review at 11:58 am. Your best paragraph is about Figure 2."
  zh: ""
- en: "Decline kindly"
  zh: ""
- en: "Someone else gets the email next. You sleep fine, mostly."
  zh: ""
- en: "New Follower"
  zh: ""
- en: "A new follower on social media. Their latest post complains about \"papers that ignore obvious baselines\", in the exact words of the review that rejected your last paper."
  zh: ""
- en: "Follow back"
  zh: ""
- en: "They like your next paper thread within a minute. You wonder whether they know it's you."
  zh: ""
- en: "Mute them"
  zh: ""
- en: "Your feed is calmer, and you stop reading their posts for clues."
  zh: ""
- en: "Post a thread about your baselines"
  zh: ""
- en: "The thread does well, and they like it. You will never know if they noticed."
  zh: ""
- en: "The thread gets four likes. One is from them, which is somehow worse."
  zh: ""
