# zh translations for events/milestones (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Required, Apparently"
  zh: "据说是必修"
- en: "A required course on a topic you will never use again assigns a 40-page problem set every week. Your research sits untouched in another tab."
  zh: "一门这辈子再也用不上的必修课，每周布置 40 页习题。你的研究开在另一个标签页里，一动没动。"
- en: "Do the minimum, protect research time"
  zh: "及格就行，保住科研时间"
- en: "You get a solid B-plus. Your project barely noticed the course existed."
  zh: "你稳稳拿了个 B+。你的项目几乎没察觉这门课存在过。"
- en: "Take it seriously anyway"
  zh: "还是认真学"
- en: "You learn more than you expected. You also sleep less than you expected."
  zh: "你学到的比预想的多，睡得也比预想的少。"
- en: "Find an angle that connects to your work"
  zh: "找个角度和研究挂钩"
- en: "One lecture hands you a framing your project has been missing, which makes up for the problem sets."
  zh: "有一节课正好给了你项目一直缺的那个切入角度，这些习题总算没白做。"
- en: "You try very hard to make it relevant. It stays very irrelevant."
  zh: "你使劲往研究上靠，它就是靠不上。"
- en: "This Could Be a Paper"
  zh: "这能发论文"
- en: "Your course project comes back with one comment from the instructor: \"This could be a paper.\" It overlaps a lot with {project}."
  zh: "课程项目发回来了，老师只写了一句评语：“这可以写成论文。”它和 {project} 重合很多。"
- en: "Fold it into {project}"
  zh: "并入 {project}"
- en: "Half your pilot is now done, and you got a grade for it too."
  zh: "你的预实验一下子完成了一半，还顺手拿了个成绩。"
- en: "Ask {advisor} if it's worth pursuing"
  zh: "问 {advisor}值不值得做"
- en: "{advisor} reads it that week and suggests a sharper framing. You both leave the meeting excited."
  zh: "{advisor}当周就读完了，还建议换个更犀利的切入角度。散会时你们俩都很兴奋。"
- en: "{advisor} says \"interesting\" in the tone that means \"later\". The report goes into a folder."
  zh: "{advisor}说了句“有意思”，那语气分明是“以后再说”。报告进了某个文件夹。"
- en: "Keep it as a course project"
  zh: "就当课程项目"
- en: "You take the A and move on. Your evenings stay free, at least for now."
  zh: "你拿了 A，继续往前走。晚上依然空着，至少目前是。"
- en: "Finals, Meet Deadline"
  zh: "期末撞上截稿"
- en: "Your final exam and the deadline for {project} land in the same week. Both insist they are the priority."
  zh: "期末考试和 {project} 的截稿撞在了同一周。两边都坚称自己才是优先。"
- en: "Prioritize the paper"
  zh: "先保论文"
- en: "The paper goes in and the exam goes okay-ish. You look up your program's minimum passing grade."
  zh: "论文交上了，考试考得马马虎虎。你去查了查系里规定的及格线。"
- en: "Prioritize the exam"
  zh: "先保考试"
- en: "You ace the final. The paper goes in rougher than you would like."
  zh: "期末你考得漂漂亮亮。论文交上去时比你希望的粗糙一些。"
- en: "Do both by giving up sleep"
  zh: "不睡了，两头都顾"
- en: "You survive both. You will not remember this week, but your body will."
  zh: "两边你都撑过来了。这一周你不会记得，但你的身体会记得。"
- en: "80 Papers, Two Weeks"
  zh: "80 篇论文，两周"
- en: "The quals reading list arrives: 80 papers, two weeks. Several are 40 pages long. One is a scanned PDF from the 1990s, slightly crooked."
  zh: "资格考试的阅读清单来了：80 篇论文，两周时间。好几篇长达 40 页。还有一篇是上世纪 90 年代的扫描版 PDF，有点歪。"
- en: "Read every single one"
  zh: "一篇不落全读完"
- en: "You read all 80, and your notes are beautiful. Your eyes are not."
  zh: "80 篇你全读完了，笔记做得很漂亮，眼睛就没那么好看了。"
- en: "Split the list with your cohort"
  zh: "和同届同学分工读"
- en: "Five of you each summarize 16 papers. Your shared notes get passed down to the next three cohorts."
  zh: "你们五个人每人总结 16 篇。这份共享笔记后来往下传了三届。"
- en: "Two people never send their summaries. You read their 32 papers the night before."
  zh: "有两个人一直没交总结。考前那晚，你自己把那 32 篇读了。"
- en: "Read the core 20 deeply, skim the rest"
  zh: "精读核心 20 篇，其余略读"
- en: "You know 20 papers cold and the other 60 by their figures. That's about how your committee read them, too."
  zh: "20 篇你烂熟于心，另外 60 篇只认得图。委员会的老师们读的时候大概也就这样。"
- en: "The Classic You Never Read"
  zh: "那篇你从没读过的经典"
- en: "{senior} warns you: {committee} always asks about one classic paper from before you were born. You have cited it twice. You have never read it."
  zh: "{senior} 提醒你：{committee}每次都会问一篇比你年纪还大的经典论文。你引用过它两次，但从没读过。"
- en: "Read it, plus what it builds on"
  zh: "读原文，再读它的前作"
- en: "Half of modern NLP turns out to be this paper with more GPUs."
  zh: "原来现代 NLP 有一半就是这篇论文加上更多 GPU。"
- en: "Ask {senior} what they were asked"
  zh: "问 {senior} 当年被问了什么"
- en: "{senior} still has their notes, including the exact question. You prepare a crisp answer."
  zh: "{senior} 还留着当年的笔记，连原题都有。你准备了一个干脆利落的回答。"
- en: "\"Something about the second figure?\" That is all {senior} remembers."
  zh: "“好像是关于第二张图的？”{senior} 就记得这么多。"
- en: "Read a blog post about it"
  zh: "读篇博客了事"
- en: "The blog post is confident and slightly wrong. Now you are confident and slightly wrong."
  zh: "那篇博客很自信，也有点错。现在你也很自信，也有点错。"
- en: "You Passed. Now What?"
  zh: "考过了，然后呢？"
- en: "You pass quals. Someone produces a cake, and by 9 pm the lab chat is back to talking about the next deadline."
  zh: "你通过了资格考试。有人变出一个蛋糕，到晚上 9 点，组群又在聊下一个截稿了。"
- en: "Take the whole weekend off"
  zh: "整个周末都休息"
- en: "You spend two days without a laptop and remember what your apartment looks like in daylight."
  zh: "你两天没碰电脑，终于想起自己的公寓在白天长什么样。"
- en: "Celebrate tonight, work tomorrow"
  zh: "今晚庆祝，明天干活"
- en: "You have one good evening with the lab and are back at your desk by morning, a little lighter."
  zh: "你和组里的人过了一个愉快的晚上，第二天一早又坐回工位，心里轻松了一点。"
- en: "Call home with the news"
  zh: "打电话回家报喜"
- en: "Your family asks if this means you are a doctor now. Not yet, but they are proud anyway."
  zh: "家里人问你这是不是就算博士了。还不算，但他们照样为你骄傲。"
- en: "Not a Product"
  zh: "这不是产品"
- en: "At your practice proposal talk, {labmate} raises a hand: \"Honest question. Why is this a PhD and not a product?\" The room goes quiet."
  zh: "开题预演上，{labmate} 举手：“真心问一句，这为什么是博士课题，而不是一个产品？”全场安静了。"
- en: "Rebuild the talk around the question"
  zh: "围绕这个问题重做报告"
- en: "You rework the first five slides around what nobody knows yet. The talk gets sharper."
  zh: "你把前五页幻灯片改成围绕“目前还没人知道什么”来讲。报告一下子有力多了。"
- en: "Answer on the spot"
  zh: "当场回答"
- en: "\"A product helps one hospital. The findings explain why it helped, for everyone.\" {labmate} nods slowly."
  zh: "“产品只能帮到一家医院。研究发现能解释它为什么有用，对所有人都适用。”{labmate} 缓缓点头。"
- en: "You describe the product in great detail. Nobody is convinced, including you."
  zh: "你把产品介绍得非常详细。没有人被说服，包括你自己。"
- en: "Write it down for later"
  zh: "先记下来，以后再想"
- en: "It goes on your list of questions to think about. The list is getting long."
  zh: "它进了你的“待思考问题”清单。这份清单越来越长了。"
- en: "Assembling the Committee"
  zh: "组建答辩委员会"
- en: "You need a committee. Your first choice is on sabbatical on another continent, and {committee} has not answered an email since March."
  zh: "你需要组一个答辩委员会。你的首选正在另一个大洲学术休假，而 {committee}从三月起就没回过邮件。"
- en: "Ask the sabbatical one to join by video"
  zh: "请休假那位远程加入"
- en: "They agree, from nine time zones away. Your dream committee is set."
  zh: "对方同意了，隔着九个时区。你的梦幻委员会凑齐了。"
- en: "They reply with a lovely photo of a mountain and a polite no."
  zh: "对方回了一张很美的山景照，外加一句客气的拒绝。"
- en: "Ask {advisor} to nudge {committee}"
  zh: "请 {advisor}催一催 {committee}"
- en: "{advisor} walks down the hall. {committee} replies within the hour: \"Happy to!\""
  zh: "{advisor}走到走廊那头。一小时内 {committee}就回信了：“乐意之至！”"
- en: "Even {advisor} cannot get a reply. You start looking for a fourth option."
  zh: "连 {advisor}都要不到回复。你开始物色第四个人选。"
- en: "Pick people who answer email"
  zh: "找会回邮件的人"
- en: "Scheduling will be easy. The names on your committee are a little less famous."
  zh: "排时间会很轻松。只是委员会里的名字没那么响亮了。"
- en: "But Does It Scale?"
  zh: "但它能规模化吗？"
- en: "Your industry external member returns your proposal draft. Every section has the same comment: \"Does this scale?\" Including the section on interviewing 12 nurses."
  zh: "你那位来自业界的校外委员把开题报告草稿发回来了。每一节都是同一条批注：“这能规模化吗？”包括访谈 12 位护士的那一节。"
- en: "Add a scalability section"
  zh: "加一节讲规模化"
- en: "You add two pages on deploying to a million users. Your external member is delighted, and {advisor} is puzzled."
  zh: "你加了两页，讲怎么部署给一百万用户。校外委员很满意，{advisor}一脸困惑。"
- en: "Explain why depth matters here"
  zh: "解释为什么这里深度更重要"
- en: "\"Twelve nurses tell us what a million logs can't.\" Your external member writes that down."
  zh: "“12 位护士能告诉我们一百万条日志说不出的东西。”校外委员把这句话记了下来。"
- en: "They nod thoughtfully and ask, \"Sure, but does it scale?\""
  zh: "对方若有所思地点点头，问：“好的，但它能规模化吗？”"
- en: "Reply \"Yes\" and move on"
  zh: "回一句“能”，就此翻篇"
- en: "It works for now. You have a feeling the question will be back on proposal day."
  zh: "暂时过关了。你有种预感，开题那天这个问题还会回来。"
- en: "Crossfire"
  zh: "交火"
- en: "Ten minutes into your committee meeting, {committee} and your external member start arguing about where your thesis should go. You are still on slide 3."
  zh: "委员会会议开了十分钟，{committee}和你的校外委员就为你的论文该往哪走吵了起来。你还停在第 3 页幻灯片。"
- en: "Make the case for your own direction"
  zh: "为自己的方向据理力争"
- en: "You lay out where you want to go and why. They both stop, then agree with you, which surprises everyone."
  zh: "你讲清楚了自己想往哪走、为什么。两人都停了下来，然后都同意了你，所有人都很意外。"
- en: "You try. Now they are both arguing with you instead, which is at least unifying."
  zh: "你试了。现在他们俩改成一起跟你吵，至少算是团结起来了。"
- en: "Let them argue it out"
  zh: "让他们吵完"
- en: "They go for 40 minutes. You take notes and leave with two theses' worth of feedback."
  zh: "他们吵了 40 分钟。你一直记笔记，最后带走了够写两篇博士论文的意见。"
- en: "Look to {advisor} for help"
  zh: "向 {advisor}求助"
- en: "{advisor} steps in with a compromise, and the meeting gets back on track. You owe them one."
  zh: "{advisor}出面提了个折中方案，会议回到了正轨。你欠导师一个人情。"
- en: "{advisor} joins the argument, on a third side."
  zh: "{advisor}也加入了争论，自成第三派。"
- en: "Everything Connects"
  zh: "全都串起来了"
- en: "Each of your papers made sense on its own. The proposal needs them to tell one story. Right now they tell three, plus an awkward silence."
  zh: "你的每篇论文单独看都说得通。开题需要它们讲成一个故事。现在它们讲了三个，外加一段尴尬的沉默。"
- en: "Trace each paper back to one gap"
  zh: "找出每篇论文共同的缺口"
- en: "You find the thread: each paper fixes a limitation the last one exposed. Chapter 1 almost writes itself."
  zh: "你找到了那条线：每篇论文都在补上一篇暴露出的局限。第 1 章几乎自己写出来了。"
- en: "Draw one diagram that links them"
  zh: "画一张图把它们连起来"
- en: "With three boxes and two arrows, it is suddenly obvious that this is one thesis."
  zh: "三个方框，两个箭头，一下子就看得出这是一篇完整的博士论文了。"
- en: "You end up with fourteen boxes and arrows in every direction. It looks like a subway map."
  zh: "你最后画出了十四个方框，箭头指向四面八方，看起来像一张地铁线路图。"
- en: "Leave the odd paper out"
  zh: "把不合群的那篇拿掉"
- en: "Two papers tell a clean story; the third becomes an appendix. It stings a little."
  zh: "两篇论文讲了一个干净的故事，第三篇成了附录。有点心疼。"
- en: "Five Calendars"
  zh: "五个日历"
- en: "You need one two-hour slot when five busy people are all free. The scheduling poll comes back with a single green cell: a Friday at 7:30 am."
  zh: "你需要找一个五位大忙人都有空的两小时时段。时间投票结果出来，只有一个绿格子：周五早上 7:30。"
- en: "Book the 7:30 am slot"
  zh: "订下早上 7:30"
- en: "You book it before anyone changes their mind. Everyone will arrive with coffee and low expectations."
  zh: "你趁没人反悔赶紧订下。到时候每个人都会端着咖啡、不抱什么期望地出现。"
- en: "Ask one member to move a meeting"
  zh: "请一位委员挪个会"
- en: "They move a meeting, and you get a civilized 2 pm slot."
  zh: "对方挪了个会，你拿到了一个像样的下午 2 点。"
- en: "They can't. Meanwhile someone else books Friday, and the poll now has zero green cells."
  zh: "对方挪不开。与此同时，周五被别人占了，投票表上一个绿格子都不剩了。"
- en: "Ask {advisor} to wrangle them"
  zh: "请 {advisor}出面协调"
- en: "{advisor} sends one email. Four replies arrive within the hour, all saying yes."
  zh: "{advisor}发了一封邮件。一小时内来了四封回复，全是“可以”。"
- en: "{advisor} replies-all with their own availability, which is also only Friday at 7:30 am."
  zh: "{advisor}点了“全部回复”，附上自己的空闲时间：也只有周五早上 7:30。"
- en: "Margins, Again"
  zh: "又是页边距"
- en: "The graduate school rejects your thesis formatting for the fourth time. This round: page numbers on landscape pages are 0.1 inches too low."
  zh: "研究生院第四次打回你的论文格式。这次的理由：横向页面的页码低了 0.1 英寸。"
- en: "Fix exactly what they asked"
  zh: "照他们说的改"
- en: "You move the page numbers. Approval comes back with a new note about table caption fonts."
  zh: "你挪了页码。批复回来了，附带一条关于表题字体的新意见。"
- en: "Switch to the official template"
  zh: "换成官方模板"
- en: "The template compiles on the first try. The office approves it the same day."
  zh: "模板一次就编译通过。办公室当天就批了。"
- en: "The template breaks every figure. You spend two days putting them back."
  zh: "模板把每张图都弄乱了。你花了两天把它们一张张弄回去。"
- en: "Visit the formatting office in person"
  zh: "亲自去格式审核办公室"
- en: "The office is open Tuesdays from 10 to 11. The reviewer fixes everything with you in ten minutes, three rounds too late."
  zh: "办公室每周二 10 点到 11 点开门。审核老师当面十分钟就帮你全改好了，可惜晚了三轮。"
- en: "Just One More Chapter"
  zh: "就再加一章"
- en: "{committee} reads your draft and suggests \"just one more chapter\" on future directions. Your defense is a few weeks away."
  zh: "{committee}读了你的草稿，建议“就再加一章”讲未来方向。离答辩只剩几周了。"
- en: "Write the chapter"
  zh: "写这一章"
- en: "You write twenty pages in ten days. It is actually good, and you are actually tired."
  zh: "你十天写了二十页。确实写得不错，你也确实累坏了。"
- en: "Negotiate a shorter section"
  zh: "争取写短一点"
- en: "You propose a focused five-page section instead. {committee} agrees and seems impressed by the pitch."
  zh: "你提议改成一个聚焦的五页小节。{committee}同意了，似乎还挺欣赏你这番说辞。"
- en: "{committee} agrees to something shorter. Their idea of shorter is 18 pages."
  zh: "{committee}同意写短一点。所谓短一点，是 18 页。"
- en: "Ask {advisor} to weigh in"
  zh: "请 {advisor}表个态"
- en: "{advisor} suggests a closing slide on future work instead, and {committee} agrees."
  zh: "{advisor}建议改成在结尾放一页讲未来工作的幻灯片，{committee}同意了。"
- en: "{advisor} loves the idea. Now two people want the chapter."
  zh: "{advisor}很喜欢这个主意。现在有两个人想要这一章了。"
- en: "Still Under Review"
  zh: "仍在审稿中"
- en: "{paper} is still under review at {venue}. The decision is due in the middle of your defense prep, and your defense date depends on it."
  zh: "{paper} 还在 {venue} 审稿中。结果要在你准备答辩的中途才出来，而你的答辩日期就取决于它。"
- en: "Refresh the portal every hour"
  zh: "每小时刷新一次投稿系统"
- en: "The portal does not change. Your stress level does."
  zh: "页面毫无变化。你的压力值倒是一直在变。"
- en: "Write the thesis as if it's accepted"
  zh: "就当它中了，照写"
- en: "The last chapter assumes the best. Writing it calms you more than refreshing ever did."
  zh: "最后一章按最好的情况来写。比起刷新页面，写这一章让你平静多了。"
- en: "Plan a backup with {advisor}"
  zh: "和 {advisor}商量备选方案"
- en: "You map out what happens if it's rejected. It isn't fun, but you sleep better, and {advisor} seems reassured too."
  zh: "你把被拒之后怎么办都列了出来。过程不太愉快，但你睡得踏实多了，{advisor}看起来也安心了。"
- en: "Slide 2"
  zh: "第 2 页"
- en: "Your defense begins. Slide 2 is on the big screen, and \"Dissertation\" is spelled \"Dissertaiton\". Everyone has seen it."
  zh: "答辩开始了。大屏幕上是第 2 页幻灯片，“Dissertation”被拼成了“Dissertaiton”。所有人都看见了。"
- en: "Laugh it off and keep going"
  zh: "一笑而过，接着讲"
- en: "\"Clearly it needed one more revision.\" The room laughs, and the tension is gone."
  zh: "“看来它还需要再修改一轮。”全场笑了，紧张感一扫而空。"
- en: "Your joke lands in silence. You click to slide 3 a little too fast."
  zh: "你的笑话换来一片沉默。你翻到第 3 页的速度有点太快了。"
- en: "Pause and fix it live"
  zh: "停下来当场改"
- en: "Fifteen seconds of typing in front of five professors feels like an hour. {committee} says, \"We've all done it.\""
  zh: "当着五位教授打字十五秒，感觉像过了一小时。{committee}说：“我们都犯过。”"
- en: "Pretend you didn't notice"
  zh: "假装没看见"
- en: "You forget about it by slide 4. Nobody mentions it, probably."
  zh: "讲到第 4 页你就忘了这事。没人提起，大概吧。"
- en: "You think about it for all 60 slides."
  zh: "整整 60 页幻灯片，你一直在想这件事。"
- en: "The Question You Prepared For"
  zh: "押中的题"
- en: "Ten minutes in, {committee} interrupts with exactly the question you spent all last week preparing for. You have a backup slide for it: slide 47."
  zh: "开讲十分钟，{committee}就打断了你，问的正是你上周花了一整周准备的那个问题。你为它准备了一页备用幻灯片：第 47 页。"
- en: "Jump to backup slide 47"
  zh: "跳到备用的第 47 页"
- en: "The slide appears, perfectly labeled. {committee} raises an eyebrow, impressed."
  zh: "幻灯片应声出现，标注得清清楚楚。{committee}挑了挑眉，颇为赞赏。"
- en: "Answer it from memory"
  zh: "凭记忆回答"
- en: "You answer without notes, point by point. The committee exchanges a look that means \"ready\"."
  zh: "你不看笔记，逐条作答。委员会的老师们交换了一个眼神，意思是“可以了”。"
- en: "You forget the third point, the best one. It is on slide 47."
  zh: "你忘了第三点，也是最好的一点。它就在第 47 页上。"
- en: "\"I'll come back to that at the end\""
  zh: "“这个我最后再回答”"
- en: "Now you have something to look forward to in the Q&A."
  zh: "现在你在问答环节有个盼头了。"
- en: "No Signal"
  zh: "无信号"
- en: "Five minutes before your defense, the projector says \"No Signal\". You have tried three adapters. The committee is arriving."
  zh: "离答辩还有五分钟，投影仪显示“无信号”。你已经试了三个转接头。委员会的老师们陆续到了。"
- en: "Present from the room's computer"
  zh: "用教室的电脑讲"
- en: "Your backup PDF on a USB stick works. The fonts are slightly off; everything else is fine."
  zh: "你 U 盘里的备份 PDF 能用。字体有点走样，其他都好。"
- en: "The room's computer wants to install 40 minutes of updates. You start late and flustered."
  zh: "教室的电脑要先装 40 分钟的更新。你开场晚了，还手忙脚乱。"
- en: "Send {labmate} for another adapter"
  zh: "让 {labmate} 去找个转接头"
- en: "{labmate} sprints across the building and returns, out of breath, with the right one. You owe them lunch."
  zh: "{labmate} 冲过整栋楼，气喘吁吁地拿着对的那个回来了。你欠人家一顿午饭。"
- en: "Give the talk at the whiteboard"
  zh: "改在白板上讲"
- en: "You explain five years of research with one marker. The committee calls it the clearest talk they've seen all year."
  zh: "你用一支马克笔讲完了五年的研究。委员会说这是他们今年听过最清楚的报告。"
- en: "You draw Figure 3 from memory. It is not Figure 3."
  zh: "你凭记忆画了图 3。画出来的不是图 3。"
- en: "You're Frozen"
  zh: "你卡了"
- en: "{committee} joins your defense by video from a conference hotel. Their picture freezes every few minutes, always mid-question, mouth open."
  zh: "{committee}在会议酒店里视频参加你的答辩。画面每隔几分钟就卡住，而且总卡在问题问到一半、嘴还张着的时候。"
- en: "Repeat every answer twice"
  zh: "每个回答说两遍"
- en: "They hear everything because you say everything twice. Your voice gives out right before the last slide."
  zh: "你每句话都说两遍，对方一句没漏。就在最后一页之前，你的嗓子哑了。"
- en: "Suggest they switch to audio only"
  zh: "建议对方只开音频"
- en: "With audio only, everything works. {committee} thanks you for the fix."
  zh: "只开音频，一切顺畅。{committee}谢谢你想出这个办法。"
- en: "They turn off video and unmute a hotel lobby. Everyone hears a suitcase."
  zh: "对方关了视频，一取消静音，酒店大堂的声音全涌了进来。所有人都听见了行李箱的轱辘声。"
- en: "Let {advisor} relay their questions"
  zh: "让 {advisor}代为转述提问"
- en: "{committee} types questions into the chat, and {advisor} reads them aloud. It's slow, but nothing freezes."
  zh: "{committee}把问题打在聊天框里，{advisor}念出来。很慢，但再没卡过。"
- en: "Congratulations, Doctor"
  zh: "恭喜你，博士"
- en: "Between \"Congratulations, Doctor\" and commencement sit 14 pages of minor revisions. The graduate school's filing deadline is this Friday."
  zh: "从“恭喜你，博士”到毕业典礼之间，隔着 14 页小修意见。研究生院的提交截止日期就在这周五。"
- en: "Address all 14 pages properly"
  zh: "认真改完全部 14 页"
- en: "You answer every comment and fix every figure. The final thesis is the best version of your work."
  zh: "你回复了每一条意见，改好了每一张图。最终版论文是你这些工作最好的样子。"
- en: "Fix what matters, explain the rest"
  zh: "改要紧的，其余做解释"
- en: "Your response letter is so clear that the committee signs off in a day."
  zh: "你的回复信写得清清楚楚，委员会一天就签字了。"
- en: "{committee} replies: \"Please address all comments.\" All 14 pages it is."
  zh: "{committee}回复：“请回应所有意见。”那就 14 页全改吧。"
- en: "Recruit {labmate} to proofread with you"
  zh: "拉 {labmate} 一起校对"
- en: "The two of you spend a weekend on it, with a lot of snacks. You file on Thursday, a day early."
  zh: "你们俩花了一个周末，吃掉了很多零食。你周四就提交了，提前一天。"
- en: "The Hood"
  zh: "垂布"
- en: "Commencement. In line to cross the stage, you notice the person behind you trying not to laugh. Your doctoral hood is on backwards."
  zh: "毕业典礼。排队上台时，你发现身后的人在憋笑。你的博士垂布戴反了。"
- en: "Cross the stage as you are"
  zh: "就这样上台"
- en: "Your family's favorite photo of the day, possibly of the decade. You wave like you meant it."
  zh: "这成了你家人当天最喜欢的照片，可能也是这十年里最喜欢的。你挥着手，就像是故意的。"
- en: "Ask the person behind you to fix it"
  zh: "请身后的人帮忙弄好"
- en: "They flip it around in five seconds. It turns out they did the same thing at their master's."
  zh: "对方五秒钟就帮你翻了过来。原来人家硕士毕业时也犯过同样的错。"
- en: "Get {labmate} to take a photo first"
  zh: "先让 {labmate} 拍张照"
- en: "\"For the lab chat,\" {labmate} says. It becomes the chat's icon for the next three years."
  zh: "“发组群用的。”{labmate} 说。接下来三年，这张照片一直是群头像。"
- en: "The Title Fight"
  zh: "题目之争"
- en: "You and {advisor} disagree about your thesis title. Yours is accurate and 19 words long. Theirs is four words, and one of them is \"Towards\"."
  zh: "你和 {advisor}对论文题目有分歧。你的题目很准确，长达 19 个词。导师的只有四个词，其中一个是“Towards”。"
- en: "Argue for your title"
  zh: "坚持自己的题目"
- en: "You explain what each word is doing, and {advisor} reads it twice and concedes. The title is yours, colon and all."
  zh: "你逐个解释每个词的作用，{advisor}读了两遍后让步了。题目归你，连冒号一起。"
- en: "Forty minutes on one word. You win nothing except a strong opinion about colons."
  zh: "为一个词争了四十分钟。你什么都没争到，只收获了一套关于冒号的坚定看法。"
- en: "Take theirs: \"Towards\" it is"
  zh: "听导师的，就用“Towards”"
- en: "{advisor} is pleased. You'll explain what it means at every talk for a year."
  zh: "{advisor}很满意。接下来一年，你每次做报告都得解释这个题目是什么意思。"
- en: "Poll the lab with both titles"
  zh: "让组里投票选题目"
- en: "The lab votes for a third title that nobody proposed. Somehow, you and {advisor} both like it."
  zh: "组里投票选出了第三个题目，谁都没提过。神奇的是，你和 {advisor}都喜欢。"
- en: "Satisfactory"
  zh: "合格"
- en: "Your annual review letter arrives. Progress: \"Satisfactory.\" Below it is one long paragraph that uses the word \"encourage\" four times."
  zh: "年度考核信到了。进展：“合格。”下面是一大段话，“鼓励”这个词用了四次。"
- en: "The annual review letter is in. The box says \"Satisfactory\". The comment says \"We encourage continued focus on publication\", a sentence with layers."
  zh: "年度考核信来了。勾选框写着“合格”，评语写着“鼓励继续专注于论文发表”，话里有话。"
- en: "Decode it with {senior}"
  zh: "找 {senior} 一起解读"
- en: "{senior} has read dozens of these. \"Encourage\" means \"submit something this year\". You leave with a plan."
  zh: "{senior} 读过几十封这种信。“鼓励”的意思是“今年得投点什么出去”。你带着计划离开了。"
- en: "{senior} reads it, frowns and says \"Huh.\" Now two people are worried."
  zh: "{senior} 读完皱起眉：“啊这。”现在有两个人担心了。"
- en: "Ask {advisor} what it really means"
  zh: "问 {advisor}到底什么意思"
- en: "\"Keep going, just faster.\" It's blunt and a little scary, but now you know what the paragraph meant."
  zh: "“继续做，只是要快一点。”话很直，也有点吓人，但现在你知道那段话是什么意思了。"
- en: "Decide Satisfactory is fine and file it"
  zh: "合格就行，归档了事"
- en: "You file the letter and get back to work. The paragraph stays unread, and so does whatever it meant."
  zh: "你把信归了档，回去干活。那段话你没读，它的言外之意也就没人领会。"
- en: "New Requirements"
  zh: "新规定"
- en: "The program updates its course requirements. Students admitted before the change are \"strongly encouraged\" to take the new methods course. You read that sentence three times, looking for a loophole."
  zh: "系里更新了课程要求。改革前入学的学生“强烈建议”选修新的方法课。你把这句话读了三遍，想找出漏洞。"
- en: "Take the course"
  zh: "去上这门课"
- en: "Ten weeks of problem sets. Week six exposes a flaw in your analysis that a reviewer would have found first."
  zh: "十周的习题。第六周的内容暴露出你分析里的一个漏洞，不然就该审稿人先发现了。"
- en: "Petition to keep the old rules"
  zh: "申请沿用旧规定"
- en: "Your petition is polite and quotes the handbook's own page numbers. Approved in a week."
  zh: "你的申请措辞客气，还引用了手册自己的页码。一周就批了。"
- en: "The petition goes to a committee that meets once a semester. You take the course while you wait."
  zh: "申请交给了一个每学期只开一次会的委员会。等结果的时候，你先把课上了。"
- en: "Ask {advisor} for an independent study"
  zh: "找 {advisor}开一门独立研究课"
- en: "{advisor} sets up an independent study that is mostly your own project. The program accepts it."
  zh: "{advisor}开了一门独立研究课，内容基本就是你自己的项目。系里也认了。"
- en: "{advisor} thinks the course would be good for you. Now the encouragement comes from two directions."
  zh: "{advisor}觉得这门课对你有好处。现在“鼓励”从两个方向同时传来。"
- en: "The Acknowledgments"
  zh: "致谢"
- en: "Chapter 3 took you a week. The acknowledgments have taken two, and you're on draft six. You keep remembering one more person who once fixed your code."
  zh: "第 3 章你写了一周。致谢写了两周，已经改到第六稿。你总能再想起一个曾经帮你修过代码的人。"
- en: "Thank everyone, by name"
  zh: "挨个点名致谢"
- en: "It runs to three pages. Your labmates find their names and pretend they didn't look, and your parents read it twice."
  zh: "洋洋洒洒写了三页。同门找到自己的名字，假装没看过，你爸妈读了两遍。"
- en: "Keep it to one honest paragraph"
  zh: "只写一段真心话"
- en: "It's done by lunch. You probably forgot someone, and they'll probably forgive you."
  zh: "午饭前就写完了。你多半漏了谁，对方多半也会原谅你。"
- en: "Add one joke for the lab"
  zh: "给组里埋一个梗"
- en: "One line about the coffee machine. Your committee skips it; your labmates will quote it for years."
  zh: "一句关于咖啡机的话。委员会直接跳过，同门会把它念叨好几年。"
- en: "The joke needs a footnote to explain it. You delete it at 2 am, along with an hour of sleep."
  zh: "这个梗得加个脚注才能看懂。凌晨 2 点你把它删了，顺带搭进去一小时睡眠。"
