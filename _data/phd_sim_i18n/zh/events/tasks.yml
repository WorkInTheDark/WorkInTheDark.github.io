# zh translations for events/tasks (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Every Author Reviews"
  zh: ""
- en: "This cycle, {venue} asks every author to review too. Right after you submit {paper}, five papers land in your queue, due in three weeks."
  zh: ""
- en: "Do all five properly"
  zh: ""
- en: "Five careful reviews. You learn more about what makes a paper land than your own last three submissions taught you."
  zh: ""
- en: "Do them fast"
  zh: ""
- en: "Five short reviews, on time. One is three sentences long. Somewhere, an area chair makes a note."
  zh: ""
- en: "Ask the chairs for a lighter load"
  zh: ""
- en: "The chairs cut you to two, since you're a student. You do both properly and keep your evenings."
  zh: ""
- en: "\"Every author reviews five.\" Now you have five reviews and one slightly awkward email thread."
  zh: ""
- en: "Could You Take a First Pass?"
  zh: ""
- en: "{advisor} forwards their own review assignment: \"Could you take a first pass on these four?\" The reviews are due in nine days."
  zh: ""
- en: "Write careful drafts"
  zh: ""
- en: "Four careful drafts. {advisor} submits them almost unchanged and says you have a good eye."
  zh: ""
- en: "Send short notes"
  zh: ""
- en: "Four sets of bullet points, done in an evening. {advisor} writes the reviews from them, with a small sigh."
  zh: ""
- en: "Ask to be listed as a sub-reviewer"
  zh: ""
- en: "{advisor} adds your name. The conference thanks you by email, and two area chairs now know who you are."
  zh: ""
- en: "Bidding Season"
  zh: ""
- en: "Reviewer bidding is open: {roll:1600-2000} abstracts, bids due Thursday. The site shows 25 at a time and logs you out every hour."
  zh: ""
- en: "Read titles for an evening"
  zh: ""
- en: "An evening of titles. You bid on eight papers you'd actually like to read, and spot two suspiciously close to yours."
  zh: ""
- en: "Bid \"eager\" on everything in your topic"
  zh: ""
- en: "Ten minutes of clicking. The system takes you at your word: you get your topic, and plenty of it."
  zh: ""
- en: "Skip bidding and accept your fate"
  zh: ""
- en: "Your evening is free. Fate assigns you a 40-page theory paper and one about crop yields."
  zh: ""
- en: "Too Short"
  zh: ""
- en: "The area chair writes: your review is \"too short to help the authors\". Could you expand it by Friday? It is four sentences. One is \"The paper is fine.\""
  zh: ""
- en: "Rewrite it properly"
  zh: ""
- en: "You reread the paper and write a real review. The area chair thanks you by name in the discussion."
  zh: ""
- en: "Add two paragraphs"
  zh: ""
- en: "Two paragraphs of \"the authors may wish to consider\". It meets the length. The area chair replies \"Thanks.\" with a period."
  zh: ""
- en: "Point out that the paper was short too"
  zh: ""
- en: "The area chair does not find this funny. You're left off next year's reviewer list, which you decide is a win."
  zh: ""
- en: "Three Pings"
  zh: ""
- en: "Discussion period. The area chair has pinged you three times about the authors' response. It is 2,400 words long and has its own table of contents."
  zh: ""
- en: "Read it and engage"
  zh: ""
- en: "The response is good, so you drop two of your three concerns. For once, the discussion goes somewhere."
  zh: ""
- en: "Raise your score"
  zh: ""
- en: "One click and the pings stop. You hope the response was as good as it was long."
  zh: ""
- en: "Reply \"I maintain my score\""
  zh: ""
- en: "Four words, sent. The area chair's next message to you is noticeably shorter than the first three."
  zh: ""
- en: "Eight Months Later"
  zh: ""
- en: "A journal sends the revised version of a paper you reviewed eight months ago, with a 30-page response to reviewers. You remember none of it."
  zh: ""
- en: "Reread both versions"
  zh: ""
- en: "A full day with both PDFs side by side. The revision is much better, and your second review says so in detail."
  zh: ""
- en: "Check only your old points"
  zh: ""
- en: "All six of your points are answered, more or less. You recommend acceptance in an evening and feel only slightly guilty."
  zh: ""
- en: "Decline politely"
  zh: ""
- en: "The editor replies within a minute. They'll find someone new, who will ask for everything you already asked for."
  zh: ""
- en: "Question 3"
  zh: ""
- en: "Halfway through grading, you notice the answer key is wrong on question 3. You have already graded {roll:50-70} exams with it."
  zh: ""
- en: "Regrade everything"
  zh: ""
- en: "You regrade every exam. Not one regrade request arrives, and the professor asks for you as TA next year."
  zh: ""
- en: "Accept both answers"
  zh: ""
- en: "Everyone gets the points. The class average goes up, and so do the regrade requests on question 4."
  zh: ""
- en: "Tell the professor and let them decide"
  zh: ""
- en: "The professor thanks you and drops question 3 entirely. You spend a long evening redoing every total."
  zh: ""
- en: "Everyone Did 40%"
  zh: ""
- en: "Group peer evaluations are in. Every member of every group says they did 40% of the work. One group of four adds up to 160%."
  zh: ""
- en: "Read the commit histories"
  zh: ""
- en: "A day in the git logs. They tell a clearer story, including one 3 am commit titled \"fixed everyone's stuff\"."
  zh: ""
- en: "Give each group one grade"
  zh: ""
- en: "Three students email to say it's unfair, and each of them is a little bit right."
  zh: ""
- en: "Meet the three most confusing groups"
  zh: ""
- en: "Three meetings, three versions of every story. By the third, you could referee anything."
  zh: ""
- en: "Hard but Fair"
  zh: ""
- en: "The professor asks you to write the midterm. \"Just two questions. Hard but fair.\" The exam is in nine days."
  zh: ""
- en: "Write new questions"
  zh: ""
- en: "Two new questions, each solved three ways. You understand the material better than when you took the course."
  zh: ""
- en: "Adapt last year's"
  zh: ""
- en: "You change the numbers and the variable names. One student finishes in twelve minutes; their roommate took the course last year."
  zh: ""
- en: "Borrow from the textbook"
  zh: ""
- en: "Done in an hour. Eleven students recognize problem 4.7, the average is 96%, and the professor asks you to write a makeup."
  zh: ""
- en: "8 am, Saturday"
  zh: ""
- en: "You're proctoring the 8 am Saturday final: 140 students in a silent gym for three hours, under a wall clock that runs four minutes fast."
  zh: ""
- en: "Proctor and grade in the room"
  zh: ""
- en: "You grade forty exams between whispered questions about question 2. That's a day of grading you won't have to do later."
  zh: ""
- en: "Swap with another TA"
  zh: ""
- en: "They take your Saturday. You take their Monday review session, and they've already told the students you're great."
  zh: ""
- en: "Bring coffee for the whole room"
  zh: ""
- en: "You wheel in 140 coffees, and it's the calmest final you've ever seen. Several students write \"thanks for the coffee\" on their exams."
  zh: ""
- en: "Moving Day"
  zh: ""
- en: "The course switches to a new website mid-semester. Someone has to move fourteen weeks of slides, quizzes and due dates. You are someone."
  zh: ""
- en: "Do it carefully"
  zh: ""
- en: "It takes a full day of copying and checking. Every due date is right, and no student will ever notice."
  zh: ""
- en: "Move only what's due this month"
  zh: ""
- en: "Done by dinner. Next month you'll do it again, with less memory of how."
  zh: ""
- en: "Write a script for it"
  zh: ""
- en: "Your script moves everything in eleven minutes. You spend the rest of the day showing it to people."
  zh: ""
- en: "The script moves everything and sets every due date to January 1, 1970. You fix them by hand."
  zh: ""
- en: "As an AI Language Model"
  zh: ""
- en: "A student's essay begins with the words \"As an AI language model\". The rest is very confident and about a different book."
  zh: ""
- en: "Fill in the six-page integrity form"
  zh: ""
- en: "The form takes six pages and a flowchart. The professor is impressed, and the office asks you to redo it on a newer template."
  zh: ""
- en: "Talk to the student first"
  zh: ""
- en: "They turn red and rewrite it by Friday. The new essay is messier, and clearly theirs."
  zh: ""
- en: "Forward it to the professor"
  zh: ""
- en: "The professor takes it from here, with a sigh you can hear through email."
  zh: ""
- en: "A Letter From Their TA"
  zh: ""
- en: "A student from your section asks you for a recommendation letter for a summer research program. It's due in a week. You remember their name, and that they sat by the window."
  zh: ""
- en: "Write a warm, specific letter"
  zh: ""
- en: "You dig up their assignments and office-hours questions. The letter is specific and kind, and in April they get in."
  zh: ""
- en: "Offer a short one"
  zh: ""
- en: "Three honest sentences. They thank you politely and ask the professor too, just in case."
  zh: ""
- en: "Suggest they ask the professor"
  zh: ""
- en: "They do. The professor agrees, then asks you for \"a few notes on the student\". You write the notes."
  zh: ""
- en: "You're Up in an Hour"
  zh: ""
- en: "Today's lab meeting presenter cancels. {advisor} messages: \"{player}, could you present instead?\" Lab meeting is in an hour."
  zh: ""
- en: "Show your messy results honestly"
  zh: ""
- en: "Half the plots have no axis labels. The lab spots a bug you'd have found in three weeks, and {advisor} likes the honesty."
  zh: ""
- en: "Present a paper you read last week"
  zh: ""
- en: "You remember most of it. For the parts you don't, {labmate} jumps in, kindly."
  zh: ""
- en: "Run a brainstorm instead"
  zh: ""
- en: "A wall of sticky notes produces one good idea. Nobody notices you prepared nothing, except {advisor}."
  zh: ""
- en: "One Slide, Two Hours"
  zh: ""
- en: "The department open house for admitted students needs one slide about your research, in two hours. The required template is purple."
  zh: ""
- en: "Make one clean slide"
  zh: ""
- en: "You use one figure and one sentence. It's the best slide you've ever made, and it takes the whole afternoon."
  zh: ""
- en: "Reuse your last title slide"
  zh: ""
- en: "It shows your name and last year's date. An admitted student asks what your research is about, and the slide does not say."
  zh: ""
- en: "Use one striking figure, no words"
  zh: ""
- en: "Admitted students crowd around it, asking what it means. You explain it eleven times, happily."
  zh: ""
- en: "Admitted students crowd around it, asking what it means. So does {advisor}."
  zh: ""
- en: "The Dean's Tour"
  zh: ""
- en: "The dean tours the building tomorrow, and {advisor} has promised a live demo of {project}. It has not run since Tuesday."
  zh: ""
- en: "Polish it tonight"
  zh: ""
- en: "It runs, and the dean says \"fascinating\" twice. You got three hours of sleep."
  zh: ""
- en: "Record a backup video"
  zh: ""
- en: "The live demo crashes in the first minute. The video plays perfectly, and the dean never knows."
  zh: ""
- en: "Show slides instead"
  zh: ""
- en: "The dean nods politely and asks to see \"the real thing\" next time. {advisor} winces."
  zh: ""
- en: "Your Two Buddies"
  zh: ""
- en: "The department assigns you two first-year \"buddies\". They message you about the cluster every day, often at the same time, about different errors."
  zh: ""
- en: "Hold a weekly Q&A"
  zh: ""
- en: "Thursdays at 4, with snacks. By week three, first-years you've never met start showing up."
  zh: ""
- en: "Answer every message"
  zh: ""
- en: "You reply within minutes, every time, and they adore you. Your own jobs sit in the queue, untouched."
  zh: ""
- en: "Point them to the docs"
  zh: ""
- en: "There are no docs. They find this out on their own, and stop asking you anything, including to lunch."
  zh: ""
- en: "The Eleventh Time"
  zh: ""
- en: "Eleven people asked you the same cluster question this month. Three of them were the same person."
  zh: ""
- en: "Write the onboarding doc"
  zh: ""
- en: "It takes a full day and twelve screenshots. The questions stop, and the lab treats you like a hero."
  zh: ""
- en: "Record a ten-minute video"
  zh: ""
- en: "Four takes. People watch it at double speed and still ask you, but less often."
  zh: ""
- en: "Pin your best Slack answer"
  zh: ""
- en: "Nobody reads pinned messages. Questions twelve through fifteen arrive by Friday."
  zh: ""
- en: "Only You Know"
  zh: ""
- en: "A new postdoc needs access to the data server, and only you know how the permissions work. You set them up two years ago, at night, and wrote nothing down."
  zh: ""
- en: "Walk them through it"
  zh: ""
- en: "A day of user groups and one mysterious file called keys_old. They're in, and they owe you lunch."
  zh: ""
- en: "Write it down this time"
  zh: ""
- en: "It takes longer than just doing it. But the next person won't need you, and neither will future you."
  zh: ""
- en: "Send them to IT"
  zh: ""
- en: "IT opens a ticket. The ticket opens another ticket. The postdoc gets access in three weeks and remembers who sent them."
  zh: ""
- en: "Three High Schoolers"
  zh: ""
- en: "A summer outreach program sends you three high schoolers for a week. They're thrilled to be here, and one of them has already read your paper."
  zh: ""
- en: "Give them a mini project"
  zh: ""
- en: "By Friday they've built a tiny classifier and a slide deck with spinning transitions. You're prouder than you expected."
  zh: ""
- en: "Let them test your prototype"
  zh: ""
- en: "They break it four new ways in one afternoon, which is free user testing."
  zh: ""
- en: "Show them lab life, snacks included"
  zh: ""
- en: "You give them a tour and a lot of snacks. One of them decides grad school looks \"chill\", and you don't correct them."
  zh: ""
- en: "A Photo of a Receipt"
  zh: ""
- en: "Your travel reimbursement is rejected. The receipt is a photo of a receipt, in another currency, partly covered by your thumb."
  zh: ""
- en: "Find the original"
  zh: ""
- en: "You empty every bag you own and find it folded inside your boarding pass. Approved in a week."
  zh: ""
- en: "Fill in the \"missing receipt\" form"
  zh: ""
- en: "The form is four pages long and includes a signed statement about a sandwich. Approved in six weeks."
  zh: ""
- en: "Let the $43 go"
  zh: ""
- en: "No more forms. It's instant noodles for the rest of the week."
  zh: ""
- en: "Eight Modules by Friday"
  zh: ""
- en: "The annual research-ethics refresher is due Friday: eight modules with quizzes, or your study approval is paused."
  zh: ""
- en: "Do it properly"
  zh: ""
- en: "You get the certificate and learn two things you probably should have known already."
  zh: ""
- en: "Click through at double speed"
  zh: ""
- en: "All eight quizzes passed at double speed. The narrator sounded like a chipmunk, but a well-informed one."
  zh: ""
- en: "You fail the module 6 quiz three times, then rewatch it twice at normal speed."
  zh: ""
- en: "Do it during lab meeting"
  zh: ""
- en: "You pass all eight modules. {advisor} asks you a question twice and gets no answer either time."
  zh: ""
- en: "In Ink"
  zh: ""
- en: "Your plan-of-study form needs {advisor}'s signature, in ink, by the 15th. {advisor} is traveling for the next two weeks."
  zh: ""
- en: "Mail it to their hotel"
  zh: ""
- en: "It comes back signed, with a coffee ring and a doodle of the hotel pool. You refreshed the tracking page forty times."
  zh: ""
- en: "Ask the grad office about e-signatures"
  zh: ""
- en: "The office says e-signatures have been fine for years. Nobody told the form, but it's done in an hour."
  zh: ""
- en: "Three emails later: e-signatures are accepted on every form except this one."
  zh: ""
- en: "Wait for them to come back"
  zh: ""
- en: "You file it two weeks late. The grad office sends a reminder with three exclamation marks and puts a hold on your registration."
  zh: ""
- en: "Nobody's Monitors"
  zh: ""
- en: "Equipment inventory: every monitor in the lab needs a tag. You find three that belong to nobody, according to every list you check."
  zh: ""
- en: "Report them"
  zh: ""
- en: "Two forms and a call with Facilities. The department thanks {advisor} for the lab's \"exemplary\" inventory."
  zh: ""
- en: "Adopt one as your second screen"
  zh: ""
- en: "Papers on the left, code on the right. {labmate} had been eyeing that monitor for a year."
  zh: ""
- en: "Tag them to the lab and move on"
  zh: ""
- en: "Three stickers later, the lab officially owns three monitors nobody can explain."
  zh: ""
- en: "Your Plan Expires Friday"
  zh: ""
- en: "Your survey tool's subscription ends on Friday, in the middle of the study for {project}. The renewal email says \"Act now!\" in three colors."
  zh: ""
- en: "Pay out of pocket"
  zh: ""
- en: "$240, and the study runs on. You file for reimbursement and try not to think about how that will go."
  zh: ""
- en: "Move to the university's free tool"
  zh: ""
- en: "A day rebuilding every question in an interface from another decade. The data comes out in a slightly different format."
  zh: ""
- en: "Ask the department for funds"
  zh: ""
- en: "The department covers it from a fund nobody knew existed. You make a note of the fund."
  zh: ""
- en: "The reply arrives after the subscription ends. The study pauses for two weeks."
  zh: ""
- en: "Forty Signatures"
  zh: ""
- en: "Finance needs a signed receipt for each of the 40 gift cards you gave participants in {project}. The participants are now all over the country."
  zh: ""
- en: "Email all 40"
  zh: ""
- en: "Forty emails, then forty reminders. By Friday you have 34 signatures and six people who think it's a scam."
  zh: ""
- en: "Build a sign-off form"
  zh: ""
- en: "You build a two-minute form with a signature box, and 38 people sign within a day. You will reuse it forever."
  zh: ""
- en: "The form works, but its emails go straight to spam. You find out a week later."
  zh: ""
- en: "Ask for an exception"
  zh: ""
- en: "Finance approves it, after a two-page memo and a meeting {advisor} has to attend. {advisor} is not thrilled."
  zh: ""
- en: "Numbers You Never Tracked"
  zh: ""
- en: "The IRB's annual check-in for {project} is due in a week. It asks how many people you enrolled each month. You never tracked that."
  zh: ""
- en: "Rebuild them from your calendar"
  zh: ""
- en: "A day with your calendar and old emails. The numbers are exact, and you find two sessions you forgot to analyze."
  zh: ""
- en: "Estimate honestly and say so"
  zh: ""
- en: "\"About 30, exact months unclear.\" The IRB accepts it, with a polite request to keep a log from now on."
  zh: ""
- en: "Ask for a week's extension"
  zh: ""
- en: "Granted. The new due date lands in your busiest week, and the numbers are still untracked."
  zh: ""
- en: "Approved Servers Only"
  zh: ""
- en: "A new data policy: all study data must move to the approved server by Friday. Yours lives on four machines, two drives and a laptop you stopped using."
  zh: ""
- en: "Move it carefully"
  zh: ""
- en: "A day of copying and checking. For the first time since Year 1, all your data is in one place."
  zh: ""
- en: "Move it and hope the paths still work"
  zh: ""
- en: "Moved by noon, and every path still works. You don't trust it, but it works."
  zh: ""
- en: "Moved by noon. By Wednesday, every script you own fails with \"file not found\"."
  zh: ""
- en: "Ask for an extension"
  zh: ""
- en: "Granted, until the end of the month. The data office copies {advisor} on its reply."
  zh: ""
- en: "You Know Your Work Best"
  zh: ""
- en: "{advisor} asks you to draft your own recommendation letter. \"You know your work best.\" You have never once called yourself \"exceptional\"."
  zh: ""
- en: "Write it honestly"
  zh: ""
- en: "Your draft is accurate and a bit modest. {advisor} adds two sentences that make you blush."
  zh: ""
- en: "Write it boldly"
  zh: ""
- en: "\"Among the top 1% of students I have known.\" {advisor} tones it down to 5%, still the nicest thing anyone has said about you."
  zh: ""
- en: "Swap drafting duty with {labmate}"
  zh: ""
- en: "You write theirs; they write yours. Both letters glow, and {advisor} notices they share every adjective."
  zh: ""
- en: "A Supporting Note"
  zh: ""
- en: "{mentee} is applying to grad school and asks you for a \"supporting note\" that {advisor} can use in their letter. It's due in five days."
  zh: ""
- en: "Write a detailed note"
  zh: ""
- en: "Two pages on everything {mentee} did. {advisor} uses half of it word for word."
  zh: ""
- en: "Send bullet points"
  zh: ""
- en: "Five bullet points. {advisor} follows up with three questions, each in its own email."
  zh: ""
- en: "Help them ask {advisor} directly"
  zh: ""
- en: "{mentee} asks {advisor} themselves, nervously. It's good practice, and you can tell they hoped you'd do it."
  zh: ""
- en: "Three Signatures"
  zh: ""
- en: "The annual progress report needs a committee meeting and three signatures by the end of the month. Your committee has three calendars and no overlap."
  zh: ""
- en: "Get everyone in one room"
  zh: ""
- en: "It takes eleven emails and a 7:30 am slot. The meeting turns out to be useful, and {committee} has a great idea for your next project."
  zh: ""
- en: "Collect signatures by email"
  zh: ""
- en: "Three signatures in three weeks, plus one reply that just says \"signed (where?)\"."
  zh: ""
- en: "Ask the grad office for more time"
  zh: ""
- en: "They give you another month. The report moves onto next month's to-do list, and so does the dread."
  zh: ""
- en: "Nine Goals"
  zh: ""
- en: "The progress report asks you to compare last year's goals with what happened. You set nine goals. You met two, and did seven other things."
  zh: ""
- en: "Report it straight"
  zh: ""
- en: "Two met, seven changed, each with a reason. {advisor} appreciates the honesty and suggests fewer goals, chosen better."
  zh: ""
- en: "Turn the seven into a story"
  zh: ""
- en: "Read in order, the seven other things look like a plan. You almost believe it yourself."
  zh: ""
- en: "{committee} asks how goal 4 led to project 7. It didn't, and now everyone knows."
  zh: ""
- en: "Edit last year's goals to match"
  zh: ""
- en: "Last year's goals now describe this year perfectly. {advisor} still has the original and says nothing."
  zh: ""
- en: "Expected Graduation"
  zh: ""
- en: "A form asks for your expected graduation date. You and {advisor} fill in your parts separately, and write different years."
  zh: ""
- en: "Talk it through"
  zh: ""
- en: "After an hour on the next two years, you leave with a plan and a date. Your heart beats a little faster."
  zh: ""
- en: "Use your advisor's year"
  zh: ""
- en: "You write the later year. Now it's on an official form, which makes it feel very real."
  zh: ""
- en: "Write a range"
  zh: ""
- en: "\"Spring or fall, this year or next.\" The grad office accepts it. {advisor} raises an eyebrow."
  zh: ""
- en: "Just a Few Calls"
  zh: ""
- en: "A friend from another lab asks you to co-organize a workshop at next year's conference. \"It'll be fun! Just a few calls.\""
  zh: ""
- en: "Say yes"
  zh: ""
- en: "It is many calls, plus a call for papers and a keynote speaker who replies once a month. Everyone learns your name."
  zh: ""
- en: "Offer to run just the website"
  zh: ""
- en: "The site takes one evening. Your name goes on the organizer list anyway."
  zh: ""
- en: "Decline kindly"
  zh: ""
- en: "Your friend understands and asks someone else. Next year you see the workshop on the program, a little wistfully."
  zh: ""
- en: "By 5 pm"
  zh: ""
- en: "The university press office needs a quote about chatbots in hospitals by 5 pm. It's 3:40. They found you by searching the website for \"chatbot\"."
  zh: ""
- en: "Write a careful two-sentence quote"
  zh: ""
- en: "Forty minutes for two sentences. They print it with your name spelled right, and your aunt shares it with everyone."
  zh: ""
- en: "Pass it to {advisor}"
  zh: ""
- en: "{advisor} gives the quote from a hallway at 4:55, slightly out of breath, and mentions \"my student's work\"."
  zh: ""
- en: "Send them your abstract"
  zh: ""
- en: "They print one sentence of it: \"We leverage a novel multi-stage framework.\" Nobody learns what you do."
  zh: ""
- en: "For Readability"
  zh: ""
- en: "A stranger opens a pull request on your paper's code. It rewrites everything \"for readability\": 212 files changed, every variable renamed."
  zh: ""
- en: "Review it line by line"
  zh: ""
- en: "A day of diffs. Two of their changes really are better, so you keep those. They star the repo anyway."
  zh: ""
- en: "Merge it and hope"
  zh: ""
- en: "Everything still runs, a little faster. You feel lucky and slightly uneasy."
  zh: ""
- en: "Everything breaks. Three issues titled \"nothing works\" arrive before lunch."
  zh: ""
- en: "Thank them and close it"
  zh: ""
- en: "A polite note and one click. They reply with a long essay on code style. You don't read it."
  zh: ""
- en: "The Reproducibility Badge"
  zh: ""
- en: "{venue} offers a reproducibility badge for {paper} if its code runs in a container by next week. Right now it runs on your laptop, on a good day."
  zh: ""
- en: "Containerize it"
  zh: ""
- en: "After three days of dependency fights, it builds. The badge is small and orange, and you love it."
  zh: ""
- en: "Skip the badge"
  zh: ""
- en: "No badge, and the week is yours. Months later, someone emails to ask whether the code runs. It does not."
  zh: ""
- en: "Ask {labmate} for help"
  zh: ""
- en: "{labmate} knows containers and has it working in an afternoon. You owe them, and they've already named the favor."
  zh: ""
- en: "In Plain Words"
  zh: ""
- en: "The proceedings want a 150-word plain-language summary of {paper}. Your first draft says \"leverage\" four times and \"novel\" twice."
  zh: ""
- en: "Write it properly"
  zh: ""
- en: "Three drafts later, it says what you did and why it matters, with no leveraging at all. It may be the best paragraph you write this year."
  zh: ""
- en: "Ask a non-academic friend to read it"
  zh: ""
- en: "Your friend reads it twice and asks, \"So it's a chatbot?\" You rewrite it around that question, and it's much better."
  zh: ""
- en: "Simplify the abstract and send it"
  zh: ""
- en: "You delete every third word of the abstract. It's 150 words, and still only your reviewers could follow it."
  zh: ""
- en: "Take 14"
  zh: ""
- en: "{venue} accepts an optional video figure for {project}. Your narration is on take 14. On take 13, the radiator joined in."
  zh: ""
- en: "Finish it properly"
  zh: ""
- en: "Take 22 is the one, and it's under three minutes. Your work has never sounded this good."
  zh: ""
- en: "Record the screen, add captions"
  zh: ""
- en: "The video is all captions and a slow, confident cursor. It's clear and only slightly eerie."
  zh: ""
- en: "Skip it"
  zh: ""
- en: "It's optional. You close the recorder and go to sleep. Most papers don't have one either."
  zh: ""
