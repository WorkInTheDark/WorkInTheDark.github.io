# zh translations for events/conference (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Who Are You Again?"
  zh: "胸牌上这人是谁"
- en: "The registration desk prints your badge. Your name is misspelled, your university is a different university, and the lanyard color says SPONSOR."
  zh: "注册台给你打印了胸牌。名字拼错了，学校印成了另一所，挂绳的颜色还表明你是赞助商。"
- en: "Get it reprinted"
  zh: "去重新打印"
- en: "The line for reprints is forty minutes long. You meet three people in it, all with wrong badges."
  zh: "重印的队排了四十分钟。你在队里认识了三个人，胸牌全都印错了。"
- en: "Keep it. It's a conversation starter"
  zh: "留着吧，正好当开场白"
- en: "All week, people ask about your sponsorship deal. You make up a new answer each time."
  zh: "一整周都有人问你拉赞助的事。你每次都编个新答案。"
- en: "Fix it with a pen"
  zh: "拿笔改一下"
- en: "Your handwritten correction is readable from up close. Nobody gets that close."
  zh: "你手写的更正得凑近了才看得清。没人会凑那么近。"
- en: "By the Cheese Table"
  zh: "奶酪桌旁"
- en: "At the welcome reception, {prof}, whose textbook you learned from, is standing alone by the cheese table, looking at their phone."
  zh: "欢迎酒会上，{prof}独自站在奶酪桌旁看手机。你当年就是读对方写的教材入门的。"
- en: "Go say hello"
  zh: "过去打个招呼"
- en: "{prof} is delighted to talk about something other than the textbook. Twenty minutes later: \"Find me at the party. I want to hear the rest,\" {prof} says."
  zh: "{prof}很高兴能聊点教材以外的话题。二十分钟后，{prof}说：“派对上来找我。后面的我还想接着听。”"
- en: "You tell {prof} you love the textbook. {prof} says thank you. Then neither of you says anything for a very long time."
  zh: "你对 {prof}说你很喜欢那本教材。{prof}说了声谢谢。然后你们俩很久很久都没再开口。"
- en: "Admire from a safe distance"
  zh: "远远地仰望"
- en: "Someone else walks over, and they're laughing within a minute. Next year, you tell yourself."
  zh: "另一个人走了过去，不到一分钟就聊得哈哈大笑。明年吧，你对自己说。"
- en: "Send {labmate} over first"
  zh: "先派 {labmate} 过去"
- en: "{labmate} walks over without hesitating, then waves you in. Five minutes later you're both invited to {prof}'s lab dinner."
  zh: "{labmate} 毫不犹豫地走过去，然后招手叫你过来。五分钟后，你们俩都被请去参加 {prof}组里的晚饭。"
- en: "The Shared Room"
  zh: "合住的房间"
- en: "To save money, you're sharing a hotel room with {labmate}. At 1 am you learn that {labmate} snores like a leaf blower."
  zh: "为了省钱，你和 {labmate} 合住一间酒店房间。凌晨 1 点你才发现，{labmate} 打呼噜像吹叶机。"
- en: "Earplugs and hope"
  zh: "戴上耳塞，听天由命"
- en: "You sleep. More or less."
  zh: "你睡着了。差不多吧。"
- en: "You count snores until 4 am. You reach three thousand."
  zh: "你数呼噜数到凌晨 4 点，数到了三千。"
- en: "Sleep in the bathtub"
  zh: "去浴缸里睡"
- en: "It's surprisingly quiet. Also surprisingly hard. {labmate} finds you there in the morning and laughs for a full minute."
  zh: "出奇地安静，也出奇地硌人。第二天早上 {labmate} 发现你睡在浴缸里，笑了足足一分钟。"
- en: "Book your own room for one night"
  zh: "自己再订一晚单间"
- en: "It costs a week of groceries. You sleep like a baby."
  zh: "花掉了一周的伙食费。你睡得像个婴儿。"
- en: "The 3 am Lobby"
  zh: "凌晨 3 点的大堂"
- en: "It's 3 am, and the hotel lobby is full of wide-awake researchers on the wrong time zone, all pretending to answer email."
  zh: "凌晨 3 点，酒店大堂里坐满了倒不过时差、精神抖擞的研究者，个个假装在回邮件。"
- en: "Join them"
  zh: "加入他们"
- en: "By 4 am you've met a postdoc from Seoul and a professor from Lisbon, and sketched a joint project on a napkin."
  zh: "到 4 点，你已经认识了一位首尔来的博士后和一位里斯本来的教授，还在餐巾纸上画出了一个合作项目。"
- en: "Go back to bed and stare at the ceiling"
  zh: "回床上盯着天花板"
- en: "You don't sleep, but you rest. That's what you tell yourself."
  zh: "睡是没睡着，但也算休息了。你是这么告诉自己的。"
- en: "Your Next Paper, Presented"
  zh: "你的下一篇论文，被人讲了"
- en: "The third talk of the session presents almost exactly the idea you were going to work on next. Same data, same angle, better plots."
  zh: "这一场的第三个报告，讲的几乎就是你下一步打算做的想法。同样的数据，同样的角度，图还画得更好看。"
- en: "Talk to them afterward"
  zh: "会后去找对方聊聊"
- en: "You compare notes in the hallway. Your angle is different enough, and they suggest you keep in touch. Maybe even work together."
  zh: "你们在走廊里对了一下思路。你的角度还算不一样，对方提议保持联系，说不定还能合作。"
- en: "They're polite and in a hurry. You're left holding a half-formed idea that now has a published twin."
  zh: "对方很客气，但赶时间。你手里只剩一个没成形的想法，而它已经有了一个发表了的双胞胎。"
- en: "Quietly cross it off your list"
  zh: "默默把它从清单上划掉"
- en: "You draw a line through the idea in your notebook. It hurts less than you thought, and you have two others."
  zh: "你在笔记本上把这个想法划掉了。没有想象中那么痛，何况你还有两个别的想法。"
- en: "Find what they missed"
  zh: "找找对方漏了什么"
- en: "By the end of the session, you have a follow-up they haven't thought of."
  zh: "这场报告结束时，你已经想到了一个对方没想到的后续方向。"
- en: "Everything you think of, they already did in the appendix."
  zh: "你想到的每一点，对方都已经在附录里做过了。"
- en: "There It Is"
  zh: "就在那儿"
- en: "A speaker puts up a slide titled \"Prior work\", and there it is: your preprint of {paper}, your name, in a room of four hundred people."
  zh: "一位讲者放出一页标题为“相关工作”的幻灯片，上面赫然是你那篇 {paper} 的预印本和你的名字，当着四百个人的面。"
- en: "Take a photo for your advisor"
  zh: "拍张照发给导师"
- en: "{advisor} replies with three exclamation points, which for {advisor} is a parade."
  zh: "{advisor}回了三个感叹号。对 {advisor}来说，这已经算敲锣打鼓了。"
- en: "Whisper to the person next to you"
  zh: "跟旁边的人小声说"
- en: "\"That's me,\" you whisper. They look at the slide, then at you, then at the slide. \"Cool,\" they whisper back, and they mean it."
  zh: "“那是我，”你小声说。对方看看幻灯片，看看你，又看看幻灯片。“酷，”对方小声回了一句，而且是真心的。"
- en: "Find the speaker afterward"
  zh: "会后去找讲者"
- en: "They're thrilled to meet you and have three questions about your method. You have answers to two."
  zh: "对方见到你非常激动，问了你三个关于方法的问题。你答上来两个。"
- en: "They've already left for another session. You write them a very long email instead."
  zh: "对方已经去别的分会场了。你只好写了一封很长很长的邮件。"
- en: "The Q&A That Became a Debate"
  zh: "提问环节变成了辩论会"
- en: "During the Q&A, two senior professors start arguing about whether benchmarks mean anything. It's been eight minutes. The session chair has given up."
  zh: "提问环节，两位资深教授开始争论基准测试到底有没有意义。已经吵了八分钟，主持人已经放弃了。"
- en: "Enjoy the show"
  zh: "看戏"
- en: "It's the best talk of the conference, and it isn't on the program."
  zh: "这是整场会议最精彩的一场报告，而且不在日程上。"
- en: "Step up to the mic with a middle ground"
  zh: "走到麦克风前，给个折中观点"
- en: "Both professors turn to look at you. One says, \"Exactly.\" The other says, \"Fine.\" The chair mouths \"thank you\"."
  zh: "两位教授同时转头看你。一位说：“没错。”另一位说：“行吧。”主持人冲你做口型：“谢谢”。"
- en: "They both turn to you, disagree with you, then agree with each other that you're wrong. Unity, at last."
  zh: "两人一起转向你，都不同意你，然后一致认为你错了。他们终于团结了。"
- en: "Slip out to another session"
  zh: "溜去隔壁分会场"
- en: "You catch the last two talks next door. The argument is all anyone talks about at lunch anyway."
  zh: "你赶上了隔壁最后两个报告。反正午饭时大家聊的全是那场争论。"
- en: "Standing Room Only"
  zh: "只剩站票"
- en: "The session on your topic is in a room for forty people. Two hundred show up. You're on the floor by the door with your knees under your chin."
  zh: "你方向的分会场被安排在一间四十人的小屋里，结果来了两百人。你坐在门边的地上，膝盖顶着下巴。"
- en: "Stay for all of it"
  zh: "坚持听完"
- en: "Your legs fall asleep twice. The talks are worth it, mostly."
  zh: "腿麻了两次。报告大体上还是值得的。"
- en: "Watch the stream from the hallway"
  zh: "在走廊看直播"
- en: "You watch on your phone from a hallway bench, next to six other people doing the same thing. By the end, you're a group."
  zh: "你坐在走廊长椅上用手机看直播，旁边还有六个人在干同样的事。看完时，你们已经成了一伙。"
- en: "The Seat Next to You"
  zh: "旁边的座位"
- en: "The seat next to you is taken by {prof}, one of the founders of your field, who is quietly correcting the speaker's equations in the margin of the program."
  zh: "坐你旁边的是 {prof}，这个领域的奠基人之一，正悄悄在会议手册的页边上改讲者的公式。"
- en: "Whisper a question"
  zh: "小声问个问题"
- en: "{prof} whispers back a two-sentence answer that clears up a month of confusion. \"Come by tomorrow and we'll argue about it properly.\""
  zh: "{prof}小声回了你两句话，解开了你困惑了一个月的问题。“明天来找我，咱们好好争一争。”"
- en: "{prof} looks at you as if you'd asked about the weather, then turns back to the screen."
  zh: "{prof}看你的眼神，就像你刚问了句今天天气怎么样，然后转回去继续看屏幕。"
- en: "Sneak a look at the margin notes"
  zh: "偷看页边的批注"
- en: "{prof} has found a sign error on slide 12. You check. {prof} is right. You'll never trust a slide again."
  zh: "{prof}在第 12 页发现了一个符号错误。你核对了一下，{prof}是对的。你再也不敢相信幻灯片了。"
- en: "Sit very still"
  zh: "一动不动地坐着"
- en: "You sit perfectly still for forty minutes. Your posture has never been better."
  zh: "你一动不动坐了四十分钟。坐姿从没这么端正过。"
- en: "Won't Matter in Five Years"
  zh: "五年后都不重要"
- en: "The keynote speaker announces that most of the papers at this conference won't matter in five years. The room laughs nervously. Your paper is at this conference."
  zh: "主旨演讲嘉宾宣布：这次会议的大部分论文，五年后都不会有人在意。全场尴尬地笑了。你的论文就在这次会议上。"
- en: "Take it personally"
  zh: "往心里去"
- en: "You spend the afternoon wondering if yours is one of them. By dinner you've decided it's at least in the top half."
  zh: "你一下午都在想自己那篇是不是其中之一。到晚饭时你认定，它至少排在前一半。"
- en: "Take notes on what will matter"
  zh: "记下什么才真正重要"
- en: "You leave with three questions that might matter in five years, and one of them is yours."
  zh: "你带走了三个五年后可能仍然重要的问题，其中一个是你的。"
- en: "Your notes say \"WHAT MATTERS???\" in large letters. It's a start."
  zh: "你的笔记上用大字写着“到底什么重要？？？”。好歹是个开始。"
- en: "Hand Up"
  zh: "举手"
- en: "The talk ends. The chair asks for questions. Your hand is in the air before you can stop it. The mic is at the far end of the aisle."
  zh: "报告结束，主持人问有没有问题。你还没反应过来，手已经举起来了。麦克风在过道的另一头。"
- en: "Ask the question you wrote down"
  zh: "问你写下来的那个问题"
- en: "Your voice shakes on the first word and steadies by the fifth. The speaker thinks for a second and says it's a great question, and clearly means it."
  zh: "第一个字声音还在抖，到第五个字就稳了。讲者想了一秒，说这是个好问题，而且看得出是真心的。"
- en: "You ask it. It comes out twice as long as you wrote it. The speaker kindly answers a different question."
  zh: "你问了。说出来的比写下来的长了一倍。讲者很客气地回答了另一个问题。"
- en: "Lower your hand slowly, as if stretching"
  zh: "假装伸懒腰，慢慢把手放下"
- en: "Someone else asks your exact question and gets a great answer. You nod as if you'd planned it."
  zh: "另一个人问了一模一样的问题，得到了很好的回答。你点点头，仿佛一切都在计划之中。"
- en: "More of a Comment"
  zh: "与其说是问题"
- en: "You ask your question; the speaker answers it well. Then the person behind you takes the mic, says it's more of a comment than a question, and starts presenting their own paper."
  zh: "你问了你的问题，讲者答得很好。接着你身后的人拿过麦克风，说与其说是问题不如说是个评论，然后讲起了自己的论文。"
- en: "Wait it out"
  zh: "耐心等着"
- en: "Four minutes. You learn their whole paper. Honestly, it's pretty good."
  zh: "四分钟。你把对方的整篇论文都听完了。说实话，还挺不错。"
- en: "Catch the speaker at the door instead"
  zh: "改去门口堵讲者"
- en: "You skip the line and catch the speaker on the way out. They're relieved to talk to someone who asked an actual question."
  zh: "你没排队，在门口截住了讲者。对方松了口气：总算有人问了个真正的问题。"
- en: "Not Quite What You Asked"
  zh: "答非所问"
- en: "You ask a question you've been thinking about all week. The speaker smiles and answers a completely different question, with total confidence."
  zh: "你问了一个琢磨了一整周的问题。讲者笑了笑，信心满满地回答了一个完全不同的问题。"
- en: "Politely ask again"
  zh: "礼貌地再问一遍"
- en: "You put it in one sentence. The speaker pauses. \"Oh. Oh, that's interesting. I don't know.\" The room goes quiet, the good kind of quiet."
  zh: "你用一句话把问题重新说了一遍。讲者顿了一下：“哦。哦，这个有意思。我不知道。”全场安静下来，是那种好的安静。"
- en: "The second answer is to yet another question. The chair moves on."
  zh: "第二次回答的又是另一个问题。主持人叫了下一位。"
- en: "Say thank you and sit down"
  zh: "说声谢谢，坐下"
- en: "At the break, three people find you. They wanted the answer to your actual question too."
  zh: "茶歇时有三个人来找你。他们也想知道你那个问题的答案。"
- en: "Building on Your Question"
  zh: "顺着你的问题说"
- en: "You ask your question at the mic. Before the speaker can answer, {prof}, one of the biggest names in the field, stands up and says, \"I want to build on that question.\""
  zh: "你在麦克风前提了问题。讲者还没开口，领域里最有名的人之一 {prof}站起来说：“我想顺着这个问题再说几句。”"
- en: "Hold your ground at the mic"
  zh: "守住麦克风"
- en: "You, {prof} and the speaker end up in a three-way conversation that runs five minutes over. Afterward, {prof} asks who your advisor is."
  zh: "你、{prof}和讲者聊成了三方对话，超时了五分钟。会后，{prof}问你导师是谁。"
- en: "{prof} builds on your question so thoroughly that by the end, nobody remembers it was yours."
  zh: "{prof}顺着你的问题讲得太透彻了，到最后谁都不记得这问题是你提的。"
- en: "Step back and let them"
  zh: "退后一步，让对方说"
- en: "{prof} asks a better version of your question and thanks you by name. People look at you differently at lunch."
  zh: "{prof}把你的问题换了个更好的问法，还点名感谢了你。午饭时，大家看你的眼神都不一样了。"
- en: "Number Five in Line"
  zh: "排第五"
- en: "There are six people in line at the mic and four minutes left in the session. You're number five."
  zh: "麦克风前排了六个人，这场还剩四分钟。你排第五。"
- en: "Stay in line"
  zh: "继续排"
- en: "The chair lets the session run over. You ask your question at 12:02 to a hungry room, and it's a good one."
  zh: "主持人让这场拖了堂。你在 12:02 对着一屋子饿肚子的人问了问题，问得还挺好。"
- en: "\"We're out of time.\" You walk back to your seat holding a question nobody will ever hear."
  zh: "“时间到了。”你走回座位，手里攥着一个永远没人会听到的问题。"
- en: "Ask the person ahead of you instead"
  zh: "改问排在你前面的人"
- en: "Number four turns out to have the same question. You team up and corner the speaker together at the break."
  zh: "排第四的人原来也想问同一个问题。你们俩茶歇时一起堵住了讲者。"
- en: "That's Why We Tried This"
  zh: "我们就是因为你才试的"
- en: "The speaker is {stranger}, a student from another lab. You ask your question. \"Wait,\" {stranger} says, squinting at your badge. \"You wrote {paper}? That's why we tried this.\""
  zh: "讲者是 {stranger}，另一个组的学生。你提了问题。“等等，”{stranger} 眯眼看着你的胸牌说，“{paper} 是你写的？我们就是因为它才试这个的。”"
- en: "Grab coffee after"
  zh: "会后一起喝咖啡"
- en: "You spend the break comparing notes. By the end, you're planning a joint workshop paper."
  zh: "茶歇时间你们都在对比笔记。到最后，你们已经在计划合写一篇 workshop 论文了。"
- en: "Act like it's no big deal"
  zh: "装作没什么大不了"
- en: "You say \"oh, cool\" very casually. You replay the moment on a loop all afternoon."
  zh: "你很随意地说了句“哦，挺酷的”。整个下午这一幕都在你脑子里循环播放。"
- en: "Coffee with a Big Name"
  zh: "和大佬喝咖啡"
- en: "{prof} actually said yes to coffee. {prof} arrives four minutes late, orders an espresso and says, \"So. What are you working on?\""
  zh: "{prof}居然答应一起喝咖啡。{prof}迟到了四分钟，点了杯浓缩，开口就问：“说吧，你在做什么？”"
- en: "Give your one-minute pitch"
  zh: "用一分钟介绍你的研究"
- en: "{prof} asks three sharp questions, then says, \"Send me the paper. And think about a summer visit to my lab.\""
  zh: "{prof}问了三个尖锐的问题，然后说：“把论文发给我。另外考虑一下暑假来我组里访问。”"
- en: "You squeeze your five-minute pitch into one breathless minute. {prof} is kind about it, and checks the time twice."
  zh: "你把五分钟的介绍硬塞进了一分钟，讲得上气不接下气。{prof}很客气，只是看了两次表。"
- en: "Ask about their work instead"
  zh: "反过来问对方的研究"
- en: "{prof} talks happily for twenty minutes. You learn a lot, and {prof} remembers you as a very good listener."
  zh: "{prof}兴致勃勃地讲了二十分钟。你学到了很多，{prof}也记住了你这个很会倾听的人。"
- en: "Ask for career advice"
  zh: "请教职业发展的建议"
- en: "{prof} tells you the one thing they wish they'd known as a student: \"Pick problems you'd still care about if nobody cited them.\""
  zh: "{prof}告诉你一件希望自己读博时就知道的事：“选那些就算没人引用，你也依然在乎的问题。”"
- en: "Same Problem, Same Deadline"
  zh: "同一个问题，同一个截稿日"
- en: "Your coffee chat is with {stranger}, who turns out to be working on the same problem as you, with the same dataset, for the same deadline."
  zh: "和你喝咖啡的是 {stranger}，结果对方在做跟你一样的问题，用一样的数据集，赶同一个截稿日。"
- en: "Propose working together"
  zh: "提议合作"
- en: "\"Honestly? I'd love that,\" {stranger} says. You leave with a shared doc and one less rival."
  zh: "“说实话？我很乐意，”{stranger} 说。你带走了一个共享文档，少了一个对手。"
- en: "{stranger} says they'll think about it, in the voice people use when they won't."
  zh: "{stranger} 说会考虑一下，用的是那种打算不了了之时的语气。"
- en: "Split the problem"
  zh: "把问题分一分"
- en: "You agree: {stranger} takes efficiency, you take evaluation. You shake on it over a croissant."
  zh: "你们说好了：{stranger} 做效率，你做评测。就着一个可颂握手成交。"
- en: "Race them"
  zh: "跟对方赛跑"
- en: "You smile, finish your coffee and go back to the hotel to run experiments. The race is on."
  zh: "你笑了笑，喝完咖啡，回酒店跑实验。比赛开始了。"
- en: "Great to See You Again!"
  zh: "好久不见！"
- en: "Someone in the coffee line waves at you, clearly delighted to see you again. You have absolutely no idea who they are."
  zh: "咖啡队里有人冲你挥手，显然很高兴再见到你。你完全不知道对方是谁。"
- en: "Bluff it"
  zh: "硬着头皮装熟"
- en: "You keep it vague for ten minutes until they mention their dataset. It's {stranger}! You met at a workshop last year. Saved."
  zh: "你含糊其辞地聊了十分钟，直到对方提起自己的数据集。是 {stranger}！你们去年在一个 workshop 上见过。得救了。"
- en: "\"Sorry, remind me what you work on?\" you finally ask. \"We had dinner together. Last night.\""
  zh: "“不好意思，你是做什么方向的来着？”你终于问出口。“我们一起吃过饭。就在昨晚。”"
- en: "Confess you've forgotten"
  zh: "坦白说你忘了"
- en: "They laugh: they'd forgotten your name too and were bluffing. You introduce yourselves again, properly this time."
  zh: "对方笑了：其实对方也忘了你的名字，一直在硬撑。你们重新认识了一遍，这次是认真的。"
- en: "Coffee, on {company}"
  zh: "{company} 请的咖啡"
- en: "A recruiter from {company} invites you for coffee. Within five minutes, they ask when you graduate. Within ten, they mention the salary range."
  zh: "{company} 的招聘官请你喝咖啡。不到五分钟就问你什么时候毕业，不到十分钟就报出了薪资范围。"
- en: "Hear them out"
  zh: "听听对方怎么说"
- en: "The number is bigger than your stipend by a factor you calculate twice. You take their card and stare at it on the train."
  zh: "那个数字是你博士补助的好几倍，倍数你算了两遍。你收下名片，在地铁上盯着它看了一路。"
- en: "Steer the talk to research"
  zh: "把话题引到研究上"
- en: "They're surprisingly interested in your work. Their research team, they say, is hiring interns next summer."
  zh: "对方对你的研究出奇地感兴趣，说他们的研究团队明年暑假在招实习生。"
- en: "Say you're not on the market yet"
  zh: "说你还没开始找工作"
- en: "\"Everyone says that,\" they say with a smile, and hand you a card anyway."
  zh: "“大家都这么说，”对方笑着说，还是递给了你一张名片。"
- en: "An Hour of Honest Advice"
  zh: "一小时的真心话"
- en: "Your coffee with {stranger}, a fifth-year from another lab, turns into an hour of honest talk about advisors, burnout and which conferences are worth it."
  zh: "{stranger} 是另一个组的五年级博士生。你们本来只是喝杯咖啡，结果聊了一小时的真心话：导师、倦怠，还有哪些会才真正值得去。"
- en: "Take notes"
  zh: "记笔记"
- en: "You fill two pages. The best line, from {stranger}, gets underlined twice: \"Nobody remembers your rejections but you.\""
  zh: "你记满了两页。{stranger} 说的最好的一句，你划了两道线：“除了你自己，没人记得你被拒过多少次。”"
- en: "Ask what they'd do differently"
  zh: "问对方如果重来会怎么做"
- en: "\"Start writing earlier,\" {stranger} says. \"And go to the conference party. I mean it.\""
  zh: "“早点开始写，”{stranger} 说，“还有，一定要去会议派对。我是认真的。”"
- en: "You Reviewed This Paper"
  zh: "这篇是你审的"
- en: "Halfway through coffee, you realize that the paper {stranger} is telling you about is the one you reviewed last month. You gave it a 2."
  zh: "咖啡喝到一半，你意识到 {stranger} 正在讲的那篇论文，就是你上个月审过的那篇。你给了 2 分。"
- en: "Say nothing, as reviewers should"
  zh: "守口如瓶，审稿人就该这样"
- en: "You keep the review anonymous and give them some advice, which is basically your review again, out loud. \"That's so helpful,\" {stranger} says. \"Way more useful than our reviewers.\""
  zh: "你守住了匿名审稿的规矩，给了对方一些建议，其实就是把你的审稿意见当面又说了一遍。“太有帮助了，”{stranger} 说，“比我们那几个审稿人有用多了。”"
- en: "Suddenly need the restroom"
  zh: "突然要去洗手间"
- en: "You hide in the restroom for six minutes. When you come back, they've bought you a pastry."
  zh: "你在洗手间躲了六分钟。回来时，对方已经给你买了块糕点。"
- en: "Send Me Your CV"
  zh: "把简历发给我"
- en: "Over coffee, {prof}, who runs a lab you'd love to join as a postdoc, says, \"Are you on the market next year? Send me your CV.\""
  zh: "喝咖啡时，{prof}问你：“明年上求职市场吗？把简历发给我。”你一直很想去对方组里做博士后。"
- en: "Send it that night"
  zh: "当晚就发"
- en: "You update your CV in the hotel room at midnight and send it before you lose your nerve. The reply comes by breakfast: let's talk in the spring."
  zh: "你半夜在酒店房间里改好简历，趁自己还没怂赶紧发了出去。早饭前就收到回复：春天再细聊。"
- en: "Ask what they look for"
  zh: "问对方看重什么"
- en: "{prof} tells you: \"One thing you're known for. Just one.\" You spend the flight home trying to name yours."
  zh: "{prof}告诉你：“有一样让人记住你的东西。就一样。”回程的飞机上，你一直在想你的那一样是什么。"
- en: "The Walking Tour"
  zh: "城市徒步游"
- en: "The walking tour of {city} starts with forty researchers and one guide. Twenty minutes in, there are thirty-one researchers. Nobody knows where the other nine went."
  zh: "{city}徒步游出发时有四十个研究者和一个导游。二十分钟后，只剩三十一个研究者。没人知道另外九个去哪了。"
- en: "Stick with the guide"
  zh: "跟紧导游"
- en: "You learn the history of {city}, and the guide's opinion of tourists who don't listen. Both are fascinating."
  zh: "你了解了{city}的历史，也了解了导游对不听讲解的游客有什么看法。两样都很精彩。"
- en: "Go find the lost nine"
  zh: "去找走丢的九个人"
- en: "You find them in a bakery, arguing about evaluation metrics. You stay for the pastries and the argument."
  zh: "你在一家面包店找到了他们，他们正为评测指标吵得不可开交。你留下来吃糕点，顺便听他们吵。"
- en: "You don't find them, and now you're lost too. You see a lot of {city} trying to get back."
  zh: "没找到他们，你自己也迷路了。为了找路回去，你倒是把{city}逛了个遍。"
- en: "The Museum"
  zh: "博物馆"
- en: "{labmate} drags a few of you to a museum. It turns out to have a whole wing of old calculating machines."
  zh: "{labmate} 拉着你们几个去逛博物馆。没想到里面有一整个展厅的老式计算机器。"
- en: "Spend two hours with the machines"
  zh: "在机器前泡两个小时"
- en: "You read every label. {labmate} has to pull you away by the sleeve. You leave with a postcard of a 1960s mainframe."
  zh: "你把每块说明牌都读了一遍，{labmate} 只好拽着你的袖子把你拖走。你带走了一张 1960 年代大型机的明信片。"
- en: "Find the café"
  zh: "去找咖啡馆"
- en: "You sit in the museum café while the others look at art. It's the most peaceful hour of the week."
  zh: "别人看展的时候，你坐在博物馆的咖啡馆里。这是这周最安静的一个小时。"
- en: "Where the Locals Eat"
  zh: "本地人吃饭的地方"
- en: "A student from {city} offers to show a group of you where the locals actually eat. The place has no sign, no menu and a forty-minute line."
  zh: "一个{city}本地的学生说要带你们去本地人真正吃饭的地方。店没有招牌，没有菜单，排队要四十分钟。"
- en: "Order whatever they order"
  zh: "人家点什么你点什么"
- en: "It's the best meal of your life. You will describe it to your family in unnecessary detail."
  zh: "这是你这辈子吃过最好吃的一顿。你会跟家里人描述到没人想听的细节。"
- en: "It's delicious. Your stomach has opinions about it for the next day and a half."
  zh: "很好吃。可接下来一天半，你的胃对它颇有意见。"
- en: "Play it safe"
  zh: "保守一点"
- en: "You order the one thing you recognize. It's also amazing. Everyone else's still looks better."
  zh: "你点了唯一认得的那道菜。也很好吃。只是别人点的看起来还是更香。"
- en: "A Short Hike"
  zh: "一段很短的徒步"
- en: "{stranger}, a postdoc you met yesterday, is organizing a sunrise hike outside {city}. \"It's a short one,\" {stranger} promises."
  zh: "{stranger} 是你昨天认识的博士后，组织了一场去{city}郊外看日出的徒步。“很短的，”{stranger} 保证。"
- en: "Go"
  zh: "去"
- en: "It's not short. It's beautiful. At the top, eight sweaty researchers take the best photo of the conference."
  zh: "一点都不短。但风景很美。山顶上，八个满身大汗的研究者拍下了这次会议最好的一张照片。"
- en: "It's not short. You make it, barely, and doze through every session that afternoon."
  zh: "一点都不短。你勉强爬完了，下午的每一场报告都在打瞌睡。"
- en: "Sleep in"
  zh: "睡个懒觉"
- en: "You see the photos at breakfast: eight happy, sweaty researchers. Next time."
  zh: "你在早饭时看到了照片：八个满身大汗、笑得很开心的研究者。下次吧。"
- en: "Caught Skipping"
  zh: "翘会被抓"
- en: "You're skipping sessions to eat ice cream by the river when you see {advisor} walking toward you. Also holding an ice cream."
  zh: "你翘了报告在河边吃冰淇淋，突然看见 {advisor}朝你走来。手里也拿着一个冰淇淋。"
- en: "Wave"
  zh: "挥挥手"
- en: "{advisor} sits down next to you. \"Don't tell anyone, but this is the best part of any conference,\" {advisor} says. You talk about everything but research for an hour."
  zh: "{advisor}在你旁边坐下。“别告诉别人，这才是开会最棒的部分，”{advisor}说。接下来一个小时，你们什么都聊，就是不聊科研。"
- en: "Hide behind a tree"
  zh: "躲到树后面"
- en: "You make it behind the tree. {advisor} strolls past without seeing you. It occurs to you that neither of you is at the sessions."
  zh: "你成功躲到了树后。{advisor}溜达着走过去，没看见你。你这才反应过来：你们俩都没在会场。"
- en: "{advisor} sees you mid-dive, says \"nice tree\", and sits down on the bench next to it to finish the ice cream."
  zh: "{advisor}正好看见你扑向那棵树，说了句“这树不错”，然后在旁边的长椅上坐下，接着吃冰淇淋。"
- en: "Forty Researchers on a Bridge"
  zh: "桥上的四十个研究者"
- en: "Someone asks a passerby to take a group photo: forty researchers on a famous bridge in {city}, badges still on."
  zh: "有人请路人帮忙拍合影：四十个研究者站在{city}一座著名的桥上，胸牌都还挂着。"
- en: "Get in the front row"
  zh: "站到第一排"
- en: "You end up in the middle of the photo, mid-blink. It becomes the conference's official photo."
  zh: "你站在照片正中间，刚好闭眼。这张成了会议的官方合影。"
- en: "Take the photo yourself"
  zh: "自己来拍"
- en: "You take forty shots. In the best one, a pigeon has landed on a famous professor's head. Everyone wants a copy."
  zh: "你拍了四十张。最好的一张里，一只鸽子落在了一位知名教授头上。人人都想要一份。"
- en: "Under the Awning"
  zh: "屋檐下"
- en: "Halfway through your afternoon in {city}, the sky opens. You and three people from the conference are stuck under a small awning for an hour."
  zh: "你在{city}逛到一半，突然下起了大雨。你和三个开会的人在一个小屋檐下被困了一个小时。"
- en: "Make the most of it"
  zh: "趁机聊聊"
- en: "By the time the rain stops, you've swapped research, quals stories and worst reviews. Friends for life, possibly."
  zh: "等雨停时，你们已经聊完了各自的研究、资格考试的故事和收到过的最烂审稿意见。说不定能做一辈子的朋友。"
- en: "Make a run for it"
  zh: "冲回去"
- en: "You sprint back to the hotel and arrive looking like you swam there. A hot shower is the best decision of the day."
  zh: "你一路冲回酒店，到的时候像是游泳回来的。洗个热水澡，是今天最正确的决定。"
- en: "The Napkin"
  zh: "餐巾纸"
- en: "At dinner, you and {stranger} start sketching on a napkin. By dessert, it's covered in arrows, and it might be a real paper."
  zh: "晚饭时，你和 {stranger} 开始在餐巾纸上写写画画。到上甜点时，纸上已经画满了箭头，说不定真能成一篇论文。"
- en: "Keep the napkin"
  zh: "留着这张餐巾纸"
- en: "You photograph it, then keep the original in your passport. Months later, it becomes a workshop paper with both your names on it."
  zh: "你拍了照，又把原件夹进了护照里。几个月后，它变成了一篇署着你们俩名字的 workshop 论文。"
- en: "Sleep on it"
  zh: "睡一觉再说"
- en: "In the morning you find the napkin in your pocket. It says \"ATTENTION BUT BACKWARDS??\" and nothing else."
  zh: "第二天早上，你在口袋里摸出那张餐巾纸。上面只写着“注意力但是反着来？？”，别的什么都没有。"
- en: "Karaoke"
  zh: "KTV"
- en: "Dinner turns into karaoke. Someone has put your name on the list. The song is a power ballad. The audience includes three program committee members."
  zh: "晚饭吃着吃着变成了 KTV。有人把你的名字加进了点歌单，歌是一首高音飙到天上的情歌。台下坐着三位程序委员会成员。"
- en: "Commit fully"
  zh: "全情投入"
- en: "You hit the high note. Mostly. The room goes wild, and people call you by the song's name for the rest of the week."
  zh: "你飙上了高音，大体上。全场沸腾，这周剩下的时间大家都管你叫那首歌的名字。"
- en: "You miss the high note, and commit to missing it, which gets a bigger cheer than hitting it would have."
  zh: "你没飙上去，但破音破得理直气壮，结果掌声比唱上去还热烈。"
- en: "Duet with {labmate}"
  zh: "和 {labmate} 合唱"
- en: "{labmate} takes the high notes, you take the harmonies, and together you're adequate. It's the most you've bonded all year."
  zh: "{labmate} 唱高音，你唱和声，凑在一起勉强及格。这是你们一年来感情最好的时刻。"
- en: "Sneak out"
  zh: "偷偷溜走"
- en: "You slip out during someone else's song. Nobody notices. You're a little disappointed that nobody noticed."
  zh: "你趁别人唱歌时溜了出去。没人注意到。没人注意到这一点，让你有点失落。"
- en: "Twelve People, One Bill"
  zh: "十二个人，一张账单"
- en: "Dinner with twelve researchers ends with one bill, four currencies, three payment apps and a math PhD volunteering to \"just quickly\" split it."
  zh: "十二个研究者吃完饭，面对的是一张账单、四种货币、三个支付 App，还有一位数学博士自告奋勇说要“很快地”分一下账。"
- en: "Let the mathematician handle it"
  zh: "交给数学家吧"
- en: "Forty minutes later, everyone owes slightly too much and nobody minds. It was a great dinner."
  zh: "四十分钟后，每个人都多付了一点点，但没人介意。这顿饭吃得很开心。"
- en: "Pay for the table and sort it out later"
  zh: "先全付了，回头再算"
- en: "Everyone pays you back by morning, plus a few drinks owed. You're now known as the one who paid."
  zh: "第二天早上大家都把钱还了，还欠你几杯酒。从此你成了大家口中那个买单的人。"
- en: "Eight of the twelve pay you back. The other four are names you'll recognize for the rest of your career."
  zh: "十二个人里有八个还了钱。剩下四个人的名字，你这辈子都会记得。"
- en: "Back in My Day"
  zh: "想当年"
- en: "At dinner, after a glass of wine, {advisor} starts telling grad school stories: the paper rejected five times, the defense where the projector caught fire."
  zh: "晚饭时，一杯红酒下肚，{advisor}开始讲读博时的故事：一篇被拒了五次的论文，还有一场投影仪着了火的答辩。"
- en: "Ask for more"
  zh: "让对方接着讲"
- en: "{advisor} tells you about almost failing the first year of the PhD. You'd never have guessed. You see your own year a little differently."
  zh: "{advisor}讲起自己读博第一年差点没撑过去。你完全想不到。再看自己这一年，你的感受也有点不一样了。"
- en: "Ask about the projector"
  zh: "问投影仪的事"
- en: "\"It wasn't a fire,\" {advisor} says. \"It was smoke. There's a difference.\" The whole table is in tears."
  zh: "“不是着火，”{advisor}说，“是冒烟。这是有区别的。”整桌人笑出了眼泪。"
- en: "The Long Way Back"
  zh: "绕远路回酒店"
- en: "At midnight, walking back from dinner, you realize your phone is at 2%, the hotel's name is in a script you can't read, and every street looks the same."
  zh: "午夜吃完饭往回走，你发现手机只剩 2% 的电，酒店名字是你看不懂的文字，而且每条街都长得一样。"
- en: "Ask someone for directions"
  zh: "找人问路"
- en: "The someone is another conference attendee, also lost. Together you find the hotel at 1 am. You're best friends now."
  zh: "你问的人也是来开会的，也迷路了。你们一起在凌晨 1 点找到了酒店。现在你们是最好的朋友了。"
- en: "You walk for an hour and find the hotel by recognizing a pharmacy you passed on Sunday."
  zh: "你走了一个小时，最后靠认出周日路过的一家药店才找到酒店。"
- en: "Trust your sense of direction"
  zh: "相信自己的方向感"
- en: "Your sense of direction takes you to the river, a night market and, finally, the hotel. The best accident of the trip."
  zh: "你的方向感把你带到了河边、一个夜市，最后才是酒店。这是这趟旅行最美好的意外。"
- en: "1 am at the Bar"
  zh: "凌晨 1 点的酒吧"
- en: "At a bar at 1 am, {stranger} leans over and says, \"Can I tell you something? I'm thinking about quitting my PhD.\""
  zh: "凌晨 1 点的酒吧里，{stranger} 凑过来说：“能跟你说件事吗？我在考虑不读博了。”"
- en: "Just listen"
  zh: "就听着"
- en: "You listen for an hour and don't give advice. At the end, {stranger} says, \"Thanks. I think I just needed to say it out loud.\""
  zh: "你听了一个小时，没给任何建议。最后，{stranger} 说：“谢谢。我想我只是需要把它说出来。”"
- en: "Share your own doubts"
  zh: "说说你自己的动摇"
- en: "You tell them about your worst month. You both laugh at things that weren't funny at the time. It helps, both of you."
  zh: "你跟对方讲了你最难熬的一个月。那些当时一点都不好笑的事，你们现在笑得前仰后合。这对你们俩都有帮助。"
- en: "The Food Is Getting Cold"
  zh: "菜都凉了"
- en: "At a sponsored dinner, a host from {company} stands up to give a twenty-minute speech about their AI platform. The food is getting cold. Nobody dares to eat."
  zh: "赞助商晚宴上，{company} 的主持人起身，开始了一场二十分钟的 AI 平台演讲。菜在一点点变凉，没人敢动筷子。"
- en: "Eat anyway"
  zh: "先吃再说"
- en: "You start eating. One by one, the table joins you. By the end of the speech you've had two courses and made three friends."
  zh: "你开始吃了。一个接一个，全桌都跟着吃了起来。演讲结束时，你已经吃了两道菜，交了三个朋友。"
- en: "Ask a hard question at the end"
  zh: "最后问个尖锐的问题"
- en: "Your question is sharp enough that their head of research comes over afterward and asks for your email."
  zh: "你的问题够尖锐，会后他们的研究负责人专门过来要了你的邮箱。"
- en: "The host answers with a slide you've already seen twice. Your soup is now cold."
  zh: "主持人用一页你已经看过两遍的幻灯片回答了你。你的汤已经凉了。"
- en: "Your Advisor Can Dance"
  zh: "你的导师会跳舞"
- en: "At the party, {advisor} hits the dance floor. With enthusiasm. With a move that may involve an imaginary lasso. The whole lab is watching."
  zh: "派对上，{advisor}冲进了舞池，热情洋溢，有个动作像是在甩一根看不见的套索。全组都在看。"
- en: "Join in"
  zh: "一起跳"
- en: "You dance with {advisor}. Somebody films it. The video becomes lab legend, and {advisor} brings it up at lab meetings for years."
  zh: "你和 {advisor}一起跳。有人录了下来。这段视频成了组里的传奇，{advisor}在组会上提了好几年。"
- en: "Film it"
  zh: "录下来"
- en: "You get it all on video. {labmate} begs you to send it to the group chat. You never will. Probably."
  zh: "你全录下来了。{labmate} 求你发到群里。你永远不会发的。大概吧。"
- en: "Pretend you don't know them"
  zh: "假装不认识"
- en: "You study the bar menu with great interest. {advisor} waves at you from the dance floor. Everyone sees."
  zh: "你全神贯注地研究酒水单。{advisor}在舞池里冲你挥手。所有人都看见了。"
- en: "Gossip by the Bar"
  zh: "吧台边的八卦"
- en: "By the bar, a circle of professors is trading gossip: who's moving to which university, which startup just raised money, whose lab is falling apart."
  zh: "吧台边，一圈教授在交换八卦：谁要跳槽去哪所学校，哪家创业公司刚融了资，谁的组要散了。"
- en: "Listen in"
  zh: "竖起耳朵听"
- en: "You learn more about the field in fifteen minutes than in a semester. Half of it might even be true."
  zh: "这十五分钟里你对这个领域的了解，比一个学期还多。其中一半说不定还是真的。"
- en: "Join the circle"
  zh: "加入他们"
- en: "You land one good joke, and they let you stay. By the end, {prof} has offered to read your next draft."
  zh: "你抖了一个好包袱，他们就让你留下了。到最后，{prof}主动提出帮你看下一篇稿子。"
- en: "You join the circle. The circle goes quiet, then politely dissolves."
  zh: "你凑了过去。那一圈安静下来，然后客客气气地散了。"
- en: "Clearly Flawed"
  zh: "明显有缺陷"
- en: "At the bar, you overhear someone explaining why {paper} is \"clearly flawed\". They've got it wrong. They don't know you're standing right behind them."
  zh: "在吧台，你听到有人在解释为什么 {paper}“明显有缺陷”。对方理解错了，而且不知道你就站在身后。"
- en: "Introduce yourself"
  zh: "做个自我介绍"
- en: "\"Hi, I wrote that,\" you say. A pause. Then they ask a real question, you give a real answer, and they buy you a drink."
  zh: "“你好，那篇是我写的，”你说。一阵沉默。然后对方问了个真问题，你给了个真回答，对方请你喝了一杯。"
- en: "\"Hi, I wrote that,\" you say. A pause. They apologize, then explain it wrong again, more slowly."
  zh: "“你好，那篇是我写的，”你说。一阵沉默。对方道了歉，然后又错着解释了一遍，这次说得更慢。"
- en: "Let it go"
  zh: "算了"
- en: "You walk away. For the next three days, you compose the perfect reply in the shower."
  zh: "你走开了。接下来三天，你在洗澡时构思出了完美的反驳。"
- en: "Laugh it off with {labmate}"
  zh: "和 {labmate} 一笑了之"
- en: "{labmate} acts out the whole exchange, dramatically, twice. It's funnier every time, and it stops stinging."
  zh: "{labmate} 声情并茂地把整段对话演了两遍。一遍比一遍好笑，你也就不那么难受了。"
- en: "Does It Understand?"
  zh: "它真的懂吗？"
- en: "Two famous researchers start arguing about whether {model} actually understands anything. A crowd gathers. Someone hands you a drink and asks which side you're on."
  zh: "两位知名研究者开始争论 {model} 到底懂不懂东西。人越围越多。有人塞给你一杯酒，问你站哪边。"
- en: "Pick a side, loudly"
  zh: "大声选边站"
- en: "Your argument gets a cheer and, from one of the famous researchers, a nod. You'll turn up in someone's blog post."
  zh: "你的观点赢得一阵欢呼，其中一位知名研究者还冲你点了点头。你会出现在某人的博客里。"
- en: "You pick a side, then lose your own argument halfway through. The crowd moves on to the next speaker."
  zh: "你选了一边，讲到一半把自己的论点忘了。人群转去听下一个人。"
- en: "Say it depends what \"understand\" means"
  zh: "说这取决于“懂”怎么定义"
- en: "Both sides groan. Then both sides agree with you. You've united the room in mild annoyance."
  zh: "两边都叹了口气。然后两边都同意了你。你靠一点点烦人，团结了全场。"
- en: "Get more snacks"
  zh: "再去拿点吃的"
- en: "The debate goes on for two hours. You eat very well."
  zh: "辩论持续了两个小时。你吃得很好。"
- en: "Where's Your Phone?"
  zh: "你的手机呢？"
- en: "At midnight you realize you've lost your phone. The party is loud and dark, and four hundred people are wearing the same lanyard."
  zh: "午夜时你发现手机丢了。派对又吵又暗，四百个人挂着一模一样的挂绳。"
- en: "Search the whole venue"
  zh: "把整个场地翻一遍"
- en: "You find it under a table, next to someone's very expensive laptop. You return the laptop to its owner, who is now your friend for life."
  zh: "你在一张桌子底下找到了手机，旁边还有一台别人的高档笔记本。你把笔记本还给了失主，对方从此成了你的终生好友。"
- en: "It's gone. You spend the rest of the trip navigating {city} with a paper map, like it's 1995."
  zh: "找不回来了。这趟剩下的日子，你只能拿着纸质地图在{city}认路，仿佛回到了 1995 年。"
- en: "Ask the DJ to announce it"
  zh: "请 DJ 帮忙广播"
- en: "The DJ stops the music to announce your lost phone. Four hundred researchers turn to look at you. Someone has it. You're briefly famous."
  zh: "DJ 停下音乐，广播你丢了手机。四百个研究者齐刷刷地看向你。有人捡到了。你短暂地出了个名。"
- en: "Five Minutes?"
  zh: "有五分钟吗？"
- en: "A research director from {biglab} corners you by the coat check. They've read your paper, they say. Do you have five minutes?"
  zh: "{biglab} 的一位研究总监在衣帽间旁边堵住了你。对方说读过你的论文，问你有没有五分钟。"
- en: "Make it fifteen"
  zh: "聊十五分钟"
- en: "It turns into an informal interview over very loud music. You think it went well. You can't hear anything for an hour afterward."
  zh: "结果在震耳的音乐里变成了一场非正式面试。你觉得聊得不错。之后一个小时你什么都听不见。"
- en: "Ask for their email instead"
  zh: "改要对方的邮箱"
- en: "They give you a card. The card has no email on it, only a logo. You find the email the next morning anyway."
  zh: "对方给了你一张名片。名片上没有邮箱，只有一个 logo。第二天早上你还是把邮箱查到了。"
- en: "Dance-Off"
  zh: "斗舞"
- en: "Someone challenges your lab to a dance-off against a team from {biglab}. The DJ is in on it. A circle forms."
  zh: "有人向你们组发起挑战，要和 {biglab} 的团队斗舞。DJ 也参与了。大家围成了一圈。"
- en: "Accept the challenge"
  zh: "接受挑战"
- en: "Your lab wins. {labmate} pulls out a move nobody knew they had. By morning, the video is all over the conference hashtag."
  zh: "你们组赢了。{labmate} 跳出了一个谁都不知道的绝活。第二天早上，视频已经在会议话题里刷屏了。"
- en: "You lose, badly and joyfully. The {biglab} team buys your lab a round out of pity."
  zh: "你们输了，输得很惨，但很开心。{biglab} 的团队出于同情，请你们组喝了一轮。"
- en: "Send {labmate} in alone"
  zh: "派 {labmate} 单挑"
- en: "{labmate} wins it single-handedly. Your lab will tell this story at every lab meeting until the end of time."
  zh: "{labmate} 一个人就赢了。你们组会在以后的每次组会上讲这个故事，直到地老天荒。"
- en: "Social Battery: 0%"
  zh: "社交电量：0%"
- en: "It's 11 pm. The music is too loud, the room is too hot, you've been talking to people for four days straight, and your social battery is empty."
  zh: "晚上 11 点。音乐太吵，屋里太热，你已经连着跟人说了四天话，社交电量彻底耗尽。"
- en: "Leave quietly"
  zh: "悄悄离开"
- en: "You walk back to the hotel alone through quiet streets. It's the most restful twenty minutes of the week."
  zh: "你一个人沿着安静的街道走回酒店。这是这周最放松的二十分钟。"
- en: "Find a quiet corner"
  zh: "找个安静的角落"
- en: "You find a corner where three other people are also recharging. Nobody talks. It's lovely."
  zh: "你找到一个角落，那里还有三个人也在给自己充电。谁都不说话。很美好。"
- en: "Push through"
  zh: "硬扛"
- en: "You get a second wind at midnight and have the best conversation of the week."
  zh: "午夜时你突然又来了精神，聊出了这周最好的一段对话。"
- en: "You stay. You smile. You remember nothing of the last hour but the bass line."
  zh: "你留下了，一直在笑。最后一个小时，你只记得那段低音。"
- en: "The Open Bar"
  zh: "免费酒水"
- en: "The open bar is very open. {labmate2} is three drinks in and about to tell a famous professor exactly what they think of the professor's last paper."
  zh: "免费酒水是真的随便喝。{labmate2} 已经喝了三杯，正准备当面告诉一位知名教授，自己对那位教授上一篇论文的真实看法。"
- en: "Intervene"
  zh: "出手阻止"
- en: "You steer {labmate2} toward the snacks mid-sentence. The professor never learns how close it came."
  zh: "{labmate2} 话说到一半，你就把人拉去了零食台。那位教授永远不会知道刚才有多悬。"
- en: "You arrive one sentence too late. The professor listens, thinks, and says {labmate2} might be right. Nobody saw that coming."
  zh: "你晚到了一句话。教授听完想了想，说 {labmate2} 可能是对的。谁都没料到。"
- en: "Let it happen"
  zh: "随它去"
- en: "The professor laughs and argues back, and the two of them talk for an hour. {labmate2} wakes up with a new collaborator and a headache."
  zh: "教授笑着回怼，两个人聊了一个小时。第二天 {labmate2} 醒来，多了一个合作者，外加一阵头疼。"
- en: "The Wrong Adapter"
  zh: "转接头不对"
- en: "Your laptop won't talk to the projector. The adapter you brought is the wrong one. The session chair is looking at the clock, and three hundred people are looking at you."
  zh: "你的笔记本连不上投影仪，带的转接头型号不对。主持人在看钟，三百个人在看你。"
- en: "Ask the room for an adapter"
  zh: "问台下有没有转接头"
- en: "Someone in the front row tosses you an adapter like a relay baton. You start one minute late, to applause."
  zh: "前排有人像传接力棒一样把一个转接头扔给了你。你晚了一分钟开讲，台下响起掌声。"
- en: "Four people offer adapters. None fit. You present from the chair's laptop, using the PDF you emailed yourself at 3 am."
  zh: "四个人递来了转接头，没一个能用。你只好用主持人的电脑，放你凌晨 3 点发给自己的 PDF。"
- en: "Give the talk without slides"
  zh: "不用幻灯片直接讲"
- en: "You give it from memory, drawing the key figure on the whiteboard. People call it the clearest talk of the session."
  zh: "你凭记忆讲完，在白板上画出了关键的那张图。大家都说这是这一场最清楚的报告。"
- en: "You describe your figures with your hands for fifteen minutes. People nod, imagining very different figures."
  zh: "你用手比划了十五分钟的图。大家都在点头，脑子里想象的图各不相同。"
- en: "The Clicker"
  zh: "翻页笔"
- en: "On slide 3, the clicker dies. On slide 4, it comes back to life and skips ahead to slide 9."
  zh: "讲到第 3 页，翻页笔没电了。到第 4 页，它又活了过来，直接跳到了第 9 页。"
- en: "Laugh and walk to the laptop"
  zh: "笑一笑，走到电脑前翻页"
- en: "You joke that the clicker read ahead. The room laughs, and the rest of the talk feels like a conversation."
  zh: "你开玩笑说翻页笔偷偷预习了后面的内容。全场都笑了，剩下的报告就像在聊天。"
- en: "Ask the chair to click for you"
  zh: "请主持人帮你翻页"
- en: "You say \"next\" twenty-two times, and the rhythm works. The chair gets a laugh every time."
  zh: "你说了二十二次“下一页”，节奏居然还挺好。主持人每次都能逗笑大家。"
- en: "The chair clicks twice for every \"next\". You spend the talk saying \"back one, sorry\"."
  zh: "你每说一次“下一页”，主持人就点两下。整场报告你都在说“退一页，不好意思”。"
- en: "The Talk Before Yours"
  zh: "你前面那场报告"
- en: "The speaker before you presents almost the same result, on almost the same data. They finish to warm applause. You're up next."
  zh: "你前面的讲者讲了几乎一样的结果，用的几乎是一样的数据。台下掌声热烈。下一个就是你。"
- en: "Address it head-on"
  zh: "直面这个问题"
- en: "You open with: \"You just saw one way to do this. Here's why ours is different.\" Best opening line of the conference."
  zh: "你开场就说：“刚才大家看到了一种做法。下面讲讲我们的有什么不同。”这是整场会议最好的开场白。"
- en: "You try to explain the difference on the spot. It takes four minutes and two attempts, and you run out of time for your results."
  zh: "你临场解释两者的区别，用了四分钟、试了两次，结果没时间讲你的结果了。"
- en: "Give the talk as planned"
  zh: "按原计划讲"
- en: "You give it as rehearsed. In the Q&A, someone asks how it differs from the last talk. You were ready for that one, at least."
  zh: "你照排练的讲完。提问环节，有人问这和上一个报告有什么区别。至少这个问题你准备过。"
- en: "Slide 7"
  zh: "第 7 页"
- en: "You recognize the person in the front row: {prof}, whose method you call \"limited\" on slide 7. Slide 7 is coming."
  zh: "你认出了前排那个人：{prof}。你在第 7 页把对方的方法称作“有局限”。第 7 页马上就到了。"
- en: "Soften slide 7 on the fly"
  zh: "临场把第 7 页说得委婉点"
- en: "You call it \"a strong baseline with some open questions\". {prof} nods, and finds you afterward to talk about the open questions."
  zh: "你把它说成“很强的 baseline，还有一些开放问题”。{prof}点点头，会后专门来找你聊那些开放问题。"
- en: "You try to soften it and end up saying \"limited, but in a good way\". {prof} raises an eyebrow that will haunt you."
  zh: "你想说得委婉些，结果说成了“有局限，但是好的那种局限”。{prof}挑了挑眉，这个表情会在你脑海里挥之不去。"
- en: "Leave it as it is"
  zh: "照原样讲"
- en: "You show the numbers. {prof} studies the slide, then gives you a thumbs up. Respect, it turns out, is about the evidence."
  zh: "你把数字摆了出来。{prof}仔细看了看那页幻灯片，然后冲你竖了个大拇指。原来尊重靠的是证据。"
- en: "{prof} starts writing something during slide 7 and keeps writing until slide 12."
  zh: "从第 7 页开始，{prof}就在本子上写着什么，一直写到第 12 页。"
- en: "Your Advisor, Mouthing Along"
  zh: "导师在台下对口型"
- en: "{advisor} is in the third row, nodding at every slide. Then {advisor} starts mouthing the words along with you."
  zh: "{advisor}坐在第三排，每页幻灯片都在点头。接着，{advisor}开始跟着你一起对口型。"
- en: "Ignore it and keep going"
  zh: "别管，继续讲"
- en: "You stay in your own rhythm. Afterward, {advisor} says, \"You didn't need me there at all. Good.\""
  zh: "你稳住了自己的节奏。会后，{advisor}说：“你根本不需要我在场。很好。”"
- en: "You start matching {advisor}'s pace, which is faster than yours. You finish four minutes early and out of breath."
  zh: "你不知不觉跟上了 {advisor}的语速，比你自己的快。你提前四分钟讲完，气喘吁吁。"
- en: "Talk to someone else in the room"
  zh: "对着台下另一个人讲"
- en: "You find a friendly face in the fifth row and give the talk to them. They become the person you picture at every talk from now on."
  zh: "你在第五排找到一张友善的脸，整场报告都讲给对方听。从此以后，你每次做报告都会想象那个人坐在台下。"
- en: "The Mic Dies"
  zh: "麦克风坏了"
- en: "Two minutes in, the microphone dies. The room is big. Someone in the back row cups a hand to their ear."
  zh: "讲到第二分钟，麦克风没声了。会场很大。后排有人把手拢在耳边。"
- en: "Project like a stage actor"
  zh: "像话剧演员一样放开嗓子"
- en: "You give the whole talk at full volume, and the back row hears every word. Your voice will need a day to recover."
  zh: "你用最大音量讲完了全程，后排每个字都听得清清楚楚。你的嗓子得歇一天。"
- en: "You project for six minutes. Then your voice cracks, and you finish in a hoarse whisper that somehow makes everyone lean in."
  zh: "你扯着嗓子讲了六分钟，然后破音了。你用沙哑的气声讲完了剩下的部分，大家反而都凑近了听。"
- en: "Wait for the tech"
  zh: "等技术人员"
- en: "The tech arrives in four minutes with a new mic. You fill the time with a joke about microphones, and it lands."
  zh: "技术人员四分钟后拿着新麦克风赶到。你用一个关于麦克风的笑话填补了空档，效果不错。"
- en: "Fire Alarm"
  zh: "火警"
- en: "Halfway through your talk, the fire alarm goes off. Three hundred people file out into the parking lot. Slide 8 is still on the screen."
  zh: "你讲到一半，火警响了。三百个人排着队走到停车场。屏幕上还停着第 8 页。"
- en: "Finish the talk in the parking lot"
  zh: "在停车场把报告讲完"
- en: "You stand on a bench and give the rest of the talk to the crowd outside. It's the most memorable talk of the conference, and you didn't even have slides."
  zh: "你站到长椅上，对着外面的人群讲完了剩下的部分。这是整场会议最让人难忘的报告，而你连幻灯片都没有。"
- en: "You try. A truck goes by. Then another. People drift off toward the coffee."
  zh: "你试了。一辆卡车开过去，又一辆。人们慢慢散去找咖啡了。"
- en: "It was a burnt toaster. Twenty minutes later, you finish to a half-full room of very loyal listeners."
  zh: "原来是烤面包机烤糊了。二十分钟后，你对着半屋子非常忠实的听众讲完了报告。"
- en: "A Typo in the Title"
  zh: "标题里的拼写错误"
- en: "On your title slide, in letters a foot tall, there's a typo. You notice it the moment it goes up. So does the audience."
  zh: "你的标题页上，一尺高的大字里有个拼写错误。它一投上屏幕你就看见了。观众也看见了。"
- en: "Make a joke about it"
  zh: "拿它开个玩笑"
- en: "\"I promise the code has fewer typos,\" you say. Big laugh. The room is on your side from then on."
  zh: "“我保证代码里的错误比这少，”你说。全场大笑。从那一刻起，观众都站在你这边。"
- en: "Your joke about the typo somehow has a typo in it too. The laugh is mostly sympathy."
  zh: "你拿拼写错误开的玩笑，不知怎么也拼错了。笑声大多出于同情。"
- en: "Pretend it isn't there"
  zh: "假装没看见"
- en: "You power through. Someone posts a photo of the slide. It gets more likes than your paper."
  zh: "你硬着头皮讲完了。有人把那页幻灯片拍下来发到了网上，点赞比你的论文还多。"
- en: "The Poster Tube"
  zh: "海报筒"
- en: "You left your poster tube in the taxi. The poster session starts in two hours."
  zh: "你把海报筒落在了出租车上。海报展示两小时后开始。"
- en: "Print it at a copy shop"
  zh: "去打印店重新打印"
- en: "You find a shop that prints it on fabric. It looks better than the original, and it doesn't wrinkle."
  zh: "你找到一家能把海报印在布上的店。效果比原来的还好，而且不怕皱。"
- en: "The only open shop prints it on eleven sheets of regular paper. You tape them together. People call it the quilt."
  zh: "唯一开门的店只能用十一张普通纸打印。你把它们拼贴在一起，大家管它叫百衲被。"
- en: "Present it from your laptop"
  zh: "用笔记本电脑展示"
- en: "You hold your laptop up like a tray for three hours. Your arms won't forgive you, but people crowd in close to see."
  zh: "你像端托盘一样举着笔记本站了三个小时。你的胳膊不会原谅你，但大家都凑得很近来看。"
- en: "The Poster Next Door"
  zh: "隔壁的海报"
- en: "The poster next to yours is about the same problem. Its presenter, {stranger}, keeps glancing at your poster. You keep glancing at theirs."
  zh: "你隔壁那张海报做的是同一个问题。讲者 {stranger} 一直在偷瞄你的海报。你也一直在偷瞄对方的。"
- en: "Team up and present both"
  zh: "联手一起讲"
- en: "You start sending visitors to each other. By the end you're giving joint tours of the problem, and visitors stay twice as long."
  zh: "你们开始互相介绍参观者。到最后，你们干脆带着大家把这个问题从头讲到尾，参观者停留的时间翻了一倍。"
- en: "Compete for visitors"
  zh: "跟对方抢人"
- en: "Your pitch is sharper and your crowd is bigger. At the end, {stranger} comes over: \"Okay. Teach me your pitch.\""
  zh: "你的讲解更精炼，围观的人也更多。结束时，{stranger} 走过来说：“好吧。教教我你是怎么讲的。”"
- en: "Their crowd is bigger. Their poster has a QR code to a live demo. Next time, you think: a QR code."
  zh: "对方那边人更多。对方的海报上有个二维码，扫了能看实时演示。下次，你心想，也弄个二维码。"
- en: "Twenty-Five Minutes"
  zh: "二十五分钟"
- en: "A visitor arrives at your poster and stays. Twenty-five minutes. They have a theory about your work, and about the field, and about their own PhD."
  zh: "一位参观者走到你的海报前，然后就不走了。整整二十五分钟。对方对你的工作有一套理论，对这个领域也有，对自己的读博生涯还有一套。"
- en: "Politely wrap it up"
  zh: "礼貌地结束对话"
- en: "You find a gentle exit: you offer your email so you can keep talking later. Three people who were waiting step up."
  zh: "你找到一个体面的台阶：留个邮箱，以后再聊。三个一直在等的人终于凑了上来。"
- en: "Every exit you try, they take as an invitation for another story. You lose four visitors."
  zh: "你每找一个台阶，对方都当成再讲一个故事的邀请。你错过了四位参观者。"
- en: "Let them talk"
  zh: "让对方讲"
- en: "Somewhere around minute twenty, they say something genuinely brilliant. You write it down. It ends up in your next paper."
  zh: "聊到第二十分钟左右，对方说了一句真正精彩的话。你记了下来，它最后写进了你的下一篇论文。"
- en: "Explanation Number Forty"
  zh: "第四十遍讲解"
- en: "Two hours into the session, you've explained your poster forty times. Your voice is starting to go."
  zh: "海报展示进行了两个小时，你已经讲了四十遍。嗓子开始不行了。"
- en: "Keep pitching"
  zh: "接着讲"
- en: "You make it to the end on throat lozenges and willpower. Forty-three explanations, a personal record."
  zh: "你靠润喉糖和意志力撑到了最后。四十三遍讲解，创个人纪录。"
- en: "Your voice gives out at explanation thirty-eight. You finish by pointing at things on the poster and nodding."
  zh: "讲到第三十八遍，你的嗓子彻底哑了。最后你只能指着海报上的内容点头。"
- en: "Get {labmate} to take a shift"
  zh: "请 {labmate} 替你一班"
- en: "{labmate} learns your pitch in five minutes and delivers it with more enthusiasm than you ever have. Visitors love it."
  zh: "{labmate} 五分钟就学会了你的讲解，讲得比你自己还有激情。参观者都很喜欢。"
- en: "The Best Paper Nobody Saw"
  zh: "没人看到的最佳论文"
- en: "In the last session, eleven people in a big room, a student named {stranger} presents a small, perfect paper. Nobody important is there to see it."
  zh: "在最后一场，偌大的会议室里只有十一个人，一个叫 {stranger} 的学生讲了一篇小而完美的论文。没有大人物在场。"
- en: "Tell them it was great"
  zh: "告诉对方讲得很好"
- en: "You find {stranger} after the talk and say it was the best paper you saw all week. They look like they might cry. You've made someone's conference."
  zh: "报告结束后你找到 {stranger}，说这是你这周看到的最好的论文。对方看起来快哭了。你成就了别人的这场会议。"
- en: "Post about it"
  zh: "发帖推荐一下"
- en: "Your post gets more attention than the talk did. A week later, {stranger} emails you: three labs have reached out."
  zh: "你的帖子比那场报告本身还受关注。一周后，{stranger} 给你发邮件：已经有三个组联系了自己。"
- en: "Gate 34"
  zh: "34 号登机口"
- en: "Your flight is delayed three hours. The gate is full of people from the conference, laptops open, typing furiously."
  zh: "你的航班延误了三个小时。登机口坐满了开会的人，个个开着电脑疯狂打字。"
- en: "Join them and write"
  zh: "加入他们，一起写"
- en: "You draft the introduction of your next paper at gate 34. It's the best intro you've ever written, which says something about airports."
  zh: "你在 34 号登机口写完了下一篇论文的引言初稿。这是你写过最好的引言，机场果然有点东西。"
- en: "Sleep"
  zh: "睡觉"
- en: "You sleep on your backpack and wake up with a strap pattern on your face, just as your group starts boarding."
  zh: "你枕着背包睡着了，醒来时脸上印着背带的花纹，刚好赶上你那组开始登机。"
- en: "Start a conversation"
  zh: "找人聊天"
- en: "Gate 34 turns into a mini-workshop. Someone suggests making it a real one next year."
  zh: "34 号登机口变成了一场迷你 workshop。有人提议明年办个正式的。"
- en: "We Should Keep in Touch"
  zh: "保持联系"
- en: "On the last morning, you run into {stranger}, whom you met on Monday. You both say you should keep in touch. People always say that."
  zh: "最后一天早上，你遇到了周一认识的 {stranger}。你们都说要保持联系。人们总这么说。"
- en: "Set a date right now"
  zh: "当场约个时间"
- en: "You put a video call on the calendar on the spot. Two months later it's still happening, monthly. It's turning into a paper."
  zh: "你们当场在日历上约了一次视频通话。两个月后，通话还在继续，每月一次。快要变成一篇论文了。"
- en: "Say \"definitely\" and mean it, vaguely"
  zh: "说“一定”，但说得很含糊"
- en: "You both say \"definitely\". You both mean it. Neither of you writes first."
  zh: "你们都说了“一定”。你们都是真心的。但谁也没先发邮件。"
