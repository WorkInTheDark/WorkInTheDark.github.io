# zh translations for events/writing (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "The Bug After the Deadline"
  zh: "截稿后的 bug"
- en: "Three days after submitting {paper}, you find a bug in your evaluation script: it counted some test examples twice. Fixed, your gain over the best baseline drops from 4.1 points to 1.9."
  zh: "投完 {paper} 三天后，你在评测脚本里发现一个 bug：有些测试样本被算了两次。修好之后，你相对最强 baseline 的提升从 4.1 个点掉到了 1.9。"
- en: "Rerunning one table for fun, you find a bug in your analysis script. The corrected numbers still support {paper}, but the headline gain is half of what the submission says."
  zh: "你一时兴起重跑了一张表，结果在分析脚本里发现一个 bug。修正后的数字仍然支持 {paper} 的结论，但主打的提升只有投稿里写的一半。"
- en: "Email the program chairs tonight"
  zh: "今晚就给程序主席写信"
- en: "The chairs thank you and pass the correction to the reviewers. Your advisor replies: \"This is exactly right. Thank you.\" It stings less than you expected."
  zh: "程序主席向你道谢，并把更正转给了审稿人。导师回复：“做得完全正确，谢谢你。”这一下没你想象的那么疼。"
- en: "Disclose it in the author response"
  zh: "在作者回复里主动说明"
- en: "You open the response with the correction and the new numbers. Reviewer 1 thanks you for the transparency, and the smaller gain still holds."
  zh: "你在回复开头就写明了更正和新数字。1 号审稿人感谢你的坦诚，缩水后的提升依然站得住。"
- en: "The correction ends up in paragraph four. Reviewer 2 finds it there and now doubts every number in the paper."
  zh: "更正被埋在了第四段。2 号审稿人在那儿找到了它，现在开始怀疑论文里的每一个数字。"
- en: "Fix it in the camera-ready, tell nobody"
  zh: "等终稿再悄悄改，谁也不说"
- en: "You add \"update Table 2\" to your to-do list and tell nobody. It sits there like a pebble in your shoe."
  zh: "你在待办清单里加了一条“更新 Table 2”，谁也没告诉。它就待在那儿，像鞋里的一粒小石子，一直硌着你。"
- en: "\"It's only two points.\" Let it go"
  zh: "“才两个点而已。”算了"
- en: "You close the script. The paper is under review, and the numbers are what they are. Something about that sentence keeps bothering you."
  zh: "你关掉了脚本。论文在审，数字就是这样了。可这句话总有哪里让你不踏实。"
- en: "Spot the Difference"
  zh: "找不同"
- en: "A careful reader emails you. The numbers in Table 2 of your latest version differ from the ones reviewers saw, and nothing in the paper says why."
  zh: "一位细心的读者给你发来邮件：你最新版本 Table 2 里的数字和审稿人看到的不一样，论文里却没有任何解释。"
- en: "Add a correction note today"
  zh: "今天就加更正说明"
- en: "Two sentences and a footnote explain the fix. It costs you a little pride and earns you some respect."
  zh: "两句话加一个脚注，讲清了这次修正。你丢了一点面子，换回了一些尊重。"
- en: "Reply privately and explain"
  zh: "私下回信解释"
- en: "They accept your explanation and thank you. You wonder how many readers noticed and didn't write."
  zh: "对方接受了你的解释，还谢了你。你不禁想，有多少读者发现了却没写信。"
- en: "Leave the email unanswered"
  zh: "不回这封邮件"
- en: "Their second email copies your advisor. Your advisor's note to you afterwards is very short."
  zh: "对方的第二封邮件抄送了你导师。事后导师给你的留言非常短。"
- en: "The Polite Email"
  zh: "一封客气的邮件"
- en: "A student at another university ran your released code and got numbers two points below your paper. Their email is very polite, and they attached their logs."
  zh: "另一所大学的一个学生跑了你公开的代码，结果比论文里低两个点。邮件写得非常客气，还附上了运行日志。"
- en: "Thank them and post a correction"
  zh: "道谢并发布更正"
- en: "The correction goes up, late, with their name in it. They cite you anyway."
  zh: "更正发出来了，虽然晚了点，里面写上了对方的名字。对方照样引用了你。"
- en: "Tell your advisor first"
  zh: "先告诉导师"
- en: "Your advisor is quiet for a moment, then helps you write the correction. \"Next time, tell me the day you find it.\""
  zh: "导师沉默了一会儿，然后帮你一起写了更正。“下次发现的当天就告诉我。”"
- en: "Blame the random seeds"
  zh: "甩锅给随机种子"
- en: "They run ten seeds and send you a plot. Their paper cites yours, in a footnote about reproducibility."
  zh: "对方跑了十个种子，给你发来一张图。后来对方的论文引用了你，在一个关于可复现性的脚注里。"
- en: "Christmas in the Lab"
  zh: "实验室里过圣诞"
- en: "Winter break. The building is empty, and for once so is the GPU queue. {project} still needs two experiments and half a rewrite."
  zh: "寒假。楼里空了，难得 GPU 队列也空了。{project} 还差两个实验，外加重写一半。"
- en: "Your family asks when you're coming home for the holidays. You look at {project}, then at the empty GPU queue, then back at the message."
  zh: "家里问你放假什么时候回来。你看看 {project}，又看看空荡荡的 GPU 队列，再看回那条消息。"
- en: "Spend the whole break on it"
  zh: "搭上整个假期"
- en: "You run experiments by day and rewrite by night, with family calls on mute. By New Year the paper is much better, and you are much more tired."
  zh: "你白天跑实验，晚上改论文，和家里视频时都开着静音。到新年时，论文好了很多，你也累了很多。"
- en: "Work mornings, family evenings"
  zh: "上午干活，晚上陪家人"
- en: "The experiments run while you eat dinner. Progress is slower, but you will remember that the holidays happened."
  zh: "你吃晚饭的时候，实验在跑。进度慢一些，但你会记得这个假期确实过过。"
- en: "Take the whole break off"
  zh: "彻底休假"
- en: "You leave the laptop closed for two weeks and eat too much. You come back rested, with the same paper and a clearer idea of what it needs."
  zh: "你两周没开电脑，还吃撑了。回来时精神饱满，论文还是那篇，但你更清楚它缺什么了。"
- en: "Run jobs while everyone sleeps"
  zh: "趁大家睡觉时跑任务"
- en: "Night Owl"
  zh: "夜猫子"
- en: "Jobs launch at 1 am and finish by breakfast. Your family thinks you're on vacation. The cluster knows better."
  zh: "任务凌晨 1 点提交，早饭前跑完。家里以为你在度假。集群心里有数。"
- en: "Twelve Into Eight"
  zh: "12 页塞进 8 页"
- en: "The draft of {project} is 12 pages. {venue} allows 8. The deadline is tomorrow night."
  zh: "{project} 的草稿有 12 页。{venue} 只允许 8 页。明晚截稿。"
- en: "You compile the final draft and scroll to the end: page 12. The limit is 8."
  zh: "你编译了定稿前的最后一版，拉到末尾：第 12 页。上限是 8 页。"
- en: "Cut it sentence by sentence"
  zh: "一句一句地删"
- en: "Eight pages, and somehow clearer than twelve. Half the cuts were sentences that said the same thing twice."
  zh: "8 页，不知怎么反而比 12 页更清楚。删掉的句子里，有一半是把同一件事说了两遍。"
- en: "It fits in eight pages, but Section 4 lost the sentences that explained it. Now nobody, including you, can follow it."
  zh: "塞进了 8 页，但 Section 4 用来解释的句子全被删了。现在没人看得懂，包括你自己。"
- en: "Move everything to the appendix"
  zh: "全扔进附录"
- en: "The main paper fits. Reviewers don't have to read the appendix, and they won't."
  zh: "正文塞下了。审稿人不必看附录，他们也不会看。"
- en: "Shrink the fonts and the spacing"
  zh: "缩字号，压行距"
- en: "It fits. Table 2 is now in 7-point type, and Figure 3 needs a magnifying glass."
  zh: "塞下了。Table 2 现在是 7pt 的字，看 Figure 3 得用放大镜。"
- en: "Rewrite it in half the words"
  zh: "用一半的字数重写"
- en: "Wordsmith"
  zh: "笔杆子"
- en: "You cut every paragraph in half, and it reads better than the long version ever did."
  zh: "你把每一段都砍掉一半，读起来比长版本任何时候都顺。"
- en: "Overleaf Is Down"
  zh: "Overleaf 挂了"
- en: "Two hours before the {venue} deadline, Overleaf stops loading. The status page says \"investigating\". So does everyone in your lab chat."
  zh: "离 {venue} 截稿还有两小时，Overleaf 打不开了。状态页写着“正在调查”。你们组群里的每个人也都在“调查”。"
- en: "You click Recompile and nothing happens, so you refresh. Overleaf is down, and the {venue} deadline is in two hours."
  zh: "你点了 Recompile，没反应，于是刷新页面。Overleaf 挂了，而 {venue} 两小时后截稿。"
- en: "Compile locally from your last sync"
  zh: "用上次同步的版本本地编译"
- en: "Your last sync was 20 minutes ago. You finish in a local editor and submit with time to spare."
  zh: "上次同步是 20 分钟前。你在本地编辑器里改完，从容提交。"
- en: "Your local copy is from last Tuesday. You redo a week of edits from memory and submit at 11:58 pm."
  zh: "你本地的版本还是上周二的。你凭记忆把一周的修改重做了一遍，晚上 11:58 交了上去。"
- en: "Wait and keep refreshing"
  zh: "等着，不停刷新"
- en: "It comes back after 50 minutes. You spend the last hour fixing only what matters, which turns out to be a skill."
  zh: "50 分钟后恢复了。最后一小时你只改真正要紧的地方，原来这也是一种本事。"
- en: "Submit this morning's PDF"
  zh: "交今天早上的 PDF"
- en: "Submitted at 10:02 pm, minus tonight's fixes. You go to bed while everyone else refreshes."
  zh: "晚上 10:02 交了，只是少了今晚的修改。别人还在刷新，你已经上床睡觉了。"
- en: "Build it from your own git mirror"
  zh: "用自己的 git 镜像编译"
- en: "Code Wizard"
  zh: "代码大神"
- en: "The mirror you set up two years ago, for exactly this night, is five minutes behind. You submit calmly."
  zh: "两年前你就为这样的夜晚搭好了镜像，现在它只落后五分钟。你淡定地交了稿。"
- en: "11:45 pm"
  zh: "晚上 11:45"
- en: "At 11:45 pm, {labmate} pushes a big change to {project}: a rewritten Section 4 and a new results table. The deadline is midnight."
  zh: "晚上 11:45，{labmate} 给 {project} 推了一大坨修改：重写了 Section 4，还加了一张新的结果表。午夜截稿。"
- en: "Fifteen minutes before the deadline, the edit history lights up. {labmate} is rewriting your related work, live."
  zh: "离截稿还有十五分钟，编辑记录突然亮成一片。{labmate} 正在实时重写你的相关工作。"
- en: "Keep every change"
  zh: "保留所有改动"
- en: "It compiles, and the new version is honestly better than yours."
  zh: "编译通过了，而且说实话，新版比你写的好。"
- en: "It compiles with 14 undefined references. Every cell of the new table reads \"??\"."
  zh: "编译倒是过了，但有 14 个未定义引用。新表格的每一格都显示“??”。"
- en: "Revert to your version"
  zh: "回退到你的版本"
- en: "You submit your version at 11:57. {labmate} says \"no worries\" in a tone that suggests worries."
  zh: "你在 11:57 交了自己的版本。{labmate} 说了句“没事”，但语气听起来很有事。"
- en: "Merge only what you can check"
  zh: "只合并能核对的部分"
- en: "You read each change once and keep about half. You submit at 11:59:40, heart racing."
  zh: "每处修改你都过了一遍，留下大约一半。你在 11:59:40 交了稿，心跳快得要命。"
- en: "48 More Hours"
  zh: "再给 48 小时"
- en: "At 9 pm, the chairs extend the {venue} deadline by 48 hours. {project} was nearly done, and now it doesn't have to be."
  zh: "晚上 9 点，程序主席宣布 {venue} 截稿延期 48 小时。{project} 本来都快写完了，现在不用急着写完了。"
- en: "Use all 48 hours"
  zh: "用满 48 小时"
- en: "You use all 48 hours. The paper gets better and you get worse."
  zh: "你用满了 48 小时。论文越改越好，人越熬越差。"
- en: "Polish for one day, then sleep"
  zh: "打磨一天，然后睡觉"
- en: "After a day of fixes and a full night's sleep, you submit with 20 hours to spare. Nobody in your lab believes you."
  zh: "改了一天，又睡了个整觉，你提前 20 小时交了稿。组里没一个人信。"
- en: "Submit now and go to bed"
  zh: "现在就交，然后睡觉"
- en: "You submit at 9:15 pm and sleep for eleven hours. Everyone else uses all 48."
  zh: "你晚上 9:15 交了稿，睡了十一个小时。其他人都用满了 48 小时。"
- en: "Start the real work at hour 40"
  zh: "第 40 小时再正式开工"
- en: "Procrastinator"
  zh: "拖延大师"
- en: "Forty hours of feeling that you have time, then eight hours of doing more than you did all month."
  zh: "前四十个小时都觉得时间还多，最后八个小时干的活比整个月加起来还多。"
- en: "Comments, Six Hours Out"
  zh: "截稿前六小时的批注"
- en: "Six hours before the deadline, {advisor}'s comments on {project} arrive: {roll:30-60} of them, three starting with \"Big question:\"."
  zh: "截稿前六小时，{advisor}对 {project} 的批注来了：一共 {roll:30-60} 条，其中三条以“大问题：”开头。"
- en: "Address every comment"
  zh: "改完每条批注"
- en: "You get through all of them with ten minutes to spare. The big questions were the right questions."
  zh: "你在截稿前十分钟改完了所有批注。那几个大问题，问得都对。"
- en: "Fix the big questions only"
  zh: "只改大问题"
- en: "You fix the three that matter and leave the commas for the camera-ready. Your advisor agrees with your triage."
  zh: "你改了最要紧的三条，逗号之类的留到终稿再说。导师认同你的取舍。"
- en: "You fix three comments carefully. Comment 17, which you skipped, was the important one."
  zh: "你仔细改了三条批注。被你跳过的第 17 条，才是真正重要的那条。"
- en: "\"Will fix in the camera-ready!\""
  zh: "“终稿再改！”"
- en: "You submit as is. Your advisor replies \"ok.\" Just \"ok.\""
  zh: "你原样交了。导师回复：“好。”就一个“好。”"
- en: "What If the Title Were a Question?"
  zh: "标题改成问句怎么样？"
- en: "An hour before the deadline, {advisor} sends a message: \"What if the title were a question?\""
  zh: "截稿前一小时，{advisor}发来消息：“标题改成问句怎么样？”"
- en: "Fifty minutes to go. {advisor} writes: \"New title idea. Hear me out.\" It has a colon and a pun."
  zh: "还剩五十分钟。{advisor}写道：“想到个新标题，你先听我说完。”这个标题有冒号，还有个双关。"
- en: "Take it and fix every mention"
  zh: "采纳，改掉每一处"
- en: "The new title is catchier. You change it in six places, then find a seventh."
  zh: "新标题更抓人。你改了六处，然后又发现了第七处。"
- en: "\"Can we keep the current one?\""
  zh: "“能不能还用现在这个？”"
- en: "\"Fair. It's your paper.\" You keep your title, and your advisor seems to respect you a little more for asking."
  zh: "“有道理，论文是你的。”你保住了原标题，导师似乎还因为你敢开口，对你多了一分尊重。"
- en: "\"Ok.\" The period does a lot of work."
  zh: "“好。”这个句号很有分量。"
- en: "Promise to revisit it later"
  zh: "答应以后再议"
- en: "You agree to change it for the camera-ready. You both know nobody changes the title for the camera-ready."
  zh: "你答应终稿时再改。你们俩都知道，没人会在终稿里改标题。"
- en: "Service Unavailable"
  zh: "服务不可用"
- en: "At 11:58 pm you click Submit. The {venue} submission system shows a spinning wheel, then \"503 Service Unavailable\"."
  zh: "晚上 11:58，你点了 Submit。{venue} 的投稿系统转了一会儿圈，然后显示“503 Service Unavailable”。"
- en: "Refresh and submit again"
  zh: "刷新，再交一次"
- en: "It goes through at 12:00:41 and counts anyway, because the server's clock was down too."
  zh: "12:00:41 交上去了，而且照样算数，因为服务器的时钟也一起挂了。"
- en: "It goes through at 12:03, with final_v2.pdf instead of final_v3.pdf. Your hands were shaking."
  zh: "12:03 交上去了，可传的是 final_v2.pdf，不是 final_v3.pdf。你的手一直在抖。"
- en: "Email your PDF to the chairs"
  zh: "把 PDF 发邮件给程序主席"
- en: "A form reply at 12:20 am: everything submitted during the outage will be accepted. Hundreds of people got the same reply."
  zh: "凌晨 12:20 收到一封统一回复：宕机期间提交的稿件都会受理。几百个人收到了同样的回复。"
- en: "Post the error screenshot online"
  zh: "把报错截图发到网上"
- en: "Two thousand people post the same screenshot. The chairs add an hour, and you spend most of it reading the replies."
  zh: "两千个人发了同一张截图。程序主席延长了一小时，而你大半时间都在刷评论。"
- en: "Limitations, 3 am"
  zh: "凌晨 3 点的 Limitations"
- en: "It's 3 am. {venue} requires a Limitations section, and yours is a heading with nothing under it."
  zh: "凌晨 3 点。{venue} 要求写一节 Limitations，而你的只有一个标题，下面空空如也。"
- en: "Write honest, specific limitations"
  zh: "老实写具体的局限"
- en: "You list them plainly: small sample, one language, one site. The paper is more convincing for it."
  zh: "你直白地列了出来：样本小，只有一种语言，只在一个地点。论文反而因此更有说服力。"
- en: "It's honest and slightly unhinged. One sentence starts with \"Frankly,\", which you'll fix in the camera-ready."
  zh: "写得很诚实，也有点放飞自我。有一句以“Frankly,”开头，终稿时你得改掉。"
- en: "Paste the generic version"
  zh: "贴上万能模板"
- en: "\"Our method may not generalize to all settings.\" Reviewers have read that sentence four hundred times."
  zh: "“我们的方法可能无法推广到所有场景。”这句话审稿人已经读过四百遍了。"
- en: "Turn each limitation into future work"
  zh: "把每条局限都改成未来工作"
- en: "Every weakness is now an \"exciting direction\". Reviewers have seen that trick before, too."
  zh: "每个缺点现在都成了“令人兴奋的研究方向”。这招审稿人也见过。"
- en: "Sleep four hours, write it at 7 am"
  zh: "先睡四小时，早上 7 点再写"
- en: "After four hours of sleep, the section takes 40 minutes, and it's the clearest page in the paper."
  zh: "睡了四个小时之后，这一节只花了 40 分钟，成了全文最清楚的一页。"
- en: "You sleep through two alarms and write the whole section in 12 minutes, mostly as bullet points."
  zh: "你睡过了两个闹钟，最后只用 12 分钟写完整节，大部分还是列表。"
- en: "Name Already Taken"
  zh: "名字被占了"
- en: "An hour before submitting {project}, you finally search your method's acronym. Four papers already use it, and so does a robot vacuum."
  zh: "投 {project} 前一小时，你终于搜了一下自己方法的缩写。已经有四篇论文用过了，还有一款扫地机器人。"
- en: "Invent a new acronym, fast"
  zh: "赶紧想个新缩写"
- en: "Twenty minutes of backronyms later, you have a name nobody has used. It almost spells a word."
  zh: "硬凑了二十分钟全称，你终于有了一个没人用过的名字。拼出来差不多算个单词。"
- en: "The best you can manage has a hyphen and the number 2 in it. It is unique, at least."
  zh: "你能想到最好的一个，里面有连字符，还有个数字 2。至少独一无二。"
- en: "Keep it and hope nobody checks"
  zh: "照用，祈祷没人去查"
- en: "Somebody will check. A reviewer will write: \"Not to be confused with the four other methods of the same name.\""
  zh: "总会有人查的。某位审稿人会写：“请勿与另外四个同名方法混淆。”"
- en: "Drop it and say \"our method\""
  zh: "不要缩写，就叫“我们的方法”"
- en: "Without the acronym, the paper reads a little plainer and a little clearer."
  zh: "没了缩写，论文读起来朴素了一点，也清楚了一点。"
- en: "Anonymous, Mostly"
  zh: "基本匿名"
- en: "Rereading the submitted PDF, you click the code link. It opens your personal GitHub page, with your photo and a README thanking your advisor."
  zh: "重读投稿的 PDF 时，你点开了代码链接。跳出来的是你的个人 GitHub 主页，有你的照片，还有一个感谢导师的 README。"
- en: "An hour after submitting {paper}, you realize the footnote with the code link was never anonymized. It points straight to your GitHub account."
  zh: "投完 {paper} 一小时后，你发现放代码链接的那个脚注根本没匿名。它直接指向你的 GitHub 账号。"
- en: "Take the repo down tonight"
  zh: "今晚就下架仓库"
- en: "The link now leads to a 404. One reviewer will write \"code not available\", which is fair."
  zh: "链接现在打开是 404。会有审稿人写“代码不可用”，这也说得过去。"
- en: "Scrub the repo and rename the account"
  zh: "清理仓库，账号改名"
- en: "You rename the account and wipe its history, down to a README that thanks nobody. The link now belongs to a stranger."
  zh: "你给账号改了名，清空了历史记录，只剩一个谁都不感谢的 README。这个链接现在属于一个陌生人。"
- en: "A search engine had already cached the old page, and the program chairs find it before any reviewer does. Desk rejected."
  zh: "搜索引擎早就缓存了旧页面，程序主席比任何审稿人都先发现了它。直接拒稿。"
- en: "Email the program chairs"
  zh: "给程序主席写信"
- en: "The chairs reply within a day: send an anonymous link, and they'll pass it on to the reviewers."
  zh: "程序主席一天内就回了信：发一个匿名链接过来，他们会转给审稿人。"
- en: "The chairs thank you for flagging it, then apply the policy. Desk rejected, very politely."
  zh: "程序主席感谢你主动报告，然后照章办事。直接拒稿，非常客气。"
- en: "Wrong Track"
  zh: "投错 track"
- en: "The confirmation email arrives, and you read the track name twice. You picked the one just above the one you meant."
  zh: "确认邮件到了，你把 track 名称读了两遍。你选中的是目标 track 正上方的那个。"
- en: "Rereading the confirmation, you notice that {paper} went to the theory track. It contains no theorems."
  zh: "重读确认邮件时，你发现 {paper} 投到了理论 track。里面一个定理都没有。"
- en: "Email the chairs to move it"
  zh: "写信请程序主席改过来"
- en: "Moved within a day, with a smiley face. The chairs see this every cycle."
  zh: "一天内就改好了，还附了个笑脸。程序主席每一轮都会遇到这种事。"
- en: "Reviewers were already assigned, and the chairs are sorry. The reviewers will be sorry too."
  zh: "审稿人已经分配好了，程序主席深表遗憾。审稿人们待会儿也会很遗憾。"
- en: "Leave it there for fresh eyes"
  zh: "就放那儿，换个视角"
- en: "The out-of-area reviewers find the paper refreshing. One calls it \"a welcome change of pace\"."
  zh: "领域外的审稿人觉得这篇论文很新鲜。其中一位称它“令人耳目一新”。"
- en: "Reviewer 1 writes: \"This does not belong in this track.\" Reviewer 1 is correct."
  zh: "1 号审稿人写道：“本文不属于这个 track。”1 号审稿人说得对。"
- en: "Is That How You Spell It?"
  zh: "名字是这么拼的吗？"
- en: "The camera-ready is in. Then {labmate}, your co-author, messages: \"Small thing. My name is spelled wrong.\" It is, in the proceedings metadata."
  zh: "终稿交了。然后你的合作者 {labmate} 发来消息：“小事一桩，我名字拼错了。”确实，论文集的元数据里拼错了。"
- en: "Email the publication chairs"
  zh: "给出版主席写信"
- en: "Fixed within a day. The chairs say they get this email a lot, which helps a little."
  zh: "一天内就改好了。出版主席说经常收到这种邮件，这让你好受了一点。"
- en: "The PDF gets fixed, but the metadata doesn't. Search engines will remember both spellings forever."
  zh: "PDF 改过来了，元数据没改。搜索引擎会永远记住两种拼法。"
- en: "Apologize over lunch, then email"
  zh: "请顿午饭道歉，再写邮件"
- en: "The chairs fix it eventually. The lunch, slightly awkward, fixes the friendship right away."
  zh: "出版主席最后还是改了。那顿午饭虽然有点尴尬，却当场修好了你们的交情。"
- en: "Fix the preprint and move on"
  zh: "改好预印本，翻篇"
- en: "The preprint is right, and the official version is wrong forever. {labmate} says it's fine, twice."
  zh: "预印本是对的，正式版永远是错的。{labmate} 说了两遍“没关系”。"
- en: "Langauge"
  zh: "Langauge"
- en: "The camera-ready is submitted. You open the PDF to admire it, and the first sentence of the abstract says \"langauge\"."
  zh: "终稿交了。你打开 PDF 想欣赏一下，摘要第一句就写着“langauge”。"
- en: "Final version, uploaded. You flip through it once more and find \"Tabel 3\" on page 6, in a sentence you've read forty times."
  zh: "最终版，已上传。你又翻了一遍，在第 6 页发现了“Tabel 3”，就在一句你读过四十遍的话里。"
- en: "Email the publication chair"
  zh: "联系出版主席"
- en: "The chair lets you upload a fixed PDF, with a gentle note that the window closes tomorrow."
  zh: "出版主席允许你重新上传修好的 PDF，还温和地提醒你，通道明天关闭。"
- en: "The proceedings are final. The typo is now part of the permanent scientific record."
  zh: "论文集已经定稿。这个拼写错误从此成了永久科学记录的一部分。"
- en: "Fix the preprint and let it go"
  zh: "改好预印本，随它去吧"
- en: "The preprint is perfect. The official version has character."
  zh: "预印本完美无缺。正式版则很有个性。"
- en: "Fix it, and every orphan word too"
  zh: "改掉，顺便消灭所有孤词"
- en: "One typo and 23 orphan words later, not a single paragraph ends on a lonely word. You print page 1 just to look at it."
  zh: "改了一个拼写错误和 23 个孤词，再没有一段以孤零零的一个词结尾。你把第 1 页打印出来，就为了欣赏它。"
- en: "You fix 31 orphan words. Each fix creates a new one somewhere else. At 2 am, you stop."
  zh: "你改掉了 31 个孤词，可每改一个，别处就冒出一个新的。凌晨 2 点，你停手了。"
- en: "Figure 1, Day 3"
  zh: "Figure 1，第 3 天"
- en: "Figure 1 for {project} is on its third day. It has been a pipeline diagram, a comic strip, and a pipeline diagram again."
  zh: "{project} 的 Figure 1 已经画到第三天了。它当过流程图，当过四格漫画，现在又变回了流程图。"
- en: "You've spent three days on Figure 1. It's two boxes and an arrow, and it's still not right."
  zh: "Figure 1 你已经画了三天。就两个框加一个箭头，还是不对劲。"
- en: "Give it one more day"
  zh: "再给它一天"
- en: "On day four it clicks: one picture that explains the whole paper. Reviewers will look at it before they read a word."
  zh: "第四天终于开窍了：一张图讲清整篇论文。审稿人还没读一个字，就会先看它。"
- en: "Ship the version from day one"
  zh: "就用第一天那版"
- en: "Nobody has ever rejected a paper over a fine Figure 1, probably."
  zh: "应该没人会因为 Figure 1 只是还行就拒稿吧，大概。"
- en: "Ask {labmate} for a design eye"
  zh: "请 {labmate} 帮忙看看设计"
- en: "{labmate} moves one arrow and deletes two boxes, and suddenly the figure makes sense."
  zh: "{labmate} 挪了一个箭头，删了两个框，这张图一下子就讲通了。"
- en: "{labmate} suggests making it 3D. You thank them and lose another afternoon talking them out of it."
  zh: "{labmate} 建议改成 3D 的。你道了谢，又搭进去一个下午才把对方劝住。"
- en: "Introduction, Version 7"
  zh: "引言，第 7 版"
- en: "You open intro_v7.tex, then, out of curiosity, intro_v1.tex. Version one was better."
  zh: "你打开 intro_v7.tex，又出于好奇打开了 intro_v1.tex。第一版更好。"
- en: "The seventh rewrite of the introduction to {project} is done. You reread the first one, and it was better."
  zh: "{project} 的引言第七次重写完成。你重读了第一版，还是第一版好。"
- en: "Go back to version one"
  zh: "回到第一版"
- en: "Seven drafts to learn that the first one was right. At least now you know why it's right."
  zh: "写了七稿，才发现第一稿是对的。至少现在你知道它为什么对了。"
- en: "Merge the best of all seven"
  zh: "集七版之所长"
- en: "Version one's argument, version five's opening line, version seven's citations. It's the best one yet."
  zh: "第一版的论证，第五版的开头，第七版的引用。这是迄今最好的一版。"
- en: "Version eight reads like seven people wrote it, which, in a way, they did."
  zh: "第八版读起来像是七个人写的。某种意义上，确实如此。"
- en: "Start version eight"
  zh: "开写第八版"
- en: "Version eight is slightly better than version one. It took another week."
  zh: "第八版比第一版稍微好一点。又花了一周。"
- en: "Abstract Due First"
  zh: "摘要要先交"
- en: "Surprise: the abstract for {project} is due a week before the paper. The experiments aren't finished, so neither is the story."
  zh: "惊喜：{project} 的摘要要比论文早一周交。实验还没做完，故事自然也还没讲圆。"
- en: "The submission site wants a title and abstract for {project} by Friday, a week before the full paper. You have a title."
  zh: "投稿系统要求周五前提交 {project} 的标题和摘要，比全文早一周。标题你倒是有。"
- en: "Submit a placeholder abstract"
  zh: "先交个占位摘要"
- en: "\"We study an important problem and find interesting results.\" Everyone does this, and you can rewrite it on deadline night."
  zh: "“我们研究了一个重要问题，并得到了有趣的结果。”大家都这么干，截稿那晚再重写就行。"
- en: "Write the real abstract now"
  zh: "现在就写正式摘要"
- en: "Two hundred words take a whole day and force you to say what's actually new. Now you know what the paper is about."
  zh: "两百个词花了一整天，逼着你说清楚到底新在哪里。现在你知道这篇论文讲什么了。"
- en: "Write the abstract you hope is true"
  zh: "写一份你希望成真的摘要"
- en: "The results come in and match it almost word for word. You decide you planned it that way."
  zh: "结果出来了，和摘要几乎一字不差。你决定就说这是你计划好的。"
- en: "The results come in and disagree with paragraph two. You rewrite the abstract, then the paper around it."
  zh: "结果出来了，和第二段对不上。你重写了摘要，又围绕它重写了论文。"
- en: "Related Work, Page Two"
  zh: "相关工作，第二页"
- en: "The related work section of {project} is now two pages long. It cites {roll:80-110} papers, including one you've only read the title of."
  zh: "{project} 的相关工作已经写到两页了，引用了 {roll:80-110} 篇论文，其中一篇你只读过标题。"
- en: "You meant to write one paragraph of related work for {project}. It's two pages now, with subsections."
  zh: "你本来只想给 {project} 写一段相关工作。现在它有两页了，还分了小节。"
- en: "Cut it to half a page"
  zh: "砍到半页"
- en: "You sort it into three themes, one paragraph each, and end on what nobody has done yet. Now the gap is obvious."
  zh: "你把它归成三个主题，每个一段，最后落到还没人做过的事上。研究空白一目了然。"
- en: "Half a page, and you cut the one paper most likely to be your reviewer's."
  zh: "砍到了半页，可你删掉的那篇，恰恰最可能是你审稿人写的。"
- en: "Keep all two pages"
  zh: "保留全部两页"
- en: "Every reviewer will find their own paper in there. The method now starts on page five."
  zh: "每位审稿人都能在里面找到自己的论文。方法部分现在从第五页才开始。"
- en: "Turn it into a comparison table"
  zh: "改成对比表格"
- en: "The table takes a day. Of thirteen rows, yours is the only one with every checkmark."
  zh: "表格做了一天。十三行里，只有你那一行全是勾。"
- en: "Anywhere on Earth"
  zh: "AoE 时间"
- en: "At 11:40 pm, {labmate} reminds you that the {venue} deadline is Anywhere on Earth, which you had converted wrong. You have four more hours than you thought."
  zh: "晚上 11:40，{labmate} 提醒你，{venue} 的截稿时间是 AoE（Anywhere on Earth），你之前换算错了。你比自己以为的多出四个小时。"
- en: "Use all four hours"
  zh: "用满四小时"
- en: "You fix a table and sharpen the introduction. Then you watch a 4 am sunrise you didn't ask for."
  zh: "你改好一张表，又把引言打磨得更利落。然后看了一场你并不想看的凌晨 4 点日出。"
- en: "You submit at 11:45 pm, as planned, and sleep while the rest of your lab finds new typos."
  zh: "你按原计划在晚上 11:45 交了稿，然后去睡觉，组里其他人还在找新的拼写错误。"
- en: "Fix Figure 1, then stop"
  zh: "改完 Figure 1 就收手"
- en: "You spend one hour on the figure everyone looks at first, then submit while you're ahead."
  zh: "你花一小时改了大家第一眼会看的那张图，然后见好就收，交了稿。"
- en: "Question 14"
  zh: "第 14 题"
- en: "Question 14 of the {venue} responsible-research checklist: \"Did you report the total compute used, in GPU hours?\" You did not. You have no idea."
  zh: "{venue} 负责任研究清单第 14 题：“你是否报告了总算力消耗（以 GPU 小时计）？”你没有。你完全不知道。"
- en: "The {venue} checklist asks how many hours of annotation went into your data. You did most of it yourself, at night, without a stopwatch."
  zh: "{venue} 的清单问你的数据花了多少小时标注。大部分是你自己晚上标的，没掐表。"
- en: "Dig through the logs and find out"
  zh: "翻日志查清楚"
- en: "An hour of digging gives you a real number and a new appendix table. Reviewers love a real number."
  zh: "翻了一小时，你得到一个真实的数字，还多了一张附录表。审稿人最爱真实的数字。"
- en: "Half the logs were deleted to save disk space. You report an estimate, with a footnote that apologizes."
  zh: "一半日志为了省硬盘空间被删了。你报了个估计值，外加一个道歉的脚注。"
- en: "Answer \"No\" and explain why"
  zh: "答“否”并说明原因"
- en: "\"No, but here is roughly what it would be.\" It costs one paragraph, and nobody can say you hid anything."
  zh: "“否，但大致数字如下。”多写了一段，但谁也不能说你藏了什么。"
- en: "Answer \"N/A\""
  zh: "答“N/A”"
- en: "It is applicable. You both know it is applicable. You click Submit anyway."
  zh: "这题明明适用。你知道，清单也知道。你还是点了 Submit。"
- en: "New Template, New Errors"
  zh: "新模板，新报错"
- en: "This year's conference template is out. You paste in the draft of {project}, and nothing compiles: {roll:40-90} errors, all about a package you've never heard of."
  zh: "今年的会议模板出来了。你把 {project} 的草稿贴进去，结果完全编译不了：{roll:40-90} 个报错，全都跟一个你从没听说过的宏包有关。"
- en: "Debug it line by line"
  zh: "逐行排错"
- en: "Two hours and one deleted package later, it compiles. You post the fix in the lab chat and are briefly famous."
  zh: "两小时后，删掉一个宏包，终于编译通过。你把解决办法发到组群里，短暂地出了名。"
- en: "It compiles by evening. Every table is now in a slightly different font, and you can't unsee it."
  zh: "傍晚终于编译通过了。可每张表的字体都变得有点不一样，你一旦注意到就再也忘不掉。"
- en: "Ask {senior}, who fixed it last year"
  zh: "问去年修过的 {senior}"
- en: "{senior} replies in two minutes with a one-line fix and a sigh you can hear through the chat."
  zh: "{senior} 两分钟就回了，给了一行修复代码，隔着聊天框你都能听到那声叹气。"
- en: "{senior} is away, and the auto-reply points to the lab wiki. The wiki page was last edited four templates ago."
  zh: "{senior} 不在，自动回复让你去看实验室 wiki。那个 wiki 页面上次更新，还是四版模板之前。"
- en: "Stay on last year's template for now"
  zh: "暂时先用去年的模板"
- en: "Everything compiles today. The switch will happen later, at the least convenient moment possible."
  zh: "今天一切都能编译。换模板这件事会晚点发生，在最不方便的时刻。"
