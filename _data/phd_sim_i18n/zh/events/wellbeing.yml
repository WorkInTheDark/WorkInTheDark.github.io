# zh translations for events/wellbeing (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Six Weeks"
  zh: ""
- en: "You try to remember your last real day off. It was six weeks ago, and you spent it doing laundry."
  zh: ""
- en: "Take a real day off tomorrow"
  zh: ""
- en: "You go for a long walk and never open your email. The work is still there on Monday, and so are you."
  zh: ""
- en: "Plan a long weekend next turn"
  zh: ""
- en: "You block it on your calendar and tell three people, so you can't back out."
  zh: ""
- en: "Keep going, it's almost done"
  zh: ""
- en: "It is not almost done. It never is, but you do get a lot done this week."
  zh: ""
- en: "The Cabin"
  zh: ""
- en: "Your friends rent a cabin by a lake for a week, with no Wi-Fi and one spare bed with your name on it."
  zh: ""
- en: "Go, and leave the laptop home"
  zh: ""
- en: "You swim and play cards for seven days. By day four, you've forgotten your own password."
  zh: ""
- en: "Go, but bring the laptop"
  zh: ""
- en: "You work mornings on the porch and swim in the afternoons."
  zh: ""
- en: "Stay and work"
  zh: ""
- en: "The photos in the group chat look wonderful."
  zh: ""
- en: "The Inbox"
  zh: ""
- en: "You open your laptop after the lake: {roll:100-140} unread emails and nine messages from {advisor}. The last one says \"Never mind, figured it out.\""
  zh: ""
- en: "Answer every single one today"
  zh: ""
- en: "You reach inbox zero by midnight. The lake already feels like a dream."
  zh: ""
- en: "Read only your advisor's"
  zh: ""
- en: "Most of them answered each other. You reply to the last one with a thumbs-up."
  zh: ""
- en: "Mark all as read"
  zh: ""
- en: "It feels wonderful. One of them was an invitation to give a talk."
  zh: ""
- en: "Fresh Eyes"
  zh: ""
- en: "Back from a week with no laptop, you open {project}. The problem you were stuck on for a month is obvious in ten minutes."
  zh: ""
- en: "Fix it right now"
  zh: ""
- en: "Two hours of work and it's solved. You wonder what else a week off could fix."
  zh: ""
- en: "Write down why it was hard to see"
  zh: ""
- en: "You write a page on what you missed and why, so you'll spot it next time."
  zh: ""
- en: "It's Going Around"
  zh: ""
- en: "A cold is going around the lab. {labmate} sneezes, apologizes, and sneezes again. By Thursday, it's your turn."
  zh: ""
- en: "Stay home and rest"
  zh: ""
- en: "Two days of soup and sleep. You come back mostly human."
  zh: ""
- en: "Work from home in a blanket"
  zh: ""
- en: "You answer emails under a blanket. Productivity is low, and so is the risk to everyone else."
  zh: ""
- en: "Come in anyway"
  zh: ""
- en: "You shake it off in a day. Nobody else catches it."
  zh: ""
- en: "It hits harder than expected. Also, {labmate2} now has it."
  zh: ""
- en: "Fully Nocturnal"
  zh: ""
- en: "Your sleep schedule is now fully nocturnal. You eat breakfast at 3 pm and do your best work at 2 am."
  zh: ""
- en: "Reset with a 7 am alarm"
  zh: ""
- en: "Three groggy days later, you see the sun on purpose."
  zh: ""
- en: "Shift an hour earlier each day"
  zh: ""
- en: "By next week, you're eating breakfast at breakfast time."
  zh: ""
- en: "Keep the night shift"
  zh: ""
- en: "The cluster is empty at 2 am and your jobs fly. Your labmates forget what you look like."
  zh: ""
- en: "Own it"
  zh: ""
- en: "Night Owl"
  zh: ""
- en: "This is your natural habitat. You do the best work of your month by moonlight."
  zh: ""
- en: "A Good Meeting"
  zh: ""
- en: "Your meeting with {advisor} about {project} goes unexpectedly well. Thirty minutes in, you remember why you wanted to do this project."
  zh: ""
- en: "Ride the momentum all weekend"
  zh: ""
- en: "You put in two long, focused days. You're tired, and the project is moving again."
  zh: ""
- en: "Write down the next three steps"
  zh: ""
- en: "Three clear steps go on a sticky note on your monitor, where Monday-you will find them."
  zh: ""
- en: "Celebrate with bubble tea"
  zh: ""
- en: "{labmate} joins you. You both agree it's been a good day."
  zh: ""
- en: "Just a Small One"
  zh: ""
- en: "{labmate} asks you to join a side project. It would be your fourth. \"It's small,\" they say. They always say that."
  zh: ""
- en: "Say no, kindly"
  zh: ""
- en: "They understand right away. You feel lighter than you expected."
  zh: ""
- en: "Say yes"
  zh: ""
- en: "Your calendar now has a different color for each project, and you're running out of colors."
  zh: ""
- en: "Offer an hour of feedback instead"
  zh: ""
- en: "You give one hour of careful comments. It turns out that's exactly what they needed."
  zh: ""
- en: "The Chair"
  zh: ""
- en: "Your lower back has started filing complaints about your office chair. The chair is older than you are."
  zh: ""
- en: "Ask the department for a real chair"
  zh: ""
- en: "It takes three emails and a form, but the new chair arrives. Your back sends a thank-you note."
  zh: ""
- en: "Stack books under the monitor"
  zh: ""
- en: "Two volumes of an old statistics textbook finally earn their place on your desk."
  zh: ""
- en: "Ignore it"
  zh: ""
- en: "Your back does not ignore you."
  zh: ""
- en: "Twenty-Twenty-Twenty"
  zh: ""
- en: "After eleven hours of screens, the text on your monitor starts to swim, and blinking doesn't help."
  zh: ""
- en: "Look away every twenty minutes, like the poster says"
  zh: ""
- en: "Every twenty minutes, twenty feet, twenty seconds. You get to know the tree outside the window very well."
  zh: ""
- en: "Turn the brightness down and keep going"
  zh: ""
- en: "The headache arrives on schedule."
  zh: ""
- en: "Get your eyes checked"
  zh: ""
- en: "You get new glasses. The world is sharper, and so are your figures."
  zh: ""
- en: "Half the lab is coughing. The other half is pretending not to hear it."
  zh: ""
- en: "Work from home for a while"
  zh: ""
- en: "You miss two lab meetings and zero viruses."
  zh: ""
- en: "Your immune system holds. You feel invincible, which is a mistake."
  zh: ""
- en: "Day three: you have it too."
  zh: ""
- en: "Get the flu shot today"
  zh: ""
- en: "A sore arm and a smug feeling for a week."
  zh: ""
- en: "Lunch Is a Suggestion"
  zh: ""
- en: "You realize that for three weeks, lunch has been crackers from the vending machine, eaten over your keyboard."
  zh: ""
- en: "Meal prep this Sunday"
  zh: ""
- en: "You make five containers of something green and feel like an adult."
  zh: ""
- en: "Join the lab for lunch"
  zh: ""
- en: "Real food, and gossip about which professor is moving to industry."
  zh: ""
- en: "The crackers are fine"
  zh: ""
- en: "The crackers are not fine."
  zh: ""
- en: "The Morning After"
  zh: ""
- en: "You hit submit at 4:12 am. At 9:00 there's lab meeting. Your body has questions."
  zh: ""
- en: "Sleep through lab meeting"
  zh: ""
- en: "You sleep until noon and apologize on the lab chat. Your advisor replies with a thumbs-up."
  zh: ""
- en: "Go anyway, with three coffees"
  zh: ""
- en: "You present your results with great energy and little sense."
  zh: ""
- en: "The Fifth Coffee"
  zh: ""
- en: "It's 2 pm and you're holding your fifth coffee. Your hands are doing a small, steady dance."
  zh: ""
- en: "Switch to decaf for a while"
  zh: ""
- en: "The first two days are rough. Then you sleep through the night for the first time since September."
  zh: ""
- en: "Make it a sixth"
  zh: ""
- en: "You've never written code this fast. Most of it is wrong."
  zh: ""
- en: "The Wrist"
  zh: ""
- en: "Your right wrist aches every time you reach for the mouse. It started as a twinge. It's now a whole opinion."
  zh: ""
- en: "Get a split keyboard and a better mouse"
  zh: ""
- en: "For a week you type like a toddler. Then the ache is gone."
  zh: ""
- en: "Push through"
  zh: ""
- en: "The ache moves up your arm, as if exploring."
  zh: ""
- en: "Try dictating your related work"
  zh: ""
- en: "Your laptop transcribes \"transformer\" as \"trans former\" forty times. Your wrist gets a rest."
  zh: ""
- en: "The Front Row"
  zh: ""
- en: "You fall asleep in a department talk, in the front row, and the speaker notices."
  zh: ""
- en: "Go to bed at ten for the next two weeks"
  zh: ""
- en: "It feels like a vacation you didn't have to book."
  zh: ""
- en: "Buy the large coffee from now on"
  zh: ""
- en: "You stay awake in talks. You also stay awake at 2 am."
  zh: ""
- en: "The Ankle"
  zh: ""
- en: "One bad landing in a pick-up basketball game, and your ankle turns a color you didn't know ankles could be."
  zh: ""
- en: "Rest it properly"
  zh: ""
- en: "You keep it iced and up on the couch, and read a lot."
  zh: ""
- en: "Limp to the lab"
  zh: ""
- en: "Everyone asks what happened. You tell the story eleven times; it gets better each time."
  zh: ""
- en: "The Three-Day Headache"
  zh: ""
- en: "A headache moves in on Monday and is still there on Wednesday, like a labmate who never goes home."
  zh: ""
- en: "Close the laptop at six for a week"
  zh: ""
- en: "It leaves on Friday. So does some of the stress."
  zh: ""
- en: "Painkillers and keep going"
  zh: ""
- en: "It leaves eventually. It leaves a forwarding address."
  zh: ""
- en: "Pollen Season"
  zh: ""
- en: "The trees outside the lab are blooming beautifully, and your sinuses have declared war on all of them."
  zh: ""
- en: "Antihistamines"
  zh: ""
- en: "You can breathe. You can also barely keep your eyes open."
  zh: ""
- en: "Tough it out"
  zh: ""
- en: "You go through a box of tissues a day. People keep asking if the code is that bad."
  zh: ""
- en: "The Lab Fridge"
  zh: ""
- en: "You eat a yogurt from the lab fridge. It had your name on it. It did not have a date on it."
  zh: ""
- en: "Stay home until it passes"
  zh: ""
- en: "Two days on the bathroom floor, contemplating your choices."
  zh: ""
- en: "Clean out the lab fridge, for everyone's sake"
  zh: ""
- en: "You find things that predate your advisor. The lab is grateful, and slightly scared."
  zh: ""
- en: "Dragged to Dinner"
  zh: ""
- en: "At 8 pm, a friend from outside the lab appears at your desk holding your coat. \"You said 'next week' three weeks ago. It's next week.\""
  zh: ""
- en: "Go, and leave the laptop behind"
  zh: ""
- en: "Three hours of dumplings and stories that have nothing to do with research. You sleep in the next morning and don't regret it."
  zh: ""
- en: "Go, but only for an hour"
  zh: ""
- en: "You have one quick bowl of noodles and go back to the lab feeling a bit better."
  zh: ""
- en: "\"Ten more minutes\""
  zh: ""
- en: "You finish the section. They leave a takeout box on your desk with a sticky note: \"Next week. Really.\""
  zh: ""
- en: "Somebody Else's Best Paper"
  zh: ""
- en: "{labmate} wins a best-paper award. You're truly happy for them. Then, around 11 pm, a small voice asks what exactly you've been doing all year."
  zh: ""
- en: "Ask {labmate} how they did it"
  zh: ""
- en: "Over coffee, {labmate} admits the project failed twice before it worked, and their first draft was worse than yours."
  zh: ""
- en: "Work twice as hard this month"
  zh: ""
- en: "You out-work the small voice for two weeks. It's still there, and now you're both tired."
  zh: ""
- en: "List three things you did this year"
  zh: ""
- en: "The list runs well past three. You read it twice, then go to bed."
  zh: ""
- en: "Read their paper to find the trick"
  zh: ""
- en: "Imposter Syndrome"
  zh: ""
- en: "There's no trick, just a careful, good paper, and somehow that helps."
  zh: ""
- en: "Ten in a Row"
  zh: ""
- en: "Ten gym sessions in a row. The front desk nods at you now, and you've started saying \"leg day\" without irony."
  zh: ""
- en: "Keep the streak going"
  zh: ""
- en: "You keep going to thirteen. Your back stops complaining about the chair, and your calendar starts instead."
  zh: ""
- en: "Bring {labmate} next time"
  zh: ""
- en: "{labmate} lasts twenty minutes and is sore for three days. They want to go again, which surprises you both."
  zh: ""
- en: "Reward yourself with a week off"
  zh: ""
- en: "You spend a week on the couch. The streak ends at ten, which is still ten."
  zh: ""
- en: "Go for twenty"
  zh: ""
- en: "Gym Rat"
  zh: ""
- en: "You make it to twenty and feel unstoppable, except around 3 pm."
  zh: ""
- en: "Thrilled to Share"
  zh: ""
- en: "Decisions are out for a big conference, and your feed is a wall of \"Thrilled to share...\" posts. You've been scrolling for forty minutes and stopped reading the titles a while ago."
  zh: ""
- en: "Close the app and go for a walk"
  zh: ""
- en: "The trees outside haven't had a paper accepted either, and they seem fine."
  zh: ""
- en: "Like every single one"
  zh: ""
- en: "Two hundred likes later, you're a supportive member of the community, and slightly hollow."
  zh: ""
- en: "Mute the word \"thrilled\""
  zh: ""
- en: "Your feed goes quiet and slightly confusing. You miss a friend's real news and hear about it a week late."
  zh: ""
- en: "The Extra Hour"
  zh: ""
- en: "Daylight saving ends and the clocks go back, which gives you one free hour."
  zh: ""
- en: "Spend the hour asleep"
  zh: ""
- en: "The best hour of sleep you've had all semester. You wake up almost rested."
  zh: ""
- en: "Spend it on one more experiment"
  zh: ""
- en: "The extra hour goes to one more run, which takes three hours. You end up two hours behind."
  zh: ""
- en: "Book a 7 am meeting; it \"feels like 8\""
  zh: ""
- en: "It does feel like 8, for about a week. Then it feels like 7 again, and the meeting is now recurring."
  zh: ""
- en: "5 Hours 12 Minutes"
  zh: ""
- en: "{labmate} lends you their sleep tracker. After a week, it reports your average: 5 hours 12 minutes. It has also awarded you a badge called \"Night Explorer\"."
  zh: ""
- en: "Set a bedtime alarm and obey it"
  zh: ""
- en: "Lights out at 11:30. You lose your late-night hours and find your mornings."
  zh: ""
- en: "Keep wearing it, stop looking at it"
  zh: ""
- en: "The data is still collected. It just isn't anyone's problem now."
  zh: ""
- en: "Return it with a note: \"broken\""
  zh: ""
- en: "{labmate} checks it, finds nothing wrong and gives you a long look."
  zh: ""
- en: "The Lab Couch"
  zh: ""
- en: "You nap on the lab couch between runs. Forty minutes later you wake up with your neck stuck at a jaunty angle."
  zh: ""
- en: "Heat pack and slow stretches"
  zh: ""
- en: "A slow, careful afternoon. By evening you can check your blind spot again."
  zh: ""
- en: "Work with your head tilted"
  zh: ""
- en: "Your monitor looks a bit crooked all day. {labmate} tilts their head in solidarity."
  zh: ""
- en: "Go home and sleep in a real bed"
  zh: ""
- en: "Twelve hours later your neck is straight, and your runs have finished without you."
  zh: ""
- en: "The Radiator"
  zh: ""
- en: "The radiator in your apartment clanks from 2 to 4 am, every night, like someone is trapped inside with a wrench."
  zh: ""
- en: "Buy earplugs"
  zh: ""
- en: "Silence at last. You also sleep through your alarm, twice."
  zh: ""
- en: "Write a polite note to the landlord"
  zh: ""
- en: "Your note is so well argued that someone comes out the same week. The radiator now hums, gently."
  zh: ""
- en: "The landlord replies that this is normal for an old building, which is true and doesn't help."
  zh: ""
- en: "Use the hours to write"
  zh: ""
- en: "You write two hours a night, typing in time with the clanks. The draft grows, and your eyes stop fully opening."
  zh: ""
- en: "Forty Tabs"
  zh: ""
- en: "It's 1 am. You're in bed, and your phone has forty arXiv tabs open. Each one is \"just the abstract\"."
  zh: ""
- en: "Leave the phone outside the bedroom"
  zh: ""
- en: "You buy an old-school alarm clock. The first three nights feel strange. Then you sleep like you used to."
  zh: ""
- en: "Save them for the morning"
  zh: ""
- en: "You bookmark all forty. In the morning you read two, properly. The other 38 join the folder of good intentions."
  zh: ""
- en: "Just one more abstract"
  zh: ""
- en: "By 2:40 am you understand a whole new subfield, sadly not yours."
  zh: ""
- en: "Fourteen Hours"
  zh: ""
- en: "The weekend after you submit {paper}, you go to bed at 9 pm and wake up at 11 am."
  zh: ""
- en: "Do it again on Sunday"
  zh: ""
- en: "Another long night. On Monday you feel like someone just back from vacation."
  zh: ""
- en: "Get up and clean the apartment"
  zh: ""
- en: "You find three mugs you thought you'd lost and one you wish you hadn't. The apartment is clean; you are tired."
  zh: ""
- en: "Start planning the next paper"
  zh: ""
- en: "By Sunday night you have an outline and a mild headache."
  zh: ""
- en: "For Training Purposes"
  zh: ""
- en: "The university offers free ergonomic assessments. The assessor frowns at your desk and photographs your setup \"for training purposes\"."
  zh: ""
- en: "Follow every recommendation"
  zh: ""
- en: "It takes a full day and a lumbar pillow shaped like a burrito. Your back feels better by evening."
  zh: ""
- en: "Fix only the monitor height"
  zh: ""
- en: "You raise the monitor on the conference proceedings you never read, which finally have a use."
  zh: ""
- en: "Ask them to blur your face"
  zh: ""
- en: "They agree. Your posture, unchanged, becomes an anonymous warning in next year's training slides."
  zh: ""
- en: "The Standing Desk"
  zh: ""
- en: "Your standing desk arrives. On day one you stand for two hours. On day two it becomes a regular desk, slightly taller."
  zh: ""
- en: "Alternate on a timer"
  zh: ""
- en: "You switch every thirty minutes. Your legs complain for a week, then stop."
  zh: ""
- en: "Use it as a shelf for printed papers"
  zh: ""
- en: "It holds 300 pages you'll read someday. It's the most useful furniture you own."
  zh: ""
- en: "Stand through lab meeting to make a point"
  zh: ""
- en: "Nobody is sure what the point is. Then {labmate} stands too, and by spring lab meeting is twenty minutes shorter."
  zh: ""
- en: "Sixth Floor"
  zh: ""
- en: "The elevator is out for a month. The sign says \"We apologize for the inconvenience.\" The lab is on the sixth floor."
  zh: ""
- en: "Take the stairs, every time"
  zh: ""
- en: "Six floors, four times a day. By week three you arrive only slightly out of breath."
  zh: ""
- en: "Work from the ground-floor library"
  zh: ""
- en: "The library is quiet and warm. You get a lot done and miss all the lab gossip."
  zh: ""
- en: "Wait for the freight elevator"
  zh: ""
- en: "It comes every twenty minutes. You get to know the custodians, and a lot of podcasts."
  zh: ""
- en: "Daylight"
  zh: ""
- en: "You haven't seen daylight on a weekday in two weeks. You arrive and leave in the dark, and the lab has no windows."
  zh: ""
- en: "Hold your next one-on-one outside"
  zh: ""
- en: "{advisor} agrees to a walking meeting. It's cold and short, and the best meeting you've had this month."
  zh: ""
- en: "{advisor} agrees, and then it rains sideways. You take notes on a wet napkin."
  zh: ""
- en: "Trade desks with {labmate} for the window"
  zh: ""
- en: "{labmate} agrees, for a week of coffee and a little sighing. The window faces a parking lot, but it's daylight."
  zh: ""
- en: "Buy a daylight lamp"
  zh: ""
- en: "It is very bright and very blue. Your desk looks like a dentist's office, and you feel noticeably more awake."
  zh: ""
- en: "The Stretch Timer"
  zh: ""
- en: "{labmate} sets up an hourly stretch timer for the whole lab. It goes off in the middle of your practice talk, right on the slide with the main result."
  zh: ""
- en: "Stretch with everyone"
  zh: ""
- en: "The whole room stretches. You lose your place and never quite find it again, but everyone's shoulders thank you."
  zh: ""
- en: "Mute it"
  zh: ""
- en: "You finish the talk on time. The timer stays muted for the rest of the month, for everyone."
  zh: ""
- en: "Lead the stretches from now on"
  zh: ""
- en: "You become the lab's stretch captain. It costs five minutes an hour and earns you a lot of goodwill."
  zh: ""
- en: "New Glasses"
  zh: ""
- en: "Your new glasses arrive. It turns out the slides at department talks were never blurry, and trees have individual leaves."
  zh: ""
- en: "Wear them everywhere"
  zh: ""
- en: "After two days of headaches, the world gets sharper. You can now read the fine print on the reimbursement form, and you wish you couldn't."
  zh: ""
- en: "Keep them for screens only"
  zh: ""
- en: "You still squint at the whiteboard, but your eyes stop aching by 6 pm."
  zh: ""
- en: "Reread your favorite paper, properly"
  zh: ""
- en: "Figure 3 had error bars all along. The paper is even better than you remembered."
  zh: ""
- en: "Day Two Without Coffee"
  zh: ""
- en: "You try quitting coffee for a week. Day two brings a headache with opinions and a personal grudge against the coffee machine."
  zh: ""
- en: "Push through to day seven"
  zh: ""
- en: "A rough week, then a surprise: you sleep through the night and wake up before the alarm."
  zh: ""
- en: "Switch to tea"
  zh: ""
- en: "You drink three cups of green tea a day and start describing it as \"grassy\"."
  zh: ""
- en: "Give up at 10:02 am"
  zh: ""
- en: "The coffee tastes like victory and defeat at the same time."
  zh: ""
- en: "Regular Customer"
  zh: ""
- en: "The late-night delivery driver greets you by name. Last week they asked how the paper is going."
  zh: ""
- en: "Order the salad this time"
  zh: ""
- en: "The driver looks worried about you. The salad is fine, and you're hungry again by midnight."
  zh: ""
- en: "Order the usual, extra fries"
  zh: ""
- en: "The fries are perfect, and for ten minutes nothing else matters."
  zh: ""
- en: "Make it your last delivery this month"
  zh: ""
- en: "You cook rice in bulk and eat it with whatever's in the fridge. The driver probably misses you."
  zh: ""
- en: "Lunch Rotation"
  zh: ""
- en: "{labmate} starts a lab lunch rotation: each week, one person cooks for everyone. Your week is coming up."
  zh: ""
- en: "Cook something real"
  zh: ""
- en: "A big pot of curry for nine people. It takes a whole day, and everyone has seconds."
  zh: ""
- en: "Bring store-bought dumplings"
  zh: ""
- en: "Nobody minds. Two people ask where they're from. You let them believe it took effort."
  zh: ""
- en: "Keep eating at your desk"
  zh: ""
- en: "You opt out and get a quiet hour every day. Through the door, you hear the lab laughing over lunch."
  zh: ""
- en: "Leftovers in the Kitchen"
  zh: ""
- en: "The department's \"leftovers in the kitchen\" emails have fed you for a week, mostly pizza and one mysterious tray of wraps."
  zh: ""
- en: "Keep it up"
  zh: ""
- en: "Your wallet is happy. You haven't eaten a vegetable since Tuesday."
  zh: ""
- en: "Buy actual groceries"
  zh: ""
- en: "Vegetables! You'd forgotten how they crunch."
  zh: ""
- en: "Turn on notifications for the list"
  zh: ""
- en: "You can now reach any kitchen in the building in 90 seconds, and you've met half the department over cold pizza."
  zh: ""
- en: "The Checkup"
  zh: ""
- en: "Your student health plan includes a free checkup. The nurse asks how many hours a day you sit. You do the math out loud, which is a mistake."
  zh: ""
- en: "Answer honestly and take the advice"
  zh: ""
- en: "Walk after lunch, stand up every hour, sleep seven hours. The first two turn out to be easy."
  zh: ""
- en: "Round down"
  zh: ""
- en: "\"About six,\" you say. The nurse writes down \"twelve\" and hands you a pamphlet anyway."
  zh: ""
- en: "Laugh nervously"
  zh: ""
- en: "The nurse laughs too, then books you a follow-up that you will probably go to."
  zh: ""
- en: "Fever on the Big Day"
  zh: ""
- en: "You wake up with a fever on the morning of your committee meeting. {committee} moved a flight to be there."
  zh: ""
- en: "Reschedule"
  zh: ""
- en: "Everyone is kind about it. The next time all four of you are free is five weeks away. You spend two days in bed."
  zh: ""
- en: "Join by video from bed"
  zh: ""
- en: "You present in a hoodie with a blanket on your shoulders. {committee} calls it the most relaxed meeting they've had all year."
  zh: ""
- en: "Go in person, sit far from everyone"
  zh: ""
- en: "You present from the far end of the table. It goes well, and nobody catches anything."
  zh: ""
- en: "Halfway through, you sneeze on the projector remote. {committee} is very gracious. You go straight to bed."
  zh: ""
- en: "No Colds in the Clinic"
  zh: ""
- en: "You wake up with a cold the day before your {project} sessions with clinicians. Nobody brings a cold into a hospital."
  zh: ""
- en: "Reschedule the sessions"
  zh: ""
- en: "The clinicians are understanding. Their next free slots are two weeks out. You spend the wait in bed with tea."
  zh: ""
- en: "Ask {labmate} to run them from your script"
  zh: ""
- en: "{labmate} follows your script to the letter and adds one great follow-up question. You owe them dinner."
  zh: ""
- en: "{labmate} is glad to help but skips the warm-up questions. The sessions happen; the data is thinner."
  zh: ""
- en: "Switch to video sessions"
  zh: ""
- en: "Most of the clinicians prefer it anyway. You run them from your couch, muted between coughs."
  zh: ""
- en: "No Voice"
  zh: ""
- en: "It's the morning you teach section, and your voice is gone. What comes out is a small, hopeful squeak."
  zh: ""
- en: "Teach from slides and the whiteboard"
  zh: ""
- en: "You write everything down. It's the clearest section you've ever taught."
  zh: ""
- en: "Swap with another TA"
  zh: ""
- en: "They cover for you and say you owe them one. They will collect, during finals."
  zh: ""
- en: "Whisper; the students lean in"
  zh: ""
- en: "Thirty students lean in and go very quiet. It's the most attentive section all semester, and by evening your throat feels like sandpaper."
  zh: ""
- en: "Soup at the Door"
  zh: ""
- en: "You're home with a cold. There's a knock, and outside your door is a container of soup and a sticky note from {labmate}: \"Get well. Don't answer the lab chat.\""
  zh: ""
- en: "Rest properly, like the note says"
  zh: ""
- en: "You eat the soup and sleep. By Friday you're back, and so is your sense of smell."
  zh: ""
- en: "Thank them, then work from bed"
  zh: ""
- en: "You send a heart emoji and a pull request. The soup goes cold next to your laptop."
  zh: ""
- en: "Return the favor next week"
  zh: ""
- en: "Once you're better, you bring {labmate} homemade dumplings. The lab now runs on a soup-and-dumplings economy."
  zh: ""
- en: "Snow Day"
  zh: ""
- en: "Snow day: the university closes campus and locks the building. The whole city is quiet."
  zh: ""
- en: "Actually rest"
  zh: ""
- en: "You read a novel with no citations under a blanket, which feels almost illegal."
  zh: ""
- en: "Write from home all day"
  zh: ""
- en: "With no meetings and no seminar, you write more than you have all month."
  zh: ""
- en: "Have a snowball fight, then write"
  zh: ""
- en: "{labmate} turns out to have a terrifying arm. Afterward, you write slowly over hot chocolate."
  zh: ""
- en: "Black Ice"
  zh: ""
- en: "You slip on the ice outside the building and land on your hand. A sprained wrist: one-handed typing for a week."
  zh: ""
- en: "Rest it and dictate your writing"
  zh: ""
- en: "Your laptop hears \"in this paper\" as \"in this pepper\" all week. Your wrist heals. Your draft is now well seasoned."
  zh: ""
- en: "Type one-handed, grimly"
  zh: ""
- en: "Forty words a minute becomes nine. You discover how many of your sentences were optional."
  zh: ""
- en: "Pair-program with {labmate} at the keyboard"
  zh: ""
- en: "You talk, they type. They fix two of your bugs out of pure impatience."
  zh: ""
- en: "The Sneeze"
  zh: ""
- en: "You sneeze, hard, and something in your lower back says \"no\". You now walk like someone twice your age."
  zh: ""
- en: "Ice it and spend a day on the floor"
  zh: ""
- en: "A whole day on the living-room floor with an ice pack and a podcast. There's a crack in the ceiling you'd never noticed."
  zh: ""
- en: "Work standing very still"
  zh: ""
- en: "You stand at your desk like a heron for three days. It mostly works, until you drop a pen."
  zh: ""
- en: "Tell everyone it was a sports injury"
  zh: ""
- en: "Nobody believes you. Everyone respects the commitment to the story."
  zh: ""
- en: "Faculty vs. Students"
  zh: ""
- en: "It's the annual faculty-vs-students soccer match, and {advisor} is on the other team, wearing shin guards and the look they usually save for deadlines."
  zh: ""
- en: "Play hard"
  zh: ""
- en: "You score past {advisor}, who shakes your hand and brings it up at lab meeting for a month. You're sore all week."
  zh: ""
- en: "One big tackle and a pulled hamstring. The students win anyway, and you watch the second half with an ice pack."
  zh: ""
- en: "Go easy whenever your advisor has the ball"
  zh: ""
- en: "{advisor} scores twice and is in a wonderful mood all week. Your teammates have noticed."
  zh: ""
- en: "Cheer from the sideline with snacks"
  zh: ""
- en: "You bring orange slices and the loudest voice on the field. The students lose by one, but the snacks are a hit."
  zh: ""
- en: "The Climbing Gym"
  zh: ""
- en: "{labmate} drags you to the climbing gym. You make it up two walls. The next morning, your forearms are too sore to hold a coffee, let alone type."
  zh: ""
- en: "Go again next week"
  zh: ""
- en: "Week two: three walls, less shaking. {labmate} has a climbing buddy now."
  zh: ""
- en: "Stick to the easy wall"
  zh: ""
- en: "The beginner wall is full of eight-year-olds who are better than you. It's good exercise anyway."
  zh: ""
- en: "Rest your hands and read papers instead"
  zh: ""
- en: "You spend two days reading with your arms propped on pillows. Your forearms recover, and your reading list gets shorter."
  zh: ""
- en: "Last Row"
  zh: ""
- en: "Fourteen hours on the plane to {city}: last row, next to the restroom, in a seat that reclines one inch, in theory."
  zh: ""
- en: "Walk the aisle every hour"
  zh: ""
- en: "You do laps with a retired dentist and land with working legs."
  zh: ""
- en: "Put on an eye mask and sleep"
  zh: ""
- en: "You sleep six of the fourteen hours, in eleven pieces."
  zh: ""
- en: "Finish your slides on the tray table"
  zh: ""
- en: "The slides are done by landing. Your neck stays at tray-table angle for two days."
  zh: ""
- en: "Wide Awake at 4 am"
  zh: ""
- en: "Jet lag wakes you at 4 am in {city}, wide awake and starving. The hotel gym opens at 5."
  zh: ""
- en: "Work out the minute it opens"
  zh: ""
- en: "Forty minutes on a treadmill facing a mirror. By breakfast, your body has picked a time zone."
  zh: ""
- en: "Rehearse your talk in the empty lobby"
  zh: ""
- en: "The night clerk hears your talk four times and has one very good question."
  zh: ""
- en: "Lie in the dark reading arXiv"
  zh: ""
- en: "By sunrise you've read nine abstracts and remember none. You fall asleep at 7:50, ten minutes before your alarm."
  zh: ""
- en: "23,000 Steps"
  zh: ""
- en: "Your phone says you're walking 23,000 steps a day at {venue}. Your feet say more. Your conference shoes were chosen for looks."
  zh: ""
- en: "Buy comfortable shoes in {city}"
  zh: ""
- en: "The ugliest, softest shoes in {city}. You miss a morning session finding them, then walk the rest of the week in bliss."
  zh: ""
- en: "Sit through the afternoon sessions"
  zh: ""
- en: "Three hours in a dark room with your feet up on your bag. You learn a lot and meet nobody."
  zh: ""
- en: "Keep walking the poster hall"
  zh: ""
- en: "Forty posters and twelve good conversations later, you have two blisters."
  zh: ""
- en: "Forty Percent Croissant"
  zh: ""
- en: "Day three at {venue}. Since landing, you've eaten nothing but coffee-break pastries. You are now about 40% croissant."
  zh: ""
- en: "Find a grocery store"
  zh: ""
- en: "You eat yogurt and a bag of carrots on a bench in {city}. You miss a session and don't regret it."
  zh: ""
- en: "Embrace it"
  zh: ""
- en: "There's a cinnamon one today. Life is good, and slightly sticky."
  zh: ""
- en: "Save room for the reception"
  zh: ""
- en: "You skip lunch to save room. The reception food is gone in four minutes. You eat a breadstick and talk to everyone."
  zh: ""
- en: "Find the bakery the locals line up for"
  zh: ""
- en: "Foodie"
  zh: ""
- en: "A tiny bakery with a line around the block. You bring a box back to your session and become very popular."
  zh: ""
- en: "The Fun Run"
  zh: ""
- en: "The {venue} fun run starts at 6:30 am. Two authors whose papers you've cited many times have signed up."
  zh: ""
- en: "Run it"
  zh: ""
- en: "You keep pace with them for five kilometers and talk the whole way. One of them asks for your paper."
  zh: ""
- en: "You last two kilometers, then walk. They wave as they pass. At the finish you say hi, very red in the face."
  zh: ""
- en: "Sleep in"
  zh: ""
- en: "You sleep until 8 and see the finish-line photos at breakfast. Everyone looks happy and very sweaty."
  zh: ""
- en: "Walk it with a coffee, meet them at the end"
  zh: ""
- en: "You arrive last, with coffee. They are delighted, mostly by the coffee, and you talk for twenty minutes."
  zh: ""
- en: "Canceled"
  zh: ""
- en: "Your flight home from {city} is canceled overnight. The line for hotel vouchers is two hours long and not moving."
  zh: ""
- en: "Wait for the voucher"
  zh: ""
- en: "Two hours later you have a voucher for a hotel by the highway. You sleep five hours and fly home grumpy."
  zh: ""
- en: "Sleep on the floor by the gate"
  zh: ""
- en: "You build a bed out of a conference tote and your poster tube. You wake up first in line, with a crick in your neck."
  zh: ""
- en: "Work through the night on revisions"
  zh: ""
- en: "At an empty gate at 3 am, you revise more than you have all month. You land looking like a ghost."
  zh: ""
