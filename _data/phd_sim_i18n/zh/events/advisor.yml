# zh translations for events/advisor (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Quick Question"
  zh: "有个小问题"
- en: "At 11:04 pm, {advisor} sends an email with the subject line \"quick question\". The question is not quick."
  zh: "晚上 11:04，{advisor}发来一封邮件，标题是“有个小问题”。问题一点也不小。"
- en: "Your phone buzzes at 11 pm: \"Quick question: could you rerun everything with the new data split?\""
  zh: "晚上 11 点，你的手机震了：“有个小问题：能不能用新的数据划分把所有实验重跑一遍？”"
- en: "Answer it tonight"
  zh: "今晚就回"
- en: "You reply at 12:40 am, and {advisor} answers \"thx\" at 12:41, which from them is high praise."
  zh: "你凌晨 12:40 回了信，{advisor}在 12:41 回了句“感谢”。在老板那里，这已经算是夸你了。"
- en: "Reply in the morning"
  zh: "明早再回"
- en: "You sleep. By morning, a second email from {advisor} has answered the first one."
  zh: "你去睡了。到了早上，{advisor}的第二封邮件说，第一封里的问题已经解决了。"
- en: "Send \"On it tomorrow!\""
  zh: "回一句“收到，明天弄！”"
- en: "A thumbs-up comes back, and everyone gets to sleep."
  zh: "对面回了个大拇指，大家都能去睡了。"
- en: "Two more \"quick\" emails arrive before midnight. You read them all."
  zh: "午夜前又来了两封“有个小问题”。你每封都读了。"
- en: "Due Friday"
  zh: "周五截止"
- en: "{advisor} needs help with a grant proposal due Friday. \"Just the preliminary results section. You know the work best.\""
  zh: "{advisor}的基金申请周五截止，找你帮忙。“就写初步结果那一节，这块你最熟。”"
- en: "Write the section"
  zh: "写这一节"
- en: "You write four pages about your own work in the future tense. {advisor} is clearly grateful."
  zh: "你把自己做完的工作写成了四页“我们将会……”。{advisor}显然很感激。"
- en: "Offer figures, not prose"
  zh: "只给图，不写字"
- en: "You send two clean figures. Both end up on page one."
  zh: "你发了两张干净的图。两张最终都被放在了第一页。"
- en: "Say your own deadline comes first"
  zh: "解释自己文章的截稿更要紧"
- en: "\"Fair. Your paper matters more right now.\" You get your week back."
  zh: "“有道理。你的论文更重要。”你的这一周保住了。"
- en: "{advisor} says \"fine\" in a way that is not quite fine."
  zh: "{advisor}回了句“行吧”。懂的都懂，这不太行。"
- en: "A Brand-New Idea"
  zh: "一个全新的想法"
- en: "{advisor} bursts into lab meeting with an exciting new idea. It's the idea you pitched last year, the one they called \"not quite there\"."
  zh: "{advisor}冲进组会，带来一个激动人心的新想法。正是你去年提过，但被一句“还差点意思”毙掉的那个。"
- en: "Say \"I pitched that last year!\""
  zh: "直接说“这是我去年提的！”"
- en: "{advisor} checks their notes and laughs. \"Then you should lead it.\""
  zh: "{advisor}翻了翻笔记，笑了：“那就你来牵头吧。”"
- en: "\"Similar, but this version is different.\" It is not different."
  zh: "“有点像，但这个版本不一样。”并没有不一样。"
- en: "Say \"Great idea!\" and smile"
  zh: "笑着说“好主意！”"
- en: "You start a new folder for it. Your notes from last year are already inside."
  zh: "你为它新建了一个文件夹。你去年的笔记已经在里面了。"
- en: "Send them your old slides"
  zh: "把旧幻灯片发给导师"
- en: "\"Ha, you were early.\" Your slides from last year become the starting point."
  zh: "“哈，你早就想到了。”你去年的幻灯片成了起点。"
- en: "Rescheduled Into Your Vacation"
  zh: "开会改到了假期里"
- en: "{advisor} forgets your meeting and, to make up for it, moves it to the one week you'll be away."
  zh: "{advisor}忘了你们的会，为了弥补，贴心地把它挪到了你唯一不在的那一周。"
- en: "Take the call from vacation"
  zh: "度假时接电话开会"
- en: "You take the 12-minute call from a parking lot, and {advisor} seems pleased."
  zh: "你坐在停车场开完了 12 分钟的电话会，{advisor}似乎挺满意。"
- en: "Ask to move it again"
  zh: "请求再改个时间"
- en: "\"Oh! Of course. Enjoy your break.\" It moves to the week after."
  zh: "“哦！没问题。好好休息。”会挪到了再下一周。"
- en: "It moves to the morning you fly back."
  zh: "会挪到了你飞回来的那天早上。"
- en: "Send a written update instead"
  zh: "改发邮件汇报进展"
- en: "You send a tidy one-page update. {advisor} replies \"perfect, enjoy!\" and means it."
  zh: "你发了一页满满当当的进展汇报。{advisor}回复“做得不错，玩得开心！”，而且是真心的。"
- en: "Tomorrow's Guest Lecture"
  zh: "明天的客座讲课"
- en: "{advisor} is stuck in another meeting. \"Could you give my guest lecture tomorrow? The slides are mostly done.\""
  zh: "{advisor}被另一个会困住了。“明天的客座讲课你能替我上吗？幻灯片差不多做好了。”"
- en: "Give it with their slides"
  zh: "用导师的幻灯片讲"
- en: "The slides are from 2019, but you narrate them well. Two students ask for your email."
  zh: "幻灯片是 2019 年的，但你讲得很好。有两个学生来要你的邮箱。"
- en: "Slide 14 cites a model nobody has heard of. You improvise for ten long minutes."
  zh: "第 14 页引用了一个你都没听说过的模型。你硬着头皮东拉西扯了漫长的十分钟。"
- en: "Rebuild the slides tonight"
  zh: "今晚重做幻灯片"
- en: "You give a crisp lecture built around your own work. {advisor} hears it went great."
  zh: "你围绕自己的工作讲了一堂干脆利落的课。{advisor}听说讲得很好。"
- en: "Say you can't this time"
  zh: "说这次去不了"
- en: "The lecture is canceled. The class gets a free hour and seems thrilled."
  zh: "课取消了。学生们白捡一小时，快乐得像放了假。"
- en: "My Star Student"
  zh: "我的得意门生"
- en: "At the {venue} reception in {city}, {advisor} introduces you to a famous researcher as \"my star student\". The famous researcher turns to you, expectantly."
  zh: "在{city}的 {venue} 招待会上，{advisor}把你介绍给一位知名学者：“这是我的得意门生。”那位学者转过身来，满怀期待地看着你。"
- en: "Pitch your work in one minute"
  zh: "一分钟介绍你的研究"
- en: "They ask one sharp question, then for your paper. You've made a real contact."
  zh: "对方问了一个犀利的问题，然后记下了你的论文标题。这次是真的搭上了线。"
- en: "You say \"basically\" eleven times. They are very kind about it."
  zh: "你说了十一次“基本上……”；对方非常包容。"
- en: "Ask about their work instead"
  zh: "反过来问对方的研究"
- en: "They talk for twenty minutes. You learn a lot and are remembered as a great listener."
  zh: "对方讲了二十分钟。你学到很多，还留下了一个“很会倾听”的好印象。"
- en: "Laugh: \"Star is generous.\""
  zh: "笑说“得意门生不敢当”"
- en: "Everyone laughs, and {advisor} looks proud."
  zh: "大家都笑了，{advisor}看起来很骄傲。"
- en: "You're Running Reading Group"
  zh: "读书会归你了"
- en: "\"{player} will run reading group this semester,\" {advisor} announces. This is the first you've heard of it."
  zh: "“这学期的读书会由 {player} 负责。”{advisor}宣布。这事你本人也是刚知道。"
- en: "Run it properly"
  zh: "认真办"
- en: "You pick good papers and bring snacks, and attendance doubles."
  zh: "你仔细挑选了论文，还带了零食，参加人数翻了一倍。"
- en: "Make it a rotation"
  zh: "改成轮流主讲"
- en: "Everyone takes a week, so you only present twice."
  zh: "每人轮一周，你只讲了两次。"
- en: "Nobody signs up. You present for six weeks straight."
  zh: "没人报名。你连讲了六周。"
- en: "Pick only papers for your project"
  zh: "夹带私货，只选项目相关的"
- en: "Every paper is about your project. The lab learns a lot about it, and so do you."
  zh: "每篇论文都和你的项目有关。组里对它了解了很多，你也是。"
- en: "Weekly Progress Reports"
  zh: "周报"
- en: "{advisor} wants a written progress report every week from now on. \"Just a few bullet points. Every Friday.\""
  zh: "{advisor}说以后每周交一份周报。“列几条要点就行，每周五发我。”空气里飘来一股班味。"
- en: "Write them every Friday"
  zh: "每周五按时写"
- en: "Writing down what you did turns out to be useful. Writing down what you didn't do, less so."
  zh: "把做了什么写下来，原来挺有用。把没做什么写下来，就没那么有用了。"
- en: "Turn your notes into the report"
  zh: "直接把笔记改成报告"
- en: "Your lab notebook becomes the report, and it takes ten minutes a week."
  zh: "你的实验记录本直接变成了报告，每周只花十分钟。"
- en: "Your notes say \"fixed thing\" four times. {advisor} asks which thing."
  zh: "你的笔记里写了四次“改了点东西”。{advisor}问是哪个东西。"
- en: "Propose a shared progress doc"
  zh: "提议用共享进展文档"
- en: "{advisor} likes it. Nobody reads it but you, which helps more than you expect."
  zh: "{advisor}很喜欢，只是除了你没人看它，但这比你想的更有用。"
- en: "A Very Motivated Undergrad"
  zh: "本科卷王来了"
- en: "{advisor} asks you to mentor {mentee}, a new undergrad who is \"very motivated\". {mentee} has already emailed you twice."
  zh: "{advisor}让你带 {mentee}，一个“干劲十足”的新本科生。{mentee} 已经给你发了两封邮件。"
- en: "Give them a real subproject"
  zh: "给对方一个真正的子项目"
- en: "You write {mentee} a two-page plan. Explaining your project makes you understand it better."
  zh: "你给 {mentee} 写了一份两页的计划。给别人讲自己的项目的过程反而让你对项目理解得更透了。"
- en: "Start them on reading"
  zh: "先让对方读论文"
- en: "You send {mentee} five papers. They read all five by Tuesday and come back with good questions."
  zh: "你给 {mentee} 发了五篇论文。到周二对方就全读完了，还带着一堆问题来找你。"
- en: "Suggest {labmate} instead"
  zh: "推荐 {labmate} 来带"
- en: "{labmate} is delighted. They've wanted a mentee for months."
  zh: "{labmate} 很高兴，几个月来一直想带个学生。"
- en: "{labmate} is swamped, so {mentee} becomes yours anyway, a week late."
  zh: "{labmate} 忙得不可开交，所以 {mentee} 最后还是归你带，只是拖了一周。"
- en: "One Inspiring Keynote"
  zh: "报告听上头了"
- en: "{advisor} comes back from one inspiring keynote and wants {project} to go in a whole new direction. \"Everything is about this now.\""
  zh: "{advisor}听了一场振奋人心的主旨报告回来，想让 {project} 彻底换个方向。“现在一切都要围绕这个方向。”"
- en: "Pivot {project}"
  zh: "给 {project} 转方向"
- en: "You're back at the idea stage, with half your novelty and a clean whiteboard."
  zh: "你回到了想法阶段，新颖性只剩一半，白板倒是干干净净。"
- en: "Add one experiment in that direction"
  zh: "往那个方向加一个实验"
- en: "One small experiment satisfies the keynote energy, and it actually adds something."
  zh: "一个小实验就接住了导师听完报告的那股劲儿，而且确实有点用。"
- en: "Wait a week and see"
  zh: "等一周看看"
- en: "A week later, {advisor} has moved on to a different keynote."
  zh: "一周后，{advisor}又被另一场主旨报告圈粉了。"
- en: "A week later, they've watched the keynote twice more and are disappointed in you."
  zh: "一周后，导师又把那场报告看了两遍，对你有点失望。"
- en: "Caught in the Middle"
  zh: "夹心饼干"
- en: "{advisor} wants {project} framed as a methods paper. Your collaborator wants a findings paper. Both email you, separately, within the same minute."
  zh: "{advisor}想把 {project} 写成方法论文，你的合作者想写成发现型论文。两人在同一分钟内分别给你发了邮件。"
- en: "Side with your advisor"
  zh: "站导师这边"
- en: "Methods it is. The collaborator goes quiet for a week."
  zh: "那就写方法。合作者沉默了一周。"
- en: "Side with the collaborator"
  zh: "站合作者那边"
- en: "Findings it is. {advisor} agrees, slowly, and remembers."
  zh: "那就写发现。{advisor}慢慢点头同意，然后记在了小本本上。"
- en: "Draft both framings"
  zh: "两种写法都写"
- en: "You write two introductions. Everyone picks the second one, which neither of them proposed."
  zh: "你写了两版引言。大家都选了第二版，而那是他们俩谁都没提过的。"
- en: "Get them both on one call"
  zh: "拉两人开个电话会"
- en: "Twenty minutes later they agree, and each thinks it was their idea."
  zh: "二十分钟后两人达成一致，而且都觉得是自己的主意。"
- en: "The call runs an hour. You leave with three framings instead of two."
  zh: "电话开了一小时。你带走的写法从两种变成了三种。"
- en: "\"sounds good\""
  zh: "“挺好的”"
- en: "You send {advisor} a 2,000-word email laying out three options, with pros and cons for each. They reply \"sounds good\"."
  zh: "你给 {advisor}发了一封 2000 字的小作文，列出三个方案，每个都写了优缺点。导师回复：“挺好的。”"
- en: "Pick the option you liked"
  zh: "选你喜欢的方案"
- en: "You go with option B. Nobody objects, possibly because nobody read option A."
  zh: "你选了方案 B。没人反对，可能是因为没人读过方案 A。"
- en: "Ask \"Which one?\""
  zh: "追问“哪一个？”"
- en: "They call you, and you get ten genuinely useful minutes."
  zh: "导师给你打了电话，你得到了实实在在有用的十分钟。"
- en: "They reply \"sounds good\" again."
  zh: "导师又回了一句“挺好的”。"
- en: "Send a three-line version"
  zh: "发个三行精简版"
- en: "The three-line version gets a real answer in four minutes."
  zh: "三行版四分钟就换来了一个真正的答复。"
- en: "Comments on Version 2"
  zh: "第 2 版的修改意见"
- en: "{advisor} finally sends comments on your draft of {project}. They are on version 2, and you are on version 5."
  zh: "{advisor}终于发来了对 {project} 草稿的意见。导师看的是第 2 版，你已经写到第 5 版了。"
- en: "Map their comments onto v5"
  zh: "把意见对应到 v5"
- en: "Half the comments are already fixed. The other half are good."
  zh: "一半的意见已经改完了。另一半倒提得很好。"
- en: "Reply \"Fixed in v5!\""
  zh: "回复“v5 里已经改了！”"
- en: "\"Oh, great.\" You suspect v5 will be read sometime around v8."
  zh: "“哦，太好了。”你怀疑 v5 大概要到 v8 前后才会被读到。"
- en: "Ask them to read v5 now"
  zh: "请导师现在就看 v5"
- en: "They read v5 that night. The comments are sharp and on time."
  zh: "导师当晚就读了 v5。意见一针见血，而且来得及时。"
- en: "\"Will do!\" They do not."
  zh: "“好的！”然后就没有然后了。"
- en: "Sabbatical Abroad"
  zh: "出国学术休假"
- en: "{advisor} is taking a sabbatical abroad for the next few months. \"Nothing changes! We'll just meet at 6 am your time.\""
  zh: "{advisor}接下来几个月要出国学术休假。“一切照旧！我们就改成你那边早上 6 点开会。”"
- en: "Set three alarms"
  zh: "定三个闹钟"
- en: "You buy a second coffee maker. The first 6 am meeting goes fine, mostly."
  zh: "你又买了一台咖啡机。第一次早上 6 点的会，基本没翻车。"
- en: "Propose written updates instead"
  zh: "提议改成书面汇报"
- en: "{advisor} agrees: a written update each week, plus one call a month."
  zh: "{advisor}同意了：每周一份书面汇报，外加每月一次通话。"
- en: "\"Let's try 6 am first and see.\" You set your alarm."
  zh: "“先试试 6 点开会再说吧。”你定好了闹钟。"
- en: "Say 6 am is your best hour"
  zh: "说 6 点正是你的黄金时间"
- en: "Early Bird"
  zh: "晨型人"
- en: "You're sharpest at dawn anyway. {advisor} is impressed by how awake you are."
  zh: "反正你天一亮脑子最清楚。{advisor}很惊讶你怎么这么精神。"
- en: "Stay up until 6 am instead"
  zh: "干脆熬到早上 6 点"
- en: "Night Owl"
  zh: "夜猫子"
- en: "For you, 6 am is the end of the day. The meetings are oddly relaxed."
  zh: "对你来说，早上 6 点是一天的结束。这些会开得出奇地轻松。"
- en: "The 6 am Call"
  zh: "早上 6 点的电话会"
- en: "You join the call at 5:58 am. {advisor} is eating lunch in the sun and wants to tell you about their host lab."
  zh: "你在早上 5:58 加入通话。{advisor}正在阳光下吃午饭，想跟你聊聊这次访问的实验室。"
- en: "Join their lab's meeting too"
  zh: "顺便参加那边的组会"
- en: "You present to a lab you've never met, at dawn. Two of them email you afterward."
  zh: "天刚亮，你就给一个素不相识的实验室做了报告。会后有两个人给你发了邮件。"
- en: "Keep it to your project"
  zh: "只聊你的项目"
- en: "You get exactly the feedback you need, then sleep for another hour."
  zh: "你拿到了正好需要的反馈，然后倒头又睡了一个小时。"
- en: "Ask to visit for a week"
  zh: "申请过去访问一周"
- en: "\"Yes! I'll find the travel money.\" You start looking at flights."
  zh: "“好啊！差旅费我来想办法。”你开始看机票了。"
- en: "\"I'd love that, but the budget is tight this year.\""
  zh: "“我很想，但今年预算紧。”"
- en: "A Week Abroad"
  zh: "海外一周"
- en: "You spend a week in {advisor}'s host lab abroad. The coffee is better, and so is the whiteboard."
  zh: "你在 {advisor}访问的海外实验室待了一周。咖啡更好，白板也更好。"
- en: "Give a talk to their lab"
  zh: "给那边的组做报告"
- en: "The questions are great and lunch runs long. They invite you to come back."
  zh: "提问很精彩，午饭吃了很久。他们邀请你以后有机会再来。"
- en: "The projector fights you for ten minutes. The discussion after is still good."
  zh: "投影仪跟你较劲了十分钟。之后的讨论还是很不错。"
- en: "Work side by side with {advisor}"
  zh: "和 {advisor}并肩干活"
- en: "With real daytime meetings, you get more done in a week than in the last two months."
  zh: "白天能正常开会，你一周干的活比过去两个月还多。"
- en: "Explore the city on the weekend"
  zh: "周末逛逛这座城市"
- en: "You eat everything and come home with two ideas and a fridge magnet."
  zh: "你特种兵式吃遍全城，带着两个想法和一块冰箱贴回了家。"
- en: "Back From Sabbatical"
  zh: "休假归来"
- en: "{advisor} is back from sabbatical, full of ideas, with a small souvenir for everyone. Your meetings return to a human hour."
  zh: "{advisor}休假回来了，满脑子想法，还给每个人带了小纪念品。你们的会终于回到了正常人的时间。"
- en: "Pitch an idea from the trip"
  zh: "提一个这趟旅程里的想法"
- en: "One idea sticks. {advisor} wants a paper on it."
  zh: "有一个想法获得了认同。{advisor}想就此写篇论文。"
- en: "\"Interesting! Let's revisit.\" It is never revisited."
  zh: "“有意思！回头再聊。”再也没有回头。"
- en: "Enjoy your first 10 am meeting"
  zh: "享受第一次上午 10 点的会"
- en: "You sleep until 8, like a person."
  zh: "你一觉睡到 8 点，活得像个人了。"
- en: "Ask for the people they met"
  zh: "打听导师这趟认识的人"
- en: "You get forty minutes of stories and three introductions to people you should know."
  zh: "你听了四十分钟的故事，还被引荐给了三位你该认识的人。"
- en: "By Friday?"
  zh: "周五前？"
- en: "{advisor} asks if you could put together slides about your project for a funder visit, by Friday."
  zh: "{advisor}问你能不能在周五前做一份介绍你项目的幻灯片，资助方要来访。"
- en: "{advisor} needs two paragraphs on your project for a grant renewal. \"Nothing fancy. By Friday?\""
  zh: "{advisor}的基金续期需要两段介绍你项目的文字。“不用太讲究。周五前可以吗？”"
- en: "Drop everything and do it well"
  zh: "放下一切，好好做"
- en: "Your slides make it into the meeting, and your advisor mentions your name twice."
  zh: "你的幻灯片上了会，老板还两次提到了你的名字。"
- en: "Do a quick version"
  zh: "先糊弄一版"
- en: "It's good enough. Your advisor polishes it at midnight and doesn't mention it."
  zh: "够用了。导师半夜帮你润色了一遍，什么也没说。"
- en: "Ask for until next Wednesday"
  zh: "申请宽限到下周三"
- en: "\"Sure, Wednesday works.\" You could have just asked all along."
  zh: "“行啊，周三也可以。”早知道一开始就问了。"
- en: "Would You Come With Me?"
  zh: "你愿意跟我走吗？"
- en: "{advisor} closes the office door. Another university has made them an offer, a big one. \"Nothing is decided. But if I go, would you come with me?\""
  zh: "{advisor}关上办公室的门。另一所大学给导师抛来了橄榄枝，听说给得很到位。“还没定。但如果我走，你愿意跟我一起吗？”"
- en: "Say you'd come with them"
  zh: "说你愿意跟着走"
- en: "{advisor} looks relieved. That night you look up rents in a city you've never visited."
  zh: "{advisor}看起来松了口气。当晚你就开始查一座从没去过的城市的房租。"
- en: "Say you'd rather stay here"
  zh: "说你更想留下"
- en: "\"That's fair. We'd make it work either way.\" You tell your roommate you're not going anywhere."
  zh: "“可以理解。不管怎样我们都能安排好。”你告诉室友，你哪儿也不去。"
- en: "Ask for a few weeks to think"
  zh: "请几周时间考虑"
- en: "\"Of course.\" You think about it on the bus and through two entire seminars."
  zh: "“当然。”你坐公交时在想，整整两场讲座也都在想。"
- en: "The Counteroffer"
  zh: "挽留条件"
- en: "The department makes {advisor} a counteroffer. For two weeks the lab reads every closed door like tea leaves. Then {advisor} asks what you honestly think."
  zh: "系里给 {advisor}开出了挽留条件。整整两周，组里的人把每一扇关着的门都当成卦象来解读。然后 {advisor}问你真实的想法。"
- en: "Tell them to take the offer"
  zh: "劝导师接受 offer"
- en: "\"Thank you. That helps more than you know.\" They accept the new job the next morning."
  zh: "“谢谢你。这比你想的更有帮助。”第二天一早，导师接受了新工作。"
- en: "Say you hope they stay"
  zh: "说你希望导师留下"
- en: "They stay. The counteroffer comes with a bigger lab, and they say your answer tipped it."
  zh: "导师留下了。挽留条件里有一个更大的实验室，导师说是你的回答让自己改了主意。"
- en: "\"I hear you. I still think I have to go.\" They take the offer, and promise you won't be left behind."
  zh: "“我明白。但我还是觉得我得走。”导师接受了 offer，并保证不会把你丢下。"
- en: "Moving Week"
  zh: "搬家周"
- en: "You follow {advisor} to their new university, where you get a new badge and an empty lab that echoes."
  zh: "你跟着 {advisor}去了新学校，领到一张新工牌和一间空得能听见回声的实验室。"
- en: "Set up the new lab yourself"
  zh: "亲手搭起新实验室"
- en: "You label every machine and get every login working. {advisor} introduces you as the lab's co-founder."
  zh: "你给每台机器贴好标签，搞定了每一个账号登录。{advisor}介绍你时说你是实验室的联合创始人。"
- en: "Meet the new department"
  zh: "认识新院系"
- en: "After twelve coffees in five days, you know who has the good GPUs and who has the good snacks."
  zh: "五天喝了十二次咖啡，你摸清了谁手里有卡，谁抽屉里有零食。"
- en: "Live out of boxes and keep working"
  zh: "住在纸箱堆里继续干活"
- en: "Your desk is a box, and so is your chair. Your experiments don't notice the move, but your back does."
  zh: "你的桌子是个纸箱，椅子也是。你的实验没察觉到搬家，但你的腰察觉到了。"
- en: "Advising From Afar"
  zh: "远程指导"
- en: "{advisor} moves to their new university, and you stay. Your meetings are on video now, and a professor down the hall agrees to sign your forms."
  zh: "{advisor}去了新学校，你留了下来。你们改成视频开会，走廊那头的一位教授答应帮你签各种表格。"
- en: "Set a fixed weekly video call"
  zh: "固定每周视频会"
- en: "You meet Thursdays at 10, with an agenda sent the night before. It works better than the hallway chats ever did."
  zh: "你们每周四 10 点开会，前一晚发议程。比以前在走廊上聊的效果还好。"
- en: "Ask the local professor to co-advise"
  zh: "请本校那位教授联合指导"
- en: "They say yes. Now you get twice the comments, and someone nearby when {advisor} is hard to reach."
  zh: "对方答应了。现在你收到的意见翻倍，而且 {advisor}联系不上的时候，身边也有人可找。"
- en: "They're happy to sign forms, and only forms. You'll make the video calls work."
  zh: "对方乐意签表格，但也只签表格。视频会你得自己想办法开好。"
- en: "Enjoy the quiet"
  zh: "享受清静"
- en: "Nobody drops by your desk unannounced anymore. You get a lot done, and you and {advisor} drift a little."
  zh: "再也没人不打招呼就跑到你桌前了。你效率很高，和 {advisor}却渐渐疏远了一点。"
