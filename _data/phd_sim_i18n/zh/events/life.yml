# zh translations for events/life (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Lease Renewal"
  zh: ""
- en: "Your lease renewal arrives. The rent goes up again, by an amount your stipend has never heard of."
  zh: ""
- en: "Lease renewal season. Your landlord's letter calls the rent increase \"a modest adjustment\"."
  zh: ""
- en: "Sign it and sigh"
  zh: ""
- en: "You sign. Your budget spreadsheet gets a new row called \"fewer takeout nights\"."
  zh: ""
- en: "Negotiate with the landlord"
  zh: ""
- en: "You point out the broken heater and the mystery leak. The increase gets cut in half."
  zh: ""
- en: "Your landlord listens kindly and changes nothing."
  zh: ""
- en: "Move somewhere cheaper"
  zh: ""
- en: "Three viewings and a rented van later, you have a cheaper place and a longer commute."
  zh: ""
- en: "The Drummer"
  zh: ""
- en: "Your roommate's new hobby is drums. They practice every evening from 8 to 10, which used to be your writing time."
  zh: ""
- en: "Buy noise-canceling headphones"
  zh: ""
- en: "The drums become a distant thud. You can almost think again."
  zh: ""
- en: "Work late at the lab instead"
  zh: ""
- en: "The lab is quiet at night. You start seeing your labmates more than your friends."
  zh: ""
- en: "Ask for a practice schedule"
  zh: ""
- en: "They agree to weekends only. In return, you agree to come to their first gig."
  zh: ""
- en: "They agree, and by Wednesday the drums are back."
  zh: ""
- en: "Join in on bass"
  zh: ""
- en: "Musician"
  zh: ""
- en: "Your roommate is thrilled. Within a week you have a band and a terrible name for it."
  zh: ""
- en: "Moving Week"
  zh: ""
- en: "Your lease ends the same week as your deadline for {project}. The boxes are packed, and the paper is not."
  zh: ""
- en: "Move everything in one weekend"
  zh: ""
- en: "Two days of stairs and tape. On Monday your back hurts, and so does the draft."
  zh: ""
- en: "Ask the lab to help, buy pizza"
  zh: ""
- en: "Four labmates and six pizzas get you moved in one afternoon. You owe everyone a favor."
  zh: ""
- en: "Live out of boxes until the deadline"
  zh: ""
- en: "You write the paper sitting on a box labeled KITCHEN, with your laptop on one labeled BOOKS."
  zh: ""
- en: "First Snow"
  zh: ""
- en: "The first snow of the year. Your walk to the lab takes twice as long, and you arrive looking like a snowman."
  zh: ""
- en: "Work from home today"
  zh: ""
- en: "You write all day in warm socks, and it goes surprisingly well."
  zh: ""
- en: "Trudge in anyway"
  zh: ""
- en: "You arrive soaked. The lab is empty except for {labmate}, who also trudged in."
  zh: ""
- en: "Build a snowman with the lab"
  zh: ""
- en: "It wears a lab badge and holds a sign that says REVIEWER 2. Everyone takes a photo."
  zh: ""
- en: "First Warm Day"
  zh: ""
- en: "The first warm day of spring. You walk into the lab at 10 am and nobody is there. Everyone is outside on the grass."
  zh: ""
- en: "Join them outside"
  zh: ""
- en: "The whole lab lies in the sun, talking about anything but work. It's the best lab meeting of the year."
  zh: ""
- en: "Enjoy the empty lab"
  zh: ""
- en: "You have the lab to yourself and get a lot done. It gets a little lonely by lunch."
  zh: ""
- en: "Read papers on the grass"
  zh: ""
- en: "You read two papers in the sun. You remember both of them better than usual."
  zh: ""
- en: "Lab Thanksgiving"
  zh: ""
- en: "{senior} hosts a Thanksgiving potluck for everyone in the lab who can't fly home."
  zh: ""
- en: "Bring a dish you can actually cook"
  zh: ""
- en: "Your dish is gone in ten minutes. Several people ask for the recipe."
  zh: ""
- en: "Bring a store-bought pie"
  zh: ""
- en: "Nobody judges the pie, and it's the first dish to run out."
  zh: ""
- en: "Stay home and write"
  zh: ""
- en: "You get a good writing day. The group chat fills with photos of food."
  zh: ""
- en: "Cook something ambitious"
  zh: ""
- en: "Foodie"
  zh: ""
- en: "Your dish is the talk of the evening. People from two other labs show up just to try it."
  zh: ""
- en: "Lunar New Year"
  zh: ""
- en: "{labmate} invites the lab over to make dumplings for Lunar New Year."
  zh: ""
- en: "Fold dumplings until midnight"
  zh: ""
- en: "Your first dumplings look like modern art. By the fortieth, they look like dumplings."
  zh: ""
- en: "Come for dinner, leave early"
  zh: ""
- en: "You eat a lot of dumplings and are home by nine."
  zh: ""
- en: "Send wishes and keep working"
  zh: ""
- en: "You send a red envelope emoji to the group chat, then watch the dumpling photos roll in."
  zh: ""
- en: "Home for the Holidays"
  zh: ""
- en: "Home for winter break. Over dinner, a relative asks when you'll graduate. Everyone stops eating to hear the answer."
  zh: ""
- en: "Give a confident date"
  zh: ""
- en: "\"Two more years.\" Everyone is pleased. You will hear this date again next year."
  zh: ""
- en: "Explain how a PhD works"
  zh: ""
- en: "Your explanation lands. An aunt says it sounds like a startup with no money, which is fair."
  zh: ""
- en: "Ten minutes in, someone asks if you could just finish early."
  zh: ""
- en: "Ask about your cousin's new job"
  zh: ""
- en: "The table turns to your cousin. You get a quiet second helping of dessert."
  zh: ""
- en: "The Printer"
  zh: ""
- en: "You explain your research to your relatives over the holidays. They listen carefully, then ask if you can fix their printer."
  zh: ""
- en: "Fix the printer"
  zh: ""
- en: "You fix it in five minutes. You are now the family's AI expert and IT department."
  zh: ""
- en: "Two hours later, the printer prints one page and stops forever. Nobody blames you, out loud."
  zh: ""
- en: "Explain your research again"
  zh: ""
- en: "Second try: \"I help computers understand people.\" That one sticks."
  zh: ""
- en: "Recommend a new printer"
  zh: ""
- en: "They buy a new one online, and you end up setting it up anyway."
  zh: ""
- en: "A Cat Named Baseline"
  zh: ""
- en: "A shelter near campus posts a photo of a grumpy gray cat named Baseline. Baseline needs a quiet home with someone who works from home a lot."
  zh: ""
- en: "Adopt Baseline"
  zh: ""
- en: "Baseline inspects the apartment and moves in by sitting on your printed draft."
  zh: ""
- en: "Foster for a month first"
  zh: ""
- en: "Baseline arrives on a trial basis. Baseline does not seem to know it's a trial."
  zh: ""
- en: "Not with these deadlines"
  zh: ""
- en: "You close the tab. Baseline finds a home with fewer deadlines a week later."
  zh: ""
- en: "The Trial Ends"
  zh: ""
- en: "The foster month is over. Baseline has claimed your desk chair and your favorite sweater."
  zh: ""
- en: "Make it official"
  zh: ""
- en: "You sign the papers. Baseline celebrates by knocking a pen off your desk."
  zh: ""
- en: "Return Baseline to the shelter"
  zh: ""
- en: "The shelter finds Baseline a family within a week. Your chair is yours again, and a little too empty."
  zh: ""
- en: "Guest Speaker"
  zh: ""
- en: "Halfway through your video update at lab meeting, Baseline sits on your keyboard and blocks the camera. After that, nobody asks about your results, only the cat's name."
  zh: ""
- en: "Introduce Baseline properly"
  zh: ""
- en: "Baseline gets a round of applause. Your results get a follow-up meeting."
  zh: ""
- en: "Close the door and carry on"
  zh: ""
- en: "Baseline meows through the rest of your update. Your slides have never had a louder audience."
  zh: ""
- en: "Make Baseline the lab mascot"
  zh: ""
- en: "By Friday, Baseline is the lab's Slack icon, and {labmate} is printing stickers."
  zh: ""
- en: "Submitted by Baseline"
  zh: ""
- en: "You leave a half-written peer review open and go make tea. Baseline walks across the keyboard. The review is now submitted, with a score of 1 and the comment \"jjjjjjjjjjjjjjj;\"."
  zh: ""
- en: "Email the area chair and confess"
  zh: ""
- en: "The area chair reopens it and writes back, \"Please thank the cat for its time.\""
  zh: ""
- en: "The area chair reopens it three days later. You rewrite the whole review over the weekend."
  zh: ""
- en: "Edit the review before the deadline"
  zh: ""
- en: "The system still allows edits. Baseline's version stays in the history log forever."
  zh: ""
- en: "Leave it. Baseline has a point."
  zh: ""
- en: "Somewhere, an author gets the shortest review of their life. You and Baseline sleep well."
  zh: ""
- en: "Where You Work"
  zh: ""
- en: "Your parents visit for a week and want to see \"where you work\". You think about your desk and its collection of empty coffee cups."
  zh: ""
- en: "Give them the full lab tour"
  zh: ""
- en: "They meet your labmates and take a photo of your name on the door."
  zh: ""
- en: "Show them the nice library"
  zh: ""
- en: "The library is beautiful and dignified. Your parents assume your desk looks like this."
  zh: ""
- en: "Skip campus, show them the city"
  zh: ""
- en: "You spend the week on good food and long walks. They still don't know what you do, and nobody minds."
  zh: ""
- en: "\"So What Do You Do?\""
  zh: ""
- en: "A dating-app match asks what you do. You type \"PhD student\", and the conversation ends there."
  zh: ""
- en: "Your dating-app match asks what you do. You say \"PhD.\" They reply \"oh\" and are never heard from again."
  zh: ""
- en: "Try \"I teach computers to read\""
  zh: ""
- en: "A new match asks a follow-up question, then another. You have a coffee date on Saturday."
  zh: ""
- en: "\"So you're the reason my phone autocorrects everything?\" That one ends too."
  zh: ""
- en: "Delete the app, go to trivia night"
  zh: ""
- en: "Your friends' team wins on a history-of-computing question that you answered."
  zh: ""
- en: "Put the phone down and work"
  zh: ""
- en: "You get some work done. The paper, at least, never asks what you do."
  zh: ""
- en: "Twelve Hours Apart"
  zh: ""
- en: "Your family is twelve time zones away. When you wake up, they're going to bed. When they wake up, you're debugging."
  zh: ""
- en: "Call at 7 am before the lab"
  zh: ""
- en: "A sleepy, happy call. Your mom asks if you're eating. You say yes, which is mostly true."
  zh: ""
- en: "Call at midnight after work"
  zh: ""
- en: "Their breakfast is your midnight dinner, and the call runs long."
  zh: ""
- en: "Trade voice messages"
  zh: ""
- en: "The conversation stretches over a whole day, one message at a time. It's nearly as good as a call."
  zh: ""
- en: "Same Day"
  zh: ""
- en: "The same day {paper} is rejected from {venue}, your undergrad friend posts about their second promotion this year."
  zh: ""
- en: "Send a sincere congratulations"
  zh: ""
- en: "You mean it, mostly. They write back, \"Your stuff is way cooler though.\""
  zh: ""
- en: "Mute the group chat for a day"
  zh: ""
- en: "You take a day off from everyone's good news. Tomorrow you'll be happy for them."
  zh: ""
- en: "Congratulate them, invite them to dinner"
  zh: ""
- en: "They pay, to celebrate, and you talk about everything except reviews."
  zh: ""
- en: "The Wedding Weekend"
  zh: ""
- en: "Your close friend's wedding is the same weekend as your submission deadline for {project}. The invitation has been on your fridge for months."
  zh: ""
- en: "Go and enjoy every minute"
  zh: ""
- en: "You dance badly and toast well. On Monday you are behind and happy about it."
  zh: ""
- en: "Go to the ceremony, skip the party"
  zh: ""
- en: "You hug the couple after the vows and catch the last train home to write."
  zh: ""
- en: "Send a gift and a video toast"
  zh: ""
- en: "Your video toast plays between dinner and dessert. You watch the replay at 2 am, still writing."
  zh: ""
- en: "Black Screen"
  zh: ""
- en: "The week before your deadline for {project}, your laptop makes a soft clicking noise and never turns on again."
  zh: ""
- en: "Restore from your backup"
  zh: ""
- en: "Your nightly backup has everything up to last night. You lose one paragraph and zero sleep."
  zh: ""
- en: "Your last backup is from March, when the paper was still an outline."
  zh: ""
- en: "Rebuild from Git and Overleaf"
  zh: ""
- en: "The code is on Git and the paper is on Overleaf. The figures were only on your desktop."
  zh: ""
- en: "Borrow {labmate}'s old laptop"
  zh: ""
- en: "{labmate} hands over a slow laptop covered in stickers. It runs, and you owe them big."
  zh: ""
- en: "{labmate}'s laptop is from 2015 and needs updates for a day before it does anything."
  zh: ""
- en: "Cracked"
  zh: ""
- en: "On the first morning in {city}, your phone slips out of your hand on the convention center stairs. The screen is now a spider web."
  zh: ""
- en: "Tape it and carry on"
  zh: ""
- en: "The tape covers the cracks and half the conference app. You navigate by asking strangers."
  zh: ""
- en: "Find a repair shop in {city}"
  zh: ""
- en: "The repair shop is two hours across town. You get a new screen and miss the morning session."
  zh: ""
- en: "Go phone-free for the trip"
  zh: ""
- en: "Without a phone, you talk to everyone at the coffee breaks. It's the best conference you've had."
  zh: ""
- en: "Free Pizza"
  zh: ""
- en: "A seminar on medieval tax records is offering free pizza. You have no interest in medieval tax records, and you go anyway."
  zh: ""
- en: "There's free pizza at a seminar on bridge corrosion, a topic you know nothing about. You get there early."
  zh: ""
- en: "A poster in the elevator says \"Soil Acoustics Seminar, Free Pizza\". You only read the second half."
  zh: ""
- en: "Take two slices and slip out"
  zh: ""
- en: "That's lunch sorted, and you're fairly sure nobody saw you leave."
  zh: ""
- en: "Stay for the whole talk"
  zh: ""
- en: "The speaker uses a method you've never seen. It might work on your data, too."
  zh: ""
- en: "Stay and ask a question"
  zh: ""
- en: "Your question is good. The speaker asks to grab coffee, and now you know someone in a whole other field."
  zh: ""
- en: "Your question was answered on slide 4. You eat a third slice in silence."
  zh: ""
- en: "Still Alive"
  zh: ""
- en: "The desk plant you bought during orientation has survived a whole year, including a heat wave and your idea of a watering schedule."
  zh: ""
- en: "Repot it into something bigger"
  zh: ""
- en: "It grows a new leaf in its new pot the following week."
  zh: ""
- en: "Buy it some friends"
  zh: ""
- en: "You buy three more plants, and the lab starts calling your desk the greenhouse."
  zh: ""
- en: "Add it to your acknowledgments draft"
  zh: ""
- en: "It goes on the list, between your parents and the GPU cluster."
  zh: ""
- en: "Just a Short Run"
  zh: ""
- en: "A run to clear your head works better than any meeting this month. {labmate} mentions a half-marathon in three months, with a beginner training plan that is \"very gentle\"."
  zh: ""
- en: "Sign up for the half-marathon"
  zh: ""
- en: "You pay the entry fee before you can change your mind. The plan says Tuesday is \"easy 5k\"."
  zh: ""
- en: "Run when you feel like it"
  zh: ""
- en: "You run a loop by the river whenever the week gets loud."
  zh: ""
- en: "One run was plenty"
  zh: ""
- en: "Your shoes go back in the closet. Your legs thank you, and so does your calendar."
  zh: ""
- en: "The Long Run"
  zh: ""
- en: "Week six of the training plan says \"long run, 16 km, Sunday morning\". Your legs have opinions about this, and so does your inbox."
  zh: ""
- en: "Do the long run"
  zh: ""
- en: "Sixteen kilometers. You think through a whole paper on the way and forget it by the shower."
  zh: ""
- en: "Swap it for two short runs"
  zh: ""
- en: "Two short runs are less heroic, but they still count, more or less."
  zh: ""
- en: "Defer the race to next year"
  zh: ""
- en: "You email the organizers. The training plan goes in a drawer, and your Sundays come back."
  zh: ""
- en: "Race Day"
  zh: ""
- en: "Race day: 21 kilometers and a crowd with handmade signs. At kilometer 15, {labmate} holds one up: \"REVIEWER 2 IS RIGHT BEHIND YOU.\""
  zh: ""
- en: "Go for a fast time"
  zh: ""
- en: "You finish strong and a little teary. The medal goes on your monitor, where visitors can't miss it."
  zh: ""
- en: "You start too fast and walk kilometers 17 to 19. You still finish, and you still get the medal."
  zh: ""
- en: "Run easy and enjoy it"
  zh: ""
- en: "You high-five every kid on the course and finish in your slowest time, grinning."
  zh: ""
- en: "Run the last 5 km with {labmate}"
  zh: ""
- en: "{labmate} jumps in at kilometer 16, in jeans. You cross the line together, and the photo goes in the lab chat."
  zh: ""
- en: "The Kitchen at the Party"
  zh: ""
- en: "At a friend's party, you end up talking to someone in the kitchen for an hour. They ask good questions about your research and don't flinch at the word \"PhD\"."
  zh: ""
- en: "Ask for their number"
  zh: ""
- en: "They type it into your phone themselves, with a dinosaur emoji. You walk home slower than usual."
  zh: ""
- en: "Keep talking about your research"
  zh: ""
- en: "At midnight they're still interested, so you swap numbers on the way out."
  zh: ""
- en: "Somewhere around inter-annotator agreement, they spot a friend across the room."
  zh: ""
- en: "Head home early, deadline tomorrow"
  zh: ""
- en: "You go home and write, and the draft gets better. You think about the kitchen conversation all week."
  zh: ""
- en: "Saturday Dinner?"
  zh: ""
- en: "The person from the party texts: dinner on Saturday? Saturday is also when you'd planned to finish your related-work section."
  zh: ""
- en: "Say yes to dinner"
  zh: ""
- en: "Dinner turns into a long walk, then a second date. Related work can wait, and it does."
  zh: ""
- en: "Suggest coffee on Sunday instead"
  zh: ""
- en: "Coffee turns into lunch. You're taking it slow, and that suits you both."
  zh: ""
- en: "Say you're swamped this month"
  zh: ""
- en: "They say \"good luck with it\" and mean it. You finish related work on Saturday, alone with a citation manager."
  zh: ""
- en: "Meal Prep Era"
  zh: ""
- en: "You're in a cooking phase. Sunday is meal-prep day now: 14 identical containers and a spreadsheet of macros you'll never open."
  zh: ""
- en: "Keep the streak going"
  zh: ""
- en: "Lentils on Monday, lentils on Friday. You've never had more energy, or more lentils."
  zh: ""
- en: "Cook for the lab on Wednesdays"
  zh: ""
- en: "Your curry becomes a lab tradition. {labmate} starts bringing a fork from home."
  zh: ""
- en: "Let the phase end gracefully"
  zh: ""
- en: "Sunday is yours again. By Thursday, dinner is cereal, eaten standing up."
  zh: ""
- en: "Go full chef"
  zh: ""
- en: "Your containers have garnishes. People from other labs ask whether you take orders."
  zh: ""
- en: "An Idea and a Sunburn"
  zh: ""
- en: "You go hiking with friends and leave the laptop at home. Near the top, the fix for {project} arrives fully formed, along with a sunburn."
  zh: ""
- en: "Type it into your phone right there"
  zh: ""
- en: "You write it at the summit with one bar of signal and a red nose. On Monday, it still makes sense."
  zh: ""
- en: "Call {labmate} from the trail"
  zh: ""
- en: "{labmate} picks up on the third try and tests half of it by Monday. Your friends roll their eyes all the way down."
  zh: ""
- en: "Enjoy the view and trust your memory"
  zh: ""
- en: "On Monday the idea is still there, and the rest has made it better."
  zh: ""
- en: "On Monday you remember the view and the sunburn, but not the idea."
  zh: ""
- en: "The PhD League"
  zh: ""
- en: "You join an intramural soccer team. Every single player is a PhD student. Half-time talk is about p-values, and the captain picks the lineup with a script."
  zh: ""
- en: "Play every Thursday"
  zh: ""
- en: "You lose every game by at least four goals. It's the best part of your week."
  zh: ""
- en: "In the second game, you sprain an ankle chasing a ball you were never going to reach. The team signs your brace."
  zh: ""
- en: "Cheer from the sideline"
  zh: ""
- en: "You hold the snacks and shout encouragement. The team votes you most valuable non-player."
  zh: ""
- en: "Model the team's win probability"
  zh: ""
- en: "Stats Nerd"
  zh: ""
- en: "Your model gives the team a 2% chance. They win anyway, and you update your priors in front of everyone."
  zh: ""
- en: "Reviewer 2, Times Six"
  zh: ""
- en: "Halloween at the lab. Six people show up as Reviewer 2, each with a red pen and a sign that says \"The novelty is limited.\" Nobody coordinated."
  zh: ""
- en: "Go as Reviewer 2 as well"
  zh: ""
- en: "Seven Reviewer 2s. The group photo looks like a very harsh program committee."
  zh: ""
- en: "Go as the area chair"
  zh: ""
- en: "You overrule all six of them with one sticky note. Best costume is yours."
  zh: ""
- en: "Nobody knows what an area chair looks like. Several people think you're a delivery driver."
  zh: ""
- en: "Skip the party, finish a draft"
  zh: ""
- en: "You hear the laughter through the wall. The draft gets a page longer and a little grumpier."
  zh: ""
