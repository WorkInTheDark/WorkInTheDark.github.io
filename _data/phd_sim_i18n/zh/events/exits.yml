# zh translations for events/exits (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Is This Worth It?"
  zh: "读博图啥？"
- en: "It's 2 am and you're asking the question everyone asks eventually: is this worth it?"
  zh: "凌晨 2 点，你问出了那个人人迟早会问的问题：读博到底图啥？"
- en: "You catch yourself browsing job listings during a seminar, and not for the first time."
  zh: "讲座听到一半，你发现自己在刷招聘信息。这不是第一次了。"
- en: "Take a semester of leave"
  zh: "休学一学期"
- en: "You file the paperwork and feel better right away."
  zh: "表一交上去，你整个人立刻轻松了。"
- en: "Talk to your advisor about it"
  zh: "找导师谈谈心"
- en: "Your advisor listens, then helps you cut your plan in half. It helps more than you expected."
  zh: "导师听完，帮你把计划砍掉了一半。比你想的管用多了。"
- en: "The conversation is awkward. At least it's said out loud now."
  zh: "聊得有点尴尬。但至少，话说出口了。"
- en: "Leave with a Master's"
  zh: "拿个硕士学位走人"
- en: "Deciding feels like putting down something heavy."
  zh: "决定一做，肩上一下子轻了。"
- en: "Sleep on it and keep going"
  zh: "睡一觉，接着干"
- en: "Things look a little better in the morning, as they usually do."
  zh: "一觉醒来，你觉得自己又能再战了。一向如此。"
- en: "The Usual?"
  zh: "还是老样子？"
- en: "The bubble tea shop owner knows your order and your thesis topic. Today she mentions she's thinking of selling the shop."
  zh: "奶茶店老板娘记得你常点什么，连你的论文题目都知道。今天她随口提起，想把店转出去。"
- en: "Ask what it would cost, out of curiosity"
  zh: "随口问问转让费"
- en: "It's more than a stipend and less than you'd think. You save the number in your notes app."
  zh: "比博士工资多，又比你想的少。你默默记进了备忘录。"
- en: "Wish her luck and get back to work"
  zh: "祝她顺利，回去搬砖"
- en: "Your tea is perfect, as always."
  zh: "还是原来的配方，还是熟悉的味道。"
- en: "The Family Business"
  zh: "家里的买卖"
- en: "Over holiday dinner, your uncle asks, again, when you'll come home and help run the family business. This year he has a spreadsheet."
  zh: "过节的饭桌上，叔叔照例问你什么时候回家帮忙打理生意。今年他有备而来：带了一张 Excel 表。"
- en: "Look at the spreadsheet"
  zh: "看看那张表"
- en: "It's a terrible spreadsheet. The dangerous part is that you could fix it in an afternoon."
  zh: "这表惨不忍睹，合并单元格满天飞。危险的是，你一下午就能理顺。"
- en: "Change the subject to dessert"
  zh: "把话题岔到红烧肉上"
- en: "Everyone is happy to talk about dessert instead."
  zh: "大家都很乐意改聊红烧肉。"
- en: "You'd Make a Good Doctor"
  zh: "有人劝你学医"
- en: "After another study session, a clinician you work with says, half-joking: \"You understand our workflow better than our residents. Ever thought about med school?\""
  zh: "又做完一轮研究，合作的临床医生半开玩笑地说：“你比我们的住院医还懂我们的流程。没想过学医吗？”"
- en: "Laugh, then look up the requirements"
  zh: "笑笑，转头就去查申请条件"
- en: "You bookmark the page. Then you bookmark it again in a different browser."
  zh: "你把网页加进了收藏夹。然后又在另一个浏览器里收藏了一遍。"
- en: "Laugh it off"
  zh: "一笑置之"
- en: "You're flattered. You're also very happy not to work night shifts."
  zh: "你被夸得有点飘。但一想到夜班，又觉得现在挺好。"
- en: "For Sale"
  zh: "旺铺转让"
- en: "The sign in the bubble tea shop window says FOR SALE. The owner sees you staring and waves you in."
  zh: "奶茶店橱窗上贴出了“旺铺转让”。老板娘见你盯着看，招手让你进去。"
- en: "Buy the shop"
  zh: "盘下这家店"
- en: "You hand in your keycard and tie on an apron."
  zh: "你交还门禁卡，系上围裙。从此调的不是参，是甜度。"
- en: "Not yet. Maybe after the defense"
  zh: "先不了，答辩完再说"
- en: "You order the usual. She gives you an extra topping, on the house."
  zh: "你点了老样子。老板娘免费给你多加了份小料。"
- en: "A Recruiter Calls"
  zh: "猎头来电"
- en: "A recruiter from a trading firm messages you: \"Your statistics skills are wasted on papers. Want to talk?\" The salary range in the message has a lot of digits."
  zh: "一家量化交易公司的猎头给你发消息：“你的统计功底拿来写论文太浪费了。聊聊？”消息里的薪资范围，你数了两遍零。"
- en: "Take the call, out of curiosity"
  zh: "好奇接个电话"
- en: "They talk market microstructure for forty minutes. You follow about half of it, and you're intrigued."
  zh: "对方讲了四十分钟市场微观结构。你听懂一半，但已经心动了。"
- en: "Ignore it and get back to work"
  zh: "已读不回，继续干活"
- en: "You archive the message but don't delete it."
  zh: "你把消息归档了，但没舍得删。"
- en: "Brief the Staffers"
  zh: "去做政策简报"
- en: "A policy institute invites you to brief a room of government staffers on how AI systems get evaluated. They want it short and free of jargon."
  zh: "一家政策研究机构请你给一屋子政府工作人员讲讲 AI 系统是怎么评测的。要求：简短，说人话。"
- en: "Say yes and write a one-pager"
  zh: "答应下来，写一页纸摘要"
- en: "Explaining your field without jargon is hard and good practice. They ask you to stay in touch."
  zh: "不用黑话讲清楚自己的领域，很难，也很练人。对方希望以后常联系。"
- en: "Decline politely"
  zh: "礼貌婉拒"
- en: "Your advisor says there will be other invitations."
  zh: "导师说，以后机会多的是。"
- en: "Your Video Took Off"
  zh: "你的视频火了"
- en: "The five-minute explainer you made for your paper has 50,000 views. The comments are mostly kind, and one of them is from a researcher you admire."
  zh: "你给论文做的五分钟讲解视频在 B站有了 5 万播放。评论区大多很友善，其中一条来自你崇拜的大佬。"
- en: "Make another one"
  zh: "再做一期"
- en: "You buy a better microphone. The second video does even better."
  zh: "你换了个好点的麦。第二期数据更好。"
- en: "Enjoy it and get back to research"
  zh: "开心一下，回去做研究"
- en: "You screenshot the nice comment and keep going."
  zh: "你默默截图存下那条评论，继续干活。"
- en: "Write It for Everyone"
  zh: "写篇科普"
- en: "A science magazine asks if you'd write 1,200 words about your research for a general audience, with no equations and no hedging in every sentence."
  zh: "一家科普杂志问你愿不愿意写 1200 字，给大众介绍你的研究。不要公式，也别每句话都加上“在一定程度上”。"
- en: "Write it"
  zh: "写"
- en: "Your editor cuts every second qualifier. The piece is clearer than anything you've written, and your aunt shares it."
  zh: "编辑砍掉了一半限定词。这是你写过最清楚的文章，还被姑姑转进了家族群。"
- en: "Decline, there's a deadline"
  zh: "婉拒，DDL 要紧"
- en: "You'll do the next one, after this deadline and the one after it."
  zh: "下次一定。等这个截稿过了，再等下一个截稿过了。"
- en: "An Envelope"
  zh: "一封信"
- en: "You applied to a medical school on a whim last fall. Today there's an acceptance letter in your inbox, and a deadline to reply."
  zh: "去年秋天你脑子一热，申请了医学院。今天收件箱里躺着一封录取信，回复还有截止日期。"
- en: "Go to med school"
  zh: "转行学医"
- en: "You tell your advisor, who says the clinicians always knew. You start in August."
  zh: "你跟导师说了，导师说合作的医生们早就看出你是学医的料。你 8 月入学。"
- en: "Stay and finish the PhD"
  zh: "留下，读完博士"
- en: "You decline, carefully. It's good to know the door was open."
  zh: "你斟酌着措辞回绝了。知道自己有条退路，心里踏实。"
- en: "The Offer from Home"
  zh: "家里喊你接班"
- en: "Your uncle calls. He's ready to retire, and he wants you to take over the family business. \"You can bring your laptop,\" he adds, as if that settles it."
  zh: "叔叔打来电话：他准备退休了，想让你回来接班。“你也能带着电脑回来干的嘛。”他补了一句，仿佛这样就没什么好犹豫的了。"
- en: "Go home and run it"
  zh: "回家接班"
- en: "You pack your office into two boxes. The spreadsheet never stood a chance."
  zh: "你把办公室收进两个箱子。那张 Excel 表在劫难逃。"
- en: "Not yet"
  zh: "先不了"
- en: "He says the offer stands, and he probably means it."
  zh: "他说这个位置一直给你留着，多半是真心的。"
