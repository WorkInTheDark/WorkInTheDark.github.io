# zh translations for events/teaching (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "120 Midterms"
  zh: ""
- en: "You have 120 midterms to grade by Monday. The stack on your desk is taller than your monitor."
  zh: ""
- en: "The midterm stack arrives: 120 exams of six questions each, due back Monday morning."
  zh: ""
- en: "Grade all weekend"
  zh: ""
- en: "You finish at midnight on Sunday, and now you dream about partial credit."
  zh: ""
- en: "Write a rubric first, then batch it"
  zh: ""
- en: "The rubric takes an hour and saves ten. Question by question, you finish Saturday night."
  zh: ""
- en: "Halfway through, an answer breaks your rubric. You regrade 60 exams."
  zh: ""
- en: "Spread it across the week"
  zh: ""
- en: "You grade for two hours every evening. Grades go in Wednesday, and the professor sends one pointed email."
  zh: ""
- en: "Half a Point"
  zh: ""
- en: "A student requests a regrade on a half-point question. The request is 900 words long and cites the syllabus, two lecture slides and the student handbook."
  zh: ""
- en: "Give them the half point"
  zh: ""
- en: "The student is thrilled. By evening, four more requests arrive, each citing \"precedent\"."
  zh: ""
- en: "Write a clear, kind explanation"
  zh: ""
- en: "They reply, \"Fair enough, thanks!\""
  zh: ""
- en: "They escalate to the professor, with your email attached and highlighted."
  zh: ""
- en: "Forward it to the professor"
  zh: ""
- en: "The professor gives them the half point and CCs you."
  zh: ""
- en: "The Line Goes Out the Door"
  zh: ""
- en: "It's office hours the day before the assignment is due, and the line goes out the door. Everyone has the same bug."
  zh: ""
- en: "Stay until everyone is helped"
  zh: ""
- en: "You leave at 9 pm, after thirty-one students with the same off-by-one error. You could fix it in your sleep, and soon will."
  zh: ""
- en: "Explain the bug once, to everyone"
  zh: ""
- en: "One explanation at the whiteboard sends thirty students away happy."
  zh: ""
- en: "Half the room follows. The other half lines up again, now with two bugs."
  zh: ""
- en: "Post a fix on the forum, end on time"
  zh: ""
- en: "Your forum post gets 40 thank-yous and one complaint that you posted it too late."
  zh: ""
- en: "A Very Good Question"
  zh: ""
- en: "At office hours, a student asks why the chatbot from lecture sounds so sure when it is wrong. Nobody has a good answer, which might make it a paper."
  zh: ""
- en: "Write the idea down right away"
  zh: ""
- en: "It goes into your ideas file, with the student's question word for word."
  zh: ""
- en: "Talk it through with the student"
  zh: ""
- en: "Forty minutes later you have a whiteboard full of ideas, and office hours have run over."
  zh: ""
- en: "Bring it to {advisor}"
  zh: ""
- en: "{advisor} lights up: \"That's a real gap.\" It goes on the list for next semester."
  zh: ""
- en: "{advisor} points you to three papers that already did it. At least now you've read them."
  zh: ""
- en: "You're Teaching Tomorrow"
  zh: ""
- en: "The professor has a cold and emails at 8 pm: \"Could you give tomorrow's lecture? Slides attached.\" There are 74 slides. You have seen about ten of them."
  zh: ""
- en: "Present their slides as they are"
  zh: ""
- en: "You get through it. On slide 52 you learn something new, live, along with everyone else."
  zh: ""
- en: "Stay up and make the slides your own"
  zh: ""
- en: "You cut it to 40 slides and add two examples from your research. Three students stay after to ask about it."
  zh: ""
- en: "Turn it into a discussion class"
  zh: ""
- en: "You give each small group one question and walk the room. Students call it the best class of the semester."
  zh: ""
- en: "\"Discuss in groups\" becomes 70 students on their phones. You present the slides after all."
  zh: ""
- en: "The Autograder Is Down"
  zh: ""
- en: "The night before the assignment is due, the autograder starts failing every submission, including the reference solution. The forum has 63 new posts."
  zh: ""
- en: "Debug it tonight"
  zh: ""
- en: "A dependency updated itself. You pin the version at 1 am and the forum calms down."
  zh: ""
- en: "By 4 am it passes the reference solution and fails everything else. You go to bed anyway."
  zh: ""
- en: "Ask the professor for an extension"
  zh: ""
- en: "The deadline moves 48 hours. The forum celebrates as if you personally saved them."
  zh: ""
- en: "Grade by hand next week"
  zh: ""
- en: "Everyone submits on time. Next week, you run 90 programs one by one."
  zh: ""
- en: "Is the Deadline Tonight?"
  zh: ""
- en: "A student email arrives at 3:04 am: \"Is the deadline tonight?\" The deadline was at midnight. You know the email arrived at 3:04 because you are awake too."
  zh: ""
- en: "Reply right now"
  zh: ""
- en: "\"It was at midnight, but submit now and I'll ask the professor.\" They submit at 3:09, and you're asleep by 4."
  zh: ""
- en: "Reply kindly in the morning"
  zh: ""
- en: "You close the laptop and reply at 9 am. The student had already submitted at 3:10."
  zh: ""
- en: "Ask yourself why you're awake at 3 am"
  zh: ""
- en: "You go to bed, and your sleep schedule thanks you, a little."
  zh: ""
- en: "Reply, then keep writing until 5"
  zh: ""
- en: "Night Owl"
  zh: ""
- en: "Since you're up anyway, you also finish a section of your paper."
  zh: ""
- en: "Very Patient, Talks Too Fast"
  zh: ""
- en: "Your TA evaluations are in. Nearly every comment says the same thing: \"Very patient, talks too fast.\" One student just wrote \"fast\"."
  zh: ""
- en: "Practice talking slower"
  zh: ""
- en: "You record yourself and time it. It's painful to watch, and your next practice talk goes better."
  zh: ""
- en: "Focus on the \"very patient\" part"
  zh: ""
- en: "You print it and stick it above your desk."
  zh: ""
- en: "Ask {labmate} to time your next talk"
  zh: ""
- en: "{labmate} raises a hand every time you speed up. By the end you're both laughing, and you're slower."
  zh: ""
- en: "{labmate} forgets to show up. You talk fast to an empty room."
  zh: ""
- en: "Old Nemesis"
  zh: ""
- en: "You are assigned to TA the course you barely passed as an undergrad, the one with the proof-heavy final. This time, you grade that final."
  zh: ""
- en: "Relearn it properly this time"
  zh: ""
- en: "On your second pass through the textbook, it finally clicks. Your undergrad self would be stunned."
  zh: ""
- en: "Stay one lecture ahead"
  zh: ""
- en: "You learn each topic the night before you teach it. It works, mostly, and nobody notices."
  zh: ""
- en: "Tell students you struggled too"
  zh: ""
- en: "Office hours fill up. Students say you explain it best, because you remember why it's hard."
  zh: ""
- en: "A student asks, \"So... should we trust your grading?\""
  zh: ""
- en: "Years Later"
  zh: ""
- en: "An email from a student you TA'd years ago: they are an engineer now, and your office hours are why they stayed in computer science. They remember your name. You remember their bug."
  zh: ""
- en: "Write back properly"
  zh: ""
- en: "You write a long, warm reply. It's the best thing you've written all month, and nobody will review it."
  zh: ""
- en: "Invite them to talk to your students"
  zh: ""
- en: "They give a guest talk to this year's class. Two students ask them for internship referrals."
  zh: ""
- en: "Save it in a \"good days\" folder"
  zh: ""
- en: "You start a folder for emails like this. The next rejection stings a little less."
  zh: ""
- en: "The Grading Pile"
  zh: ""
- en: "The midterms are in: 140 of them, due back by Monday. The professor is at a conference."
  zh: ""
- en: "All 38 final projects arrive at 11:59 pm, and some have videos."
  zh: ""
- en: "Grade them all carefully"
  zh: ""
- en: "Every one gets fair, detailed feedback. Two students email to say thank you, which almost never happens."
  zh: ""
- en: "Make a rubric and move fast"
  zh: ""
- en: "The rubric is a work of art. The grading goes fast, and nobody complains."
  zh: ""
- en: "Ask the other TA to split it"
  zh: ""
- en: "They say yes, and you owe them one."
  zh: ""
