# zh translations for events/career (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Invert a Binary Tree"
  zh: "手撕二叉树"
- en: "Your internship interview at {company} is for a research role on language models. The first question: \"Let's warm up. Invert a binary tree.\""
  zh: "你在 {company} 面的是大模型方向的研究实习。第一题：“先热个身，翻转一个二叉树吧。”"
- en: "Invert the binary tree"
  zh: "翻转这个二叉树"
- en: "You write six clean lines and handle the edge cases. The interviewer relaxes and asks about your research."
  zh: "六行代码一气呵成，边界情况一个没漏。面试官神色一松，开始问你的研究。"
- en: "You invert it twice, which gives back the original tree. The interviewer says \"interesting\" and writes something down."
  zh: "你翻转了两次，二叉树完美复原。面试官说了句“有意思”，低头记了点什么。"
- en: "Ask clarifying questions first"
  zh: "先把题目问清楚"
- en: "Your questions turn it into a conversation. You solve it slowly, but they like how you think."
  zh: "你的提问让面试变成了聊天。题解得有点慢，但对方很欣赏你的思路。"
- en: "You ask so many questions that time runs out before you write any code."
  zh: "你问了太多问题，一行代码还没写，时间就到了。"
- en: "Solve it fast, then pivot to research"
  zh: "速速解题，转聊研究"
- en: "You solve it and steer the talk to your paper, while the interviewer glances at the clock."
  zh: "你解完题就把话题往自己的论文上带，面试官瞄了一眼时钟。"
- en: "Your Mentor Has Left the Building"
  zh: "Mentor 已退出群聊"
- en: "In week two of your internship at {company}, your mentor announces they are moving to another team, effective Friday. Your project doc still says \"TBD with mentor\"."
  zh: "在 {company} 实习的第二周，你的 mentor 宣布要转去别的组，周五生效。你的项目文档里还写着“待与 mentor 确定”。"
- en: "Find a new mentor yourself"
  zh: "自己找个新 mentor"
- en: "A senior researcher two desks over adopts you, and turns out to be better at this than your first mentor."
  zh: "隔两个工位的一位资深研究员收留了你，结果带得比原来的 mentor 还好。"
- en: "Everyone is \"happy to chat\", but nobody is happy to mentor. You spend a week in limbo."
  zh: "人人都“很乐意聊聊”，但没人乐意带你。你在三不管地带晃荡了一周。"
- en: "Scope the project yourself"
  zh: "自己给自己立项"
- en: "You write your own project plan, and your manager approves it without reading it."
  zh: "你自己写了项目计划，经理看都没看就批了。"
- en: "Ask your old mentor for weekly chats"
  zh: "约前 mentor 每周聊聊"
- en: "They agree to a 30-minute call every Thursday from their new team."
  zh: "对方答应每周四从新组抽 30 分钟跟你通个电话。"
- en: "Footnote 3"
  zh: "脚注 3"
- en: "Your internship project at {company} ships. The press release thanks \"the team\". Your name is in footnote 3, spelled correctly."
  zh: "你在 {company} 的实习项目上线了。新闻稿感谢了“团队”。你的名字出现在脚注 3 里，拼写无误。"
- en: "Add it to your CV"
  zh: "写进简历"
- en: "\"Shipped to millions of users.\" It is one line on your CV, and recruiters read that line first."
  zh: "“上线服务数百万用户。”简历上就这一行，HR 却第一眼就看它。"
- en: "Ask about a return offer"
  zh: "问问转正 offer"
- en: "Your manager says they were about to bring it up. A return offer is on the table."
  zh: "经理说正打算跟你提这事。转正 offer 已经摆上桌了。"
- en: "\"Let's revisit after headcount planning.\" Nobody knows when that is."
  zh: "“等 Head Count 定下来再说。”没人知道那是哪天。"
- en: "Pitch a paper on the project"
  zh: "提议把项目写成论文"
- en: "Legal approves a short workshop paper. People start citing it before you're back on campus."
  zh: "法务批了一篇 workshop 短文。你还没回学校，就已经有人开始引用了。"
- en: "Legal says the paper can come out \"after the next product cycle\", which could mean next year."
  zh: "法务说论文可以“等下个产品周期之后”再发。翻译成人话：至少得到明年。"
- en: "Fellowship!"
  zh: "奖学金到手！"
- en: "The fellowship is yours. For a whole year you don't have to TA or grade, and your calendar suddenly has room in it."
  zh: "奖学金是你的了。整整一年不用当助教、不用改作业，日历突然空出了一大块。"
- en: "Put the time into a bold idea"
  zh: "梭哈一个大胆的想法"
- en: "You start the project you have been too busy to start, knowing it might not work."
  zh: "你终于开始做那个一直忙得没空碰的项目，明知道它可能做不成。"
- en: "Catch up on sleep first"
  zh: "先把觉补回来"
- en: "You sleep properly for two weeks and are sharper than you have been since orientation."
  zh: "你好好睡了两周，脑子是入学以来最清醒的。"
- en: "Celebrate with the lab"
  zh: "请全组吃顿好的"
- en: "You buy the lab dinner. {labmate} toasts \"to no grading\". A few labmates look envious."
  zh: "你请全组吃火锅。{labmate} 举杯：“敬不用改作业！”几个同门当场酸了。"
- en: "Fellowship Feedback"
  zh: "奖学金评审意见"
- en: "The fellowship results are out, and you didn't get it. The reviewer comments come too. One says \"too ambitious\", another \"not ambitious enough\", and a third calls it \"incremental\"."
  zh: "奖学金结果出来了，你没拿到。评审意见也一并发来：一个说“太有野心”，一个说“不够有野心”，第三个说“创新性不足”。"
- en: "Look for the useful critique"
  zh: "从意见里淘点干货"
- en: "Two comments are actually useful. You fold them into next year's research statement."
  zh: "有两条意见确实有用。你把它们写进了明年的研究陈述。"
- en: "Vent to your cohort over dinner"
  zh: "约同届吃饭吐槽"
- en: "Half your cohort got the same three comments. Dinner turns into a dramatic reading."
  zh: "同届一半的人收到了一模一样的三条意见。晚饭变成了评审意见诗朗诵大会。"
- en: "Start next year's application today"
  zh: "今天就开始写明年的申请"
- en: "You open a new document while you're still annoyed. It is a surprisingly productive mood."
  zh: "你带着一肚子气新建了文档。化悲愤为生产力，效率居然出奇地高。"
- en: "Sixty Cover Letters"
  zh: "六十封求职信"
- en: "It's faculty application season, and each of 60 openings wants a custom cover letter plus two statements. You have already mixed up two department names."
  zh: "教职申请季到了，60 个职位每个都要一封定制求职信，外加两份陈述。你已经把两个院系的名字写混了。"
- en: "Write 60 truly custom letters"
  zh: "认真定制 60 封信"
- en: "Each letter names the faculty you would work with. It takes three weeks and part of your soul."
  zh: "每封信都点名了你想合作的老师。花了三周，外加一小块灵魂。"
- en: "Use one template plus a custom paragraph"
  zh: "套模板，再加一段定制"
- en: "The letters are good and go out on time. You triple-check every department name."
  zh: "信写得不错，也按时发了出去。每个院系的名字你都核对了三遍。"
- en: "Apply only to your best 25"
  zh: "只投最合适的 25 个"
- en: "You put more care into fewer letters, and your stress level survives application season."
  zh: "信少了，每封都更用心。整个申请季，你的心态居然没崩。"
- en: "Letter Pending"
  zh: "推荐信未到"
- en: "Three application portals show the same red status: \"Letter of recommendation: not received.\" The deadlines were yesterday. The missing letter is from {advisor}."
  zh: "三个申请系统亮着同一行红字：“推荐信：未收到。”截止日期是昨天。没交的那封来自 {advisor}。"
- en: "Send {advisor} a gentle reminder"
  zh: "委婉地催一下 {advisor}"
- en: "{advisor} apologizes and uploads all three within the hour. Two committees say late letters are fine."
  zh: "{advisor}连声道歉，一小时内把三封全传了。两个招聘委员会说晚交没关系。"
- en: "{advisor} replies \"on it!\" and uploads one. The other two arrive next week."
  zh: "{advisor}秒回“马上！”，然后传了一封。另外两封下周才到。"
- en: "Send a page of talking points"
  zh: "发一页要点过去"
- en: "You send a one-page summary of your work. {advisor} uses it, and the letters go out the next morning."
  zh: "你发了一页纸的工作总结。{advisor}照着用了，推荐信第二天早上就发了出去。"
- en: "Email the search committees yourself"
  zh: "自己给招聘委员会发邮件"
- en: "Two of the three committees reply kindly. The third portal has no contact address, only a FAQ."
  zh: "三个委员会里有两个回得很客气。第三个系统没有联系邮箱，只有一页 FAQ。"
- en: "Equity and a Ping-Pong Table"
  zh: "期权和乒乓球桌"
- en: "A startup founder messages you: \"We'd love you as a founding researcher. Generous equity, a ping-pong table, free snacks.\" The word \"salary\" does not appear."
  zh: "一位创业公司创始人给你发消息：“诚邀你成为创始研究员。丰厚期权、乒乓球桌、免费零食。”通篇没出现“工资”两个字。"
- en: "Hear them out"
  zh: "听听对方怎么说"
- en: "The pitch is wild and a little convincing. You add startups to your search, just in case."
  zh: "对方画的饼很大，闻着还有点香。你把创业公司也加进了求职清单，以防万一。"
- en: "Ask about the salary directly"
  zh: "直接问工资"
- en: "They name a real number: below big tech, above what you feared. You are more interested than you expected."
  zh: "对方报了个实打实的数字：比大厂低，但比你估计的高。你比自己预想的还要心动。"
- en: "\"We think about compensation holistically.\" The conversation ends there."
  zh: "“薪酬方面，我们是综合考量的。”天就这么聊死了。"
- en: "Decline and stay on your track"
  zh: "婉拒，坚持原计划"
- en: "You wish them luck. They thank you and ask if you know anyone else."
  zh: "你祝对方好运。对方道了谢，又问你有没有认识的人可以推荐。"
- en: "Wait, I Applied There?"
  zh: "等等，我投过这家？"
- en: "A job-talk invitation arrives from a school you had completely forgotten you applied to. You search your sent mail to see what you promised them."
  zh: "一所你完全忘了投过的学校发来 job talk 邀请。你翻遍已发送邮件，想看看自己当初跟人家许诺了什么。"
- en: "Accept and study the department"
  zh: "接受，好好研究这个系"
- en: "You read every faculty page and three of their papers. On the visit, you sound like you've wanted this job for years."
  zh: "你看遍了每位老师的主页，还读了他们三篇论文。到了现场，你听起来像是惦记这份工作好多年了。"
- en: "Accept and give your usual talk"
  zh: "接受，讲老一套"
- en: "Your usual talk lands just as well. The search chair calls it \"refreshingly clear\"."
  zh: "老一套照样好使。招聘委员会主席说你讲得“清晰得让人耳目一新”。"
- en: "Your talk mentions collaborating with a research center they closed years ago."
  zh: "你的报告里说要和一个研究中心合作，可那个中心好几年前就关了。"
- en: "Decline politely"
  zh: "礼貌婉拒"
- en: "You trade a flight for a free weekend. After a small pang, you feel relieved."
  zh: "你用一趟航班换来一个空闲的周末。心里小小失落了一下，然后松了口气。"
- en: "Twelve One-on-Ones"
  zh: "十二场车轮战"
- en: "Campus visit: breakfast with the search chair, twelve 30-minute one-on-ones, your job talk, then dinner. Every single person asks, \"So, tell me about your research.\""
  zh: "校园面试：和招聘委员会主席吃早饭，十二场 30 分钟的单独会面，你的 job talk，然后是晚饭。每个人都会问：“那么，说说你的研究吧。”"
- en: "Be fully on for all twelve"
  zh: "十二场全程满电"
- en: "You give twelve slightly different versions of your pitch, and everyone loves you. You fall asleep in your dinner clothes."
  zh: "你讲了十二个略有不同的版本，所有人都很喜欢你。你穿着赴宴的衣服就睡着了。"
- en: "Ask about their work instead"
  zh: "反过来问对方的研究"
- en: "You've read their papers and ask sharp questions. Half the meetings run over, happily."
  zh: "你读过他们的论文，问题问得很犀利。一半的会面都聊超了时，宾主尽欢。"
- en: "You mix up two professors' papers. One of them is very gracious about it."
  zh: "你把两位教授的论文搞混了。其中一位非常大度。"
- en: "Save your energy for the talk"
  zh: "留着精力讲报告"
- en: "You keep the one-on-ones short and give a sharp job talk. Dinner is quiet, but fine."
  zh: "你把单独会面都控制得很短，job talk 讲得干脆利落。晚饭有点安静，但还行。"
- en: "One Week Apart"
  zh: "offer 时间差"
- en: "One place wants your answer by next Friday. The place you like more will decide a week after that. Both say, \"Take all the time you need.\""
  zh: "一家要你下周五前答复。你更想去的那家，要再晚一周才出结果。两家都说：“不着急，慢慢考虑。”"
- en: "Ask the first place for more time"
  zh: "请第一家多宽限几天"
- en: "They give you two extra weeks. Now the dates line up."
  zh: "对方多给了你两周。这下时间对上了。"
- en: "\"We can't extend, but we really hope you'll join!\" You still have until Friday."
  zh: "“没法延期，但我们真心希望你能来！”期限还是周五。"
- en: "Ask the second place to decide sooner"
  zh: "催第二家早点定"
- en: "Your email is polite and clear. They move their decision up by a week."
  zh: "你的邮件礼貌又清楚。对方把决定提前了一周。"
- en: "They say they will \"try\", and then they don't."
  zh: "对方说会“尽量”，然后就没有然后了。"
- en: "Ask {advisor} what they would do"
  zh: "问问 {advisor}会怎么选"
- en: "{advisor} tells you which one they would pick and, more usefully, why. You feel calmer about either."
  zh: "{advisor}告诉你会选哪家，更有用的是讲了为什么。现在不管选哪家，你都踏实多了。"
- en: "A Famous Lab Writes Back"
  zh: "大牛组来信了"
- en: "The head of a famous lab emails: they liked your talk and might have a postdoc opening. Could you chat on Thursday? Your heart rate disagrees with your calendar."
  zh: "一位知名实验室的负责人发来邮件：很喜欢你的报告，可能有个博士后位置，周四能聊聊吗？你的日历说有空，你的心跳说没准备好。"
- en: "Take the call and prepare hard"
  zh: "接下电话，拼命准备"
- en: "You read their last ten papers. The call runs long and ends with \"let's stay in touch\". From them, that means something."
  zh: "你读完了对方最近的十篇论文。电话聊超了时，最后对方说“保持联系”。从这位嘴里说出来，这话是有分量的。"
- en: "Ask {advisor} what they know"
  zh: "向 {advisor}打听一下"
- en: "{advisor} knows them well and makes a call of their own. You go into Thursday with an ally."
  zh: "{advisor}跟对方很熟，亲自打了个电话。周四你是带着援军去的。"
- en: "{advisor} says, \"They work their postdocs very hard.\" That is all they say."
  zh: "{advisor}说：“他们家博士后很辛苦的。”然后就再没多说一个字。"
- en: "Keep it as a plan B"
  zh: "留着当备胎"
- en: "You reply warmly and keep it in your back pocket while you focus on your main search."
  zh: "你热情地回了信，把这条路揣进兜里，继续专心主线求职。"
- en: "Employee #4"
  zh: "4 号员工"
- en: "{labmate} pulls you aside: they are leaving to start a company, they just raised a small seed round, and they want you as employee number four. \"You'd own a real piece of it.\""
  zh: "{labmate} 把你拉到一边：要离开组里去创业了，刚拿到一小笔种子轮，想让你当 4 号员工。“你能拿到实打实的股份。”"
- en: "Say you're interested"
  zh: "表示感兴趣"
- en: "{labmate} is thrilled. You agree to talk details once you're on the job market."
  zh: "{labmate} 激动坏了。你们约好等你开始求职时再细聊。"
- en: "Ask to see the numbers first"
  zh: "先要份商业计划书"
- en: "The plan makes sense. {labmate} respects the questions and keeps a spot open for you."
  zh: "计划挺靠谱。{labmate} 很认可你提的问题，给你留了个位置。"
- en: "The plan is one slide with a hockey-stick curve on it. You say you'll think about it."
  zh: "整个计划就一页 PPT，上面画着一条一飞冲天的增长曲线。你说你再考虑考虑。"
- en: "Decline, but offer to advise"
  zh: "婉拒，但愿意当顾问"
- en: "You'll review their model evaluations for free. {labmate} is a little disappointed, but grateful."
  zh: "你答应免费帮忙看模型评测。{labmate} 有点失望，但也很感激。"
- en: "A Starter Allocation"
  zh: "新手大礼包"
- en: "On day one at {company}, you get a GPU quota bigger than everything your lab has used in five years. The onboarding doc calls it \"a starter allocation\"."
  zh: "在 {company} 的第一天，你拿到的 GPU 配额比你们组五年用过的加起来还多。入职文档管这叫“基础配额”。"
- en: "Run every ablation you ever dreamed of"
  zh: "把梦想中的消融实验全跑一遍"
- en: "You launch two hundred runs by Friday and learn more about scaling in a week than in two years of queueing."
  zh: "到周五你已经炼了两百炉丹。一周学到的 scaling 知识，比排了两年队学到的还多。"
- en: "Plan runs as if GPUs were scarce"
  zh: "精打细算地用 GPU"
- en: "Your mentor is impressed by how little compute you waste, and slightly confused by it."
  zh: "你的 mentor 对你这么省算力印象深刻，但也有点不太理解。"
- en: "Send the lab a screenshot"
  zh: "截图发到组群"
- en: "The lab chat goes quiet for a long minute. Then {labmate} replies with one crying emoji."
  zh: "组群里沉默了好一会儿。然后 {labmate} 回了一个大哭的表情。"
- en: "Pending Legal Review"
  zh: "法务审核中"
- en: "Your internship paper at {company} is finished, but legal review flagged \"possible product implications\". The next review slot is in eleven weeks."
  zh: "你在 {company} 的实习论文写完了，但法务审核标记了“可能涉及产品”。下一个审核档期在十一周后。"
- en: "Cut anything that sounds like a product"
  zh: "删掉一切像产品的内容"
- en: "Every product name becomes \"a deployed system\". Legal approves a thinner, vaguer paper, and it's out."
  zh: "所有产品名都改成了“某已部署系统”。法务批准了一篇更薄、更含糊的论文，总算发出去了。"
- en: "Ask your manager to escalate"
  zh: "请经理往上推一推"
- en: "Your manager knows someone in legal. The paper clears in a week, untouched."
  zh: "经理在法务有熟人。论文一周就过了，一个字没改。"
- en: "The escalation lands in the same queue, one slot lower."
  zh: "升级后的请求进了同一个队列，还往后排了一位。"
- en: "Let it wait and enjoy the summer"
  zh: "先放着，享受夏天"
- en: "The paper goes into a folder called \"someday\". Your weekends come back for the rest of the internship."
  zh: "论文进了一个叫“有空再说”的文件夹。剩下的实习期里，你的周末回来了。"
- en: "Perfect Timing"
  zh: "来得真是时候"
- en: "Days before your proposal, the company you interned at emails a full-time offer, with a deadline. Your slides are 60% done. The salary section is 100% done."
  zh: "开题前几天，你实习过的公司发来全职 offer，还带着截止日期。你的 PPT 做了 60%，offer 的薪资部分你读了 3遍。"
- en: "Ask them to wait until after"
  zh: "请对方等你开完题"
- en: "They give you a month. You go back to slide 23 calmer than you expected."
  zh: "对方给了你一个月。你回到第 23 页，比预想的平静。"
- en: "\"We can do one week.\" Two big decisions now share the same week."
  zh: "“最多一周。”两件大事挤进了同一周。"
- en: "Tell {advisor} about it"
  zh: "告诉 {advisor}"
- en: "{advisor} says congratulations, then \"slides first\". You keep the offer and your focus."
  zh: "{advisor}先说了恭喜，然后说“先做 PPT”。offer 保住了，注意力也保住了。"
- en: "{advisor} goes quiet, then asks how the slides are going. They seem a little worried."
  zh: "{advisor}沉默了一下，然后问你 PPT 做得怎么样了。看起来有点担心。"
- en: "Decline: you're finishing the PhD"
  zh: "拒绝：先把博士读完"
- en: "You say not yet. They say the door stays open, which might even be true. The slides get your full attention."
  zh: "你说暂时不考虑。对方说大门永远敞开，这话说不定还是真的。你全心扑回了 PPT。"
- en: "Two Things Due Friday"
  zh: "周五双 DDL"
- en: "A university fellowship wants a two-page research statement by Friday. Friday is also the deadline for {project}. Both want your best writing, and you have enough for one."
  zh: "一个校级奖学金要你周五前交两页研究陈述。周五也是 {project} 的截稿日。两边都要你最好的文笔，可你只够精力写好一份。"
- en: "Statement first, paper second"
  zh: "先写陈述，再写论文"
- en: "The statement is the clearest thing you've written all year. A month later you win the award, which is small but looks good on your CV."
  zh: "这份陈述是你今年写得最清楚的东西。一个月后你拿到了这个奖，奖不大，但写在简历上很好看。"
- en: "The statement is good and the paper is rushed. A month later, the fellowship sends a polite no."
  zh: "陈述写得不错，论文却很仓促。一个月后，奖学金发来一封客气的拒信。"
- en: "Paper first, statement overnight"
  zh: "先写论文，陈述熬夜写"
- en: "The paper goes in strong. The statement, written at 3 am, says \"robust\" seven times and wins nothing."
  zh: "论文交得很漂亮。凌晨 3 点写的陈述里出现了七次“鲁棒”，什么也没拿到。"
- en: "Skip the fellowship this year"
  zh: "今年先不申奖学金"
- en: "You have one deadline instead of two. There will be other fellowships."
  zh: "两个截止变成了一个。奖学金年年有，不差这一回。"
- en: "Perfect for Your Background"
  zh: "与你的背景完美契合"
- en: "A recruiter writes: \"Your background in transformers is a perfect fit!\" The role maintains electrical transformers for a power company. The pay is honestly not bad."
  zh: "一位猎头写道：“你的 Transformer 背景与我们非常匹配！”岗位是给电力公司维护变压器。说实话，工资还不错。"
- en: "A recruiter says your NLP experience is perfect for their role. They mean Neuro-Linguistic Programming, as a life coach. There is a webinar."
  zh: "一位猎头说你的 NLP 经历非常适合对方公司的岗位。人家说的是“神经语言程序学”，岗位是成功学讲师。还附赠一场线上公开课。"
- en: "Take the call, just to see"
  zh: "接个电话，看看再说"
- en: "After twenty minutes of friendly confusion, you both know a little about a whole other field."
  zh: "二十分钟友好的鸡同鸭讲之后，你们俩都对另一个领域多了点了解。"
- en: "Reply with a polite correction"
  zh: "礼貌地纠正一下"
- en: "They thank you and pass your profile to a colleague who hires for actual machine learning roles."
  zh: "对方道了谢，把你的资料转给了一位真招机器学习岗的同事。"
- en: "They reply: \"Even better! Are you free Tuesday?\""
  zh: "对方回复：“那更好了！周二有空吗？”"
- en: "Forward it to the lab chat"
  zh: "转发到组群"
- en: "The lab chat loses it. {labmate} makes it the channel topic for a month."
  zh: "组群笑疯了。{labmate} 把它设成了群公告，挂了一个月。"
- en: "The Pet Topic"
  zh: "教授的心头好"
- en: "Your job talk lands. Then one professor asks how it connects to their favorite topic, and the next twenty minutes of Q&A are about that topic. Other hands slowly go down."
  zh: "你的 job talk 很成功。然后一位教授问，这和自己最喜欢的课题有什么联系，接下来二十分钟的问答全围着那个课题转。其他举着的手慢慢放下了。"
- en: "Engage with their topic seriously"
  zh: "认真回应这个话题"
- en: "You find a real link. The professor beams, and you now have one very loud supporter in the hiring meeting."
  zh: "你找到了真正的靠山。那位教授笑开了花，招聘讨论会上你多了一个嗓门很大的支持者。"
- en: "You improvise a connection. They correct it, for ten minutes, with diagrams."
  zh: "你临场编了个关联。对方花了十分钟纠正你，还画了图。"
- en: "\"Great point, let's talk at dinner\""
  zh: "“好问题，我们晚饭时聊”"
- en: "Three more people get to ask questions. The search chair notices how you handled the room."
  zh: "又有三个人得以提问。招聘委员会主席注意到了你控场的本事。"
- en: "They follow up anyway. Two hands stay down for good."
  zh: "对方还是追问不休。有两只手再也没举起来。"
- en: "Promise to read their paper"
  zh: "答应读对方的论文"
- en: "They email you the PDF before you leave the room. You read it at the hotel. At dinner, they ask what you thought."
  zh: "你还没走出会议室，对方就把 PDF 发到了你邮箱。你在酒店读完了。晚饭时，对方问你读后感。"
- en: "That's My Thesis"
  zh: "这不就是我的博士论文吗"
- en: "An industry interviewer asks: \"How would you evaluate our AI features with real users?\" You have spent five years on exactly this question. You have four minutes."
  zh: "一位业界面试官问：“你会怎么用真实用户评估我们的 AI 功能？”你在这个问题上花了整整五年。现在你有四分钟。"
- en: "Give the four-minute version"
  zh: "讲四分钟精简版"
- en: "You keep it clear and concrete and finish on time. The interviewer stops taking notes and starts nodding."
  zh: "你讲得清楚具体，准时收尾。面试官不再记笔记，开始点头。"
- en: "You reach minute four of a forty-minute answer. They thank you for the overview."
  zh: "一个四十分钟的回答，你刚讲到第四分钟。对方感谢你做的“概述”。"
- en: "Ask what their features do first"
  zh: "先问清楚功能是干什么的"
- en: "The question turns into a design session. At the end they ask, half joking, \"Can you start in June?\""
  zh: "问答变成了一场设计讨论。最后对方半开玩笑地问：“6 月能入职吗？”"
- en: "Everything they could tell you is under NDA. You both stare at the question."
  zh: "对方能说的全在保密协议里。你们俩对着这个问题大眼瞪小眼。"
- en: "Pull up your thesis framework slide"
  zh: "调出博士论文框架图"
- en: "Five years fit on one slide. They ask for a copy for their team, which is either flattering or worrying."
  zh: "五年青春浓缩成了一页 PPT。对方要了一份拿回去给团队看，这到底是夸你还是该担心，不好说。"
