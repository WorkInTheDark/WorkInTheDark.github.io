# zh translations for events/travel (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "After the Conference"
  zh: "会议结束之后"
- en: "You finally get a visa appointment for your conference trip. It's nine days after the conference ends."
  zh: "你终于约上了参会的签证面签。时间是会议结束后第九天。"
- en: "The consulate's earliest open slot is the week after your conference. The booking site suggests you \"plan ahead\"."
  zh: "领事馆最早的空位在会议结束后的那一周。预约网站建议你“提前规划”。"
- en: "Refresh the booking site every hour"
  zh: "每小时刷一次预约网站"
- en: "At 2:47 am a cancellation appears. You book it before anyone else wakes up."
  zh: "凌晨 2:47，有人取消了预约。你赶在所有人醒来之前抢到了。"
- en: "No earlier slot opens in time. You'll give your talk over video, from your desk."
  zh: "到最后也没刷出更早的位置。你只能坐在工位上，通过视频做报告。"
- en: "Ask {advisor} for a support letter"
  zh: "请 {advisor}写封支持信"
- en: "The letter works. The consulate moves your appointment up by three weeks."
  zh: "信起作用了。领事馆把你的面签提前了三周。"
- en: "The consulate thanks your advisor for the letter and changes nothing. The talk goes remote."
  zh: "领事馆感谢了你导师的来信，然后什么都没改。报告改成线上。"
- en: "Plan a remote talk now"
  zh: "现在就准备线上报告"
- en: "You record a clean talk and keep your week. The hallway chats will have to wait."
  zh: "你录了一版干净利落的报告，这周的时间也保住了。走廊里的闲聊只能以后再说。"
- en: "Lost Luggage"
  zh: "行李丢了"
- en: "Your suitcase is somewhere between two airports. Your talk at {venue} is tomorrow morning, and you're wearing the hoodie you slept in on the plane."
  zh: "你的行李箱卡在两个机场之间的某处。明早就是你在 {venue} 的报告，你身上还穿着在飞机上睡了一路的卫衣。"
- en: "Present in the hoodie"
  zh: "穿着卫衣上台"
- en: "Nobody looks at your clothes. They look at your results, and two people ask for your slides."
  zh: "没人看你穿什么。大家看的是你的结果，还有两个人找你要了 PPT。"
- en: "You spend the first minute apologizing for the hoodie. The talk recovers, mostly."
  zh: "你用开头一分钟为卫衣道歉。后面的报告基本救回来了。"
- en: "Buy an outfit in {city} tonight"
  zh: "今晚在{city}买身衣服"
- en: "The only open store sells souvenir shirts. Everyone remembers the talk in the I LOVE {city} shirt."
  zh: "唯一还开着的店只卖纪念 T 恤。所有人都记住了那场穿着“我爱{city}”T 恤的报告。"
- en: "Wait at the airport for the bag"
  zh: "在机场等行李"
- en: "The bag arrives at 11 pm. You get four hours of sleep and a clean shirt."
  zh: "行李晚上 11 点才到。你换来了四个小时的睡眠和一件干净衬衫。"
- en: "The Keynote Nap"
  zh: "主旨报告打盹"
- en: "Jet lag hits during the keynote. You wake up to applause and a slide that just says \"Thank you!\""
  zh: "主旨报告讲到一半，时差袭来。你醒来时满场掌声，屏幕上只剩一句“Thank you!”"
- en: "You close your eyes for one second during the keynote. When you open them, it's the Q&A."
  zh: "主旨报告时你闭眼一秒钟。再睁开，已经到提问环节了。"
- en: "Ask your neighbor for a summary"
  zh: "请邻座总结一下"
- en: "They sum it up in two sentences. You trade emails, and it turns out you only needed the two sentences."
  zh: "对方两句话就概括完了。你们互留了邮箱，事实证明这两句话就够了。"
- en: "Go back to the hotel and sleep"
  zh: "回酒店睡觉"
- en: "You sleep 14 hours. You miss the afternoon sessions and wake up a person again."
  zh: "你睡了 14 个小时。错过了下午的报告，但醒来终于又像个人了。"
- en: "Drink a third coffee"
  zh: "再来第三杯咖啡"
- en: "You make it through the poster session wide awake. At 3 am you are still wide awake."
  zh: "你精神抖擞地撑过了海报环节。凌晨 3 点，你依然精神抖擞。"
- en: "Behind the Pillar"
  zh: "柱子后面"
- en: "Your poster board for {paper} is behind a concrete pillar. In the first half hour, one person stops by, and they are looking for the restroom."
  zh: "你给 {paper} 分到的海报板在一根水泥柱后面。头半个小时只来了一个人，还是来找厕所的。"
- en: "Stand in the aisle and wave people in"
  zh: "站在过道上招呼路人"
- en: "You pull in a steady stream. Someone says it's the best poster they've ever seen behind a pillar."
  zh: "人流源源不断。有人说这是自己见过的最好的柱后海报。"
- en: "People nod politely and keep walking. Your arm gets a good workout."
  zh: "大家礼貌地点点头，继续往前走。你的胳膊倒是练得不错。"
- en: "Ask the organizers to move you"
  zh: "请组委会给你换位置"
- en: "They move you next to the coffee urn, the best spot in the hall."
  zh: "组委会把你挪到了咖啡台旁边，全场黄金位置。"
- en: "\"All boards are final.\" The pillar and you will spend the afternoon together."
  zh: "“展板位置不可调整。”你和柱子将共度这个下午。"
- en: "Tape a QR code to the pillar"
  zh: "在柱子上贴个二维码"
- en: "Almost nobody visits, but your paper gets a few dozen downloads that afternoon."
  zh: "几乎没人过来，但那天下午你的论文被下载了几十次。"
- en: "Your Hero, at Your Poster"
  zh: "偶像来看你的海报了"
- en: "Your research hero walks up to your poster for {paper}, reads it for a full minute, and asks the one question you hoped nobody would ask."
  zh: "你的学术偶像走到 {paper} 的海报前，认真看了整整一分钟，然后问了那个你最希望没人问的问题。"
- en: "Admit the limitation, say what's next"
  zh: "承认局限，讲讲下一步"
- en: "They nod. \"That's the right next step.\" You will replay this moment for years."
  zh: "对方点点头：“下一步就该这么做。”这一幕你会回味好多年。"
- en: "Defend the result with confidence"
  zh: "自信地捍卫结果"
- en: "They smile. \"Fair point. Send me the paper.\" You send it before they reach the next poster."
  zh: "对方笑了：“有道理，把论文发我。”人还没走到下一张海报，你就已经发过去了。"
- en: "They say \"Hm,\" and move on. You're still glad they stopped."
  zh: "对方“嗯”了一声，走了。不过人家停下来看过，你还是挺开心。"
- en: "Freeze, then ask for a selfie"
  zh: "大脑宕机，然后求合影"
- en: "The question goes unanswered, but the selfie is excellent."
  zh: "问题没答上来，但合影拍得非常好。"
- en: "Your Poster, Explained"
  zh: "给你讲讲你的海报"
- en: "A visitor stops at your poster and explains {paper} to you, confidently and incorrectly, for six minutes."
  zh: "一位访客停在你的海报前，自信满满、错误百出地给你讲了六分钟 {paper}。"
- en: "Correct them politely"
  zh: "礼貌地纠正对方"
- en: "They pause, then say, \"Oh, that's even better.\" You trade emails."
  zh: "对方愣了一下：“哦，那更厉害了。”你们互留了邮箱。"
- en: "They nod, then repeat their version a little louder."
  zh: "对方点点头，然后把自己那套又大声讲了一遍。"
- en: "Nod and take notes"
  zh: "点头做笔记"
- en: "Half of what they said is wrong. The other half is a decent idea for future work."
  zh: "对方说的一半是错的。另一半倒是个不错的未来工作方向。"
- en: "Hand them a printed copy"
  zh: "递上一份打印版"
- en: "They take the paper and keep explaining it, now while pointing at it."
  zh: "对方接过论文继续讲，现在还能指着讲了。"
- en: "The Seat Next to Yours"
  zh: "邻座"
- en: "At the networking dinner in {city}, the name card next to yours belongs to the author of your favorite paper."
  zh: "在{city}的交流晚宴上，你旁边的桌签写着你最爱那篇论文的作者名字。"
- en: "Ask about their paper"
  zh: "聊聊对方的论文"
- en: "They light up. Nobody has asked about that paper in years, and you get the story behind Table 3."
  zh: "对方眼睛一亮。那篇论文好多年没人问起了，你听到了表 3 背后的故事。"
- en: "Talk about anything but work"
  zh: "聊什么都行，就是不聊工作"
- en: "You bond over terrible hotel coffee. They invite you to their lab's reading group."
  zh: "你们因为吐槽酒店咖啡难喝而一见如故。对方邀请你参加自己组里的论文读书会。"
- en: "The small talk runs out after the bread basket. Still, they know your face now."
  zh: "面包篮还没吃完，寒暄就聊干了。好歹对方记住你这张脸了。"
- en: "Pitch your next project"
  zh: "推销你的下一个项目"
- en: "They push back hard on one detail, and they're right. You leave with a better project."
  zh: "对方在一个细节上狠狠反驳了你，而且说得对。你带着一个更好的项目离开了。"
- en: "They politely turn to the person on their other side for dessert."
  zh: "上甜点时，对方礼貌地转向了另一边的人。"
- en: "Last Talk, Last Day"
  zh: "最后一天，最后一场"
- en: "Your talk on {paper} is the last one on the last day of {venue}. The room seats 300. Eleven people came, and four are packing their bags."
  zh: "你讲 {paper} 的报告排在 {venue} 最后一天的最后一场。会场能坐 300 人，来了十一个，其中四个在收拾行李。"
- en: "Give it everything anyway"
  zh: "照样全力以赴"
- en: "The eleven ask great questions. One of them turns out to be next year's program chair."
  zh: "这十一个人问的问题都很棒。其中一位竟然是明年的程序委员会主席。"
- en: "Cut it to ten minutes"
  zh: "压缩到十分钟"
- en: "You finish early. Everyone makes their flight, and they like you for it."
  zh: "你提前讲完。大家都赶上了航班，对你好感倍增。"
- en: "Pull the chairs into a circle"
  zh: "把椅子围成一圈"
- en: "The talk turns into a discussion. Half an hour later, nobody has left."
  zh: "报告变成了讨论。半个小时过去，一个人都没走。"
- en: "Two more people leave while you move chairs. The remaining nine have a lovely chat."
  zh: "你搬椅子的工夫又走了两个人。剩下的九个人聊得很愉快。"
- en: "Minute Twelve"
  zh: "第 12 分钟"
- en: "Your talk on {paper} is at minute 12 of 15 when the session chair stands up and starts thanking you. Your two best slides are still ahead."
  zh: "你讲 {paper} 的 15 分钟报告才到第 12 分钟，主持人就站起来开始感谢你了。你最精彩的两页 PPT 还没放。"
- en: "Jump to the conclusion"
  zh: "直接跳到结论"
- en: "You land the last slide in twenty seconds. It's the cleanest summary you've ever given."
  zh: "你二十秒讲完了最后一页。这是你讲过的最干净利落的总结。"
- en: "Talk faster"
  zh: "加快语速"
- en: "You fit both slides in at double speed. Someone in the front row claps."
  zh: "你用两倍速塞完了两页。前排有人鼓起了掌。"
- en: "Nobody follows the last two slides, including you."
  zh: "最后两页没人跟得上，包括你自己。"
- en: "Say \"Find me at the break\""
  zh: "说“茶歇时来找我”"
- en: "Three people do. The coffee break goes better than the talk."
  zh: "真有三个人来了。茶歇比报告还成功。"
- en: "Free Socks, One Interview"
  zh: "免费袜子，附赠面试"
- en: "An industry booth is giving away very nice socks. The recruiter behind it asks if you'd like a quick interview while you're there."
  zh: "一个公司展台在送很好看的袜子。展台后的招聘官问你，既然来了，要不要顺便面个试。"
- en: "Do the interview right there"
  zh: "当场面试"
- en: "Twenty minutes later you have socks and a second-round slot."
  zh: "二十分钟后，你拿到了袜子和二面机会。"
- en: "You blank on a coding question you'd solve in your sleep. You keep the socks."
  zh: "一道你闭着眼都能做的编程题，你当场卡壳了。袜子你还是拿走了。"
- en: "Take the socks and a business card"
  zh: "拿上袜子和一张名片"
- en: "You leave with good socks and no interview questions."
  zh: "你带着好袜子离开，一道面试题都没碰。"
- en: "Skip the booth for a talk"
  zh: "不去展台，去听报告"
- en: "The talk is about evaluation design, and it's exactly what you needed."
  zh: "那场报告讲的是评测设计，正是你需要的。"
- en: "Seeing the City"
  zh: "看看这座城市"
- en: "You always wanted to see {city}. So far, you have seen the convention center, the hotel, and the hallway between them."
  zh: "你一直想来{city}看看。到目前为止，你看到了会议中心、酒店，以及两者之间的走廊。"
- en: "Skip a session to explore"
  zh: "翘一场报告去逛逛"
- en: "You find a market and eat something wonderful. The talk you missed is online anyway."
  zh: "你找到一个市集，吃到了特别好吃的东西。反正错过的报告网上有回放。"
- en: "Stay for every session"
  zh: "每场都听"
- en: "You see every talk and meet a lot of people. {city} remains a view from the hotel window."
  zh: "你听了每一场报告，认识了很多人。{city}始终只是酒店窗外的风景。"
- en: "Stay one extra day"
  zh: "多留一天"
- en: "You stay one more day and finally see {city}. The inbox can wait."
  zh: "你多留了一天，终于逛了逛{city}。邮箱可以等等。"
- en: "Four Minutes"
  zh: "四分钟"
- en: "The welcome reception opens at 7 pm. By 7:04, the food is gone. You were in line for the coat check."
  zh: "欢迎酒会晚上 7 点开始。7:04，吃的就没了。你当时还在排队存外套。"
- en: "Network on an empty stomach"
  zh: "空着肚子社交"
- en: "You meet five people and remember two of their names. You are very hungry."
  zh: "你认识了五个人，记住了其中两个的名字。你非常饿。"
- en: "Find food with other hungry students"
  zh: "约上其他饿肚子的学生觅食"
- en: "Six hungry PhD students find a noodle place nearby. You now have a group chat for the rest of the week."
  zh: "六个饿肚子的博士生在附近找到一家面馆。你们拉了个群，这周剩下几天都是饭搭子了。"
- en: "Go back to the hotel"
  zh: "回酒店"
- en: "You eat room service in bed and fall asleep by nine."
  zh: "你在床上吃客房送餐，九点前就睡着了。"
- en: "The Keynote Spark"
  zh: "主旨报告的火花"
- en: "A keynote at {venue} reframes a problem you've been stuck on. By the end, you have a page of notes and a new project idea."
  zh: "{venue} 的一场主旨报告让你换了个角度看那个卡了很久的问题。报告结束时，你记了一页笔记，还多了一个新项目的想法。"
- en: "Find the speaker afterward"
  zh: "会后去找讲者"
- en: "They like the idea and suggest a dataset. You promise to follow up, and you mean it."
  zh: "讲者很喜欢这个想法，还推荐了一个数据集。你说会跟进，而且是认真的。"
- en: "The line to talk to them is forty people deep. You keep your notes."
  zh: "等着和讲者说话的队伍排了四十个人。你留着自己的笔记。"
- en: "Write it up on the flight home"
  zh: "在回程航班上写下来"
- en: "You have four pages by landing, and your seatmate now knows more about your research than your family does."
  zh: "落地时你写了四页，邻座对你研究的了解已经超过你家人了。"
- en: "Let it sit in your notes app"
  zh: "先存在备忘录里"
- en: "It joins 140 other ideas in your notes app, some of which are probably good."
  zh: "它和备忘录里另外 140 个想法作伴，其中有些大概是好想法。"
- en: "The Flight Home"
  zh: "回程航班"
- en: "On the flight home, the passenger next to you coughs for six hours straight. By landing, your throat feels like sandpaper."
  zh: "回程航班上，邻座乘客连续咳了六个小时。落地时，你的嗓子像吞了砂纸。"
- en: "Take two days off to recover"
  zh: "休息两天养病"
- en: "You live on soup and sleep for two days. By Wednesday you're back, mostly human."
  zh: "你靠喝汤和睡觉过了两天。到周三你回来了，基本恢复人形。"
- en: "Push through the week"
  zh: "硬撑过这一周"
- en: "The cold never quite arrives, though the week leaves you tired."
  zh: "感冒最终没找上门，不过这周还是把你累得够呛。"
- en: "It arrives in full. You spend the week on the couch with tissues and a stack of papers you don't read."
  zh: "感冒来势汹汹。你一整周窝在沙发上，身边是纸巾和一摞没读的论文。"
- en: "Work from home in a blanket"
  zh: "裹着毯子在家办公"
- en: "Your labmates thank you for not bringing it to the lab."
  zh: "同门感谢你没把病毒带进实验室。"
- en: "The Live Demo"
  zh: "现场演示"
- en: "Your live demo for {paper} begins. The conference Wi-Fi does not. Forty people watch a loading spinner on the big screen."
  zh: "你的 {paper} 现场演示开始了。会场 Wi-Fi 没有开始。四十个人盯着大屏幕上转圈的加载图标。"
- en: "Run it off your phone's hotspot"
  zh: "开手机热点跑"
- en: "The demo runs on two bars of signal. The audience applauds, mostly for the hotspot."
  zh: "演示靠两格信号跑起来了。观众鼓掌，主要是给热点鼓的。"
- en: "Your phone connects, then dies at 4%. You finish with screenshots."
  zh: "手机连上了，然后在 4% 电量时关机。你只好用截图讲完。"
- en: "Narrate screenshots like a cooking show"
  zh: "像美食节目一样讲截图"
- en: "\"Here's one I prepared earlier.\" People laugh, then ask good questions."
  zh: "“这是我提前准备好的一份。”大家笑了，然后问了些好问题。"
- en: "Invite people to try it later"
  zh: "邀请大家稍后来试"
- en: "Six people find you at the break and try it on a wired connection. Two of them stay for an hour."
  zh: "茶歇时有六个人来找你，插着网线试了试。其中两个人待了一个小时。"
- en: "Student Volunteer"
  zh: "学生志愿者"
- en: "Volunteering got you free registration at {venue}. It also got you a STAFF lanyard and a week of carrying microphones to people whose question is \"more of a comment\"."
  zh: "当志愿者让你免费注册了 {venue}，也让你挂上了 STAFF 挂绳，给那些“我不算提问，就是想说两句”的人递了一整周话筒。"
- en: "Run microphones in the main hall"
  zh: "在主会场递话筒"
- en: "You hand the mic to three famous people. One of them thanks you by name, reading it off your badge."
  zh: "你给三位大佬递了话筒。其中一位看着你的胸牌，叫出你的名字向你道谢。"
- en: "Swap for the registration desk"
  zh: "换去注册台"
- en: "Everyone passes through. You meet 400 people for eight seconds each, and point 300 of them to the restroom."
  zh: "所有人都要经过这里。你见了 400 个人，每人八秒，给其中 300 个指了厕所的方向。"
- en: "Skip a shift to see a talk"
  zh: "翘一班去听报告"
- en: "Another volunteer covers for you. The talk is great, and you owe them a coffee."
  zh: "另一位志愿者替你顶了班。报告很精彩，你欠人家一杯咖啡。"
- en: "The coordinator notices. Your next shift is the 7 am coffee setup."
  zh: "志愿者负责人发现了。你的下一班是早上 7 点摆咖啡。"
- en: "Almost the Same Paper"
  zh: "差点撞车"
- en: "At the poster session, you meet a student from another lab working on almost exactly your problem. You use the same data with different methods, and you both have the same look of mild panic."
  zh: "海报环节上，你遇到一个别的组的学生，做的问题和你几乎一模一样。你们用同样的数据、不同的方法，脸上挂着同款轻微惊慌。"
- en: "Propose working together"
  zh: "提议合作"
- en: "You swap emails and sketch a plan on a napkin. It's either the start of something or a very nice napkin."
  zh: "你们互留邮箱，在餐巾纸上画了个计划。这要么是一段合作的开始，要么就是一张很好看的餐巾纸。"
- en: "Race them to the next deadline"
  zh: "和对方抢下一个截稿"
- en: "You both smile and walk away fast. You learned a lot about their method, and your next month got more urgent."
  zh: "你们相视一笑，各自快步离开。你摸清了对方的方法，接下来这个月也更紧迫了。"
- en: "Compare notes and stay friendly"
  zh: "交流心得，保持友好"
- en: "Two of your dead ends were theirs too. You both save a month and stay in touch, loosely."
  zh: "你踩过的两个坑，对方也踩过。你们俩都省下了一个月，之后偶尔保持联系。"
- en: "The Joint Paper"
  zh: "合作论文"
- en: "Your collaborator from the conference sends a draft that runs their method on your data, and the results beat both of yours. Whose name goes first?"
  zh: "会上认识的合作者发来一份初稿：用对方的方法跑你的数据，结果比你们俩各自的都好。谁当一作？"
- en: "Offer them first author"
  zh: "把一作让给对方"
- en: "They're delighted. The paper goes out, and their lab invites you to visit next spring."
  zh: "对方喜出望外。论文发出去了，对方的组还邀请你明年春天去访问。"
- en: "Propose co-first authorship"
  zh: "提议共同一作"
- en: "You agree on co-first authorship with a footnote, and both advisors sign off."
  zh: "你们商定共同一作，加一个脚注说明，两边导师都同意了。"
- en: "Three weeks of polite emails go into one footnote. The paper still goes out, a little late."
  zh: "为了一个脚注，你们客客气气地来回发了三周邮件。论文还是发出去了，晚了一点。"
- en: "Take first author, write most of it"
  zh: "拿一作，承担大部分写作"
- en: "You write it over two weekends. It's your best draft yet, and you are very tired."
  zh: "你花了两个周末写完。这是你写过最好的初稿，你也累坏了。"
- en: "Silent Film"
  zh: "默片"
- en: "{venue} plays pre-recorded talks in your session. Yours, for {paper}, starts with no audio. You're in the third row, and every head slowly turns toward you."
  zh: "{venue} 在你的分会场播放预录报告。你讲 {paper} 的那段，一开始就没声音。你坐在第三排，所有人的头慢慢转向了你。"
- en: "Narrate it live from your seat"
  zh: "坐在座位上现场配音"
- en: "You talk over your own silent video, perfectly in sync. It's the most memorable talk of the session."
  zh: "你给自己的无声视频配音，完美同步。这是整个分会场最令人难忘的报告。"
- en: "You fall two slides behind your own video and never catch up."
  zh: "你落后自己的视频两页，再也没追上。"
- en: "Ask the AV team to fix it"
  zh: "找技术人员来修"
- en: "Ten minutes later, the sound works. Your talk plays to a smaller, very patient room."
  zh: "十分钟后，声音好了。你的报告在人更少、但非常有耐心的观众面前播完了。"
- en: "Skip straight to the Q&A"
  zh: "直接进入问答"
- en: "You take questions instead. There are only three, because nobody heard the talk."
  zh: "你改为直接答问。只有三个问题，因为没人听到报告内容。"
- en: "Chair of Session 7B"
  zh: "7B 分会场主持人"
- en: "The conference app lists you as chair of Session 7B: \"Speech Recognition for Farm Equipment\". You have never chaired a session. You are not in this session."
  zh: "会议 App 上写着你是 7B 分会场的主持人，主题是“农机设备语音识别”。你从没主持过分会场。你甚至不在这个分会场。"
- en: "Chair it anyway"
  zh: "硬着头皮主持"
- en: "You keep time, ask one question per talk and learn a lot about tractors."
  zh: "你掐着时间，每场报告问一个问题，学到了很多拖拉机知识。"
- en: "Email the organizers"
  zh: "给组委会发邮件"
- en: "They fix it within the hour and apologize with a drink voucher."
  zh: "组委会一小时内就改好了，还送你一张饮品券赔罪。"
- en: "They reply after the session. Nobody chaired it, so the speakers timed each other."
  zh: "组委会在分会场结束后才回复。没人主持，讲者们只好互相计时。"
- en: "Find the real chair"
  zh: "找到真正的主持人"
- en: "You find them at the coffee urn. They had no idea either, so you chair it together."
  zh: "你在咖啡台旁找到了那位主持人。对方也不知情，于是你们一起主持。"
- en: "300 Views"
  zh: "300 次播放"
- en: "The recording of your talk on {paper} is online. It has 300 views. According to the analytics, about 200 of them come from your parents' town."
  zh: "你讲 {paper} 的报告录像上线了，播放量 300。后台数据显示，其中大约 200 次来自你老家。"
- en: "Share it more widely"
  zh: "多转发一下"
- en: "Views climb to 900. A few comments ask good questions, and one asks about your microphone."
  zh: "播放量涨到了 900。几条评论问了好问题，还有一条问你用的什么麦克风。"
- en: "Call your parents to say thanks"
  zh: "打电话谢谢爸妈"
- en: "They have watched it eleven times, and one of them has a question about slide 9."
  zh: "爸妈已经看了十一遍，还有个关于第 9 页的问题想问你。"
- en: "Watch it yourself, once"
  zh: "自己看一遍，就一遍"
- en: "You count 47 \"um\"s. It's painful, but your next talk will have fewer."
  zh: "你数出了 47 个“呃”。很痛苦，但下次报告会少一些。"
