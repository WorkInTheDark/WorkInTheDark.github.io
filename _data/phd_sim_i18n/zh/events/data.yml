# zh translations for events/data (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "The 11 pm Shift"
  zh: "深夜专场"
- en: "Your clinician annotators are careful, and only free after their shifts end around 11 pm. The questions start arriving at midnight."
  zh: "你请的临床医生标注员都很细致，但要等晚上 11 点左右下班后才有空。问题从半夜开始源源不断地来。"
- en: "Be online at 11 pm"
  zh: "晚上 11 点准时在线"
- en: "You answer questions until 1 am, all week. Annotation finishes early, and so does your sleep."
  zh: "整整一周，你每天回答问题到凌晨 1 点。标注提前完工，你的睡眠也提前收工。"
- en: "This is your hour anyway"
  zh: "反正这是你的黄金时段"
- en: "Night Owl"
  zh: "夜猫子"
- en: "Midnight is your best hour. The annotators start calling you \"the night desk\"."
  zh: "午夜正是你状态最好的时候。标注员们开始叫你“夜间客服”。"
- en: "Write a FAQ, answer mornings"
  zh: "写份 FAQ，早上统一回复"
- en: "The FAQ covers most questions. The rest wait until morning, and so does the annotation."
  zh: "FAQ 解答了大部分问题。剩下的要等到早上，标注也跟着等。"
- en: "Host a Saturday labeling brunch"
  zh: "周六组个标注早午餐局"
- en: "Bagels work. Six annotators label 400 examples in four hours, and nobody is up past ten."
  zh: "贝果攻势奏效。六位标注员四小时标了 400 条，没有一个人熬过十点。"
- en: "Only two annotators show up, so you get excellent bagels and very few labels."
  zh: "只来了两位标注员。贝果很香，标注很少。"
- en: "500 Examples"
  zh: "500 条样本"
- en: "It's Friday evening. The annotators start Monday, and you need 500 gold-standard examples to check them against."
  zh: "周五晚上。标注员周一开工，你得先准备 500 条金标准样本来检验他们。"
- en: "Annotate all 500 this weekend"
  zh: "这个周末标完 500 条"
- en: "By Sunday night you know this data better than anyone alive. Your eyes would like a word."
  zh: "到周日晚上，你比世上任何人都了解这份数据。你的眼睛在申请带薪休假。"
- en: "Split them with {labmate}"
  zh: "和 {labmate} 平分"
- en: "They label 250 and find two holes in your guidelines. You buy lunch, and would happily buy ten."
  zh: "对方标了 250 条，还发现了你标注指南里的两个漏洞。你请了顿午饭，心想请十顿也心甘情愿。"
- en: "\"I have a deadline too.\" You do 400 of them alone, more slowly than you'd like."
  zh: "“抱歉，我也有截稿。”你一个人标了 400 条，比预想的慢。"
- en: "Do 100, call it a pilot"
  zh: "标 100 条，就当预实验"
- en: "You label 100 careful examples and call it a pilot. Nobody needs to know it was meant to be 500."
  zh: "你仔细标了 100 条，对外统一口径：这是预实验。没人需要知道原计划是 500 条。"
- en: "Guidelines v15"
  zh: "指南 v15"
- en: "You open annotation_guidelines_v15.docx. Version 14 fixed one ambiguity and created two new ones. Agreement went from 0.41 to 0.44."
  zh: "你打开了标注指南_最终版_v15.docx。第 14 版消除了一处歧义，又制造了两处新的。一致性从 0.41 涨到了 0.44。"
- en: "Write version 16, properly"
  zh: "认真写个第 16 版"
- en: "Version 16 has a decision tree and twelve worked examples. Agreement jumps to 0.71."
  zh: "第 16 版有一棵决策树和十二个完整示例。一致性跃升到 0.71。"
- en: "Run a calibration session"
  zh: "开一次校准会"
- en: "An hour on ten hard cases gets everyone on the same page. The guidelines barely change, and agreement still climbs."
  zh: "花一小时过了十个疑难样本，大家终于达成了共识。指南几乎没改，一致性照样上涨。"
- en: "The session turns into a debate about a single example. As far as you know, it's still going."
  zh: "校准会变成了围绕一条样本的辩论。据你所知，现在还没吵完。"
- en: "Freeze v15 and annotate"
  zh: "定稿 v15，开始标注"
- en: "The annotators cheer. The agreement score does not."
  zh: "标注员们欢呼起来。一致性分数没有。"
- en: "Seen It Before"
  zh: "似曾相识"
- en: "Your baseline scores suspiciously well. You check: {roll:200-400} test examples also appear in the training set, some with different capitalization."
  zh: "你的 baseline 分数高得可疑。一查：有 {roll:200-400} 条测试样本也出现在训练集里，有些只是大小写不同。"
- en: "Deduplicate and rerun everything"
  zh: "去重，全部重跑"
- en: "Scores drop four points. Now they mean something, and you can say so."
  zh: "分数掉了四个点。现在它们有意义了，你也能理直气壮地这么说。"
- en: "Report both splits"
  zh: "两种划分都报告"
- en: "Every table gets two columns, original and deduplicated, and reviewers can see you were careful."
  zh: "每张表都有两列：原始和去重后。审稿人看得出你很严谨。"
- en: "Mention it in a footnote"
  zh: "在脚注里提一句"
- en: "It goes in footnote 7. Someone will find it eventually, probably in a blog post."
  zh: "它被塞进了脚注 7。迟早会有人发现，八成是在某篇知乎回答里。"
- en: "A Standard Benchmark"
  zh: "标准基准"
- en: "Three new papers this month report results on your dataset, and one calls it \"the standard benchmark\"."
  zh: "这个月有三篇新论文在你的数据集上报告结果，其中一篇称它为“基准实验”。"
- en: "Host an official leaderboard"
  zh: "搞个官方排行榜"
- en: "Submissions arrive at 3 am from every time zone. You're a maintainer now, and people cite you for it."
  zh: "刷榜的提交从各个时区涌来，凌晨 3 点也不停。你成了榜单维护者，引用也跟着来了。"
- en: "Start a harder version 2"
  zh: "着手做更难的第 2 版"
- en: "Your plan for v2 is ready before anyone gets close to beating v1."
  zh: "还没人接近攻破 v1，你的 v2 计划就已经准备好了。"
- en: "Just enjoy it"
  zh: "享受就好"
- en: "You screenshot the sentence that says \"standard benchmark\". Then you screenshot it again."
  zh: "你把写着“基准测试”的那句话截了图。然后又截了一张。"
- en: "Worse Than Coin Flips"
  zh: "不如抛硬币"
- en: "Agreement is fine on every label except \"sarcastic\", where kappa is -0.08. On that one, your annotators agree less often than if they flipped coins."
  zh: "除了“讽刺”，其他标签的一致性都还行。“讽刺”的 kappa 是 -0.08，在这个标签上，标注员们还不如抛硬币来得一致。"
- en: "Drop the label"
  zh: "删掉这个标签"
- en: "You're down to six labels, with cleaner data and one less argument at lab meeting."
  zh: "只剩六个标签了，数据更干净，组会上也少了一场争论。"
- en: "Redefine it, with examples"
  zh: "配上示例，重新定义"
- en: "With twelve examples and one decision rule, agreement climbs to 0.52. For sarcasm, that counts as a party."
  zh: "加了十二个示例和一条判定规则，一致性涨到 0.52。对讽刺来说，这已经值得开香槟了。"
- en: "Study the disagreement itself"
  zh: "研究分歧本身"
- en: "The annotators disagree in patterns, by background. The label is subjective, and now you can show it."
  zh: "标注员的分歧是有规律的，和各自的背景有关。这个标签本身就是主观的，现在你能证明这一点了。"
- en: "You look for a pattern in the disagreement and find only noise."
  zh: "你想从分歧中找规律，结果只找到了噪声。"
- en: "The Shortcut"
  zh: "捷径"
- en: "Your crowdworkers found a shortcut: almost every \"false\" statement they wrote contains the word \"not\". A model that only looks for \"not\" scores {roll:84-92}%."
  zh: "你的众包工作者找到了一条捷径：他们写的“错误”陈述里几乎都有“not”这个词。一个只看有没有“not”的模型能拿到 {roll:84-92}%。"
- en: "Filter out the easy examples"
  zh: "过滤掉简单样本"
- en: "You remove everything the shortcut can solve. The dataset shrinks by a third and gets much harder."
  zh: "你删掉了所有能靠捷径解决的样本。数据集缩水三分之一，难度大增。"
- en: "Re-collect with new instructions"
  zh: "改写说明，重新收集"
- en: "\"Please avoid the word not.\" Round two uses \"never\" instead, and round three is a little better."
  zh: "“请避免使用 not。”上有政策下有对策，第二轮全换成了“never”。第三轮才稍好一点。"
- en: "Publish the shortcut as analysis"
  zh: "把捷径写成分析发表"
- en: "You add a section on how the shortcut happened and how to avoid it. A reviewer calls it \"refreshingly honest\"."
  zh: "你加了一节，讲这条捷径是怎么出现的、怎么避免。一位审稿人评价它“坦诚得令人耳目一新”。"
- en: "It reads as \"the dataset is broken\". Honestly, it reads that way to you too."
  zh: "读起来像在说“这个数据集坏了”。说实话，你自己读着也是这个意思。"
- en: "Three Pages, Numbered"
  zh: "三页纸，带编号"
- en: "An annotator sends you a three-page email, with numbered sections, about the ambiguities in your guidelines. You read it twice. They're right about all of it."
  zh: "一位标注员给你发了一封三页长的邮件，分节编号，专门讲你指南里的歧义。你读了两遍，一条都反驳不了。"
- en: "Rewrite the guidelines with their notes"
  zh: "照对方的意见重写指南"
- en: "The new version is mostly their email. Agreement jumps, and they get a line in the acknowledgments."
  zh: "新版指南基本就是那封邮件。一致性大涨，这位标注员也在致谢里有了一行。"
- en: "Invite them to co-design the guidelines"
  zh: "邀请对方一起设计指南"
- en: "They say yes, and they're brilliant. You gain a collaborator who reads more carefully than you do."
  zh: "对方答应了，而且非常出色。你多了一位读得比你还仔细的合作者。"
- en: "They're flattered but busy. You do get a fourth page, though."
  zh: "对方受宠若惊，但实在太忙。不过你倒是收到了第四页。"
- en: "Fix only the top three issues"
  zh: "只改最要紧的三处"
- en: "The worst ambiguities are gone. The email stays starred in your inbox, judging you."
  zh: "最严重的歧义解决了。那封邮件一直标着星躺在你的收件箱里，默默审视着你。"
- en: "The Data Wins"
  zh: "数据赢了"
- en: "Your dataset paper has {roll:3-6} times the citations of your method paper. People love your data, and your method less so."
  zh: "你的数据集论文引用量是方法论文的 {roll:3-6} 倍。大家爱你的数据，对你的方法就没那么爱了。"
- en: "Lean in: plan the next dataset"
  zh: "顺势而为，规划下一个数据集"
- en: "If the field wants data, you'll give it data. You sketch version 2 on the bus home."
  zh: "领域要数据，那就给它数据。你在回家的公交上画出了第 2 版的草图。"
- en: "Give the method paper a push"
  zh: "给方法论文推一把"
- en: "You post a thread and give a talk. The method paper gets a small bump, and you get a small headache."
  zh: "你发了条长推，又做了一场报告。方法论文的引用小涨了一点，你也小小头疼了一下。"
- en: "Be happy either way"
  zh: "怎样都开心"
- en: "You update your CV and buy a fancy coffee."
  zh: "你更新了简历，奖励了自己一杯贵价咖啡。"
- en: "Table 7"
  zh: "表 7"
- en: "The technical report for {model} uses your dataset, by name, in Table 7. Your paper is not in the references. The report has 400 authors and room for 1,200 citations."
  zh: "{model} 的技术报告在表 7 里点名用了你的数据集。参考文献里却没有你的论文。这份报告有 400 位作者，参考文献塞得下 1200 条。"
- en: "Email the report's authors"
  zh: "给报告作者发邮件"
- en: "A reply within a day: \"Our mistake, fixed in v2.\" Version 2 cites you, and so do the people who read it."
  zh: "一天内就收到回复：“是我们疏忽了，v2 已修正。”第 2 版引用了你，读过它的人也跟着引用了你。"
- en: "An auto-reply from a shared inbox. Version 2 comes out, still without you."
  zh: "收到一封公共邮箱的自动回复。第 2 版发布了，依然没有你。"
- en: "Post about it, politely"
  zh: "礼貌地发个帖子"
- en: "You write a short, polite post with a screenshot. It travels far, and a lot of people learn your dataset's name."
  zh: "你写了一条简短、礼貌的帖子，附上截图。帖子小火了一把，很多人记住了你数据集的名字。"
- en: "Let it go"
  zh: "算了"
- en: "Your dataset is in a famous report. That's a kind of citation, if you squint."
  zh: "你的数据集上了一份知名报告。眯着眼看，也算是一种引用。"
- en: "Issue: Mislabeled"
  zh: "Issue：标错了"
- en: "A new GitHub issue on your dataset's repo: \"Example 3,412 is mislabeled.\" It has a screenshot and {roll:6-15} thumbs-up."
  zh: "你数据集的 GitHub 仓库里来了一条新 issue：“第 3412 条样本标错了。”附有截图，还有 {roll:6-15} 个点赞。"
- en: "Fix it and release v1.1"
  zh: "修好，发布 v1.1"
- en: "You fix it and thank the reporter in the changelog. Oddly, the dataset now looks more trustworthy."
  zh: "你修好了它，还在更新日志里感谢了提出者。奇怪的是，数据集反而显得更可信了。"
- en: "Audit the whole label"
  zh: "把这个标签全部复查一遍"
- en: "You find 40 more, and version 1.1 becomes a careful version 2."
  zh: "你又找出了 40 条，v1.1 变成了一个认真的第 2 版。"
- en: "Reply \"Thanks, will fix soon\""
  zh: "回复“感谢，尽快修复”"
- en: "True, technically. The issue gains three more thumbs-up while you get around to it."
  zh: "严格来说，没毛病。在你抽空处理之前，这条 issue 又多了三个赞。"
- en: "No Redistribution"
  zh: "禁止再分发"
- en: "You finally read your source data's license closely. It says no redistribution, so your dataset can't be released as it is."
  zh: "你终于仔细读了源数据的许可协议。上面写着禁止再分发，所以你的数据集不能原样发布。"
- en: "Rebuild it from open sources"
  zh: "用开放数据重建"
- en: "After weeks of re-collecting and re-annotating, the new dataset is fully releasable, and slightly better."
  zh: "经过几周的重新收集和重新标注，新数据集完全可以发布了，质量还略有提升。"
- en: "Release a script that rebuilds it"
  zh: "发布一个重建脚本"
- en: "Users download the source themselves, and your script does the rest. It's legal, if slightly fragile."
  zh: "用户自己下载源数据，剩下的交给你的脚本。合法，就是有点脆弱。"
- en: "The script works on your machine. The first three issues on your repo say it doesn't work on theirs."
  zh: "脚本在你的电脑上明明能跑。仓库里的前三条 issue 都说在他们那儿跑不了。"
- en: "Ask the source for permission"
  zh: "向数据源申请授权"
- en: "The maintainers say yes in a day, delighted that anyone read the license. You frame the email."
  zh: "维护者一天之内就同意了，还很高兴居然有人读了许可协议。你把那封邮件裱了起来。"
- en: "Their lawyer replies six weeks later: no."
  zh: "六周后，对方律师回复：不行。"
