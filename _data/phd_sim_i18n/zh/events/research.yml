# zh translations for events/research (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Scooped?"
  zh: "撞车了？"
- en: "An arXiv alert, two weeks before your deadline: a new paper from {biglab} does almost exactly what {project} does, with nicer figures."
  zh: "截稿前两周，arXiv 推送了一篇 {biglab} 的新论文：做的几乎就是 {project}，图还比你的好看。"
- en: "{labmate} drops a link in the lab chat: \"isn't this yours??\" It is. Someone else's version of {project}, posted two weeks before your deadline."
  zh: "{labmate} 在实验室群里甩了个链接：“这不是你的吗？？”还真是。别人版本的 {project}，挂出来时离你截稿只剩两周。"
- en: "Read it line by line tonight"
  zh: "今晚逐行精读"
- en: "Page 7: they test on one benchmark and never ask whether people trust the outputs. That gap is yours, if you move fast."
  zh: "第 7 页：他们只在一个基准上测了，也从没问过人们信不信模型的输出。这个空白归你了，前提是动作要快。"
- en: "They use your datasets and even run your ablation. It really is your paper, only posted first."
  zh: "数据集和你用的一样，连消融实验都跟你做得一样。这就是你的论文，只是人家先挂了出来。"
- en: "Forward it to {advisor}: \"???\""
  zh: "转发给 {advisor}：“？？？”"
- en: "Ten minutes later, your advisor replies: \"Breathe. They miss something important. Let's talk tomorrow.\" You breathe."
  zh: "十分钟后导师回复：“深呼吸。他们漏了很重要的东西。明天聊。”你深呼吸。"
- en: "The reply comes the next afternoon: \"Hm. That is close.\" Nothing else."
  zh: "第二天下午才回：“嗯，确实很像。”然后就没了。"
- en: "Close the laptop, take a walk"
  zh: "合上电脑，出去走走"
- en: "You walk for an hour. The paper is still there when you get back, but now you can read it without panicking."
  zh: "你走了一个小时。回来时那篇论文还在，但你已经能心平气和地读了。"
- en: "Now What?"
  zh: "那现在呢？"
- en: "Decision time for {project}. The other paper is already making the rounds, and your deadline hasn't moved."
  zh: "{project} 该做决定了。那篇论文已经传开了，你的截稿日期可一天没挪。"
- en: "Build the paper around the gap"
  zh: "围绕那个空白重写论文"
- en: "Found the gap"
  zh: "找到了空白"
- en: "You cite them in the first paragraph, then show what they missed. The paper ends up sharper than before."
  zh: "你在第一段就引用了他们，然后指出他们漏掉了什么。论文反而比之前更犀利了。"
- en: "Differentiate and cite them"
  zh: "划清区别，引用他们"
- en: "You reframe the paper, compare fairly and cite them generously. Now it reads like a follow-up."
  zh: "你重新定位了论文，公平比较，大方引用。现在读起来像一篇后续工作。"
- en: "Four rewrites of the intro later, it still reads as \"like theirs, but later\"."
  zh: "引言改了四遍，读起来还是“跟他们的一样，只是晚了点”。"
- en: "Rush to submit first"
  zh: "抢先投稿"
- en: "You cancel everything. The plan: submit first, polish later."
  zh: "你推掉了所有事。计划是：先投出去，再慢慢打磨。"
- en: "Pivot to a new angle"
  zh: "换个角度重来"
- en: "You keep the code and the data and go back to the whiteboard. It stings for a while, then it starts to be fun."
  zh: "代码和数据留着，你回到白板前。难受了一阵子，然后开始觉得有意思了。"
- en: "Concurrent Work"
  zh: "同期工作"
- en: "The sting has faded. Your related work now has a paragraph that begins \"Concurrent with our work\", and honestly, it reads well."
  zh: "痛感已经过去了。你的相关工作里多了一段，开头是“与我们同期的工作”，说实话，读着还挺顺。"
- en: "Email the other authors"
  zh: "给对方作者发邮件"
- en: "The first author replies within the hour. They were just as worried about you. You agree to compare notes."
  zh: "对方一作不到一小时就回信了，原来那边也一样担心你。你们约好交流一下。"
- en: "They reply politely and promise to \"keep in touch\". Nobody does, and you don't mind."
  zh: "对方礼貌地回复，说“保持联系”。后来谁也没联系谁，你也不在意。"
- en: "Let it go"
  zh: "算了"
- en: "Two groups had the same idea at the same time. You decide that means it was a good idea."
  zh: "两个组同时想到了一块儿。你决定把这当成证据：这个想法确实不错。"
- en: "Photo Finish"
  zh: "冲线"
- en: "Your paper is in, rough edges and all. Now, for the first time, you read the other paper slowly."
  zh: "论文投出去了，毛边都还在。现在你才第一次慢慢读那篇论文。"
- en: "Draft the comparison you skipped"
  zh: "补上跳过的对比"
- en: "You write one careful page on how the two papers differ, so you're ready when reviewers ask."
  zh: "你认真写了一页，讲清两篇论文的区别，审稿人问起来就不慌了。"
- en: "Sleep for most of a weekend"
  zh: "周末睡掉大半"
- en: "Eleven hours, then ten. The field did not move on without you."
  zh: "先睡十一个小时，再睡十个。领域并没有趁你睡觉把你甩下。"
- en: "Post a preprint with a note"
  zh: "挂预印本，附上说明"
- en: "Your preprint goes up with a line on concurrent work. People start citing the two papers together."
  zh: "你的预印本挂上去了，附了一句同期工作的说明。大家开始把两篇论文放在一起引用。"
- en: "The New Angle"
  zh: "新角度"
- en: "A month after the pivot, {project} asks a question the other paper never did. You check arXiv twice a day, and so far nobody else has asked it."
  zh: "转向一个月后，{project} 提出了那篇论文从没问过的问题。你每天刷两遍 arXiv，目前还没别人问过。"
- en: "Commit to the new angle"
  zh: "坚定走新方向"
- en: "To your surprise, it's a better paper than the one you lost."
  zh: "没想到，这篇比丢掉的那篇还好。"
- en: "It's a different paper, about as good as the old one. At least nobody else has written it."
  zh: "换了一篇论文，水平和原来那篇差不多。至少没人写过。"
- en: "Reuse what survived"
  zh: "捡回还能用的部分"
- en: "Half the old code still runs, and the data still works. The pivot costs less than it felt like."
  zh: "旧代码有一半还能跑，数据也还能用。转向的代价比想象中小。"
- en: "Beaten Zero-Shot"
  zh: "被零样本碾压"
- en: "{biglab} releases {model} the week before your deadline. Zero-shot, with no training at all, it beats the system you spent months fine-tuning."
  zh: "截稿前一周，{biglab} 发布了 {model}。零样本，完全没训练，就超过了你微调了好几个月的系统。"
- en: "Add it as a baseline"
  zh: "把它加成 baseline"
- en: "Three days of API calls get you a new row in Table 2. Your system loses, but the comparison is honest."
  zh: "调了三天 API，表 2 多了一行。你的系统输了，但比较是诚实的。"
- en: "Reframe: where does it still fail?"
  zh: "换个问法：它还在哪儿翻车？"
- en: "It still fails on the cases your paper cares about most, and those failures become your new contribution."
  zh: "在你论文最关心的那些情况上，它还是会翻车，这些失败成了你的新贡献。"
- en: "It fails less often than you hoped. The reframe eats a week and half your intro."
  zh: "它翻车的次数比你希望的少。重新定位吃掉了一周时间和半个引言。"
- en: "Pretend you didn't see it"
  zh: "假装没看见"
- en: "Out of sight, out of Table 2. Reviewers, unfortunately, have also seen it."
  zh: "眼不见为净，表 2 也清净。可惜审稿人也看到了。"
- en: "No README"
  zh: "没有 README"
- en: "The baseline you have to compare against won't reproduce. Its repo has no README, one script called run2_final.sh, and requirements from three years ago."
  zh: "你必须对比的那个 baseline 复现不出来。仓库里没有 README，只有一个叫 run2_final.sh 的脚本，依赖还是三年前的。"
- en: "Debug their code yourself"
  zh: "自己调他们的代码"
- en: "You find a missing flag buried in a shell script. The numbers now match within half a point."
  zh: "你在一个 shell 脚本深处找到一个漏掉的参数。现在数字的差距在半个点以内了。"
- en: "A week later you're still five points short. You report what you got and explain why."
  zh: "一周过去，还差五个点。你如实报告跑出来的结果，并解释原因。"
- en: "Email the authors"
  zh: "给作者发邮件"
- en: "You send a polite email with three specific questions and get no reply, not even an out-of-office. For now, you use their published numbers."
  zh: "你礼貌地发邮件问了三个具体问题，石沉大海，连自动回复都没有。只好先用他们论文里报告的数字。"
- en: "Report their published numbers"
  zh: "直接用论文报告的数字"
- en: "You add a footnote: \"numbers from the original paper.\" It's standard practice, and some reviewer will still ask."
  zh: "你加了个脚注：“数字引自原论文。”这是惯例，但总会有审稿人问。"
- en: "Re: Missing Hyperparameters"
  zh: "Re: 缺失的超参数"
- en: "A reply to an email you sent almost a year ago: \"Sorry for the delay! Learning rate 3e-5, and we used the dev set for early stopping.\" Your paper has long since moved on."
  zh: "一封快一年前发出的邮件终于有了回复：“抱歉回晚了！学习率 3e-5，我们用验证集做了早停。”你的论文早就翻篇了。"
- en: "Rerun it, for closure"
  zh: "重跑一遍，了个心愿"
- en: "It reproduces on the first try. You feel oddly at peace."
  zh: "一次就复现了。你感到一种奇怪的平静。"
- en: "Add the details to your repo"
  zh: "把细节补进你的仓库"
- en: "Your README now documents their baseline better than theirs does. Strangers start starring your repo."
  zh: "现在你的 README 把他们的 baseline 写得比他们自己还清楚。陌生人开始给你的仓库点 star。"
- en: "Reply \"Thanks!\" and archive it"
  zh: "回个“谢谢！”然后归档"
- en: "Inbox minus one. Some future student will find this thread and weep with joy."
  zh: "收件箱少了一封。将来会有某个学生翻到这个邮件串，喜极而泣。"
- en: "Same Name, Different Model"
  zh: "名字没变，模型变了"
- en: "You rerun last month's evaluation through the {biglab} API. Every number has moved by two points. Same model name, no announcement."
  zh: "你用 {biglab} 的 API 重跑了上个月的评测。每个数字都变了两个点。模型名字一样，也没发任何公告。"
- en: "Rerun everything on the new version"
  zh: "在新版本上全部重跑"
- en: "After two days of reruns, the tables agree with each other again, until the next silent update."
  zh: "重跑了两天，各个表格又对得上了，直到下一次悄悄更新。"
- en: "Report the version and date"
  zh: "注明版本和日期"
- en: "You add a footnote with the exact version string and access date. Reviewers like that kind of thing."
  zh: "你加了个脚注，写明精确的版本号和调用日期。审稿人就爱看这个。"
- en: "Switch to a pinned open model"
  zh: "换成固定版本的开源模型"
- en: "The weights sit on your own disk now, and the numbers finally stop moving."
  zh: "权重现在就躺在你自己的硬盘上，数字终于不再乱动了。"
- en: "The open model needs four GPUs you don't have. After a week, you're back on the API."
  zh: "开源模型要四张你没有的 GPU。折腾了一周，你又回去用 API 了。"
- en: "Scheduled Maintenance"
  zh: "计划内维护"
- en: "IT announces cluster maintenance, Monday through Friday. Your deadline is Saturday."
  zh: "IT 通知集群维护，周一到周五。你周六截稿。"
- en: "The cluster is down for \"planned upgrades\". The plan did not include your deadline."
  zh: "集群因“计划内升级”停机。这个计划显然没把你的截稿算进去。"
- en: "The cluster status page has said \"almost done\" for two days. Your deadline has said \"Friday\" the whole time."
  zh: "集群状态页显示“即将完成”已经两天了。你的截稿日期一直显示“周五”。"
- en: "Borrow compute from a friend"
  zh: "找朋友借算力"
- en: "A friend at another school lends you their reservation for the weekend. You owe them a very nice dinner."
  zh: "外校的朋友把周末预约的机时借给了你。你欠人家一顿大餐。"
- en: "Everyone you know has the same deadline. Every cluster you know is full."
  zh: "你认识的人都在赶同一个截稿。你知道的集群全都满了。"
- en: "Shrink the experiments to fit"
  zh: "缩小实验规模"
- en: "You run a smaller model with fewer seeds on your laptop. The results are real, if a little thin."
  zh: "你在笔记本上用更小的模型、更少的随机种子跑完了。结果是真的，就是单薄了点。"
- en: "Write the paper while you wait"
  zh: "趁等待写论文"
- en: "No GPUs, so you write. It turns out the intro was the real bottleneck."
  zh: "没有 GPU，那就写。结果发现，引言才是真正的瓶颈。"
- en: "The Queue"
  zh: "排队"
- en: "There are {roll:300-500} jobs ahead of yours in the GPU queue."
  zh: "GPU 队列里，你前面还排着 {roll:300-500} 个任务。"
- en: "Your job's estimated start time is \"in 4 days\". This morning it was \"in 3 days\"."
  zh: "你的任务预计开始时间是“4 天后”。今天早上还是“3 天后”。"
- en: "Someone has reserved every GPU on the cluster until Sunday for a job named test."
  zh: "有人把集群上所有 GPU 都占到了周日，任务名叫 test。"
- en: "Wait it out"
  zh: "耐心等着"
- en: "On day four, it starts. On day five, it finishes. You feel like you survived something."
  zh: "第四天，开始跑了。第五天，跑完了。你感觉自己挺过了一场劫难。"
- en: "Ask {labmate} to share their slot"
  zh: "请 {labmate} 分你点机时"
- en: "They share. You now owe them coffee for a month, which is a fair price."
  zh: "成了。代价是请人家喝一个月咖啡，很公道。"
- en: "\"Sorry, my deadline is Friday too.\" Fair enough, if a little awkward."
  zh: "“抱歉，我也是周五截稿。”合情合理，就是有点尴尬。"
- en: "Shrink the experiment"
  zh: "把实验缩小"
- en: "With fewer seeds and a smaller model, it runs tonight. Reviewers may notice."
  zh: "少几个随机种子，换个小模型，今晚就能跑。审稿人可能会注意到。"
- en: "Submit at 3 am instead"
  zh: "改到凌晨 3 点提交"
- en: "Night Owl"
  zh: "夜猫子"
- en: "At 3 am the queue is yours alone. Your job starts before your tea goes cold."
  zh: "凌晨 3 点，队列只属于你。茶还没凉，任务就跑起来了。"
- en: "Out of Memory at 99%"
  zh: "跑到 99% 爆显存"
- en: "Your job ran for three days. At 99%, it died: out of memory."
  zh: "任务跑了三天，跑到 99% 时挂了：显存爆了。"
- en: "Three days of training. The log ends at step 9,900 of 10,000 with one word: killed."
  zh: "训练了三天。日志停在 10,000 步中的第 9,900 步，只有一个词：killed。"
- en: "The progress bar reached 99%. Then the job died, and took the last checkpoint with it."
  zh: "进度条走到了 99%。然后任务挂了，还把最后一个 checkpoint 一起带走了。"
- en: "Add checkpointing, then rerun"
  zh: "加上 checkpoint 再重跑"
- en: "Three more days, but this time you save every hour. Future you says thanks."
  zh: "又是三天，不过这次每小时存一次。未来的你表示感谢。"
- en: "Halve the batch size and pray"
  zh: "把 batch size 砍半再祈祷"
- en: "It finishes, barely, with 200 MB to spare."
  zh: "跑完了，险之又险，显存只剩 200 MB。"
- en: "This time it dies at 98%."
  zh: "这次挂在了 98%。"
- en: "Lie on the lab floor"
  zh: "躺在实验室地板上"
- en: "{labmate} steps over you without comment. It's a lab tradition."
  zh: "{labmate} 一言不发地从你身上跨了过去。这是实验室传统。"
- en: "It Has Seen the Test Set"
  zh: "它见过测试集"
- en: "You paste the first half of a test example into {model}. It completes the rest word for word, including the typo."
  zh: "你把一条测试样例的前半段贴给 {model}。它一字不差地补全了后半段，连错别字都一样。"
- en: "Build a clean test split"
  zh: "做一个干净的测试集"
- en: "You write new examples dated after the model's training cutoff. The scores drop, and now they mean something."
  zh: "你写了一批晚于模型训练截止日期的新样例。分数掉了，但现在终于有意义了。"
- en: "Make contamination a finding"
  zh: "把数据污染变成发现"
- en: "You add a section on how much the model has memorized. It may be the most interesting part of the paper."
  zh: "你加了一节，分析模型到底背下了多少。这可能是整篇论文最有意思的部分。"
- en: "It's interesting, but it swallows the paper. After a two-week side quest, the main story is thinner."
  zh: "有意思是有意思，但把整篇论文都吞了。做了两周支线任务，主线反而更单薄了。"
- en: "Note it in Limitations"
  zh: "写进局限性一节"
- en: "One honest sentence. Reviewer 2 will quote it back to you."
  zh: "一句老实话。2 号审稿人会原话引用，拿来怼你。"
- en: "Too Good to Be True"
  zh: "好得不像真的"
- en: "You change one line, a flag you'd forgotten existed, and every metric jumps five points. Nothing in your method explains why."
  zh: "你改了一行，一个你都忘了还存在的参数，结果所有指标涨了五个点。你的方法里没有任何东西能解释这一点。"
- en: "Find out why first"
  zh: "先搞清楚原因"
- en: "It's real: the old config was silently cutting off long inputs. The gain holds across seeds, and now you can explain it."
  zh: "是真的：旧配置一直在悄悄截断长输入。换随机种子也稳得住，而且你现在能解释了。"
- en: "It's a bug: the new line leaked test labels into training. You revert, a little sadder and much safer."
  zh: "是个 bug：新的那行把测试标签漏进了训练。你回滚了，有点难过，但安全多了。"
- en: "Rerun with five more seeds"
  zh: "再加五个随机种子重跑"
- en: "Three seeds agree and two don't. The honest gain is about two points, which is still a gain."
  zh: "三个种子结果一致，两个不一致。老老实实算，提升大约两个点，那也是提升。"
- en: "Take the five points"
  zh: "五个点先收下"
- en: "You update Table 2 and keep writing. A small voice says \"too good\". You turn the music up."
  zh: "你更新了表 2，继续写。心里有个小声音说“好得过头了”。你把音乐调大了。"
- en: "The Ablation"
  zh: "消融实验"
- en: "Your ablation is back. Removing the main component, the one in your paper's title, changes the score by 0.1."
  zh: "消融实验结果出来了。去掉核心模块，就是论文标题里那个，分数只变了 0.1。"
- en: "Find out what's really working"
  zh: "找出真正起作用的东西"
- en: "It's the data-cleaning step you added for convenience. You rebuild the paper around it, and it's a better story."
  zh: "原来是你图方便加的那步数据清洗。你围绕它重写论文，故事反而更好了。"
- en: "Every part helps a little and nothing helps a lot. Two weeks of ablations leave you with no clear story."
  zh: "每个部分都有点用，但哪个都没大用。两周的消融实验做下来，还是没有清晰的故事。"
- en: "Reframe as an analysis paper"
  zh: "改写成分析类论文"
- en: "\"What Actually Matters?\" is a less flashy title, and a more honest paper."
  zh: "“What Actually Matters?”这个标题没那么抢眼，但论文更诚实。"
- en: "Move it to the appendix"
  zh: "挪到附录"
- en: "It becomes Table 9 in Appendix D. Nobody reads Appendix D, except Reviewer 2."
  zh: "它成了附录 D 里的表 9。没人看附录 D，除了 2 号审稿人。"
- en: "The Baseline Wins"
  zh: "Baseline 赢了"
- en: "Months of work, and the clever method loses to the simple baseline on every dataset. Publish it anyway?"
  zh: "干了几个月，精巧的方法在每个数据集上都输给了简单的 baseline。还要发吗？"
- en: "Publish the negative result"
  zh: "发表负面结果"
- en: "You write a clear, careful paper on why the simple thing wins. {labmate} calls it the most useful thing they've read all year."
  zh: "你写了一篇清晰严谨的论文，讲简单方法为什么能赢。{labmate} 说这是今年读到的最有用的东西。"
- en: "It's honest, and it's hard to sell. The intro needs three more rewrites."
  zh: "诚实是诚实，但不好卖。引言还得再改三遍。"
- en: "Ask why the baseline wins"
  zh: "追问 baseline 为什么赢"
- en: "Now that is a real research question. It costs you weeks and gives you a better paper."
  zh: "这才是真正的研究问题。花了你好几周，换来一篇更好的论文。"
- en: "Keep tuning until it wins"
  zh: "一直调到赢为止"
- en: "After 40 runs, it wins by 0.3. You aren't proud of it, and you suspect it won't hold."
  zh: "跑了 40 次，赢了 0.3。你并不自豪，也怀疑它站不住。"
- en: "After 40 runs, it still loses. Now it loses tired."
  zh: "跑了 40 次，还是输，而且输得筋疲力尽。"
- en: "Shower Thought"
  zh: "洗澡时的灵感"
- en: "A month stuck on the same problem in {project}. Then, halfway through shampooing on your day off, the answer arrives, fully formed."
  zh: "你在 {project} 的同一个问题上卡了一个月。结果休息日洗头洗到一半，答案完完整整地冒了出来。"
- en: "Run dripping to your laptop"
  zh: "顶着一头水冲向电脑"
- en: "You type it before it evaporates, and it still works once you've dried off. Apparently the day off was doing the work."
  zh: "你赶在灵感蒸发前敲了下来，擦干之后再看，依然成立。看来休息日一直在替你干活。"
- en: "Sleep on it before trusting it"
  zh: "睡一觉再说"
- en: "Still good in the morning. Better, even: you can see how to test it in a day."
  zh: "早上再看还是好。甚至更好：你已经看出怎么用一天验证它。"
- en: "By morning you've found the hole in it, but it still points somewhere new."
  zh: "到早上你找到了漏洞，但它还是指向了一个新方向。"
- en: "Text {labmate} right away"
  zh: "马上发消息给 {labmate}"
- en: "11:40 pm, from {labmate}: \"wait. that's actually good.\" You start sketching it together."
  zh: "晚上 11:40，{labmate} 回复：“等等。这个真的可以。”你们开始一起画草图。"
- en: "Clinic Is Slammed"
  zh: "诊所忙疯了"
- en: "The night before your first {project} session, the clinicians write: \"So sorry, clinic is slammed this week. Can we push?\""
  zh: "{project} 第一场实验的前一晚，医生们来信：“实在抱歉，这周诊所忙疯了。能往后推推吗？”"
- en: "An email from the hospital: \"Can we move Thursday's session? Two of us are covering a shift.\" They're very apologetic."
  zh: "医院发来邮件：“周四那场能改个时间吗？我们有两个人要顶班。”语气非常抱歉。"
- en: "\"No problem! Whenever works.\""
  zh: "“没问题！随时都行”"
- en: "They thank you warmly and pick a date two weeks out. You rebook the room."
  zh: "他们热情地道谢，把时间定在两周后。你重新订了房间。"
- en: "Offer slots before morning rounds"
  zh: "提议早查房前的时段"
- en: "Two of them take a 7 am slot and stay late, happily. The others promise to find a time soon."
  zh: "有两位医生接受了早上 7 点的时段，还高高兴兴地多待了一会儿。其他人答应尽快约时间。"
- en: "7 am is when they round, they explain, patiently. You learn something about hospitals."
  zh: "他们耐心地解释：早上 7 点正是查房时间。你对医院又多了点了解。"
- en: "Polish the protocol meanwhile"
  zh: "趁机打磨实验方案"
- en: "You tighten the tasks and the interview guide. When they do come, every minute will count."
  zh: "你精简了任务和访谈提纲。等他们真来了，每一分钟都不会浪费。"
- en: "Rescheduled, Again"
  zh: "又改期了"
- en: "The new date arrives, and so does the email: \"So sorry! Two of us got pulled into a shift. Next week?\" That's twice now."
  zh: "新日期到了，邮件也到了：“太抱歉了！我们有两个人被叫去顶班。下周可以吗？”这已经是第二次了。"
- en: "\"Of course! Next week works.\""
  zh: "“当然！下周可以”"
- en: "You rebook the room, again. The booking system now greets you by name."
  zh: "你又重新订了一次房间。预约系统现在都能叫出你的名字了。"
- en: "Bring coffee to the clinic"
  zh: "带咖啡去诊所"
- en: "You catch them between patients. Two sessions happen right there in the break room, and the rest book real dates."
  zh: "你在他们看诊间隙堵到了人。两场直接在休息室做完，其余的人也约了确定的日子。"
- en: "The clinic is busier than anything you've ever seen. You leave the coffee at the front desk and back away."
  zh: "诊所忙得超出你的想象。你把咖啡放在前台，默默退了出来。"
- en: "Recruit backups from another clinic"
  zh: "去别的诊所招候补"
- en: "Five cold emails get you two yeses. Now you have a plan B, while plan A keeps slipping."
  zh: "五封陌生邮件换来两个同意。现在你有了 B 计划，而 A 计划还在一拖再拖。"
- en: "The Third Time"
  zh: "第三次"
- en: "For the third time, the clinicians reschedule. They're truly sorry. Their first open slot is {roll:3-5} weeks out, after your submission deadline."
  zh: "医生们第三次改期了。他们真的很抱歉。最早的空档在 {roll:3-5} 周后，那时你已经过了截稿日期。"
- en: "Wait for the next deadline"
  zh: "等下一个截稿"
- en: "You move {project} to the next cycle. It stings for a day, then you're relieved to have the time."
  zh: "你把 {project} 挪到了下一轮投稿。难受了一天，然后庆幸多出了时间。"
- en: "Ask {advisor} to email their PI"
  zh: "请 {advisor}联系对方 PI"
- en: "Your advisor sends their PI two polite lines and seems glad to help. By morning, three slots appear, all before the deadline."
  zh: "导师给对方 PI 发了两句客气话，看起来很乐意帮忙。第二天早上就冒出了三个时段，全在截稿前。"
- en: "Your advisor sends the email. The PI replies from a conference: \"Looping in our coordinator.\" The coordinator is on vacation."
  zh: "导师发了邮件。PI 在开会途中回复：“抄送我们的协调员。”协调员在休假。"
- en: "Switch to interviewing nurses"
  zh: "改为访谈护士"
- en: "You send a new recruiting email and file a small IRB amendment. The nurses' station replies within the hour."
  zh: "你发了新的招募邮件，又提交了一份小的伦理审查（IRB）修订。护士站一小时内就回复了。"
- en: "Run sessions with your backups"
  zh: "找候补参与者做实验"
- en: "Plan B"
  zh: "B 计划"
- en: "The backups show up on time, every time, and you make the deadline."
  zh: "候补参与者每次都准时到场，你赶上了截稿。"
- en: "Worth the Wait"
  zh: "值得等待"
- en: "The {project} sessions finally happen. The clinicians are sharp, generous and still apologizing. One says nobody has ever asked their opinion on an AI tool before."
  zh: "{project} 的实验终于做上了。医生们思路敏锐、慷慨大方，还在不停道歉。有位医生说，以前从没人问过自己对 AI 工具的看法。"
- en: "Invite them to advise future studies"
  zh: "邀请他们指导后续研究"
- en: "They say yes, and send a calendar link that actually works. You have a clinical partner now."
  zh: "他们答应了，还发来一个真能用的日历链接。你现在有临床合作伙伴了。"
- en: "Write everything down tonight"
  zh: "今晚全都记下来"
- en: "You write twelve pages of notes before bed. It's some of the best data you'll ever collect."
  zh: "睡前你写了十二页笔记。这是你这辈子能收集到的最好的数据之一。"
- en: "The Nurses' Station"
  zh: "护士站"
- en: "The nurses sign up in a day and show up on time. They're blunter than the physicians, and they know where every workaround in the EHR is hidden."
  zh: "护士们一天就报满了，还都准时到场。他们比医生说话更直，还知道电子病历（EHR）里每个变通办法藏在哪。"
- en: "Center the paper on nurses"
  zh: "让论文聚焦护士"
- en: "The paper becomes a study of the people who actually click the buttons. It's sharper than the one you planned."
  zh: "论文变成了对真正点按钮的那群人的研究。比你原本计划的那篇更犀利。"
- en: "Keep both perspectives"
  zh: "两个视角都保留"
- en: "You interview nurses now and physicians whenever they're free. It's more work, and you get a fuller picture."
  zh: "你先访谈护士，医生什么时候有空再访谈。工作量更大，但图景更完整。"
- en: "One Sentence"
  zh: "一句话"
- en: "The IRB sends your protocol back. The problem: one sentence in the consent form says \"may\" where it should say \"will\"."
  zh: "伦理审查（IRB）把你的方案退了回来。问题在于：知情同意书里有一句该写“将会”的地方写成了“可能”。"
- en: "Fix it and resubmit today"
  zh: "今天改好重新提交"
- en: "You fix it in ten seconds, and it goes back in the queue for two weeks."
  zh: "你十秒钟就改好了，然后它又回到队列里排了两周。"
- en: "Call the IRB office"
  zh: "致电伦理审查办公室"
- en: "A friendly coordinator approves the change while you're still on the phone. You could hug them."
  zh: "一位友善的协调员在电话里就批了修改。你简直想抱抱人家。"
- en: "You get voicemail, then an email, then two weeks in the queue anyway."
  zh: "先是语音信箱，然后是一封邮件，最后还是排了两周队。"
- en: "Rewrite the whole form, carefully"
  zh: "认真重写整份表格"
- en: "If it's going back anyway, it's going back perfect. You swap every vague word in the protocol for a precise one."
  zh: "反正都要重新提交，那就交一份完美的。你把方案里每个含糊的词都换成了精确的。"
- en: "Still Under Review"
  zh: "仍在审稿中"
- en: "Your study plan assumed IRB approval in four weeks. It's week six, and the portal still says \"Under Review\"."
  zh: "你的研究计划假设伦理审查（IRB）四周能批下来。现在是第六周，系统里还是“审核中”。"
- en: "Week eight: approved, at 4:58 pm on a Friday. You print the email and pin it above your desk."
  zh: "第八周：批了，时间是周五下午 4:58。你把邮件打印出来，钉在桌子上方。"
- en: "Email the coordinator, politely"
  zh: "礼貌地给协调员发邮件"
- en: "Your protocol was sitting in the wrong reviewer's pile. It's approved by Thursday."
  zh: "你的方案一直躺在另一位审核人的待办堆里。周四前就批了。"
- en: "\"Thank you for your patience.\" Two more weeks of patience, as it turns out."
  zh: "“感谢你的耐心等待。”结果又耐心等了两周。"
- en: "Read and plan while you wait"
  zh: "边等边读论文做计划"
- en: "By week eight you've read twenty papers and drafted the analysis plan, so the wait doesn't feel wasted."
  zh: "到第八周，你读了二十篇论文，还写好了分析计划，等待也不算白费。"
- en: "Three No-Shows"
  zh: "三连放鸽子"
- en: "You booked the room and bought snacks. Three participants in a row don't show up."
  zh: "你订好了房间，买好了零食。结果连续三个参与者放了你鸽子。"
- en: "Set up automatic reminders"
  zh: "设置自动提醒"
- en: "You send a reminder the day before and another an hour before. Next week, everyone shows up."
  zh: "你提前一天发一次提醒，提前一小时再发一次。下周所有人都来了。"
- en: "Eat the snacks and rebook"
  zh: "吃掉零食，重新约人"
- en: "The snacks are good, and rebooking only takes an afternoon."
  zh: "零食很好吃，重新约人也只花了一个下午。"
- en: "Overbook the next round"
  zh: "下一轮超额预约"
- en: "Just enough people show up this time: five sessions in one day, and a lot of good data."
  zh: "这次来的人刚刚好：一天做了五场，收获了一大堆好数据。"
- en: "Everyone shows up this time, at once. You run two sessions in parallel, badly."
  zh: "这次所有人都来了，还是同时来的。你同时开了两场，两场都做得一团糟。"
- en: "A Matter of Type"
  zh: "字体问题"
- en: "Your participant spends the whole hour on your interface's fonts. \"Is this a sans-serif? It feels very sans-serif.\""
  zh: "参与者整整一小时都在研究你界面的字体。“这是无衬线体吗？感觉非常无衬线。”"
- en: "Steer them back to the task"
  zh: "把话题拉回任务"
- en: "A gentle \"great point, and what about this part?\" works. You get the last 20 minutes back."
  zh: "一句温和的“说得好，那这部分呢？”奏效了。你抢回了最后 20 分钟。"
- en: "They agree, then mention the font twice more."
  zh: "对方表示同意，然后又提了两次字体。"
- en: "Let them talk; take notes"
  zh: "让对方说，你记笔记"
- en: "Half your notes are about letter spacing. One line, about where the eye lands first, ends up in your design implications."
  zh: "你一半的笔记都是关于字间距的。其中一句关于视线最先落在哪里，最后写进了你的设计启示。"
- en: "Swap the font for next time"
  zh: "下次换个字体"
- en: "Nobody mentions the font again. One participant mentions the colors."
  zh: "再也没人提字体了。有一位参与者提了配色。"
- en: "Real Participants"
  zh: "真实参与者"
- en: "Your pilot participant was {labmate}, who finished every task in four minutes. Your first real participant takes forty and never finds the Submit button."
  zh: "你的预实验参与者是 {labmate}，四分钟做完了所有任务。第一位真实参与者花了四十分钟，始终没找到“提交”按钮。"
- en: "Redesign the tasks now"
  zh: "立刻重新设计任务"
- en: "After two days of rework, the next sessions finally measure what you meant them to."
  zh: "返工了两天，接下来的实验终于测到了你想测的东西。"
- en: "Keep going; it's a finding too"
  zh: "继续做，这也算发现"
- en: "\"Usability barriers\" becomes its own section of the paper."
  zh: "“可用性障碍”在论文里单独成了一节。"
- en: "Half your sessions test the tasks, half test the button. It's two messy studies in one."
  zh: "一半的实验在测任务，一半在测那个按钮。等于两个乱糟糟的研究挤在了一起。"
- en: "Pilot again with an outsider"
  zh: "找个外行再做次预实验"
- en: "A friend from another department tries it and can't find the button either. Now you know for sure."
  zh: "外系的朋友试了一下，也没找到那个按钮。这下你确定了。"
- en: "Mid-Session Crash"
  zh: "实验中途崩溃"
- en: "Twenty minutes into the session, your prototype freezes and quits with an error. The participant looks at you kindly."
  zh: "实验进行到二十分钟，你的原型卡死并报错退出。参与者温和地看着你。"
- en: "Restart it and keep smiling"
  zh: "重启，保持微笑"
- en: "It's back in thirty seconds. You make a joke about live demos, they laugh, and the session goes on."
  zh: "三十秒后就恢复了。你拿现场演示开了个玩笑，对方笑了，实验继续。"
- en: "It crashes again at minute 25. You finish the session by sketching the screens on paper."
  zh: "第 25 分钟又崩了。你只好在纸上画界面，把实验做完。"
- en: "Switch to a paper mock-up"
  zh: "改用纸面原型"
- en: "The paper version works, and they start drawing on it. Some of the drawings beat your design."
  zh: "纸面版能用，对方还开始在上面画。有些画得比你的设计还好。"
- en: "End early and fix it tonight"
  zh: "提前结束，今晚修好"
- en: "You spend the night with the logs. By morning that bug is gone, along with two others you hadn't met yet."
  zh: "你和日志度过了一整夜。到早上，那个 bug 没了，顺带还送走了两个你还没见过的。"
- en: "Access Denied"
  zh: "拒绝访问"
- en: "On site at the hospital, you open your study tool. The hospital Wi-Fi blocks it: \"Category: Uncategorized. Access denied.\""
  zh: "到了医院现场，你打开研究工具。医院的 Wi-Fi 拦住了它：“类别：未分类。拒绝访问。”"
- en: "Tether to your phone"
  zh: "开手机热点"
- en: "You get one bar, in one corner of the room. It works as long as nobody moves."
  zh: "只有房间一个角落有一格信号。只要没人动，就能用。"
- en: "Ask the staff for help"
  zh: "找工作人员帮忙"
- en: "A nurse knows exactly who to call in IT. You're unblocked by lunch."
  zh: "一位护士清楚该找 IT 的谁。午饭前就解封了。"
- en: "A ticket is filed. Estimated response: ten business days."
  zh: "工单已提交。预计响应时间：十个工作日。"
- en: "Build an offline version tonight"
  zh: "今晚做个离线版"
- en: "The offline build runs from a laptop and is faster than the online one, which is a little embarrassing."
  zh: "离线版在笔记本上就能跑，还比在线版更快，这就有点尴尬了。"
- en: "At 3 am it half-works. The next session runs on the half that works."
  zh: "凌晨 3 点，它能用一半了。下一场实验就靠能用的那一半。"
- en: "That's Not How a Clinic Works"
  zh: "诊所可不是这样运转的"
- en: "A clinician reads your \"realistic scenario\" and laughs. \"Nobody would see this patient without the chart open. Who wrote this?\" You did."
  zh: "一位医生读了你的“真实场景”，笑了：“谁会不打开病历就看这个病人？这是谁写的？”是你写的。"
- en: "Rewrite it with them"
  zh: "和对方一起重写"
- en: "Thirty minutes later the scenario is realistic, and the clinician is invested in your study."
  zh: "三十分钟后，场景真实了，这位医生也对你的研究上了心。"
- en: "Shadow a clinic shift first"
  zh: "先跟诊一个班"
- en: "After eight hours on your feet, you come back with three better scenarios and very tired legs."
  zh: "站了八个小时，你带回了三个更好的场景，和一双累坏的腿。"
- en: "Keep it; it's a controlled study"
  zh: "不改，这是对照研究"
- en: "Controlled, yes. Reviewers from medicine will have notes."
  zh: "对照是挺严格的。医学背景的审稿人会有话要说。"
- en: "The Hallway Conversation"
  zh: "走廊里的对话"
- en: "Waiting for the elevator, a nurse asks what you're working on. In three minutes, they explain the real problem better than your entire related work section."
  zh: "等电梯时，一位护士问你在做什么。三分钟里，对方把真正的问题讲得比你整个相关工作部分还清楚。"
- en: "Take notes right there"
  zh: "当场记笔记"
- en: "You miss two elevators and fill four screens of notes."
  zh: "你错过了两趟电梯，记了满满四屏笔记。"
- en: "Invite them to your study"
  zh: "邀请对方参加研究"
- en: "They say yes, and bring a colleague. Both are better participants than anyone on your list."
  zh: "对方答应了，还带来一位同事。两个人都比你名单上的任何人更适合当参与者。"
- en: "Ask them to collaborate"
  zh: "邀请对方合作"
- en: "\"Sure, if you bring coffee.\" You have your first clinical collaborator."
  zh: "“行啊，带咖啡来就行。”你有了第一位临床合作者。"
- en: "They laugh: \"I barely have time for lunch.\" But they give you their email, just in case."
  zh: "对方笑了：“我连吃午饭的时间都没有。”但还是留了邮箱给你，以防万一。"
- en: "The Bots Found Your Survey"
  zh: "机器人发现了你的问卷"
- en: "Your online survey gets {roll:300-450} responses overnight. Most took under a minute, and every open answer says \"Good survey, very nice.\""
  zh: "你的在线问卷一夜之间收到 {roll:300-450} 份回复。大多数用时不到一分钟，每道开放题都写着“问卷很好，非常不错。”"
- en: "Clean it by hand"
  zh: "手动清洗"
- en: "You flag every response that's too fast, too tidy or too nice, and about 30% goes."
  zh: "你把太快、太整齐、太客气的回复都标了出来，大约 30% 被剔除。"
- en: "Add attention checks, relaunch"
  zh: "加注意力检查，重新发放"
- en: "Round two asks: \"Select purple.\" The bots select blue. The humans, mostly, select purple."
  zh: "第二轮问卷写着：“请选择紫色。”机器人选了蓝色。人类大多选了紫色。"
- en: "Write a filter script"
  zh: "写个过滤脚本"
- en: "The script checks timing, duplicate answers and pasted text, and catches nearly all the bots in an hour."
  zh: "脚本检查答题时间、重复答案和粘贴文本，一小时就抓出了几乎所有机器人。"
- en: "The script flags half your real participants too. You end up cleaning by hand anyway."
  zh: "脚本把一半真实参与者也标成了可疑。最后你还是得手动清洗。"
- en: "Neutral on Everything"
  zh: "全部中立"
- en: "You open the questionnaire results. Every participant picked \"Neutral\" on every Likert item. Your bar chart is a flat line at 4."
  zh: "你打开问卷结果。每位参与者在每道李克特量表题上都选了“中立”。你的柱状图是一条停在 4 的水平线。"
- en: "Lean on the interviews instead"
  zh: "改为依靠访谈"
- en: "The story was in the interviews all along. The flat chart shrinks to one sentence."
  zh: "故事一直就藏在访谈里。那张平平的图缩成了一句话。"
- en: "The interviews are polite and vague too. You start to suspect the problem is your tasks."
  zh: "访谈也是客客气气、含含糊糊。你开始怀疑问题出在你的任务上。"
- en: "Report \"no clear preference\""
  zh: "报告“无明显偏好”"
- en: "You report the null result in one paragraph. It's the least exciting paragraph in the paper."
  zh: "你用一段话报告了这个零结果。这是整篇论文里最无聊的一段。"
- en: "Fix the questionnaire next time"
  zh: "下次改进问卷"
- en: "You leave a note for future you: drop the middle option and ask about specific moments."
  zh: "你给未来的自己留了张字条：去掉中间选项，问具体的时刻。"
- en: "[inaudible]"
  zh: "[听不清]"
- en: "The transcripts are back. The best quote of the whole study reads: \"The real problem is [inaudible], and that's why we [inaudible].\""
  zh: "转录稿回来了。整个研究里最精彩的一句引语是：“真正的问题是[听不清]，所以我们才[听不清]。”"
- en: "Re-listen and fix them yourself"
  zh: "自己重听重校"
- en: "After ten hours in headphones, you know every participant's laugh and favorite filler word."
  zh: "戴了十个小时耳机后，你熟悉了每位参与者的笑声和最爱的口头禅。"
- en: "Ask the participant to recall it"
  zh: "请参与者回忆原话"
- en: "They reply the same day with an even better version of the quote."
  zh: "对方当天就回复了，给出的版本比原话还精彩。"
- en: "No reply. The best quote of the study stays [inaudible] forever."
  zh: "没有回复。整个研究最精彩的那句话，永远停在了[听不清]。"
- en: "Work with what's legible"
  zh: "就用听得清的部分"
- en: "Most of it is fine. The gaps will show up as a slightly vaguer Findings section."
  zh: "大部分都没问题。缺的那些，会让研究发现部分略显含糊。"
- en: "Not That Feature"
  zh: "不是那个功能"
- en: "Every participant ignores the AI feature your paper is about. They all love the export button you added at 2 am."
  zh: "每位参与者都无视了你论文主打的 AI 功能。他们都爱上了你凌晨 2 点随手加的导出按钮。"
- en: "Reframe around what they used"
  zh: "围绕他们实际用的重新定位"
- en: "The paper becomes about what people actually wanted, which is more surprising than what you planned."
  zh: "论文改成讲人们真正想要的东西，这比你原计划的更出人意料。"
- en: "The reframe never quite lands. Is it a paper about export buttons now?"
  zh: "重新定位始终没立住。现在这是一篇关于导出按钮的论文了吗？"
- en: "Redesign so they find the AI"
  zh: "重新设计，让人找到 AI"
- en: "You move the AI feature front and center. In the next round of sessions, they use it."
  zh: "你把 AI 功能挪到了最显眼的位置。下一轮实验里，大家用上了。"
- en: "Report both, honestly"
  zh: "如实报告两者"
- en: "You write one section on the feature you built and another on the export button they loved."
  zh: "你用一节写你做的功能，另一节写他们喜欢的导出按钮。"
- en: "A Larger Sample"
  zh: "更大的样本"
- en: "The reviews agree on one thing: \"The sample is small.\" Your 12 clinicians took six months to recruit."
  zh: "审稿意见在一件事上达成了一致：“样本量太小。”你那 12 位医生可是花了六个月才招到的。"
- en: "Recruit more, however long it takes"
  zh: "继续招人，多久都行"
- en: "You reopen recruiting. The paper will be stronger, and much later."
  zh: "你重新开始招募。论文会更扎实，也会晚很多。"
- en: "Argue depth over breadth"
  zh: "论证深度胜过广度"
- en: "You write a paragraph on why 12 deep sessions with experts beat 100 shallow ones. It even convinces you."
  zh: "你写了一段，论证 12 场深入的专家访谈胜过 100 场浅尝辄止的。连你自己都被说服了。"
- en: "It reads as defensive. You rewrite it twice, and it still reads a little defensive."
  zh: "读起来像在辩解。你改了两遍，还是有点像在辩解。"
- en: "Add a quick survey of 100"
  zh: "加一份 100 人的快速问卷"
- en: "A hospital mailing list does the trick. A hundred survey responses back up your 12 interviews."
  zh: "一个医院的邮件列表就搞定了。一百份问卷回复撑起了你的 12 场访谈。"
- en: "Eleven responses, three of them from the same person. The survey becomes a footnote."
  zh: "只收到十一份回复，其中三份来自同一个人。问卷沦为了一个脚注。"
- en: "Their Bug, Your Win"
  zh: "他们的 bug，你的胜利"
- en: "Out of curiosity, you rerun the paper that scooped you. Their test set overlaps their training set, and once you fix that, your method is the better one after all."
  zh: "出于好奇，你复现了抢先发表的那篇论文。他们的测试集和训练集有重叠，修正之后，到头来还是你的方法更好。"
- en: "Email the authors, privately"
  zh: "私下给作者发邮件"
- en: "They confirm it within a day and post a correction that thanks you by name."
  zh: "对方一天内就确认了，还发了一份勘误，点名感谢了你。"
- en: "\"Thanks, we'll look into it.\" The correction never comes, but at least you know your own numbers are right."
  zh: "“谢谢，我们会看看的。”勘误一直没来，但至少你知道自己的数字是对的。"
- en: "Write it up as a short note"
  zh: "写成一篇短文"
- en: "You write four careful, kind pages on reproducing their result. More people read it than either original paper."
  zh: "你写了四页严谨又客气的复现报告。读它的人比读那两篇原论文的都多。"
- en: "Smile and say nothing"
  zh: "笑而不语"
- en: "You tell no one and reread your related work, slowly, with a small private grin."
  zh: "你谁也没告诉，只是慢慢重读了自己的相关工作，嘴角偷偷上扬。"
- en: "Saturated"
  zh: "饱和了"
- en: "{biglab} releases {model}. Slide 14: {roll:97-99}% on your benchmark, six months after you released it. Your leaderboard is now a list of rounding errors."
  zh: "{biglab} 发布了 {model}。第 14 页幻灯片：在你的基准上拿了 {roll:97-99}%，距你发布它才过了六个月。你的排行榜现在就是一串舍入误差。"
- en: "Build a harder version 2"
  zh: "做个更难的第 2 版"
- en: "You write new examples aimed at exactly what {model} gets right. It's a lot of work, and other labs pick it up right away."
  zh: "你专门针对 {model} 做对的地方写了新样例。工作量很大，但别的实验室马上就用上了。"
- en: "Check what it really learned"
  zh: "看看它到底学到了什么"
- en: "It aces your benchmark and stumbles on a lightly reworded copy. That's a short paper right there."
  zh: "它在你的基准上拿满分，换个说法就栽了。这本身就是一篇短论文。"
- en: "It really is that good, on everything you try. You learn a lot about the model, and nothing you can publish."
  zh: "它真的就是这么强，你试什么都行。你对这个模型了解了很多，但没有一点能发表。"
- en: "Call it a success"
  zh: "就当是成功了"
- en: "Saturated means used. You add \"widely adopted\" to your CV and close the tab."
  zh: "饱和说明有人用。你在简历上加了“被广泛采用”，然后关掉了网页。"
- en: "Seed 43"
  zh: "种子 43"
- en: "Seed 42: your method wins by three points. Seed 43: it loses by one. Seed 44 would rather not get involved."
  zh: "种子 42：你的方法领先三个点。种子 43：落后一个点。种子 44 表示不想掺和。"
- en: "You change the random seed, for no reason at all. Your three-point gain becomes a one-point loss."
  zh: "你随手换了个随机种子，毫无理由。三个点的提升变成了一个点的下降。"
- en: "Run ten seeds, report the mean"
  zh: "跑十个种子，报告均值"
- en: "With ten runs and error bars, the gain shrinks to about two points, and it holds."
  zh: "跑了十次，加上误差线，提升缩到两个点左右，但站得住。"
- en: "Find out why it's so fragile"
  zh: "查查为什么这么脆弱"
- en: "The culprit is a warmup schedule that only works on lucky seeds. Once you fix it, the gain holds on all of them."
  zh: "罪魁祸首是一个只对幸运种子管用的 warmup 策略。修好之后，所有种子上都有提升。"
- en: "Two days of staring at loss curves. They look like modern art and explain about as much."
  zh: "盯着 loss 曲线看了两天。它们像现代艺术，也和现代艺术一样让人看不懂。"
- en: "Report seed 42"
  zh: "就报种子 42"
- en: "Everyone uses 42, you tell yourself. Reviewer 2 has heard that one before."
  zh: "大家都用 42，你这么安慰自己。2 号审稿人早就听过这套说辞了。"
- en: "Price Update"
  zh: "价格调整"
- en: "{biglab} doubles its API prices, starting Monday. Your experiment plan, budgeted to the dollar, now covers exactly half of your experiments."
  zh: "{biglab} 宣布从周一起 API 价格翻倍。你精确到每一美元的实验预算，现在刚好只够一半的实验。"
- en: "Cut the plan in half, carefully"
  zh: "仔细把计划砍掉一半"
- en: "You keep the experiments that answer the question and drop the ones that only decorate it."
  zh: "你保留了回答问题的实验，砍掉了只起装饰作用的。"
- en: "Ask {advisor} for more budget"
  zh: "找 {advisor}要更多预算"
- en: "Your advisor finds a forgotten line in an old grant. The plan survives, and you owe that grant a progress report."
  zh: "导师在一个旧项目经费里翻出一笔被遗忘的预算。计划保住了，代价是你欠那个项目一份进展报告。"
- en: "\"Budgets are budgets.\" Your advisor suggests you get creative. You were afraid of that."
  zh: "“预算就是预算。”导师建议你发挥一下创造力。你就怕听到这句。"
- en: "Move to an open model"
  zh: "改用开源模型"
- en: "After a week of setup, every run costs only electricity and a lot of patience."
  zh: "折腾了一周环境，之后每次运行只花电费和大量耐心。"
- en: "Works in the Demo"
  zh: "Demo 里好好的"
- en: "Your prompt nailed every example at lab meeting. On the full test set it scores {roll:31-44}%. The demo examples, you realize, are the ones you wrote the prompt on."
  zh: "组会上你的 prompt 每个例子都答对了。在完整测试集上，它只拿了 {roll:31-44}%。你这才意识到，演示用的例子正是你写 prompt 时用的那些。"
- en: "Hold out a real dev set"
  zh: "留出一个真正的验证集"
- en: "You set aside a clean split and get a lower, honest number. From here the prompt improves slowly, and for real."
  zh: "你划出一份干净的数据，得到一个更低但诚实的数字。从这开始，prompt 慢慢变好，而且是真的变好。"
- en: "Study the failures first"
  zh: "先研究失败案例"
- en: "The failures share a pattern: long inputs that ask two questions at once. You can write that up as a finding."
  zh: "失败案例有个共同模式：输入很长，而且一次问了两个问题。这可以写成一个发现。"
- en: "Every failure fails in its own way. You now have 400 rows of sadness in a spreadsheet."
  zh: "成功的案例都是相似的，失败的案例各有各的失败。你的表格里现在有 400 行悲伤。"
- en: "Tweak the prompt until it works"
  zh: "一直改 prompt 直到能用"
- en: "Version 23 of the prompt scores 61%. One paragraph is in all caps. You try not to think about it."
  zh: "第 23 版 prompt 拿到了 61%。其中有一段全是大写字母。你尽量不去想它。"
- en: "Shuffled Before the Split"
  zh: "先打乱再划分"
- en: "The preprocessing script you borrowed from {labmate} shuffles before it splits. Some test examples have been in your training data the whole time, and in theirs."
  zh: "你从 {labmate} 那借来的预处理脚本先打乱再划分。有些测试样例一直混在你的训练数据里，对方的也一样。"
- en: "Tell {labmate} first, kindly"
  zh: "先委婉地告诉 {labmate}"
- en: "They go pale, then thank you. You fix both copies together over a long lunch, and they insist on paying."
  zh: "对方脸都白了，然后向你道谢。你们边吃一顿漫长的午饭边修好了两份代码，对方坚持要请客。"
- en: "Fix only your own copy"
  zh: "只修自己那份"
- en: "Your numbers drop to their true values. {labmate}'s code still has the bug, and that bothers you all week."
  zh: "你的数字掉回了真实水平。{labmate} 的代码里还留着这个 bug，这让你一整周都心里不踏实。"
- en: "Raise it at lab meeting"
  zh: "在组会上提出来"
- en: "You frame it as \"a bug any of us could have\". Three people check their code that night, and two of them find it."
  zh: "你把它说成“我们谁都可能犯的 bug”。当晚有三个人检查了自己的代码，其中两个真的找到了。"
- en: "It comes out sounding like an accusation. {labmate} is very polite to you for a week, which is worse."
  zh: "说出口却像在指责。{labmate} 对你客客气气了一整周，这更糟。"
- en: "Distant Cousins"
  zh: "远房亲戚"
- en: "You reread your thesis proposal for the first time in a year. The question on page 2 and the question {project} is answering are distant cousins at best."
  zh: "一年来你第一次重读自己的开题报告。第 2 页上的研究问题和 {project} 正在回答的问题，顶多算远房亲戚。"
- en: "Rewrite the question to match"
  zh: "改写问题，对上现状"
- en: "The new question is better, and it's the one you've been answering all along. Page 2 gets an update."
  zh: "新问题更好，而且就是你一直在回答的那个。第 2 页更新了。"
- en: "Steer the project back"
  zh: "把项目拉回正轨"
- en: "You trim the parts that wandered off. Less exciting, but your committee will recognize it."
  zh: "你剪掉了跑偏的部分。没那么激动人心，但委员会认得出来。"
- en: "Ask {advisor} which one to keep"
  zh: "问 {advisor}该留哪个"
- en: "\"Drift is how research works,\" your advisor says. \"Just write down why.\" You feel much lighter."
  zh: "“研究本来就会跑偏，”导师说，“把原因写下来就行。”你一下子轻松多了。"
- en: "Your advisor asks which question you'd rather defend. You don't know yet, so that becomes your homework."
  zh: "导师问你更想在答辩时捍卫哪个问题。你还不知道，于是这成了你的作业。"
- en: "Just in Case"
  zh: "以防万一"
- en: "Four datasets, and the results are clear. But what if a reviewer asks about a fifth? You open its download page, \"just to look\"."
  zh: "四个数据集，结论已经很清楚了。可要是审稿人问起第五个呢？你打开了它的下载页面，“就看看”。"
- en: "Add it, just in case"
  zh: "加上，以防万一"
- en: "Three days of preprocessing for one more column in Table 2. It agrees with the other four."
  zh: "预处理了三天，换来表 2 多一列。结论和另外四个一致。"
- en: "Spend the time on the intro"
  zh: "把时间花在引言上"
- en: "You close the tab and fix the introduction instead. Reviewers read the intro first, and some read only that."
  zh: "你关掉网页，转而改引言。审稿人最先读引言，有些人只读引言。"
- en: "Put it in future work"
  zh: "写进未来工作"
- en: "It gets one line in the conclusion. If a reviewer asks, you have an answer ready, along with a little guilt."
  zh: "它在结论里占了一行。要是审稿人问起，你有现成的回答，外加一点心虚。"
- en: "Ten Times Easier"
  zh: "简单十倍"
- en: "{biglab} open-sources {model}, weights and all. The pipeline you spent three months building for {project}, it does in a single call."
  zh: "{biglab} 开源了 {model}，连权重都放了出来。你为 {project} 花三个月搭的流程，它一次调用就搞定。"
- en: "Rebuild on top of it"
  zh: "基于它重建"
- en: "A week of rewiring, then everything runs ten times faster. Your old pipeline moves to a folder called legacy."
  zh: "改了一周接线，之后一切都快了十倍。你的旧流程搬进了一个叫 legacy 的文件夹。"
- en: "Aim higher with the time saved"
  zh: "拿省下的时间做更大的题"
- en: "With the easy part done for you, {project} takes on a harder and better question."
  zh: "简单的部分有人替你做了，{project} 可以挑战一个更难也更好的问题。"
- en: "The bigger question is bigger than you thought. Your scope doubles, and so does your to-do list."
  zh: "更大的问题比你想的还大。你的研究范围翻了一倍，待办清单也一样。"
- en: "Keep your own pipeline"
  zh: "坚持用自己的流程"
- en: "Yours is slower, but you understand every line of it, and nobody can say you just called a model."
  zh: "你的慢一些，但每一行你都懂，也没人能说你只是调了个模型。"
- en: "Grading Its Siblings"
  zh: "给自家兄弟打分"
- en: "Your LLM judge rates outputs from its own model family {roll:8-15} points higher, even when you hide which system wrote what."
  zh: "你的 LLM 评委给自家模型家族的输出多打了 {roll:8-15} 分，即使你隐藏了每条输出来自哪个系统。"
- en: "Add a human evaluation"
  zh: "加一轮人工评估"
- en: "Three annotators rate 300 pairs over one long week. The humans don't care whose family is whose."
  zh: "三位标注员花了漫长的一周评了 300 对样本。人类可不管谁是谁家的。"
- en: "Use judges from three labs"
  zh: "用三家实验室的评委模型"
- en: "You average three judges from three model families. It costs more and argues less."
  zh: "你取了三个模型家族三个评委的平均分。花费更多，争议更少。"
- en: "Make the bias a finding"
  zh: "把偏见变成发现"
- en: "You add a section on judges that favor their own family. It gets more attention than the rest of the paper."
  zh: "你加了一节，讲评委模型偏袒自家人。它比论文其余部分加起来都更受关注。"
- en: "Interesting, but three papers found it last month. It shrinks to a footnote."
  zh: "有意思，但上个月已经有三篇论文发现了。它缩成了一个脚注。"
- en: "Copy x3"
  zh: "复制三遍"
- en: "As a sanity check, you score a system that just copies the input three times. It beats every model on your metric, including yours."
  zh: "作为合理性检查，你给一个只会把输入复制三遍的系统打了分。在你的指标上，它打败了所有模型，包括你的。"
- en: "Switch to a better metric"
  zh: "换个更好的指标"
- en: "You switch metrics and rerun every table. The numbers finally move the right way."
  zh: "你换了指标，重跑了每张表。数字终于往正确的方向变了。"
- en: "Add the copy baseline to Table 2"
  zh: "把复制 baseline 加进表 2"
- en: "\"Copy x3\" joins Table 2 as a warning. Reviewers love a baseline that embarrasses a metric."
  zh: "“Copy x3”作为警示加入了表 2。审稿人最爱这种让指标出丑的 baseline。"
- en: "Never speak of it again"
  zh: "从此绝口不提"
- en: "You delete Copy x3 and never mention it again. You sleep fine, mostly."
  zh: "你删掉了 Copy x3，再也没提过它。你睡得还行，大部分时候。"
- en: "Removed Over Licensing"
  zh: "因许可问题下架"
- en: "The dataset your whole project uses vanishes overnight: \"Removed due to licensing concerns.\" Your copy is still on the cluster. Are you still allowed to use it?"
  zh: "你整个项目都在用的数据集一夜之间消失了：“因许可问题已移除。”你的副本还在集群上。你还能用吗？"
- en: "Ask the university's lawyers"
  zh: "咨询学校的律师"
- en: "Three weeks and one very long email later, the answer: you may use it, but not share it."
  zh: "三周和一封超长邮件之后，答案来了：可以用，但不能分享。"
- en: "Switch to an open dataset"
  zh: "换成开放数据集"
- en: "The license is cleaner and the dataset is messier. You rerun everything and sleep better."
  zh: "许可干净了，数据却更乱了。你全部重跑，睡得踏实多了。"
- en: "Build a small replacement"
  zh: "自己做个小替代品"
- en: "After two weeks of collecting from open sources, you have a smaller, cleaner replacement that you're allowed to release."
  zh: "从公开来源收集了两周后，你有了一个更小、更干净、而且可以公开发布的替代数据集。"
- en: "Your replacement has 800 examples and a bad attitude. You end up switching to an open dataset anyway."
  zh: "你的替代品只有 800 条样例，脾气还不小。最后你还是换成了开放数据集。"
- en: "Anything Else?"
  zh: "还有别的吗？"
- en: "You want to add one survey question: \"Anything else?\" The IRB says that needs an amendment, a revised protocol and a new consent form."
  zh: "你想在问卷里加一道题：“还有别的吗？”伦理审查（IRB）说，这需要提交修订申请、修改方案，再换一份新的知情同意书。"
- en: "File the amendment"
  zh: "提交修订申请"
- en: "You file eleven pages for two words. It's approved in three weeks with no changes, and you're almost disappointed."
  zh: "为了一句话，你交了十一页材料。三周后原样批准，你几乎有点失望。"
- en: "Fix four other things while you're at it"
  zh: "顺手再改四处别的"
- en: "If you're amending anyway, you fix everything that bugged you. It's slower, and the study is better for it."
  zh: "既然反正要修订，你把所有看不顺眼的地方都改了。慢是慢了点，但研究因此更好了。"
- en: "Drop the question"
  zh: "删掉这道题"
- en: "The survey stays as approved. You'll always wonder what \"else\" there was."
  zh: "问卷保持批准时的样子。你会一直好奇，到底还有什么“别的”。"
- en: "Let's Do This!"
  zh: "一起干吧！"
- en: "A clinician you met at a workshop loved your idea for {project}: \"Let's do this!\" That was {roll:7-9} weeks ago. Your last three emails have no replies."
  zh: "你在一个 workshop 上认识的医生很喜欢你 {project} 的想法：“一起干吧！”那是 {roll:7-9} 周前的事了。你最近的三封邮件都没回音。"
- en: "Send one short, friendly nudge"
  zh: "发一封简短友好的催问"
- en: "\"So sorry, flu season! Thursday?\" They're back, and still excited."
  zh: "“太抱歉了，流感季！周四行吗？”对方回来了，热情不减。"
- en: "Silence again. Their name goes on a list you call \"someday\"."
  zh: "又是沉默。对方的名字被你列进了一个叫“改天”的清单。"
- en: "Catch them after a hospital talk"
  zh: "在医院讲座后堵人"
- en: "You sit through an hour on billing codes, then catch them at the door. They apologize and book a meeting on the spot."
  zh: "你坐着听完一小时的医保编码讲座，然后在门口堵到了人。对方连连道歉，当场约了会面。"
- en: "Move on without them"
  zh: "不等对方了"
- en: "You redesign {project} to need less clinical input. It's more doable and a little less exciting."
  zh: "你重新设计了 {project}，减少对临床参与的依赖。更可行了，也没那么让人兴奋了。"
- en: "One Participant"
  zh: "一位参与者"
- en: "Two weeks of flyers on every board on campus bring in exactly one participant: {advisor}'s friend from grad school, who says {advisor} \"insisted\"."
  zh: "传单贴遍校园的每块布告栏，两周下来只招到一位参与者：{advisor}读研时的朋友，说是 {advisor}“非要我来”。"
- en: "Run the session anyway"
  zh: "照样做实验"
- en: "A great participant, full of stories about your advisor at your age. You get data and gossip."
  zh: "一位很棒的参与者，满肚子都是你导师在你这个年纪时的故事。你既拿到了数据，也听到了八卦。"
- en: "Post in online communities"
  zh: "在网上社区发帖"
- en: "One post in the right forum and your calendar fills up in two days."
  zh: "在对的论坛发了一个帖子，两天内你的日程就排满了。"
- en: "Forty replies, all from accounts selling followers."
  zh: "四十条回复，全是卖粉丝的账号。"
- en: "Ask clinics to forward your email"
  zh: "请诊所转发你的邮件"
- en: "Slower than a post, but every reply comes from exactly the people you need."
  zh: "比发帖慢，但每一封回复都来自你真正需要的人。"
- en: "Kappa 0.2"
  zh: "Kappa 只有 0.2"
- en: "You and {labmate} coded the same ten interviews. Cohen's kappa: 0.2. You disagree on what counts as \"trust\", \"workaround\" and, somehow, \"the\"."
  zh: "你和 {labmate} 编码了同样的十份访谈。Cohen's kappa：0.2。你们对什么算“信任”、什么算“变通”，甚至不知怎么的连“的”都有分歧。"
- en: "Reconcile it, code by code"
  zh: "逐个编码对齐"
- en: "Six hours and two pizzas later, you have one shared codebook and a kappa of 0.71. You're still friends, mostly."
  zh: "六个小时、两个披萨之后，你们有了一份共同的编码手册，kappa 达到 0.71。你们大体上还是朋友。"
- en: "Switch to consensus coding"
  zh: "改为共识编码"
- en: "No kappa, just discussion until you agree. Some reviewers will frown; others won't notice."
  zh: "不算 kappa 了，讨论到一致为止。有些审稿人会皱眉，有些根本不会注意。"
- en: "Rewrite the codebook first"
  zh: "先重写编码手册"
- en: "Every code gets a clear definition and an example. Round two hits 0.68 without a single argument."
  zh: "每个编码都有了清晰的定义和一个例子。第二轮达到 0.68，一次都没吵。"
- en: "The new codebook is longer and just as vague. Kappa rises to 0.24, which is technically progress."
  zh: "新的编码手册更长，也一样含糊。Kappa 升到了 0.24，严格来说算是进步。"
- en: "Thinking, Not Aloud"
  zh: "无声思维"
- en: "Five minutes into the think-aloud, your participant goes quiet. For thirty minutes they click, frown and click again, without a word."
  zh: "出声思维实验开始五分钟，参与者就不出声了。接下来三十分钟，对方点一下、皱皱眉、再点一下，一个字也不说。"
- en: "Prompt gently: \"What are you thinking?\""
  zh: "轻声提示：“你在想什么？”"
- en: "\"Oh! Sorry. I was thinking this button is lying to me.\" After that, they don't stop talking."
  zh: "“哦！抱歉。我在想这个按钮是不是在骗我。”之后对方就停不下来了。"
- en: "\"Nothing much.\" They go quiet again, now slightly self-conscious."
  zh: "“没想什么。”对方又安静了，这回还有点不自在。"
- en: "Let them work, ask after"
  zh: "让对方做完再问"
- en: "A follow-up interview fills in some gaps. Participants remember being much less confused than they looked."
  zh: "事后访谈补上了一些空白。参与者记忆中的自己，比当时看上去淡定得多。"
- en: "Narrate the recording tonight"
  zh: "今晚给录屏配解说"
- en: "You narrate their clicks yourself from the screen recording. It's tedious, and it tells you more than you expected."
  zh: "你对着录屏，亲自给对方的每次点击配解说。很枯燥，但收获比预想的多。"
- en: "Can I Keep It?"
  zh: "能留给我用吗？"
- en: "At the end of the session, a participant asks if they can keep using your prototype. \"It saves me twenty minutes a day.\" Your prototype is held together with tape."
  zh: "实验结束时，一位参与者问能不能继续用你的原型。“它每天能帮我省二十分钟。”你的原型全靠胶带粘着。"
- en: "Say yes and keep it running"
  zh: "答应，并让它一直能用"
- en: "You fix the worst bugs and answer their emails. Their real-world use becomes the best part of the paper."
  zh: "你修掉最严重的 bug，回复对方的邮件。对方在真实环境中的使用成了论文最精彩的部分。"
- en: "Add a field deployment"
  zh: "增加实地部署"
- en: "It takes an IRB amendment and a month of real use. The paper gets much stronger, and much later."
  zh: "这需要一份伦理审查（IRB）修订和一个月的真实使用。论文扎实了很多，也晚了很多。"
- en: "Thank them, but say no"
  zh: "道谢，但婉拒"
- en: "They're disappointed, and you're flattered. Their quote goes on a slide for your next talk."
  zh: "对方很失望，你则受宠若惊。那句话被你放进了下次报告的幻灯片。"
- en: "Who Goes First"
  zh: "谁当一作"
- en: "Your clinical collaborator reads the {project} draft: \"Great work! In medicine, the person with the clinical insight is first author. I assume that's me?\""
  zh: "你的临床合作者读了 {project} 的初稿：“做得好！在医学界，提供临床洞见的人是第一作者。我想应该是我吧？”"
- en: "Explain how CS authorship works"
  zh: "解释计算机领域的署名规矩"
- en: "You explain kindly, with examples. They agree to be last author, the senior spot, and seem pleased with it."
  zh: "你耐心地举例解释。对方同意署名在最后，也就是资深作者的位置，看起来还挺满意。"
- en: "They're polite and unconvinced. The thread grows to 31 emails."
  zh: "对方很客气，但不买账。邮件串涨到了 31 封。"
- en: "Ask {advisor} to handle it"
  zh: "请 {advisor}出面处理"
- en: "Your advisor and theirs talk for ten minutes. You stay first author. Nobody tells you what was said."
  zh: "你的导师和对方的上级聊了十分钟。你保住了一作。没人告诉你他们聊了什么。"
- en: "Your advisor proposes co-first authorship and a footnote. The clinician takes it, and you try to be gracious."
  zh: "导师提议共同一作，再加一个脚注。医生接受了，你努力表现得大度一点。"
- en: "Offer co-first authorship"
  zh: "提议共同一作"
- en: "Two asterisks and a footnote. Everyone's happy, and the clinic starts sending you participants."
  zh: "两个星号加一个脚注。皆大欢喜，诊所还开始给你介绍参与者。"
- en: "Legal Review"
  zh: "法务审核"
- en: "To share de-identified notes with you, the hospital needs a data-sharing agreement, reviewed by its legal team. The legal team, you learn, is two people."
  zh: "医院要和你共享脱敏后的病历，需要签一份数据共享协议，并由法务团队审核。你后来才知道，这个法务团队一共两个人。"
- en: "Send it and wait"
  zh: "发过去，等着"
- en: "You send the agreement with a friendly note. The auto-reply says reviews take \"four to six weeks\"."
  zh: "你附上一段友好的话，把协议发了过去。自动回复说审核需要“四到六周”。"
- en: "Use the university's template"
  zh: "用学校的模板"
- en: "Their lawyers know the template by heart, and it's approved in a week. Someone clearly did this before you."
  zh: "对方律师对这份模板烂熟于心，一周就批了。显然有人在你之前走过这条路。"
- en: "They have 14 comments on the template, numbered and lettered. Some have sub-letters."
  zh: "他们对模板提了 14 条意见，有编号还有字母序号。有些下面还有子序号。"
- en: "Start on public data meanwhile"
  zh: "先用公开数据开工"
- en: "You begin on a public dataset while the agreement crawls along. At least something is moving."
  zh: "协议慢慢爬着的时候，你先用公开数据集做了起来。至少有件事在往前走。"
- en: "Tracked Changes"
  zh: "修订模式"
- en: "The agreement comes back with {roll:20-40} tracked changes. Most turn \"shall\" into \"will\". One, on page 9, gives the hospital the rights to your thesis."
  zh: "协议退回来时带着 {roll:20-40} 处修订。大部分是把“应当”改成“须”。第 9 页有一处，把你博士论文的权利给了医院。"
- en: "Strike that one, accept the rest"
  zh: "删掉那条，其余接受"
- en: "On a short, polite call, they agree the thesis clause was \"just the template\". It's signed by Friday."
  zh: "一通简短客气的电话后，对方承认那条论文条款“只是模板自带的”。周五前就签了。"
- en: "They counter your counter. A meeting is scheduled to plan the meeting about it."
  zh: "对方对你的修改又提了修改。双方约了一个会，用来筹备讨论这件事的会。"
- en: "Let the lawyers talk to the lawyers"
  zh: "让律师跟律师谈"
- en: "The university's lawyers take over. You're cc'd on everything and understand none of it. A month later, it's signed."
  zh: "学校的律师接手了。每封邮件都抄送你，你一封也看不懂。一个月后，签了。"
- en: "Ask your clinical partner to push"
  zh: "请临床合作伙伴推一把"
- en: "Clinical partner"
  zh: "临床合作伙伴"
- en: "One call from the head of their department, and the agreement is signed by Friday. You send a thank-you card."
  zh: "对方科室主任一个电话，协议周五前就签了。你寄了一张感谢卡。"
- en: "Round Three"
  zh: "第三轮"
- en: "Round three of the data-sharing agreement. You now know what \"indemnification\" means, and you wish you didn't."
  zh: "数据共享协议进入第三轮。你现在知道“免责补偿条款”是什么意思了，真希望自己不知道。"
- en: "Sign their version, carefully"
  zh: "仔细读完再签对方版本"
- en: "You read it twice, and your thesis is still yours. One more week for signatures, and it's done."
  zh: "你读了两遍，确认论文还归你。再等一周签字，就搞定了。"
- en: "Drop the hospital data"
  zh: "放弃医院数据"
- en: "You switch to public clinical notes. They're less realistic and come with no paperwork at all."
  zh: "你改用公开的临床病历。没那么真实，但一张手续都不用办。"
- en: "The Last Gift Card"
  zh: "最后一张礼品卡"
- en: "Participant 14 signs for the last gift card. You need 28. The budget assumed $25 cards; you've been handing out $50."
  zh: "第 14 位参与者签收了最后一张礼品卡。你需要 28 位。预算按每张 25 美元算的，你一直在发 50 美元的。"
- en: "Ask {advisor} for more"
  zh: "找 {advisor}再要点钱"
- en: "Your advisor sighs, finds the money and asks you to check the next budget twice."
  zh: "导师叹了口气，找来了钱，并让你下次做预算时检查两遍。"
- en: "\"We'll have to stop at 14.\" Your study just became a lot more qualitative."
  zh: "“只能停在 14 位了。”你的研究一下子变得定性多了。"
- en: "Apply for a small department grant"
  zh: "申请系里的小额经费"
- en: "You write two pages and a budget table. It's approved in three weeks, and you finally learn how budgets work."
  zh: "你写了两页申请和一张预算表。三周后批了，你也终于搞懂了预算是怎么回事。"
- en: "Halve the cards for the rest"
  zh: "剩下的礼品卡减半"
- en: "Recruiting slows a little. A reviewer may ask why half your participants got less."
  zh: "招募慢了一点。可能会有审稿人问，为什么一半参与者拿得少。"
- en: "Pay No Attention"
  zh: "别管幕后的人"
- en: "It's a Wizard-of-Oz study, so the \"AI\" is you, typing from the next room for six sessions back to back. Participant 3 asks the AI if it's tired."
  zh: "这是一项绿野仙踪（Wizard-of-Oz）研究，所以“AI”其实是你，在隔壁房间连轴打字，连做六场。第 3 位参与者问 AI 累不累。"
- en: "Type fast and stay in character"
  zh: "飞速打字，保持人设"
- en: "By session six you type like a language model and feel like one. The data is great."
  zh: "到第六场，你打字像个语言模型，感觉也像。数据很棒。"
- en: "Script canned replies"
  zh: "提前写好模板回复"
- en: "Fifty prepared answers cover most questions. When they don't, the AI gets oddly vague."
  zh: "五十条预备回答能覆盖大部分问题。覆盖不到的时候，AI 就变得出奇地含糊。"
- en: "Take shifts with {labmate}"
  zh: "和 {labmate} 轮班"
- en: "You take three sessions each. One participant says the AI's personality changed halfway, which it did."
  zh: "你们一人三场。有位参与者说 AI 的性格中途变了，确实变了。"
- en: "{labmate} has a deadline. You type all six sessions yourself, a little resentfully."
  zh: "{labmate} 要赶截稿。六场你全自己打了，心里有点怨气。"
- en: "412 Sticky Notes"
  zh: "412 张便利贴"
- en: "Your participatory design workshop produced 412 sticky notes, and every one needs a theme. One just says \"lunch?\"."
  zh: "你的参与式设计工作坊产出了 412 张便利贴，每一张都得归入主题。有一张只写着“午饭？”。"
- en: "Affinity-map them on the lab wall"
  zh: "在实验室墙上做亲和图"
- en: "You spend a weekend on a stepladder. The wall looks like a detective's corkboard, and the themes are excellent."
  zh: "你在梯子上站了一个周末。墙面看起来像侦探的线索板，主题提炼得非常好。"
- en: "Photograph and code them on screen"
  zh: "拍照后在电脑上编码"
- en: "On screen the notes are searchable and somehow less inspiring. The themes come out tidy and a little flat."
  zh: "在屏幕上，便利贴能搜索了，却莫名少了点灵感。主题整整齐齐，就是有点平。"
- en: "Ask the participants to vote on themes"
  zh: "请参与者投票选主题"
- en: "Eight participants come back and sort the notes with you. Their themes beat yours."
  zh: "八位参与者回来和你一起整理便利贴。他们的主题比你的好。"
- en: "Two participants come back. They mostly vote for \"lunch?\"."
  zh: "只回来了两位参与者。他们基本都投给了“午饭？”。"
- en: "That's Not What I Meant"
  zh: "我不是这个意思"
- en: "You share your findings with a participant, as promised. They reply within the hour: \"That's not what I meant. At all.\" Your favorite theme is built on their quote."
  zh: "你按约定把研究发现分享给一位参与者。对方一小时内就回复了：“我不是这个意思。完全不是。”而你最喜欢的那个主题，正是建立在这句引语上的。"
- en: "Revise the theme"
  zh: "修改主题"
- en: "After two days of rereading transcripts, the new theme is less striking and much more accurate."
  zh: "重读了两天转录稿，新主题没那么抢眼，但准确多了。"
- en: "Add their correction as a quote"
  zh: "把对方的更正作为引语加进去"
- en: "Their reply goes into the paper next to your reading, and a reviewer praises the paper as \"reflexive\"."
  zh: "对方的回复和你的解读并排写进了论文，有位审稿人称赞这篇论文很有“反思性”。"
- en: "Explain your reading to them"
  zh: "向对方解释你的解读"
- en: "After a call, they agree: \"Okay, I did kind of mean that.\""
  zh: "通了个电话后，对方认了：“好吧，我确实有点那个意思。”"
- en: "The call ends with each of you more sure you're right."
  zh: "电话挂断时，你们俩都更确信自己是对的了。"
- en: "The Pager Saga"
  zh: "寻呼机传奇"
- en: "Twenty minutes in, your interviewee starts telling the story of the clinic's old pager system. It has villains and a twist, and it's nowhere on your interview guide."
  zh: "访谈进行到二十分钟，受访者开始讲诊所旧寻呼机系统的故事。有反派，有反转，就是不在你的访谈提纲上。"
- en: "Let them talk"
  zh: "让对方讲"
- en: "They talk about pagers for forty minutes, and somewhere in there is the best quote about workarounds you've ever heard."
  zh: "对方讲了四十分钟寻呼机，其中藏着你听过的关于变通办法的最佳引语。"
- en: "Steer back, politely"
  zh: "礼貌地拉回正题"
- en: "\"That's fascinating, and does it connect to...\" It does. You finish the guide on time."
  zh: "“太有意思了，那这和……有关系吗？”还真有。你按时问完了提纲。"
- en: "You steer back. They steer to the fax machine."
  zh: "你把话题拉回来。对方又把话题拐到了传真机上。"
- en: "Book a follow-up for the story"
  zh: "另约时间听完这个故事"
- en: "The extra hour next week costs you an afternoon and gets you a friend in the clinic."
  zh: "下周多出的一小时花了你一个下午，换来一位诊所里的朋友。"
- en: "0 Bytes"
  zh: "0 字节"
- en: "You open the screen recording of your best session, the one where everything clicked: 0 seconds, 0 bytes. The audio is fine."
  zh: "你打开最精彩那场的录屏，就是一切都很顺的那场：0 秒，0 字节。音频倒是好好的。"
- en: "Rebuild it from your notes"
  zh: "根据笔记还原"
- en: "You spend an evening stitching the audio and your notes together. It's mostly right, you think."
  zh: "你花了一晚上把音频和笔记拼在一起。应该大致没错吧，你想。"
- en: "Ask the participant for a follow-up"
  zh: "请参与者再做一次"
- en: "They're happy to do it again, and even sharper the second time."
  zh: "对方很乐意再来一次，第二次反应还更敏锐。"
- en: "They're away for a month. You make do with the audio."
  zh: "对方要出门一个月。你只能凑合用音频。"
- en: "Drop the session"
  zh: "舍弃这一场"
- en: "Your best session becomes one sentence in Limitations. It's the rigorous choice, and it stings a little."
  zh: "你最精彩的一场，成了局限性里的一句话。这是严谨的选择，就是有点心疼。"
- en: "Can You Tell?"
  zh: "看得出来吗？"
- en: "The manipulation check is in: participants can't tell the AI condition from the no-AI condition. Half think both had AI. A few think neither did."
  zh: "操纵检验结果出来了：参与者分不清有 AI 和无 AI 两个条件。一半人觉得两个都有 AI，还有几个人觉得两个都没有。"
- en: "Redesign the conditions"
  zh: "重新设计实验条件"
- en: "After a new pilot and another round of sessions, the study tests what it says it does."
  zh: "又做了一次预实验和一轮实验之后，研究终于测到了它声称要测的东西。"
- en: "Reframe it as a finding"
  zh: "重新包装成发现"
- en: "You rewrite the framing around a new finding: people can't tell when AI is helping."
  zh: "你围绕一个新发现重写了框架：人们察觉不到 AI 什么时候在帮忙。"
- en: "Reviewers will see a failed manipulation, and so do you. The reframe doesn't hold."
  zh: "审稿人会看到一次失败的实验操纵，你自己也看到了。重新包装站不住。"
- en: "Make the AI more visible"
  zh: "让 AI 更显眼"
- en: "You add a sparkle icon and the word \"AI\" in bold. Now everyone notices, and some notice too much."
  zh: "你加了个闪光图标，还把“AI”两个字母加粗。现在人人都注意到了，有些人注意得过了头。"
- en: "Too Clever"
  zh: "聪明过头"
- en: "You pilot your survey on {advisor}. Your attention check is so clever that {advisor} fails it, then argues for ten minutes that it was ambiguous."
  zh: "你拿 {advisor}做问卷预实验。你的注意力检查题设计得太巧妙，{advisor}没通过，还争了十分钟说题目有歧义。"
- en: "Simplify it"
  zh: "简化一下"
- en: "\"Select 'Strongly agree' for this item.\" It isn't clever, and your advisor passes it."
  zh: "“本题请选择‘非常同意’。”一点都不巧妙，导师通过了。"
- en: "Keep it and call it rigor"
  zh: "保留，就说是严谨"
- en: "Rigor! It filters out bots and, apparently, professors. Your advisor will remember this."
  zh: "严谨！它能筛掉机器人，看来还能筛掉教授。导师会记住这件事的。"
- en: "Add a second, easier one"
  zh: "再加一道简单的"
- en: "Two checks: one for bots, one for humans. The survey grows by a page."
  zh: "两道检查题：一道给机器人，一道给人类。问卷多了一页。"
- en: "Basically 24"
  zh: "约等于 24"
- en: "Your counterbalanced design needs 24 participants, one for each order. You have 23. Participant 24 cancelled this morning, very apologetically."
  zh: "你的顺序平衡设计需要 24 位参与者，每种顺序一位。你现在有 23 位。第 24 位今天早上取消了，非常抱歉的样子。"
- en: "Recruit one more"
  zh: "再招一位"
- en: "One more flyer and one more week get you participant 24. The design is balanced again."
  zh: "多贴一张传单，多等一周，你招到了第 24 位。设计又平衡了。"
- en: "Report the unbalanced order"
  zh: "如实报告顺序不平衡"
- en: "You admit it in one sentence in the method section. A reviewer will count, but you counted first."
  zh: "你在方法部分用一句话承认了这一点。审稿人肯定会数，但你先数了。"
- en: "Ask {advisor} if 23 is basically 24"
  zh: "问 {advisor}能否把 23 当成 24"
- en: "Your advisor laughs, then helps you rerun the analysis with order as a factor, and the result holds."
  zh: "导师笑了，然后帮你把顺序作为一个因素重新跑了分析，结果依然成立。"
- en: "\"Is it?\" asks your advisor, and waits. You go and find participant 24."
  zh: "“能吗？”导师反问，然后等着。你乖乖去找第 24 位参与者了。"
- en: "Soup of the Day"
  zh: "今日例汤"
- en: "Mid-session, your study chatbot answers a clinician's question about discharge notes with a recipe for lentil soup. The clinician reads it carefully. \"This actually looks good.\""
  zh: "实验进行到一半，一位医生问你的研究聊天机器人关于出院小结的问题，它回了一份扁豆汤食谱。医生认真读完：“看着还真不错。”"
- en: "Log it and move on"
  zh: "记下来，继续"
- en: "A line in your notes: \"14:32, soup.\" The session goes on. Afterward, the clinician asks for the recipe."
  zh: "你在笔记里写了一行：“14:32，汤。”实验继续。结束后，医生向你要了那份食谱。"
- en: "Pause and fix the prompt"
  zh: "暂停，修 prompt"
- en: "Ten minutes of frantic prompt editing while the participant waits. No more soup, for now."
  zh: "参与者在一旁等着，你手忙脚乱改了十分钟 prompt。暂时不会再有汤了。"
- en: "Make off-task replies a finding"
  zh: "把跑题回复变成发现"
- en: "You find 11 more off-topic replies in the logs, enough for a section on trust."
  zh: "你在日志里又找到 11 条跑题回复，够写一节关于信任的内容了。"
- en: "It's one soup. A finding needs more than one soup."
  zh: "就一碗汤。一个发现需要不止一碗汤。"
- en: "Thirty Seconds"
  zh: "三十秒"
- en: "The clinicians like your tool, with one condition: it has to work in the 30 seconds between patients. Right now, logging in takes 40."
  zh: "医生们喜欢你的工具，但有个条件：必须能在两个病人之间的 30 秒里用完。现在光登录就要 40 秒。"
- en: "Redesign for 30 seconds"
  zh: "按 30 秒重新设计"
- en: "You cut every screen you can. What's left fits in 30 seconds, with a few to spare."
  zh: "能砍的界面你都砍了。剩下的 30 秒内就能走完，还留了几秒余量。"
- en: "Time how long it really takes"
  zh: "实测到底要多久"
- en: "You spend a day in the clinic with a stopwatch. The real gap is 22 seconds, and now you know where they go."
  zh: "你拿着秒表在诊所待了一天。真正的空档只有 22 秒，现在你知道这些秒都花在哪了。"
- en: "Argue for a different moment"
  zh: "争取换个使用时机"
- en: "You propose a review at the end of the shift instead. They think it over and agree it's better."
  zh: "你提议改在下班前统一查看。他们想了想，同意这样更好。"
- en: "\"There is no other moment,\" they say, kindly."
  zh: "“没有别的时机了。”他们和气地说。"
- en: "Button, Button, Button"
  zh: "按钮，按钮，按钮"
- en: "A quick accessibility check before the study: the screen reader announces all 23 buttons in your prototype as \"button\"."
  zh: "研究开始前做了个快速无障碍检查：读屏软件把你原型里全部 23 个按钮都念成了“按钮”。"
- en: "Fix it all before the study"
  zh: "研究前全部修好"
- en: "You fix labels, focus order and contrast. It takes a week, and the prototype is better for everyone."
  zh: "你修好了标签、焦点顺序和对比度。花了一周，原型对每个人都更好用了。"
- en: "Fix the worst three issues"
  zh: "修最严重的三个问题"
- en: "The main flow works now. The settings page remains a mystery, read aloud."
  zh: "主流程现在没问题了。设置页依然是个谜，一个被大声念出来的谜。"
- en: "Note it as a limitation"
  zh: "写成局限性"
- en: "It gets one sentence in Limitations, which is accurate and a little uncomfortable to type."
  zh: "它在局限性里占了一句话，写得准确，打字时却有点不自在。"
- en: "Eleven Implications"
  zh: "十一条启示"
- en: "Your discussion section lists 11 design implications. {advisor} reads it and leaves one comment: \"Three. Readers remember three.\""
  zh: "你的讨论部分列了 11 条设计启示。{advisor}读完只留了一条批注：“三条。读者只记得住三条。”"
- en: "Keep the three strongest"
  zh: "只留最强的三条"
- en: "Eight implications move to a file called later.md. The section is short and sharp."
  zh: "八条启示挪进了一个叫 later.md 的文件。这一节短小精悍。"
- en: "Group them into three themes"
  zh: "归成三个主题"
- en: "All eleven ideas fit under three themes. Your advisor replies: \"Yes.\""
  zh: "十一个想法全都归进了三个主题。导师回复：“对。”"
- en: "The three themes are called \"Design\", \"More design\" and \"Other\"."
  zh: "三个主题分别叫“设计”“更多设计”和“其他”。"
- en: "Fight for five"
  zh: "力争保留五条"
- en: "Five, with one sentence each. Your advisor agrees that five is also a number."
  zh: "五条，每条一句话。导师同意五也是个数字。"
- en: "You leave the meeting with three, and a comment about \"focus\"."
  zh: "你带着三条离开了会议，外加一句关于“聚焦”的点评。"
- en: "98% Agreement"
  zh: "98% 的一致率"
- en: "You switched on model-suggested labels to speed up annotation. It worked: your annotators accept the suggestion {roll:96-99}% of the time, including the wrong ones."
  zh: "为了加快标注，你打开了模型预标注建议。确实快了：标注员 {roll:96-99}% 的时候都直接采纳建议，连错的也照单全收。"
- en: "Add a no-suggestion condition"
  zh: "加一组无建议的对照"
- en: "Half the annotators label without help. It's slower, but now you can measure how much the suggestions steer them."
  zh: "一半标注员不看建议直接标。慢是慢了，但现在你能量化建议对他们的引导有多大了。"
- en: "Make it a paper of its own"
  zh: "单独写成一篇论文"
- en: "It's a whole second paper about annotators trusting the model. You add it to the list, happily."
  zh: "关于标注员信任模型，这足够再写一整篇论文。你高高兴兴地把它加进了清单。"
- en: "Someone wrote that paper last year, and it's good, which somehow makes it worse."
  zh: "去年已经有人写了这篇论文，还写得很好，这不知为何更让人难受。"
- en: "Hide suggestions until they choose"
  zh: "标完之前隐藏建议"
- en: "Annotators label first, then see the model's guess. Speed drops, and so does the copying."
  zh: "标注员先自己标，再看模型的猜测。速度降了，照抄也少了。"
- en: "[NAME] Will Return in [NAME]"
  zh: "[NAME] 将于 [NAME] 复诊"
- en: "Your de-identification tool removes every name from the clinical notes, along with every \"May\", \"Will\" and \"Hope\". \"Pt will return in May\" now reads \"Pt [NAME] return in [NAME]\"."
  zh: "你的脱敏工具删掉了临床笔记里的所有人名，顺带把每个“May”“Will”和“Hope”也删了。“Pt will return in May”现在成了“Pt [NAME] return in [NAME]”。"
- en: "Patch it with rules"
  zh: "用规则打补丁"
- en: "Forty rules later, May is a month again and will is a verb. The real names still go."
  zh: "写了四十条规则后，May 又是月份了，will 又是动词了。真正的人名照删不误。"
- en: "Your rules fix \"May\" and miss a real name. You catch it in review, and start over, more carefully."
  zh: "你的规则救回了“May”，却漏掉了一个真名。你在检查时发现了，更小心地从头再来。"
- en: "Try another tool"
  zh: "换个工具试试"
- en: "The second tool is careful with months, and also removes every number."
  zh: "第二个工具对月份很小心，但把所有数字都删了。"
- en: "Write up what de-identification breaks"
  zh: "写写脱敏会搞坏什么"
- en: "A short workshop paper on [NAME] and other casualties. Clinical NLP people love it."
  zh: "一篇关于 [NAME] 和其他受害者的 workshop 短文。临床 NLP 圈的人都很爱看。"
- en: "pt"
  zh: "pt 是啥"
- en: "In your clinical notes, \"pt\" means patient, physical therapy, part-time and, once, \"pint\". Your model reads every one of them as patient."
  zh: "在你的临床笔记里，“pt”可以是病人、物理治疗、兼职，还有一次是“品脱”。你的模型一律读成了病人。"
- en: "Build an abbreviation list with clinicians"
  zh: "和医生一起整理缩写表"
- en: "Two clinicians sort 300 abbreviations in an afternoon and seem to enjoy it."
  zh: "两位医生一个下午就整理了 300 个缩写，看起来还挺享受。"
- en: "They agree on 60% of them. Clinicians, it turns out, also guess."
  zh: "他们只在 60% 的缩写上达成一致。原来医生也是靠猜的。"
- en: "Let the model guess"
  zh: "让模型自己猜"
- en: "It guesses right most of the time. When it's wrong, it's confidently wrong."
  zh: "大部分时候猜对了。猜错的时候，错得理直气壮。"
- en: "Make it an evaluation slice"
  zh: "做成一个评测子集"
- en: "A new table: accuracy on ambiguous abbreviations. Your model's weak spot is now a contribution."
  zh: "新增一张表：歧义缩写上的准确率。你模型的弱点现在成了一项贡献。"
- en: "Lost in Evaluation"
  zh: "迷失在评测里"
- en: "Your multilingual evaluation includes {roll:200-300} outputs in a language nobody in the lab reads. The automatic score says they're fine. You have no way to know."
  zh: "你的多语言评测里有 {roll:200-300} 条输出，用的是实验室里没人看得懂的语言。自动指标说没问题。你根本无从判断。"
- en: "Recruit a native speaker"
  zh: "找个母语者"
- en: "A student from another department checks them for pizza. 30% are fluent nonsense."
  zh: "外系的一位同学看在披萨的份上帮你检查了。30% 是流畅的胡话。"
- en: "Use back-translation"
  zh: "用回译"
- en: "Back in English, they look fine. Back-translation is very forgiving."
  zh: "翻回英文后，看着都挺好。回译是很宽容的。"
- en: "Read them yourself"
  zh: "自己读"
- en: "Polyglot"
  zh: "语言达人"
- en: "You read them over coffee. Most are fine, two are excellent, and one is a recipe."
  zh: "你边喝咖啡边读完了。大部分没问题，两条非常出色，还有一条是食谱。"
- en: "Certainly!"
  zh: "当然可以！"
- en: "Output 300 of 500. You notice you've started your emails with \"Certainly!\" and ended one with \"I hope this helps!\" It was to {advisor}."
  zh: "第 300 条输出，共 500 条。你发现自己写邮件开始用“当然可以！”开头，还有一封以“希望这对你有帮助！”结尾。那封是发给 {advisor}的。"
- en: "Take a break"
  zh: "休息一下"
- en: "You take a walk and eat a sandwich, an hour away from all text. You come back sounding human."
  zh: "你出去散步、吃了个三明治，离开所有文字一个小时。回来时说话又像人了。"
- en: "Sort the errors into categories"
  zh: "给错误分类"
- en: "Seven error types fit in one chart, and your analysis section gets much better. Output 301 is easier to read."
  zh: "七种错误类型放进一张图，你的分析部分好了很多。第 301 条读起来也轻松了。"
- en: "Finish all 500 today"
  zh: "今天把 500 条全看完"
- en: "Done by midnight. You dream in bullet points. Certainly!"
  zh: "午夜前搞定。你做梦都是分点列表。当然可以！"
- en: "A Paper That Doesn't Exist"
  zh: "一篇不存在的论文"
- en: "Your model cites a paper that doesn't exist and credits it to {advisor}. The title sounds exactly like something {advisor} would write. You check twice."
  zh: "你的模型引用了一篇不存在的论文，作者写的是 {advisor}。标题听起来完全就是 {advisor}会写的。你查了两遍。"
- en: "Add a citation check to your evaluation"
  zh: "在评测里加引用核查"
- en: "Every reference now gets checked against a real database, and 14% turn out to be invented."
  zh: "现在每条参考文献都会和真实数据库比对，结果 14% 是编出来的。"
- en: "Show {advisor}"
  zh: "拿给 {advisor}看"
- en: "Your advisor laughs, then asks, \"Should I write it?\" You're not sure they're joking."
  zh: "导师笑了，然后问：“要不我写一篇？”你不确定这是不是玩笑。"
- en: "Your advisor frowns: \"That's not even my area.\" Somehow that's the part that bothers them."
  zh: "导师皱起眉头：“这根本不是我的方向。”不知为何，让导师在意的偏偏是这一点。"
- en: "Put it on a slide"
  zh: "放进幻灯片"
- en: "Your next lab-meeting talk opens with the fake paper. Everyone laughs, then three people check their own models."
  zh: "下次组会报告，你用这篇假论文开场。大家都笑了，然后有三个人去检查了自己的模型。"
- en: "Temperature Zero"
  zh: "温度为零"
- en: "You run the same prompt three times at temperature zero and get three different answers. Temperature zero, it turns out, is more of a mood."
  zh: "温度设为零，同一个 prompt 跑三次，得到三个不同的答案。原来温度为零只是一种态度。"
- en: "Run it five times, report the spread"
  zh: "跑五次，报告方差"
- en: "You report a mean and standard deviation over five runs. It costs five times as much, and it's honest."
  zh: "你报告了五次运行的均值和标准差。花了五倍的钱，但很诚实。"
- en: "Switch to a local model"
  zh: "换成本地模型"
- en: "Same input, same output, every time. You didn't know you'd missed that so much."
  zh: "同样的输入，每次都是同样的输出。你都不知道自己有多怀念这种感觉。"
- en: "The local model is perfectly consistent, and consistently worse. You switch back."
  zh: "本地模型非常稳定，稳定地更差。你又换了回去。"
- en: "Fix the seed and hope"
  zh: "固定种子，祈祷"
- en: "There is no seed setting. You add one to your config anyway, for morale."
  zh: "根本没有种子这个设置。你还是在配置里加了一项，图个心安。"
- en: "Retry, Retry, Retry"
  zh: "重试，重试，再重试"
- en: "You wake up to an email from billing. At 1 am your retry loop hit a rate limit, and retried, and retried. The lab's API budget for the month is gone."
  zh: "一觉醒来，你收到一封账单邮件。凌晨 1 点，你的重试循环撞上了速率限制，然后重试，再重试。实验室这个月的 API 预算没了。"
- en: "Tell {advisor} right away"
  zh: "马上告诉 {advisor}"
- en: "\"Thanks for telling me first. It happens.\" Your advisor moves some money around."
  zh: "“谢谢你第一时间告诉我。这种事难免。”导师挪了点经费过来。"
- en: "A long pause, then: \"Please write up what happened.\" You do, in great detail."
  zh: "长时间的沉默，然后：“请把经过写下来。”你写了，非常详细。"
- en: "Develop on a smaller model"
  zh: "换小模型做开发"
- en: "Development moves to a tiny model that costs almost nothing. This month's results are rougher."
  zh: "开发换到了一个几乎不花钱的小模型上。这个月的结果粗糙了些。"
- en: "Write a budget guard"
  zh: "写个预算保护"
- en: "You add a hard spending cap, an alert and a test for the retry loop. Nobody in the lab can do this again."
  zh: "你加了硬性消费上限、告警，还给重试循环写了测试。实验室里再也没人能犯这个错了。"
- en: "End of Life"
  zh: "停止服务"
- en: "{biglab} announces that the model your paper evaluates will be retired next month. Soon, nobody will be able to reproduce a single number in it."
  zh: "{biglab} 宣布，你论文里评测的那个模型下个月就要下线。很快，论文里没有一个数字能被复现了。"
- en: "Rerun everything on its replacement"
  zh: "在替代模型上全部重跑"
- en: "A week of reruns shows the new model is better on average and worse on your examples, which is interesting."
  zh: "重跑了一周，发现新模型平均更好，但在你的样例上更差，这倒挺有意思。"
- en: "Release your saved outputs"
  zh: "公开你存下的输出"
- en: "You archive and release every prompt and response, so anyone can check your work after the model is gone."
  zh: "你把每条 prompt 和回复都存档公开了，模型下线后任何人也能核查你的工作。"
- en: "Switch to an open model"
  zh: "换成开源模型"
- en: "Open weights never change, so your results will reproduce long after you graduate."
  zh: "开源权重永远不变，所以你毕业很久以后，结果也还能复现。"
- en: "The open model needs more GPUs than your lab owns. You fall back to saving your outputs."
  zh: "开源模型需要的 GPU 比你们实验室的还多。你退而求其次，把输出存了下来。"
- en: "Graphic Content"
  zh: "内容令人不适"
- en: "The model refuses to summarize a clinical note about a sprained ankle, citing \"graphic content\". It refuses {roll:40-70} other notes too, mostly about knees."
  zh: "模型拒绝总结一份关于脚踝扭伤的临床笔记，理由是“含有令人不适的内容”。它还拒绝了另外 {roll:40-70} 份，大多是关于膝盖的。"
- en: "Reword the prompt"
  zh: "改写 prompt"
- en: "\"You are a helpful clinical assistant.\" It works for the ankle. The knees remain controversial."
  zh: "“你是一个乐于助人的临床助手。”脚踝过关了。膝盖仍有争议。"
- en: "Use an open model"
  zh: "用开源模型"
- en: "The open model never refuses and makes more mistakes. You trade one problem for a more measurable one."
  zh: "开源模型从不拒绝，但错误更多。你用一个问题换来了另一个更好衡量的问题。"
- en: "Count refusals as a result"
  zh: "把拒答算作结果"
- en: "You make a table of refusal rates by body part. It's absurd, and everyone screenshots it."
  zh: "你做了一张按身体部位统计的拒答率表。荒诞至极，人人都截了图。"
- en: "Refusal rates are already a well-known table. Yours is one more row."
  zh: "拒答率早就是一张人尽皆知的表了。你的只是多了一行。"
- en: "40 Regular Expressions"
  zh: "40 个正则表达式"
- en: "The model returns broken JSON {roll:2-4}% of the time. Your parser now has 40 regular expressions, and one of them is just a long sigh."
  zh: "模型有 {roll:2-4}% 的时候返回格式错误的 JSON。你的解析器现在有 40 个正则表达式，其中一个只是一声长叹。"
- en: "Use constrained decoding"
  zh: "用约束解码"
- en: "Valid JSON every time. You delete 40 regular expressions in one glorious commit."
  zh: "每次都是合法的 JSON。你在一次光荣的 commit 里删掉了 40 个正则表达式。"
- en: "Constrained decoding works, slowly. Your evaluation now takes three days."
  zh: "约束解码管用，就是慢。你的评测现在要跑三天。"
- en: "Retry until it's valid"
  zh: "重试到合法为止"
- en: "Every bad output gets another try. It works, and the API bill grows a little every night."
  zh: "每个坏输出都再试一次。管用，只是 API 账单每晚都涨一点。"
- en: "Count failures as errors"
  zh: "把失败算作错误"
- en: "Broken JSON counts as wrong. Your scores drop a point, and nobody can say you hid anything."
  zh: "坏掉的 JSON 一律算错。你的分数掉了一个点，但没人能说你藏了什么。"
- en: "Shorter, Please"
  zh: "请再短一点"
- en: "Your human raters prefer the baseline. You read their comments: \"shorter\", \"shorter\", \"got to the point\", \"shorter\"."
  zh: "人工评分员更喜欢 baseline。你读了他们的评语：“更短”“更短”“直奔主题”“更短”。"
- en: "Control for length"
  zh: "控制长度变量"
- en: "With length-matched pairs and a second round of ratings, your system wins, by a little, fairly."
  zh: "用长度匹配的样本对重新评了一轮，你的系统赢了，赢得不多，但很公平。"
- en: "Report it as a finding"
  zh: "当作发现来报告"
- en: "\"Raters prefer brevity\" isn't new, but your data shows exactly how much."
  zh: "“评分员偏爱简短”不是新发现，但你的数据精确展示了偏爱到什么程度。"
- en: "Shorten your system's answers"
  zh: "缩短系统的回答"
- en: "Your system now says the same thing in half the words. The raters love it."
  zh: "你的系统现在用一半的字说同样的事。评分员非常喜欢。"
- en: "Shorter, and now it leaves out the important part. The raters still prefer the baseline."
  zh: "是短了，可现在把重要的部分也省掉了。评分员还是更喜欢 baseline。"
- en: "Cell 212"
  zh: "第 212 格"
- en: "Your best result came from a notebook with 400 cells, run out of order over three weeks. Cell 212 depends on cell 388. You don't remember why."
  zh: "你最好的结果来自一个有 400 个单元格的 notebook，三周里乱序运行。第 212 格依赖第 388 格。你不记得为什么了。"
- en: "Rewrite it as a clean script"
  zh: "重写成干净的脚本"
- en: "After a day of untangling, the script runs top to bottom, and the result holds, minus half a point."
  zh: "理了一整天，脚本终于能从头跑到尾，结果也还在，只少了半个点。"
- en: "Rerun it top to bottom and hope"
  zh: "从头跑一遍，祈祷"
- en: "It runs and gives the same number. You vow never to touch that notebook again."
  zh: "跑通了，数字一样。你发誓再也不碰那个 notebook。"
- en: "Cell 17 throws an error that cell 388 was hiding. The best result is gone."
  zh: "第 17 格报了一个一直被第 388 格掩盖的错误。最好的结果没了。"
- en: "Report the result you can reproduce"
  zh: "报告能复现的结果"
- en: "The number you can reproduce is two points lower. It goes in the paper, and you stop worrying about cell 212."
  zh: "能复现的数字低了两个点。它写进了论文，你也不用再为第 212 格提心吊胆了。"
- en: "4 GB"
  zh: "整整 4 GB"
- en: "You accidentally commit a 4 GB model checkpoint to the lab repo. Every labmate's next pull takes an hour. The lab chat has noticed."
  zh: "你不小心把一个 4 GB 的模型 checkpoint 提交到了实验室的仓库。每个同门下次 pull 都要一小时。实验室群已经注意到了。"
- en: "Rewrite the history"
  zh: "改写提交历史"
- en: "One careful force-push removes the checkpoint from history without losing anyone's work. The lab chat calls you a legend."
  zh: "一次小心翼翼的 force-push，把 checkpoint 从历史里抹掉了，谁的工作都没丢。实验室群称你为传奇。"
- en: "The rewrite works, and also eats {labmate}'s last two commits. They're recoverable, eventually."
  zh: "改写成功了，顺带吃掉了 {labmate} 最近的两个 commit。最终还是能找回来的。"
- en: "Apologize in the lab chat, with donuts"
  zh: "在群里道歉，再送甜甜圈"
- en: "A dozen donuts and a sincere message. The pull still takes an hour, but now it comes with donuts."
  zh: "一打甜甜圈，外加一条真诚的消息。pull 一次还是要一小时，但现在有甜甜圈陪着。"
- en: "Ask {senior} for help"
  zh: "找 {senior} 帮忙"
- en: "{senior} fixes it in four minutes and admits the same thing happened to them in their first year."
  zh: "{senior} 四分钟就修好了，还坦白自己一年级时也干过同样的事。"
- en: "{senior} fixes it, then tells the story at every lab meeting for a month."
  zh: "{senior} 修好了，然后一个月里每次组会都要讲一遍这件事。"
