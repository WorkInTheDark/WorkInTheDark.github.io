# zh translations for titles (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "The Bubble Tea Magnate"
  zh: "奶茶大亨"
- en: "Peer-reviewed and pearl-reviewed."
  zh: "论文过了同行评审，奶茶过了珍珠评审。"
- en: "The Breakout"
  zh: "出圈学者"
- en: "A thousand citations. People cite you without reading you now."
  zh: "引用破千。现在别人引你，已经不用读你了。"
- en: "The Prolific"
  zh: "高产选手"
- en: "Seven or more first-author papers."
  zh: "七篇及以上一作论文。"
- en: "Citation Machine"
  zh: "引用收割机"
- en: "An h-index most postdocs would envy."
  zh: "h 指数高到大多数博士后都眼红。"
- en: "The Burnt-Out Genius"
  zh: "燃尽的天才"
- en: "Plenty of citations, and more than one burnout along the way."
  zh: "引用不少，一路上也倦怠了不止一次。"
- en: "The Survivor"
  zh: "打不死的小强"
- en: "Burned out three times and came back every time."
  zh: "倦怠了三次，每次都爬了回来。"
- en: "Reviewer 2's Nemesis"
  zh: "2 号审稿人的克星"
- en: "Rejected again and again, and published anyway."
  zh: "屡投屡拒，屡拒屡投，最后还是发了。"
- en: "The Top-Tier Regular"
  zh: "顶会常客"
- en: "Four or more top-venue papers."
  zh: "四篇及以上顶会论文。"
- en: "Desk Reject Legend"
  zh: "直接拒稿传奇"
- en: "Formatting is a skill, too."
  zh: "排版也是一门手艺。"
- en: "The Speedrunner"
  zh: "速通玩家"
- en: "Done in four years or less."
  zh: "四年以内搞定。"
- en: "The Long Way Round"
  zh: "绕远路的人"
- en: "Seven years or more, by the scenic route."
  zh: "七年或更久，一路看风景。"
- en: "Work-Life Balance Champion"
  zh: "工作生活平衡大师"
- en: "Graduated without burning out or living in the lab."
  zh: "毕业了，既没倦怠，也没住在实验室。"
- en: "The Unbreakable"
  zh: "金刚不坏"
- en: "Your Stress never went above 65."
  zh: "你的压力从没超过 65。"
- en: "The Night Shift"
  zh: "实验室夜班"
- en: "A hundred and twenty weekend days in the lab."
  zh: "在实验室过了 120 天周末。"
- en: "The Globetrotter"
  zh: "空中飞人"
- en: "Six conferences or more."
  zh: "参加过六次及以上会议。"
- en: "The Networker"
  zh: "人脉王"
- en: "Everyone knows you, even people you've never met."
  zh: "人人都认识你，包括你从没见过的人。"
- en: "The Lab Parent"
  zh: "组里的大家长"
- en: "You raised the lab's junior students."
  zh: "组里的师弟师妹都是你带大的。"
- en: "The Workshop Warrior"
  zh: "workshop 斗士"
- en: "Three workshop papers, and good conversations in small rooms."
  zh: "三篇 workshop 论文，外加小会议室里的许多好聊天。"
- en: "The Reader"
  zh: "读书人"
- en: "You read everything, including the appendices."
  zh: "你什么都读，连附录也不放过。"
- en: "The Social Glue"
  zh: "组里的黏合剂"
- en: "The lab's events don't happen without you."
  zh: "没有你，组里的活动就办不起来。"
- en: "Slow Is Smooth"
  zh: "慢工出细活"
- en: "You skipped two deadlines to do it right."
  zh: "为了做对，你放弃了两次截稿。"
- en: "The Lone Wolf"
  zh: "独狼"
- en: "You and your laptop against the world."
  zh: "你和你的笔记本，对抗全世界。"
- en: "The Gym Scholar"
  zh: "健身房学者"
- en: "Strong arguments, stronger deadlifts."
  zh: "论证很硬，硬拉更硬。"
- en: "The Serial Intern"
  zh: "实习专业户"
- en: "Three summers at three companies."
  zh: "三个暑假，三家公司。"
- en: "The Explorer"
  zh: "探索者"
- en: "You found out what you don't want, which is a useful start."
  zh: "你搞清楚了自己不想要什么，这是个不错的开始。"
- en: "The Steady Hand"
  zh: "稳扎稳打"
- en: "Solid work with no drama, and a degree you earned."
  zh: "工作扎实，没什么波折，学位是你自己挣来的。"
