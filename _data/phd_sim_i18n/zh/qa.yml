# zh translations for qa (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Tell us about the classic paper on your list that everyone cites and nobody reads. What did it actually claim?"
  zh: "说说你阅读清单上那篇人人都引、没人真读过的经典论文。它到底讲了什么？"
- en: "Why does self-attention get so expensive on long inputs, and what do people do about it?"
  zh: "输入一长，自注意力的开销为什么就那么大？大家一般怎么解决？"
- en: "What do word-overlap metrics like BLEU actually measure, and when do they disagree with people?"
  zh: "BLEU 这类词重叠指标到底在衡量什么？什么时候会和人工评价对不上？"
- en: "Can you average Likert responses and run a t-test on them? Defend your answer."
  zh: "李克特量表的数据能直接取平均做 t 检验吗？说说理由。"
- en: "When would you choose a within-subjects design over a between-subjects one?"
  zh: "什么情况下你会选被试内设计，而不是被试间设计？"
- en: "Explain subword tokenization. What goes wrong for languages it wasn't built for?"
  zh: "解释一下子词切分。遇到设计时没考虑到的语言，会出什么问题？"
- en: "Your annotators reach a kappa of 0.4. Is that good? Who gets to decide?"
  zh: "标注员之间的 kappa 是 0.4。这算好吗？谁说了算？"
- en: "If the whole field tunes on the same benchmark for five years, what are we actually measuring?"
  zh: "如果整个领域五年都在同一个基准上调参，我们到底在衡量什么？"
- en: "Your reading list is almost all NLP. What do you know about how HCI evaluates systems?"
  zh: "你的阅读清单几乎全是 NLP。那 HCI 是怎么评估系统的，你了解多少？"
- en: "What can a think-aloud study tell you that a usage log cannot?"
  zh: "出声思考研究能告诉你哪些使用日志看不出来的东西？"
- en: "Ten years from now, which part of today's NLP will look naive?"
  zh: "十年后回头看，今天 NLP 的哪部分会显得很天真？"
- en: "Does a model that predicts the next word understand anything? Yes or no."
  zh: "一个预测下一个词的模型，真的理解了什么吗？只能回答是或否。"
- en: "Explain how models are tuned with human preference feedback, and one way it can go wrong."
  zh: "解释一下怎么用人类偏好反馈来调模型，再说一种可能出问题的情况。"
- en: "What exactly does a p-value of 0.04 tell you? And what doesn't it tell you?"
  zh: "p 值等于 0.04，到底说明了什么？又说明不了什么？"
- en: "Name two ways the wording of a survey question can bias the answer."
  zh: "问卷题目的措辞会怎样带偏回答？举两个例子。"
- en: "Which paper on your reading list do you disagree with most, and why?"
  zh: "阅读清单上你最不认同哪篇论文？为什么？"
- en: "You've read 80 papers. Which open problem in them do you think nobody is working on?"
  zh: "你读了 80 篇论文，你觉得里面哪个开放问题还没人在做？"
- en: "Why is this a PhD and not a product?"
  zh: "为什么这是博士课题，而不是一个产品？"
- en: "State your research question in one sentence. Now say it again without the word \"LLM\"."
  zh: "用一句话说出你的研究问题。现在再说一遍，不许用“LLM”这个词。"
- en: "Who exactly benefits if this works, and have you asked them?"
  zh: "如果这个做成了，到底谁会受益？你问过他们吗？"
- en: "This looks like three PhDs. Which part would you cut?"
  zh: "这工作量够读三个博士了。你打算砍掉哪部分？"
- en: "Your timeline assumes IRB approval in four weeks. What happens if it takes twelve?"
  zh: "你的时间安排默认伦理审查 (IRB) 4 周就能批下来。要是拖到 12 周呢？"
- en: "Twelve clinicians. How do you know that's enough?"
  zh: "12 位临床医生，你怎么确定这就够了？"
- en: "What's the strongest baseline you are not planning to compare against?"
  zh: "你没打算比较的 baseline 里，最强的是哪个？"
- en: "If next year's model solves your task zero-shot, what is left of this thesis?"
  zh: "如果明年的模型零样本就能解决你的任务，这篇博士论文还剩下什么？"
- en: "How do your three studies connect? Draw it for us."
  zh: "你的三项研究是怎么串起来的？画给我们看。"
- en: "How will you know your system helps people, beyond scoring well on a benchmark?"
  zh: "除了在基准上分数好看，你怎么知道你的系统真的帮到了人？"
- en: "Does this scale?"
  zh: "这能规模化吗？"
- en: "What could go wrong for a participant in your study, and how will you prevent it?"
  zh: "你的研究可能给参与者带来什么风险？你打算怎么预防？"
- en: "Last year there were a dozen papers on LLM explanations for clinicians. How is yours different?"
  zh: "去年光是给临床医生做 LLM 解释的论文就有十几篇。你的创新点在哪？"
- en: "Your plan depends on hospital data you don't have yet. What's plan B?"
  zh: "你的计划要靠还没拿到的医院数据。B 计划是什么？"
- en: "What is the theoretical contribution here, beyond \"we built it and people liked it\"?"
  zh: "除了“我们做了个东西，大家觉得不错”，这里的理论贡献是什么？"
- en: "Who annotates your data, and how will you know they agree for the right reasons?"
  zh: "谁来标注你的数据？他们意见一致，你怎么确定是出于对的理由？"
- en: "In one sentence: what does the field know now that it didn't before your thesis?"
  zh: "一句话：有了你的论文，这个领域多知道了什么？"
- en: "If you started your PhD again today, what would you do differently?"
  zh: "如果今天让你从头再读一次博，你会做哪些不一样的选择？"
- en: "What is the biggest limitation of your thesis that no reviewer caught?"
  zh: "你的论文最大的局限是什么？审稿人都没发现的那种。"
- en: "All your studies were in one hospital system. Why should anyone believe this generalizes?"
  zh: "你所有的研究都是在同一个医院系统里做的。凭什么让人相信结论能推广？"
- en: "In Chapter 3 you ran 14 tests on 20 participants. Did you correct for multiple comparisons?"
  zh: "第 3 章你在 20 位参与者身上做了 14 次检验。做多重比较校正了吗？"
- en: "Chapter 2 says users want more explanation. Chapter 4 says they ignored it. Which is it?"
  zh: "第 2 章说用户想要更多解释，第 4 章说他们根本没看。到底哪个对？"
- en: "You used an LLM to grade your outputs. Who graded the grader?"
  zh: "你用 LLM 给输出打分。那谁来给这个评委打分？"
- en: "Walk us through how your annotation guidelines changed between version 1 and the final version."
  zh: "带我们过一遍：你的标注指南从第 1 版到最终版是怎么变的？"
- en: "Could you explain Figure 5 again? Slowly, this time."
  zh: "能再解释一遍图 5 吗？这次慢一点。"
- en: "What is the first paper someone should write after reading your thesis?"
  zh: "读完你的论文，别人接下来该写的第一篇论文是什么？"
- en: "Which result surprised you most, and did you believe it at first?"
  zh: "哪个结果最让你意外？你一开始信了吗？"
- en: "Could a new student reproduce your main result from the code you released?"
  zh: "一个新生能用你公开的代码复现主要结果吗？"
- en: "Your title says \"trustworthy\". Did you measure trust, or did you ask people whether they trusted it?"
  zh: "你的标题里写着“可信”。你是真的测量了信任，还是只问了大家信不信？"
- en: "Your main results use a model behind an API that has changed since. Are your numbers still valid?"
  zh: "你的主要结果依赖一个 API 模型，可它后来已经更新了。这些数字还作数吗？"
- en: "Is this an NLP thesis or an HCI thesis? Pick one."
  zh: "这是 NLP 论文还是 HCI 论文？选一个。"
- en: "What will your lab be working on five years from now?"
  zh: "五年后你的实验室会在做什么？"
- en: "Who would fund this work, and what is your first grant proposal about?"
  zh: "谁会资助这项研究？你的第一份基金申请打算写什么？"
- en: "What course would you teach here that we don't already offer?"
  zh: "如果来我们这儿，你会开一门什么新课？"
- en: "Industry labs have a thousand times your compute. Why do this research at a university?"
  zh: "工业界实验室的算力是你的一千倍。为什么还要在高校做这个研究？"
- en: "How is your research agenda different from your advisor's?"
  zh: "你的研究方向和导师的有什么不同？"
- en: "Who in this department would you collaborate with first, and on what?"
  zh: "来了以后，你会先找系里哪位老师合作？做什么？"
- en: "How would you mentor a student who wants to work on something you don't know well?"
  zh: "如果学生想做你不太熟悉的方向，你会怎么带？"
- en: "Most of your citations come from one paper. What is your second act?"
  zh: "你的引用大部分来自同一篇论文。下一篇代表作在哪？"
- en: "Has anyone actually used your system outside a study?"
  zh: "研究之外，真有人用过你的系统吗？"
- en: "How would you evaluate an AI feature before it ships to millions of users?"
  zh: "一个 AI 功能上线给几百万用户之前，你会怎么评估它？"
- en: "Your topic is hot right now. What happens to your agenda when it cools down?"
  zh: "你的方向现在很火。等风口过了，你的研究规划怎么办？"
- en: "Why do you want to be here, specifically?"
  zh: "说具体点，你为什么想来我们这儿？"
- en: "Your system is mostly prompts. What is the engineering contribution?"
  zh: "你的系统主要是一堆 prompt。工程贡献在哪？"
- en: "If we made you an offer and so did a big tech company, which would you take? Be honest."
  zh: "如果我们给你 offer，大厂也给了，你选哪个？说实话。"
- en: "Tell us about a time a class you taught went badly. What did you change?"
  zh: "讲讲你哪次上课上砸了，后来改了什么？"
- en: "asks about statistics"
  zh: "专问统计"
- en: "the industry external member who asks about scalability"
  zh: "来自业界的外部委员，专问能不能规模化"
- en: "always 20 minutes late"
  zh: "永远迟到 20 分钟"
- en: "secretly your biggest fan"
  zh: "其实是你的隐藏铁粉"
- en: "the theory person"
  zh: "搞理论的那位"
- en: "the clinician collaborator"
  zh: "合作的临床医生"
- en: "asks how you coded your interviews"
  zh: "专问你访谈是怎么编码的"
- en: "remembers when all of this was n-grams"
  zh: "经历过 n-gram 时代的老前辈"
- en: "plays devil's advocate on purpose"
  zh: "故意唱反调"
- en: "has read every paper you cite, and one you didn't"
  zh: "读过你引的每一篇，外加一篇你没引的"
- en: "silent for an hour, then asks the hardest question"
  zh: "沉默一小时，一开口就是最难的问题"
- en: "asks what it all means"
  zh: "总问“这有什么意义”"
