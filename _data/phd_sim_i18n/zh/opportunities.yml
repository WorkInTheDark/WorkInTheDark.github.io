# zh translations for opportunities (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Go home for the holidays"
  zh: "回家过节"
- en: "The holidays are here. Everyone else is leaving campus."
  zh: "假期到了，大家纷纷离校。"
- en: "You eat home cooking and see old friends. Only one relative asks about your h-index."
  zh: "你吃上了家里的饭，见了老朋友。七大姑八大姨里，只有一位问了你的 h 指数。"
- en: "Take the winter break off"
  zh: "寒假彻底歇着"
- en: "Winter break. The lab is empty and the inbox is quiet."
  zh: "寒假到了。实验室空荡荡，收件箱也安静了。"
- en: "You take a real break and start the new year with a clear head."
  zh: "你实打实地歇了一回，满血迎接新的一年。"
- en: "Celebrate Lunar New Year"
  zh: "过春节"
- en: "Lunar New Year is here, and the family group chat is busy."
  zh: "春节到了，家族群里的红包和拜年表情刷了屏。"
- en: "You eat too many dumplings and call everyone back home."
  zh: "你饺子吃撑了，还挨个给家里人打电话拜了年。"
- en: "Take a spring break trip"
  zh: "春假出去玩"
- en: "Spring break. Friends are planning a trip somewhere warm."
  zh: "春假到了。朋友们在计划去个暖和的地方。"
- en: "You spend a week in the sun without reading a single paper."
  zh: "你在阳光下待了一周，一篇论文都没读。"
- en: "Take a real vacation"
  zh: "好好度个假"
- en: "It's summer, and you haven't taken more than a weekend off in a long time."
  zh: "夏天到了，你已经很久没休过超过一个周末的假了。"
- en: "Two weeks without a laptop. It feels strange for two days, then wonderful."
  zh: "两周不碰电脑。前两天浑身不自在，之后爽到飞起。"
- en: "Go to a summer school"
  zh: "参加暑期学校"
- en: "A summer school on human-centered NLP has a spot for you."
  zh: "一个以人为中心的 NLP 暑期学校给你留了个名额。"
- en: "You hear lectures from people whose papers you've read and join a group chat that lasts for years."
  zh: "你听到了好多“论文里的名字”本人讲课，还进了一个一聊好几年的群。"
- en: "Join a hackathon"
  zh: "参加黑客马拉松"
- en: "A week-long hackathon on AI for health is looking for teammates."
  zh: "一场为期一周的 AI 医疗黑客马拉松在招队友。"
- en: "You barely sleep for a week. The demo works, and three teammates want to keep going."
  zh: "你一周几乎没睡。demo 跑通了，三个队友还想接着做下去。"
- en: "Join the writing retreat for “{project}”"
  zh: "带“{project}”去闭关写作"
- en: "The department's writing retreat has a seat open, in a quiet room with no meetings."
  zh: "系里的闭关写作营还有个空位，房间安静，没有任何会议。"
- en: "Five quiet days later, the draft has grown more than it did all month."
  zh: "安静地写了五天，初稿的进度超过了之前一整个月。"
- en: "Run everything on the empty GPU cluster"
  zh: "把实验全扔上空闲的 GPU 集群"
- en: "Everyone else is at a conference. The GPU cluster is completely empty."
  zh: "别人都去开会了，集群上的卡全空着。"
- en: "With no queue, you run a month of experiments in a week."
  zh: "不用排队，你一周跑完了一个月的实验。"
- en: "Run study sessions while the clinic has openings"
  zh: "趁诊所有空档集中做研究"
- en: "The clinic suddenly has two weeks of open slots for your study."
  zh: "诊所突然空出了两周的时段，可以做你的研究。"
- en: "You run back-to-back sessions, and the clinicians all show up."
  zh: "你一场接一场地做，临床医生们全都到场了。"
- en: "Work side by side with your advisor"
  zh: "和导师并肩干活"
- en: "Your advisor's calendar is unexpectedly free for the next two weeks."
  zh: "导师接下来两周的日程居然是空的。"
- en: "You spend two weeks at the whiteboard with your advisor and learn how they think."
  zh: "你和导师在白板前待了两周，摸清了导师的思考方式。"
- en: "Visit a collaborator's lab for two weeks"
  zh: "去合作者的实验室访问两周"
- en: "A collaborator invites you to spend two weeks in their lab."
  zh: "一位合作者邀请你去对方的实验室待两周。"
- en: "Their lab does things differently, and they spot problems you had stopped seeing."
  zh: "那边的人做法不一样，一眼就看出了你早已视而不见的问题。"
- en: "Help {labmate} make their deadline"
  zh: "帮 {labmate} 赶截稿"
- en: "{labmate} has a deadline Friday and is drowning."
  zh: "{labmate} 周五截稿，已经焦头烂额。"
- en: "You fix the plots and rewrite the related work. They promise to return the favor."
  zh: "你修好了图，重写了相关工作。对方说以后一定还你这个人情。"
- en: "Take an undergrad under your wing"
  zh: "带一个本科生"
- en: "An eager undergrad wants to do research and your advisor suggests you."
  zh: "一个热情的本科生想做科研，导师推荐了你。"
- en: "You spend two weeks setting them up, and explaining your work helps you understand it better."
  zh: "你花了两周带对方上手，给别人讲自己的工作，反倒让你理解得更透了。"
- en: "Prepare for the career fair"
  zh: "备战招聘会"
- en: "The fall career fair is next week. Recruiters from big labs will be there."
  zh: "秋招招聘会下周开。大厂实验室的招聘官都会来。"
- en: "You polish your CV and pitch, and come home with a tote bag of stickers."
  zh: "你打磨了简历和自我介绍，最后拎回一帆布袋周边贴纸。"
- en: "Give an invited talk at another university"
  zh: "去外校做特邀报告"
- en: "A professor who read your paper invites you to give a talk."
  zh: "一位读过你论文的教授邀请你去做报告。"
- en: "Your talk goes well, and the hard questions come from people who actually read the paper."
  zh: "报告很顺利，刁钻的问题都来自真正读过论文的人。"
- en: "Run a reading sprint with the lab"
  zh: "和组里来一场读论文冲刺"
- en: "The lab wants to read the ten most important papers of the year, together, over the next two weeks."
  zh: "组里想在接下来两周一起读完今年最重要的十篇论文。"
- en: "Ten papers and five arguments later, the lab roughly agrees on where the field is going."
  zh: "十篇论文、五次争论之后，组里对领域的走向大致达成了共识。"
- en: "Teach the next two weeks of lectures"
  zh: "代讲接下来两周的课"
- en: "The professor you TA for is traveling and asks you to teach."
  zh: "你当助教的那门课，教授要出差，请你代课。"
- en: "You give three lectures, and your slides improve each time."
  zh: "你讲了三次课，PPT 一次比一次好。"
- en: "Host prospective students at visit day"
  zh: "在开放日接待来访学生"
- en: "Visit day is coming. Your advisor asks you to show prospective students around."
  zh: "开放日快到了。导师让你带来访的申请者们四处转转。"
- en: "You hear yourself giving the advice you needed in your first year."
  zh: "你听见自己说出了一年级时最需要听到的建议。"
- en: "Take two quiet weeks"
  zh: "安安静静歇两周"
- en: "You've been running on empty. Your advisor tells you to take some time."
  zh: "你一直在硬撑。导师让你歇一阵子。"
- en: "Nothing urgent turns out to be urgent. You come back steadier."
  zh: "事实证明，所有急事都没那么急。你回来时状态稳多了。"
- en: "Join the thesis-writing bootcamp"
  zh: "参加博士论文写作营"
- en: "The graduate school runs a week-long thesis bootcamp."
  zh: "研究生院办了个为期一周的论文写作营。"
- en: "You write eight hours a day next to people doing the same. By Friday you have a chapter."
  zh: "你和一群论文搭子并排坐着，每天写八小时。到周五，你写完了一章。"
