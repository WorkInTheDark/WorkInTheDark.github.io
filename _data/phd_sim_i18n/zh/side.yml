# zh translations for side (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Hit the gym three times"
  zh: "去健身房打卡三次"
- en: "Your body will thank you, eventually."
  zh: "身体总有一天会感谢你的。"
- en: "Sore on Tuesday, smug on Thursday."
  zh: "周二浑身酸痛，周四开始发朋友圈。"
- en: "Join {labmate}'s Saturday run club"
  zh: "加入 {labmate} 的周六跑团"
- en: "Five kilometers, then pastries."
  zh: "先跑五公里，再吃点心。"
- en: "You finish last and nobody minds. The pastries are excellent."
  zh: "你跑了个倒数第一，也没人在意。点心是真的好吃。"
- en: "Try the free yoga class at the rec center"
  zh: "去体育馆试试免费瑜伽课"
- en: "Your shoulders have been up by your ears since September."
  zh: "从九月开始，你的肩膀就一直耸到耳朵边。"
- en: "You can't touch your toes. You can, however, unclench your jaw."
  zh: "你还是摸不到脚尖，不过咬紧的牙关总算松开了。"
- en: "Finally see a doctor about that cough"
  zh: "终于去医院看咳嗽"
- en: "It's been three weeks, and your labmates have noticed."
  zh: "已经咳了三周，连同门都注意到了。"
- en: "The doctor prescribes rest and says \"you should sleep more\" like it's easy."
  zh: "医生让你好好休息，轻飘飘来了句“要多睡觉”，说得跟很容易似的。"
- en: "Cook real food on Sunday"
  zh: "周日正经做顿饭"
- en: "Five lunches that aren't vending machine crackers."
  zh: "五顿不靠外卖的午饭。"
- en: "You make five containers of lentil soup. By Thursday you never want to see a lentil again."
  zh: "你做了五盒咖喱鸡。到周四，你这辈子都不想再看见咖喱了。"
- en: "Walk to campus instead of taking the shuttle"
  zh: "不坐校车，走路去学校"
- en: "Forty minutes each way, and a podcast."
  zh: "单程四十分钟，配一档播客。"
- en: "You know every crack in the sidewalk now. So do your legs."
  zh: "人行道上每条裂缝你都认识了，你的腿也是。"
- en: "Swim laps at the campus pool"
  zh: "去学校泳池游几圈"
- en: "The building is from the seventies. The water is fine."
  zh: "楼是七十年代的，水倒是没问题。"
- en: "Twenty laps, then the hot tub with three retired professors who want to hear about your thesis."
  zh: "游完二十圈，泡热水池时碰上三位退休教授，非要听你讲讲博士论文。"
- en: "Badminton with {labmate} after dinner"
  zh: "晚饭后和 {labmate} 打羽毛球"
- en: "Loser buys the bubble tea."
  zh: "输的人请奶茶。"
- en: "You lose. The bubble tea is worth it."
  zh: "你输了。不过这杯奶茶值。"
- en: "Try a beginner dance class"
  zh: "去上一节零基础舞蹈课"
- en: "Nobody there knows you write papers."
  zh: "那里没人知道你是写论文的。"
- en: "You're the worst dancer in the room and the happiest one."
  zh: "你是全场跳得最差的，也是笑得最开心的。"
- en: "Stretch every hour, on a timer"
  zh: "定个闹钟，每小时拉伸一次"
- en: "Your neck has been at that angle since 2 pm."
  zh: "你的脖子从下午两点起就保持着这个角度。"
- en: "The timer goes off in a meeting. You stretch anyway, and two people join in."
  zh: "开会时闹钟响了。你照样拉伸，还有两个人跟着一起。"
- en: "Cut down to one coffee a day"
  zh: "咖啡减到一天一杯"
- en: "Just to see what happens."
  zh: "就当做个实验。"
- en: "Day three is a headache. By day ten you sleep like a child."
  zh: "第三天头疼欲裂。到了第十天，你睡得像个孩子。"
- en: "Go to bed before midnight, every night"
  zh: "每晚十二点前上床"
- en: "A radical experiment."
  zh: "一项激进的实验。"
- en: "It works. You're annoyed by how well it works."
  zh: "居然真管用，管用到让你有点不爽。"
- en: "Take Friday afternoon off"
  zh: "周五下午翘个班"
- en: "The paper will still be there on Monday."
  zh: "论文周一还在那儿，跑不了。"
- en: "You take a long walk, then a longer nap."
  zh: "你散了很久的步，又睡了更久的午觉。"
- en: "Board game night at {labmate}'s place"
  zh: "去 {labmate} 家玩桌游"
- en: "Someone always brings a game with forty pages of rules."
  zh: "总有人带来一款规则书四十页厚的游戏。"
- en: "Nobody understands the rules by the end. Everyone has a great time."
  zh: "到最后也没人搞懂规则，但大家都玩得很开心。"
- en: "Dinner with friends from outside the lab"
  zh: "约组外的朋友吃饭"
- en: "People who don't know what a p-value is."
  zh: "一群不知道 p 值是什么的人。"
- en: "Nobody asks about your paper. It's the best two hours of the month."
  zh: "没人问你论文的事，这是这个月最快乐的两个小时。"
- en: "Call home for an hour"
  zh: "给家里打一小时电话"
- en: "They miss you."
  zh: "家里人想你了。"
- en: "You hear all about the neighbor's dog and your cousin's wedding, and for an hour you forget about the lab."
  zh: "你听完了邻居家狗狗的近况和亲戚家的婚礼八卦，整整一个小时没想起实验室。"
- en: "Go on a day hike"
  zh: "去徒步一天"
- en: "You haven't seen a tree up close since August."
  zh: "你从八月起就没近距离看过一棵树了。"
- en: "You spend six hours outside with no signal and one very good sandwich."
  zh: "你在户外待了六个小时，没有信号，只有一个超好吃的三明治。"
- en: "The trails are open again."
  zh: "步道又开放了。"
- en: "See a concert downtown"
  zh: "去市中心听演唱会"
- en: "Loud music, no slides."
  zh: "音乐够响，没有 PPT。"
- en: "Your ears ring all Sunday, and you don't think about your paper once."
  zh: "耳朵嗡嗡响了一整个周日，但你一次都没想起论文。"
- en: "Two evenings with your old hobby"
  zh: "花两个晚上重拾旧爱好"
- en: "The one you had before you had a research agenda."
  zh: "就是你有“研究方向”之前的那个。"
- en: "You're rusty, and it doesn't matter at all."
  zh: "手生了，不过一点也不要紧。"
- en: "Get coffee with the visiting speaker"
  zh: "和来访讲者喝杯咖啡"
- en: "You had a question, and the Q&A ran out of time."
  zh: "你本来有个问题，可问答环节没时间了。"
- en: "Over coffee, they ask a sharp question about {project} you hadn't thought of."
  zh: "喝咖啡时，对方就 {project} 问了个犀利的问题，你之前完全没想到。"
- en: "Go to the department reading group"
  zh: "去系里的读书会"
- en: "Free pizza and someone else's paper."
  zh: "免费披萨，外加别人的论文。"
- en: "The discussion is better than the paper, and it gives you an idea for {project}."
  zh: "讨论比论文本身精彩，还让你对 {project} 有了个新想法。"
- en: "Help {labmate} debug their training run"
  zh: "帮 {labmate} 调训练的 bug"
- en: "\"It's probably a quick fix.\""
  zh: "“应该很快就能修好。”"
- en: "It's a learning rate. It's always a learning rate. They owe you one."
  zh: "是学习率。永远都是学习率。对方欠你一个人情。"
- en: "Show a visiting friend around town"
  zh: "陪来玩的朋友逛逛"
- en: "An old friend from undergrad is in town for the weekend."
  zh: "本科时的一个老朋友周末来你这儿玩。"
- en: "You show them around and find out you know more good restaurants than you thought."
  zh: "你带朋友四处转了转，发现自己私藏的好馆子比想象中多。"
- en: "Host your parents for a weekend"
  zh: "接爸妈来住一个周末"
- en: "They want to see \"where you work\"."
  zh: "爸妈想看看“你上班的地方”。"
- en: "They take a photo of you next to your desk and send it to the whole family."
  zh: "爸妈给你和工位拍了张合影，发到了家族群里。"
- en: "Sign up for the department step challenge"
  zh: "报名系里的步数挑战赛"
- en: "The staff team has won three years running."
  zh: "行政老师队已经三连冠了。"
- en: "You take the stairs every day and still lose to the staff team, but your legs feel great."
  zh: "你天天爬楼梯，还是输给了行政老师队。不过腿脚倒是利索多了。"
- en: "Drop in on a workshop in the next city"
  zh: "去邻市蹭个 workshop"
- en: "Free student registration, one train ride away."
  zh: "学生免费注册，坐趟高铁就到。"
- en: "The conversations run long, and you come home with new ideas for {project}."
  zh: "大家聊得停不下来，你带着关于 {project} 的新想法回了家。"
- en: "Bike to campus instead of taking the bus"
  zh: "改骑车去学校，不坐公交"
- en: "The weather is good, and the bus is always late anyway."
  zh: "天气不错，反正公交也总晚点。"
- en: "Twenty minutes each way. You arrive awake for once."
  zh: "单程二十分钟，你难得清醒着到了学校。"
- en: "Go to the dentist appointment you've moved three times"
  zh: "去看改了三次期的牙医"
- en: "They've stopped sending reminders and started sending worried emails."
  zh: "诊所已经不发提醒，改发担心你的邮件了。"
- en: "You get one small filling and a lecture about grinding your teeth when stressed."
  zh: "你补了个小牙洞，还听医生念叨了半天压力大会磨牙。"
