# zh translations for epilogues (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "You and your partner still argue about whose thesis acknowledgments were sweeter."
  zh: "你和另一半至今还在争，谁的博士论文致谢写得更甜。"
- en: "Your cat still sleeps on the keyboard. Some of your best emails were typed by paw."
  zh: "猫主子还是爱睡在键盘上。你写得最好的几封邮件，有的是它用爪子打的。"
- en: "You kept exercising, and your back still works."
  zh: "你一直坚持锻炼，腰到现在还好使。"
- en: "You pulled too many all-nighters in grad school. Now you go to bed at ten."
  zh: "读博时通宵熬得太多，现在你十点就上床，养生得很。"
- en: "Your friends from grad school are still your closest friends."
  zh: "读博时一起熬过来的那帮人，至今还是你最铁的朋友。"
- en: "Your family framed your diploma before you did."
  zh: "你还没来得及裱，家里人就先把你的学位证书裱起来了。"
- en: "You and your advisor still meet for coffee when you're in town."
  zh: "每次回到那座城市，你还会约导师喝杯咖啡。"
- en: "You buy bubble tea for your own team when they come in person, just like your advisor did."
  zh: "团队来线下开会时，你会给大家买奶茶，就像当年导师对你们那样。"
- en: "You notice orphan words everywhere now, even on wedding invitations."
  zh: "现在你走到哪都能看见独占一行的单词，连婚礼请柬都不放过。"
- en: "Your first first-author paper is still the one you're proudest of."
  zh: "你的第一篇一作论文，至今仍是你最骄傲的一篇。"
- en: "You keep a folder of every rejection. It's thicker than your CV."
  zh: "你把每封拒信都存在一个文件夹里，攒得比简历还厚。"
- en: "Somewhere, a first-year is reading your paper in reading group and loving it."
  zh: "此刻在某个地方，有个博一学生正在读书会上读你的论文，读得津津有味。"
- en: "You saw more of the world through conferences than in the rest of your life combined."
  zh: "你靠开会看到的世界，比这辈子其他时候加起来还多。"
- en: "You still play music on weekends, and you're better at it than ever."
  zh: "你周末还在玩音乐，水平比以前任何时候都高。"
- en: "The clinicians you worked with still send you interesting problems."
  zh: "合作过的临床医生至今还会给你发来有意思的问题。"
- en: "You mentor a few students informally. You tell them to close the laptop sometimes."
  zh: "你私下带着几个学生，常提醒他们：时不时也要合上电脑。"
- en: "You learned to say no, which was the hardest skill the PhD taught you."
  zh: "你学会了说“不”，这是读博教会你最难的一课。"
- en: "Your first mentee has mentees of their own now. They still send you their drafts."
  zh: "你带的第一个学弟学妹，如今也带起了自己的学生，但还是会把草稿发给你看。"
- en: "The labmate who almost quit defended two years later. Your name is in their acknowledgments."
  zh: "那个差点退学的同门，两年后顺利答辩了。致谢里有你的名字。"
- en: "The labmate who left the PhD runs a team now. They still try to hire you every spring."
  zh: "那个退学的同门现在带着一个团队，每年春天都还想把你挖过去。"
- en: "You and the student from the rival lab still run that workshop every year."
  zh: "你和对家实验室的那位学生，每年还一起办那个 workshop。"
- en: "You and the lab across the country still don't cite each other. Everyone else cites you both."
  zh: "你们和对家实验室至今互不引用。其他人倒是两家都引。"
- en: "Somewhere, someone is trying to beat your first paper's baseline. It's become a rite of passage."
  zh: "此刻某个地方，正有人想打败你第一篇论文的基线。这已经成了一种入门仪式。"
- en: "Your first paper's code repository has more stars than the paper has citations."
  zh: "你第一篇论文的代码仓库，星标比论文的引用还多。"
- en: "The grant you helped write funded the next three students. One of them sits at your old desk."
  zh: "你帮忙写的那份基金养活了后面三届学生。其中一位就坐在你原来的座位上。"
- en: "Your parents keep your thesis on the living room shelf. Nobody has read past the acknowledgments, which is the part about them."
  zh: "爸妈把你的博士论文摆在客厅书架上。没人读到致谢后面，毕竟致谢写的是他们。"
- en: "The weekend app still runs. A few thousand people use it and have no idea it was built on Saturdays."
  zh: "那个周末做的应用还在运行。几千个用户，没人知道它是一个个周六攒出来的。"
- en: "You review papers the way you wish yours had been reviewed. It all started with a font size."
  zh: "你审稿时，总用自己希望被审的方式。这一切都始于一个字号。"
- en: "You once told Reviewer 2 their font was too small. You stand by it."
  zh: "你曾告诉 2 号审稿人，对方的字号太小了。你至今觉得自己没说错。"
- en: "You and your partner picked a city together. The commute is ten minutes, and you still complain about it."
  zh: "你和对象一起选了一座城市。通勤十分钟，你还是天天抱怨。"
- en: "Your phone still shows two time zones. Next spring it'll be down to one."
  zh: "你的手机上还显示着两个时区。明年春天，就只剩一个了。"
