# zh translations for advisors (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "Famous but Absent"
  zh: "常年不在的大牛"
- en: "A big name in the field, usually somewhere else."
  zh: "领域大牛，人通常在别处。"
- en: "Micromanager"
  zh: "事无巨细型"
- en: "Checks every detail, down to your commit messages."
  zh: "连你的 commit message 都要检查。"
- en: "Hungry Assistant Prof"
  zh: "拼命的助理教授"
- en: "New to the job and hungry for papers."
  zh: "刚上任，求文若渴。"
- en: "Kind but Unfunded"
  zh: "人好但没钱"
- en: "Fights for their students on almost no budget."
  zh: "几乎没有经费，却一直在为学生争取。"
- en: "Grant Machine"
  zh: "基金收割机"
- en: "Never short of funding, or of grant reports to write."
  zh: "从不缺经费，也从不缺要写的基金报告。"
- en: "The Visionary"
  zh: "梦想家"
- en: "Big ideas, and a new one every week."
  zh: "想法很大，而且每周都有新的。"
- en: "Industry Joint"
  zh: "校企双聘"
- en: "Half professor, half tech company."
  zh: "一半是教授，一半是科技公司。"
- en: "Near Retirement"
  zh: "临近退休"
- en: "A legend of the field, counting down to retirement."
  zh: "领域传奇，正在倒数退休。"
- en: "Serial Founder"
  zh: "连续创业者"
- en: "Three startups, and nobody is sure which one is real."
  zh: "开了三家创业公司，没人确定哪家是真的。"
- en: "Methods Purist"
  zh: "方法洁癖"
- en: "No result survives without ten seeds and a significance test."
  zh: "没跑十个随机种子、没做显著性检验的结果，一律不算数。"
- en: "Kind and Funded"
  zh: "人好又有钱"
- en: "Kind and well funded, with no patience for borderline work."
  zh: "人好，经费足，但对勉强过线的工作没有耐心。"
- en: "Meticulous about layout and visual detail: orphan words, consistent capitalization, figure fonts."
  zh: "对排版和视觉细节一丝不苟：独占一行的单词、大小写统一、图中字体。"
- en: "Always finds the major flaw, and asks the hard but critical question."
  zh: "总能找出重大缺陷，并提出难回答但关键的问题。"
- en: "Replies at strange hours, midnight included, always adding \"no need to reply until Monday\"."
  zh: "常在奇怪的时间回复，包括半夜，而且总会加一句“周一前不用回复”。"
- en: "Buys bubble tea for everyone who comes to lab meeting in person."
  zh: "给每位到场参加组会的人买奶茶。"
- en: "Replies to email at 3 am."
  zh: "凌晨 3 点回邮件。"
- en: "Loves Gantt charts."
  zh: "热爱甘特图。"
- en: "Always wants \"just one more experiment\"."
  zh: "总想“再加一个实验就好”。"
- en: "Draws everything on a whiteboard."
  zh: "什么都要在白板上画出来。"
- en: "Forgets meetings, then remembers them better than you do."
  zh: "会忘了开会，事后却比你记得还清楚。"
- en: "Sends papers with no message, only the PDF."
  zh: "发论文从不附言，只有一个 PDF。"
- en: "Writes \"great!!\" on everything and means it 40% of the time."
  zh: "什么都批“很好！！”，其中 40% 是真心的。"
- en: "Insists on tables over figures."
  zh: "坚持用表格，不用图。"
- en: "Only meets while walking."
  zh: "只在散步时开会。"
- en: "Seems to know every reviewer personally."
  zh: "好像跟每一位审稿人都认识。"
- en: "Has a favorite font and enforces it."
  zh: "有一款钟爱的字体，并强制推行。"
- en: "Plays devil's advocate even when agreeing with you."
  zh: "就算同意你，也要唱唱反调。"
- en: "Answers questions with questions."
  zh: "用问题回答问题。"
- en: "Remembers every student's birthday."
  zh: "记得每个学生的生日。"
- en: "Brings snacks to lab meeting."
  zh: "开组会时会带零食。"
- en: "Says \"let's write a grant about it\" about everything."
  zh: "什么事都能说成“这个可以申个基金”。"
- en: "Keeps a list of every idea anyone has ever had in lab meeting."
  zh: "记着组会上每个人提过的每一个想法。"
- en: "Takes calls from the car, always slightly out of signal."
  zh: "总在车里接电话，信号永远差一点。"
- en: "Prefers a 2-hour meeting to a 2-line email."
  zh: "宁可开 2 小时的会，也不发 2 行的邮件。"
- en: "Has strong opinions about the Oxford comma."
  zh: "对牛津逗号有坚定立场。"
- en: "Quotes papers from the 1990s from memory."
  zh: "能凭记忆引用 90 年代的论文。"
- en: "Reads drafts on paper, with a red pen."
  zh: "把稿子打印出来，用红笔改。"
- en: "Schedules meetings in 25-minute blocks."
  zh: "按 25 分钟一格排会。"
- en: "Responds to long emails with a single emoji."
  zh: "用一个表情回复长邮件。"
- en: "Keeps a plant in the lab that nobody else may water."
  zh: "在实验室养了一盆植物，别人不许浇水。"
- en: "Always asks \"what's the one-sentence version?\""
  zh: "总问：“一句话概括呢？”"
- en: "Starts every meeting with \"so, what did we learn this week?\""
  zh: "每次开会都以“那么，这周我们学到了什么？”开场。"
- en: "Has a standing Friday-afternoon reading group nobody can escape."
  zh: "有个雷打不动的周五下午读书会，谁也逃不掉。"
