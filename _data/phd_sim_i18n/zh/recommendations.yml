# zh translations for recommendations (English is the source; see docs/phd-simulator/zh-guide.md).
- en: "You burned out at least once."
  zh: "你至少倦怠过一次。"
- en: "You spent a lot of weekends working."
  zh: "你不少周末都在加班。"
- en: "You rarely took real breaks."
  zh: "你很少好好休息。"
- en: "Your health took a hit."
  zh: "你的健康受了影响。"
- en: "You left before the finish line."
  zh: "你没走到终点就离开了。"
- en: "What the PhD gives you, even without the degree."
  zh: "就算没拿到学位，读博也给了你这些。"
- en: "You collected a lot of rejections."
  zh: "你攒了不少拒稿。"
- en: "Your Stress ran high along the way."
  zh: "这一路上，你的压力一直不小。"
- en: "A paper went out before it was ready."
  zh: "有篇论文还没准备好就投出去了。"
- en: "Your rebuttals made promises you had to keep."
  zh: "你在 rebuttal 里许下的承诺，后来都得兑现。"
- en: "Writing was your weakest skill."
  zh: "写作是你最大的短板。"
- en: "Your writing could have been clearer."
  zh: "你的文字本可以更清楚。"
- en: "You didn't read much outside your projects."
  zh: "项目之外的论文，你读得不多。"
- en: "Getting scooped often starts with a missed paper."
  zh: "被撞车，往往是从漏读一篇论文开始的。"
- en: "Your advisor relationship could have been stronger."
  zh: "你和导师的关系本可以更好。"
- en: "Novelty was a recurring problem."
  zh: "创新性屡次被质疑。"
- en: "You ran human-centered studies."
  zh: "你做过以人为中心的研究。"
- en: "Make sure the direction becomes yours."
  zh: "要让这个方向真正成为你自己的。"
- en: "Research has no answers in the back of the book."
  zh: "做研究，可没有书后的参考答案。"
- en: "Why research, after all?"
  zh: "说到底，为什么要做研究？"
- en: "A checklist for your next project."
  zh: "下一个项目开工前的检查清单。"
- en: "Every project starts with one sentence."
  zh: "每个项目都从一句话开始。"
- en: "From the gap to the method."
  zh: "从研究空白到方法。"
- en: "From numbers to findings."
  zh: "从数字到发现。"
- en: "Where your work should go next."
  zh: "你的工作下一步该投向哪里。"
- en: "What keeps you going after the citations."
  zh: "引用之外，是什么让你坚持下去。"
- en: "How to pick up new methods faster."
  zh: "怎样更快学会新方法。"
- en: "Teach yourself from the papers you admire."
  zh: "从你佩服的论文里自学。"
