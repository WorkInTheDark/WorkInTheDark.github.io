# PhD Simulator tuning numbers. Every number the engine balances on lives here.
# Ranges use the same "+7±3" notation as events (a triangular roll in [4, 10]).
version: 1
turns_per_year: 26
max_year: 8
start:
  energy: 80
  sanity: 70
  health: "80±10"
  advisor_rel: 50
  labmates_rel: 50
  family_rel: 60
  friends_rel: 40
  network: 15
  skills: { taste: 26, coding: 32, writing: 28, presenting: 28, knowledge: 26 }

# A work week (weekends off) nets about -8 Energy; a Recharge week about +28, whatever else is on.
energy:
  workday: "-3±1"        # a day of research
  fixed_day: "-2"        # a day of classes, TA duty or meetings
  recharge_week: "+20±3" # a whole Recharge week, on top of the weekend
  exercise_week: "+8±2"  # a whole Get healthy week
  overtime: "-5±2"
  rest: "+8±2"
  light: "+5±2"          # social, hobby, family
  exercise: "+3±1"
  weekend_off: "+4±1"
  baseline: -2           # per week: errands, bad sleep, life
  read_relief: 1         # a reading day costs 1 less than other work
  efficiency_floor: 0.35 # efficiency = clamp(floor + slope * energy, floor, 1): full speed at 60+
  efficiency_slope: 0.011

# Shown to the player as Stress = 100 − sanity.
sanity:
  self_day: "+3±1"       # social, hobby, family
  recharge_day: "+3±1"   # opportunities that are rest days
  recharge_week: "+10±2"
  exercise_week: "+4±1"
  exercise_day: "+1"
  weekend_off: "+1"
  pressure: 2.5          # the background weight of being a PhD student, every week
  work_day: -0.5         # every work day (classes and TA included) adds a little Stress
  overtime_day: -1
  isolation_turns: 3
  isolation_hit: "-4±2"
  low: 25
  low_efficiency: 0.8
  burnout_turns: 3

# Visible. Desk weeks wear it down slowly; a "Get healthy" week brings back about +10.
health:
  overtime_day: -1.5
  exercise_day: 3
  rest_day: 0.5
  recharge_week: 1
  exercise_week: "+11±2"
  desk_week: -1          # a week with no exercise day
  exhausted_week: -1     # a week ending with Energy under 25
  stressed_week: -1      # a week ending with Stress over 70
  poor: 35               # below this, work is slower
  poor_efficiency: 0.9
  sick_base: 0.01        # weekly chance of getting sick: (base + per_point × (100 − health)) / 2
  sick_per_point: 0.004
  flu_season: [8, 14]

skills:
  growth: 0.25           # per relevant day: growth * (1 - skill / 100)

# A project is one 0–100% bar: about 4 months when you push, 6–8 when you alternate with other things.
progress:
  rate: 3.0              # % of the bar per work day before multipliers
  roll: 0.2              # ±20% per day
  read_lit: 1.3          # reading during Related work, relative to working on it
  work_lit: 0.8          # "Work on" during Related work
  read_trickle: 0.4      # % per reading day for projects in other phases
  max_active_projects: 4

quality:
  base: 22               # day quality = base + per_skill * skill
  per_skill: 0.7
  writing_floor: 0.6     # clarity × (floor + (1 - floor) × writing completion)
  hype_weight: 0.1       # novelty += (hype - 50) × weight

# One turn is one week. You choose one thing to do with it; its free weekdays all go to that choice.
# Content and the calendar still count in two-week periods (T1–T26); durations from content are doubled.
turn:
  traits: 3                # random traits per new PhD

events:
  turn_event_chance: 0.09  # chance of one random event per week (about one every eleven weeks; hooks add more)
  busy_turn_event_chance: 0.03
  rarity: { common: 10, uncommon: 4, rare: 1.2, legendary: 0.3 }
  novelty: { never: 2.5, last_run: 0.25, two_runs: 0.5, this_run: 0.25 }
  balance_window: 6
  default_cooldown: 6
  flavor_chance: 0.6

reviews:
  reviewer_sigma: 15
  ac_sigma: 8
  findings_band: 7
  rr_band: 10

citations:
  venue_base: { top: 55, journal: 40, mid: 32, findings: 25, workshop: 10 }
  preprint_factor: 0.5
  breakout_chance: 0.03

opportunities:
  max_per_week: 2          # "this week only" options rolled each week (plus any an event unlocked)

fixed_days:                # days per two weeks; each week gets exactly half (1.5 days of classes a week)
  courses_y1: 3
  courses_y2: 2
  ta: 2
  ta_peak: 3             # T8 and T18 (grading)
  meetings: 1
  defense_prep: 5
  conference: 4

ta_chance_by_funding: [0.8, 0.6, 0.35, 0.15, 0.05]
graduation_pubs: 3
defense_prep_turns: 6
quals_turn: 18           # quals at T18 of year 1 or 2 (rolled per run)
proposal_prep_turns: 4
proposal_min_pubs: 2
proposal_min_year: 3
tip_spacing: 6
