# PhD Simulator tuning numbers. Every number the engine balances on lives here.
# Ranges use the same "+7±3" notation as events (a triangular roll in [4, 10]).
version: 1
# The daily PhD: everyone plays the same game each day, with its own leaderboard. Hidden on 2026-10-24
# because almost no one played it (Arthur). true brings back its button, its board and its lines.
daily_challenge: false
turns_per_year: 26
max_year: 8
start:
  energy: 80
  sanity: 70
  health: "80±10"
  advisor_rel: 50
  labmates_rel: 50
  family_rel: 60
  friends_rel: 40
  network: 15
  skills: { taste: 26, coding: 32, writing: 28, presenting: 28, knowledge: 26 }

# A turn is two weeks: 10 weekdays and 4 weekend days. A work turn nets about -17 Energy;
# a Recharge turn about +38, whatever else is on.
energy:
  workday: "-3±1"        # a day of research
  fixed_day: "-2"        # a day of classes, TA duty, meetings or an internship at a healthy pace
  recharge_turn: "+28±4" # a whole Recharge turn, on top of the weekends
  overtime: "-5±2"
  rest: "+8±2"           # rest days from opportunities and side activities
  light: "+5±2"          # social, hobby, family
  exercise: "+3±1"
  weekend_off: "+4±1"
  baseline: -4           # per turn: errands, bad sleep, life
  read_relief: 1         # a reading day costs 1 less than other work
  efficiency_floor: 0.35 # efficiency = clamp(floor + slope * energy, floor, 1): full speed at 60+
  efficiency_slope: 0.011
  empty: 5               # a turn starting at or below this can bring an "exhausted" event (events/health.yml)

# Shown to the player as Stress = 100 − sanity.
sanity:
  self_day: "+3±1"       # social, hobby, family
  recharge_day: "+3±1"   # opportunities that are rest days
  recharge_turn: "+18±3"
  exercise_day: "+1"
  weekend_off: "+1"
  pressure: 5            # the background weight of being a PhD student, every turn
  work_day: -0.5         # every work day (classes and TA included) adds a little Stress
  new_project: 6         # starting a project adds this much Stress...
  new_project_per_active: 3   # ...plus this much for each project already on your plate
  overtime_day: -1
  isolation_turns: 3
  isolation_hit: "-4±2"
  low: 25
  low_efficiency: 0.8
  burnout_turns: 3

# Visible. Desk turns wear it down slowly; Recharge, side activities (gym, a hike, a doctor's
# visit) and some opportunities bring it back.
health:
  overtime_day: -1.5
  exercise_day: 3
  rest_day: 0.5
  recharge_turn: "+9±2"  # Recharge is the reliable way back (was +4, then +7: Health still sank for hard workers, 2026-10-24)
  weekend_off: 0         # each weekend day off (tried 0.25 on 2026-10-24: too generous)
  desk_turn: -1.5        # a turn with no exercise
  exhausted_turn: -2     # a turn ending with Energy under 25
  stressed_turn: -2      # a turn ending with Stress over 70
  poor: 35               # below this, work is slower
  poor_efficiency: 0.9
  sick_base: 0.01        # chance of getting sick each turn: base + per_point × (100 − health)
  sick_per_point: 0.003
  flu_season: [8, 14]

skills:
  growth: 0.25           # per relevant day: growth * (1 - skill / 100)

# Projects move through named stages, each with a set chance of finishing per turn of work
# (in projects.js). A normal full turn gets exactly that chance; a short or tired turn keeps
# 50–100% of it (chance × (0.5 + 0.5 × effort / full_turn)); a crunch adds at most 15%.
progress:
  full_turn: 5.5         # effective work days that count as a full turn (6.5 until 2026-10-18; 4.5 made careful players too productive)
  read_lit: 1.3          # reading during Related work, relative to working on it
  work_lit: 0.8          # "Work on" during Related work
  read_trickle: 0.05     # effort per reading day for projects in other stages
  max_active_projects: 4
  revise_before_resubmit: true  # a rejected paper goes out again only once its revision is done (paces graduation to ~4.3 years)
  revise_chance: 0.6     # chance a turn of work finishes the revision
  step_down_after: 2     # after this many rejections, a paper re-aims at the next mid-tier deadline (within half a year)
  resubmit_min_turns: 4  # a rejected paper's next deadline is at least 8 weeks out (time to revise)
  refine_pass: 1.5        # quality one turn of refining a ready paper adds, every time; most of it goes to the weakest part (Arthur 2026-10-18)
  refine_weekend_share: 0.5 # an internship's four weekend days refine a ready paper this much of a turn (playtest, 2026-10-24)

quality:
  base: 22               # day quality = base + per_skill * skill
  per_skill: 0.7
  writing_floor: 0.6     # clarity × (floor + (1 - floor) × writing completion)
  hype_weight: 0.1       # novelty += (hype - 50) × weight

# One turn is two weeks. You choose its focus; its free weekdays all go to that.
turn:
  traits: 3                # random traits per new PhD

events:
  per_turn: [0.4, 0.5, 0.1]     # chance of 0, 1 or 2 things happening in a turn (updates count toward it; Arthur 2026-10-18, was 25/60/15)
  rarity: { common: 10, uncommon: 4, rare: 1.2, legendary: 0.3 }
  novelty: { never: 2.5, last_run: 0.25, two_runs: 0.5, this_run: 0.25 }
  balance_window: 6
  default_cooldown: 6
  flavor_chance: 0.6

reviews:
  reviewer_sigma: 15
  ac_sigma: 3            # the area chair's own noise on the reviewers' average. Was 8, about half a shown point, so a 4-4-4 could
                         # still be rejected; at 3 the shown scores predict the decision (Arthur 2026-10-21)
  findings_band: 10      # ARR: this far below the bar is Findings. Was 7; at 10 an average around 3 mostly lands in Findings, not a rejection
  rr_band: 10
  lesson_bonus: 7        # each rejection improves the paper: +3.5 to every part, +7 to its weakest (2026-10-18)
  first_paper_bonus: 10  # until your first first-author acceptance, your advisor's extra work adds this to every submission (Arthur 2026-10-20: 2-3 rejections before the first paper, was ~5)
  # How a reviewer's hidden 0-100 score shows as 1-5: round((raw - score_floor) / score_width).
  # Floor 28 puts the top-venue bar (80) at an average of about 3.5, like real ACL or CHI (Arthur 2026-10-20; was 20,
  # which put the bar at about 4.3). Display only: decisions use the hidden scores. Move it with the venue bars.
  score_floor: 28
  score_width: 15

citations:
  venue_base: { top: 55, journal: 40, mid: 32, findings: 25, workshop: 10 }
  preprint_factor: 0.5
  breakout_chance: 0.03

opportunities:
  max_per_turn: 2          # "only this turn" options rolled each turn (plus any an event unlocked)

side:
  chance: 0.3              # a side-activity card in a turn (higher when Health or Stress is bad)
  health_every_turn: 50    # Health under this: a card every turn, its first pick for Health (2026-10-24)

fixed_days:                # days per turn (two weeks)
  courses_y1: 3
  courses_y2: 2
  ta: 2
  ta_peak: 3             # T8 and T18 (grading)
  meetings: 1
  defense_prep: 5
  conference: 4

ta_chance_by_funding: [0.8, 0.6, 0.35, 0.15, 0.05]
graduation_pubs: 3

# Job offers. The academic score (endings.js profile) when offers are made. Measured 2026-10-18 with
# `simulate.mjs N balanced|scholar`: sensible players median about 67, 90th percentile about 95; careful
# five-year players (applying in Year 5) median about 85, 75th percentile about 101.
offers:
  tenure_track_score: 116     # tenure-track: careful five-year players clear it ~29% of the time, sensible ones ~5% (then a 50% roll; was 102 before the 2026-10-20 easier venues)
  famous_postdoc_score: 98    # postdoc in a famous lab: about the top 25% of research records (then a 70% roll; was 80 before the 2026-10-20 easier venues)
  frontier_lab_score: 121     # frontier lab: industry score of about the top 15% of graduates (then a 70% roll)
  frontier_lab_coding: 75
  return_base: 0.04           # return offer after an internship: base + per_all_in x turns you gave it your all (max 6)
  return_per_all_in: 0.025
  ux_hci_papers: 2            # UX researcher: two accepted first-author study or system papers (then a 60% roll)
  journalist_writing: 60      # science journalist: the magazine-piece event, and Writing at least this
  clinical_chance: 0.25       # clinical informatics: a clinical partner and an accepted HCI paper, then this roll
defense_prep_turns: 6
quals_turn: 18           # quals at T18 of year 1 or 2 (rolled per run)
quals_prep_turns: 4      # "Prepare for quals" is on offer this many turns (8 weeks) before the exam
quals_prep_per_day: 1.5  # readiness per free day spent preparing (the exam counts up to 15)
quals_odds: { base: 0.2, per_prep: 0.045, retake: 0.12 }  # chance each quals answer lands: base + per_prep x readiness (max 15) + (skill - 40) / 200, + retake on the second try
proposal_prep_turns: 4
proposal_min_pubs: 2      # two accepted papers before the proposal (back from 1 on 2026-10-20: with easier venues, 1 made graduation 3.8 years)
proposal_min_year: 3
defense_after_proposal_turns: 26  # defense prep can start a year after the proposal passes: time for the job market and more papers
tip_spacing: 6
