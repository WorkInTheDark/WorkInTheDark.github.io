# PhD Simulator tuning numbers. Every number the engine balances on lives here.
# Ranges use the same "+7±3" notation as events (a triangular roll in [4, 10]).
version: 1
turns_per_year: 26
max_year: 8
start:
  energy: 80
  sanity: 70
  health: "80±10"
  advisor_rel: 50
  labmates_rel: 50
  family_rel: 60
  friends_rel: 40
  network: 15
  skills: { taste: 26, coding: 32, writing: 28, presenting: 28, knowledge: 26 }

# A turn is two weeks: 10 weekdays and 4 weekend days. A work turn nets about -17 Energy;
# a Recharge turn about +38, whatever else is on.
energy:
  workday: "-3±1"        # a day of research
  fixed_day: "-2"        # a day of classes, TA duty, meetings or an internship at a healthy pace
  recharge_turn: "+28±4" # a whole Recharge turn, on top of the weekends
  overtime: "-5±2"
  rest: "+8±2"           # rest days from opportunities and side activities
  light: "+5±2"          # social, hobby, family
  exercise: "+3±1"
  weekend_off: "+4±1"
  baseline: -4           # per turn: errands, bad sleep, life
  read_relief: 1         # a reading day costs 1 less than other work
  efficiency_floor: 0.35 # efficiency = clamp(floor + slope * energy, floor, 1): full speed at 60+
  efficiency_slope: 0.011

# Shown to the player as Stress = 100 − sanity.
sanity:
  self_day: "+3±1"       # social, hobby, family
  recharge_day: "+3±1"   # opportunities that are rest days
  recharge_turn: "+18±3"
  exercise_day: "+1"
  weekend_off: "+1"
  pressure: 5            # the background weight of being a PhD student, every turn
  work_day: -0.5         # every work day (classes and TA included) adds a little Stress
  new_project: 6         # starting a project adds this much Stress...
  new_project_per_active: 3   # ...plus this much for each project already on your plate
  overtime_day: -1
  isolation_turns: 3
  isolation_hit: "-4±2"
  low: 25
  low_efficiency: 0.8
  burnout_turns: 3

# Visible. Desk turns wear it down slowly; Recharge, side activities (gym, a hike, a doctor's
# visit) and some opportunities bring it back.
health:
  overtime_day: -1.5
  exercise_day: 3
  rest_day: 0.5
  recharge_turn: "+7±2"  # Recharge is the reliable way back (was +4: health only went down)
  desk_turn: -1.5        # a turn with no exercise
  exhausted_turn: -2     # a turn ending with Energy under 25
  stressed_turn: -2      # a turn ending with Stress over 70
  poor: 35               # below this, work is slower
  poor_efficiency: 0.9
  sick_base: 0.01        # chance of getting sick each turn: base + per_point × (100 − health)
  sick_per_point: 0.003
  flu_season: [8, 14]

skills:
  growth: 0.25           # per relevant day: growth * (1 - skill / 100)

# Projects move through named stages, each with a set chance of finishing per turn of work
# (in projects.js). A normal full turn gets exactly that chance; a short or tired turn keeps
# 50–100% of it (chance × (0.5 + 0.5 × effort / full_turn)); a crunch adds at most 15%.
progress:
  full_turn: 6.5         # effective work days that count as a full turn (a normal turn after Year 1)
  read_lit: 1.3          # reading during Related work, relative to working on it
  work_lit: 0.8          # "Work on" during Related work
  read_trickle: 0.05     # effort per reading day for projects in other stages
  max_active_projects: 4

quality:
  base: 22               # day quality = base + per_skill * skill
  per_skill: 0.7
  writing_floor: 0.6     # clarity × (floor + (1 - floor) × writing completion)
  hype_weight: 0.1       # novelty += (hype - 50) × weight

# One turn is two weeks. You choose its focus; its free weekdays all go to that.
turn:
  traits: 3                # random traits per new PhD

events:
  per_turn: [0.25, 0.6, 0.15]   # chance of 0, 1 or 2 things happening in a turn (updates count toward it; was 15/60/25 until 2026-10-17)
  rarity: { common: 10, uncommon: 4, rare: 1.2, legendary: 0.3 }
  novelty: { never: 2.5, last_run: 0.25, two_runs: 0.5, this_run: 0.25 }
  balance_window: 6
  default_cooldown: 6
  flavor_chance: 0.6

reviews:
  reviewer_sigma: 15
  ac_sigma: 8
  findings_band: 7
  rr_band: 10

citations:
  venue_base: { top: 55, journal: 40, mid: 32, findings: 25, workshop: 10 }
  preprint_factor: 0.5
  breakout_chance: 0.03

opportunities:
  max_per_turn: 2          # "only this turn" options rolled each turn (plus any an event unlocked)

side:
  chance: 0.3              # a side-activity card in a turn (higher when Health or Stress is bad)

fixed_days:                # days per turn (two weeks)
  courses_y1: 3
  courses_y2: 2
  ta: 2
  ta_peak: 3             # T8 and T18 (grading)
  meetings: 1
  defense_prep: 5
  conference: 4

ta_chance_by_funding: [0.8, 0.6, 0.35, 0.15, 0.05]
graduation_pubs: 3
defense_prep_turns: 6
quals_turn: 18           # quals at T18 of year 1 or 2 (rolled per run)
quals_prep_turns: 4      # "Prepare for quals" is on offer this many turns (8 weeks) before the exam
quals_prep_per_day: 1.5  # readiness per free day spent preparing (the exam counts up to 15)
quals_odds: { base: 0.2, per_prep: 0.045, retake: 0.12 }  # chance each quals answer lands: base + per_prep x readiness (max 15) + (skill - 40) / 200, + retake on the second try
proposal_prep_turns: 4
proposal_min_pubs: 2
proposal_min_year: 3
tip_spacing: 6
