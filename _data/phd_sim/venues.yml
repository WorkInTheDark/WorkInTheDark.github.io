# Venues and their (approximate, game-only) yearly cycles. Offsets count turns after the deadline.
# tier: top | mid | workshop | journal. Findings is an outcome of ARR, not a venue.
- id: arr
  name: ARR
  tier: top
  findings: true
  types: [empirical, dataset, position, study]
  weights: { N: 0.3, S: 0.45, C: 0.25 }
  threshold: 74
  cycles:
    - { deadline: 3,  name: NAACL, reviews_in: 5, rebuttal: true, decision_in: 8, conference_in: 13 }
    - { deadline: 12, name: ACL,   reviews_in: 5, rebuttal: true, decision_in: 8, conference_in: 11 }
    - { deadline: 19, name: EMNLP, reviews_in: 5, rebuttal: true, decision_in: 9, conference_in: 13 }
