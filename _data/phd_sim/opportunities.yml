# "Only this turn" focus options. Each turn a few of these may come up (each rolls its `chance` when
# its conditions hold); events can also unlock one with `unlock: <id>`. Choosing one as the turn's
# focus spends its free days on `days` (an activity, `project` for the bound project, or `none`),
# then applies the outcome keys (text, effects, flag_set, achievement, tip, ...).
# cooldown counts turns, like event cooldowns. Smaller things live in side.yml.

- id: opp_holiday_home
  label: "Go home for the holidays"
  reason: "The holidays are here. Everyone else is leaving campus."
  when: { turn: [7, 7] }
  chance: 0.9
  days: family
  text: "You eat home cooking and see old friends. Only one relative asks about your h-index."
  effects: { sanity: "+10±3", energy: "+6±2", family_rel: "+8±2" }
- id: opp_winter_break
  label: "Take the winter break off"
  reason: "Winter break. The lab is empty and the inbox is quiet."
  when: { turn: [9, 9] }
  chance: 0.95
  days: rest
  text: "You take a real break and start the new year with a clear head."
  effects: { sanity: "+12±3", energy: "+8±2", family_rel: "+5±2" }
- id: opp_lunar_new_year
  label: "Celebrate Lunar New Year"
  reason: "Lunar New Year is here, and the family group chat is busy."
  when: { turn: [11, 12] }
  chance: 0.63
  cooldown: 13
  days: family
  text: "You eat too many dumplings and call everyone back home."
  effects: { sanity: "+7±2", family_rel: "+5±2" }
- id: opp_spring_break_trip
  label: "Take a spring break trip"
  reason: "Spring break. Friends are planning a trip somewhere warm."
  when: { turn: [14, 14] }
  chance: 0.8
  days: hobby
  text: "You spend a week in the sun without reading a single paper."
  effects: { sanity: "+10±3", energy: "+6±2", friends_rel: "+6±2" }
- id: opp_summer_vacation
  label: "Take a real vacation"
  reason: "It's summer, and you haven't taken more than a weekend off in a long time."
  when: { turn: [20, 25], status_none: [on_internship] }
  chance: 0.216
  cooldown: 13
  days: rest
  text: "Two weeks without a laptop. It feels strange for two days, then wonderful."
  effects: { sanity: "+14±3", energy: "+12±3" }
- id: opp_summer_school
  label: "Go to a summer school"
  reason: "A summer school on human-centered NLP has a spot for you."
  when: { year: [1, 3], turn: [19, 23], has_advisor: true, status_none: [on_internship] }
  chance: 0.36
  cooldown: 26
  days: read
  text: "You hear lectures from people whose papers you've read and join a group chat that lasts for years."
  effects: { knowledge: "+3±1", taste: "+2±1", network: "+6±2", sanity: "+2±1" }
- id: opp_hackathon
  label: "Join a hackathon"
  reason: "A week-long hackathon on AI for health is looking for teammates."
  when: { year: [1, 4] }
  chance: 0.054
  cooldown: 13
  days: network
  text: "You barely sleep for a week. The demo works, and three teammates want to keep going."
  effects: { coding: "+4±2", energy: "-6±2", sanity: "+3±2", network: "+3±1" }
- id: opp_writing_retreat
  label: "Join the writing retreat for “{project}”"
  reason: "The department's writing retreat has a seat open, in a quiet room with no meetings."
  when: { project: { stage: [consolidation, revise] } }
  chance: 0.108
  cooldown: 8
  days: project
  boost: 1.4
  text: "Five quiet days later, the draft has grown more than it did all month."
  effects: { writing: "+2±1" }
- id: opp_empty_cluster
  label: "Run everything on the empty GPU cluster"
  reason: "Everyone else is at a conference. The GPU cluster is completely empty."
  when: { project: { stage: [pilot, experiments, baselines] } }
  chance: 0.108
  cooldown: 8
  days: project
  boost: 1.6
  text: "With no queue, you run a month of experiments in a week."
  effects: { coding: "+1±1" }
- id: opp_clinic_open
  label: "Run study sessions while the clinic has openings"
  reason: "The clinic suddenly has two weeks of open slots for your study."
  when: { project: { stage: [sessions, study] } }
  chance: 0.144
  cooldown: 8
  days: project
  boost: 1.5
  text: "You run back-to-back sessions, and the clinicians all show up."
  effects: { presenting: "+1±1" }
  flag_set: [clinical_partner]
- id: opp_advisor_free_week
  label: "Work side by side with your advisor"
  reason: "Your advisor's calendar is unexpectedly free for the next two weeks."
  when: { has_advisor: true, project: { stage_kind: work } }
  chance: 0.054
  cooldown: 13
  days: project
  boost: 1.3
  text: "You spend two weeks at the whiteboard with your advisor and learn how they think."
  effects: { advisor_rel: "+5±2", taste: "+2±1", project.quality.N: "+3±1" }
- id: opp_collaborator_visit
  label: "Visit a collaborator's lab for two weeks"
  reason: "A collaborator invites you to spend two weeks in their lab."
  when: { year: [2, 6], stat: { network: ">=35" }, project: { stage_kind: work } }
  chance: 0.054
  cooldown: 26
  days: project
  boost: 1.25
  text: "Their lab does things differently, and they spot problems you had stopped seeing."
  effects: { network: "+5±2", project.quality.S: "+3±1" }
- id: opp_labmate_deadline
  label: "Help {labmate} make their deadline"
  reason: "{labmate} has a deadline Friday and is drowning."
  when: { has_advisor: true }
  chance: 0.072
  cooldown: 8
  days: help
  text: "You fix the plots and rewrite the related work. They promise to return the favor."
  effects: { labmates_rel: "+6±2", writing: "+1±1" }
- id: opp_mentor_undergrad
  label: "Take an undergrad under your wing"
  reason: "An eager undergrad wants to do research and your advisor suggests you."
  when: { year: [3, 7], has_advisor: true, flags_none: [has_undergrad_mentee] }
  chance: 0.072
  cooldown: 26
  days: mentor
  text: "You spend two weeks setting them up, and explaining your work helps you understand it better."
  effects: { presenting: "+2±1", labmates_rel: "+3±1" }
  flag_set: [has_undergrad_mentee]
- id: opp_career_fair
  label: "Prepare for the career fair"
  reason: "The fall career fair is next week. Recruiters from big labs will be there."
  when: { year: [2, 6], turn: [3, 6] }
  chance: 0.45
  cooldown: 13
  days: career
  text: "You polish your CV and pitch, and come home with a tote bag of stickers."
  effects: { network: "+4±1", career_prep: "+2" }
- id: opp_invited_talk
  label: "Give an invited talk at another university"
  reason: "A professor who read your paper invites you to give a talk."
  when: { year: [3, 8], telemetry: { first_author_pubs: ">=1" } }
  chance: 0.054
  cooldown: 13
  days: network
  text: "Your talk goes well, and the hard questions come from people who actually read the paper."
  effects: { presenting: "+3±1", network: "+5±2", citations: "+3±2" }
- id: opp_reading_sprint
  label: "Run a reading sprint with the lab"
  reason: "The lab wants to read the ten most important papers of the year, together, over the next two weeks."
  when: { has_advisor: true }
  chance: 0.045
  cooldown: 13
  days: read
  text: "Ten papers and five arguments later, the lab roughly agrees on where the field is going."
  effects: { taste: "+2±1", labmates_rel: "+3±1" }
- id: opp_teach_lectures
  label: "Teach the next two weeks of lectures"
  reason: "The professor you TA for is traveling and asks you to teach."
  when: { status_any: [ta] }
  chance: 0.108
  cooldown: 13
  days: career
  text: "You give three lectures, and your slides improve each time."
  effects: { presenting: "+4±1", energy: "-4±2" }
- id: opp_visit_day
  label: "Host prospective students at visit day"
  reason: "Visit day is coming. Your advisor asks you to show prospective students around."
  when: { year: [2, 7], turn: [12, 14], has_advisor: true }
  chance: 0.54
  cooldown: 13
  days: network
  text: "You hear yourself giving the advice you needed in your first year."
  effects: { presenting: "+2±1", labmates_rel: "+2±1", advisor_rel: "+2±1" }
- id: opp_quiet_week
  label: "Take two quiet weeks"
  reason: "You've been running on empty. Your advisor tells you to take some time."
  when: { stat: { sanity: "<40" }, has_advisor: true }
  chance: 0.27
  cooldown: 8
  days: rest
  text: "Nothing urgent turns out to be urgent. You come back steadier."
  effects: { sanity: "+10±3", energy: "+8±2" }
  tip: "When and How to Rest"
- id: opp_thesis_bootcamp
  label: "Join the thesis-writing bootcamp"
  reason: "The graduate school runs a week-long thesis bootcamp."
  when: { status_any: [defense_prep] }
  chance: 0.45
  cooldown: 13
  days: writing_day
  text: "You write eight hours a day next to people doing the same. By Friday you have a chapter."
  effects: { writing: "+2±1" }
