# End-of-run titles. The highest-priority title whose condition holds wins.
- { id: bubble_tea_magnate, name: "The Bubble Tea Magnate", priority: 100, when: { telemetry: { h_index: ">=10" }, flags_all: [bubble_tea_dream] }, desc: "Peer-reviewed and pearl-reviewed." }
