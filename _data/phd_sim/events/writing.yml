# PhD Simulator: writing and submission events.
# Source ideas: docs/phd-simulator/event-ideas.md, section D (ticked only),
# plus the merged "anonymize the GitHub repo" desk reject from section E.
# Schema: docs/phd-simulator/content-spec.md.
#
# Hooks used here:
#   deadline      binds {project} and {venue}; the paper does not exist yet, so
#                 these events act on project.quality.* and never on paper.*
#   after_submit  binds {paper} and {venue}; desk rejects live here
#   after_accept  binds {paper} and {venue}; camera-ready trouble
#   turn          everything else

# ===========================================================================
# Arc: the eval bug (Arthur's story)
#   wri_eval_bug (after_submit)
#     -> email the chairs / disclose in the response: ends here
#     -> fix quietly        -> wri_eval_bug_numbers_differ (scheduled, 50%)
#     -> let it go          -> wri_eval_bug_reproduced     (scheduled, 50%)
# Flags: eval_bug_disclosed (you told someone), eval_bug_quiet_fix,
# eval_bug_ignored (both cleared by their follow-up).
# ===========================================================================

- id: wri_eval_bug
  title: "The Bug After the Deadline"
  category: writing
  rarity: common
  hook: after_submit
  arc: eval_bug
  when:
    paper: { first_author: true }
  text:
    - "Three days after submitting {paper}, you find a bug in your evaluation script: it counted some test examples twice. Fixed, your gain over the best baseline drops from 4.1 points to 1.9."
    - "Rerunning one table for fun, you find a bug in your analysis script. The corrected numbers still support {paper}, but the headline gain is half of what the submission says."
  choices:
    - label: "Email the program chairs tonight"
      text: "The chairs thank you and pass the correction to the reviewers. Your advisor replies: \"This is exactly right. Thank you.\" It stings less than you expected."
      effects: { sanity: "-3±1", paper.score: "-2±1", advisor_rel: "+4±2", taste: "+1" }
      flag_set: [eval_bug_disclosed]
      tip: "Hold Yourself to a High Standard"
    - label: "Disclose it in the author response"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "You open the response with the correction and the new numbers. Reviewer 1 thanks you for the transparency, and the smaller gain still holds."
        effects: { paper.score: "-1±1", sanity: "-1" }
        flag_set: [eval_bug_disclosed]
      failure:
        text: "The correction ends up in paragraph four. Reviewer 2 finds it there and now doubts every number in the paper."
        effects: { paper.score: "-4±2", sanity: "-3±1" }
        flag_set: [eval_bug_disclosed]
    - label: "Fix the numbers quietly in the camera-ready"
      text: "You add \"update Table 2\" to your to-do list and tell nobody. It sits there like a pebble in your shoe."
      effects: { sanity: "-1" }
      flag_set: [eval_bug_quiet_fix]
      schedule: { event: wri_eval_bug_numbers_differ, in: [6, 12], chance: 0.5 }
    - label: "\"It's only two points.\" Let it go"
      text: "You close the script. The paper is under review, and the numbers are what they are. Something about that sentence keeps bothering you."
      effects: { sanity: "-3±1" }
      flag_set: [eval_bug_ignored]
      schedule: { event: wri_eval_bug_reproduced, in: [8, 20], chance: 0.5 }

- id: wri_eval_bug_numbers_differ
  title: "Spot the Difference"
  category: writing
  rarity: uncommon
  trigger: scheduled
  arc: eval_bug
  when:
    flags_all: [eval_bug_quiet_fix]
  text:
    - "A careful reader emails you. The numbers in Table 2 of your latest version differ from the ones reviewers saw, and nothing in the paper says why."
  choices:
    - label: "Add a correction note today"
      text: "Two sentences and a footnote explain the fix. It costs a little pride, earns some quiet respect, and should have been there from the start."
      effects: { sanity: "-2±1", network: "+2±1" }
      flag_clear: [eval_bug_quiet_fix]
      flag_set: [eval_bug_disclosed]
    - label: "Reply privately and explain"
      text: "They accept your explanation and thank you. You wonder how many readers noticed and didn't write."
      effects: { sanity: "-2±1" }
      flag_clear: [eval_bug_quiet_fix]
    - label: "Leave the email unanswered"
      text: "Their second email copies your advisor. Your advisor's note to you afterwards is very short."
      effects: { sanity: "-5±2", advisor_rel: "-5±2", network: "-3±1" }
      flag_clear: [eval_bug_quiet_fix]

- id: wri_eval_bug_reproduced
  title: "The Polite Email"
  category: writing
  rarity: uncommon
  trigger: scheduled
  arc: eval_bug
  when:
    flags_all: [eval_bug_ignored]
  text:
    - "A student at another university ran your released code and got numbers two points below your paper. Their email is very polite, and they attached their logs."
  choices:
    - label: "Thank them and post a correction"
      text: "The correction goes up with their name in it. It's late, but it's right, and they cite you anyway."
      effects: { sanity: "-4±2", network: "+3±1", taste: "+1" }
      flag_clear: [eval_bug_ignored]
      flag_set: [eval_bug_disclosed]
      tip: "Hold Yourself to a High Standard"
    - label: "Tell your advisor first"
      requires: { has_advisor: true }
      text: "Your advisor is quiet for a moment, then helps you write the correction. \"Next time, tell me the day you find it.\""
      effects: { sanity: "-3±1", advisor_rel: "-2±1" }
      flag_clear: [eval_bug_ignored]
      flag_set: [eval_bug_disclosed]
    - label: "Blame the random seeds"
      text: "They run ten seeds and send you a plot. Their paper cites yours, in a footnote about reproducibility."
      effects: { sanity: "-5±2", network: "-5±2" }
      flag_clear: [eval_bug_ignored]

# ===========================================================================
# Christmas in the lab (Arthur's story). Turn 9 is winter break. It fires for
# a project in revision (a CHI Revise and Resubmit, or a rejected paper being
# revised) or one whose deadline is at most 3 turns away (ARR cycle A is T12).
# ===========================================================================

- id: wri_christmas_revision
  title: "Christmas in the Lab"
  category: writing
  rarity: common
  weight: 2.0
  when:
    turn: [9, 9]
    any:
      - { project: { stage: revise } }
      - { project: { turns_to_deadline: "<=3" } }
  text:
    - "Winter break. The building is empty, the heating is off, and for once the GPU queue is empty too. {project} still needs two experiments and half a rewrite."
    - "Your family asks when you're coming home for the holidays. You look at {project}, then at the empty GPU queue, then back at the message."
  choices:
    - label: "Spend the whole break on it"
      text: "Experiments by day, rewriting by night, family calls on mute. By New Year the paper is much better, and you are much more tired."
      effects: { project.progress: "+20±5", project.quality.S: "+7±2", project.quality.C: "+5±2", energy: "-14±4", sanity: "-8±3", family_rel: "-5±2", health: "-3±1" }
    - label: "Work mornings, family evenings"
      text: "The experiments run while you eat dinner. Progress is slower, but you will remember that the holidays happened."
      effects: { project.progress: "+10±3", project.quality.S: "+3±1", project.quality.C: "+2±1", energy: "-3±1", family_rel: "+2±1" }
    - label: "Take the break. Really take it."
      text: "No laptop for two weeks, just family and too much food. You come back rested, with the same paper and a clearer idea of what it needs."
      effects: { energy: "+12±3", sanity: "+8±3", family_rel: "+5±2", taste: "+1" }
      tip: "When and How to Rest"
    - label: "Run jobs while everyone sleeps"
      requires: { traits_any: [night_owl] }
      tag: "Night Owl"
      text: "Jobs launch at 1 am and finish by breakfast. Your family thinks you're on vacation. The cluster knows better."
      effects: { project.progress: "+14±4", project.quality.S: "+5±2", energy: "-6±2", sanity: "-2±1", family_rel: "+1", health: "-2±1" }

# ===========================================================================
# Deadline day (hook: deadline)
# ===========================================================================

- id: wri_twelve_pages
  title: "Twelve Into Eight"
  category: writing
  rarity: common
  hook: deadline
  repeatable: true
  cooldown: 10
  text:
    - "The draft of {project} is 12 pages. {venue} allows 8. The deadline is tomorrow night."
    - "You compile the final draft and scroll to the end. Page 12. The limit is 8."
  choices:
    - label: "Cut it sentence by sentence"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "Eight pages, and somehow clearer than twelve. Half the cuts were sentences that said the same thing twice."
        effects: { project.quality.C: "+4±2", energy: "-6±2", writing: "+2±1", health: "-2±1" }
        tip: "Paper Writing 101"
      failure:
        text: "Eight pages. Section 4 lost the sentences that explained it, and now nobody, you included, can follow it."
        effects: { project.quality.C: "-4±2", energy: "-6±2", health: "-2±1" }
    - label: "Move everything to the appendix"
      text: "The main paper fits. Reviewers don't have to read the appendix, and they won't."
      effects: { project.quality.C: "-2±1", project.quality.S: "-2±1", energy: "-2±1" }
    - label: "Shrink the fonts and the spacing"
      text: "It fits. Table 2 is now in 7-point type, and Figure 3 needs a magnifying glass."
      effects: { project.quality.C: "-6±2", sanity: "+2±1" }
    - label: "Rewrite it in half the words"
      requires: { traits_any: [wordsmith] }
      tag: "Wordsmith"
      text: "Every paragraph, half the words. It reads better than the long version ever did."
      effects: { project.quality.C: "+6±2", energy: "-5±2" }

- id: wri_overleaf_down
  title: "Overleaf Is Down"
  category: writing
  rarity: uncommon
  hook: deadline
  text:
    - "Two hours before the {venue} deadline, Overleaf stops loading. The status page says \"investigating\". So does everyone in your lab chat."
    - "You click Recompile. Nothing happens. You refresh. Overleaf is down, and the {venue} deadline is in two hours."
  choices:
    - label: "Compile locally from your last sync"
      check: { stat: coding, vs: 45, spread: 20 }
      success:
        text: "Your last sync was 20 minutes ago. You finish in a local editor and submit with time to spare."
        effects: { sanity: "+3±1", coding: "+1" }
        achievement: overleaf_survivor
      failure:
        text: "Your local copy is from last Tuesday. You redo a week of edits from memory and submit at 11:58 pm."
        effects: { project.quality.C: "-5±2", energy: "-6±2", sanity: "-4±2", health: "-2±1" }
        achievement: overleaf_survivor
    - label: "Wait and keep refreshing"
      text: "It comes back after 50 minutes. You spend the last hour fixing only what matters, which turns out to be a skill."
      effects: { project.quality.C: "-3±1", sanity: "-5±2" }
      achievement: overleaf_survivor
    - label: "Submit this morning's PDF"
      text: "Submitted at 10:02 pm, minus tonight's fixes. You go to bed while everyone else refreshes."
      effects: { project.quality.C: "-4±2", sanity: "+3±1", energy: "+3±1" }
      achievement: overleaf_survivor
    - label: "Build it from your own git mirror"
      requires: { traits_any: [code_wizard] }
      tag: "Code Wizard"
      text: "Your mirror syncs every five minutes, set up two years ago for exactly this night. You submit calmly."
      effects: { sanity: "+4±1" }
      achievement: overleaf_survivor

- id: wri_coauthor_push
  title: "11:45 pm"
  category: writing
  rarity: common
  hook: deadline
  text:
    - "At 11:45 pm, {labmate} pushes a big change to {project}: a rewritten Section 4 and a new results table. The deadline is midnight."
    - "Fifteen minutes before the deadline, the edit history lights up. {labmate} is rewriting your related work, live."
  choices:
    - label: "Keep every change"
      check: { stat: coding, vs: 50, spread: 20 }
      success:
        text: "It compiles, and the new version is good. Better than yours, honestly."
        effects: { project.quality.C: "+3±1", project.quality.S: "+2±1", sanity: "-2±1" }
      failure:
        text: "It compiles with 14 undefined references. Every cell of the new table reads \"??\"."
        effects: { project.quality.C: "-6±2", sanity: "-4±2" }
    - label: "Revert to your version"
      text: "You submit your version at 11:57. {labmate} says \"no worries\" in a tone that suggests worries."
      effects: { labmates_rel: "-4±2", sanity: "+1" }
    - label: "Merge only what you can check"
      text: "You read each change once and keep about half. Submitted at 11:59:40, heart racing."
      effects: { project.quality.C: "+1", energy: "-4±2", sanity: "-3±1", labmates_rel: "+1" }

- id: wri_deadline_extended
  title: "48 More Hours"
  category: writing
  rarity: uncommon
  hook: deadline
  text:
    - "At 9 pm, the chairs announce that the {venue} deadline is extended by 48 hours. {project} was nearly done. Nearly."
  choices:
    - label: "Use all 48 hours"
      text: "You use all 48. The paper is better. You are not."
      effects: { project.quality.S: "+5±2", project.quality.C: "+4±2", energy: "-12±3", sanity: "-5±2", health: "-3±1" }
      trait_add: deadline_junkie
    - label: "Polish for one day, then sleep"
      text: "One day of fixes, one long night of sleep, and a submission with 20 hours to spare. Nobody in your lab believes you."
      effects: { project.quality.C: "+3±1", energy: "-4±2" }
    - label: "Submit now and go to bed"
      text: "You submit at 9:15 pm and sleep for eleven hours. Everyone else uses all 48."
      effects: { energy: "+8±3", sanity: "+5±2" }
      tip: "When and How to Rest"
    - label: "Start the real work at hour 40"
      requires: { traits_any: [procrastinator] }
      tag: "Procrastinator"
      text: "Forty hours of feeling that you have time, then eight hours of doing more than you did all month."
      effects: { project.quality.C: "+2±1", sanity: "+2±1", energy: "-8±3", health: "-2±1" }
      trait_add: deadline_junkie

- id: wri_late_advisor_comments
  title: "Comments, Six Hours Out"
  category: writing
  rarity: common
  hook: deadline
  when:
    has_advisor: true
  text:
    - "Six hours before the deadline, {advisor}'s comments on {project} arrive: {roll:30-60} of them, three starting with \"Big question:\"."
  choices:
    - label: "Address every comment"
      text: "You get through all of them with ten minutes to spare. The big questions were the right questions."
      effects: { project.quality.C: "+5±2", project.quality.S: "+2±1", energy: "-9±3", sanity: "-4±2", advisor_rel: "+3±1", health: "-2±1" }
      tip: "Critique-Centric Feedback"
    - label: "Fix the big questions only"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "You fix the three that matter and leave the commas for the camera-ready. Your advisor agrees with your triage."
        effects: { project.quality.S: "+3±1", project.quality.C: "+2±1", energy: "-4±2", advisor_rel: "+1" }
      failure:
        text: "You fix three comments carefully. Comment 17, which you skipped, was the important one."
        effects: { project.quality.C: "+1", energy: "-4±2", advisor_rel: "-2±1" }
    - label: "\"Will fix in the camera-ready!\""
      text: "You submit as is. Your advisor replies \"ok.\" Just \"ok.\""
      effects: { sanity: "+2±1", advisor_rel: "-4±2" }

- id: wri_new_title
  title: "What If the Title Were a Question?"
  category: writing
  rarity: uncommon
  hook: deadline
  when:
    has_advisor: true
  text:
    - "An hour before the deadline, {advisor} sends a message: \"What if the title were a question?\""
    - "Fifty minutes to go. {advisor} writes: \"New title idea. Hear me out.\" It has a colon and a pun."
  choices:
    - label: "Take it and fix every mention"
      text: "The new title is catchier. You fix it in the PDF, the abstract and the form, then find it in a seventh place."
      effects: { project.quality.N: "+2±1", energy: "-3±1", sanity: "-2±1", advisor_rel: "+3±1" }
    - label: "\"Can we keep the current one?\""
      check: { stat: advisor_rel, vs: 45, spread: 20 }
      success:
        text: "\"Fair. It's your paper.\" You keep your title, and your advisor seems to respect you a little more for asking."
        effects: { sanity: "+2±1", advisor_rel: "+1" }
      failure:
        text: "\"Ok.\" The period does a lot of work."
        effects: { sanity: "-1", advisor_rel: "-3±1" }
    - label: "Promise to revisit it later"
      text: "You agree to change it for the camera-ready. You both know nobody changes the title for the camera-ready."
      effects: { sanity: "+1", advisor_rel: "-1" }

- id: wri_system_crash
  title: "Service Unavailable"
  category: writing
  rarity: uncommon
  hook: deadline
  text:
    - "11:58 pm. You click Submit. The {venue} submission system shows a spinning wheel, then \"503 Service Unavailable\"."
  choices:
    - label: "Refresh and submit again"
      check: { stat: energy, vs: 40, spread: 20 }
      success:
        text: "12:00:41. It goes through anyway, because the server's clock was down too."
        effects: { sanity: "-2±1" }
      failure:
        text: "It goes through at 12:03, with final_v2.pdf instead of final_v3.pdf. Your hands were shaking."
        effects: { project.quality.C: "-4±2", sanity: "-4±2" }
    - label: "Email your PDF to the chairs"
      text: "A form reply at 12:20 am: everything submitted during the outage will be accepted. Hundreds of people got the same reply."
      effects: { sanity: "-3±1", energy: "-2±1" }
    - label: "Post the error screenshot online"
      text: "Two thousand people post the same screenshot. The chairs add an hour, and you spend most of it reading the replies."
      effects: { sanity: "+2±1", network: "+1", project.quality.C: "-2±1" }

- id: wri_limitations_3am
  title: "Limitations, 3 am"
  category: writing
  rarity: common
  hook: deadline
  text:
    - "It's 3 am. {venue} requires a Limitations section, and yours is a heading with nothing under it."
  choices:
    - label: "Write honest, specific limitations"
      check: { stat: writing, vs: 45, spread: 20 }
      success:
        text: "Small sample, one language, one site. Written down plainly, they make the paper more convincing, not less."
        effects: { project.quality.S: "+3±1", project.quality.C: "+2±1", energy: "-5±2" }
      failure:
        text: "Honest, specific, and slightly unhinged. One sentence begins with \"Frankly,\". You'll fix the tone in the camera-ready."
        effects: { project.quality.C: "-2±1", energy: "-5±2" }
    - label: "Paste the generic version"
      text: "\"Our method may not generalize to all settings.\" Reviewers have read that sentence four hundred times."
      effects: { project.quality.S: "-2±1", sanity: "+1" }
    - label: "Turn each limitation into future work"
      text: "Every weakness is now an \"exciting direction\". Reviewers have seen that trick before, too."
      effects: { project.quality.N: "+1", project.quality.S: "-1", energy: "-2±1" }
    - label: "Sleep four hours, write it at 7 am"
      check: { stat: energy, vs: 35, spread: 20 }
      success:
        text: "After four hours of sleep, the section takes 40 minutes, and it's the clearest page in the paper."
        effects: { project.quality.C: "+3±1", project.quality.S: "+2±1", energy: "+4±2" }
        tip: "How to Spend a Day"
      failure:
        text: "You sleep through two alarms and write the section in 12 minutes. It shows."
        effects: { project.quality.C: "-3±1", sanity: "-3±1", energy: "+4±2" }

- id: wri_acronym_taken
  title: "Name Already Taken"
  category: writing
  rarity: uncommon
  hook: deadline
  text:
    - "An hour before submitting {project}, you finally search your method's acronym. Four papers already use it, and so does a robot vacuum."
  choices:
    - label: "Invent a new acronym, fast"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "Twenty minutes of backronyms later, you have a name that is short, unused, and almost spells a word."
        effects: { project.quality.N: "+2±1", sanity: "-1" }
      failure:
        text: "The best you can manage has a hyphen and the number 2 in it. It is unique, at least."
        effects: { project.quality.C: "-1", sanity: "-3±1" }
    - label: "Keep it and hope nobody checks"
      text: "Somebody will check. A reviewer will write: \"Not to be confused with the four other methods of the same name.\""
      effects: { project.quality.N: "-2±1", sanity: "+1" }
    - label: "Drop it and say \"our method\""
      text: "No acronym, no problem. The paper reads a little plainer and a little clearer."
      effects: { project.quality.C: "+1", project.quality.N: "-1", sanity: "+2±1" }

# ===========================================================================
# Right after submitting (hook: after_submit)
# ===========================================================================

# Merged: "You forgot to anonymize the GitHub link" (D) and
# "Desk reject: you forget to anonymize the github repo" (E).
# Any choice sets anonymity_checklist, which also retires the other anonymity
# slips in events/reviews.yml (rev_desk_acknowledgments, rev_desk_todo).
- id: wri_anonymize_repo
  title: "Anonymous, Mostly"
  category: writing
  rarity: uncommon
  hook: after_submit
  when:
    flags_none: [anonymity_checklist]
  text:
    - "Rereading the submitted PDF, you click the code link. It opens your personal GitHub page: your name, your photo, and a README thanking your advisor."
    - "An hour after submitting {paper}, you realize the footnote with the code link was never anonymized. It points straight to your GitHub account."
  choices:
    - label: "Take the repo down tonight"
      text: "The link now leads to a 404. One reviewer will write \"code not available\", which is fair, and survivable."
      effects: { paper.score: "-2±1", sanity: "-2±1" }
      flag_set: [anonymity_checklist]
    - label: "Scrub the repo and rename the account"
      check: { stat: coding, vs: 50, spread: 20 }
      success:
        text: "New account name, clean history, a README that thanks nobody. The link now belongs to a stranger."
        effects: { energy: "-4±2", coding: "+1" }
        flag_set: [anonymity_checklist]
      failure:
        text: "A search engine had already cached the old page. The program chairs find it before any reviewer does. Desk rejected."
        effects: { paper.desk_reject: true, sanity: "-10±3" }
        achievement: desk_rejected
        flag_set: [anonymity_checklist]
    - label: "Email the program chairs"
      check: { stat: writing, vs: 35, spread: 20 }
      success:
        text: "The chairs reply within a day: send an anonymous link and they'll pass it to the reviewers. No harm done."
        effects: { sanity: "+2±1" }
        flag_set: [anonymity_checklist]
      failure:
        text: "The chairs thank you for flagging it, then apply the policy. Desk rejected, very politely."
        effects: { paper.desk_reject: true, sanity: "-10±3" }
        achievement: desk_rejected
        flag_set: [anonymity_checklist]

- id: wri_wrong_track
  title: "Wrong Track"
  category: writing
  rarity: uncommon
  hook: after_submit
  text:
    - "The confirmation email arrives, and you read the track name twice. You picked the one just above the one you meant."
    - "Rereading the confirmation, you notice that {paper} went to the theory track. It contains no theorems."
  choices:
    - label: "Email the chairs to move it"
      check: { stat: writing, vs: 40, spread: 20 }
      success:
        text: "Moved within a day, with a smiley face. The chairs see this every cycle."
        effects: { sanity: "+1" }
      failure:
        text: "Reviewers were already assigned. The chairs are sorry. The reviewers will be sorry too."
        effects: { paper.score: "-5±2", sanity: "-3±1" }
    - label: "Leave it. Fresh eyes might help."
      check: { stat: knowledge, vs: 60, spread: 20 }
      success:
        text: "The out-of-area reviewers find the paper refreshing. One calls it \"a welcome change of pace\"."
        effects: { paper.score: "+2±1" }
      failure:
        text: "Reviewer 1 writes: \"This does not belong in this track.\" Reviewer 1 is correct."
        effects: { paper.score: "-6±2", sanity: "-2±1" }

# ===========================================================================
# Camera-ready (hook: after_accept)
# ===========================================================================

- id: wri_misspelled_name
  title: "Is That How You Spell It?"
  category: writing
  rarity: uncommon
  hook: after_accept
  text:
    - "The camera-ready is in. Then {labmate}, your co-author, messages: \"Small thing. My name is spelled wrong.\" It is, in the proceedings metadata."
  choices:
    - label: "Email the publication chairs"
      check: { stat: writing, vs: 35, spread: 20 }
      success:
        text: "Fixed within a day. The chairs say they get this email a lot, which helps a little."
        effects: { labmates_rel: "+1", sanity: "-1" }
      failure:
        text: "The PDF gets fixed, but the metadata doesn't. Search engines will remember both spellings forever."
        effects: { labmates_rel: "-2±1", sanity: "-3±1" }
    - label: "Apologize over lunch, then email"
      text: "The chairs fix it eventually. The lunch, slightly awkward, fixes the friendship right away."
      effects: { labmates_rel: "+3±1", energy: "-3±1", sanity: "-2±1" }
    - label: "Fix the preprint and move on"
      text: "The preprint is right. The official version is wrong forever. {labmate} says it's fine, twice."
      effects: { labmates_rel: "-3±1", sanity: "+1" }

- id: wri_camera_ready_typo
  title: "Langauge"
  category: writing
  rarity: common
  hook: after_accept
  text:
    - "The camera-ready is submitted. You open the PDF to admire it, and the first sentence of the abstract says \"langauge\"."
    - "Final version, uploaded. You flip through it once more and find \"Tabel 3\" on page 6, in a sentence you've read forty times."
  choices:
    - label: "Email the publication chair"
      check: { stat: writing, vs: 40, spread: 20 }
      success:
        text: "The chair lets you upload a fixed PDF, with a gentle note that the window closes tomorrow."
        effects: { sanity: "+2±1", energy: "-2±1" }
      failure:
        text: "The proceedings are final. The typo is now part of the permanent scientific record."
        effects: { sanity: "-4±2" }
    - label: "Fix the preprint and let it go"
      text: "The preprint is perfect. The official version has character."
      effects: { sanity: "+2±1" }
    - label: "Fix it, and every orphan word too"
      requires: { any: [ { traits_any: [perfectionist] }, { advisor: [kind_funded] } ] }
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "One typo and 23 orphan words later, not a single paragraph ends on a lonely word. You print page 1 just to look at it."
        effects: { energy: "-4±2", sanity: "+3±1", writing: "+1" }
        achievement: no_orphans
        tip: "Paper Writing 101"
      failure:
        text: "You fix 31 orphan words. Each fix creates a new one somewhere else. At 2 am, you stop."
        effects: { energy: "-6±2", sanity: "-3±1", health: "-2±1" }

# ===========================================================================
# Consolidation stage (hook: turn)
# ===========================================================================

- id: wri_figure_one
  title: "Figure 1, Day 3"
  category: writing
  rarity: common
  when:
    project: { stage: consolidation }
  text:
    - "Figure 1 for {project} is on its third day. It has been a pipeline diagram, a comic strip, and a pipeline diagram again."
    - "You've spent three days on Figure 1. It's a box, an arrow, and another box, and it's still not right."
  choices:
    - label: "Give it one more day"
      text: "On day four it clicks: one picture that explains the whole paper. Reviewers will look at it before they read a word."
      effects: { days: -1, project.quality.C: "+5±2", project.quality.N: "+2±1", sanity: "-2±1" }
    - label: "Ship the version from day one"
      text: "It's fine. Nobody has ever rejected a paper over a fine Figure 1. Probably."
      effects: { project.quality.C: "-1", project.progress: "+8±3", sanity: "+3±1" }
    - label: "Ask {labmate} for a design eye"
      check: { stat: labmates_rel, vs: 50, spread: 20 }
      success:
        text: "{labmate} moves one arrow, deletes two boxes, and the whole figure suddenly makes sense."
        effects: { project.quality.C: "+6±2", labmates_rel: "+1" }
      failure:
        text: "{labmate} suggests making it 3D. You thank them and lose another afternoon talking them out of it."
        effects: { days: -1, labmates_rel: "-1" }

- id: wri_intro_v7
  title: "Introduction, Version 7"
  category: writing
  rarity: common
  when:
    project: { stage: consolidation }
  text:
    - "You open intro_v7.tex. Then, out of curiosity, intro_v1.tex. Version one was better."
    - "The seventh rewrite of the introduction to {project} is done. You reread the first one, and it was better."
  choices:
    - label: "Go back to version one"
      text: "Seven drafts to learn that the first one was right. At least now you know why it's right."
      effects: { project.progress: "+10±3", sanity: "+3±1", writing: "+1" }
    - label: "Merge the best of all seven"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "Version one's argument, version five's opening line, version seven's citations. It's the best one yet."
        effects: { project.quality.C: "+5±2", project.progress: "+5±2", writing: "+2±1" }
      failure:
        text: "Version eight reads like seven people wrote it, which, in a way, they did."
        effects: { project.quality.C: "-2±1", sanity: "-3±1" }
    - label: "Start version eight"
      text: "Version eight is slightly better than version one. It took another week."
      effects: { project.quality.C: "+2±1", project.progress: "-5±2", sanity: "-3±1" }

