      failure:
        text: "You start matching {advisor}'s pace, which is faster than yours. You finish four minutes early and out of breath."
        effects: { presenting: "+1", sanity: "-2" }
    - label: "Talk to someone else in the room"
      text: "You find a friendly face in the fifth row and give the talk to them. They become the person you picture at every talk from now on."
      effects: { presenting: "+2", sanity: "+1" }

- id: con_talk_mic_dies
  title: "The Mic Dies"
  category: travel
  rarity: common
  hook: conf_talk
  repeatable: true
  cooldown: 26
  text:
    - "Two minutes in, the microphone dies. The room is big. Someone in the back row cups a hand to their ear."
  choices:
    - label: "Project like a stage actor"
      check: { stat: energy, vs: 40, spread: 20 }
      success:
        text: "You give the whole talk at full volume, and the back row hears every word. Your voice will need a day to recover."
        effects: { presenting: "+2", energy: "-4", contacts: "+1" }
      failure:
        text: "You project for six minutes. Then your voice cracks, and you finish in a hoarse whisper that somehow makes everyone lean in."
        effects: { energy: "-4", sanity: "-2", presenting: "+1" }
    - label: "Wait for the tech"
      text: "The tech arrives in four minutes with a new mic. You fill the time with a joke about microphones, and it lands."
      effects: { sanity: "+1", presenting: "+1" }

- id: con_talk_fire_alarm
  title: "Fire Alarm"
  category: travel
  rarity: rare
  hook: conf_talk
  text:
    - "Halfway through your talk, the fire alarm goes off. Three hundred people file out into the parking lot. Slide 8 is still on the screen."
  choices:
    - label: "Finish the talk in the parking lot"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "You stand on a bench and give the rest of the talk to the crowd outside. It's the most memorable talk of the conference, and you didn't even have slides."
        effects: { contacts: "+5±1", presenting: "+3", sanity: "+4" }
      failure:
        text: "You try. A truck goes by. Then another. People drift off toward the coffee."
        effects: { contacts: "+2", sanity: "-3" }
    - label: "Wait it out"
      text: "It was a burnt toaster. Twenty minutes later, you finish to a half-full room of very loyal listeners."
      effects: { contacts: "+1", sanity: "-1" }

- id: con_talk_typo
  title: "A Typo in the Title"
  category: travel
  rarity: common
  hook: conf_talk
  repeatable: true
  cooldown: 26
  text:
    - "On your title slide, in letters a foot tall, there's a typo. You notice it the moment it goes up. So does the audience."
  choices:
    - label: "Make a joke about it"
      check: { stat: presenting, vs: 40, spread: 20 }
      success:
        text: "\"I promise the code has fewer typos,\" you say. Big laugh. The room is on your side from then on."
        effects: { presenting: "+2", sanity: "+2" }
      failure:
        text: "Your joke about the typo somehow has a typo in it too. The laugh is mostly sympathy."
        effects: { sanity: "-2" }
    - label: "Pretend it isn't there"
      text: "You power through. Someone posts a photo of the slide. It gets more likes than your paper."
      effects: { sanity: "-2", citations: "+1" }

# --- Your poster: something always happens -----------------------------------------------------------------

- id: con_poster_tube
  title: "The Poster Tube"
  category: travel
  rarity: uncommon
  hook: conf_poster
  repeatable: true
  cooldown: 26
  text:
    - "You left your poster tube in the taxi. The poster session starts in two hours."
  choices:
    - label: "Print it at a copy shop"
      check: { stat: energy, vs: 40, spread: 20 }
      success:
        text: "You find a shop that prints it on fabric. It looks better than the original, and it doesn't wrinkle."
        effects: { sanity: "+2", energy: "-3" }
      failure:
        text: "The only open shop prints it on eleven sheets of regular paper. You tape them together. People call it the quilt."
        effects: { sanity: "-3", contacts: "+1" }
    - label: "Present it from your laptop"
      text: "You hold your laptop up like a tray for three hours. Your arms won't forgive you, but people crowd in close to see."
      effects: { energy: "-4", contacts: "+2", health: "-1" }

- id: con_poster_neighbor
  title: "The Poster Next Door"
  category: travel
  rarity: common
  hook: conf_poster
  repeatable: true
  cooldown: 26
  text:
    - "The poster next to yours is about the same problem. Its presenter, {stranger}, keeps glancing at your poster. You keep glancing at theirs."
  choices:
    - label: "Team up and present both"
      text: "You start sending visitors to each other. By the end you're giving joint tours of the problem, and visitors stay twice as long."
      effects: { contacts: "+4±1", sanity: "+3" }
    - label: "Compete for visitors"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "Your pitch is sharper and your crowd is bigger. At the end, {stranger} comes over: \"Okay. Teach me your pitch.\""
        effects: { contacts: "+3", presenting: "+2" }
      failure:
        text: "Their crowd is bigger. Their poster has a QR code to a live demo. Next time, you think: a QR code."
        effects: { contacts: "+1", sanity: "-2" }

- id: con_poster_long_talker
  title: "Twenty-Five Minutes"
  category: travel
  rarity: common
  hook: conf_poster
  repeatable: true
  cooldown: 26
  text:
    - "A visitor arrives at your poster and stays. Twenty-five minutes. They have a theory about your work, and about the field, and about their own PhD."
  choices:
    - label: "Politely wrap it up"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "You find a gentle exit: you offer your email so you can keep talking later. Three people who were waiting step up."
        effects: { contacts: "+2", sanity: "+1" }
      failure:
        text: "Every exit you try, they take as an invitation for another story. You lose four visitors."
        effects: { contacts: "+1", sanity: "-3" }
    - label: "Let them talk"
      text: "Somewhere around minute twenty, they say something genuinely brilliant. You write it down. It ends up in your next paper."
      effects: { taste: "+2", energy: "-2", contacts: "+1" }

- id: con_poster_voice
  title: "Explanation Number Forty"
  category: travel
  rarity: common
  hook: conf_poster
  repeatable: true
  cooldown: 26
  text:
    - "Two hours into the session, you've explained your poster forty times. Your voice is starting to go."
  choices:
    - label: "Keep pitching"
      check: { stat: energy, vs: 40, spread: 20 }
      success:
        text: "You make it to the end on throat lozenges and willpower. Forty-three explanations, a personal record."
        effects: { contacts: "+3", energy: "-4", presenting: "+1" }
      failure:
        text: "Your voice gives out at explanation thirty-eight. You finish by pointing at things on the poster and nodding."
        effects: { contacts: "+2", energy: "-4", health: "-1" }
    - label: "Get {labmate} to take a shift"
      requires: { has_advisor: true }
      text: "{labmate} learns your pitch in five minutes and delivers it with more enthusiasm than you ever have. Visitors love it."
      effects: { labmates_rel: "+2", contacts: "+2", energy: "+1" }

# --- The last day --------------------------------------------------------------------------------------------

- id: con_last_gem
  title: "The Best Paper Nobody Saw"
  category: travel
  rarity: uncommon
  hook: conf_last
  when: { trip: { did: [last_sessions] } }
  repeatable: true
  cooldown: 26
  text:
    - "In the last session, eleven people in a big room, a student named {stranger} presents a small, perfect paper. Nobody important is there to see it."
  choices:
    - label: "Tell them it was great"
      text: "You find {stranger} after the talk and say it was the best paper you saw all week. They look like they might cry. You've made someone's conference."
      effects: { contacts: "+2", sanity: "+4" }
    - label: "Post about it"
      text: "Your post gets more attention than the talk did. A week later, {stranger} emails you: three labs have reached out."
      effects: { contacts: "+2", sanity: "+3", network: "+1" }

- id: con_gate_work
  title: "Gate 34"
  category: travel
  rarity: common
  hook: conf_last
  repeatable: true
  cooldown: 26
  text:
    - "Your flight is delayed three hours. The gate is full of people from the conference, laptops open, typing furiously."
  choices:
    - label: "Join them and write"
      text: "You draft the introduction of your next paper at gate 34. It's the best intro you've ever written, which says something about airports."
      effects: { writing: "+2", energy: "-2", sanity: "+1" }
    - label: "Sleep"
      text: "You sleep on your backpack and wake up with a strap pattern on your face, just as your group starts boarding."
      effects: { energy: "+3" }
    - label: "Start a conversation"
      text: "Gate 34 turns into a mini-workshop. Someone suggests making it a real one next year."
      effects: { contacts: "+3", energy: "-2" }

- id: con_keep_in_touch
  title: "We Should Keep in Touch"
  category: travel
  rarity: common
  hook: conf_last
  repeatable: true
  cooldown: 26
  text:
    - "On the last morning, you run into {stranger}, whom you met on Monday. You both say you should keep in touch. People always say that."
  choices:
    - label: "Set a date right now"
      text: "You put a video call on the calendar on the spot. Two months later it's still happening, monthly. It's turning into a paper."
      effects: { contacts: "+2", sanity: "+2", taste: "+1" }
    - label: "Say \"definitely\" and mean it, vaguely"
      text: "You both say \"definitely\". You both mean it. Neither of you writes first."
      effects: { sanity: "+1" }
