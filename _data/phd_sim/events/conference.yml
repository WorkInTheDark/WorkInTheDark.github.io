# A week at a conference (engine/trip.js, conference.yml). Each hook is a kind of moment in the week,
# drawn when you choose something to do (conference.yml activities' event):
#   conf_arrival (Sunday evening), conf_session (keynotes and talks), conf_question (asking one at the
#   mic), conf_coffee (coffee chats), conf_sightseeing, conf_night (dinners, bars, the walk home),
#   conf_party (Wednesday's party), conf_talk and conf_poster (yours: something always happens),
#   conf_last (Thursday and the flight home).
# They bind {city}, {venue} and {paper}; {prof} is a professor and {stranger} a student or researcher
# you meet there. contacts are people you meet (Network when you fly home); a check on prep is how
# much you rehearsed.

# --- Sunday evening ------------------------------------------------------------------------------

- id: con_badge_typo
  title: "Who Are You Again?"
  category: travel
  rarity: common
  hook: conf_arrival
  repeatable: true
  cooldown: 26
  text:
    - "The registration desk prints your badge. Your name is misspelled, your university is a different university, and the lanyard color says SPONSOR."
  choices:
    - label: "Get it reprinted"
      text: "The line for reprints is forty minutes long. You meet three people in it, all with wrong badges."
      effects: { energy: "-2", contacts: "+2±1", sanity: "+1" }
    - label: "Keep it. It's a conversation starter"
      text: "All week, people ask about your sponsorship deal. You make up a new answer each time."
      effects: { contacts: "+2±1", sanity: "+2" }
    - label: "Fix it with a pen"
      text: "Your handwritten correction is readable from up close. Nobody gets that close."
      effects: { sanity: "+1" }

- id: con_reception_famous
  title: "By the Cheese Table"
  category: travel
  rarity: uncommon
  hook: conf_arrival
  repeatable: true
  cooldown: 26
  text:
    - "At the welcome reception, {prof}, whose textbook you learned from, is standing alone by the cheese table, looking at their phone."
  choices:
    - label: "Go say hello"
      check: { stat: presenting, vs: 40, spread: 20 }
      success:
        text: "{prof} is delighted to talk about something other than the textbook. Twenty minutes later: \"Find me at the party. I want to hear the rest,\" {prof} says."
        effects: { contacts: "+3±1", sanity: "+3" }
      failure:
        text: "You tell {prof} you love the textbook. {prof} says thank you. Then neither of you says anything for a very long time."
        effects: { contacts: "+1", sanity: "-3" }
    - label: "Admire from a safe distance"
      text: "Someone else walks over, and they're laughing within a minute. Next year, you tell yourself."
      effects: { sanity: "-1" }
    - label: "Send {labmate} over first"
      text: "{labmate} walks over without hesitating, then waves you in. Five minutes later you're both invited to {prof}'s lab dinner."
      effects: { contacts: "+3", labmates_rel: "+2" }

- id: con_roommate
  title: "The Shared Room"
  category: travel
  rarity: common
  hook: conf_arrival
  repeatable: true
  cooldown: 26
  when: { has_advisor: true }
  text:
    - "To save money, you're sharing a hotel room with {labmate}. At 1 am you learn that {labmate} snores like a leaf blower."
  choices:
    - label: "Earplugs and hope"
      check: { stat: energy, vs: 40, spread: 20 }
      success:
        text: "You sleep. More or less."
        effects: { sanity: "+1" }
      failure:
        text: "You count snores until 4 am. You reach three thousand."
        effects: { energy: "-5±1", sanity: "-2" }
    - label: "Sleep in the bathtub"
      text: "It's surprisingly quiet. Also surprisingly hard. {labmate} finds you there in the morning and laughs for a full minute."
      effects: { energy: "-3", health: "-1", labmates_rel: "+2" }
    - label: "Book your own room for one night"
      text: "It costs a week of groceries. You sleep like a baby."
      effects: { energy: "+3", sanity: "-1" }

- id: con_jetlag_lobby
  title: "The 3 am Lobby"
  category: travel
  rarity: common
  hook: conf_arrival
  repeatable: true
  cooldown: 26
  text:
    - "It's 3 am, and the hotel lobby is full of wide-awake researchers on the wrong time zone, all pretending to answer email."
  choices:
    - label: "Join them"
      text: "By 4 am you've met a postdoc from Seoul and a professor from Lisbon, and sketched a joint project on a napkin."
      effects: { contacts: "+3±1", energy: "-3" }
    - label: "Go back to bed and stare at the ceiling"
      text: "You don't sleep, but you rest. That's what you tell yourself."
      effects: { energy: "+1" }

# --- Talks and sessions ---------------------------------------------------------------------------

- id: con_scooped_live
  title: "Your Next Paper, Presented"
  category: travel
  rarity: uncommon
  hook: conf_session
  when: { trip: { did: [day_sessions] } }
  repeatable: true
  cooldown: 26
  text:
    - "The third talk of the session presents almost exactly the idea you were going to work on next. Same data, same angle, better plots."
  choices:
    - label: "Talk to them afterward"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "You compare notes in the hallway. Your angle is different enough, and they suggest you keep in touch. Maybe even work together."
        effects: { contacts: "+2", taste: "+2", sanity: "+2" }
      failure:
        text: "They're polite and in a hurry. You're left holding a half-formed idea that now has a published twin."
        effects: { sanity: "-4±1" }
    - label: "Quietly cross it off your list"
      text: "You draw a line through the idea in your notebook. It hurts less than you thought, and you have two others."
      effects: { sanity: "-2", taste: "+1" }
    - label: "Find what they missed"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "By the end of the session, you have a follow-up they haven't thought of."
        effects: { taste: "+2", sanity: "+3" }
      failure:
        text: "Everything you think of, they already did in the appendix."
        effects: { knowledge: "+1", sanity: "-3" }

- id: con_cited_on_slide
  title: "There It Is"
  category: travel
  rarity: rare
  hook: conf_session
  text:
    - "A speaker puts up a slide titled \"Prior work\", and there it is: your preprint of {paper}, your name, in a room of four hundred people."
  choices:
    - label: "Take a photo for your advisor"
      requires: { has_advisor: true }
      text: "{advisor} replies with three exclamation points, which for {advisor} is a parade."
      effects: { sanity: "+5±1", advisor_rel: "+2" }
    - label: "Whisper to the person next to you"
      text: "\"That's me,\" you whisper. They look at the slide, then at you, then at the slide. \"Cool,\" they whisper back, and they mean it."
      effects: { sanity: "+4", contacts: "+1" }
    - label: "Find the speaker afterward"
      check: { stat: presenting, vs: 40, spread: 20 }
      success:
        text: "They're thrilled to meet you and have three questions about your method. You have answers to two."
        effects: { contacts: "+2", citations: "+2±1", sanity: "+3" }
      failure:
        text: "They've already left for another session. You write them a very long email instead."
        effects: { contacts: "+1", sanity: "+2" }

- id: con_two_profs_fight
  title: "The Q&A That Became a Debate"
  category: travel
  rarity: uncommon
  hook: conf_session
  repeatable: true
  cooldown: 26
  text:
    - "During the Q&A, two senior professors start arguing about whether benchmarks mean anything. It's been eight minutes. The session chair has given up."
  choices:
    - label: "Enjoy the show"
      text: "It's the best talk of the conference, and it isn't on the program."
      effects: { sanity: "+3", knowledge: "+1" }
    - label: "Step up to the mic with a middle ground"
      check: { stat: knowledge, vs: 55, spread: 20 }
      success:
        text: "Both professors turn to look at you. One says, \"Exactly.\" The other says, \"Fine.\" The chair mouths \"thank you\"."
        effects: { contacts: "+3", presenting: "+1", sanity: "+2" }
        achievement: mic_check
      failure:
        text: "They both turn to you, disagree with you, then agree with each other that you're wrong. Unity, at last."
        effects: { presenting: "+1", sanity: "-4±1" }
        achievement: mic_check
    - label: "Slip out to another session"
      text: "You catch the last two talks next door. The argument is all anyone talks about at lunch anyway."
      effects: { knowledge: "+1" }

- id: con_floor_seat
  title: "Standing Room Only"
  category: travel
  rarity: common
  hook: conf_session
  when: { trip: { did: [day_sessions] } }
  repeatable: true
  cooldown: 26
  text:
    - "The session on your topic is in a room for forty people. Two hundred show up. You're on the floor by the door with your knees under your chin."
  choices:
    - label: "Stay for all of it"
      text: "Your legs fall asleep twice. The talks are worth it, mostly."
      effects: { energy: "-2", knowledge: "+2" }
    - label: "Watch the stream from the hallway"
      text: "You watch on your phone from a hallway bench, next to six other people doing the same thing. By the end, you're a group."
      effects: { contacts: "+2±1", knowledge: "+1" }

- id: con_famous_neighbor
  title: "The Seat Next to You"
  category: travel
  rarity: uncommon
  hook: conf_session
  repeatable: true
  cooldown: 26
  text:
    - "The seat next to you is taken by {prof}, one of the founders of your field, who is quietly correcting the speaker's equations in the margin of the program."
  choices:
    - label: "Whisper a question"
      check: { stat: knowledge, vs: 50, spread: 20 }
      success:
        text: "{prof} whispers back a two-sentence answer that clears up a month of confusion. \"Come by tomorrow and we'll argue about it properly.\""
        effects: { knowledge: "+2", contacts: "+2", sanity: "+2" }
      failure:
        text: "{prof} looks at you as if you'd asked about the weather, then turns back to the screen."
        effects: { sanity: "-2" }
    - label: "Sneak a look at the margin notes"
      text: "{prof} has found a sign error on slide 12. You check. {prof} is right. You'll never trust a slide again."
      effects: { knowledge: "+1", taste: "+1" }
    - label: "Sit very still"
      text: "You sit perfectly still for forty minutes. Your posture has never been better."
      effects: { sanity: "-1" }

- id: con_keynote_spicy
  title: "Won't Matter in Five Years"
  category: travel
  rarity: common
  hook: conf_session
  when: { trip: { did: [day_keynote] } }
  repeatable: true
  cooldown: 26
  text:
    - "The keynote speaker announces that most of the papers at this conference won't matter in five years. The room laughs nervously. Your paper is at this conference."
  choices:
    - label: "Take it personally"
      text: "You spend the afternoon wondering if yours is one of them. By dinner you've decided it's at least in the top half."
      effects: { sanity: "-3", taste: "+1" }
    - label: "Take notes on what will matter"
      check: { stat: taste, vs: 45, spread: 20 }
      success:
        text: "You leave with three questions that might matter in five years, and one of them is yours."
        effects: { taste: "+2", sanity: "+2" }
      failure:
        text: "Your notes say \"WHAT MATTERS???\" in large letters. It's a start."
        effects: { taste: "+1" }

# --- Asking a question at the mic --------------------------------------------------------------------

- id: con_first_question
  title: "Hand Up"
  category: travel
  rarity: common
  hook: conf_question
  repeatable: true
  cooldown: 26
  text:
    - "The talk ends. The chair asks for questions. Your hand is in the air before you can stop it. The mic is at the far end of the aisle."
  choices:
    - label: "Ask the question you wrote down"
      check: { stat: presenting, vs: 35, spread: 20 }
      success:
        text: "Your voice shakes on the first word and steadies by the fifth. The speaker thinks for a second and says it's a great question, and clearly means it."
        effects: { contacts: "+2", presenting: "+2", sanity: "+3" }
        achievement: mic_check
      failure:
        text: "You ask it. It comes out twice as long as you wrote it. The speaker kindly answers a different question."
        effects: { presenting: "+1", sanity: "-2" }
        achievement: mic_check
    - label: "Lower your hand slowly, as if stretching"
      text: "Someone else asks your exact question and gets a great answer. You nod as if you'd planned it."
      effects: { sanity: "-1" }

- id: con_comment_not_question
  title: "More of a Comment"
  category: travel
  rarity: uncommon
  hook: conf_question
  repeatable: true
  cooldown: 26
  text:
    - "You ask your question; the speaker answers it well. Then the person behind you takes the mic, says it's more of a comment than a question, and starts presenting their own paper."
  choices:
    - label: "Wait it out"
      text: "Four minutes. You learn their whole paper. Honestly, it's pretty good."
      effects: { knowledge: "+1", sanity: "-1" }
      achievement: mic_check
    - label: "Catch the speaker at the door instead"
      text: "You skip the line and catch the speaker on the way out. They're relieved to talk to someone who asked an actual question."
      effects: { contacts: "+2", sanity: "+1" }
      achievement: mic_check

- id: con_question_misread
  title: "Not Quite What You Asked"
  category: travel
  rarity: common
  hook: conf_question
  repeatable: true
  cooldown: 26
  text:
    - "You ask a question you've been thinking about all week. The speaker smiles and answers a completely different question, with total confidence."
  choices:
    - label: "Politely ask again"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "You put it in one sentence. The speaker pauses. \"Oh. Oh, that's interesting. I don't know.\" The room goes quiet, the good kind of quiet."
        effects: { contacts: "+3±1", presenting: "+2", sanity: "+2" }
        achievement: mic_check
      failure:
        text: "The second answer is to yet another question. The chair moves on."
        effects: { presenting: "+1", sanity: "-3" }
        achievement: mic_check
    - label: "Say thank you and sit down"
      text: "At the break, three people find you. They wanted the answer to your actual question too."
      effects: { contacts: "+2", sanity: "-1" }
      achievement: mic_check

- id: con_famous_followup
  title: "Building on Your Question"
  category: travel
  rarity: rare
  hook: conf_question
  text:
    - "You ask your question at the mic. Before the speaker can answer, {prof}, one of the biggest names in the field, stands up and says, \"I want to build on that question.\""
  choices:
    - label: "Hold your ground at the mic"
      check: { stat: knowledge, vs: 50, spread: 20 }
      success:
        text: "You, {prof} and the speaker end up in a three-way conversation that runs five minutes over. Afterward, {prof} asks who your advisor is."
        effects: { contacts: "+4±1", sanity: "+3", presenting: "+1" }
        achievement: mic_check
      failure:
        text: "{prof} builds on your question so thoroughly that by the end, nobody remembers it was yours."
        effects: { contacts: "+1", sanity: "-2" }
        achievement: mic_check
    - label: "Step back and let them"
      text: "{prof} asks a better version of your question and thanks you by name. People look at you differently at lunch."
      effects: { contacts: "+2", sanity: "+2" }
      achievement: mic_check

- id: con_mic_line
  title: "Number Five in Line"
  category: travel
  rarity: common
  hook: conf_question
  repeatable: true
  cooldown: 26
  text:
    - "There are six people in line at the mic and four minutes left in the session. You're number five."
  choices:
    - label: "Stay in line"
      check: { stat: energy, vs: 35, spread: 20 }
      success:
        text: "The chair lets the session run over. You ask your question at 12:02 to a hungry room, and it's a good one."
        effects: { presenting: "+1", contacts: "+1", sanity: "+2" }
        achievement: mic_check
      failure:
        text: "\"We're out of time.\" You walk back to your seat holding a question nobody will ever hear."
        effects: { sanity: "-2" }
    - label: "Ask the person ahead of you instead"
      text: "Number four turns out to have the same question. You team up and corner the speaker together at the break."
      effects: { contacts: "+2" }

- id: con_question_your_paper
  title: "That's Why We Tried This"
  category: travel
  rarity: uncommon
  hook: conf_question
  repeatable: true
  cooldown: 26
  text:
    - "The speaker is {stranger}, a student from another lab. You ask your question. \"Wait,\" {stranger} says, squinting at your badge. \"You wrote {paper}? That's why we tried this.\""
  choices:
    - label: "Grab coffee after"
      text: "You spend the break comparing notes. By the end, you're planning a joint workshop paper."
      effects: { contacts: "+3", sanity: "+3" }
      achievement: mic_check
    - label: "Act like it's no big deal"
      text: "You say \"oh, cool\" very casually. You replay the moment on a loop all afternoon."
      effects: { sanity: "+4" }
      achievement: mic_check

# --- Coffee chats ------------------------------------------------------------------------------------

- id: con_coffee_big_name
  title: "Coffee with a Big Name"
  category: travel
  rarity: uncommon
  hook: conf_coffee
  when: { trip: { did: [day_coffee] } }
  repeatable: true
  cooldown: 26
  text:
    - "{prof} actually said yes to coffee. {prof} arrives four minutes late, orders an espresso and says, \"So. What are you working on?\""
  choices:
    - label: "Give your one-minute pitch"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "{prof} asks three sharp questions, then says, \"Send me the paper. And think about a summer visit to my lab.\""
        effects: { contacts: "+3", career_prep: "+2", sanity: "+3" }
      failure:
        text: "You squeeze your five-minute pitch into one breathless minute. {prof} is kind about it, and checks the time twice."
        effects: { contacts: "+1", sanity: "-3" }
    - label: "Ask about their work instead"
      text: "{prof} talks happily for twenty minutes. You learn a lot, and {prof} remembers you as a very good listener."
      effects: { knowledge: "+2", contacts: "+2" }
    - label: "Ask for career advice"
      text: "{prof} tells you the one thing they wish they'd known as a student: \"Pick problems you'd still care about if nobody cited them.\""
      effects: { taste: "+2", contacts: "+1", sanity: "+2" }

- id: con_coffee_rival
  title: "Same Problem, Same Deadline"
  category: travel
  rarity: uncommon
  hook: conf_coffee
  repeatable: true
  cooldown: 26
  text:
    - "Your coffee chat is with {stranger}, who turns out to be working on the same problem as you, with the same dataset, for the same deadline."
  choices:
    - label: "Propose working together"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "\"Honestly? I'd love that,\" {stranger} says. You leave with a shared doc and one less rival."
        effects: { contacts: "+3", sanity: "+4" }
      failure:
        text: "{stranger} says they'll think about it, in the voice people use when they won't."
        effects: { contacts: "+1", sanity: "-2" }
    - label: "Split the problem"
      text: "You agree: {stranger} takes efficiency, you take evaluation. You shake on it over a croissant."
      effects: { contacts: "+2", sanity: "+3", taste: "+1" }
    - label: "Race them"
      text: "You smile, finish your coffee and go back to the hotel to run experiments. The race is on."
      effects: { energy: "-3", sanity: "-3" }

- id: con_coffee_forgot_name
  title: "Great to See You Again!"
  category: travel
  rarity: common
  hook: conf_coffee
  repeatable: true
  cooldown: 26
  text:
    - "Someone in the coffee line waves at you, clearly delighted to see you again. You have absolutely no idea who they are."
  choices:
    - label: "Bluff it"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "You keep it vague for ten minutes until they mention their dataset. It's {stranger}! You met at a workshop last year. Saved."
        effects: { contacts: "+2", sanity: "+1" }
      failure:
        text: "\"Sorry, remind me what you work on?\" you finally ask. \"We had dinner together. Last night.\""
        effects: { contacts: "+1", sanity: "-3" }
    - label: "Confess you've forgotten"
      text: "They laugh: they'd forgotten your name too and were bluffing. You introduce yourselves again, properly this time."
      effects: { contacts: "+2", sanity: "+2" }

- id: con_coffee_recruiter
  title: "Coffee, on {company}"
  category: travel
  rarity: common
  hook: conf_coffee
  repeatable: true
  cooldown: 26
  text:
    - "A recruiter from {company} invites you for coffee. Within five minutes, they ask when you graduate. Within ten, they mention the salary range."
  choices:
    - label: "Hear them out"
      text: "The number is bigger than your stipend by a factor you calculate twice. You take their card and stare at it on the train."
      effects: { career_prep: "+2", sanity: "+1", contacts: "+1" }
    - label: "Steer the talk to research"
      text: "They're surprisingly interested in your work. Their research team, they say, is hiring interns next summer."
      effects: { career_prep: "+1", contacts: "+2" }
    - label: "Say you're not on the market yet"
      text: "\"Everyone says that,\" they say with a smile, and hand you a card anyway."
      effects: { contacts: "+1" }

- id: con_coffee_senior_advice
  title: "An Hour of Honest Advice"
  category: travel
  rarity: common
  hook: conf_coffee
  repeatable: true
  cooldown: 26
  text:
    - "Your coffee with {stranger}, a fifth-year from another lab, turns into an hour of honest talk about advisors, burnout and which conferences are worth it."
  choices:
    - label: "Take notes"
      text: "You fill two pages. The best line, from {stranger}, gets underlined twice: \"Nobody remembers your rejections but you.\""
      effects: { sanity: "+3", contacts: "+1" }
    - label: "Ask what they'd do differently"
      text: "\"Start writing earlier,\" {stranger} says. \"And go to the conference party. I mean it.\""
      effects: { sanity: "+2", writing: "+1", contacts: "+1" }

- id: con_coffee_reviewed
  title: "You Reviewed This Paper"
  category: travel
  rarity: rare
  hook: conf_coffee
  text:
    - "Halfway through coffee, you realize that the paper {stranger} is telling you about is the one you reviewed last month. You gave it a 2."
  choices:
    - label: "Say nothing, as reviewers should"
      text: "You keep the review anonymous and give them some advice, which is basically your review again, out loud. \"That's so helpful,\" {stranger} says. \"Way more useful than our reviewers.\""
      effects: { contacts: "+2", sanity: "+2" }
    - label: "Suddenly need the restroom"
      text: "You hide in the restroom for six minutes. When you come back, they've bought you a pastry."
      effects: { contacts: "+1", sanity: "-2" }

- id: con_coffee_postdoc
  title: "Send Me Your CV"
  category: travel
  rarity: uncommon
  hook: conf_coffee
  repeatable: true
  cooldown: 26
  when: { year: ">=3" }
  text:
    - "Over coffee, {prof}, who runs a lab you'd love to join as a postdoc, says, \"Are you on the market next year? Send me your CV.\""
  choices:
    - label: "Send it that night"
      text: "You update your CV in the hotel room at midnight and send it before you lose your nerve. The reply comes by breakfast: let's talk in the spring."
      effects: { career_prep: "+3", sanity: "+2", contacts: "+2" }
    - label: "Ask what they look for"
      text: "{prof} tells you: \"One thing you're known for. Just one.\" You spend the flight home trying to name yours."
      effects: { career_prep: "+2", taste: "+1", contacts: "+1" }

# --- Seeing the city ----------------------------------------------------------------------------------

- id: con_tour_lost
  title: "The Walking Tour"
  category: travel
  rarity: common
  hook: conf_sightseeing
  when: { trip: { did: [day_excursion] } }
  repeatable: true
  cooldown: 26
  text:
    - "The walking tour of {city} starts with forty researchers and one guide. Twenty minutes in, there are thirty-one researchers. Nobody knows where the other nine went."
  choices:
    - label: "Stick with the guide"
      text: "You learn the history of {city}, and the guide's opinion of tourists who don't listen. Both are fascinating."
      effects: { sanity: "+3", energy: "-1" }
    - label: "Go find the lost nine"
      check: { stat: network, vs: 40, spread: 20 }
      success:
        text: "You find them in a bakery, arguing about evaluation metrics. You stay for the pastries and the argument."
        effects: { contacts: "+3", sanity: "+3" }
      failure:
        text: "You don't find them, and now you're lost too. You see a lot of {city} trying to get back."
        effects: { energy: "-3", sanity: "+2" }

- id: con_museum
  title: "The Museum"
  category: travel
  rarity: common
  hook: conf_sightseeing
  repeatable: true
  cooldown: 26
  when: { has_advisor: true, trip: { did: [day_sightsee, last_sightsee] } }
  text:
    - "{labmate} drags a few of you to a museum. It turns out to have a whole wing of old calculating machines."
  choices:
    - label: "Spend two hours with the machines"
      text: "You read every label. {labmate} has to pull you away by the sleeve. You leave with a postcard of a 1960s mainframe."
      effects: { sanity: "+4", energy: "-2", labmates_rel: "+2" }
    - label: "Find the café"
      text: "You sit in the museum café while the others look at art. It's the most peaceful hour of the week."
      effects: { energy: "+2", sanity: "+3" }

- id: con_food_adventure
  title: "Where the Locals Eat"
  category: travel
  rarity: common
  hook: conf_sightseeing
  repeatable: true
  cooldown: 26
  text:
