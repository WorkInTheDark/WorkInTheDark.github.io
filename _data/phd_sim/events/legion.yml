  category: legion
  rarity: common
  when: { advisor: [micromanager], project: { stage: [consolidation, revise] } }
  text:
    - "{advisor} asks for the full edit history of your draft of {project}, \"just to understand how you work\". It shows every 2 am session, and every hour of nothing."
