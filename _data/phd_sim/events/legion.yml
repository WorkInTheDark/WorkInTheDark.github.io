        effects: { sanity: "+2±1", coding: "+1", labmates_rel: "+4±1" }
      failure:
        text: "The form works perfectly. The shop's printer does not."
        effects: { sanity: "-2±1", labmates_rel: "+1" }
    - label: "Write it all on a receipt"
