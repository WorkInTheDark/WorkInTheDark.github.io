        effects: { days_next: -1, sanity: "-4±1" }
    - label: "Draft in a private file first"
      text: "Your real writing moves to a file called notes_old.tex. {advisor} notices the history has gone very quiet."
      effects: { sanity: "+3±1", project.quality.C: "+2±1", advisor_rel: "-3±1" }

