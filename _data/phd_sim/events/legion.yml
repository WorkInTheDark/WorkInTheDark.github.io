- id: leg_kf_bubble_tea_order
  title: "Less Ice, Half Sugar"
  category: legion
  rarity: common
  when: { advisor: [kind_funded] }
  text:
    - "{advisor} hands you a bubble tea before you can order: \"Less ice, half sugar, right?\""
  choices:
    - label: "Ask \"How did you remember?\""
