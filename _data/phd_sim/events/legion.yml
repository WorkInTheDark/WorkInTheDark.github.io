      effects: { sanity: "+5±2", paper.score: "+4±2", advisor_rel: "+3±1" }
      flag_clear: [kf_flaw_fixed]
      achievement: saw_it_coming

- id: leg_kf_midnight_comments
  title: "12:07 am"
  category: legion
  rarity: common
  when: { advisor: [kind_funded], project: { stage: consolidation } }
  text:
