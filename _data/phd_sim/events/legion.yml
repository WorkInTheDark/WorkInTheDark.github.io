      text: "Your reply is one sentence and a section number. It is deeply satisfying."
      effects: { sanity: "+6±2", paper.score: "+5±2" }
      flag_clear: [kf_flaw_fixed]
      achievement: saw_it_coming
    - label: "Forward the review to {advisor}"
