  rarity: common
  repeatable: true
  cooldown: 8
  when:
    advisor: [kind_funded]
    semester: [fall, spring]
    stat: { energy: "<40" }
    status_none: [on_internship, sick, at_conference]
  text:
    - "You're tired, and you could join lab meeting on Zoom from your couch. But there's bubble tea in the room."
