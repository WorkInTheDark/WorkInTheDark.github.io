# PhD Simulator: data and annotation events.
# Source ideas: docs/phd-simulator/event-ideas.md, section C (ticked only).
# Schema: docs/phd-simulator/content-spec.md.
#
# Flags set here for careful dataset work (dat_gold_standard,
# dat_guidelines_solid) are what earn dat_standard_benchmark later.

- id: dat_night_annotators
  title: "The 11 pm Shift"
  category: data
  when:
    project: { type: dataset, stage: annotation }
  text:
    - "Your clinician annotators are careful, and only free after their shifts end around 11 pm. The questions start arriving at midnight."
  choices:
    - label: "Be online at 11 pm"
      text: "You answer questions until 1 am, all week. Annotation finishes early, and so does your sleep."
      effects: { energy: "-7±2", health: "-2±1", project.delay: -1, project.quality.S: "+3±1" }
    - label: "This is your hour anyway"
      requires: { traits_any: [night_owl] }
      tag: "Night Owl"
      text: "Midnight is your best hour. The annotators start calling you \"the night desk\"."
      effects: { sanity: "+2±1", project.delay: -1, project.quality.S: "+4±2" }
    - label: "Write a FAQ, answer mornings"
      text: "The FAQ covers most questions. The rest wait until morning, and so does the annotation."
      effects: { writing: "+2±1", project.delay: 1, project.quality.S: "+2±1" }
    - label: "Host a Saturday labeling brunch"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "Bagels work. Six annotators label 400 examples in four hours, and nobody is up past ten."
        effects: { days: -1, network: "+2±1", project.delay: -1 }
      failure:
        text: "Only two annotators show up, so you get excellent bagels and very few labels."
        effects: { days: -1, sanity: "-2±1" }

- id: dat_self_annotate
  title: "500 Examples"
  category: data
  when:
    project: { type: dataset, stage: [guidelines, annotation] }
  text:
    - "It's Friday evening. The annotators start Monday, and you need 500 gold-standard examples to check them against."
  choices:
    - label: "Annotate all 500 this weekend"
      text: "By Sunday night you know this data better than anyone alive. Your eyes would like a word."
      effects: { energy: "-10±3", days: -2, knowledge: "+4±2", project.quality.S: "+6±2", health: "-3±1", sanity: "-2±1" }
      flag_set: [dat_gold_standard]
    - label: "Split them with {labmate}"
      check: { stat: labmates_rel, vs: 50, spread: 15 }
      success:
        text: "They label 250 and find two holes in your guidelines. You buy lunch, and would happily buy ten."
        effects: { energy: "-5±2", days: -1, labmates_rel: "+2±1", project.quality.S: "+5±2" }
        flag_set: [dat_gold_standard]
      failure:
        text: "\"I have a deadline too.\" You do 400 of them alone, more slowly than you'd like."
        effects: { energy: "-8±2", days: -2, sanity: "-3±1", project.quality.S: "+3±1", health: "-2±1" }
    - label: "Do 100, call it a pilot"
      text: "You label 100 careful examples and call it a pilot. Nobody needs to know it was meant to be 500."
      effects: { energy: "-3±1", sanity: "+1", project.quality.S: "+2±1" }

- id: dat_guidelines_v15
  title: "Guidelines v15"
  category: data
  when:
    project: { type: dataset, stage: [guidelines, annotation] }
  text:
    - "You open annotation_guidelines_v15.docx. Version 14 fixed one ambiguity and created two new ones. Agreement went from 0.41 to 0.44."
  choices:
    - label: "Write version 16, properly"
      text: "Version 16 has a decision tree and twelve worked examples. Agreement jumps to 0.71."
      effects: { energy: "-5±2", project.delay: 1, project.quality.S: "+6±2" }
      flag_set: [dat_guidelines_solid]
    - label: "Run a calibration session"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "An hour on ten hard cases gets everyone on the same page. The guidelines barely change, and agreement still climbs."
        effects: { knowledge: "+2±1", project.quality.S: "+6±2" }
        flag_set: [dat_guidelines_solid]
      failure:
        text: "The session turns into a debate about a single example. As far as you know, it's still going."
        effects: { sanity: "-3±1", project.delay: 1 }
    - label: "Freeze v15 and annotate"
      text: "The annotators cheer. The agreement score does not."
      effects: { sanity: "+3±1", project.delay: -1, project.quality.S: "-4±2" }

- id: dat_train_test_dupes
  title: "Seen It Before"
  category: data
  when:
    project: { stage: [experiments, baselines] }
  text:
    - "Your baseline scores suspiciously well. You check: {roll:200-400} test examples also appear in the training set, some with different capitalization."
  choices:
    - label: "Deduplicate and rerun everything"
      text: "Scores drop four points. Now they mean something, and you can say so."
      effects: { energy: "-6±2", days: -2, coding: "+2±1", project.quality.S: "+7±2", health: "-2±1", sanity: "-2±1" }
      flag_set: [dat_clean_split]
    - label: "Report both splits"
      text: "Every table gets two columns, original and deduplicated, and reviewers can see you were careful."
      effects: { energy: "-3±1", project.quality.S: "+4±2", project.quality.C: "-1" }
    - label: "Mention it in a footnote"
      text: "It goes in footnote 7. Someone will find it eventually, probably in a blog post."
      effects: { sanity: "+2±1", project.quality.S: "-4±2" }

- id: dat_standard_benchmark
  title: "A Standard Benchmark"
  category: data
  rarity: rare
  when:
    year: [2, 8]
    flags_any: [dat_guidelines_solid, dat_gold_standard]
    paper: { status: accepted, first_author: true }
  text:
    - "Three new papers this month report results on your dataset, and one calls it \"the standard benchmark\"."
  choices:
    - label: "Host an official leaderboard"
      text: "Submissions arrive at 3 am from every time zone. You're a maintainer now, and people cite you for it."
      effects: { energy: "-5±2", days_next: -2, citations: "+10±4", network: "+4±2" }
    - label: "Start a harder version 2"
      text: "Your plan for v2 is ready before anyone gets close to beating v1."
      effects: { energy: "-4±2", taste: "+3±1", citations: "+6±3" }
    - label: "Just enjoy it"
      text: "You screenshot the sentence that says \"standard benchmark\". Then you screenshot it again."
      effects: { sanity: "+8±3", citations: "+5±2" }

# ---------------------------------------------------------------------------
# Ideas accepted 2026-10-16. The released-dataset events below use the same
# gate as dat_standard_benchmark: careful dataset work (dat_guidelines_solid
# or dat_gold_standard) plus an accepted first-author paper.
# ---------------------------------------------------------------------------

- id: dat_worse_than_chance
  title: "Worse Than Coin Flips"
  category: data
  when:
    project: { type: dataset, stage: [guidelines, annotation] }
  text:
    - "Agreement is fine on every label except \"sarcastic\", where kappa is -0.08. On that one, your annotators agree less often than if they flipped coins."
  choices:
    - label: "Drop the label"
      text: "You're down to six labels, with cleaner data and one less argument at lab meeting."
      effects: { sanity: "+2±1", project.quality.S: "+3±1", project.quality.N: "-3±1" }
    - label: "Redefine it, with examples"
      text: "With twelve examples and one decision rule, agreement climbs to 0.52. For sarcasm, that counts as a party."
      effects: { energy: "-4±2", sanity: "-2±1", project.delay: 1, project.quality.S: "+5±2" }
      flag_set: [dat_guidelines_solid]
    - label: "Study the disagreement itself"
      check: { stat: taste, vs: 55, spread: 20 }
      success:
        text: "The annotators disagree in patterns, by background. The label is subjective, and now you can show it."
        effects: { days: -1, taste: "+2±1", project.quality.N: "+6±2" }
      failure:
        text: "You look for a pattern in the disagreement and find only noise."
        effects: { days: -1, sanity: "-3±1" }

- id: dat_crowd_shortcut
  title: "The Shortcut"
  category: data
  when:
    project: { type: dataset, stage: [annotation, baselines] }
  text:
    - "Your crowdworkers found a shortcut: almost every \"false\" statement they wrote contains the word \"not\". A model that only looks for \"not\" scores {roll:84-92}%."
  choices:
    - label: "Filter out the easy examples"
      text: "You remove everything the shortcut can solve. The dataset shrinks by a third and gets much harder."
      effects: { sanity: "-2±1", project.progress: "-5±2", project.quality.S: "+6±2", project.quality.N: "+2±1" }
    - label: "Re-collect with new instructions"
      text: "\"Please avoid the word not.\" Round two uses \"never\" instead, and round three is a little better."
      effects: { energy: "-2±1", sanity: "-3±1", project.delay: 2, project.quality.S: "+4±2" }
    - label: "Publish the shortcut as analysis"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "You add a section on how the shortcut happened and how to avoid it. A reviewer calls it \"refreshingly honest\"."
        effects: { writing: "+2±1", project.quality.S: "+3±1", project.quality.N: "+3±1" }
      failure:
        text: "It reads as \"the dataset is broken\". Honestly, it reads that way to you too."
        effects: { sanity: "-4±2", project.quality.N: "-3±1" }

- id: dat_annotator_email
  title: "Three Pages, Numbered"
  category: data
  when:
    project: { type: dataset, stage: [guidelines, annotation] }
  text:
    - "An annotator sends you a three-page email, with numbered sections, about the ambiguities in your guidelines. You read it twice. They're right about all of it."
  choices:
    - label: "Rewrite the guidelines with their notes"
      text: "The new version is mostly their email. Agreement jumps, and they get a line in the acknowledgments."
      effects: { energy: "-4±2", sanity: "-2±1", project.delay: 1, project.quality.S: "+6±2" }
      flag_set: [dat_guidelines_solid]
      tip: "Critique-Centric Feedback"
    - label: "Invite them to co-design the guidelines"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "They say yes, and they're brilliant. You gain a collaborator who reads more carefully than you do."
        effects: { days: -1, network: "+3±1", project.quality.S: "+5±2" }
        flag_set: [dat_guidelines_solid]
      failure:
        text: "They're flattered but busy. You do get a fourth page, though."
        effects: { sanity: "-1", project.quality.S: "+2±1" }
    - label: "Fix only the top three issues"
      text: "The worst ambiguities are gone. The email stays starred in your inbox, judging you."
      effects: { energy: "-1", project.quality.S: "+3±1" }

- id: dat_dataset_outcites
  title: "The Data Wins"
  category: data
  rarity: rare
  when:
    year: [3, 8]
    flags_any: [dat_guidelines_solid, dat_gold_standard]
    telemetry: { first_author_pubs: ">=2" }
  text:
    - "Your dataset paper has {roll:3-6} times the citations of your method paper. People love your data, and your method less so."
  choices:
    - label: "Lean in: plan the next dataset"
      text: "If the field wants data, you'll give it data. You sketch version 2 on the bus home."
      effects: { energy: "-2±1", taste: "+2±1", citations: "+3±2" }
    - label: "Give the method paper a push"
      text: "You post a thread and give a talk. The method paper gets a small bump, and you get a small headache."
      effects: { energy: "-4±2", sanity: "-1", presenting: "+1", network: "+2±1", citations: "+3±2" }
    - label: "Be happy either way"
      text: "You update your CV and buy a fancy coffee."
      effects: { sanity: "+5±2", energy: "+2±1" }

- id: dat_biglab_no_cite
  title: "Table 7"
  category: data
  rarity: uncommon
  hook: model_release
  when:
    year: [2, 8]
    flags_any: [dat_guidelines_solid, dat_gold_standard]
    paper: { status: accepted, first_author: true }
  text:
    - "The technical report for {model} uses your dataset, by name, in Table 7. Your paper is not in the references. The report has 400 authors and room for 1,200 citations."
  choices:
    - label: "Email the report's authors"
      check: { stat: network, vs: 50, spread: 20 }
      success:
        text: "A reply within a day: \"Our mistake, fixed in v2.\" Version 2 cites you, and so do the people who read it."
        effects: { sanity: "+3±1", network: "+2±1", citations: "+6±3" }
      failure:
        text: "An auto-reply from a shared inbox. Version 2 comes out, still without you."
        effects: { sanity: "-4±2" }
    - label: "Post about it, politely"
      text: "You write a short, polite post with a screenshot. It travels far, and a lot of people learn your dataset's name."
      effects: { energy: "-2±1", sanity: "-2±1", network: "+2±1", citations: "+4±2" }
    - label: "Let it go"
      text: "Your dataset is in a famous report. That's a kind of citation, if you squint."
      effects: { sanity: "+3±1" }

- id: dat_github_issue
  title: "Issue: Mislabeled"
  category: data
  repeatable: true
  cooldown: 20
  when:
    flags_any: [dat_guidelines_solid, dat_gold_standard]
    paper: { status: accepted, first_author: true }
  text:
    - "A new GitHub issue on your dataset's repo: \"Example 3,412 is mislabeled.\" It has a screenshot and {roll:6-15} thumbs-up."
  choices:
    - label: "Fix it and release v1.1"
      text: "You fix it and thank the reporter in the changelog. Oddly, the dataset now looks more trustworthy."
      effects: { energy: "-3±1", sanity: "-1", network: "+1", citations: "+2±1" }
    - label: "Audit the whole label"
      text: "You find 40 more, and version 1.1 becomes a careful version 2."
      effects: { energy: "-7±2", days: -2, health: "-1", sanity: "-2±1", knowledge: "+2±1", citations: "+4±2" }
    - label: "Reply \"Thanks, will fix soon\""
      text: "True, technically. The issue gains three more thumbs-up while you get around to it."
      effects: { sanity: "+2±1", network: "-1" }

- id: dat_license_rebuild
  title: "No Redistribution"
  category: data
  when:
    project: { type: dataset, stage: [guidelines, annotation, baselines] }
  text:
    - "You finally read your source data's license closely. It says no redistribution, so your dataset can't be released as it is."
  choices:
    - label: "Rebuild it from open sources"
      text: "After weeks of re-collecting and re-annotating, the new dataset is fully releasable, and slightly better."
      effects: { energy: "-6±2", health: "-2±1", sanity: "-4±2", project.progress: "-10±3", project.quality.S: "+3±1" }
    - label: "Release a script that rebuilds it"
      check: { stat: coding, vs: 55, spread: 20 }
      success:
        text: "Users download the source themselves, and your script does the rest. It's legal, if slightly fragile."
        effects: { coding: "+3±1", project.quality.S: "+2±1" }
      failure:
        text: "The script works on your machine. The first three issues on your repo say it doesn't work on theirs."
        effects: { sanity: "-3±1", coding: "+2±1", project.quality.S: "-2±1" }
    - label: "Ask the source for permission"
      check: { stat: network, vs: 50, spread: 20 }
      success:
        text: "The maintainers say yes in a day, delighted that anyone read the license. You frame the email."
        effects: { sanity: "+5±2", network: "+2±1" }
      failure:
        text: "Their lawyer replies six weeks later: no."
        effects: { sanity: "-4±2", project.delay: 1 }
