# Life outside the lab (event-ideas.md, section N).
# Seasonal events use turn windows (calendar: content-spec.md, section 4).
# Arc "cat": lif_cat_adopt -> (lif_cat_foster_end) -> lif_cat_lab_meeting, lif_cat_keyboard.

# --- Housing ---------------------------------------------------------------

- id: lif_lease_renewal
  title: "Lease Renewal"
  category: life
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    turn: [25, 26]
  text:
    - "Your lease renewal arrives. The rent goes up again, by an amount your stipend has never heard of."
    - "Lease renewal season. Your landlord's letter calls the rent increase \"a modest adjustment\"."
  choices:
    - label: "Sign it and sigh"
      text: "You sign. Your budget spreadsheet gets a new row called \"fewer takeout nights\"."
      effects: { sanity: "-4±1" }
    - label: "Negotiate with the landlord"
      check: { stat: presenting, vs: 55, spread: 20 }
      success:
        text: "You point out the broken heater and the mystery leak. The increase gets cut in half."
        effects: { sanity: "+3±1", presenting: "+1" }
      failure:
        text: "Your landlord listens kindly and changes nothing."
        effects: { sanity: "-4±1", days: -1 }
    - label: "Move somewhere cheaper"
      text: "Three viewings and a rented van later, you have a cheaper place and a longer commute."
      effects: { days: -3, energy: "-6±2", sanity: "+3±1", health: "-2±1" }

- id: lif_roommate_drums
  title: "The Drummer"
  category: life
  rarity: common
  text:
    - "Your roommate's new hobby is drums. They practice every evening from 8 to 10, which used to be your writing time."
  choices:
    - label: "Buy noise-canceling headphones"
      text: "The drums become a distant thud. You can almost think again."
      effects: { sanity: "+2±1", energy: "-1" }
    - label: "Work late at the lab instead"
      text: "The lab is quiet at night. You start seeing your labmates more than your friends."
      effects: { energy: "-3±1", labmates_rel: "+2±1", friends_rel: "-2±1" }
    - label: "Ask for a practice schedule"
      check: { stat: friends_rel, vs: 45, spread: 20 }
      success:
        text: "They agree to weekends only. In return, you agree to come to their first gig."
        effects: { sanity: "+4±1", friends_rel: "+3±1" }
      failure:
        text: "They agree, and by Wednesday the drums are back."
        effects: { sanity: "-3±1", friends_rel: "-2±1" }
    - label: "Join in on bass"
      requires: { traits_any: [musician] }
      tag: "Musician"
      text: "Your roommate is thrilled. Within a week you have a band and a terrible name for it."
      effects: { sanity: "+7±2", friends_rel: "+4±1", days: -1 }

- id: lif_move_deadline_week
  title: "Moving Week"
  category: life
  rarity: uncommon
  when:
    project: { turns_to_deadline: "<=1" }
  text:
    - "Your lease ends the same week as your deadline for {project}. The boxes are packed, and the paper is not."
  choices:
    - label: "Move everything in one weekend"
      text: "Two days of stairs and tape. On Monday your back hurts, and so does the draft."
      effects: { days: -2, energy: "-8±3", project.progress: "-6±2", health: "-2±1", sanity: "-2±1" }
    - label: "Ask the lab to help, buy pizza"
      text: "Four labmates and six pizzas get you moved in one afternoon. You owe everyone a favor."
      effects: { days: -1, energy: "-4±1", labmates_rel: "+4±2" }
    - label: "Live out of boxes until the deadline"
      text: "You write the paper sitting on a box labeled KITCHEN, with your laptop on one labeled BOOKS."
      effects: { sanity: "-5±2", health: "-2±1" }

# --- Seasons and holidays ------------------------------------------------------

- id: lif_first_snow
  title: "First Snow"
  category: life
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    turn: [6, 10]
  text:
    - "The first snow of the year. Your walk to the lab takes twice as long, and you arrive looking like a snowman."
  choices:
    - label: "Work from home today"
      text: "You write all day in warm socks, and it goes surprisingly well."
      effects: { sanity: "+3±1", labmates_rel: "-1" }
    - label: "Trudge in anyway"
      text: "You arrive soaked. The lab is empty except for {labmate}, who also trudged in."
      effects: { energy: "-4±1", labmates_rel: "+2±1" }
    - label: "Build a snowman with the lab"
      text: "It wears a lab badge and holds a sign that says REVIEWER 2. Everyone takes a photo."
      effects: { sanity: "+5±2", labmates_rel: "+3±1", days: -1 }

- id: lif_first_warm_day
  title: "First Warm Day"
  category: life
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    turn: [15, 17]
  text:
    - "The first warm day of spring. You walk into the lab at 10 am and nobody is there. Everyone is outside on the grass."
  choices:
    - label: "Join them outside"
      text: "The whole lab lies in the sun, talking about anything but work. It's the best lab meeting of the year."
      effects: { sanity: "+6±2", energy: "+3±1", labmates_rel: "+2±1", days: -1 }
    - label: "Enjoy the empty lab"
      text: "You have the lab to yourself and get a lot done. It gets a little lonely by lunch."
      effects: { coding: "+2±1", sanity: "-1" }
    - label: "Read papers on the grass"
      text: "You read two papers in the sun. You remember both of them better than usual."
      effects: { knowledge: "+2±1", sanity: "+3±1", energy: "+2±1" }

- id: lif_thanksgiving_dinner
  title: "Lab Thanksgiving"
  category: life
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    turn: [7, 7]
  text:
    - "{senior} hosts a Thanksgiving potluck for everyone in the lab who can't fly home."
  choices:
    - label: "Bring a dish you can actually cook"
      text: "Your dish is gone in ten minutes. Several people ask for the recipe."
      effects: { labmates_rel: "+4±1", sanity: "+4±1", days: -1 }
    - label: "Bring a store-bought pie"
      text: "Nobody judges the pie, and it's the first dish to run out."
      effects: { labmates_rel: "+2±1", sanity: "+3±1" }
    - label: "Stay home and write"
      text: "You get a good writing day. The group chat fills with photos of food."
      effects: { sanity: "-3±1", labmates_rel: "-2±1" }
    - label: "Cook something ambitious"
      requires: { traits_any: [foodie] }
      tag: "Foodie"
      text: "Your dish is the talk of the evening. People from two other labs show up just to try it."
      effects: { labmates_rel: "+6±2", sanity: "+5±1", network: "+2±1", days: -1 }

- id: lif_lunar_new_year
  title: "Lunar New Year"
  category: life
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    turn: [11, 12]
  text:
    - "{labmate} invites the lab over to make dumplings for Lunar New Year."
  choices:
    - label: "Fold dumplings until midnight"
      text: "Your first dumplings look like modern art. By the fortieth, they look like dumplings."
      effects: { labmates_rel: "+4±1", sanity: "+5±2", days: -1 }
    - label: "Come for dinner, leave early"
      text: "You eat a lot of dumplings and are home by nine."
      effects: { labmates_rel: "+2±1", sanity: "+3±1" }
    - label: "Send wishes and keep working"
      text: "You send a red envelope emoji to the group chat, then watch the dumpling photos roll in."
      effects: { sanity: "-2±1", labmates_rel: "-1" }

- id: lif_winter_break_home
  title: "Home for the Holidays"
  category: life
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    turn: [9, 9]
  text:
    - "Home for winter break. Over dinner, a relative asks when you'll graduate. Everyone stops eating to hear the answer."
  choices:
    - label: "Give a confident date"
      text: "\"Two more years.\" Everyone is pleased. You will hear this date again next year."
      effects: { family_rel: "+3±1", sanity: "-2±1" }
    - label: "Explain how a PhD works"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "Your explanation lands. An aunt says it sounds like a startup with no money, which is fair."
        effects: { family_rel: "+5±2", presenting: "+1" }
      failure:
        text: "Ten minutes in, someone asks if you could just finish early."
        effects: { family_rel: "+1", sanity: "-3±1" }
    - label: "Ask about your cousin's new job"
      text: "The table turns to your cousin. You get a quiet second helping of dessert."
      effects: { sanity: "+3±1", family_rel: "+1" }

- id: lif_fix_printer
  title: "The Printer"
  category: life
  rarity: common
  when:
    turn: [7, 12]
  text:
    - "You explain your research to your relatives over the holidays. They listen carefully, then ask if you can fix their printer."
  choices:
    - label: "Fix the printer"
      check: { stat: coding, vs: 45, spread: 20 }
      success:
        text: "You fix it in five minutes. You are now the family's AI expert and IT department."
        effects: { family_rel: "+5±2", sanity: "+2±1" }
      failure:
        text: "Two hours later, the printer prints one page and stops forever. Nobody blames you, out loud."
        effects: { family_rel: "+2±1", energy: "-3±1" }
    - label: "Explain your research again"
      text: "Second try: \"I help computers understand people.\" That one sticks."
      effects: { presenting: "+2±1", family_rel: "+2±1" }
    - label: "Recommend a new printer"
      text: "They buy a new one online, and you end up setting it up anyway."
      effects: { family_rel: "+2±1", sanity: "+1" }

# --- Cat arc --------------------------------------------------------------

- id: lif_cat_adopt
  title: "A Cat Named Baseline"
  category: life
  rarity: uncommon
  arc: cat
  when:
    flags_none: [cat_adopted, cat_fostering]
  text:
    - "A shelter near campus posts a photo of a grumpy gray cat named Baseline. Baseline needs a quiet home with someone who works from home a lot."
  choices:
    - label: "Adopt Baseline"
      text: "Baseline inspects the apartment and moves in by sitting on your printed draft."
      effects: { sanity: "+8±3", days: -1 }
      flag_set: [cat_adopted]
      trait_add: cat_person
      achievement: cat_person
      schedule:
        - { event: lif_cat_lab_meeting, in: [2, 5], chance: 1.0 }
        - { event: lif_cat_keyboard, in: [6, 12], chance: 1.0 }
    - label: "Foster for a month first"
      text: "Baseline arrives on a trial basis. Baseline does not seem to know it's a trial."
      effects: { sanity: "+4±2" }
      flag_set: [cat_fostering]
      schedule: { event: lif_cat_foster_end, in: [2, 2], chance: 1.0 }
    - label: "Not with these deadlines"
      text: "You close the tab. Baseline finds a home with fewer deadlines a week later."
      effects: { sanity: "-1" }

- id: lif_cat_foster_end
  title: "The Trial Ends"
  category: life
  rarity: common
  trigger: scheduled
  arc: cat
  when:
    flags_all: [cat_fostering]
  text:
    - "The foster month is over. Baseline has claimed your desk chair and your favorite sweater."
  choices:
    - label: "Make it official"
      text: "You sign the papers. Baseline celebrates by knocking a pen off your desk."
      effects: { sanity: "+6±2" }
      flag_set: [cat_adopted]
      flag_clear: [cat_fostering]
      trait_add: cat_person
      achievement: cat_person
      schedule:
        - { event: lif_cat_lab_meeting, in: [2, 5], chance: 1.0 }
        - { event: lif_cat_keyboard, in: [6, 12], chance: 1.0 }
    - label: "Return Baseline to the shelter"
      text: "The shelter finds Baseline a family within a week. Your chair is yours again, and a little too empty."
      effects: { sanity: "-4±2", days: 1 }
      flag_clear: [cat_fostering]

- id: lif_cat_lab_meeting
  title: "Guest Speaker"
  category: life
  rarity: common
  trigger: scheduled
  arc: cat
  when:
    flags_all: [cat_adopted]
  text:
    - "Halfway through your video update at lab meeting, Baseline sits on your keyboard and blocks the camera. After that, nobody asks about your results, only the cat's name."
  choices:
    - label: "Introduce Baseline properly"
      text: "Baseline gets a round of applause. Your results get a follow-up meeting."
      effects: { labmates_rel: "+4±1", sanity: "+3±1" }
    - label: "Close the door and carry on"
      text: "Baseline meows through the rest of your update. Your slides have never had a louder audience."
      effects: { presenting: "+1", sanity: "-2±1" }
    - label: "Make Baseline the lab mascot"
      text: "By Friday, Baseline is the lab's Slack icon, and {labmate} is printing stickers."
      effects: { labmates_rel: "+5±2", sanity: "+4±1", days: -1 }

- id: lif_cat_keyboard
  title: "Submitted by Baseline"
  category: life
  rarity: common
  trigger: scheduled
  arc: cat
  when:
    flags_all: [cat_adopted]
  text:
    - "You leave a half-written peer review open and go make tea. Baseline walks across the keyboard. The review is now submitted, with a score of 1 and the comment \"jjjjjjjjjjjjjjj;\"."
  choices:
    - label: "Email the area chair and confess"
      check: { stat: writing, vs: 45, spread: 20 }
      success:
        text: "The area chair reopens it and writes back, \"Please thank the cat for its time.\""
        effects: { sanity: "+3±1", network: "+2±1" }
      failure:
        text: "The area chair reopens it three days later. You rewrite the whole review over the weekend."
        effects: { days: -1, sanity: "-2±1" }
    - label: "Edit the review before the deadline"
      text: "The system still allows edits. Baseline's version stays in the history log forever."
      effects: { days: -1, energy: "-2±1", writing: "+1" }
    - label: "Leave it. Baseline has a point."
      text: "Somewhere, an author gets the shortest review of their life. You and Baseline sleep well."
      effects: { sanity: "+4±1", network: "-3±1" }

# --- Family and friends ------------------------------------------------------

- id: lif_parents_visit
  title: "Where You Work"
  category: life
  rarity: uncommon
  when:
    semester: [fall, spring, summer]
  text:
    - "Your parents visit for a week and want to see \"where you work\". You think about your desk and its collection of empty coffee cups."
  choices:
    - label: "Give them the full lab tour"
      text: "They meet your labmates and take a photo of your name on the door."
      effects: { days: -2, family_rel: "+6±2", sanity: "+3±1", labmates_rel: "+2±1" }
    - label: "Show them the nice library"
      text: "The library is beautiful and dignified. Your parents assume your desk looks like this."
      effects: { days: -1, family_rel: "+3±1", sanity: "+2±1" }
    - label: "Skip campus, show them the city"
      text: "You spend the week on good food and long walks. They still don't know what you do, and nobody minds."
      effects: { days: -3, family_rel: "+5±2", sanity: "+6±2", energy: "+2±1" }

- id: lif_dating_app
  title: "\"So What Do You Do?\""
  category: life
  rarity: common
  text:
    - "A dating-app match asks what you do. You type \"PhD student\", and the conversation ends there."
    - "Your dating-app match asks what you do. You say \"PhD.\" They reply \"oh\" and are never heard from again."
  choices:
    - label: "Try \"I teach computers to read\""
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "A new match asks a follow-up question, then another. You have a coffee date on Saturday."
        effects: { sanity: "+5±2", friends_rel: "+1", days: -1 }
      failure:
        text: "\"So you're the reason my phone autocorrects everything?\" That one ends too."
        effects: { sanity: "-2±1" }
    - label: "Delete the app, go to trivia night"
      text: "Your friends' team wins on a history-of-computing question that you answered."
      effects: { friends_rel: "+4±1", sanity: "+3±1", days: -1 }
    - label: "Put the phone down and work"
      text: "You get some work done. The paper, at least, never asks what you do."
      effects: { sanity: "-1", friends_rel: "-1" }

- id: lif_long_distance
  title: "Twelve Hours Apart"
  category: life
  rarity: common
  repeatable: true
  cooldown: 10
  when:
    origin: international
  text:
    - "Your family is twelve time zones away. When you wake up, they're going to bed. When they wake up, you're debugging."
  choices:
    - label: "Call at 7 am before the lab"
      text: "A sleepy, happy call. Your mom asks if you're eating. You say yes, which is mostly true."
      effects: { energy: "-3±1", family_rel: "+5±2", sanity: "+2±1" }
    - label: "Call at midnight after work"
      text: "Their breakfast is your midnight dinner, and the call runs long."
      effects: { health: "-1", family_rel: "+4±1", sanity: "+3±1" }
    - label: "Trade voice messages"
      text: "The conversation stretches over a whole day, one message at a time. It's nearly as good as a call."
      effects: { family_rel: "+2±1", sanity: "+1" }

- id: lif_friend_promoted
  title: "Same Day"
  category: life
  rarity: uncommon
  hook: after_reject
  text:
    - "The same day {paper} is rejected from {venue}, your undergrad friend posts about their second promotion this year."
  choices:
    - label: "Send a sincere congratulations"
      text: "You mean it, mostly. They write back, \"Your stuff is way cooler though.\""
      effects: { friends_rel: "+4±1", sanity: "-2±1" }
    - label: "Mute the group chat for a day"
      text: "You take a day off from everyone's good news. Tomorrow you'll be happy for them."
      effects: { sanity: "+2±1", friends_rel: "-2±1" }
    - label: "Congratulate them, invite them to dinner"
      text: "They pay, to celebrate, and you talk about everything except reviews."
      effects: { friends_rel: "+5±2", sanity: "+4±1", days: -1 }

- id: lif_friend_wedding
  title: "The Wedding Weekend"
  category: life
  rarity: uncommon
  when:
    project: { turns_to_deadline: "<=1" }
  text:
    - "Your close friend's wedding is the same weekend as your submission deadline for {project}. The invitation has been on your fridge for months."
  choices:
    - label: "Go and enjoy every minute"
      text: "You dance badly and toast well. On Monday you are behind and happy about it."
      effects: { days: -3, friends_rel: "+6±2", sanity: "+7±2", project.progress: "-8±3" }
    - label: "Go to the ceremony, skip the party"
      text: "You hug the couple after the vows and catch the last train home to write."
      effects: { days: -1, friends_rel: "+3±1", sanity: "+2±1", energy: "-3±1" }
    - label: "Send a gift and a video toast"
      text: "Your video toast plays between dinner and dessert. You watch the replay at 2 am, still writing."
      effects: { friends_rel: "-3±1", sanity: "-2±1" }

# --- Things that break ---------------------------------------------------------

- id: lif_laptop_dies
  title: "Black Screen"
  category: life
  rarity: uncommon
  when:
    project: { turns_to_deadline: "<=1" }
  text:
    - "The week before your deadline for {project}, your laptop makes a soft clicking noise and never turns on again."
  choices:
    - label: "Restore from your backup"
      check: { stat: coding, vs: 50, spread: 20 }
      success:
        text: "Your nightly backup has everything up to last night. You lose one paragraph and zero sleep."
        effects: { days: -1, sanity: "+2±1" }
      failure:
        text: "Your last backup is from March, when the paper was still an outline."
        effects: { project.progress: "-15±4", sanity: "-8±3" }
    - label: "Rebuild from Git and Overleaf"
      text: "The code is on Git and the paper is on Overleaf. The figures were only on your desktop."
      effects: { days: -2, energy: "-5±2", project.progress: "-5±2", sanity: "-2±1" }
    - label: "Borrow {labmate}'s old laptop"
      check: { stat: labmates_rel, vs: 50, spread: 20 }
      success:
        text: "{labmate} hands over a slow laptop covered in stickers. It runs, and you owe them big."
        effects: { days: -1, labmates_rel: "+2±1" }
      failure:
        text: "{labmate}'s laptop is from 2015 and needs updates for a day before it does anything."
        effects: { days: -2, sanity: "-3±1" }

- id: lif_phone_cracks
  title: "Cracked"
  category: life
  rarity: common
  hook: conference
  repeatable: true
  cooldown: 13
  text:
    - "On the first morning in {city}, your phone slips out of your hand on the convention center stairs. The screen is now a spider web."
  choices:
    - label: "Tape it and carry on"
      text: "The tape covers the cracks and half the conference app. You navigate by asking strangers."
      effects: { sanity: "-2±1", network: "+2±1" }
    - label: "Find a repair shop in {city}"
      text: "The repair shop is two hours across town. You get a new screen and miss the morning session."
      effects: { energy: "-4±1", sanity: "+2±1", network: "-2±1" }
    - label: "Go phone-free for the trip"
      text: "Without a phone, you talk to everyone at the coffee breaks. It's the best conference you've had."
      effects: { network: "+4±2", sanity: "+2±1", energy: "-2±1" }

- id: lif_free_pizza
  title: "Free Pizza"
  category: life
  rarity: common
  repeatable: true
  cooldown: 8
  when:
    semester: [fall, spring]
  text:
    - "A seminar on medieval tax records is offering free pizza. You have no interest in medieval tax records, and you go anyway."
    - "There's free pizza at a seminar on bridge corrosion, a topic you know nothing about. You get there early."
    - "A poster in the elevator says \"Soil Acoustics Seminar, Free Pizza\". You only read the second half."
  choices:
    - label: "Take two slices and slip out"
      text: "That's lunch sorted, and you're fairly sure nobody saw you leave."
      effects: { energy: "+3±1", sanity: "+1" }
    - label: "Stay for the whole talk"
      text: "The speaker uses a method you've never seen. It might work on your data, too."
      effects: { days: -1, knowledge: "+2±1", taste: "+2±1" }
    - label: "Stay and ask a question"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "Your question is good. The speaker asks to grab coffee, and now you know someone in a whole other field."
        effects: { network: "+3±1", presenting: "+1", energy: "+2±1" }
      failure:
        text: "Your question was answered on slide 4. You eat a third slice in silence."
        effects: { sanity: "-2±1", energy: "+3±1" }

# --- Round 5 additions ---------------------------------------------------------
# Arc "half_marathon": lif_running_start -> lif_running_long_run -> lif_running_race.
# Arc "party": lif_party_kitchen -> lif_party_dinner.

- id: lif_houseplant
  title: "Still Alive"
  category: life
  rarity: uncommon
  when:
    year: [2, 2]
    turn: [1, 4]
  text:
    - "The desk plant you bought during orientation has survived a whole year, including a heat wave and your idea of a watering schedule."
  choices:
    - label: "Repot it into something bigger"
      text: "It grows a new leaf in its new pot the following week."
      effects: { sanity: "+4±1", energy: "-1" }
    - label: "Buy it some friends"
      text: "You buy three more plants, and the lab starts calling your desk the greenhouse."
      effects: { sanity: "+3±1", labmates_rel: "+2±1", energy: "-2±1" }
    - label: "Add it to your acknowledgments draft"
      text: "It goes on the list, between your parents and the GPU cluster."
      effects: { sanity: "+2±1", writing: "+1" }

- id: lif_running_start
  title: "Just a Short Run"
  category: life
  rarity: uncommon
  arc: half_marathon
  when:
    has_advisor: true
  text:
    - "A run to clear your head works better than any meeting this month. {labmate} mentions a half-marathon in three months, with a beginner training plan that is \"very gentle\"."
  choices:
    - label: "Sign up for the half-marathon"
      text: "You pay the entry fee before you can change your mind. The plan says Tuesday is \"easy 5k\"."
      effects: { health: "+3±1", sanity: "+2±1", energy: "-2±1" }
      flag_set: [half_marathon]
      schedule: { event: lif_running_long_run, in: [3, 4], chance: 1.0 }
    - label: "Run when you feel like it"
      text: "You run a loop by the river whenever the week gets loud."
      effects: { health: "+2±1", sanity: "+2±1" }
    - label: "One run was plenty"
      text: "Your shoes go back in the closet. Your legs thank you, and so does your calendar."
      effects: { energy: "+2±1" }

- id: lif_running_long_run
  title: "The Long Run"
  category: life
  rarity: common
  trigger: scheduled
  arc: half_marathon
  when:
    flags_all: [half_marathon]
  text:
    - "Week six of the training plan says \"long run, 16 km, Sunday morning\". Your legs have opinions about this, and so does your inbox."
  choices:
    - label: "Do the long run"
      text: "Sixteen kilometers. You think through a whole paper on the way and forget it by the shower."
      effects: { health: "+4±1", sanity: "+3±1", energy: "-4±1" }
      schedule: { event: lif_running_race, in: [2, 3], chance: 1.0 }
    - label: "Swap it for two short runs"
      text: "Two short runs are less heroic, but they still count, more or less."
      effects: { health: "+2±1", sanity: "+1" }
      schedule: { event: lif_running_race, in: [2, 3], chance: 1.0 }
    - label: "Defer the race to next year"
      text: "You email the organizers. The training plan goes in a drawer, and your Sundays come back."
      effects: { energy: "+3±1", sanity: "-1" }
      flag_clear: [half_marathon]

- id: lif_running_race
  title: "Race Day"
  category: life
  rarity: common
  trigger: scheduled
  arc: half_marathon
  when:
    flags_all: [half_marathon]
  text:
    - "Race day: 21 kilometers and a crowd with handmade signs. At kilometer 15, {labmate} holds one up: \"REVIEWER 2 IS RIGHT BEHIND YOU.\""
  choices:
    - label: "Go for a fast time"
      check: { stat: health, vs: 60, spread: 20 }
      success:
        text: "You finish strong and a little teary. The medal goes on your monitor, where visitors can't miss it."
        effects: { health: "+4±1", sanity: "+8±2", energy: "-4±1" }
        flag_clear: [half_marathon]
      failure:
        text: "You start too fast and walk kilometers 17 to 19. You still finish, and you still get the medal."
        effects: { sanity: "+3±1", energy: "-7±2" }
        flag_clear: [half_marathon]
    - label: "Run easy and enjoy it"
      text: "You high-five every kid on the course and finish in your slowest time, grinning."
      effects: { health: "+3±1", sanity: "+6±2", energy: "-4±1" }
      flag_clear: [half_marathon]
    - label: "Run the last 5 km with {labmate}"
      text: "{labmate} jumps in at kilometer 16, in jeans. You cross the line together, and the photo goes in the lab chat."
      effects: { health: "+2±1", sanity: "+5±1", labmates_rel: "+3±1", energy: "-5±1" }
      flag_clear: [half_marathon]

- id: lif_party_kitchen
  title: "The Kitchen at the Party"
  category: life
  rarity: uncommon
  weight: 2
  arc: party
  text:
    - "At a friend's party, you end up talking to someone in the kitchen for an hour. They ask good questions about your research and don't flinch at the word \"PhD\"."
  choices:
    - label: "Ask for their number"
      text: "They type it into your phone themselves, with a dinosaur emoji. You walk home slower than usual."
      effects: { sanity: "+3±1", friends_rel: "+1" }
      flag_set: [party_crush]
      schedule: { event: lif_party_dinner, in: [1, 2], chance: 1.0 }
    - label: "Keep talking about your research"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "At midnight they're still interested, so you swap numbers on the way out."
        effects: { sanity: "+3±1", presenting: "+1" }
        flag_set: [party_crush]
        schedule: { event: lif_party_dinner, in: [1, 2], chance: 1.0 }
      failure:
        text: "Somewhere around inter-annotator agreement, they spot a friend across the room."
        effects: { sanity: "-2±1" }
    - label: "Head home early, deadline tomorrow"
      text: "You go home and write, and the draft gets better. You think about the kitchen conversation all week."
      effects: { energy: "+2±1", sanity: "-1" }

- id: lif_party_dinner
  title: "Saturday Dinner?"
  category: life
  rarity: common
  trigger: scheduled
  arc: party
  when:
    flags_all: [party_crush]
  text:
    - "The person from the party texts: dinner on Saturday? Saturday is also when you'd planned to finish your related-work section."
  choices:
    - label: "Say yes to dinner"
      text: "Dinner turns into a long walk, then a second date. Related work can wait, and it does."
      effects: { sanity: "+6±2", days: -1 }
      status: { add: in_love, turns: 4 }
      flag_clear: [party_crush]
      flag_set: [dating]
      schedule: { event: lif_partner_trip, in: [4, 8], chance: 1.0 }
    - label: "Suggest coffee on Sunday instead"
      text: "Coffee turns into lunch. You're taking it slow, and that suits you both."
      effects: { sanity: "+4±1", friends_rel: "+2±1" }
      flag_set: [dating]
      schedule: { event: lif_partner_trip, in: [6, 10], chance: 1.0 }
      status: { add: in_love, turns: 2 }
      flag_clear: [party_crush]
    - label: "Say you're swamped this month"
      text: "They say \"good luck with it\" and mean it. You finish related work on Saturday, alone with a citation manager."
      effects: { writing: "+2±1", sanity: "-2±1" }
      flag_clear: [party_crush]

- id: lif_cooking_phase
  title: "Meal Prep Era"
  category: life
  rarity: common
  when:
    has_advisor: true
  text:
    - "You're in a cooking phase. Sunday is meal-prep day now: 14 identical containers and a spreadsheet of macros you'll never open."
  choices:
    - label: "Keep the streak going"
      text: "Lentils on Monday, lentils on Friday. You've never had more energy, or more lentils."
      effects: { health: "+4±1", energy: "+3±1", days: -1 }
    - label: "Cook for the lab on Wednesdays"
      text: "Your curry becomes a lab tradition. {labmate} starts bringing a fork from home."
      effects: { labmates_rel: "+4±1", health: "+2±1", energy: "-2±1", days: -1 }
    - label: "Let the phase end gracefully"
      text: "Sunday is yours again. By Thursday, dinner is cereal, eaten standing up."
      effects: { health: "-2±1", days: 1 }
    - label: "Go full chef"
      requires: { traits_any: [foodie] }
      tag: "Foodie"
      text: "Your containers have garnishes. People from other labs ask whether you take orders."
      effects: { sanity: "+5±1", labmates_rel: "+3±1", health: "+3±1", days: -1 }

- id: lif_hike_idea
  title: "An Idea and a Sunburn"
  category: life
  rarity: common
  when:
    any:
      - { turn: [1, 6] }
      - { turn: [15, 24] }
    project: { stage_kind: work }
  text:
    - "You go hiking with friends and leave the laptop at home. Near the top, the fix for {project} arrives fully formed, along with a sunburn."
  choices:
    - label: "Type it into your phone right there"
      text: "You write it at the summit with one bar of signal and a red nose. On Monday, it still makes sense."
      effects: { project.quality.N: "+5±2", sanity: "+2±1", health: "+1" }
    - label: "Call {labmate} from the trail"
      text: "{labmate} picks up on the third try and tests half of it by Monday. Your friends roll their eyes all the way down."
      effects: { project.progress: "+6±2", labmates_rel: "+2±1", friends_rel: "-2±1", health: "+1" }
    - label: "Enjoy the view and trust your memory"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "On Monday the idea is still there, and the rest has made it better."
        effects: { project.quality.N: "+6±2", sanity: "+5±1", health: "+2±1" }
        tip: "When and How to Rest"
      failure:
        text: "On Monday you remember the view and the sunburn, but not the idea."
        effects: { sanity: "-3±1", health: "+2±1" }

- id: lif_rec_league
  title: "The PhD League"
  category: life
  rarity: common
  when:
    semester: [fall, spring]
  text:
    - "You join an intramural soccer team. Every single player is a PhD student. Half-time talk is about p-values, and the captain picks the lineup with a script."
  choices:
    - label: "Play every Thursday"
      check: { stat: health, vs: 45, spread: 20 }
      success:
        text: "You lose every game by at least four goals. It's the best part of your week."
        effects: { health: "+5±1", friends_rel: "+3±1", energy: "-3±1" }
      failure:
        text: "In the second game, you sprain an ankle chasing a ball you were never going to reach. The team signs your brace."
        effects: { health: "-3±1", friends_rel: "+2±1", sanity: "-1" }
        status: { add: injured, turns: 2 }
    - label: "Cheer from the sideline"
      text: "You hold the snacks and shout encouragement. The team votes you most valuable non-player."
      effects: { sanity: "+3±1", friends_rel: "+2±1" }
    - label: "Model the team's win probability"
      requires: { traits_any: [stats_nerd] }
      tag: "Stats Nerd"
      text: "Your model gives the team a 2% chance. They win anyway, and you update your priors in front of everyone."
      effects: { sanity: "+4±1", friends_rel: "+3±1", knowledge: "+1" }

- id: lif_halloween_reviewer2
  title: "Reviewer 2, Times Six"
  category: life
  rarity: common
  when:
    has_advisor: true
    turn: [5, 5]
  text:
    - "Halloween at the lab. Six people show up as Reviewer 2, each with a red pen and a sign that says \"The novelty is limited.\" Nobody coordinated."
  choices:
    - label: "Go as Reviewer 2 as well"
      text: "Seven Reviewer 2s. The group photo looks like a very harsh program committee."
      effects: { labmates_rel: "+3±1", sanity: "+3±1" }
    - label: "Go as the area chair"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "You overrule all six of them with one sticky note. Best costume is yours."
        effects: { labmates_rel: "+4±1", sanity: "+5±1" }
      failure:
        text: "Nobody knows what an area chair looks like. Several people think you're a delivery driver."
        effects: { labmates_rel: "+1", sanity: "+1" }
    - label: "Skip the party, finish a draft"
      text: "You hear the laughter through the wall. The draft gets a page longer and a little grumpier."
      effects: { writing: "+2±1", labmates_rel: "-2±1", sanity: "-2±1" }

# Arc "partner" (2026-10-24): after lif_party_dinner -> lif_partner_trip -> lif_partner_meets_lab,
# then lif_partner_time_zones at a conference and lif_partner_two_body at graduation.
- id: lif_partner_trip
  title: "The Weekend Away"
  category: life
  rarity: common
  trigger: scheduled
  arc: partner
  when: { flags_all: [dating] }
  text:
    - "They found a cabin two hours north with no Wi-Fi, for the weekend before your paper's internal deadline."
  choices:
    - label: "Go, and leave the laptop at home"
      text: "Two days of lake, card games and nobody asking about results. You come back to the draft with fresh eyes."
      effects: { sanity: "+8±2", energy: "+4±1", days: -1 }
      flag_set: [partner]
      schedule: { event: lif_partner_meets_lab, in: [4, 7], chance: 1.0 }
    - label: "Go, and bring the laptop just in case"
      text: "You open it twice. They notice both times and say nothing, which is worse."
      effects: { sanity: "+2±1", energy: "-1" }
      schedule: { event: lif_partner_meets_lab, in: [4, 7], chance: 1.0 }
    - label: "Ask to go after the deadline instead"
      text: "\"Of course,\" they say. By then the cabin is booked, so you go to a diner instead, and it's lovely anyway."
      effects: { sanity: "+3±1" }
      schedule: { event: lif_partner_meets_lab, in: [6, 9], chance: 1.0 }

- id: lif_partner_meets_lab
  title: "They Meet the Lab"
  category: life
  rarity: common
  trigger: scheduled
  arc: partner
  when: { flags_any: [dating, partner], has_advisor: true }
  text:
    - "At the lab's end-of-semester dinner, your partner sits between {labmate} and a postdoc. Twenty minutes in, they lean over: \"So what does a PhD actually do all day?\""
  choices:
    - label: "Explain your research in one sentence"
      check: { stat: presenting, vs: 50, spread: 20 }
      success: { text: "They get it, then explain it back to {labmate} better than you did. The table applauds.", effects: { presenting: "+2±1", sanity: "+3±1", labmates_rel: "+2±1" }, flag_set: [partner] }
      failure: { text: "Four minutes and one napkin diagram later, they nod politely and ask for the bread.", effects: { presenting: "+1", sanity: "+1" }, flag_set: [partner] }
    - label: "Let {labmate} tell the lab's stories instead"
      text: "{labmate} tells the one about the GPU that caught fire. Your partner laughs all the way home."
      effects: { labmates_rel: "+3±1", sanity: "+3±1" }
      flag_set: [partner]

- id: lif_partner_time_zones
  title: "Nine Hours Apart"
  category: life
  rarity: uncommon
  hook: conference
  weight: 2
  arc: partner
  when: { flags_all: [partner] }
  text:
    - "Your talk at {venue} ends at 4 pm in {city}, which is 7 am at home. Your partner got up early to hear how it went."
  choices:
    - label: "Call before the conference dinner"
      text: "You tell them about the hardest question and how you answered it. They're the only person who asks how you're sleeping."
      effects: { sanity: "+4±1", network: "-1" }
    - label: "Send a voice memo and go to the dinner"
      text: "The dinner gets you two new collaborators. Your partner replies with a voice memo of their own, mostly about the cat."
      effects: { network: "+2±1", sanity: "+1" }

- id: lif_partner_two_body
  title: "The Two-Body Problem"
  category: life
  rarity: common
  hook: graduation
  weight: 4
  arc: partner
  when: { flags_all: [partner], flags_none: [two_body_done] }
  text:
    - "You have offers, and none of them are in the city where your partner works."
  choices:
    - label: "Only apply where you can both work"
      text: "Your list gets shorter. Your partner makes a spreadsheet of cities with both kinds of jobs. It's the most romantic spreadsheet you've ever seen."
      effects: { sanity: "+4±1", career_prep: "-1" }
      flag_set: [two_body_done, two_body_together]
      achievement: two_body
    - label: "Take the best offer and try long distance"
      text: "You buy a lot of plane tickets and learn every time-zone trick there is. It's hard, and it holds."
      effects: { sanity: "-3±1", career_prep: "+2" }
      flag_set: [two_body_done, two_body_distance]
    - label: "Ask what they want first"
      text: "It turns out they wanted to move somewhere new anyway. You start reading about cities you'd never considered."
      effects: { sanity: "+5±2" }
      flag_set: [two_body_done, two_body_together]
      achievement: two_body

# Arc "home" (2026-10-24): lif_home_call -> lif_home_recovery -> lif_home_graduation at commencement.
- id: lif_home_call
  title: "A Call from Home"
  category: life
  rarity: uncommon
  arc: home
  when: { has_advisor: true, year: [2, 6] }
  text:
    - "Your sibling calls during group meeting, which they never do. Your parent is in the hospital: stable, they say, but you should know."
  choices:
    - label: "Fly home this week"
      text: "You spend four days in a hospital cafeteria with your laptop closed. Your parent is mostly worried that you're missing work."
      effects: { days: -3, family_rel: "+6±2", sanity: "-2±1", energy: "-4±1" }
      schedule: { event: lif_home_recovery, in: [4, 7], chance: 1.0 }
    - label: "Stay, and call every evening"
      text: "You call every night at nine. The paper moves forward slowly, and so does the worry."
      effects: { family_rel: "+2±1", sanity: "-5±2" }
      schedule: { event: lif_home_recovery, in: [4, 7], chance: 1.0 }
    - label: "Ask {advisor} for two weeks off"
      text: "{advisor} says, \"Go, and don't check email.\" You go, and you mostly don't."
      effects: { days: -5, family_rel: "+5±2", advisor_rel: "+1", sanity: "+1" }
      schedule: { event: lif_home_recovery, in: [4, 7], chance: 1.0 }

- id: lif_home_recovery
  title: "Back on Their Feet"
  category: life
  rarity: common
  trigger: scheduled
  arc: home
  text:
    - "Your parent sends a video: walking around the block, slowly, waving at the camera. Underneath it says \"Don't worry, study hard.\""
  choices:
    - label: "Plan a visit home for the holidays"
      text: "You book the flights that night, before you can talk yourself out of it."
      effects: { family_rel: "+3±1", sanity: "+4±1" }
      flag_set: [home_recovered]
    - label: "Send back a video of your lab"
      text: "You film your desk, the coffee machine and {labmate} waving. Your parent watches it four times."
      effects: { family_rel: "+3±1", sanity: "+3±1", labmates_rel: "+1" }
      flag_set: [home_recovered]

- id: lif_home_graduation
  title: "They Flew In"
  category: life
  rarity: common
  hook: graduation
  weight: 4
  arc: home
  when: { flags_all: [home_recovered] }
  text:
    - "Your parent, fully recovered, is in the third row at commencement, filming the whole thing on a phone held sideways."
  choices:
    - label: "Find them before the ceremony ends"
      text: "You get hugged in your robe in front of everyone. You don't mind at all."
      effects: { family_rel: "+5±1", sanity: "+5±1" }
      flag_set: [home_graduation]
    - label: "Take them to see your lab afterward"
      text: "You show them your desk, the whiteboard and your name on a paper on the wall. They take a picture of all of it."
      effects: { family_rel: "+5±1", sanity: "+4±1" }
      flag_set: [home_graduation]
