- id: rev_emergency_review
  title: "Emergency Reviewer Needed"
  category: reviews
  rarity: common
  repeatable: true
  cooldown: 13
  when:
    year: [2, 8]
  text:
    - "9 pm. An area chair writes: a reviewer dropped out, and could you possibly review one paper by noon tomorrow? \"It's short,\" they add. It's 14 pages."
  choices:
    - label: "Say yes and do it properly"
      text: "You finish at 3 am. The area chair thanks you by name, which is the most an area chair can do."
      effects: { energy: "-6±2", sanity: "-4±1", health: "-2±1", network: "+3±1", knowledge: "+1" }
    - label: "Say yes, keep it short"
      text: "A fair, short review, in by 11:58 am. Your best paragraph is about Figure 2."
      effects: { energy: "-3±1", sanity: "-2±1", network: "+1" }
    - label: "Decline kindly"
      text: "Someone else gets the email next. You sleep fine, mostly."
      effects: { sanity: "+1", network: "-1" }

- id: rev_old_reviewer_follows
  title: "New Follower"
  category: reviews
  rarity: uncommon
  when:
    telemetry: { rejections: ">=1" }
  text:
    - "A new follower on social media. Their latest post complains about \"papers that ignore obvious baselines\", in the exact words of the review that rejected your last paper."
  choices:
    - label: "Follow back"
      text: "They like your next paper thread within a minute. Peer review is anonymous. The internet, less so."
      effects: { network: "+2±1", sanity: "-2±1" }
    - label: "Mute them"
      text: "Out of sight. Your feed is calmer, and you stop reading their posts for clues."
      effects: { sanity: "+2±1" }
    - label: "Post a thread about your baselines"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "The thread does well, and they like it. You will never know if they noticed."
        effects: { network: "+3±1", citations: "+2±1", sanity: "+1" }
      failure:
        text: "The thread gets four likes. One is from them, which is somehow worse."
        effects: { sanity: "-3±1" }
