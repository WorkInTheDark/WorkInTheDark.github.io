# PhD Simulator: events around reviews, rebuttals and decisions.
# Source ideas: docs/phd-simulator/event-ideas.md, section E (ticked only).
# Schema: docs/phd-simulator/content-spec.md.
#
# Review-content ideas (the reviewer who cites seven papers by one author,
# LLM-written reviews, "incremental" citing a paper from after the deadline,
# the concern already answered in Section 3, the model released last week,
# the request for a larger study) live in _data/phd_sim/reviews.yml as
# personas and concerns, not here.
#
# Hooks used here:
#   reviews_in    binds {paper} and {venue}; before the rebuttal
#   after_submit  binds {paper} and {venue}; desk rejects need a bound paper
#   after_accept  binds {paper} and {venue}
#   after_reject  binds {paper} and {venue}
#   turn          everything else
#
# telemetry rebuttals >= 1 is used as a proxy for "this paper had a rebuttal".

# ===========================================================================
# Reviews arrive (hook: reviews_in)
# ===========================================================================

- id: rev_well_written_two
  title: "Well Written. Score: 2."
  category: reviews
  rarity: common
  hook: reviews_in
  text:
    - "Reviewer 3: \"The paper is well written, well motivated, and the experiments are thorough.\" Overall score: 2."
    - "One review praises your writing for a full paragraph, lists two minor typos, and gives {paper} a 2."
  choices:
    - label: "Ask what would change their mind"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "Your question is short and polite. The reviewer admits they \"expected more\" and raises the score half a point."
        effects: { paper.score: "+3±1", sanity: "+1" }
      failure:
        text: "Your question gets no answer. The 2 stays a 2, mysterious and well written."
        effects: { sanity: "-2±1" }
    - label: "Flag the mismatch to the area chair"
      check: { stat: writing, vs: 60, spread: 20 }
      success:
        text: "The area chair agrees that the review's text doesn't support its score, and weighs it less."
        effects: { paper.score: "+4±2" }
      failure:
        text: "The area chair reads your note as a complaint about a low score, which, to be fair, it is."
        effects: { paper.score: "-2±1", sanity: "-2±1" }
    - label: "Spend your effort on the others"
      text: "You leave Reviewer 3 alone and answer the other two carefully. Sometimes a 2 is just a 2."
      effects: { paper.score: "+1", sanity: "+1" }

# ===========================================================================
# Desk rejects (hook: after_submit, the only hook that binds the new paper)
# The anonymous-repo desk reject is merged into wri_anonymize_repo
# (events/writing.yml). Every desk-reject outcome grants desk_rejected.
# ===========================================================================

- id: rev_desk_one_line
  title: "One Line Over"
  category: reviews
  rarity: rare
  hook: after_submit
  text:
    - "A week after you submit, the program chairs write: {paper} runs one line onto page 9, past the 8-page limit. It is desk-rejected."
  choices:
    - label: "Appeal, politely"
      check: { stat: writing, vs: 80, spread: 15 }
      success:
        text: "On a second look, the stray line belongs to the Limitations section, which doesn't count toward the limit. Reinstated, with apologies."
        effects: { sanity: "+4±2" }
      failure:
        text: "The chairs reply kindly and firmly: the limit is the limit. You count the lines on page 8. Exactly enough."
        effects: { paper.desk_reject: true, sanity: "-8±3" }
        achievement: desk_rejected
    - label: "Tell the lab the whole story"
      text: "The lab laughs with you, mostly. Two labmates quietly recount their own page limits."
      effects: { paper.desk_reject: true, sanity: "-4±2", labmates_rel: "+3±1" }
      achievement: desk_rejected
    - label: "Fix it and move on"
      text: "Two lines gone in five minutes, and a sticky note on your monitor: \"COUNT THE PAGES.\" The paper waits for the next cycle."
      effects: { paper.desk_reject: true, sanity: "-6±2", writing: "+2±1" }
      achievement: desk_rejected

# Arc: the acknowledgments slip
#   rev_desk_acknowledgments (after_submit)
#     -> hope nobody reads them -> rev_desk_ack_caught (scheduled, 60%)
- id: rev_desk_acknowledgments
  title: "Thanks, Everyone"
  category: reviews
  rarity: uncommon
  hook: after_submit
  arc: ack_slip
  when:
    flags_none: [anonymity_checklist]
  text:
    - "Rereading the submitted PDF, you reach the last page. The acknowledgments, which you meant to delete, thank your lab by name and list your grant number."
  choices:
    - label: "Tell the chairs yourself"
      check: { stat: writing, vs: 30, spread: 20 }
      success:
        text: "The chairs thank you for reporting it, strip the paragraph, and let the paper through."
        effects: { sanity: "+2±1" }
        flag_set: [anonymity_checklist]
      failure:
        text: "The chairs thank you for your honesty. The policy, unfortunately, has no honesty clause. Desk rejected."
        effects: { paper.desk_reject: true, sanity: "-8±3" }
        achievement: desk_rejected
        flag_set: [anonymity_checklist]
    - label: "Ask your advisor what to do"
      requires: { has_advisor: true }
      check: { stat: advisor_rel, vs: 45, spread: 20 }
      success:
        text: "Your advisor replies in four minutes: \"Tell the chairs. Now.\" You do, and they let it through."
        effects: { sanity: "+1", advisor_rel: "+1" }
        flag_set: [anonymity_checklist]
      failure:
        text: "Your advisor is on a long flight. By the time they land, the chairs have found it. Desk rejected."
        effects: { paper.desk_reject: true, sanity: "-8±3" }
        achievement: desk_rejected
        flag_set: [anonymity_checklist]
    - label: "Hope nobody reads acknowledgments"
      text: "You close the PDF. Surely nobody reads the acknowledgments. You check your email a lot this week."
      effects: { sanity: "-2±1" }
      flag_set: [ack_unreported]
      schedule: { event: rev_desk_ack_caught, in: [1, 2], chance: 0.6 }

- id: rev_desk_ack_caught
  title: "Someone Read the Acknowledgments"
  category: reviews
  rarity: uncommon
  trigger: scheduled
  arc: ack_slip
  when:
    paper: { status: under_review }
    flags_all: [ack_unreported]
  text:
    - "An email from the program chairs: they read the acknowledgments. {paper} is desk-rejected for breaking anonymity."
  choices:
    - label: "Start a pre-submission checklist"
      text: "Item one: delete the acknowledgments. Item two: check item one. The checklist will outlive the paper."
      effects: { paper.desk_reject: true, sanity: "-6±2", writing: "+1" }
      achievement: desk_rejected
      flag_clear: [ack_unreported]
      flag_set: [anonymity_checklist]
    - label: "Warn the lab"
      text: "Three labmates quietly open their own drafts and delete their acknowledgments. You may have saved someone else's paper."
      effects: { paper.desk_reject: true, sanity: "-5±2", labmates_rel: "+3±1" }
      achievement: desk_rejected
      flag_clear: [ack_unreported]
      flag_set: [anonymity_checklist]

- id: rev_desk_todo
  title: "[TODO]"
  category: reviews
  rarity: uncommon
  hook: after_submit
  when:
    flags_none: [anonymity_checklist]
  text:
    - "Scrolling the submitted PDF, you find it on page 6, in red: \"[TODO: rerun with new seeds - {labmate}]\". A real name, in an anonymous submission. The portal closes in nine minutes."
  choices:
    - label: "Delete it and re-upload, fast"
      check: { stat: energy, vs: 45, spread: 20 }
      success:
        text: "One deleted line, one recompile, and the new PDF lands with 40 seconds to spare. Your heart rate takes longer to recover."
        effects: { sanity: "-2±1" }
        flag_set: [anonymity_checklist]
      failure:
        text: "The upload finishes at 12:00:07, and the portal keeps the old PDF. A week later, the paper is desk-rejected."
        effects: { paper.desk_reject: true, sanity: "-10±3" }
        achievement: desk_rejected
        flag_set: [anonymity_checklist]
    - label: "Email the chairs and explain"
      check: { stat: writing, vs: 40, spread: 20 }
      success:
        text: "The chairs accept a corrected PDF. They've seen worse, they say, and they list some."
        effects: { sanity: "+1" }
        flag_set: [anonymity_checklist]
      failure:
        text: "The chairs are sympathetic and firm. The name was visible to reviewers, so the paper is desk-rejected."
        effects: { paper.desk_reject: true, sanity: "-10±3" }
        achievement: desk_rejected
        flag_set: [anonymity_checklist]

# ===========================================================================
# Acceptances (hook: after_accept)
# ===========================================================================

- id: rev_accept_lab_meeting
  title: "Accepted, Mid-Slide"
  category: reviews
  rarity: common
  hook: after_accept
  when:
    has_advisor: true
  text:
    - "Halfway through lab meeting, while {labmate} presents, your phone lights up: \"{venue} decision: Accept.\""
  choices:
    - label: "Wait until {labmate} finishes"
      text: "You sit on the news for 25 minutes. When you share it at the end, the room cheers, and {labmate} cheers loudest."
      effects: { sanity: "+4±2", labmates_rel: "+3±1" }
    - label: "Announce it right now"
      text: "The room cheers. {labmate}'s ablation slide never quite recovers."
      effects: { sanity: "+6±2", labmates_rel: "-2±1" }
    - label: "Slide your phone to {advisor}"
      text: "{advisor} reads it, nods once, and keeps a straight face for nine more minutes. Then announces it to the room."
      effects: { sanity: "+4±2", advisor_rel: "+3±1" }

- id: rev_score_raised
  title: "Score Raised"
  category: reviews
  rarity: common
  hook: after_accept
  when:
    telemetry: { rebuttals: ">=1" }
  text:
    - "In the final reviews you see it: Reviewer 3 raised their score from 2.5 to 3.5. \"The new analysis addresses my concern.\" It made the difference."
  choices:
    - label: "Write down what convinced them"
      text: "Their concern was right. Fixing it made the paper better, not just the score. You save the note for next time."
      effects: { writing: "+2±1", taste: "+1" }
      tip: "Critique-Centric Feedback"
    - label: "Screenshot it for the lab chat"
      text: "The lab chat fills with celebration emoji. {labmate} asks to see your response, for science."
      effects: { sanity: "+5±2", labmates_rel: "+2±1" }
    - label: "Move the analysis into the main text"
      text: "The new analysis becomes Figure 4. Readers will find it, and so will citations."
      effects: { paper.citations: "+3±1", energy: "-3±1", days: -1 }

- id: rev_camera_ready_promises
  title: "Promises, Promises"
  category: reviews
  rarity: common
  hook: after_accept
  when:
    telemetry: { rebuttals: ">=1" }
  text:
    - "The camera-ready is due in two weeks. Your rebuttal promised a new baseline, an error analysis, and a clearer Figure 2."
  choices:
    - label: "Deliver every promise"
      text: "Everything you promised is in. Reviewer 2 will never check. You did it anyway, and your advisor noticed."
      effects: { days: -3, energy: "-7±2", advisor_rel: "+4±2", paper.citations: "+3±1", health: "-2±1", sanity: "-3±1" }
      tip: "Deliver Your Commitments"
    - label: "Deliver the main ones"
      text: "The baseline and the figure make it in. The error analysis becomes \"future work\"."
      effects: { days: -1, energy: "-3±1", advisor_rel: "-1" }
    - label: "Submit it as accepted"
      text: "Nobody stops you. Your advisor notices the missing error analysis and says nothing, which is worse."
      effects: { sanity: "+3±1", advisor_rel: "-5±2", network: "-1" }

- id: rev_fourth_submission
  title: "Fourth Time"
  category: reviews
  rarity: uncommon
  weight: 3.0
  hook: after_accept
  when:
    paper: { submissions: ">=4" }
  text:
    - "{paper} has been rejected so many times it has its own folder of reviews. This time, all three reviews are positive. One calls it \"timely\"."
  choices:
    - label: "Frame the acceptance email"
      text: "It goes on the wall by your desk, above a sticky note that says \"resubmit\"."
      effects: { sanity: "+10±3" }
      trait_add: rejection_hardened
    - label: "Reread the first round of reviews"
      text: "Round one said the paper wasn't ready. Round one was right. It's a much better paper now."
      effects: { sanity: "+6±2", taste: "+3±1" }
      trait_add: rejection_hardened
      tip: "Sustain Through the Journey"
    - label: "Thank everyone who read all four"
      text: "Your advisor and {labmate} have read every version. You buy the first round, and they make you tell the whole story."
      effects: { sanity: "+7±2", labmates_rel: "+3±1", advisor_rel: "+2±1" }
      trait_add: rejection_hardened

- id: rev_best_paper_nomination
  title: "Nominated"
  category: reviews
  rarity: rare
  hook: after_accept
  text:
    - "The acceptance comes with a Best Paper nomination. For two months you rehearse a 30-second thank-you. At the ceremony, another paper wins."
  choices:
    - label: "Clap, sincerely"
      text: "The winning paper is very good. You clap, and someone behind you whispers that yours was their favorite."
      effects: { sanity: "+2±1", network: "+3±1" }
    - label: "Add \"nominee\" to your CV"
      text: "Best Paper Nominee. It counts. It absolutely counts."
      effects: { sanity: "+3±1", career_prep: "+2" }
    - label: "Read the winner on the flight home"
      text: "It's excellent. You fill two pages with ideas, and only one of them is \"why not us\"."
      effects: { taste: "+3±1", sanity: "-1" }
      tip: "Self-Motivation"

- id: rev_outstanding_paper
  title: "Outstanding Paper"
  category: reviews
  rarity: legendary
  hook: after_accept
  when:
    paper: { tier: top }
  text:
    - "A second email from the chairs, two weeks after the acceptance: {paper} has been selected for an Outstanding Paper Award at {venue}."
  choices:
    - label: "Read it five times, then call home"
      text: "Your family doesn't know what the award is. They are prouder than anyone at the conference will be."
      effects: { sanity: "+15±4", family_rel: "+5±2", paper.citations: "+30±8" }
      achievement: best_paper
    - label: "Rebuild the talk from scratch"
      text: "An award paper gets a full room. You rewrite the talk for it, and it's the best one you've ever given."
      effects: { sanity: "+12±3", energy: "-5±2", presenting: "+5±2", network: "+4±2", paper.citations: "+35±10" }
      achievement: best_paper
      status: { add: in_the_zone, turns: 2 }
    - label: "Post the news"
      text: "Your post is shared by people you've only ever cited. Your inbox fills with invitations and one recruiter."
      effects: { sanity: "+12±3", network: "+6±2", career_prep: "+3", paper.citations: "+40±12" }
      achievement: best_paper

# ===========================================================================
# Rejections (hook: after_reject)
# ===========================================================================

- id: rev_meta_engages_with_two
  title: "4, 4, and 2"
  category: reviews
  rarity: common
  hook: after_reject
  text:
    - "Scores: 4, 4 and 2. The meta-review summarizes the 2, quotes the 2, and recommends rejection."
  choices:
    - label: "Write to the senior area chair"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "A thoughtful reply: the meta-review \"could have engaged more with the positive reviews.\" The decision stands, but you feel heard."
        effects: { sanity: "+4±2" }
      failure:
        text: "A template reply thanks you for your feedback on the review process."
        effects: { sanity: "-3±1" }
    - label: "Reread the 2 for anything real"
      text: "Under the tone, one point is real. You fix it, and the next version is harder to reject."
      effects: { taste: "+2±1", writing: "+1", sanity: "-1" }
      tip: "Critique-Centric Feedback"
    - label: "Resubmit next cycle, same paper"
      text: "New reviewers, new odds. You attach a short response to the old reviews and hope for two 4s and a quiet third."
      effects: { sanity: "+2±1" }

- id: rev_no_rebuttal_replies
  title: "Read by Nobody"
  category: reviews
  rarity: common
  hook: after_reject
  when:
    telemetry: { rebuttals: ">=1" }
  text:
    - "You wrote a careful response with two new experiments. Not one reviewer replied, and the meta-review repeats the concerns you answered."
  choices:
    - label: "Put the new experiments in the paper"
      text: "The rebuttal experiments go into the next version. This time, someone has to read them."
      effects: { writing: "+1", taste: "+1", sanity: "-1" }
    - label: "Report it to the chairs"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "The chairs acknowledge that the reviewers didn't engage, and make a note. It changes nothing, and helps anyway."
        effects: { sanity: "+3±1" }
      failure:
        text: "An auto-reply, then nothing. You have now written two documents nobody read."
        effects: { sanity: "-3±1" }
    - label: "Close the laptop for the evening"
      text: "You make dinner, call a friend, and don't open the reviews again until Monday."
      effects: { energy: "+3±1", sanity: "+4±2", friends_rel: "+2±1" }

- id: rev_score_lowered
  title: "In Light of the Other Reviews"
  category: reviews
  rarity: uncommon
  hook: after_reject
  when:
    telemetry: { rebuttals: ">=1" }
  text:
    - "Reviewer 1 had given a 3.5. After reading Reviewer 2, they lowered it to 2.5: \"I agree with R2's concerns.\" You had answered R2's concerns."
  choices:
    - label: "File a review issue report"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "The area chair acknowledges the score change was never explained. The decision stands, but the note goes on record."
        effects: { sanity: "+3±1" }
      failure:
        text: "Your report is filed. So, apparently, is everything else."
        effects: { sanity: "-3±1" }
    - label: "Fix R2's concern anyway"
      text: "Annoyingly, the fix makes the paper better. R2 was rude, but not entirely wrong."
      effects: { taste: "+2±1", writing: "+1", sanity: "-2±1", energy: "-2±1" }
    - label: "Vent to {labmate}"
      text: "{labmate} once had a reviewer lower a score twice. You feel better, and slightly worse about science."
      effects: { sanity: "+3±1", labmates_rel: "+2±1" }
    - label: "Shrug. You've seen worse."
      requires: { telemetry: { rejections: ">=3" } }
      text: "Three rejections ago, this would have ruined your week. Today it ruins an afternoon, at most."
      effects: { sanity: "+2±1" }
      trait_add: rejection_hardened

- id: rev_decision_at_dinner
  title: "Decision at Dinner"
  category: reviews
  rarity: uncommon
  hook: after_reject
  text:
    - "Your phone buzzes halfway through dinner with your family. It's the {venue} decision, and it's a no. Everyone has already seen your face."
  choices:
    - label: "Tell them what happened"
      text: "Nobody at the table knows what a meta-review is. They are outraged on your behalf anyway, and it helps."
      effects: { sanity: "+4±2", family_rel: "+4±2" }
    - label: "\"Just work stuff.\""
      text: "Nobody believes you. You skip dessert and reread the reviews under the table."
      effects: { sanity: "-3±1", family_rel: "-2±1" }
    - label: "Explain peer review, in full"
      text: "Twenty minutes later, your uncle has a theory about Reviewer 2. It's not wrong."
      effects: { sanity: "+2±1", family_rel: "+2±1", presenting: "+2±1" }

# ===========================================================================
# Any turn (hook: turn)
# ===========================================================================

- id: rev_chi_revise_resubmit
  title: "Revise and Resubmit"
  category: reviews
  rarity: common
  weight: 2.0
  when:
    turn: [5, 8]
    paper: { status: revise_resubmit }
  text:
    - "{venue} says Revise and Resubmit. The reviewers' list of changes would rewrite half of {paper}, and the revision is due right after the holidays."
  choices:
    - label: "Rewrite half the paper"
      text: "New framing, new analysis, a new discussion section. It's nearly a new paper, and a better one."
      effects: { days: -3, energy: "-8±3", sanity: "-4±2", paper.score: "+6±2", writing: "+2±1", health: "-2±1" }
      tip: "Critique-Centric Feedback"
    - label: "Fix only the must-fix list"
      text: "You make the required changes and explain the rest in the response letter. Solid, not dazzling."
      effects: { days: -1, energy: "-3±1", paper.score: "+3±1" }
    - label: "Split the rewrite with {labmate}"
      check: { stat: labmates_rel, vs: 55, spread: 15 }
      success:
        text: "{labmate} takes the related work and the discussion. Two people, one voice, half the time."
        effects: { days: -1, energy: "-4±2", paper.score: "+5±2", labmates_rel: "+1" }
      failure:
        text: "{labmate}'s half is good, but in a completely different voice. The paper now has two personalities."
        effects: { days: -2, energy: "-4±2", paper.score: "+2±1", labmates_rel: "-2±1", sanity: "-2±1" }

- id: rev_review_ten
  title: "Ten Papers, Two Weeks"
  category: reviews
  rarity: uncommon
  repeatable: true
  cooldown: 13
  when:
    year: [2, 8]
  text:
    - "An area chair asks you to review ten papers. Reviews are due in two weeks."
    - "Reviewing assignments are out: ten papers, two weeks, and one of them is 40 pages with appendices."
  choices:
    - label: "Review all ten, properly"
      text: "Ten careful reviews. The area chair remembers your name, and you learn more about why papers get rejected than your own rejections taught you."
      effects: { days: -4, energy: "-6±2", knowledge: "+3±1", taste: "+2±1", network: "+2±1", health: "-2±1", sanity: "-3±1" }
    - label: "Take three, decline seven"
      text: "Three thorough reviews, on time. The area chair thanks you for saying no early."
      effects: { days: -1, knowledge: "+1", network: "+1", sanity: "-2±1" }
    - label: "Accept all ten and skim"
      text: "Your reviews are short; one is three sentences. The area chair notices. Somewhere, you've just become someone's Reviewer 2."
      effects: { days: -1, sanity: "-2±1", network: "-2±1" }

# New work landing on your plate (2026-10-16): these raise Stress.
- id: rev_journal_request
  title: "Would You Be Willing to Review?"
  category: reviews
  rarity: common
  repeatable: true
  cooldown: 10
  when: { year: [2, 8], has_advisor: true }
  text:
    - "A journal editor writes: \"Would you be willing to review this manuscript? We'd appreciate your comments within 21 days.\" It's 48 pages."
    - "Your advisor forwards a review request with one line: \"You'd be great for this.\" It's due in three weeks."
  choices:
    - label: "Accept and do it properly"
      text: "Three evenings, one careful review, and a new appreciation for clear figures."
      effects: { sanity: "-4±1", energy: "-3±1", knowledge: "+2±1", network: "+2±1" }
    - label: "Accept, then forget until the reminder"
      text: "The reminder arrives. Then the second reminder. You write it in one panicked night."
      effects: { sanity: "-5±2", energy: "-4±1", health: "-1" }
    - label: "Decline politely"
      text: "You suggest a labmate instead. The editor thanks you for the quick reply."
      effects: { sanity: "+1" }

# ===========================================================================
# Round 5 (2026-10-16): the rest of section E, and R5.3 (bad news around
# submissions and decisions).
#
# "Accepted to Findings: take it or resubmit?" is the engine's own Findings
# decision (engine/milestones.js). rev_findings_counts is what comes after
# you take it.
#
# rev_rr_new_reviewer stands for "rejected after a Revise and Resubmit": a
# top-tier rejection at turn 10 is only ever CHI's second round (deadline T1,
# final decision T10), since no condition reads the review round directly.
# ===========================================================================

# ---------------------------------------------------------------------------
# Reviews arrive (hook: reviews_in)
# ---------------------------------------------------------------------------

- id: rev_portal_refresh
  title: "Slight Delay"
  category: reviews
  rarity: common
  hook: reviews_in
  repeatable: true
  cooldown: 26
  text:
    - "Reviews for {paper} were due Monday. A banner on the portal says \"slight delay\". By Thursday your lab refreshes it in shifts, and at 1 am they appear."
  choices:
    - label: "Read them right now"
      text: "You read every word at 1 am and start the response by 2. A head start, and a headache."
      effects: { paper.score: "+2±1", energy: "-3±1", sanity: "-3±1" }
    - label: "Sleep first, read with coffee"
      text: "Seven more hours of not knowing. The reviews are the same in the morning, and you're kinder to them."
      effects: { energy: "+3±1", sanity: "+1" }
    - label: "Let {labmate} read them first"
      check: { stat: labmates_rel, vs: 45, spread: 20 }
      success:
        text: "{labmate} sends a summary: \"Two fair, one weird, all fixable.\" Exactly the dose you needed."
        effects: { sanity: "+3±1", labmates_rel: "+1" }
      failure:
        text: "{labmate}'s summary is one word long: \"oof\"."
        effects: { sanity: "-4±1" }

- id: rev_same_reviewer
  title: "Welcome Back, Reviewer"
  category: reviews
  rarity: uncommon
  hook: reviews_in
  when:
    paper: { submissions: ">=2" }
  text:
    - "Reviewer 2's review of {paper} opens with the same sentence as last cycle's Reviewer 3. Same typo, too. They're back."
  choices:
    - label: "Show them you fixed what they asked"
      check: { stat: writing, vs: 45, spread: 20 }
      success:
        text: "Point by point, their old concerns, each one fixed. You can almost hear them nod."
        effects: { paper.score: "+5±2", energy: "-2±1" }
      failure:
        text: "They've moved on. This cycle's concerns are all new, and you spent your response on the old ones."
        effects: { paper.score: "+1", energy: "-2±1", sanity: "-3±1" }
    - label: "Treat it as a fresh review"
      text: "You answer it like any other. They don't need to know that you know."
      effects: { paper.score: "+2±1" }
    - label: "Tell the AC it's a repeat reviewer"
      check: { stat: writing, vs: 60, spread: 20 }
      success:
        text: "The area chair reads the old and new reviews side by side and notices how much the paper has changed."
        effects: { paper.score: "+4±2" }
      failure:
        text: "The area chair replies that reviewers are allowed to review a paper twice. They are."
        effects: { paper.score: "-1", sanity: "-2±1" }

- id: rev_three_sentences
  title: "Confidence: 5"
  category: reviews
  rarity: common
  hook: reviews_in
  repeatable: true
  cooldown: 26
  text:
    - "Reviewer 3's review of {paper} is three sentences long. Score: 1. Confidence: 5. The third sentence is \"Not convincing.\""
  choices:
    - label: "Ask the AC to weigh it lightly"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "The area chair agrees that three sentences can't carry a 1, and says so in the meta-review."
        effects: { paper.score: "+4±2", sanity: "+1" }
      failure:
        text: "The area chair replies that confidence 5 means confidence 5."
        effects: { paper.score: "-1", sanity: "-3±1" }
    - label: "Answer it like a full review"
      text: "Three sentences get three careful answers. Nobody will ever read that review as closely as you just did."
      effects: { paper.score: "+3±1", energy: "-4±1", sanity: "-2±1" }
    - label: "Spend the rebuttal on the other two"
      text: "You thank Reviewer 3 in one line and give your best work to the reviewers who gave theirs."
      effects: { paper.score: "+2±1", energy: "-1" }

- id: rev_more_or_fewer
  title: "More, Please. Fewer, Please."
  category: reviews
  rarity: common
  hook: reviews_in
  text:
    - "Reviewer 1: \"Too many experiments; the main story gets lost.\" Reviewer 3: \"More experiments are needed.\" Both are about Section 5 of {paper}."
  choices:
    - label: "Side with one of them"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "You side with the reviewer the area chair seems to agree with. It shows in the meta-review."
        effects: { paper.score: "+4±1" }
      failure:
        text: "You side with the reviewer the area chair didn't. The other reviewer notices, too."
        effects: { paper.score: "-2±1", sanity: "-2±1" }
    - label: "Find the careful middle"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "Fewer experiments in the main text, more in the appendix. Both reviewers can read it as a win."
        effects: { paper.score: "+4±1", energy: "-3±1" }
      failure:
        text: "Your middle ground pleases neither. Both reply \"partially addressed\"."
        effects: { paper.score: "+1", energy: "-3±1", sanity: "-2±1" }
    - label: "Let the area chair sort it out"
      text: "One neutral line points out the contradiction. Settling it is the area chair's job, and sometimes they do it."
      effects: { paper.score: "+1", sanity: "+2±1" }

- id: rev_compare_to_yourself
  title: "Compare With Yourself"
  category: reviews
  rarity: uncommon
  hook: reviews_in
  when:
    telemetry: { first_author_pubs: ">=1" }
  text:
    - "Reviewer 2 asks why {paper} doesn't compare against a paper from last year. That paper is yours. The review is anonymous, so you can't just say \"that's us\"."
  choices:
    - label: "Compare to it, politely"
      text: "You run your old method as a baseline and describe it in the third person. It loses, gracefully."
      effects: { paper.score: "+3±1", energy: "-4±1", sanity: "-2±1" }
    - label: "Flag it confidentially to the AC"
      check: { stat: writing, vs: 45, spread: 20 }
      success:
        text: "The area chair sees the problem at once and tells Reviewer 2 the comparison is already in the paper, in spirit."
        effects: { paper.score: "+3±1", sanity: "+1" }
      failure:
        text: "The area chair writes back: \"Please address the reviewer's concern in your response.\""
        effects: { sanity: "-3±1" }
    - label: "Add the citation and sigh"
      text: "A self-citation, requested by Reviewer 2. Technically, it counts."
      effects: { paper.score: "+1", citations: "+1", sanity: "-1" }

- id: rev_late_fourth_review
  title: "The Fourth Review"
  category: reviews
  rarity: uncommon
  hook: reviews_in
  text:
    - "Two days into the rebuttal period, a fourth review of {paper} appears, marked \"emergency\". It's the shortest of the four, and the harshest."
  choices:
    - label: "Answer it first"
      text: "It gets your best paragraph, right at the top. The other three get slightly shorter answers."
      effects: { paper.score: "+3±1", energy: "-2±1", sanity: "-3±1" }
    - label: "Note that it came late"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "One neutral sentence about the timing. The area chair weighs the late review accordingly."
        effects: { paper.score: "+3±1" }
      failure:
        text: "The note reads as a complaint. The area chair weighs it accordingly."
        effects: { paper.score: "-2±1", sanity: "-2±1" }
    - label: "Treat it like the others"
      text: "Four reviews, four calm answers. The late one doesn't get to set the tone."
      effects: { paper.score: "+2±1", energy: "-2±1", sanity: "+1" }

- id: rev_character_limit
  title: "2,500 Characters"
  category: reviews
  rarity: common
  hook: reviews_in
  repeatable: true
  cooldown: 26
  text:
    - "The rebuttal limit is 2,500 characters. Your draft reply to Reviewer 2 alone is 6,000."
  choices:
    - label: "Cut to your three strongest points"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "Three points, each a claim and a number. It's the best thing you've written all month."
        effects: { paper.score: "+4±1", writing: "+2±1", energy: "-3±1" }
      failure:
        text: "Three points, but you cut the numbers and kept the adjectives."
        effects: { paper.score: "+1", writing: "+1", energy: "-3±1", sanity: "-1" }
    - label: "Write it like a telegram"
      text: "\"Baseline added STOP Table 3 fixed STOP thank you STOP\". It fits. Whether it charms anyone is another matter."
      effects: { paper.score: "+1", sanity: "+2±1" }
    - label: "Answer only Reviewer 2"
      text: "Reviewer 2 gets 2,500 careful characters. Reviewers 1 and 3 get nothing, and they may notice."
      effects: { paper.score: "+2±1", sanity: "-1" }

- id: rev_control_condition
  title: "Where's the Control?"
  category: reviews
  rarity: common
  hook: reviews_in
  when:
    any:
      - { flags_any: [clinical_partner] }
      - { project: { type: [study, system] } }
  text:
    - "Reviewer 1 likes {paper} but wants a control condition. Without one, they can't tell whether your tool helped or your participants were just being nice."
  choices:
    - label: "Defend the design"
      check: { stat: knowledge, vs: 50, spread: 20 }
      success:
        text: "You explain why a formative study doesn't need a control, with two citations. Reviewer 1 accepts it."
        effects: { paper.score: "+3±1" }
      failure:
        text: "Your defense is correct and a little defensive. Reviewer 1 is unmoved."
        effects: { paper.score: "-1", sanity: "-2±1" }
    - label: "Promise it as future work"
      text: "A paragraph in the limitations, a promise in the response. Reviewers have heard it before, but it still counts."
      effects: { paper.score: "+1", sanity: "+1" }
    - label: "Run a quick online version in five days"
      text: "Forty online participants, two conditions, five short nights. Your tool beats the control. Your body files a complaint."
      effects: { paper.score: "+5±2", days: -2, energy: "-5±2", sanity: "-6±2", health: "-3±1" }

- id: rev_consider_llms
  title: "Have You Considered LLMs?"
  category: reviews
  rarity: uncommon
  hook: reviews_in
  text:
    - "Reviewer 3's main suggestion: \"The authors should consider using large language models.\" {paper} is entirely about large language models. It says so in the title."
  choices:
    - label: "Point politely to the title"
      check: { stat: writing, vs: 45, spread: 20 }
      success:
        text: "\"As the title suggests, our work uses large language models throughout.\" Gentle, true, and only slightly smug."
        effects: { paper.score: "+2±1", sanity: "+2±1" }
      failure:
        text: "It reads more pointed than you meant. Reviewer 3 does not reply."
        effects: { paper.score: "-1", sanity: "+1" }
    - label: "List Sections 1 through 6"
      text: "Every section that uses one, with page numbers. Very satisfying to write. The area chair may read it in your tone of voice."
      effects: { paper.score: "-1", sanity: "+4±1" }
    - label: "Laugh, then answer it as a real question"
      text: "Maybe they meant a different kind of model. You add a second model family, and the paper is better for it."
      effects: { paper.score: "+3±1", energy: "-3±1", taste: "+1" }

- id: rev_wrong_summary
  title: "A Different Paper"
  category: reviews
  rarity: uncommon
  hook: reviews_in
  text:
    - "Reviewer 2's summary of {paper} describes a method you didn't propose, tested on a dataset you didn't use. The weaknesses are about that paper, too."
  choices:
    - label: "Correct the summary gently"
      text: "One kind paragraph explains what the paper actually does. Whether Reviewer 2 reads it is up to Reviewer 2."
      effects: { paper.score: "+2±1", energy: "-1" }
    - label: "Write to the area chair"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "The area chair compares the summary to your abstract and sets the review aside."
        effects: { paper.score: "+5±2", sanity: "+2±1" }
      failure:
        text: "The area chair is on vacation. Their backup is also on vacation."
        effects: { sanity: "-3±1" }
    - label: "Answer it as if they'd read it"
      text: "You answer the concerns that could apply to your paper and skip the rest. It's oddly relaxing."
      effects: { paper.score: "+1", sanity: "+2±1" }

- id: rev_all_borderline
  title: "Could Go Either Way"
  category: reviews
  rarity: common
  hook: reviews_in
  repeatable: true
  cooldown: 26
  text:
    - "Three reviews of {paper}, three borderline scores, and the same sentence three times: \"I could go either way.\""
  choices:
    - label: "Write your strongest rebuttal"
      text: "Every concern answered, with numbers. You leave nothing on the table except your sleep."
      effects: { paper.score: "+5±2", energy: "-5±2", sanity: "-5±2", health: "-2±1" }
    - label: "Keep it short and polite"
      text: "Five lines per reviewer. Borderline papers sometimes tip on tone, and yours is pleasant."
      effects: { paper.score: "+2±1", sanity: "+1" }
    - label: "Write it off and aim higher next cycle"
      text: "A minimal response, and a list of what would make the next version undeniable. It's a relief to stop hoping."
      effects: { paper.score: "-1", sanity: "+4±1", taste: "+2±1" }

- id: rev_rebuttal_at_conference
  title: "Rebuttal, Room 1214"
  category: reviews
  rarity: rare
  hook: reviews_in
  when:
    telemetry: { conferences: ">=1" }
  text:
    - "The rebuttal window for {paper} opens on the first morning of a conference you're attending. You have a lanyard, a hotel room, and five days."
  choices:
    - label: "Write it in the hotel at night"
      text: "Talks by day, rebuttal by night, hotel coffee at 2 am. The response is good. You look like the hotel coffee."
      effects: { paper.score: "+4±1", energy: "-6±2", sanity: "-2±1", health: "-3±1" }
    - label: "Skip a day of sessions"
      text: "One day in your room with the rebuttal. You miss the keynote everyone talks about at dinner."
      effects: { paper.score: "+4±1", network: "-2±1", sanity: "-1" }
    - label: "Split it with {labmate}"
      check: { stat: labmates_rel, vs: 50, spread: 20 }
      success:
        text: "{labmate}, at home and rested, takes two reviewers. You answer the third between sessions."
        effects: { paper.score: "+3±1", labmates_rel: "+1", network: "+1" }
      failure:
        text: "{labmate} is at the same conference. You write it together in the hotel lobby at midnight."
        effects: { paper.score: "+3±1", energy: "-4±1", health: "-2±1" }

# ---------------------------------------------------------------------------
# Right after submitting (hook: after_submit)
# ---------------------------------------------------------------------------

- id: rev_missing_experiment
  title: "The Experiment, a Day Late"
  category: reviews
  rarity: common
  hook: after_submit
  repeatable: true
  cooldown: 26
  text:
    - "At 6 am the morning after you submit {paper}, you wake up with the one experiment that would have made it airtight. Of course you do."
  choices:
    - label: "Run it now, for the rebuttal"
      text: "By the time reviews arrive, the result is in a table, ready to paste. The post-deadline rest never happens."
      effects: { paper.score: "+4±2", days: -1, energy: "-5±2", sanity: "-4±1" }
    - label: "Save it for the next paper"
      text: "It goes in a file called next_paper.md. The file is getting long, which is a good sign."
      effects: { taste: "+2±1", sanity: "+1" }
    - label: "Write it down and go back to sleep"
      text: "One line on a sticky note, then the first full night of sleep since the deadline. Well, morning."
      effects: { energy: "+4±1", sanity: "+3±1" }

# ---------------------------------------------------------------------------
# Acceptances (hook: after_accept)
# ---------------------------------------------------------------------------

- id: rev_findings_counts
  title: "Findings Counts"
  category: reviews
  rarity: common
  hook: after_accept
  when:
    has_advisor: true
    paper: { tier: findings, first_author: true }
  text:
    - "{paper} is in {venue}, not the main conference. {advisor} says Findings is a real publication. {labmate} says so too. Everyone keeps saying it."
  choices:
    - label: "Call it a win and mean it"
      text: "A publication is a publication. You update your CV and sleep well for the first time in a month."
      effects: { sanity: "+5±2" }
    - label: "Ask whether Findings gets a poster"
      check: { stat: network, vs: 40, spread: 20 }
      success:
        text: "It does, in a shared session. Three people stop by, and one of them becomes a collaborator."
        effects: { network: "+3±1", sanity: "+2±1" }
      failure:
        text: "Findings is virtual-only this year. You present to a poster board of avatars."
        effects: { presenting: "+1", sanity: "-2±1" }
    - label: "Start the main-track follow-up now"
      text: "Findings was the warm-up. You open a new document called \"main track, for real\"."
      effects: { taste: "+2±1", energy: "-2±1", sanity: "-2±1" }

# ---------------------------------------------------------------------------
# Rejections (hook: after_reject)
# ---------------------------------------------------------------------------

- id: rev_reviewed_paper_accepted
  title: "The Paper You Reviewed"
  category: reviews
  rarity: uncommon
  hook: after_reject
  when:
    year: [2, 8]
  text:
    - "Decisions are out. {paper}: rejected. The paper you reviewed for {venue}, the one you gave a 2: accepted."
  choices:
    - label: "Read their camera-ready"
      text: "They fixed everything you asked for. It's a good paper now, partly because of you. A strange comfort."
      effects: { taste: "+2±1", sanity: "-2±1" }
    - label: "Tell {labmate}, without saying which"
      text: "{labmate} guesses the paper in four seconds. You neither confirm nor deny, and you both feel better."
      effects: { sanity: "+2±1", labmates_rel: "+2±1" }
    - label: "Close the tab and get ice cream"
      text: "Peer review is a lottery, and this week you bought a ticket for someone else."
      effects: { sanity: "+4±1", health: "-1" }

- id: rev_one_line_meta
  title: "The One-Line Meta-Review"
  category: reviews
  rarity: common
  hook: after_reject
  repeatable: true
  cooldown: 26
  text:
    - "The meta-review for {paper} is one sentence long: \"The reviewers raised several concerns.\" It does not say which."
  choices:
    - label: "Reread the reviews for clues"
      text: "Two concerns show up in more than one review. That's probably the sentence the area chair meant to write."
      effects: { taste: "+2±1", energy: "-2±1", sanity: "-2±1" }
    - label: "Email the area chair"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "The area chair replies with a real paragraph and an apology. It's the most useful part of the whole review."
        effects: { taste: "+2±1", sanity: "+3±1" }
      failure:
        text: "The reply is one sentence long. Consistent, at least."
        effects: { sanity: "-3±1" }
    - label: "Print it and pin it to the wall"
      text: "It goes up next to {labmate}'s \"Thank you for your submission.\" The wall is becoming a gallery."
      effects: { sanity: "+3±1", labmates_rel: "+2±1" }

- id: rev_workshop_suggestion
  title: "A Great Workshop Paper"
  category: reviews
  rarity: common
  hook: after_reject
  when:
    project: { stage: revise }
  text:
    - "The meta-review for {paper}: \"Not ready for {venue}, but this would make a great workshop paper.\" It's meant kindly. It doesn't feel kind."
  choices:
    - label: "Send a short version to a workshop"
      text: "Four pages, non-archival. A few people hear about the work now, and the full paper stays free for a main venue."
      effects: { network: "+3±1", sanity: "+2±1", energy: "-3±1", days: -1 }
    - label: "Hold out for another main venue"
      text: "You fix the core concerns and aim high again. They said \"not ready\", not \"not good\"."
      effects: { project.quality.S: "+3±1", sanity: "-2±1" }
    - label: "Split it into two papers"
      text: "You cut it in two and keep the stronger half for now. It's clearer than the whole was, and a little smaller."
      effects: { project.quality.C: "+4±2", project.quality.N: "-3±1", energy: "-3±1" }

- id: rev_three_weeks
  title: "Next Deadline: Three Weeks"
  category: reviews
  rarity: common
  hook: after_reject
  when:
    has_advisor: true
    project: { stage: revise }
  text:
    - "An hour after the rejection, {advisor} writes: \"Let's turn {paper} around for the next deadline. It's in three weeks.\""
  choices:
    - label: "Turn it around fast"
      text: "Three weeks of nothing else. Most concerns get answered. Sunlight becomes a rumor."
      effects: { project.progress: "+12±3", energy: "-5±2", sanity: "-5±2", health: "-2±1", advisor_rel: "+2±1" }
    - label: "Ask for one more cycle to fix it"
      check: { stat: advisor_rel, vs: 50, spread: 20 }
      success:
        text: "\"Fair. Better a strong paper later than a tired one now.\" The fixes go deeper than the reviews asked."
        effects: { project.quality.S: "+4±1", project.quality.C: "+2±1", sanity: "+2±1" }
      failure:
        text: "\"Three weeks is plenty.\" It isn't, but now you know the plan."
        effects: { advisor_rel: "-2±1", sanity: "-3±1" }
    - label: "Fix only the top two concerns"
      text: "Two concerns fixed properly, the rest acknowledged. A plan that fits in three weeks."
      effects: { project.progress: "+6±2", project.quality.S: "+2±1", sanity: "-2±1" }

- id: rev_mostly_fair
  title: "Mostly Fair"
  category: reviews
  rarity: common
  hook: after_reject
  repeatable: true
  cooldown: 26
  when:
    project: { stage: revise }
  text:
    - "A week later, you reread the reviews of {paper} with fresh eyes. They're... mostly fair. Annoyingly fair."
  choices:
    - label: "Turn them into a fix list"
      text: "Eleven items, sorted by effort. A rejection is hard to live with; a to-do list is much easier."
      effects: { project.quality.S: "+2±1", energy: "-2±1", sanity: "+3±1" }
      tip: "Critique-Centric Feedback"
    - label: "Stay a little mad"
      text: "A little anger is good fuel. You get a lot done this week, loudly."
      effects: { project.progress: "+7±2", energy: "-3±1", sanity: "-2±1", labmates_rel: "-1" }
    - label: "Write one thank-you line in your notes"
      text: "\"Thanks, Reviewer 1, for the error analysis idea.\" Nobody will read it. You feel more like a colleague than a defendant."
      effects: { sanity: "+3±1", taste: "+1" }

- id: rev_tell_clinicians
  title: "Was It Wasted?"
  category: reviews
  rarity: uncommon
  hook: after_reject
  when:
    project: { stage: revise }
    any:
      - { flags_any: [clinical_partner] }
      - { project: { type: study } }
  text:
    - "You have to tell your clinical collaborators that {paper} was rejected. Their first question: \"So was the study wasted?\""
  choices:
    - label: "Explain peer review honestly"
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "Three reviewers, one area chair, and some luck. They nod. One says it sounds like grant review, only faster."
        effects: { network: "+2±1", presenting: "+1", sanity: "+1" }
      failure:
        text: "They follow along until \"Reviewer 1 lowered the score after reading Reviewer 2\", then look worried for you."
        effects: { network: "-1", sanity: "-2±1" }
    - label: "Share the kind parts of the reviews"
      text: "Every reviewer praised the clinical setting. You read them those lines and keep the rest for the lab."
      effects: { network: "+1", sanity: "+2±1" }
    - label: "Invite them to plan the resubmission"
      text: "They bring a better scenario and two ideas you'd never have had. It costs a meeting a week, and the next version is stronger."
      effects: { network: "+4±1", project.quality.S: "+3±1", energy: "-3±1", days: -1 }

- id: rev_arxiv_cited
  title: "Cited, Rejected"
  category: reviews
  rarity: uncommon
  hook: after_reject
  text:
    - "{paper} is rejected from {venue} on Tuesday. On Thursday, its arXiv version is cited twice. One of the citing papers calls it \"seminal\"."
  choices:
    - label: "Let it make you feel better"
      text: "Three reviewers said no. Two papers said yes. You decide to count all five."
      effects: { sanity: "+5±2" }
    - label: "Update arXiv with the fixes"
      text: "Version 2 goes up with the reviewers' fixes in it. It's the one people will cite from now on."
      effects: { paper.citations: "+3±1", energy: "-3±1", days: -1 }
    - label: "Screenshot it for {advisor}"
      requires: { has_advisor: true }
      text: "{advisor} replies with three exclamation marks, the most you've ever received."
      effects: { advisor_rel: "+3±1", sanity: "+2±1" }

- id: rev_lottery
  title: "It's a Lottery Anyway"
  category: reviews
  rarity: common
  hook: after_reject
  when:
    project: { stage: revise }
  text:
    - "{labmate}, your co-author on {paper}, wants to resubmit it unchanged: \"It's a lottery anyway. New reviewers, new numbers.\""
  choices:
    - label: "Agree and buy another ticket"
      text: "Same paper, new cycle, very little work. It is also exactly the paper three people just rejected."
      effects: { project.progress: "+15±3", sanity: "+2±1", labmates_rel: "+2±1" }
    - label: "Insist on fixing the concerns"
      text: "{labmate} sighs and takes the related work. The new version is better, and you're both a bit tired of each other."
      effects: { project.quality.S: "+4±1", project.quality.C: "+2±1", energy: "-3±1", labmates_rel: "-3±1" }
    - label: "Fix the two cheapest things"
      text: "A clearer Figure 2 and one missing citation. Not a new paper, but not quite a lottery ticket either."
      effects: { project.progress: "+8±2", project.quality.C: "+2±1" }

- id: rev_mentee_first_paper
  title: "Their First Rejection"
  category: reviews
  rarity: uncommon
  hook: after_reject
  when:
    year: [3, 8]
  text:
    - "{paper} was {mentee}'s first paper; their name is second on it. They haven't seen the decision yet. You have to tell them."
  choices:
    - label: "Tell them in person, with cookies"
      text: "{mentee} takes it well, eats three cookies, and asks what to fix first. A very good sign."
      effects: { labmates_rel: "+4±1", energy: "-2±1", sanity: "-1" }
    - label: "Forward the reviews with a long note"
      text: "Your note says which comments matter and which are noise. {mentee} saves it in a folder called \"how this works\"."
      effects: { labmates_rel: "+2±1", writing: "+1", energy: "-2±1" }
      tip: "How to Communicate"
    - label: "Ask {advisor} to tell them"
      requires: { has_advisor: true }
      text: "{advisor} handles it kindly. {mentee} wonders, a little, why it wasn't you."
      effects: { sanity: "+2±1", advisor_rel: "-2±1", labmates_rel: "-1" }

- id: rev_remove_the_section
  title: "Add It. Now Remove It."
  category: reviews
  rarity: uncommon
  hook: after_reject
  when:
    paper: { submissions: ">=2" }
    project: { stage: revise }
  text:
    - "The new reviewers want Section 5 removed from {paper}. Last cycle's reviewers asked you to add Section 5. It took three weeks."
  choices:
    - label: "Remove it"
      text: "Three weeks to write, three seconds to delete. The paper is tighter, and a little less convincing."
      effects: { project.quality.C: "+3±1", project.quality.S: "-2±1", sanity: "-2±1" }
    - label: "Keep it and explain why"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "Two sentences at the top of Section 5 say why it's there. Nobody will ask again, from either side."
        effects: { project.quality.S: "+2±1", project.quality.C: "+2±1" }
      failure:
        text: "Your explanation ends up longer than the section. You trim both and lose an afternoon."
        effects: { project.quality.C: "-1", energy: "-3±1", sanity: "-2±1" }
    - label: "Move it to the appendix"
      text: "Section 5 lives on in Appendix C, where the people who want it can find it and nobody else has to."
      effects: { project.quality.C: "+1", energy: "-1", sanity: "+1" }

- id: rev_too_hci_too_nlp
  title: "Too HCI, Too NLP"
  category: reviews
  rarity: uncommon
  hook: after_reject
  when:
    paper: { submissions: ">=2" }
    project: { stage: revise }
  text:
    - "Last cycle, reviewers called {paper} \"too HCI for this venue\". This cycle: \"too NLP for this venue\". Same paper, nearly word for word."
  choices:
    - label: "Rewrite it for one community"
      text: "You pick a side, reframe the introduction, and cut what the other side loved. It hurts, and it reads better."
      effects: { project.quality.C: "+5±2", project.progress: "-4±2", energy: "-4±1" }
    - label: "Aim for an interdisciplinary venue"
      text: "You read a year of papers from a venue built for exactly this. Reviewers there might call it a bridge."
      effects: { knowledge: "+2±1", sanity: "+3±1", days: -1 }
    - label: "Turn it into a position paper"
      text: "If nobody can tell which field it belongs to, maybe that's the argument. Bolder, and easier to attack."
      effects: { project.quality.N: "+4±1", project.quality.S: "-3±1", sanity: "+1" }

- id: rev_birthday_reject
  title: "Many Happy Returns"
  category: reviews
  rarity: rare
  hook: after_reject
  text:
    - "The {venue} decision for {paper} arrives on your birthday, at 9 am, before the cake. It's a no."
  choices:
    - label: "Cake first, reviews tomorrow"
      text: "Candles, friends, no laptop. The reviews will still be there tomorrow, and so will you, a year older."
      effects: { sanity: "+5±2", friends_rel: "+3±1", energy: "+2±1" }
    - label: "Read them now"
      text: "You read all three over breakfast. You know exactly what to fix, and exactly how to ruin a birthday."
      effects: { taste: "+2±1", sanity: "-3±1" }
    - label: "Ask the lab never to mention it"
      text: "Nobody mentions it. {labmate} brings a cake that says \"Happy Birthday\" and, in very small letters, \"R2 is wrong\"."
      effects: { sanity: "+3±1", labmates_rel: "+2±1" }

- id: rev_rr_new_reviewer
  title: "The New Reviewer"
  category: reviews
  rarity: uncommon
  weight: 2.0
  hook: after_reject
  when:
    turn: [10, 10]
    paper: { tier: top }
    project: { stage: revise }
  text:
    - "After a whole Revise and Resubmit, {paper} is rejected. The deciding review comes from someone who wasn't in the first round, with concerns nobody raised before."
  choices:
    - label: "Ask the chairs what happened"
      check: { stat: writing, vs: 55, spread: 20 }
      success:
        text: "A first-round reviewer dropped out, the chairs explain, and they're sorry. They mean it, which helps a little."
        effects: { sanity: "+3±1", network: "+1" }
      failure:
        text: "A polite reply: the process was followed. It was. That's the problem."
        effects: { sanity: "-3±1" }
    - label: "Take it to a journal"
      text: "A journal has room for the whole story, and reviewers who stay for every round. The paper gets longer, and calmer."
      effects: { project.quality.C: "+3±1", energy: "-2±1", sanity: "+2±1" }
    - label: "Revise once more for the next cycle"
      text: "The new concerns, answered. The paper has now satisfied three different sets of reviewers, at least on paper."
      effects: { project.quality.S: "+4±1", energy: "-3±1", sanity: "-3±1" }

