# PhD Simulator: teaching events (section J of event-ideas.md).
# TA life. The engine sets the `ta` status during TA semesters.

- id: tea_midterm_pile
  title: "120 Midterms"
  category: teaching
  repeatable: true
  cooldown: 13
  when:
    status_any: [ta]
    any:
      - { turn: [4, 6] }
      - { turn: [13, 15] }
  text:
    - "You have 120 midterms to grade by Monday. The stack on your desk is taller than your monitor."
    - "The midterm stack arrives: 120 exams of six questions each, due back Monday morning."
  choices:
    - label: "Grade all weekend"
      text: "You finish at midnight on Sunday, and now you dream about partial credit."
      effects: { energy: "-10±3", sanity: "-5±2", health: "-3±1" }
    - label: "Write a rubric first, then batch it"
      check: { stat: writing, vs: 45, spread: 15 }
      success:
        text: "The rubric takes an hour and saves ten. Question by question, you finish Saturday night."
        effects: { energy: "-5±2", sanity: "+1" }
      failure:
        text: "Halfway through, an answer breaks your rubric. You regrade 60 exams."
        effects: { energy: "-10±3", sanity: "-6±2", health: "-3±1" }
    - label: "Spread it across the week"
      text: "You grade for two hours every evening. Grades go in Wednesday, and the professor sends one pointed email."
      effects: { energy: "-3±1", sanity: "-1", days: -2 }

- id: tea_regrade_request
  title: "Half a Point"
  category: teaching
  when:
    status_any: [ta]
    any:
      - { turn: [5, 8] }
      - { turn: [14, 18] }
  text:
    - "A student requests a regrade on a half-point question. The request is 900 words long and cites the syllabus, two lecture slides and the student handbook."
  choices:
    - label: "Give them the half point"
      text: "The student is thrilled. By evening, four more requests arrive, each citing \"precedent\"."
      effects: { energy: "-4±2", sanity: "-1" }
    - label: "Write a clear, kind explanation"
      check: { stat: writing, vs: 45, spread: 15 }
      success:
        text: "They reply, \"Fair enough, thanks!\""
        effects: { writing: "+1", sanity: "+2±1", energy: "-2±1" }
      failure:
        text: "They escalate to the professor, with your email attached and highlighted."
        effects: { sanity: "-4±2", energy: "-2±1" }
    - label: "Forward it to the professor"
      text: "The professor gives them the half point and CCs you."
      effects: { sanity: "+2±1" }

- id: tea_office_hours_rush
  title: "The Line Goes Out the Door"
  category: teaching
  repeatable: true
  cooldown: 10
  when:
    status_any: [ta]
  text:
    - "It's office hours the day before the assignment is due, and the line goes out the door. Everyone has the same bug."
  choices:
    - label: "Stay until everyone is helped"
      text: "You leave at 9 pm, after thirty-one students with the same off-by-one error. You could fix it in your sleep, and soon will."
      effects: { energy: "-8±2", presenting: "+1", days: -1, health: "-2±1" }
    - label: "Explain the bug once, to everyone"
      check: { stat: presenting, vs: 50, spread: 15 }
      success:
        text: "One explanation at the whiteboard sends thirty students away happy."
        effects: { presenting: "+3±1", sanity: "+3±1" }
      failure:
        text: "Half the room follows. The other half lines up again, now with two bugs."
        effects: { energy: "-6±2", sanity: "-3±1", health: "-2±1" }
    - label: "Post a fix on the forum, end on time"
      text: "Your forum post gets 40 thank-yous and one complaint that you posted it too late."
      effects: { writing: "+1", sanity: "+2±1", energy: "-2±1" }

- id: tea_student_question_idea
  title: "A Very Good Question"
  category: teaching
  rarity: uncommon
  when:
    status_any: [ta]
  text:
    - "At office hours, a student asks why the chatbot from lecture sounds so sure when it is wrong. Nobody has a good answer, which might make it a paper."
  choices:
    - label: "Write the idea down right away"
      text: "It goes into your ideas file, with the student's question word for word."
      effects: { taste: "+2±1", knowledge: "+1" }
    - label: "Talk it through with the student"
      text: "Forty minutes later you have a whiteboard full of ideas, and office hours have run over."
      effects: { taste: "+4±1", energy: "-4±2", sanity: "+3±1" }
    - label: "Bring it to {advisor}"
      check: { stat: taste, vs: 55, spread: 15 }
      success:
        text: "{advisor} lights up: \"That's a real gap.\" It goes on the list for next semester."
        effects: { taste: "+3±1", advisor_rel: "+3±1" }
      failure:
        text: "{advisor} points you to three papers that already did it. At least now you've read them."
        effects: { knowledge: "+3±1", sanity: "-2±1" }

- id: tea_cover_lecture
  title: "You're Teaching Tomorrow"
  category: teaching
  rarity: uncommon
  when:
    status_any: [ta]
  text:
    - "The professor has a cold and emails at 8 pm: \"Could you give tomorrow's lecture? Slides attached.\" There are 74 slides. You have seen about ten of them."
  choices:
    - label: "Present their slides as they are"
      text: "You get through it. On slide 52 you learn something new, live, along with everyone else."
      effects: { presenting: "+2±1", energy: "-4±2", sanity: "-2±1" }
    - label: "Stay up and make the slides your own"
      text: "You cut it to 40 slides and add two examples from your research. Three students stay after to ask about it."
      effects: { presenting: "+4±1", knowledge: "+2±1", energy: "-10±3", health: "-3±1" }
    - label: "Turn it into a discussion class"
      check: { stat: presenting, vs: 60, spread: 15 }
      success:
        text: "You give each small group one question and walk the room. Students call it the best class of the semester."
        effects: { presenting: "+4±1", sanity: "+4±1" }
      failure:
        text: "\"Discuss in groups\" becomes 70 students on their phones. You present the slides after all."
        effects: { sanity: "-4±2", presenting: "+1" }

- id: tea_autograder_down
  title: "The Autograder Is Down"
  category: teaching
  when:
    status_any: [ta]
  text:
    - "The night before the assignment is due, the autograder starts failing every submission, including the reference solution. The forum has 63 new posts."
  choices:
    - label: "Debug it tonight"
      check: { stat: coding, vs: 55, spread: 15 }
      success:
        text: "A dependency updated itself. You pin the version at 1 am and the forum calms down."
        effects: { coding: "+3±1", energy: "-6±2", sanity: "+2±1", health: "-2±1" }
      failure:
        text: "By 4 am it passes the reference solution and fails everything else. You go to bed anyway."
        effects: { coding: "+1", energy: "-12±3", sanity: "-5±2", health: "-3±1" }
    - label: "Ask the professor for an extension"
      text: "The deadline moves 48 hours. The forum celebrates as if you personally saved them."
      effects: { sanity: "+3±1", days_next: -1 }
    - label: "Grade by hand next week"
      text: "Everyone submits on time. Next week, you run 90 programs one by one."
      effects: { coding: "+1", sanity: "-2±1", days_next: -3 }

- id: tea_3am_deadline_email
  title: "Is the Deadline Tonight?"
  category: teaching
  when:
    status_any: [ta]
  text:
    - "A student email arrives at 3:04 am: \"Is the deadline tonight?\" The deadline was at midnight. You know the email arrived at 3:04 because you are awake too."
  choices:
    - label: "Reply right now"
      text: "\"It was at midnight, but submit now and I'll ask the professor.\" They submit at 3:09, and you're asleep by 4."
      effects: { energy: "-4±2", sanity: "+1" }
    - label: "Reply kindly in the morning"
      text: "You close the laptop and reply at 9 am. The student had already submitted at 3:10."
      effects: { energy: "+2±1", sanity: "+2±1" }
    - label: "Ask yourself why you're awake at 3 am"
      text: "You go to bed, and your sleep schedule thanks you, a little."
      effects: { energy: "+4±1", health: "+1" }
    - label: "Reply, then keep writing until 5"
      tag: "Night Owl"
      requires: { traits_any: [night_owl] }
      text: "Since you're up anyway, you also finish a section of your paper."
      effects: { writing: "+2±1", energy: "-3±1", sanity: "+2±1" }

- id: tea_evaluations
  title: "Very Patient, Talks Too Fast"
  category: teaching
  when:
    telemetry: { ta_semesters: ">=1" }
    any:
      - { turn: [9, 11] }
      - { turn: [19, 21] }
  text:
    - "Your TA evaluations are in. Nearly every comment says the same thing: \"Very patient, talks too fast.\" One student just wrote \"fast\"."
  choices:
    - label: "Practice talking slower"
      text: "You record yourself and time it. It's painful to watch, and your next practice talk goes better."
      effects: { presenting: "+3±1", sanity: "-1", days: -1 }
      tip: "How to Communicate"
    - label: "Focus on the \"very patient\" part"
      text: "You print it and stick it above your desk."
      effects: { sanity: "+4±1" }
    - label: "Ask {labmate} to time your next talk"
      check: { stat: labmates_rel, vs: 45, spread: 15 }
      success:
        text: "{labmate} raises a hand every time you speed up. By the end you're both laughing, and you're slower."
        effects: { presenting: "+3±1", labmates_rel: "+2±1" }
      failure:
        text: "{labmate} forgets to show up. You talk fast to an empty room."
        effects: { sanity: "-2±1" }

- id: tea_course_barely_passed
  title: "Old Nemesis"
  category: teaching
  when:
    status_any: [ta]
    any:
      - { turn: [1, 3] }
      - { turn: [10, 12] }
  text:
    - "You are assigned to TA the course you barely passed as an undergrad, the one with the proof-heavy final. This time, you grade that final."
  choices:
    - label: "Relearn it properly this time"
      text: "On your second pass through the textbook, it finally clicks. Your undergrad self would be stunned."
      effects: { knowledge: "+4±1", energy: "-6±2", health: "-2±1" }
    - label: "Stay one lecture ahead"
      text: "You learn each topic the night before you teach it. It works, mostly, and nobody notices."
      effects: { knowledge: "+2±1", sanity: "-3±1" }
    - label: "Tell students you struggled too"
      check: { stat: presenting, vs: 45, spread: 15 }
      success:
        text: "Office hours fill up. Students say you explain it best, because you remember why it's hard."
        effects: { presenting: "+3±1", sanity: "+4±1" }
      failure:
        text: "A student asks, \"So... should we trust your grading?\""
        effects: { sanity: "-3±1" }

- id: tea_thank_you_email
  title: "Years Later"
  category: teaching
  rarity: rare
  when:
    telemetry: { ta_semesters: ">=2" }
    year: [4, 8]
  text:
    - "An email from a student you TA'd years ago: they are an engineer now, and your office hours are why they stayed in computer science. They remember your name. You remember their bug."
  choices:
    - label: "Write back properly"
      text: "You write a long, warm reply. It's the best thing you've written all month, and nobody will review it."
      effects: { sanity: "+8±2", writing: "+1" }
    - label: "Invite them to talk to your students"
      text: "They give a guest talk to this year's class. Two students ask them for internship referrals."
      effects: { network: "+4±1", sanity: "+4±1", energy: "-3±1" }
    - label: "Save it in a \"good days\" folder"
      text: "You start a folder for emails like this. The next rejection stings a little less."
      effects: { sanity: "+5±1" }

# New work landing on your plate (2026-10-16): these raise Stress.
- id: tea_grading_pile
  title: "The Grading Pile"
  category: teaching
  rarity: common
  repeatable: true
  cooldown: 8
  when: { status_any: [ta] }
  text:
    - "The midterms are in: 140 of them, due back by Monday. The professor is at a conference."
    - "All 38 final projects arrive at 11:59 pm, and some have videos."
  choices:
    - label: "Grade them all carefully"
      text: "Every one gets fair, detailed feedback. Two students email to say thank you, which almost never happens."
      effects: { days: -2, energy: "-4±1", sanity: "-4±1", presenting: "+1" }
    - label: "Make a rubric and move fast"
      text: "The rubric is a work of art. The grading goes fast, and nobody complains."
      effects: { days: -1, sanity: "-3±1" }
    - label: "Ask the other TA to split it"
      text: "They say yes, and you owe them one."
      effects: { days: -1, sanity: "-1", labmates_rel: "-1" }
