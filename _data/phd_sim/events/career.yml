# PhD Simulator: career events (section K of event-ideas.md).
# The engine runs internship applications and offers, fellowship results and job-market offers.
# These events are the human moments around them, plus a few flags from content-spec 12b.

# ---------------------------------------------------------------------------
# Internships
# ---------------------------------------------------------------------------

- id: car_invert_binary_tree
  title: "Invert a Binary Tree"
  category: career
  when:
    year: [1, 4]
    turn: [6, 14]
    status_none: [job_market]
    flags_all: [internship_applied]
  text:
    - "Your internship interview at {company} is for a research role on language models. The first question: \"Let's warm up. Invert a binary tree.\""
  choices:
    - label: "Invert the binary tree"
      check: { stat: coding, vs: 55, spread: 15 }
      success:
        text: "You write six clean lines and handle the edge cases. The interviewer relaxes and asks about your research."
        effects: { career_prep: "+2", coding: "+1", sanity: "+3±1" }
      failure:
        text: "You invert it twice, which gives back the original tree. The interviewer says \"interesting\" and writes something down."
        effects: { sanity: "-4±2" }
    - label: "Ask clarifying questions first"
      check: { stat: presenting, vs: 50, spread: 15 }
      success:
        text: "Your questions turn it into a conversation. You solve it slowly, but they like how you think."
        effects: { career_prep: "+2", presenting: "+1" }
      failure:
        text: "You ask so many questions that time runs out before you write any code."
        effects: { sanity: "-3±1" }
    - label: "Solve it fast, then pivot to research"
      text: "You solve it and steer the talk to your paper, while the interviewer glances at the clock."
      effects: { career_prep: "+1", sanity: "-1" }

- id: car_mentor_leaves
  title: "Your Mentor Has Left the Building"
  category: career
  hook: internship
  when:
    turn: [20, 21]
  text:
    - "In week two of your internship at {company}, your mentor announces they are moving to another team, effective Friday. Your project doc still says \"TBD with mentor\"."
  choices:
    - label: "Find a new mentor yourself"
      check: { stat: network, vs: 50, spread: 15 }
      success:
        text: "A senior researcher two desks over adopts you, and turns out to be better at this than your first mentor."
        effects: { network: "+5±2", coding: "+2±1", sanity: "+2±1" }
      failure:
        text: "Everyone is \"happy to chat\", but nobody is happy to mentor. You spend a week in limbo."
        effects: { sanity: "-5±2", days: -2 }
    - label: "Scope the project yourself"
      text: "You write your own project plan, and your manager approves it without reading it."
      effects: { taste: "+3±1", coding: "+2±1", sanity: "-3±1" }
    - label: "Ask your old mentor for weekly chats"
      text: "They agree to a 30-minute call every Thursday from their new team."
      effects: { network: "+3±1", sanity: "+1" }

- id: car_press_release_footnote
  title: "Footnote 3"
  category: career
  rarity: uncommon
  hook: internship
  when:
    turn: [23, 25]
  text:
    - "Your internship project at {company} ships. The press release thanks \"the team\". Your name is in footnote 3, spelled correctly."
  choices:
    - label: "Add it to your CV"
      text: "\"Shipped to millions of users.\" It is one line on your CV, and recruiters read that line first."
      effects: { career_prep: "+2", sanity: "+3±1" }
    - label: "Ask about a return offer"
      check: { stat: network, vs: 55, spread: 15 }
      success:
        text: "Your manager says they were about to bring it up. A return offer is on the table."
        effects: { sanity: "+6±2", network: "+3±1" }
        flag_set: [return_offer]
      failure:
        text: "\"Let's revisit after headcount planning.\" Nobody knows when that is."
        effects: { sanity: "-3±1" }
    - label: "Pitch a paper on the project"
      check: { stat: writing, vs: 55, spread: 15 }
      success:
        text: "Legal approves a short workshop paper. People start citing it before you're back on campus."
        effects: { citations: "+4±2", writing: "+2±1", days: -1 }
      failure:
        text: "Legal says the paper can come out \"after the next product cycle\", which could mean next year."
        effects: { sanity: "-2±1" }

# ---------------------------------------------------------------------------
# Fellowships
# ---------------------------------------------------------------------------

- id: car_fellowship_won
  title: "Fellowship!"
  category: career
  weight: 3.0
  when:
    flags_all: [fellowship_won]
    status_any: [fellowship]
  text:
    - "The fellowship is yours. For a whole year you don't have to TA or grade, and your calendar suddenly has room in it."
  choices:
    - label: "Put the time into a bold idea"
      text: "You start the project you have been too busy to start, knowing it might not work."
      effects: { taste: "+3±1", sanity: "+3±1", energy: "-3±1" }
    - label: "Catch up on sleep first"
      text: "You sleep properly for two weeks and are sharper than you have been since orientation."
      effects: { energy: "+12±3", health: "+2±1" }
    - label: "Celebrate with the lab"
      text: "You buy the lab dinner. {labmate} toasts \"to no grading\". A few labmates look envious."
      effects: { labmates_rel: "+4±1", sanity: "+5±2", energy: "-2±1" }

- id: car_fellowship_rejection
  title: "Fellowship Feedback"
  category: career
  when:
    year: [1, 3]
    turn: [12, 17]
    flags_all: [fellowship_applied]
    flags_none: [fellowship_won]
  text:
    - "The fellowship results are out, and you didn't get it. The reviewer comments come too. One says \"too ambitious\", another \"not ambitious enough\", and a third calls it \"incremental\"."
  choices:
    - label: "Look for the useful critique"
      text: "Two comments are actually useful. You fold them into next year's research statement."
      effects: { taste: "+2±1", sanity: "+2±1", career_prep: "+1" }
      tip: "Critique-Centric Feedback"
    - label: "Vent to your cohort over dinner"
      text: "Half your cohort got the same three comments. Dinner turns into a dramatic reading."
      effects: { friends_rel: "+3±1", sanity: "+4±1" }
    - label: "Start next year's application today"
      text: "You open a new document while you're still annoyed. It is a surprisingly productive mood."
      effects: { writing: "+2±1", career_prep: "+2", energy: "-4±2" }

# ---------------------------------------------------------------------------
# Job market (the engine computes offers; these are the moments around them)
# ---------------------------------------------------------------------------

- id: car_sixty_cover_letters
  title: "Sixty Cover Letters"
  category: career
  when:
    status_any: [job_market]
    turn: [1, 6]
  text:
    - "It's faculty application season, and each of 60 openings wants a custom cover letter plus two statements. You have already mixed up two department names."
  choices:
    - label: "Write 60 truly custom letters"
      text: "Each letter names the faculty you would work with. It takes three weeks and part of your soul."
      effects: { career_prep: "+3", writing: "+2±1", energy: "-12±3", health: "-3±1" }
    - label: "Use one template plus a custom paragraph"
      text: "The letters are good and go out on time. You triple-check every department name."
      effects: { career_prep: "+2", energy: "-5±2" }
    - label: "Apply only to your best 25"
      text: "You put more care into fewer letters, and your stress level survives application season."
      effects: { career_prep: "+1", sanity: "+4±1" }

- id: car_late_letters
  title: "Letter Pending"
  category: career
  when:
    status_any: [job_market]
    turn: [2, 7]
  text:
    - "Three application portals show the same red status: \"Letter of recommendation: not received.\" The deadlines were yesterday. The missing letter is from {advisor}."
  choices:
    - label: "Send {advisor} a gentle reminder"
      check: { stat: advisor_rel, vs: 50, spread: 15 }
      success:
        text: "{advisor} apologizes and uploads all three within the hour. Two committees say late letters are fine."
        effects: { career_prep: "+1", sanity: "+3±1" }
      failure:
        text: "{advisor} replies \"on it!\" and uploads one. The other two arrive next week."
        effects: { sanity: "-5±2" }
    - label: "Send a page of talking points"
      text: "You send a one-page summary of your work. {advisor} uses it, and the letters go out the next morning."
      effects: { writing: "+1", career_prep: "+1", energy: "-2±1" }
    - label: "Email the search committees yourself"
      text: "Two of the three committees reply kindly. The third portal has no contact address, only a FAQ."
      effects: { network: "+1", sanity: "-2±1" }

- id: car_startup_pingpong
  title: "Equity and a Ping-Pong Table"
  category: career
  when:
    status_any: [job_market]
    turn: [1, 8]
  text:
    - "A startup founder messages you: \"We'd love you as a founding researcher. Generous equity, a ping-pong table, free snacks.\" The word \"salary\" does not appear."
  choices:
    - label: "Hear them out"
      text: "The pitch is wild and a little convincing. You add startups to your search, just in case."
      effects: { network: "+3±1", energy: "-2±1" }
      flag_set: [startup_idea]
    - label: "Ask about the salary directly"
      check: { stat: presenting, vs: 50, spread: 15 }
      success:
        text: "They name a real number: below big tech, above what you feared. You are more interested than you expected."
        effects: { network: "+2±1", sanity: "+2±1" }
        flag_set: [startup_idea]
      failure:
        text: "\"We think about compensation holistically.\" The conversation ends there."
        effects: { sanity: "-2±1" }
    - label: "Decline and stay on your track"
      text: "You wish them luck. They thank you and ask if you know anyone else."
      effects: { sanity: "+2±1" }

- id: car_forgotten_school
  title: "Wait, I Applied There?"
  category: career
  hook: job_market
  when:
    turn: [8, 15]
  text:
    - "A job-talk invitation arrives from a school you had completely forgotten you applied to. You search your sent mail to see what you promised them."
  choices:
    - label: "Accept and study the department"
      text: "You read every faculty page and three of their papers. On the visit, you sound like you've wanted this job for years."
      effects: { career_prep: "+2", energy: "-3±1", days: -2, sanity: "-2±1" }
    - label: "Accept and give your usual talk"
      check: { stat: presenting, vs: 55, spread: 15 }
      success:
        text: "Your usual talk lands just as well. The search chair calls it \"refreshingly clear\"."
        effects: { career_prep: "+2", presenting: "+1" }
      failure:
        text: "Your talk mentions collaborating with a research center they closed years ago."
        effects: { career_prep: "+1", sanity: "-3±1" }
    - label: "Decline politely"
      text: "You trade a flight for a free weekend. After a small pang, you feel relieved."
      effects: { sanity: "+4±1", energy: "+3±1" }

- id: car_campus_visit
  title: "Twelve One-on-Ones"
  category: career
  hook: job_market
  when:
    turn: [8, 16]
  text:
    - "Campus visit: breakfast with the search chair, twelve 30-minute one-on-ones, your job talk, then dinner. Every single person asks, \"So, tell me about your research.\""
  choices:
    - label: "Be fully on for all twelve"
      text: "You give twelve slightly different versions of your pitch, and everyone loves you. You fall asleep in your dinner clothes."
      effects: { network: "+5±2", career_prep: "+2", energy: "-14±3", health: "-3±1" }
    - label: "Ask about their work instead"
      check: { stat: knowledge, vs: 55, spread: 15 }
      success:
        text: "You've read their papers and ask sharp questions. Half the meetings run over, happily."
        effects: { network: "+6±2", career_prep: "+2", energy: "-6±2", health: "-2±1" }
      failure:
        text: "You mix up two professors' papers. One of them is very gracious about it."
        effects: { network: "+1", sanity: "-4±2", energy: "-6±2", health: "-2±1" }
    - label: "Save your energy for the talk"
      text: "You keep the one-on-ones short and give a sharp job talk. Dinner is quiet, but fine."
      effects: { presenting: "+2±1", career_prep: "+1", energy: "-6±2", health: "-2±1" }

- id: car_offer_deadlines
  title: "One Week Apart"
  category: career
  hook: job_market
  when:
    turn: [12, 20]
  text:
    - "One place wants your answer by next Friday. The place you like more will decide a week after that. Both say, \"Take all the time you need.\""
  choices:
    - label: "Ask the first place for more time"
      check: { stat: network, vs: 50, spread: 15 }
      success:
        text: "They give you two extra weeks. Now the dates line up."
        effects: { sanity: "+5±2", network: "+1" }
      failure:
        text: "\"We can't extend, but we really hope you'll join!\" You still have until Friday."
        effects: { sanity: "-5±2" }
    - label: "Ask the second place to decide sooner"
      check: { stat: presenting, vs: 55, spread: 15 }
      success:
        text: "Your email is polite and clear. They move their decision up by a week."
        effects: { sanity: "+5±2", career_prep: "+1" }
      failure:
        text: "They say they will \"try\", and then they don't."
        effects: { sanity: "-4±2" }
    - label: "Ask {advisor} what they would do"
      text: "{advisor} tells you which one they would pick and, more usefully, why. You feel calmer about either."
      effects: { sanity: "+3±1", advisor_rel: "+2±1", taste: "+1" }

- id: car_famous_lab_postdoc
  title: "A Famous Lab Writes Back"
  category: career
  rarity: uncommon
  hook: job_market
  when:
    turn: [10, 22]
  text:
    - "The head of a famous lab emails: they liked your talk and might have a postdoc opening. Could you chat on Thursday? Your heart rate disagrees with your calendar."
  choices:
    - label: "Take the call and prepare hard"
      text: "You read their last ten papers. The call runs long and ends with \"let's stay in touch\". From them, that means something."
      effects: { network: "+5±2", knowledge: "+2±1", days: -2, sanity: "-2±1" }
    - label: "Ask {advisor} what they know"
      check: { stat: advisor_rel, vs: 50, spread: 15 }
      success:
        text: "{advisor} knows them well and makes a call of their own. You go into Thursday with an ally."
        effects: { network: "+4±1", advisor_rel: "+2±1" }
      failure:
        text: "{advisor} says, \"They work their postdocs very hard.\" That is all they say."
        effects: { sanity: "-2±1", knowledge: "+1" }
    - label: "Keep it as a plan B"
      text: "You reply warmly and keep it in your back pocket while you focus on your main search."
      effects: { sanity: "+4±1" }

- id: car_labmate_startup
  title: "Employee #4"
  category: career
  rarity: uncommon
  when:
    year: [4, 8]
    has_advisor: true
  text:
    - "{labmate} pulls you aside: they are leaving to start a company, they just raised a small seed round, and they want you as employee number four. \"You'd own a real piece of it.\""
  choices:
    - label: "Say you're interested"
      text: "{labmate} is thrilled. You agree to talk details once you're on the job market."
      effects: { labmates_rel: "+4±1", network: "+2±1" }
      flag_set: [labmate_startup_offer]
    - label: "Ask to see the numbers first"
      check: { stat: taste, vs: 50, spread: 15 }
      success:
        text: "The plan makes sense. {labmate} respects the questions and keeps a spot open for you."
        effects: { labmates_rel: "+2±1", sanity: "+2±1" }
        flag_set: [labmate_startup_offer]
      failure:
        text: "The plan is one slide with a hockey-stick curve on it. You say you'll think about it."
        effects: { sanity: "-1" }
    - label: "Decline, but offer to advise"
      text: "You'll review their model evaluations for free. {labmate} is a little disappointed, but grateful."
      effects: { network: "+3±1", labmates_rel: "+1", days_next: -1 }

# ---------------------------------------------------------------------------
# Round 5 additions
# ---------------------------------------------------------------------------

- id: car_internship_compute
  title: "A Starter Allocation"
  category: career
  rarity: common
  hook: internship
  when:
    turn: [20, 22]
  text:
    - "On day one at {company}, you get a GPU quota bigger than everything your lab has used in five years. The onboarding doc calls it \"a starter allocation\"."
  choices:
    - label: "Run every ablation you ever dreamed of"
      text: "You launch two hundred runs by Friday and learn more about scaling in a week than in two years of queueing."
      effects: { coding: "+3±1", knowledge: "+2±1", energy: "-5±2" }
    - label: "Plan runs as if GPUs were scarce"
      text: "Your mentor is impressed by how little compute you waste, and slightly confused by it."
      effects: { taste: "+2±1", network: "+2±1" }
    - label: "Send the lab a screenshot"
      text: "The lab chat goes quiet for a long minute. Then {labmate} replies with one crying emoji."
      effects: { sanity: "+3±1", labmates_rel: "-1" }

- id: car_legal_review
  title: "Pending Legal Review"
  category: career
  rarity: uncommon
  hook: internship
  when:
    turn: [23, 25]
  text:
    - "Your internship paper at {company} is finished, but legal review flagged \"possible product implications\". The next review slot is in eleven weeks."
  choices:
    - label: "Cut anything that sounds like a product"
      text: "Every product name becomes \"a deployed system\". Legal approves a thinner, vaguer paper, and it's out."
      effects: { writing: "+2±1", career_prep: "+1", sanity: "-2±1", days: -1 }
    - label: "Ask your manager to escalate"
      check: { stat: network, vs: 55, spread: 15 }
      success:
        text: "Your manager knows someone in legal. The paper clears in a week, untouched."
        effects: { network: "+3±1", career_prep: "+2", sanity: "+4±1" }
      failure:
        text: "The escalation lands in the same queue, one slot lower."
        effects: { sanity: "-4±1" }
    - label: "Let it wait and enjoy the summer"
      text: "The paper goes into a folder called \"someday\". Your weekends come back for the rest of the internship."
      effects: { energy: "+4±1", sanity: "+2±1" }

- id: car_return_offer_proposal
  title: "Perfect Timing"
  category: career
  rarity: uncommon
  when:
    status_any: [proposal_prep]
    flags_all: [interned]
    flags_none: [return_offer]
  text:
    - "Days before your proposal, the company you interned at emails a full-time offer, with a deadline. Your slides are 60% done. The salary section is 100% done."
  choices:
    - label: "Ask them to wait until after"
      check: { stat: presenting, vs: 50, spread: 15 }
      success:
        text: "They give you a month. You go back to slide 23 calmer than you expected."
        effects: { sanity: "+3±1", network: "+1" }
        flag_set: [return_offer]
      failure:
        text: "\"We can do one week.\" Two big decisions now share the same week."
        effects: { sanity: "-4±1" }
        flag_set: [return_offer]
    - label: "Tell {advisor} about it"
      check: { stat: advisor_rel, vs: 50, spread: 15 }
      success:
        text: "{advisor} says congratulations, then \"slides first\". You keep the offer and your focus."
        effects: { advisor_rel: "+2±1", sanity: "+2±1" }
        flag_set: [return_offer]
      failure:
        text: "{advisor} goes quiet, then asks how the slides are going. They seem a little worried."
        effects: { advisor_rel: "-2±1", sanity: "-3±1" }
        flag_set: [return_offer]
    - label: "Decline: you're finishing the PhD"
      text: "You say not yet. They say the door stays open, which might even be true. The slides get your full attention."
      effects: { sanity: "+4±1", presenting: "+1" }

- id: car_fellowship_vs_deadline
  title: "Two Things Due Friday"
  category: career
  rarity: uncommon
  when:
    year: [1, 3]
    turn: [3, 7]
    flags_none: [fellowship_won]
    project: { turns_to_deadline: "<=1" }
  text:
    - "A university fellowship wants a two-page research statement by Friday. Friday is also the deadline for {project}. Both want your best writing, and you have enough for one."
  choices:
    - label: "Statement first, paper second"
      check: { stat: writing, vs: 55, spread: 15 }
      success:
        text: "The statement is the clearest thing you've written all year. A month later you win the award, which is small but looks good on your CV."
        effects: { career_prep: "+2", sanity: "+4±1", project.progress: "-5±2" }
      failure:
        text: "The statement is good and the paper is rushed. A month later, the fellowship sends a polite no."
        effects: { project.progress: "-5±2", sanity: "-4±1", writing: "+1" }
    - label: "Paper first, statement overnight"
      text: "The paper goes in strong. The statement, written at 3 am, says \"robust\" seven times and wins nothing."
      effects: { project.progress: "+3±1", energy: "-6±2", health: "-2±1", sanity: "-2±1" }
    - label: "Skip the fellowship this year"
      text: "You have one deadline instead of two. There will be other fellowships."
      effects: { project.progress: "+5±2", sanity: "+2±1" }

- id: car_recruiter_wrong_field
  title: "Perfect for Your Background"
  category: career
  rarity: common
  when:
    year: [2, 7]
    has_advisor: true
  text:
    - "A recruiter writes: \"Your background in transformers is a perfect fit!\" The role maintains electrical transformers for a power company. The pay is honestly not bad."
    - "A recruiter says your NLP experience is perfect for their role. They mean Neuro-Linguistic Programming, as a life coach. There is a webinar."
  choices:
    - label: "Take the call, just to see"
      text: "After twenty minutes of friendly confusion, you both know a little about a whole other field."
      effects: { network: "+2±1", knowledge: "+1", energy: "-2±1" }
    - label: "Reply with a polite correction"
      check: { stat: writing, vs: 45, spread: 15 }
      success:
        text: "They thank you and pass your profile to a colleague who hires for actual machine learning roles."
        effects: { career_prep: "+2", network: "+1" }
      failure:
        text: "They reply: \"Even better! Are you free Tuesday?\""
        effects: { sanity: "-2±1" }
    - label: "Forward it to the lab chat"
      text: "The lab chat loses it. {labmate} makes it the channel topic for a month."
      effects: { labmates_rel: "+3±1", sanity: "+3±1" }

- id: car_job_talk_pet_topic
  title: "The Pet Topic"
  category: career
  rarity: common
  hook: job_market
  when:
    turn: [8, 16]
  text:
    - "Your job talk lands. Then one professor asks how it connects to their favorite topic, and the next twenty minutes of Q&A are about that topic. Other hands slowly go down."
  choices:
    - label: "Engage with their topic seriously"
      check: { stat: knowledge, vs: 55, spread: 15 }
      success:
        text: "You find a real link. The professor beams, and you now have one very loud supporter in the hiring meeting."
        effects: { career_prep: "+2", network: "+3±1", sanity: "+2±1" }
      failure:
        text: "You improvise a connection. They correct it, for ten minutes, with diagrams."
        effects: { sanity: "-4±1", knowledge: "+1" }
    - label: "\"Great point, let's talk at dinner\""
      check: { stat: presenting, vs: 55, spread: 15 }
      success:
        text: "Three more people get to ask questions. The search chair notices how you handled the room."
        effects: { presenting: "+2±1", career_prep: "+2" }
      failure:
        text: "They follow up anyway. Two hands stay down for good."
        effects: { sanity: "-3±1", career_prep: "+1" }
    - label: "Promise to read their paper"
      text: "They email you the PDF before you leave the room. You read it at the hotel. At dinner, they ask what you thought."
      effects: { network: "+3±1", knowledge: "+1", energy: "-3±1" }

- id: car_thesis_interview
  title: "That's My Thesis"
  category: career
  rarity: uncommon
  hook: job_market
  when:
    turn: [3, 16]
  text:
    - "An industry interviewer asks: \"How would you evaluate our AI features with real users?\" You have spent five years on exactly this question. You have four minutes."
  choices:
    - label: "Give the four-minute version"
      check: { stat: presenting, vs: 50, spread: 15 }
      success:
        text: "You keep it clear and concrete and finish on time. The interviewer stops taking notes and starts nodding."
        effects: { career_prep: "+3", presenting: "+1", sanity: "+3±1" }
      failure:
        text: "You reach minute four of a forty-minute answer. They thank you for the overview."
        effects: { career_prep: "+1", sanity: "-3±1" }
    - label: "Ask what their features do first"
      check: { stat: taste, vs: 50, spread: 15 }
      success:
        text: "The question turns into a design session. At the end they ask, half joking, \"Can you start in June?\""
        effects: { career_prep: "+3", network: "+2±1" }
      failure:
        text: "Everything they could tell you is under NDA. You both stare at the question."
        effects: { sanity: "-2±1" }
    - label: "Pull up your thesis framework slide"
      text: "Five years fit on one slide. They ask for a copy for their team, which is either flattering or worrying."
      effects: { career_prep: "+2", network: "+1" }
