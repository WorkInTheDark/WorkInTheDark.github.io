      failure:
        text: "The three themes are called \"Design\", \"More design\" and \"Other\"."
        effects: { sanity: "-3±1", project.quality.C: "+1" }
    - label: "Fight for five"
      check: { stat: advisor_rel, vs: 55, spread: 20 }
      success:
        text: "Five, with one sentence each. Your advisor agrees that five is also a number."
        effects: { sanity: "+2±1", advisor_rel: "+1", project.quality.C: "+3±1" }
      failure:
        text: "You leave the meeting with three, and a comment about \"focus\"."
        effects: { sanity: "-2±1", advisor_rel: "-2±1", project.quality.C: "+3±1" }

# --- Annotation and clinical text ------------------------------------------

- id: res_suggestion_accept
  title: "98% Agreement"
  category: research
  when:
    project: { type: dataset, stage: [guidelines, annotation] }
  text:
    - "You switched on model-suggested labels to speed up annotation. It worked: your annotators accept the suggestion {roll:96-99}% of the time, including the wrong ones."
  choices:
    - label: "Add a no-suggestion condition"
      text: "Half the annotators label without help. It's slower, but now you can measure how much the suggestions steer them."
      effects: { sanity: "-2±1", project.delay: 1, project.quality.S: "+6±2" }
    - label: "Make it a paper of its own"
      check: { stat: taste, vs: 55, spread: 20 }
      success:
        text: "It's a whole second paper about annotators trusting the model. You add it to the list, happily."
        effects: { energy: "-3±1", taste: "+2±1", knowledge: "+2±1", sanity: "+3±1" }
      failure:
        text: "Someone wrote that paper last year, and it's good, which somehow makes it worse."
        effects: { energy: "-3±1", knowledge: "+2±1", sanity: "-2±1" }
    - label: "Hide suggestions until they choose"
      text: "Annotators label first, then see the model's guess. Speed drops, and so does the copying."
      effects: { energy: "-3±1", coding: "+2±1", project.quality.S: "+4±2" }

- id: res_deid_may
  title: "[NAME] Will Return in [NAME]"
  category: research
  when:
    project: { type: [dataset, empirical], stage: [guidelines, pilot, experiments] }
  text:
    - "Your de-identification tool removes every name from the clinical notes, along with every \"May\", \"Will\" and \"Hope\". \"Pt will return in May\" now reads \"Pt [NAME] return in [NAME]\"."
  choices:
    - label: "Patch it with rules"
      check: { stat: coding, vs: 50, spread: 20 }
      success:
        text: "Forty rules later, May is a month again and will is a verb. The real names still go."
        effects: { energy: "-3±1", coding: "+3±1", project.quality.S: "+3±1" }
      failure:
        text: "Your rules fix \"May\" and miss a real name. You catch it in review, and start over, more carefully."
        effects: { energy: "-3±1", sanity: "-4±2", project.progress: "-3±1" }
    - label: "Try another tool"
      text: "The second tool is careful with months, and also removes every number."
      effects: { energy: "-3±1", project.progress: "-3±1", project.quality.S: "+2±1" }
    - label: "Write up what de-identification breaks"
      text: "A short workshop paper on [NAME] and other casualties. Clinical NLP people love it."
      effects: { energy: "-4±2", days: -2, writing: "+2±1", network: "+2±1", citations: "+3±2" }

- id: res_pt_abbrev
  title: "pt"
  category: research
  when:
    project: { type: [dataset, empirical], stage: [guidelines, pilot, experiments, baselines] }
  text:
    - "In your clinical notes, \"pt\" means patient, physical therapy, part-time and, once, \"pint\". Your model reads every one of them as patient."
  choices:
    - label: "Build an abbreviation list with clinicians"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "Two clinicians sort 300 abbreviations in an afternoon and seem to enjoy it."
        effects: { network: "+2±1", knowledge: "+3±1", project.quality.S: "+5±2" }
      failure:
        text: "They agree on 60% of them. Clinicians, it turns out, also guess."
        effects: { sanity: "-2±1", knowledge: "+2±1", project.quality.S: "+2±1" }
    - label: "Let the model guess"
      text: "It guesses right most of the time. When it's wrong, it's confidently wrong."
      effects: { project.progress: "+4±2", project.quality.S: "-3±1" }
    - label: "Make it an evaluation slice"
      text: "A new table: accuracy on ambiguous abbreviations. Your model's weak spot is now a contribution."
      effects: { energy: "-3±1", days: -1, project.quality.N: "+4±2", project.quality.S: "+2±1" }

- id: res_unread_language
  title: "Lost in Evaluation"
  category: research
  when:
    project: { type: empirical, stage: [experiments, consolidation] }
  text:
    - "Your multilingual evaluation includes {roll:200-300} outputs in a language nobody in the lab reads. The automatic score says they're fine. You have no way to know."
  choices:
    - label: "Recruit a native speaker"
      text: "A student from another department checks them for pizza. 30% are fluent nonsense."
      effects: { days: -1, network: "+3±1", project.quality.S: "+5±2" }
    - label: "Use back-translation"
      text: "Back in English, they look fine. Back-translation is very forgiving."
      effects: { project.progress: "+3±1", project.quality.S: "-2±1" }
    - label: "Read them yourself"
      requires: { traits_any: [polyglot] }
      tag: "Polyglot"
      text: "You read them over coffee. Most are fine, two are excellent, and one is a recipe."
      effects: { sanity: "+2±1", knowledge: "+2±1", project.quality.S: "+6±2" }

# --- Working with models ---------------------------------------------------

- id: res_certainly
  title: "Certainly!"
  category: research
  repeatable: true
  cooldown: 26
  when:
    has_advisor: true
    project: { stage: [experiments, baselines, analysis] }
  text:
    - "Output 300 of 500. You notice you've started your emails with \"Certainly!\" and ended one with \"I hope this helps!\" It was to {advisor}."
  choices:
    - label: "Take a break"
      text: "You take a walk and eat a sandwich, an hour away from all text. You come back sounding human."
      effects: { energy: "+3±1", sanity: "+4±2", project.progress: "-3±1" }
    - label: "Sort the errors into categories"
      text: "Seven error types fit in one chart, and your analysis section gets much better. Output 301 is easier to read."
      effects: { energy: "-3±1", taste: "+2±1", project.progress: "+3±1", project.quality.S: "+4±2" }
    - label: "Finish all 500 today"
      text: "Done by midnight. You dream in bullet points. Certainly!"
      effects: { energy: "-7±2", health: "-2±1", sanity: "-3±1", project.progress: "+7±2" }

- id: res_fake_citation
  title: "A Paper That Doesn't Exist"
  category: research
  when:
    has_advisor: true
    project: { type: empirical, stage: [experiments, consolidation] }
  text:
    - "Your model cites a paper that doesn't exist and credits it to {advisor}. The title sounds exactly like something {advisor} would write. You check twice."
  choices:
    - label: "Add a citation check to your evaluation"
      text: "Every reference now gets checked against a real database, and 14% turn out to be invented."
      effects: { energy: "-4±2", days: -1, coding: "+1", project.quality.S: "+5±2", project.quality.N: "+2±1" }
    - label: "Show {advisor}"
      check: { stat: advisor_rel, vs: 45, spread: 20 }
      success:
        text: "Your advisor laughs, then asks, \"Should I write it?\" You're not sure they're joking."
        effects: { sanity: "+3±1", advisor_rel: "+3±1" }
      failure:
        text: "Your advisor frowns: \"That's not even my area.\" Somehow that's the part that bothers them."
        effects: { sanity: "-2±1", advisor_rel: "-1" }
    - label: "Put it on a slide"
      text: "Your next lab-meeting talk opens with the fake paper. Everyone laughs, then three people check their own models."
      effects: { sanity: "+2±1", presenting: "+2±1", labmates_rel: "+2±1" }

- id: res_temperature_zero
  title: "Temperature Zero"
  category: research
  repeatable: true
  cooldown: 26
  when:
    project: { type: empirical, stage: [pilot, experiments] }
  text:
    - "You run the same prompt three times at temperature zero and get three different answers. Temperature zero, it turns out, is more of a mood."
  choices:
    - label: "Run it five times, report the spread"
      text: "You report a mean and standard deviation over five runs. It costs five times as much, and it's honest."
      effects: { energy: "-2±1", sanity: "-1", project.progress: "-3±1", project.quality.S: "+5±2" }
    - label: "Switch to a local model"
      check: { stat: coding, vs: 55, spread: 20 }
      success:
        text: "Same input, same output, every time. You didn't know you'd missed that so much."
        effects: { coding: "+2±1", sanity: "+3±1", project.progress: "-4±2", project.quality.S: "+4±2" }
      failure:
        text: "The local model is perfectly consistent, and consistently worse. You switch back."
        effects: { sanity: "-3±1", project.progress: "-5±2" }
    - label: "Fix the seed and hope"
      text: "There is no seed setting. You add one to your config anyway, for morale."
      effects: { sanity: "+2±1", project.quality.S: "-3±1" }

- id: res_retry_budget
  title: "Retry, Retry, Retry"
  category: research
  when:
    has_advisor: true
    project: { type: empirical, stage: [pilot, experiments] }
  text:
    - "You wake up to an email from billing. At 1 am your retry loop hit a rate limit, and retried, and retried. The lab's API budget for the month is gone."
  choices:
    - label: "Tell {advisor} right away"
      check: { stat: advisor_rel, vs: 45, spread: 20 }
      success:
        text: "\"Thanks for telling me first. It happens.\" Your advisor moves some money around."
        effects: { sanity: "+3±1", advisor_rel: "+3±1" }
      failure:
        text: "A long pause, then: \"Please write up what happened.\" You do, in great detail."
        effects: { sanity: "-4±2", advisor_rel: "-3±1", writing: "+1" }
    - label: "Develop on a smaller model"
      text: "Development moves to a tiny model that costs almost nothing. This month's results are rougher."
      effects: { sanity: "-2±1", project.progress: "-5±2", project.quality.S: "-2±1" }
    - label: "Write a budget guard"
      text: "You add a hard spending cap, an alert and a test for the retry loop. Nobody in the lab can do this again."
      effects: { energy: "-4±2", days: -1, sanity: "-2±1", coding: "+3±1", labmates_rel: "+2±1" }

- id: res_model_retired
  title: "End of Life"
  category: research
  when:
    project: { type: empirical, stage: [experiments, consolidation] }
  text:
    - "{biglab} announces that the model your paper evaluates will be retired next month. Soon, nobody will be able to reproduce a single number in it."
  choices:
    - label: "Rerun everything on its replacement"
      text: "A week of reruns shows the new model is better on average and worse on your examples, which is interesting."
      effects: { energy: "-6±2", days: -2, health: "-1", sanity: "-2±1", project.quality.S: "+4±2", project.quality.N: "+2±1" }
    - label: "Release your saved outputs"
      text: "You archive and release every prompt and response, so anyone can check your work after the model is gone."
      effects: { energy: "-2±1", citations: "+2±1", project.quality.S: "+4±2" }
    - label: "Switch to an open model"
      check: { stat: coding, vs: 55, spread: 20 }
      success:
        text: "Open weights never change, so your results will reproduce long after you graduate."
        effects: { coding: "+2±1", project.progress: "-6±2", project.quality.S: "+6±2" }
      failure:
        text: "The open model needs more GPUs than your lab owns. You fall back to saving your outputs."
        effects: { sanity: "-3±1", project.progress: "-5±2", project.quality.S: "+2±1" }

- id: res_safety_ankle
  title: "Graphic Content"
  category: research
  when:
    project: { type: [empirical, dataset], stage: [pilot, experiments, baselines] }
  text:
    - "The model refuses to summarize a clinical note about a sprained ankle, citing \"graphic content\". It refuses {roll:40-70} other notes too, mostly about knees."
  choices:
    - label: "Reword the prompt"
      text: "\"You are a helpful clinical assistant.\" It works for the ankle. The knees remain controversial."
      effects: { energy: "-2±1", project.progress: "+4±2", project.quality.S: "-1" }
    - label: "Use an open model"
      text: "The open model never refuses and makes more mistakes. You trade one problem for a more measurable one."
      effects: { coding: "+1", project.progress: "-3±1", project.quality.S: "+3±1" }
    - label: "Count refusals as a result"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "You make a table of refusal rates by body part. It's absurd, and everyone screenshots it."
        effects: { taste: "+1", citations: "+2±1", project.quality.N: "+5±2" }
      failure:
        text: "Refusal rates are already a well-known table. Yours is one more row."
        effects: { sanity: "-2±1", project.progress: "-2±1" }

- id: res_broken_json
  title: "40 Regular Expressions"
  category: research
  when:
    project: { type: empirical, stage: [pilot, experiments] }
  text:
    - "The model returns broken JSON {roll:2-4}% of the time. Your parser now has 40 regular expressions, and one of them is just a long sigh."
  choices:
    - label: "Use constrained decoding"
      check: { stat: coding, vs: 55, spread: 20 }
      success:
        text: "Valid JSON every time. You delete 40 regular expressions in one glorious commit."
        effects: { coding: "+3±1", sanity: "+4±2", project.progress: "+3±1" }
      failure:
        text: "Constrained decoding works, slowly. Your evaluation now takes three days."
        effects: { energy: "-3±1", coding: "+2±1", project.progress: "-4±2" }
    - label: "Retry until it's valid"
      text: "Every bad output gets another try. It works, and the API bill grows a little every night."
      effects: { sanity: "-2±1", project.progress: "+4±2" }
    - label: "Count failures as errors"
      text: "Broken JSON counts as wrong. Your scores drop a point, and nobody can say you hid anything."
      effects: { sanity: "+1", project.progress: "+2±1", project.quality.S: "+3±1" }

- id: res_raters_shorter
  title: "Shorter, Please"
  category: research
  when:
    project: { type: empirical, stage: [experiments, consolidation] }
  text:
    - "Your human raters prefer the baseline. You read their comments: \"shorter\", \"shorter\", \"got to the point\", \"shorter\"."
  choices:
    - label: "Control for length"
      text: "With length-matched pairs and a second round of ratings, your system wins, by a little, fairly."
      effects: { energy: "-5±2", days: -1, sanity: "-2±1", project.progress: "-3±1", project.quality.S: "+6±2" }
    - label: "Report it as a finding"
      text: "\"Raters prefer brevity\" isn't new, but your data shows exactly how much."
      effects: { writing: "+1", project.quality.S: "+3±1", project.quality.N: "-2±1" }
    - label: "Shorten your system's answers"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "Your system now says the same thing in half the words. The raters love it."
        effects: { project.progress: "+3±1", project.quality.S: "+3±1", project.quality.N: "+2±1" }
      failure:
        text: "Shorter, and now it leaves out the important part. The raters still prefer the baseline."
        effects: { sanity: "-3±1", project.progress: "-3±1" }

