- id: res_notebook_400
  title: "Cell 212"
  category: research
  when:
    project: { stage: [experiments, baselines, consolidation] }
  text:
    - "Your best result came from a notebook with 400 cells, run out of order over three weeks. Cell 212 depends on cell 388. You don't remember why."
  choices:
    - label: "Rewrite it as a clean script"
      text: "After a day of untangling, the script runs top to bottom, and the result holds, minus half a point."
      effects: { energy: "-3±1", days: -1, coding: "+3±1", project.quality.S: "+5±2" }
    - label: "Rerun it top to bottom and hope"
      check: { stat: coding, vs: 60, spread: 20 }
      success:
        text: "It runs and gives the same number. You vow never to touch that notebook again."
        effects: { sanity: "+4±2", project.progress: "+3±1" }
      failure:
        text: "Cell 17 throws an error that cell 388 was hiding. The best result is gone."
        effects: { sanity: "-6±2", project.progress: "-6±2" }
    - label: "Report the result you can reproduce"
      text: "The number you can reproduce is two points lower. It goes in the paper, and you stop worrying about cell 212."
      effects: { sanity: "+2±1", project.quality.S: "+3±1", project.quality.N: "-2±1" }

- id: res_checkpoint_commit
  title: "4 GB"
  category: research
  when:
    has_advisor: true
    project: { stage: [pilot, experiments, baselines, build] }
  text:
    - "You accidentally commit a 4 GB model checkpoint to the lab repo. Every labmate's next pull takes an hour. The lab chat has noticed."
  choices:
    - label: "Rewrite the history"
      check: { stat: coding, vs: 60, spread: 20 }
      success:
        text: "One careful force-push removes the checkpoint from history without losing anyone's work. The lab chat calls you a legend."
        effects: { coding: "+3±1", labmates_rel: "+2±1", sanity: "+2±1" }
      failure:
        text: "The rewrite works, and also eats {labmate}'s last two commits. They're recoverable, eventually."
        effects: { energy: "-3±1", sanity: "-4±2", labmates_rel: "-5±2" }
    - label: "Apologize in the lab chat, with donuts"
      text: "A dozen donuts and a sincere message. The pull still takes an hour, but now it comes with donuts."
      effects: { sanity: "-1", labmates_rel: "+3±1" }
    - label: "Ask {senior} for help"
      check: { stat: labmates_rel, vs: 45, spread: 15 }
      success:
        text: "{senior} fixes it in four minutes and admits the same thing happened to them in their first year."
        effects: { sanity: "+3±1", coding: "+2±1", labmates_rel: "+2±1" }
      failure:
        text: "{senior} fixes it, then tells the story at every lab meeting for a month."
        effects: { sanity: "-3±1", coding: "+1" }
