- id: res_legal_1
  title: "Legal Review"
  category: research
  rarity: uncommon
  arc: hospital_legal
  when:
    has_advisor: true
    project: { type: [study, system, dataset], stage: [design, build, guidelines, irb] }
  text:
    - "To share de-identified notes with you, the hospital needs a data-sharing agreement, reviewed by its legal team. The legal team, you learn, is two people."
  choices:
    - label: "Send it and wait"
      text: "You send the agreement with a friendly note. The auto-reply says reviews take \"four to six weeks\"."
      effects: { sanity: "-2±1", project.delay: 1 }
      schedule: { event: res_legal_2, in: [2, 3], chance: 1.0 }
    - label: "Use the university's template"
      check: { stat: knowledge, vs: 50, spread: 20 }
      success:
        text: "Their lawyers know the template by heart, and it's approved in a week. Someone clearly did this before you."
        effects: { sanity: "+4±2", knowledge: "+2±1" }
      failure:
        text: "They have 14 comments on the template, numbered and lettered. Some have sub-letters."
        effects: { sanity: "-3±1", project.delay: 1 }
        schedule: { event: res_legal_2, in: [2, 3], chance: 1.0 }
    - label: "Start on public data meanwhile"
      text: "You begin on a public dataset while the agreement crawls along. At least something is moving."
      effects: { energy: "-4±2", project.progress: "+4±2", project.quality.N: "-2±1" }
      schedule: { event: res_legal_2, in: [3, 4], chance: 1.0 }

- id: res_legal_2
  title: "Tracked Changes"
  category: research
  trigger: scheduled
  arc: hospital_legal
  when:
    project: { type: [study, system, dataset] }
  text:
    - "The agreement comes back with {roll:20-40} tracked changes. Most turn \"shall\" into \"will\". One, on page 9, gives the hospital the rights to your thesis."
  choices:
    - label: "Strike that one, accept the rest"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "On a short, polite call, they agree the thesis clause was \"just the template\". It's signed by Friday."
        effects: { sanity: "+5±2", presenting: "+1" }
      failure:
        text: "They counter your counter. A meeting is scheduled to plan the meeting about it."
        effects: { sanity: "-3±1", project.delay: 1 }
        schedule: { event: res_legal_3, in: [2, 3], chance: 1.0 }
    - label: "Let the lawyers talk to the lawyers"
      text: "The university's lawyers take over. You're cc'd on everything and understand none of it. A month later, it's signed."
      effects: { sanity: "-1", project.delay: 2 }
    - label: "Ask your clinical partner to push"
      requires: { flags_any: [clinical_partner] }
      tag: "Clinical partner"
      text: "One call from the head of their department, and the agreement is signed by Friday. You send a thank-you card."
      effects: { sanity: "+5±2", network: "+2±1" }

- id: res_legal_3
  title: "Round Three"
  category: research
  trigger: scheduled
  arc: hospital_legal
  when:
    project: { type: [study, system, dataset] }
  text:
    - "Round three of the data-sharing agreement. You now know what \"indemnification\" means, and you wish you didn't."
  choices:
    - label: "Sign their version, carefully"
      text: "You read it twice, and your thesis is still yours. One more week for signatures, and it's done."
      effects: { sanity: "+3±1", knowledge: "+1", project.delay: 1, project.quality.S: "+3±1" }
    - label: "Drop the hospital data"
      text: "You switch to public clinical notes. They're less realistic and come with no paperwork at all."
      effects: { sanity: "+5±2", project.quality.N: "-4±2" }

- id: res_compensation_out
  title: "The Last Gift Card"
  category: research
  when:
    has_advisor: true
    project: { type: study, stage: [recruiting, sessions] }
  text:
    - "Participant 14 signs for the last gift card. You need 28. The budget assumed $25 cards; you've been handing out $50."
  choices:
    - label: "Ask {advisor} for more"
      check: { stat: advisor_rel, vs: 50, spread: 20 }
      success:
        text: "Your advisor sighs, finds the money and asks you to check the next budget twice."
        effects: { sanity: "+2±1", advisor_rel: "-1" }
      failure:
        text: "\"We'll have to stop at 14.\" Your study just became a lot more qualitative."
        effects: { sanity: "-4±2", project.quality.S: "-4±2" }
    - label: "Apply for a small department grant"
      text: "You write two pages and a budget table. It's approved in three weeks, and you finally learn how budgets work."
      effects: { sanity: "-2±1", writing: "+2±1", project.delay: 1 }
    - label: "Halve the cards for the rest"
      text: "Recruiting slows a little. A reviewer may ask why half your participants got less."
      effects: { sanity: "+1", project.quality.S: "-2±1" }

