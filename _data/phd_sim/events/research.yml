# --- User studies ----------------------------------------------------------

- id: res_wizard_of_oz
  title: "Pay No Attention"
  category: research
  when:
    has_advisor: true
    project: { stage: [sessions, study] }
  text:
    - "It's a Wizard-of-Oz study, so the \"AI\" is you, typing from the next room for six sessions back to back. Participant 3 asks the AI if it's tired."
  choices:
    - label: "Type fast and stay in character"
      text: "By session six you type like a language model and feel like one. The data is great."
      effects: { energy: "-8±2", health: "-3±1", project.progress: "+8±3", project.quality.S: "+3±1" }
    - label: "Script canned replies"
      text: "Fifty prepared answers cover most questions. When they don't, the AI gets oddly vague."
      effects: { energy: "-3±1", project.progress: "+6±2", project.quality.S: "-3±1" }
    - label: "Take shifts with {labmate}"
      check: { stat: labmates_rel, vs: 50, spread: 15 }
      success:
        text: "You take three sessions each. One participant says the AI's personality changed halfway, which it did."
        effects: { energy: "-4±2", labmates_rel: "+2±1", project.progress: "+7±2" }
      failure:
        text: "{labmate} has a deadline. You type all six sessions yourself, a little resentfully."
        effects: { energy: "-8±2", health: "-2±1", sanity: "-2±1", project.progress: "+7±2" }

- id: res_sticky_notes
  title: "412 Sticky Notes"
  category: research
  when:
    project: { type: [study, system], stage: [design, build, analysis] }
  text:
    - "Your participatory design workshop produced 412 sticky notes, and every one needs a theme. One just says \"lunch?\"."
  choices:
    - label: "Affinity-map them on the lab wall"
      text: "You spend a weekend on a stepladder. The wall looks like a detective's corkboard, and the themes are excellent."
      effects: { energy: "-7±2", days: -2, health: "-2±1", project.quality.N: "+5±2", project.quality.S: "+3±1" }
    - label: "Photograph and code them on screen"
      text: "On screen the notes are searchable and somehow less inspiring. The themes come out tidy and a little flat."
      effects: { energy: "-4±2", project.progress: "+5±2", project.quality.N: "+1" }
    - label: "Ask the participants to vote on themes"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "Eight participants come back and sort the notes with you. Their themes beat yours."
        effects: { network: "+3±1", project.progress: "+3±1", project.quality.N: "+4±2", project.quality.S: "+4±2" }
      failure:
        text: "Two participants come back. They mostly vote for \"lunch?\"."
        effects: { sanity: "-3±1", project.progress: "+2±1" }

- id: res_not_what_i_meant
  title: "That's Not What I Meant"
  category: research
  when:
    project: { type: [study, system], stage: [analysis, consolidation] }
  text:
    - "You share your findings with a participant, as promised. They reply within the hour: \"That's not what I meant. At all.\" Your favorite theme is built on their quote."
  choices:
    - label: "Revise the theme"
      text: "After two days of rereading transcripts, the new theme is less striking and much more accurate."
      effects: { energy: "-4±2", days: -2, project.quality.S: "+6±2", project.quality.N: "-2±1", sanity: "-2±1" }
    - label: "Add their correction as a quote"
      text: "Their reply goes into the paper next to your reading, and a reviewer praises the paper as \"reflexive\"."
      effects: { writing: "+1", project.quality.S: "+3±1", project.quality.N: "+2±1" }
    - label: "Explain your reading to them"
      check: { stat: presenting, vs: 55, spread: 20 }
      success:
        text: "After a call, they agree: \"Okay, I did kind of mean that.\""
        effects: { presenting: "+2±1", sanity: "+3±1", project.quality.S: "+2±1" }
      failure:
        text: "The call ends with each of you more sure you're right."
        effects: { sanity: "-4±2" }

- id: res_pager_story
  title: "The Pager Saga"
  category: research
  repeatable: true
  cooldown: 26
  when:
    project: { stage: [sessions, study] }
  text:
    - "Twenty minutes in, your interviewee starts telling the story of the clinic's old pager system. It has villains and a twist, and it's nowhere on your interview guide."
  choices:
    - label: "Let them talk"
      text: "They talk about pagers for forty minutes, and somewhere in there is the best quote about workarounds you've ever heard."
      effects: { sanity: "+2±1", project.progress: "+2±1", project.quality.N: "+4±2" }
      tip: "Understanding Workflows"
    - label: "Steer back, politely"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "\"That's fascinating, and does it connect to...\" It does. You finish the guide on time."
        effects: { presenting: "+1", project.progress: "+5±2" }
      failure:
        text: "You steer back. They steer to the fax machine."
        effects: { sanity: "-2±1", project.progress: "+2±1" }
    - label: "Book a follow-up for the story"
      text: "The extra hour next week costs you an afternoon and gets you a friend in the clinic."
      effects: { days_next: -1, network: "+3±1", project.progress: "+4±2" }
      flag_set: [clinical_partner]

- id: res_audio_only
  title: "0 Bytes"
  category: research
  when:
    project: { stage: [sessions, study, analysis] }
  text:
    - "You open the screen recording of your best session, the one where everything clicked: 0 seconds, 0 bytes. The audio is fine."
  choices:
    - label: "Rebuild it from your notes"
      text: "You spend an evening stitching the audio and your notes together. It's mostly right, you think."
      effects: { energy: "-4±2", sanity: "-2±1", project.quality.N: "+2±1" }
    - label: "Ask the participant for a follow-up"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "They're happy to do it again, and even sharper the second time."
        effects: { days: -1, network: "+1", project.quality.S: "+3±1", project.quality.N: "+3±1" }
      failure:
        text: "They're away for a month. You make do with the audio."
        effects: { sanity: "-3±1" }
    - label: "Drop the session"
      text: "Your best session becomes one sentence in Limitations. It's the rigorous choice, and it stings a little."
      effects: { sanity: "-3±1", project.quality.S: "+2±1", project.quality.N: "-3±1" }

- id: res_manipulation_check
  title: "Can You Tell?"
  category: research
  when:
    project: { type: [study, system], stage: [sessions, study, analysis] }
  text:
    - "The manipulation check is in: participants can't tell the AI condition from the no-AI condition. Half think both had AI. A few think neither did."
  choices:
    - label: "Redesign the conditions"
      text: "After a new pilot and another round of sessions, the study tests what it says it does."
      effects: { energy: "-3±1", sanity: "-3±1", project.delay: 1, project.quality.S: "+7±2" }
    - label: "Reframe it as a finding"
      check: { stat: taste, vs: 55, spread: 20 }
      success:
        text: "You rewrite the framing around a new finding: people can't tell when AI is helping."
        effects: { taste: "+2±1", project.quality.N: "+6±2" }
      failure:
        text: "Reviewers will see a failed manipulation, and so do you. The reframe doesn't hold."
        effects: { sanity: "-4±2", project.quality.S: "-3±1" }
    - label: "Make the AI more visible"
      text: "You add a sparkle icon and the word \"AI\" in bold. Now everyone notices, and some notice too much."
      effects: { energy: "-2±1", project.progress: "+3±1", project.quality.S: "+3±1", project.quality.N: "-2±1" }

- id: res_attention_check
  title: "Too Clever"
  category: research
  when:
    has_advisor: true
    project: { type: [study, system], stage: [design, build] }
  text:
    - "You pilot your survey on {advisor}. Your attention check is so clever that {advisor} fails it, then argues for ten minutes that it was ambiguous."
  choices:
    - label: "Simplify it"
      text: "\"Select 'Strongly agree' for this item.\" It isn't clever, and your advisor passes it."
      effects: { sanity: "+1", advisor_rel: "+1", project.quality.S: "+3±1" }
    - label: "Keep it and call it rigor"
      text: "Rigor! It filters out bots and, apparently, professors. Your advisor will remember this."
      effects: { sanity: "+2±1", advisor_rel: "-3±1", project.quality.S: "+1" }
    - label: "Add a second, easier one"
      text: "Two checks: one for bots, one for humans. The survey grows by a page."
      effects: { energy: "-2±1", project.progress: "-2±1", project.quality.S: "+4±2" }

- id: res_counterbalance_23
  title: "Basically 24"
  category: research
  when:
    has_advisor: true
    project: { type: study, stage: [sessions, analysis] }
  text:
    - "Your counterbalanced design needs 24 participants, one for each order. You have 23. Participant 24 cancelled this morning, very apologetically."
  choices:
    - label: "Recruit one more"
      text: "One more flyer and one more week get you participant 24. The design is balanced again."
      effects: { sanity: "-1", project.delay: 1, project.quality.S: "+4±2" }
    - label: "Report the unbalanced order"
      text: "You admit it in one sentence in the method section. A reviewer will count, but you counted first."
      effects: { sanity: "+2±1", writing: "+1", project.quality.S: "-2±1" }
    - label: "Ask {advisor} if 23 is basically 24"
      check: { stat: advisor_rel, vs: 55, spread: 20 }
      success:
        text: "Your advisor laughs, then helps you rerun the analysis with order as a factor, and the result holds."
        effects: { sanity: "+3±1", advisor_rel: "+1", project.quality.S: "+2±1" }
      failure:
        text: "\"Is it?\" asks your advisor, and waits. You go and find participant 24."
        effects: { sanity: "-3±1", advisor_rel: "-1", project.delay: 1 }

- id: res_soup_recipe
  title: "Soup of the Day"
  category: research
  when:
    project: { stage: [sessions, study] }
  text:
    - "Mid-session, your study chatbot answers a clinician's question about discharge notes with a recipe for lentil soup. The clinician reads it carefully. \"This actually looks good.\""
  choices:
    - label: "Log it and move on"
      text: "A line in your notes: \"14:32, soup.\" The session goes on. Afterward, the clinician asks for the recipe."
      effects: { sanity: "+1", project.progress: "+3±1" }
    - label: "Pause and fix the prompt"
      text: "Ten minutes of frantic prompt editing while the participant waits. No more soup, for now."
      effects: { energy: "-3±1", sanity: "-2±1", project.progress: "-2±1", project.quality.S: "+3±1" }
    - label: "Make off-task replies a finding"
      check: { stat: taste, vs: 50, spread: 20 }
      success:
        text: "You find 11 more off-topic replies in the logs, enough for a section on trust."
        effects: { days: -1, taste: "+1", project.quality.N: "+5±2" }
      failure:
        text: "It's one soup. A finding needs more than one soup."
        effects: { days: -1, sanity: "-2±1" }

- id: res_thirty_seconds
  title: "Thirty Seconds"
  category: research
  when:
    project: { type: [study, system], stage: [design, build, study] }
  text:
    - "The clinicians like your tool, with one condition: it has to work in the 30 seconds between patients. Right now, logging in takes 40."
  choices:
    - label: "Redesign for 30 seconds"
      text: "You cut every screen you can. What's left fits in 30 seconds, with a few to spare."
      effects: { energy: "-5±2", days: -1, coding: "+2±1", project.progress: "-4±2", project.quality.S: "+4±2", project.quality.N: "+2±1" }
    - label: "Time how long it really takes"
      text: "You spend a day in the clinic with a stopwatch. The real gap is 22 seconds, and now you know where they go."
      effects: { energy: "-3±1", days: -1, knowledge: "+3±1", project.quality.S: "+4±2" }
      tip: "Understanding Workflows"
    - label: "Argue for a different moment"
      check: { stat: presenting, vs: 55, spread: 20 }
      success:
        text: "You propose a review at the end of the shift instead. They think it over and agree it's better."
        effects: { presenting: "+1", project.quality.N: "+4±2" }
      failure:
        text: "\"There is no other moment,\" they say, kindly."
        effects: { sanity: "-3±1", knowledge: "+1" }

- id: res_accessibility
  title: "Button, Button, Button"
  category: research
  when:
    project: { type: system, stage: [build, study] }
  text:
    - "A quick accessibility check before the study: the screen reader announces all 23 buttons in your prototype as \"button\"."
  choices:
    - label: "Fix it all before the study"
      text: "You fix labels, focus order and contrast. It takes a week, and the prototype is better for everyone."
      effects: { energy: "-3±1", coding: "+2±1", project.delay: 1, project.quality.S: "+5±2" }
    - label: "Fix the worst three issues"
      text: "The main flow works now. The settings page remains a mystery, read aloud."
      effects: { energy: "-2±1", project.progress: "-2±1", project.quality.S: "+2±1" }
    - label: "Note it as a limitation"
      text: "It gets one sentence in Limitations, which is accurate and a little uncomfortable to type."
      effects: { sanity: "-1", project.quality.S: "-3±1" }

- id: res_eleven_implications
  title: "Eleven Implications"
  category: research
  when:
    has_advisor: true
    project: { type: [study, system], stage: consolidation }
  text:
    - "Your discussion section lists 11 design implications. {advisor} reads it and leaves one comment: \"Three. Readers remember three.\""
  choices:
    - label: "Keep the three strongest"
      text: "Eight implications move to a file called later.md. The section is short and sharp."
      effects: { sanity: "-1", taste: "+1", project.quality.C: "+6±2" }
      tip: "Implications and Venue"
