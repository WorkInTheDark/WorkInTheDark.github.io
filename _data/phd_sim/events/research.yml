- id: res_irb_amendment
  title: "Anything Else?"
  category: research
  when:
    project: { stage: [recruiting, sessions, study] }
  text:
    - "You want to add one survey question: \"Anything else?\" The IRB says that needs an amendment, a revised protocol and a new consent form."
  choices:
    - label: "File the amendment"
      text: "You file eleven pages for two words. It's approved in three weeks with no changes, and you're almost disappointed."
      effects: { sanity: "-3±1", project.delay: 1, project.quality.S: "+2±1" }
    - label: "Fix four other things while you're at it"
      text: "If you're amending anyway, you fix everything that bugged you. It's slower, and the study is better for it."
      effects: { energy: "-3±1", knowledge: "+2±1", project.delay: 2, project.quality.S: "+6±2", sanity: "-2±1" }
    - label: "Drop the question"
      text: "The survey stays as approved. You'll always wonder what \"else\" there was."
      effects: { sanity: "+1", project.quality.N: "-2±1" }

- id: res_collaborator_silent
  title: "Let's Do This!"
  category: research
  when:
    has_advisor: true
    project: { stage: [idea, lit, design, build] }
  text:
    - "A clinician you met at a workshop loved your idea for {project}: \"Let's do this!\" That was {roll:7-9} weeks ago. Your last three emails have no replies."
  choices:
    - label: "Send one short, friendly nudge"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "\"So sorry, flu season! Thursday?\" They're back, and still excited."
        effects: { network: "+3±1", project.progress: "+5±2", sanity: "+2±1" }
        flag_set: [clinical_partner]
      failure:
        text: "Silence again. Their name goes on a list you call \"someday\"."
        effects: { sanity: "-3±1" }
    - label: "Catch them after a hospital talk"
      text: "You sit through an hour on billing codes, then catch them at the door. They apologize and book a meeting on the spot."
      effects: { energy: "-4±2", days: -1, network: "+4±2", project.progress: "+3±1" }
      flag_set: [clinical_partner]
    - label: "Move on without them"
      text: "You redesign {project} to need less clinical input. It's more doable and a little less exciting."
      effects: { sanity: "+2±1", project.progress: "+3±1", project.quality.N: "-3±1" }

- id: res_flyer_one
  title: "One Participant"
  category: research
  when:
    has_advisor: true
    project: { type: study, stage: recruiting }
  text:
    - "Two weeks of flyers on every board on campus bring in exactly one participant: {advisor}'s friend from grad school, who says {advisor} \"insisted\"."
  choices:
    - label: "Run the session anyway"
      text: "A great participant, full of stories about your advisor at your age. You get data and gossip."
      effects: { sanity: "+3±1", project.quality.S: "-1" }
    - label: "Post in online communities"
      check: { stat: network, vs: 45, spread: 20 }
      success:
        text: "One post in the right forum and your calendar fills up in two days."
        effects: { network: "+2±1", sanity: "+2±1", project.delay: -1 }
      failure:
        text: "Forty replies, all from accounts selling followers."
        effects: { sanity: "-3±1" }
    - label: "Ask clinics to forward your email"
      text: "Slower than a post, but every reply comes from exactly the people you need."
      effects: { energy: "-3±1", project.delay: 1, project.quality.S: "+4±2" }

- id: res_kappa_02
  title: "Kappa 0.2"
  category: research
  when:
    has_advisor: true
    project: { stage: analysis }
  text:
    - "You and {labmate} coded the same ten interviews. Cohen's kappa: 0.2. You disagree on what counts as \"trust\", \"workaround\" and, somehow, \"the\"."
  choices:
    - label: "Reconcile it, code by code"
      text: "Six hours and two pizzas later, you have one shared codebook and a kappa of 0.71. You're still friends, mostly."
      effects: { energy: "-6±2", days: -1, labmates_rel: "+2±1", project.quality.S: "+6±2", health: "-1", sanity: "-2±1" }
      tip: "How to Communicate"
    - label: "Switch to consensus coding"
      text: "No kappa, just discussion until you agree. Some reviewers will frown; others won't notice."
      effects: { sanity: "+1", project.progress: "+3±1", project.quality.S: "+2±1" }
    - label: "Rewrite the codebook first"
      check: { stat: writing, vs: 50, spread: 20 }
      success:
        text: "Every code gets a clear definition and an example. Round two hits 0.68 without a single argument."
        effects: { days: -1, writing: "+2±1", project.quality.S: "+5±2" }
      failure:
        text: "The new codebook is longer and just as vague. Kappa rises to 0.24, which is technically progress."
        effects: { days: -1, sanity: "-4±2" }

- id: res_think_aloud_quiet
  title: "Thinking, Not Aloud"
  category: research
  repeatable: true
  cooldown: 13
  when:
    project: { stage: [sessions, study] }
  text:
    - "Five minutes into the think-aloud, your participant goes quiet. For thirty minutes they click, frown and click again, without a word."
  choices:
    - label: "Prompt gently: \"What are you thinking?\""
      check: { stat: presenting, vs: 45, spread: 20 }
      success:
        text: "\"Oh! Sorry. I was thinking this button is lying to me.\" After that, they don't stop talking."
        effects: { presenting: "+1", project.progress: "+5±2", project.quality.N: "+2±1" }
      failure:
        text: "\"Nothing much.\" They go quiet again, now slightly self-conscious."
        effects: { sanity: "-2±1", project.progress: "+2±1" }
    - label: "Let them work, ask after"
      text: "A follow-up interview fills in some gaps. Participants remember being much less confused than they looked."
      effects: { project.progress: "+3±1", project.quality.S: "-2±1" }
    - label: "Narrate the recording tonight"
      text: "You narrate their clicks yourself from the screen recording. It's tedious, and it tells you more than you expected."
      effects: { energy: "-4±2", knowledge: "+2±1", project.quality.S: "+3±1" }

- id: res_keep_prototype
  title: "Can I Keep It?"
  category: research
  when:
    project: { type: system, stage: [study, analysis] }
  text:
    - "At the end of the session, a participant asks if they can keep using your prototype. \"It saves me twenty minutes a day.\" Your prototype is held together with tape."
  choices:
    - label: "Say yes and keep it running"
      text: "You fix the worst bugs and answer their emails. Their real-world use becomes the best part of the paper."
      effects: { energy: "-5±2", days_next: -1, coding: "+2±1", project.quality.N: "+5±2", sanity: "+2±1" }
    - label: "Add a field deployment"
      text: "It takes an IRB amendment and a month of real use. The paper gets much stronger, and much later."
      effects: { sanity: "-2±1", project.delay: 2, project.quality.S: "+7±2" }
    - label: "Thank them, but say no"
      text: "They're disappointed, and you're flattered. Their quote goes on a slide for your next talk."
      effects: { sanity: "+4±2", presenting: "+1" }

- id: res_clinician_first_author
  title: "Who Goes First"
  category: research
  when:
    has_advisor: true
    flags_any: [clinical_partner]
    project: { stage: [analysis, consolidation] }
  text:
    - "Your clinical collaborator reads the {project} draft: \"Great work! In medicine, the person with the clinical insight is first author. I assume that's me?\""
  choices:
    - label: "Explain how CS authorship works"
      check: { stat: presenting, vs: 50, spread: 20 }
      success:
        text: "You explain kindly, with examples. They agree to be last author, the senior spot, and seem pleased with it."
        effects: { sanity: "+2±1", network: "+2±1", presenting: "+1" }
      failure:
        text: "They're polite and unconvinced. The thread grows to 31 emails."
        effects: { sanity: "-5±2", network: "-2±1" }
    - label: "Ask {advisor} to handle it"
      check: { stat: advisor_rel, vs: 50, spread: 20 }
      success:
        text: "Your advisor and theirs talk for ten minutes. You stay first author. Nobody tells you what was said."
        effects: { sanity: "+3±1", advisor_rel: "+1" }
      failure:
        text: "Your advisor proposes co-first authorship and a footnote. The clinician takes it, and you try to be gracious."
        effects: { sanity: "-2±1", network: "+2±1" }
    - label: "Offer co-first authorship"
      text: "Two asterisks and a footnote. Everyone's happy, and the clinic starts sending you participants."
      effects: { sanity: "+1", network: "+4±2", project.quality.S: "+2±1" }

